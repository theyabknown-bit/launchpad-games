<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🔢 Number Crunch Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.status-bar .stat{color:#8899aa;font-size:.9rem}
.status-bar .stat span{color:#d0e8f0;font-weight:700}
.problem-area{font-size:3rem;font-weight:700;margin:20px 0;color:#d0e8f0;text-shadow:0 0 30px rgba(79,195,247,0.1)}
.input-area{display:flex;gap:10px;justify-content:center;margin:15px 0}
.input-area input{padding:12px 20px;border-radius:12px;border:2px solid rgba(79,195,247,0.1);background:rgba(0,0,0,0.3);color:#d0e8f0;font-size:1.5rem;width:120px;text-align:center}
.input-area button{padding:12px 20px;border-radius:12px;border:none;background:#4fc3f7;color:#0b1a26;font-weight:700;cursor:pointer}
.timer-bar{width:100%;height:6px;background:rgba(255,255,255,0.05);border-radius:3px;margin:10px 0;overflow:hidden}
.timer-bar .fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#7cf5b0);border-radius:3px;transition:width .1s linear;width:100%}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.difficulty-selector{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.difficulty-selector button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);font-size:.8rem;padding:6px 16px}
.difficulty-selector button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7}
#message{min-height:2rem;font-size:1rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🔢 Number Crunch Pro</h1>
<div class="difficulty-selector"><button data-diff="easy">Easy</button><button data-diff="medium" class="active">Medium</button><button data-diff="hard">Hard</button></div>
<div class="status-bar"><div class="stat">🏆 Score: <span id="score">0</span></div><div class="stat">🏅 Best: <span id="bestScore">-</span></div><div class="stat">🔥 Combo: <span id="combo">0</span>x</div><div class="stat">✅ Correct: <span id="correct">0</span></div></div>
<div class="timer-bar"><div class="fill" id="timerFill"></div></div>
<div class="problem-area" id="problem"></div>
<div class="input-area"><input type="number" id="answerInput" placeholder="?" autofocus><button onclick="submitAnswer()"><i class="fas fa-arrow-right"></i> Go</button></div>
<div id="message">🔢 Click Start to begin!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),comboEl=document.getElementById('combo'),correctEl=document.getElementById('correct'),problemEl=document.getElementById('problem'),input=document.getElementById('answerInput'),timerFill=document.getElementById('timerFill'),msgEl=document.getElementById('message');
let score=0,bestScore=0,combo=0,correct=0,diff='medium',gameActive=!1,paused=!1,timerId=null,timeLeft=30,maxTime=30,currentAnswer=0;
(function load(){try{let s=JSON.parse(localStorage.getItem('numbercrunch_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';let d=localStorage.getItem('numbercrunch_difficulty')||'medium';diff=d;document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.classList.toggle('active',b.dataset.diff===diff)})}catch(e){}})();
function saveBest(){if(score>bestScore){bestScore=score;let s=JSON.parse(localStorage.getItem('numbercrunch_best')||'{}');s[diff]=score;localStorage.setItem('numbercrunch_best',JSON.stringify(s));bestEl.textContent=score}}
function getProblem(){let ops,range;if(diff==='easy'){ops=['+','-'];range=10}else if(diff==='medium'){ops=['+','-','*'];range=20}else{ops=['+','-','*','/'];range=50}let a=Math.floor(Math.random()*range)+1;let b=Math.floor(Math.random()*range)+1;let op=ops[Math.floor(Math.random()*ops.length)];let ans;if(op==='+')ans=a+b;else if(op==='-'){if(a<b)[a,b]=[b,a];ans=a-b}else if(op==='*')ans=a*b;else{do{b=Math.floor(Math.random()*range)+1}while(a%b!==0||b===0);ans=a/b}return{a,b,op,ans}}
function newProblem(){let p=getProblem();currentAnswer=p.ans;problemEl.textContent=p.a+' '+p.op+' '+p.b+' = ?';input.value='';input.focus()}
function startGame(){score=0;combo=0;correct=0;timeLeft=maxTime;gameActive=!0;paused=!1;document.getElementById('pauseLabel').textContent='Pause';scoreEl.textContent=score;comboEl.textContent=combo;correctEl.textContent=correct;timerFill.style.width='100%';msgEl.textContent='🔢 Solve the problems!';input.disabled=!1;newProblem();if(timerId)clearInterval(timerId);timerId=setInterval(()=>{if(!paused){timeLeft--;timerFill.style.width=(timeLeft/maxTime*100)+'%';if(timeLeft<=0){gameActive=!1;msgEl.textContent='⏰ Time\'s up! Score: '+score;playSound('gameover');saveBest();input.disabled=!0}}},1000)}
function submitAnswer(){if(!gameActive||paused||input.value.trim()==='')return;let user=parseInt(input.value.trim());if(user===currentAnswer){combo++;score+=10*combo;correct++;scoreEl.textContent=score;comboEl.textContent=combo;correctEl.textContent=correct;playSound('correct');msgEl.textContent='✅ Correct! +'+(10*combo)+' points!';saveBest();newProblem()}else{playSound('wrong');msgEl.textContent='❌ Wrong! Answer was '+currentAnswer;combo=0;comboEl.textContent=combo;setTimeout(newProblem,400)}input.value=''}
input.addEventListener('keydown',e=>{if(e.key==='Enter')submitAnswer()});
function togglePause(){if(!gameActive)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'🔢 Keep solving!';if(paused&&timerId)clearInterval(timerId);else if(!paused){timerId=setInterval(()=>{if(!paused){timeLeft--;timerFill.style.width=(timeLeft/maxTime*100)+'%';if(timeLeft<=0){gameActive=!1;msgEl.textContent='⏰ Time\'s up! Score: '+score;playSound('gameover');saveBest();input.disabled=!0}}},1000)}}
function resetGame(){if(timerId)clearInterval(timerId);gameActive=!1;paused=!1;input.disabled=!0;input.value='';problemEl.textContent='?';score=0;combo=0;correct=0;scoreEl.textContent=score;comboEl.textContent=combo;correctEl.textContent=correct;timerFill.style.width='100%';msgEl.textContent='🔢 Click Start to begin!';document.getElementById('pauseLabel').textContent='Pause'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='correct'){o.frequency.value=800;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=1000},80);o.stop(c.currentTime+.15)}else if(type==='wrong'){o.frequency.value=300;g.gain.value=.06;o.start();o.stop(c.currentTime+.15)}else if(type==='gameover'){o.frequency.value=400;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=300},200);o.stop(c.currentTime+.4)}}catch(e){}}
document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.difficulty-selector button').forEach(x=>x.classList.remove('active'));this.classList.add('active');diff=this.dataset.diff;localStorage.setItem('numbercrunch_difficulty',diff);let s=JSON.parse(localStorage.getItem('numbercrunch_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';resetGame()})});
resetGame();console.log('🔢 Number Crunch Pro loaded');
</script></body></html>
