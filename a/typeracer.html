<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Racer · Speed Typing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e121a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(18,28,40,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid rgba(100,200,255,0.12);
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; margin-bottom: 0.3rem; }
    h1 i { color: #7fc9ff; margin-right: 10px; }
    .back { display: inline-block; margin-bottom: 1.2rem; color: #b0d4f0; text-decoration: none; background: #1a3045; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #2a5a7a; font-size: 0.9rem; }
    .back:hover { background: #2a4a6a; }
    .word-display { background: #0f172a; border-radius: 1.5rem; padding: 2rem; margin: 1.2rem 0; border: 2px solid #1e3347; }
    .word { font-size: 3.5rem; font-weight: 700; color: #f0eaff; letter-spacing: 4px; font-family: 'Courier New', monospace; }
    .word .char { transition: 0.1s; }
    .word .char.correct { color: #7cf5b0; }
    .word .char.wrong { color: #ff7a7a; background: #4a1a1a; border-radius: 4px; }
    .word .char.current { border-bottom: 3px solid #f5c87c; }
    .stats { display: flex; justify-content: space-between; color: #9bbfd9; margin-top: 1.2rem; font-weight: 500; flex-wrap: wrap; gap: 0.8rem; }
    .stats span i { margin-right: 6px; }
    .input-area { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; margin-top: 0.5rem; }
    #wordInput { background: #0a121a; border: 2px solid #1e3347; padding: 0.8rem 1.5rem; border-radius: 60px; font-size: 1.2rem; color: white; width: 280px; text-align: center; outline: none; }
    #wordInput:focus { border-color: #7fc9ff; box-shadow: 0 0 20px rgba(127,201,255,0.1); }
    .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.8rem 2rem; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .btn:hover { background: #2a5a7a; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .message { margin-top: 1rem; padding: 0.7rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 50px; border-left: 4px solid #7fc9ff; }
    .message i { margin-right: 8px; }
    .game-over { color: #ff7a7a; border-color: #ff7a7a; }
    .win { color: #7cf5b0; border-color: #7cf5b0; }
    @media (max-width: 500px) { .word { font-size: 2.5rem; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-keyboard"></i> Type Racer</h1>
  <div class="word-display">
    <div class="word" id="wordDisplay"></div>
  </div>
  <div class="stats">
    <span><i class="fas fa-star"></i> score: <span id="scoreDisplay">0</span></span>
    <span><i class="fas fa-clock"></i> time: <span id="timerDisplay">30</span>s</span>
    <span><i class="fas fa-bolt"></i> wpm: <span id="wpmDisplay">0</span></span>
  </div>
  <div class="input-area">
    <input type="text" id="wordInput" placeholder="type the word..." autofocus>
    <button class="btn" id="submitBtn"><i class="fas fa-arrow-right"></i> submit</button>
  </div>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> type the word and hit enter</div>
</div>
<script>
  const WORDS = ['CODE','FAST','TYPE','GAME','WORD','BOLT','STAR','FIRE','MIND','SPEED','QUIZ','JUMP','RUSH','CLICK','ZONE','MAX','GOAL','PLAY','WIN','CORE','POWER','RACER','KEY','TIME','FAST','NINJA','GHOST','BRAIN','SMART','FOCUS','SPRINT','DASH','FLASH','STORM','BLAZE'];
  let currentWord = '', score = 0, timeLeft = 30, gameActive = false, timerInterval = null, charIndex = 0;
  const wordDisplay = document.getElementById('wordDisplay'), wordInput = document.getElementById('wordInput'), scoreDisplay = document.getElementById('scoreDisplay'), timerDisplay = document.getElementById('timerDisplay'), wpmDisplay = document.getElementById('wpmDisplay'), messageBox = document.getElementById('messageBox');
  function getRandomWord() { return WORDS[Math.floor(Math.random()*WORDS.length)]; }
  function renderWord() {
    wordDisplay.innerHTML = currentWord.split('').map((c,i) => `<span class="char ${i<charIndex?'correct':i===charIndex?'current':''}">${c}</span>`).join('');
  }
  function newWord() {
    currentWord = getRandomWord(); charIndex = 0; wordInput.value = ''; renderWord(); wordInput.focus();
  }
  function updateUI() { scoreDisplay.textContent = score; timerDisplay.textContent = timeLeft; }
  function endGame(win=false) {
    gameActive = false; if(timerInterval) clearInterval(timerInterval); wordInput.disabled=true;
    messageBox.innerHTML = win ? `<i class="fas fa-trophy"></i> 🎉 YOU WIN! score: ${score}` : `<i class="fas fa-times-circle"></i> ⏰ time\'s up! score: ${score}`;
    messageBox.className = 'message '+(win?'win':'game-over');
  }
  function startGame() {
    score=0; timeLeft=30; gameActive=true; wordInput.disabled=false; updateUI();
    messageBox.innerHTML='<i class="fas fa-play"></i> type fast!'; messageBox.className='message';
    newWord(); if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => { timeLeft--; timerDisplay.textContent=timeLeft; if(timeLeft<=0) endGame(false); }, 1000);
  }
  function handleSubmit() {
    if(!gameActive) { startGame(); return; }
    const typed = wordInput.value.trim().toUpperCase();
    if(typed === '') { messageBox.innerHTML='<i class="fas fa-exclamation-triangle"></i> type something!'; return; }
    if(typed === currentWord) { score += 10 + Math.floor(timeLeft/3); newWord(); messageBox.innerHTML=`<i class="fas fa-check-circle" style="color:#7cf5b0;"></i> correct! +${10+Math.floor(timeLeft/3)} pts`; updateUI(); if(score>=100) endGame(true); }
    else { messageBox.innerHTML=`<i class="fas fa-times-circle" style="color:#ff7a7a;"></i> wrong! it was "${currentWord}"`; setTimeout(()=>newWord(),800); }
  }
  wordInput.addEventListener('keydown', (e) => { if(e.key==='Enter') { e.preventDefault(); handleSubmit(); } });
  document.getElementById('submitBtn').addEventListener('click', handleSubmit);
  startGame();
</script>
</body>
</html>
