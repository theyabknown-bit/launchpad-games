<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Tap · speed test</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e0a12;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(18,14,30,0.9);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #b58a4a;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; margin-bottom: 0.3rem; }
    h1 i { color: #f5c87c; margin-right: 10px; }
    .back { display: inline-block; margin-bottom: 1.2rem; color: #d0c0a0; text-decoration: none; background: #2a1f1a; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #7a5a3a; font-size: 0.9rem; }
    .back:hover { background: #3f2f25; }
    .tap-area {
      background: #14101a;
      border-radius: 1.5rem;
      padding: 2rem;
      margin: 1.2rem 0;
      border: 2px solid #3a2a1a;
      cursor: pointer;
      user-select: none;
      transition: 0.1s;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .tap-area.waiting { background: #1a1420; border-color: #5a4a3a; }
    .tap-area.ready { background: #1a2a1a; border-color: #7a5a2a; }
    .tap-area.go { background: #1a2a2a; border-color: #7af5c0; box-shadow: 0 0 40px rgba(122,245,192,0.15); }
    .tap-area .big-text { font-size: 3.5rem; font-weight: 700; color: #f0e8d0; }
    .tap-area .sub-text { color: #b0a090; font-size: 1.2rem; margin-top: 0.3rem; }
    .stats { display: flex; justify-content: space-between; color: #d0c0a0; margin-top: 1.2rem; font-weight: 500; flex-wrap: wrap; gap: 0.8rem; }
    .stats span i { margin-right: 6px; }
    .message { margin-top: 1rem; padding: 0.7rem; border-radius: 1rem; background: #14101a; color: #d4caff; min-height: 50px; border-left: 4px solid #f5c87c; }
    .message i { margin-right: 8px; }
    .btn { background: #3a2a1a; border: none; padding: 0.6rem 1.8rem; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; border: 1px solid #7a5a3a; transition: 0.15s; margin-top: 0.5rem; }
    .btn:hover { background: #5a3f2a; }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-hand-pointer"></i> Reaction Tap</h1>
  <div class="tap-area" id="tapArea">
    <div class="big-text" id="tapText">👆</div>
    <div class="sub-text" id="tapSub">click to start</div>
  </div>
  <div class="stats">
    <span><i class="fas fa-bolt"></i> taps: <span id="tapCount">0</span></span>
    <span><i class="fas fa-clock"></i> avg: <span id="avgDisplay">—</span>ms</span>
    <span><i class="fas fa-star"></i> best: <span id="bestDisplay">—</span></span>
  </div>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> tap when it turns green</div>
  <button class="btn" id="resetBtn"><i class="fas fa-rotate"></i> restart</button>
</div>
<script>
  const tapArea = document.getElementById('tapArea');
  const tapText = document.getElementById('tapText');
  const tapSub = document.getElementById('tapSub');
  const tapCountDisplay = document.getElementById('tapCount');
  const avgDisplay = document.getElementById('avgDisplay');
  const bestDisplay = document.getElementById('bestDisplay');
  const messageBox = document.getElementById('messageBox');

  let state = 'waiting'; // waiting | ready | go
  let startTime = 0;
  let times = [];
  let taps = 0;
  let best = Infinity;
  let timeoutId = null;
  let isWaitingForTap = false;

  function updateStats() {
    tapCountDisplay.textContent = taps;
    if (times.length > 0) {
      const avg = times.reduce((a,b) => a+b, 0) / times.length;
      avgDisplay.textContent = Math.round(avg);
    } else { avgDisplay.textContent = '—'; }
    bestDisplay.textContent = best === Infinity ? '—' : best;
  }

  function setState(newState) {
    state = newState;
    tapArea.className = 'tap-area';
    if (state === 'waiting') {
      tapArea.classList.add('waiting');
      tapText.textContent = '👆';
      tapSub.textContent = 'click to start';
    } else if (state === 'ready') {
      tapArea.classList.add('ready');
      tapText.textContent = '⏳';
      tapSub.textContent = 'wait for green...';
    } else if (state === 'go') {
      tapArea.classList.add('go');
      tapText.textContent = '🔥 TAP!';
      tapSub.textContent = 'now!';
    }
  }

  function startRound() {
    if (timeoutId) clearTimeout(timeoutId);
    setState('ready');
    const delay = 600 + Math.random() * 1400;
    timeoutId = setTimeout(() => {
      if (state === 'ready') {
        setState('go');
        startTime = performance.now();
        isWaitingForTap = true;
        messageBox.innerHTML = '<i class="fas fa-bolt" style="color:#7af5c0;"></i> TAP NOW!';
      }
    }, delay);
  }

  function handleTap() {
    if (state === 'waiting') {
      // start the game
      taps = 0;
      times = [];
      best = Infinity;
      updateStats();
      messageBox.innerHTML = '<i class="fas fa-play"></i> tap when it turns green!';
      startRound();
      return;
    }

    if (state === 'ready') {
      // tapped too early
      if (timeoutId) clearTimeout(timeoutId);
      messageBox.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#ff7a7a;"></i> too early! wait for green.';
      setState('waiting');
      tapSub.textContent = 'click to try again';
      isWaitingForTap = false;
      return;
    }

    if (state === 'go' && isWaitingForTap) {
      const reaction = Math.round(performance.now() - startTime);
      times.push(reaction);
      if (reaction < best) best = reaction;
      taps++;
      updateStats();
      messageBox.innerHTML = `<i class="fas fa-check-circle" style="color:#7af5c0;"></i> ${reaction}ms`;
      isWaitingForTap = false;
      setState('waiting');
      tapSub.textContent = 'click for next';
      // auto start next round after a short pause
      setTimeout(() => {
        if (state === 'waiting') {
          startRound();
        }
      }, 400);
    }
  }

  function resetGame() {
    if (timeoutId) clearTimeout(timeoutId);
    taps = 0;
    times = [];
    best = Infinity;
    isWaitingForTap = false;
    updateStats();
    setState('waiting');
    tapSub.textContent = 'click to start';
    messageBox.innerHTML = '<i class="fas fa-rotate"></i> reset';
  }

  tapArea.addEventListener('click', handleTap);
  document.getElementById('resetBtn').addEventListener('click', resetGame);

  setState('waiting');
  tapSub.textContent = 'click to start';
</script>
</body>
</html>
