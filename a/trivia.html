<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Trivia Quiz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.question{font-size:1.2rem;padding:20px;background:#1a3344;border-radius:12px;border:2px solid #2a4a5e;min-height:80px;margin:15px 0;display:flex;align-items:center;justify-content:center;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.option{background:#1a3344;padding:15px;border-radius:10px;border:2px solid #2a4a5e;cursor:pointer;transition:0.2s;touch-action:manipulation;}
.option:hover{background:#2a4a5e;border-color:#4fc3f7;}
.option.correct{background:#1a4a3a;border-color:#7cf5b0;}
.option.wrong{background:#3a1a1a;border-color:#ff6b6b;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-brain" style="color:#4fc3f7;"></i> Trivia Quiz</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="total">0</span><span class="label">Total</span></div>
    </div>
    <div class="question" id="question">Loading...</div>
    <div class="options" id="options"></div>
    <button class="btn" id="nextBtn">Next Question</button>
    <div class="message" id="message">🎯 Test your knowledge!</div>
</div>
<script>
    // ============================================================
    // FIXED SOUND SYSTEM - WORKS ON FIRST CLICK
    // ============================================================
    let soundEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;

    function unlockAudio() {
        if (audioUnlocked) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioUnlocked = true;
            console.log('🔊 Audio unlocked!');
        } catch(e) { console.log('Audio error:', e); }
    }

    // Unlock audio on any click
    document.addEventListener('click', unlockAudio, { once: false });
    document.addEventListener('touchstart', unlockAudio, { once: false });
    document.addEventListener('keydown', unlockAudio, { once: false });

    function getAudioCtx() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playTone(frequency, duration = 150, type = 'sine') {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration / 1000);
        } catch(e) { console.log('Play error:', e); }
    }

    function playClick() { playTone(600, 80); }
    function playWin() { 
        playTone(523, 150); 
        setTimeout(() => playTone(659, 150), 150); 
        setTimeout(() => playTone(784, 200), 300); 
    }
    function playLose() { 
        playTone(300, 200); 
        setTimeout(() => playTone(200, 300), 200); 
    }
    function playCorrect() { playTone(800, 100); }
    function playWrong() { playTone(250, 200); }
    function playLevelUp() { 
        playTone(440, 100); 
        setTimeout(() => playTone(523, 100), 100); 
        setTimeout(() => playTone(659, 150), 200); 
    }
const QUESTIONS=[
    {q:'What is the largest planet in our solar system?',options:['Earth','Jupiter','Saturn','Neptune'],correct:1},
    {q:'What is the chemical symbol for water?',options:['H2O','CO2','NaCl','O2'],correct:0},
    {q:'How many planets are in our solar system?',options:['7','8','9','10'],correct:1},
    {q:'What is the speed of light approx?',options:['300,000 km/s','150,000 km/s','600,000 km/s','100,000 km/s'],correct:0},
    {q:'What is the largest ocean on Earth?',options:['Atlantic','Indian','Pacific','Arctic'],correct:2},
    {q:'What is the smallest country in the world?',options:['Monaco','Vatican City','San Marino','Liechtenstein'],correct:1},
    {q:'What is the tallest mountain in the world?',options:['K2','Everest','Kilimanjaro','Denali'],correct:1},
    {q:'What is the fastest land animal?',options:['Lion','Cheetah','Horse','Gazelle'],correct:1},
    {q:'What year did the Titanic sink?',options:['1910','1911','1912','1913'],correct:2},
    {q:'What is the main ingredient in sushi?',options:['Rice','Seaweed','Fish','Vinegar'],correct:0}
];
let currentIndex=0,score=0,total=0;

const questionEl=document.getElementById('question'),optionsEl=document.getElementById('options');
const scoreEl=document.getElementById('score'),totalEl=document.getElementById('total');
const msg=document.getElementById('message');

function loadQuestion(){
    if(currentIndex>=QUESTIONS.length){
        questionEl.textContent='🎉 Complete! Score: '+score+'/'+total;
        optionsEl.innerHTML='';
        document.getElementById('nextBtn').style.display='none';
        msg.textContent='Great job!';
        return;
    }
    const q=QUESTIONS[currentIndex];
    questionEl.textContent=q.q;
    optionsEl.innerHTML='';
    q.options.forEach((opt,idx)=>{
        const div=document.createElement('div');
        div.className='option';
        div.textContent=opt;
        div.addEventListener('click',()=>selectAnswer(idx));
        optionsEl.appendChild(div);
    });
    document.getElementById('nextBtn').style.display='none';
    msg.textContent='🤔 Choose an answer!';
    total++;
    totalEl.textContent=total;
}

function selectAnswer(idx){
    const q=QUESTIONS[currentIndex];
    const options=optionsEl.querySelectorAll('.option');
    options.forEach((el,i)=>{
        el.style.pointerEvents='none';
        if(i===q.correct)el.classList.add('correct');
        else if(i===idx&&idx!==q.correct)el.classList.add('wrong');
    });
    if(idx===q.correct){score++;scoreEl.textContent=score;msg.textContent='✅ Correct!';}
    else msg.textContent='❌ Wrong! The answer was: '+q.options[q.correct];
    document.getElementById('nextBtn').style.display='inline-block';
}

document.getElementById('nextBtn').addEventListener('click',()=>{
    currentIndex++;
    loadQuestion();
});

loadQuestion();
    
    

    // Add sound toggle to settings
    function addSoundToggle() {
        const settings = document.getElementById('settingsPanel');
        if (!settings) return;
        const item = document.createElement('div');
        item.className = 'settings-item';
        item.innerHTML = `
            <span class="label">🔊 Sound Effects</span>
            <div class="settings-toggle active" id="soundToggle"><div class="knob"></div></div>
        `;
        settings.appendChild(item);
        document.getElementById('soundToggle').addEventListener('click', function() {
            this.classList.toggle('active');
            soundEnabled = this.classList.contains('active');
            if (soundEnabled) playClick();
        });
    }

    // Minigame: Quick Tap Challenge
    function startQuickTap() {
        if (document.getElementById('minigameOverlay')) return;
        const overlay = document.createElement('div');
        overlay.id = 'minigameOverlay';
        overlay.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; padding: 20px;
            animation: fadeIn 0.3s ease;
        `;
        overlay.innerHTML = `
            <div style="background: #1a1a2e; border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; border: 2px solid rgba(255,215,0,0.1);">
                <h2 style="color: #ffd700; margin-bottom: 10px;">🎯 Quick Tap Challenge</h2>
                <p style="color: #888; margin-bottom: 15px;">Tap as fast as you can!</p>
                <div style="font-size: 72px; margin: 15px 0;" id="tapCounter">0</div>
                <div style="font-size: 24px; color: #ff6b6b; margin-bottom: 10px;" id="tapTimer">3s</div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="tapBtn" style="
                        background: linear-gradient(135deg, #ffd700, #f5a623);
                        border: none; padding: 15px 40px; border-radius: 30px;
                        font-weight: 700; font-size: 18px; color: #1a1a2e;
                        cursor: pointer; font-family: 'Segoe UI', sans-serif;
                    ">👆 TAP!</button>
                    <button onclick="this.closest('#minigameOverlay').remove()" style="
                        background: rgba(255,255,255,0.05);
                        border: 1px solid rgba(255,255,255,0.1);
                        padding: 15px 20px; border-radius: 30px;
                        color: #888; cursor: pointer; font-size: 14px;
                        font-family: 'Segoe UI', sans-serif;
                    ">✕ Close</button>
                </div>
                <div id="tapResult" style="margin-top: 10px; color: #7cf5b0; font-weight: 700;"></div>
            </div>
        `;
        document.body.appendChild(overlay);

        let taps = 0;
        let timeLeft = 3;
        let active = true;

        const tapBtn = document.getElementById('tapBtn');
        const counter = document.getElementById('tapCounter');
        const timer = document.getElementById('tapTimer');
        const result = document.getElementById('tapResult');

        tapBtn.addEventListener('click', function() {
            if (!active) return;
            taps++;
            counter.textContent = taps;
            playClick();
            this.style.transform = 'scale(0.9)';
            setTimeout(() => this.style.transform = '', 100);
        });

        const interval = setInterval(() => {
            timeLeft--;
            timer.textContent = timeLeft + 's';
            if (timeLeft <= 0) {
                clearInterval(interval);
                active = false;
                tapBtn.disabled = true;
                tapBtn.style.opacity = '0.5';
                const reward = taps * 50;
                result.textContent = '🏆 You tapped ' + taps + ' times! +' + reward + ' points!';
                playWin();
                // Add points if game supports it
                if (typeof points !== 'undefined') {
                    points += reward;
                    if (typeof updateUI === 'function') updateUI();
                    if (typeof saveGame === 'function') saveGame();
                }
                setTimeout(() => {
                    overlay.querySelector('button:last-child').click();
                }, 3000);
            }
        }, 1000);

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = '@keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }';
        document.head.appendChild(style);
    }

    // Add minigame button to games
    function addMinigameButton() {
        const container = document.querySelector('.container') || document.querySelector('#app');
        if (!container) return;
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.style.cssText = `
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white; border: none; padding: 10px 20px;
            border-radius: 30px; font-weight: 700; font-size: 13px;
            cursor: pointer; margin: 5px;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
        `;
        btn.textContent = '🎯 Quick Tap Challenge';
        btn.onmouseover = function() { this.style.transform = 'scale(1.05)'; };
        btn.onmouseout = function() { this.style.transform = ''; };
        btn.onclick = startQuickTap;
        container.appendChild(btn);
    }

    // Initialize sound and minigame
    document.addEventListener('DOMContentLoaded', function() {
        // Add sound toggle if settings exist
        setTimeout(addSoundToggle, 100);
        // Add minigame button
        setTimeout(addMinigameButton, 200);
    });
</script>
</body>
</html>
