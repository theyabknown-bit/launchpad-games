<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 Sims Mini</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #d0e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(26,51,68,0.3);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid rgba(79,195,247,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .header { text-align: center; margin-bottom: 15px; }
        .header .title {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #4fc3f7, #7cf5b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub { color: #8899aa; font-size: 0.8rem; letter-spacing: 2px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .stat {
            background: rgba(0,0,0,0.3);
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid rgba(79,195,247,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .stat .label { color: #8899aa; }
        .stat .value { font-weight: 700; }
        .stat .value.money { color: #ffd93d; }
        .stat .value.happiness { color: #ff6b6b; }
        .stat .value.energy { color: #4fc3f7; }
        .stat .value.knowledge { color: #7cf5b0; }
        .stat .value.age { color: #a29bfe; }
        .stat .value.jail { color: #ff6b6b; }
        .stat .value.health { color: #fdcb6e; }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }
        .btn {
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            color: #0b1a26;
            font-family: 'Segoe UI', sans-serif;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.95); }
        .btn-study { background: linear-gradient(135deg, #7cf5b0, #4fc3f7); }
        .btn-work { background: linear-gradient(135deg, #ffd93d, #f6b93b); }
        .btn-relax { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .btn-day { background: linear-gradient(135deg, #a29bfe, #6c5ce7); color: white; }
        .btn-crime { background: linear-gradient(135deg, #fd79a8, #e17055); color: white; }
        .btn-lawyer { background: linear-gradient(135deg, #00b894, #00a381); color: white; }
        .btn-friend { background: linear-gradient(135deg, #fdcb6e, #f9a825); color: #0b1a26; }
        .btn-doctor { background: linear-gradient(135deg, #55efc4, #00b894); color: #0b1a26; }
        .btn-minigame { background: linear-gradient(135deg, #ff9ff3, #f368e0); color: white; }

        .section {
            margin: 12px 0;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            border: 1px solid rgba(79,195,247,0.05);
        }
        .section h3 { font-size: 1rem; margin-bottom: 6px; color: #4fc3f7; }
        .section .info { font-size: 0.85rem; color: #8899aa; }

        .friend-item, .family-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.85rem;
        }
        .friend-item .name, .family-item .name { color: #d0e8f0; }
        .friend-item .age, .family-item .age { color: #a29bfe; }

        .message {
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            text-align: center;
            min-height: 40px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #4fc3f7;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-btn:hover { text-decoration: underline; }

        .crime-list, .minigame-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
        .crime-btn, .minigame-btn {
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            color: #d0e8f0;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .crime-btn:hover { background: rgba(255,107,107,0.2); border-color: #ff6b6b; }
        .minigame-btn:hover { background: rgba(255,159,243,0.2); border-color: #ff9ff3; }

        .lawyer-options { display: flex; gap: 10px; margin: 6px 0; }
        .lawyer-btn {
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(79,195,247,0.2);
            background: rgba(79,195,247,0.05);
            color: #d0e8f0;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .lawyer-btn:hover { background: rgba(79,195,247,0.15); }

        .mini-game-area {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 12px;
            margin-top: 8px;
            text-align: center;
        }
        .mini-game-area .game-btn {
            font-size: 2rem;
            padding: 10px 30px;
            background: #4fc3f7;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .mini-game-area .game-btn:hover { transform: scale(1.05); }
        .mini-game-area .progress { font-size: 0.9rem; margin-top: 6px; }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .actions { grid-template-columns: 1fr 1fr; }
        }
    </style>
<script>
// Suppress unload violation warnings
(function() {
    var ow = console.warn;
    console.warn = function() {
        if (arguments.length && typeof arguments[0] === "string" && arguments[0].includes("unload is not allowed")) {
            return;
        }
        ow.apply(console, arguments);
    };
})();
</script>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">🧬 Sims Mini</div>
        <div class="sub" id="subTitle">Live. Grow. Survive.</div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat"><span class="label">💰 Money</span><span class="value money" id="money">100</span></div>
        <div class="stat"><span class="label">😊 Happiness</span><span class="value happiness" id="happiness">80</span></div>
        <div class="stat"><span class="label">⚡ Energy</span><span class="value energy" id="energy">70</span></div>
        <div class="stat"><span class="label">📚 Knowledge</span><span class="value knowledge" id="knowledge">10</span></div>
        <div class="stat"><span class="label">❤️ Health</span><span class="value health" id="health">80</span></div>
        <div class="stat"><span class="label">🎂 Age</span><span class="value age" id="age">18</span></div>
        <div class="stat"><span class="label">⛓️ Jail</span><span class="value jail" id="jailStatus">Free</span></div>
        <div class="stat"><span class="label">😔 Depression</span><span class="value" id="depressionStatus" style="color:#ff6b6b;">No</span></div>
        <div class="stat"><span class="label">👪 Family</span><span class="value" id="familyStatus">-</span></div>
    </div>

    <!-- Main Actions -->
    <div class="actions">
        <button class="btn btn-study" onclick="study()"><i class="fas fa-book"></i> Study</button>
        <button class="btn btn-work" onclick="work()"><i class="fas fa-briefcase"></i> Work</button>
        <button class="btn btn-relax" onclick="relax()"><i class="fas fa-bed"></i> Relax</button>
        <button class="btn btn-day" onclick="passDay()"><i class="fas fa-calendar-day"></i> Pass Day</button>
        <button class="btn btn-crime" onclick="showCrimes()"><i class="fas fa-gavel"></i> Commit Crime</button>
        <button class="btn btn-lawyer" onclick="showLawyer()"><i class="fas fa-balance-scale"></i> Hire Lawyer</button>
        <button class="btn btn-friend" onclick="makeFriend()"><i class="fas fa-user-plus"></i> Make Friend</button>
        <button class="btn btn-doctor" onclick="visitDoctor()"><i class="fas fa-user-md"></i> Visit Doctor</button>
        <button class="btn btn-minigame" onclick="showMiniGames()"><i class="fas fa-gamepad"></i> Mini-Games</button>
    </div>

    <!-- Family Section -->
    <div class="section" id="familySection">
        <h3>👪 Family</h3>
        <div id="familyList"></div>
    </div>

    <!-- Friend List -->
    <div class="section" id="friendSection">
        <h3>👥 Friends (<span id="friendCount">0</span>)</h3>
        <div id="friendList"><span style="color:#8899aa; font-size:0.85rem;">Make friends to build your circle.</span></div>
    </div>

    <!-- Dynamic UI -->
    <div id="dynamicUI"></div>

    <!-- Message -->
    <div class="message" id="message">💡 Study to gain knowledge, Work to earn money, Pass Day to age.</div>

    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
</div>

<script>
// ============================================================
// CONFIG & STATE
// ============================================================
const DEFAULT_STATE = {
    money: 100,
    happiness: 80,
    energy: 70,
    knowledge: 10,
    health: 80,
    age: 18,
    jailDays: 0,
    lawyer: null,
    friends: [],
    // New fields
    firstName: '',
    lastName: '',
    parents: [], // [{name, age}]
    depressed: false,
    depressionDays: 0, // consecutive days with happiness < 20
    dead: false
};

// Crime definitions
const CRIMES = [
    { id: 'theft', label: 'Petty Theft', risk: 0.2, jailDays: 1, fine: 10 },
    { id: 'fraud', label: 'Fraud', risk: 0.3, jailDays: 2, fine: 20 },
    { id: 'assault', label: 'Assault', risk: 0.4, jailDays: 3, fine: 30 },
    { id: 'grandtheft', label: 'Grand Theft', risk: 0.5, jailDays: 4, fine: 50 },
    { id: 'hacking', label: 'Hacking', risk: 0.6, jailDays: 5, fine: 80 }
];

// Name generation
const FIRST_NAMES = [
    "James","Mary","John","Patricia","Robert","Jennifer","Michael","Linda","William","Elizabeth",
    "David","Barbara","Richard","Susan","Joseph","Jessica","Thomas","Sarah","Charles","Karen",
    "Christopher","Nancy","Daniel","Lisa","Matthew","Betty","Anthony","Helen","Mark","Sandra",
    "Donald","Donna","Steven","Carol","Paul","Ruth","Andrew","Sharon","Joshua","Michelle",
    "Kenneth","Laura","Kevin","Sarah","Brian","Kimberly","George","Deborah","Timothy","Amanda",
    "Ronald","Melissa","Edward","Stephanie","Jason","Rebecca","Jeffrey","Shirley","Ryan","Cynthia",
    "Jacob","Amy","Gary","Angela","Nicholas","Anna","Eric","Ruth","Jonathan","Brenda",
    "Stephen","Pamela","Larry","Nicole","Justin","Katherine","Scott","Samantha","Brandon","Christine",
    "Benjamin","Emma","Samuel","Megan","Gregory","Laura","Alexander","Jacqueline","Patrick","Carolyn",
    "Frank","Janet","Raymond","Maria","Jack","Heather","Dennis","Diane","Jerry","Julie"
];
const LAST_NAMES = [
    "Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez",
    "Hernandez","Lopez","Gonzalez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin",
    "Lee","Perez","Thompson","White","Harris","Sanchez","Clark","Ramirez","Lewis","Robinson",
    "Walker","Young","Allen","King","Wright","Scott","Torres","Nguyen","Hill","Flores",
    "Green","Adams","Nelson","Baker","Hall","Rivera","Campbell","Mitchell","Carter","Roberts"
];

let allNames = [];

function generateAllNames() {
    if (allNames.length > 0) return;
    for (let f of FIRST_NAMES) {
        for (let l of LAST_NAMES) {
            const name = f + ' ' + l;
            allNames.push(name);
            if (allNames.length >= 1000) break;
        }
        if (allNames.length >= 1000) break;
    }
    // Shuffle
    for (let i = allNames.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allNames[i], allNames[j]] = [allNames[j], allNames[i]];
    }
}

let state = {};

function loadState() {
    try {
        const saved = localStorage.getItem('simsUltimate');
        if (saved) {
            const parsed = JSON.parse(saved);
            state = { ...DEFAULT_STATE, ...parsed };
        } else {
            state = { ...DEFAULT_STATE };
        }
    } catch(e) {
        state = { ...DEFAULT_STATE };
    }
    // Ensure arrays
    if (!Array.isArray(state.friends)) state.friends = [];
    if (!Array.isArray(state.parents)) state.parents = [];
    // Ensure all fields
    for (let key in DEFAULT_STATE) {
        if (!(key in state)) state[key] = DEFAULT_STATE[key];
    }
    generateAllNames();
    // If no firstName, set random
    if (!state.firstName) {
        state.firstName = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)];
    }
    if (!state.lastName) {
        state.lastName = LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)];
    }
    // Generate parents if empty
    if (state.parents.length === 0) {
        const motherName = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)] + ' ' + state.lastName;
        const fatherName = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)] + ' ' + state.lastName;
        state.parents = [
            { name: motherName, age: state.age + 22 + Math.floor(Math.random() * 10) },
            { name: fatherName, age: state.age + 24 + Math.floor(Math.random() * 10) }
        ];
    }
    // If dead, reset? We'll keep dead state but if dead, show game over.
    saveState();
}

function saveState() {
    localStorage.setItem('simsUltimate', JSON.stringify(state));
}

function updateUI() {
    document.getElementById('money').textContent = state.money;
    document.getElementById('happiness').textContent = state.happiness;
    document.getElementById('energy').textContent = state.energy;
    document.getElementById('knowledge').textContent = state.knowledge;
    document.getElementById('health').textContent = state.health;
    document.getElementById('age').textContent = state.age;
    document.getElementById('jailStatus').textContent = state.jailDays > 0 ? `Jail (${state.jailDays} days)` : 'Free';
    document.getElementById('depressionStatus').textContent = state.depressed ? 'Yes' : 'No';
    document.getElementById('depressionStatus').style.color = state.depressed ? '#ff6b6b' : '#7cf5b0';
    document.getElementById('familyStatus').textContent = state.parents.length > 0 ? '👨‍👩‍👧' : 'None';

    // Family list
    const familyContainer = document.getElementById('familyList');
    if (state.parents.length === 0) {
        familyContainer.innerHTML = '<span style="color:#8899aa;">No parents.</span>';
    } else {
        familyContainer.innerHTML = state.parents.map(p =>
            `<div class="family-item"><span class="name">${p.name}</span><span class="age">${p.age} yo</span></div>`
        ).join('');
    }

    // Friend list
    const friendContainer = document.getElementById('friendList');
    document.getElementById('friendCount').textContent = state.friends.length;
    if (state.friends.length === 0) {
        friendContainer.innerHTML = '<span style="color:#8899aa; font-size:0.85rem;">Make friends to build your circle.</span>';
    } else {
        friendContainer.innerHTML = state.friends.map(f =>
            `<div class="friend-item"><span class="name">${f.name}</span><span class="age">${f.age} yo</span></div>`
        ).join('');
    }

    // Check death
    if (state.dead) {
        document.getElementById('dynamicUI').innerHTML = `
            <div class="section" style="border-color:#ff6b6b;">
                <h3 style="color:#ff6b6b;">💀 GAME OVER</h3>
                <p>You have died. Your stats have been reset.</p>
                <button class="btn" onclick="resetGame()">Start New Life</button>
            </div>
        `;
        return;
    }

    // Clear dynamic UI if not active
    if (!document.querySelector('#dynamicUI .section')) {
        document.getElementById('dynamicUI').innerHTML = '';
    }
}

function setMessage(text, isGood = true) {
    const el = document.getElementById('message');
    el.innerHTML = text;
    el.style.borderColor = isGood ? 'rgba(124,245,176,0.2)' : 'rgba(255,107,107,0.2)';
}

// ============================================================
// ACTIONS
// ============================================================
function study() {
    if (state.dead) return;
    if (state.jailDays > 0) { setMessage('⛓️ Cannot study in jail!', false); return; }
    if (state.energy < 10) { setMessage('😴 Too tired to study!', false); return; }
    state.energy -= 10;
    state.knowledge += 5;
    state.happiness -= 2;
    if (state.happiness < 0) state.happiness = 0;
    saveState();
    updateUI();
    setMessage('📚 Studied! Knowledge +5, Energy -10.');
}

function work() {
    if (state.dead) return;
    if (state.jailDays > 0) { setMessage('⛓️ Cannot work in jail!', false); return; }
    if (state.energy < 15) { setMessage('😴 Too tired to work!', false); return; }
    if (state.happiness < 10) { setMessage('😢 Too unhappy to work!', false); return; }
    const bonus = Math.floor(state.knowledge / 10);
    const pay = 5 + bonus;
    state.energy -= 15;
    state.happiness -= 5;
    state.money += pay;
    if (state.happiness < 0) state.happiness = 0;
    saveState();
    updateUI();
    setMessage(`💰 Worked and earned $${pay}!`);
}

function relax() {
    if (state.dead) return;
    if (state.jailDays > 0) { setMessage('⛓️ Can\'t relax properly in jail.', false); return; }
    if (state.energy >= 100) { setMessage('⚡ Already full energy!', false); return; }
    state.energy += 20;
    if (state.energy > 100) state.energy = 100;
    state.happiness += 5;
    if (state.happiness > 100) state.happiness = 100;
    state.health += 2;
    if (state.health > 100) state.health = 100;
    saveState();
    updateUI();
    setMessage('😌 Relaxed! Energy +20, Happiness +5, Health +2.');
}

function passDay() {
    if (state.dead) return;
    state.age += 1;
    // Age parents
    state.parents.forEach(p => p.age += 1);
    // Age friends
    state.friends.forEach(f => f.age += 1);
    // Reduce jail
    if (state.jailDays > 0) {
        state.jailDays -= 1;
        if (state.jailDays < 0) state.jailDays = 0;
    }
    // Natural decay
    state.happiness -= 2;
    if (state.happiness < 0) state.happiness = 0;
    state.energy -= 3;
    if (state.energy < 0) state.energy = 0;
    state.health -= 1;
    if (state.health < 0) state.health = 0;

    // Depression check
    if (state.happiness < 20) {
        state.depressionDays = (state.depressionDays || 0) + 1;
        if (state.depressionDays >= 3) {
            state.depressed = true;
            setMessage('😔 You are depressed. Visit a doctor.', false);
        }
    } else {
        state.depressionDays = 0;
        if (state.depressed) {
            state.depressed = false;
            setMessage('😊 You are no longer depressed!');
        }
    }

    // Check death conditions
    if (state.health <= 0) {
        state.dead = true;
        setMessage('💀 You died from poor health.', false);
    } else if (state.happiness <= 0) {
        state.dead = true;
        setMessage('💀 You died from extreme unhappiness.', false);
    } else {
        // Check if parents die of old age (age > 100)
        state.parents = state.parents.filter(p => p.age < 100);
        if (state.parents.length === 0) {
            setMessage('Your parents have passed away.', false);
        }
    }

    saveState();
    updateUI();
    if (!state.dead) {
        setMessage(`🎂 You are now ${state.age} years old.`);
    }
}

// ============================================================
// CRIME SYSTEM
// ============================================================
function showCrimes() {
    if (state.dead) return;
    if (state.jailDays > 0) { setMessage('⛓️ Already in jail!', false); return; }
    const ui = document.getElementById('dynamicUI');
    ui.innerHTML = `
        <div class="section">
            <h3>🔫 Choose a Crime</h3>
            <div class="crime-list">
                ${CRIMES.map(c => `
                    <button class="crime-btn" onclick="commitCrime('${c.id}')">${c.label} (Risk ${Math.round(c.risk*100)}%)</button>
                `).join('')}
            </div>
            <div style="margin-top:6px; font-size:0.8rem; color:#8899aa;">Higher risk = more jail time.</div>
        </div>
    `;
}

function commitCrime(crimeId) {
    if (state.dead) return;
    const crime = CRIMES.find(c => c.id === crimeId);
    if (!crime) return;
    if (state.jailDays > 0) { setMessage('Already in jail!', false); return; }

    const roll = Math.random();
    if (roll < crime.risk) {
        state.jailDays = crime.jailDays;
        state.money -= crime.fine;
        if (state.money < 0) state.money = 0;
        setMessage(`🚔 Caught! ${crime.jailDays} days in jail, fined $${crime.fine}.`, false);
    } else {
        const reward = crime.fine * 2 + Math.floor(Math.random() * 20);
        state.money += reward;
        setMessage(`🎉 Success! Earned $${reward} from ${crime.label}.`);
    }
    saveState();
    updateUI();
    document.getElementById('dynamicUI').innerHTML = '';
}

// ============================================================
// LAWYER SYSTEM
// ============================================================
function showLawyer() {
    if (state.dead) return;
    if (state.jailDays === 0) { setMessage('💼 Not in jail.', false); return; }
    const ui = document.getElementById('dynamicUI');
    ui.innerHTML = `
        <div class="section">
            <h3>⚖️ Hire a Lawyer</h3>
            <div class="lawyer-options">
                <button class="lawyer-btn" onclick="hireLawyer('public')">🆓 Public Defender</button>
                <button class="lawyer-btn" onclick="hireLawyer('private')">💰 Private Lawyer ($100)</button>
            </div>
            <div style="font-size:0.8rem; color:#8899aa;">Public: -20% time | Private: -50%</div>
        </div>
    `;
}

function hireLawyer(type) {
    if (state.dead) return;
    if (state.jailDays === 0) { setMessage('Not in jail.', false); return; }
    let reduction = 0;
    if (type === 'public') {
        reduction = Math.floor(state.jailDays * 0.2);
        state.lawyer = 'public';
    } else if (type === 'private') {
        if (state.money < 100) { setMessage('❌ Need $100.', false); return; }
        state.money -= 100;
        reduction = Math.floor(state.jailDays * 0.5);
        state.lawyer = 'private';
    }
    state.jailDays -= reduction;
    if (state.jailDays < 0) state.jailDays = 0;
    setMessage(`⚖️ Jail time reduced by ${reduction} days.`);
    saveState();
    updateUI();
    document.getElementById('dynamicUI').innerHTML = '';
}

// ============================================================
// DOCTOR SYSTEM
// ============================================================
function visitDoctor() {
    if (state.dead) return;
    if (state.jailDays > 0) { setMessage('⛓️ Can\'t visit doctor in jail.', false); return; }
    let msg = '';
    let cost = 0;
    let success = true;

    if (state.health >= 50 && !state.depressed) {
        msg = '🩺 Doctor says: "You are perfectly healthy!" No charge.';
    } else {
        // Need treatment
        if (state.depressed) {
            cost = 30;
            success = Math.random() < 0.6;
            msg = '🩺 Doctor prescribes depression medication.';
        } else {
            cost = 20;
            success = Math.random() < 0.7;
            msg = '🩺 Doctor recommends treatment for your health.';
        }
        if (state.money < cost) {
            setMessage('❌ Not enough money for treatment.', false);
            return;
        }
        state.money -= cost;
        if (success) {
            if (state.depressed) {
                state.depressed = false;
                state.depressionDays = 0;
                state.happiness += 10;
                if (state.happiness > 100) state.happiness = 100;
                msg += ' ✅ Treatment successful! You are no longer depressed.';
            } else {
                state.health += 15;
                if (state.health > 100) state.health = 100;
                msg += ' ✅ Treatment improved your health.';
            }
        } else {
            // Treatment failed
            if (state.depressed) {
                state.health -= 5;
                msg += ' ❌ Medicine didn\'t work. Your health worsened.';
            } else {
                state.health -= 3;
                msg += ' ❌ Treatment failed. Your health slightly worsened.';
            }
            if (state.health < 0) state.health = 0;
        }
    }
    saveState();
    updateUI();
    setMessage(msg, success);
    document.getElementById('dynamicUI').innerHTML = '';
}

// ============================================================
// MINI-GAMES
// ============================================================
let miniGameActive = false;
let miniGameTarget = 10;
let miniGameClicks = 0;
let miniGameCallback = null;

function showMiniGames() {
    if (state.dead) return;
    const ui = document.getElementById('dynamicUI');
    ui.innerHTML = `
        <div class="section">
            <h3>🎮 Mini-Games</h3>
            <div class="minigame-list">
                <button class="minigame-btn" onclick="startMiniGame('game')">🎮 Play Game (Happiness+5, Health+3)</button>
                <button class="minigame-btn" onclick="startMiniGame('exercise')">🏋️ Exercise (Health+8, Happiness+2)</button>
            </div>
            <div id="miniGameArea" style="margin-top:8px;"></div>
        </div>
    `;
}

function startMiniGame(type) {
    if (miniGameActive) return;
    if (state.energy < 10) { setMessage('😴 Too tired for games.', false); return; }

    miniGameActive = true;
    miniGameClicks = 0;
    miniGameTarget = 10;
    const area = document.getElementById('miniGameArea');
    let label = '';
    let reward = {};

    if (type === 'game') {
        label = 'Click the button 10 times to play!';
        reward = { happiness: 5, health: 3, energyCost: 10 };
    } else if (type === 'exercise') {
        label = 'Click the button 10 times to exercise!';
        reward = { health: 8, happiness: 2, energyCost: 15 };
    }

    area.innerHTML = `
        <p>${label}</p>
        <button class="game-btn" onclick="miniGameClick('${type}', ${JSON.stringify(reward).replace(/"/g, '&quot;')})">👆</button>
        <div class="progress">Progress: <span id="miniProgress">0</span> / ${miniGameTarget}</div>
    `;
}

function miniGameClick(type, reward) {
    if (!miniGameActive) return;
    miniGameClicks++;
    document.getElementById('miniProgress').textContent = miniGameClicks;
    if (miniGameClicks >= miniGameTarget) {
        // Complete
        miniGameActive = false;
        state.energy -= reward.energyCost;
        if (state.energy < 0) state.energy = 0;
        state.happiness += reward.happiness || 0;
        if (state.happiness > 100) state.happiness = 100;
        state.health += reward.health || 0;
        if (state.health > 100) state.health = 100;
        saveState();
        updateUI();
        setMessage(`🎉 Mini-game complete! ${reward.happiness ? 'Happiness +'+reward.happiness : ''} ${reward.health ? 'Health +'+reward.health : ''}`);
        document.getElementById('miniGameArea').innerHTML = '<p style="color:#7cf5b0;">✅ Done!</p>';
        // Clear dynamic UI after a moment
        setTimeout(() => {
            document.getElementById('dynamicUI').innerHTML = '';
        }, 2000);
    }
}

// ============================================================
// FRIEND SYSTEM
// ============================================================
function makeFriend() {
    if (state.dead) return;
    if (state.jailDays > 0) { setMessage('⛓️ Can\'t make friends in jail.', false); return; }
    let available = allNames.filter(n => !state.friends.some(f => f.name === n) && !state.parents.some(p => p.name === n));
    if (available.length === 0) { setMessage('😥 No more unique names!', false); return; }
    const name = available[Math.floor(Math.random() * available.length)];
    let friendAge = state.age + Math.floor(Math.random() * 5) - 2;
    if (friendAge < 1) friendAge = 1;
    state.friends.push({ name, age: friendAge });
    saveState();
    updateUI();
    setMessage(`👋 Became friends with ${name} (${friendAge} yo)!`);
}

// ============================================================
// DEATH & RESET
// ============================================================
function resetGame() {
    if (confirm('Start a new life? All progress will be lost.')) {
        localStorage.removeItem('simsUltimate');
        state = { ...DEFAULT_STATE };
        // Regenerate name and parents
        state.firstName = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)];
        state.lastName = LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)];
        const motherName = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)] + ' ' + state.lastName;
        const fatherName = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)] + ' ' + state.lastName;
        state.parents = [
            { name: motherName, age: state.age + 22 + Math.floor(Math.random() * 10) },
            { name: fatherName, age: state.age + 24 + Math.floor(Math.random() * 10) }
        ];
        state.dead = false;
        saveState();
        loadState();
        updateUI();
        setMessage('🌟 New life begun!');
        document.getElementById('dynamicUI').innerHTML = '';
    }
}

// ============================================================
// INIT
// ============================================================
loadState();
updateUI();
setMessage('💡 Study, Work, Relax, Pass Day to age. Stay healthy!');
console.log('✅ Sims Mini with full family, health, doctor, mini-games.');
</script>
