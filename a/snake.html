<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Snake Pro</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .game-container { text-align: center; }
        canvas {
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            border: 2px solid rgba(79,195,247,0.1);
            display: block;
            margin: 15px auto;
            max-width: 100%;
            box-shadow: 0 0 40px rgba(79,195,247,0.03);
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .status-bar .score-group { display: flex; gap: 20px; }
        .status-bar .score-group span { color: #8899aa; }
        .status-bar .score-group .score { color: #ffd93d; font-weight: 700; }
        .status-bar .score-group .high { color: #7cf5b0; font-weight: 700; }
        .status-bar .lives { color: #ff6b6b; font-size: 1.4rem; letter-spacing: 4px; }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .controls button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); }
        .controls button.active { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        .difficulty-selector { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
        .difficulty-selector button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; padding: 6px 16px; }
        .difficulty-selector button.active { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        #message { font-size: 1.1rem; min-height: 2rem; }
        .food-legend { display: flex; gap: 15px; justify-content: center; font-size: 0.8rem; color: #8899aa; flex-wrap: wrap; }
        .food-legend span { display: inline-flex; align-items: center; gap: 4px; }
        .food-legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
    </style>
</head>
<body>
<div class="game-container">
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    <h1 class="game-title">🐍 Snake Pro</h1>

    <!-- Difficulty -->
    <div class="difficulty-selector">
        <button data-diff="easy">Easy</button>
        <button data-diff="medium" class="active">Medium</button>
        <button data-diff="hard">Hard</button>
    </div>

    <!-- Status -->
    <div class="status-bar">
        <div class="score-group">
            <span>🍎 Score: <span class="score" id="score">0</span></span>
            <span>🏆 High: <span class="high" id="highScore">0</span></span>
        </div>
        <div class="lives" id="livesDisplay">❤️❤️❤️</div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="message">⬆️⬇️⬅️➡️ Arrow keys to move</div>

    <div class="food-legend">
        <span><span class="dot" style="background:#7cf5b0;"></span> Normal (+1)</span>
        <span><span class="dot" style="background:#ffd93d;"></span> Speed (+2)</span>
        <span><span class="dot" style="background:#4fc3f7;"></span> Slow (+1)</span>
        <span><span class="dot" style="background:#ff6b6b;"></span> Poison (-1 life)</span>
    </div>

    <div class="controls">
        <button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button>
        <button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button>
    </div>
</div>

<script>
// ============================================================
// SNAKE PRO – Food types, obstacles, lives, high-score
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const livesEl = document.getElementById('livesDisplay');
const msgEl = document.getElementById('message');

const GRID_SIZE = 20;
const TILE_COUNT = 20;
const TILE_SIZE = canvas.width / TILE_COUNT;

let snake = [];
let direction = { dx: 1, dy: 0 };
let nextDirection = { dx: 1, dy: 0 };
let food = null;
let obstacles = [];
let score = 0;
let highScore = 0;
let lives = 3;
let gameOver = false;
let paused = false;
let difficulty = 'medium';
let speed = 150;
let gameInterval = null;
let animationFrame = null;

// Load saved data
(function load() {
    try {
        highScore = parseInt(localStorage.getItem('snake_highscore')) || 0;
        const diff = localStorage.getItem('snake_difficulty') || 'medium';
        difficulty = diff;
    } catch(e) {}
    highScoreEl.textContent = highScore;
    document.querySelectorAll('.difficulty-selector button').forEach(b => {
        b.classList.toggle('active', b.dataset.diff === difficulty);
    });
    updateSpeed();
})();

function updateSpeed() {
    const speeds = { easy: 200, medium: 150, hard: 90 };
    speed = speeds[difficulty] || 150;
}

function saveHighScore() {
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_highscore', highScore);
        highScoreEl.textContent = highScore;
    }
}

function updateLivesUI() {
    livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
}

// ---- Game Functions ----
function initGame() {
    const mid = Math.floor(TILE_COUNT / 2);
    snake = [
        { x: mid, y: mid },
        { x: mid - 1, y: mid },
        { x: mid - 2, y: mid }
    ];
    direction = { dx: 1, dy: 0 };
    nextDirection = { dx: 1, dy: 0 };
    score = 0;
    obstacles = [];
    gameOver = false;
    paused = false;
    document.getElementById('pauseLabel').textContent = 'Pause';
    scoreEl.textContent = score;
    updateLivesUI();
    msgEl.textContent = '⬆️⬇️⬅️➡️ Arrow keys to move';
    spawnFood();
    draw();
}

function spawnFood() {
    let pos;
    let attempts = 0;
    do {
        pos = {
            x: Math.floor(Math.random() * TILE_COUNT),
            y: Math.floor(Math.random() * TILE_COUNT)
        };
        attempts++;
    } while (
        (snake.some(s => s.x === pos.x && s.y === pos.y) ||
         obstacles.some(o => o.x === pos.x && o.y === pos.y)) &&
        attempts < 100
    );
    // Random food type
    const types = [
        { type: 'normal', color: '#7cf5b0', points: 1, label: 'Normal' },
        { type: 'speed', color: '#ffd93d', points: 2, label: 'Speed' },
        { type: 'slow', color: '#4fc3f7', points: 1, label: 'Slow' },
        { type: 'poison', color: '#ff6b6b', points: -1, label: 'Poison' }
    ];
    const r = Math.random();
    let selected;
    if (r < 0.5) selected = types[0];
    else if (r < 0.75) selected = types[1];
    else if (r < 0.9) selected = types[2];
    else selected = types[3];
    food = { ...pos, ...selected };
}

function spawnObstacles() {
    // Spawn obstacles based on score (every 5 points)
    const count = Math.floor(score / 5);
    while (obstacles.length < count) {
        let pos = {
            x: Math.floor(Math.random() * TILE_COUNT),
            y: Math.floor(Math.random() * TILE_COUNT)
        };
        if (!snake.some(s => s.x === pos.x && s.y === pos.y) &&
            !(food && food.x === pos.x && food.y === pos.y) &&
            !obstacles.some(o => o.x === pos.x && o.y === pos.y) &&
            !(pos.x === 0 && pos.y === 0) &&
            !(pos.x === 0 && pos.y === 1) &&
            !(pos.x === 1 && pos.y === 0)) {
            obstacles.push(pos);
        }
    }
}

function moveSnake() {
    if (gameOver || paused) return;
    // Apply direction
    direction = { ...nextDirection };
    const head = { x: snake[0].x + direction.dx, y: snake[0].y + direction.dy };
    // Check wall collision
    if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        loseLife();
        return;
    }
    // Check obstacle collision
    if (obstacles.some(o => o.x === head.x && o.y === head.y)) {
        loseLife();
        return;
    }
    // Check self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
        loseLife();
        return;
    }

    snake.unshift(head);
    let ate = false;
    if (food && head.x === food.x && head.y === food.y) {
        ate = true;
        const points = food.points || 1;
        if (points > 0) {
            score += points;
            scoreEl.textContent = score;
            if (food.type === 'speed') {
                // Speed boost: temporarily increase speed
                clearInterval(gameInterval);
                const newSpeed = Math.max(60, speed - 30);
                gameInterval = setInterval(gameLoop, newSpeed);
                setTimeout(() => {
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, speed);
                }, 3000);
            }
            if (food.type === 'slow') {
                // Slow: temporarily decrease speed
                clearInterval(gameInterval);
                const newSpeed = Math.min(400, speed + 40);
                gameInterval = setInterval(gameLoop, newSpeed);
                setTimeout(() => {
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, speed);
                }, 3000);
            }
            spawnFood();
            spawnObstacles();
            msgEl.textContent = `✅ +${points} points!`;
            playSound('eat');
        } else {
            // Poison
            loseLife();
            spawnFood();
        }
        saveHighScore();
    } else {
        snake.pop();
    }
    draw();
    if (!ate) msgEl.textContent = '⬆️⬇️⬅️➡️ Move';
}

function loseLife() {
    lives--;
    updateLivesUI();
    playSound('lose');
    if (lives <= 0) {
        gameOver = true;
        msgEl.textContent = '💀 Game Over! Press Restart.';
        draw();
        clearInterval(gameInterval);
        return;
    }
    // Reset snake position
    const mid = Math.floor(TILE_COUNT / 2);
    snake = [
        { x: mid, y: mid },
        { x: mid - 1, y: mid },
        { x: mid - 2, y: mid }
    ];
    direction = { dx: 1, dy: 0 };
    nextDirection = { dx: 1, dy: 0 };
    obstacles = [];
    spawnFood();
    msgEl.textContent = `💔 Lost a life! ${lives} remaining.`;
    draw();
}

// ---- Drawing ----
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Grid
    for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.strokeStyle = 'rgba(79,195,247,0.03)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(i * TILE_SIZE, 0);
        ctx.lineTo(i * TILE_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * TILE_SIZE);
        ctx.lineTo(canvas.width, i * TILE_SIZE);
        ctx.stroke();
    }
    // Obstacles
    obstacles.forEach(o => {
        ctx.fillStyle = 'rgba(255,107,107,0.15)';
        ctx.fillRect(o.x * TILE_SIZE, o.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = 'rgba(255,107,107,0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x * TILE_SIZE, o.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
    });
    // Food
    if (food) {
        ctx.shadowColor = food.color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = food.color;
        ctx.beginPath();
        ctx.arc(food.x * TILE_SIZE + TILE_SIZE/2, food.y * TILE_SIZE + TILE_SIZE/2, TILE_SIZE/2 - 2, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    // Snake
    snake.forEach((seg, i) => {
        const ratio = 1 - (i / snake.length) * 0.5;
        ctx.fillStyle = i === 0 ? '#4fc3f7' : `rgba(79,195,247,${0.4 + 0.5 * ratio})`;
        ctx.shadowColor = i === 0 ? '#4fc3f7' : 'transparent';
        ctx.shadowBlur = i === 0 ? 20 : 0;
        const pad = i === 0 ? 1 : 2;
        ctx.fillRect(seg.x * TILE_SIZE + pad, seg.y * TILE_SIZE + pad, TILE_SIZE - pad*2, TILE_SIZE - pad*2);
        ctx.shadowBlur = 0;
        // Eyes on head
        if (i === 0) {
            ctx.fillStyle = '#0b1a26';
            const eyeOffsets = [
                [TILE_SIZE*0.25, TILE_SIZE*0.25],
                [TILE_SIZE*0.75, TILE_SIZE*0.25]
            ];
            if (direction.dx === -1) { // left
                eyeOffsets[0] = [TILE_SIZE*0.15, TILE_SIZE*0.25];
                eyeOffsets[1] = [TILE_SIZE*0.15, TILE_SIZE*0.75];
            } else if (direction.dx === 1) { // right
                eyeOffsets[0] = [TILE_SIZE*0.85, TILE_SIZE*0.25];
                eyeOffsets[1] = [TILE_SIZE*0.85, TILE_SIZE*0.75];
            } else if (direction.dy === -1) { // up
                eyeOffsets[0] = [TILE_SIZE*0.25, TILE_SIZE*0.15];
                eyeOffsets[1] = [TILE_SIZE*0.75, TILE_SIZE*0.15];
            } else if (direction.dy === 1) { // down
                eyeOffsets[0] = [TILE_SIZE*0.25, TILE_SIZE*0.85];
                eyeOffsets[1] = [TILE_SIZE*0.75, TILE_SIZE*0.85];
            }
            eyeOffsets.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(seg.x * TILE_SIZE + x, seg.y * TILE_SIZE + y, 3, 0, Math.PI*2);
                ctx.fill();
            });
        }
    });
}

// ---- Sound ----
function playSound(type) {
    try {
        const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        if (type === 'eat') {
            osc.frequency.value = 800;
            gain.gain.value = 0.06;
            osc.start();
            osc.stop(ctxAudio.currentTime + 0.08);
        } else if (type === 'lose') {
            osc.frequency.value = 300;
            gain.gain.value = 0.08;
            osc.start();
            setTimeout(() => { osc.frequency.value = 200; }, 100);
            osc.stop(ctxAudio.currentTime + 0.3);
        }
    } catch(e) {}
}

// ---- Game Loop ----
function gameLoop() {
    if (!paused && !gameOver) {
        moveSnake();
    }
}

// ---- Controls ----
document.addEventListener('keydown', (e) => {
    if (gameOver || paused) return;
    const key = e.key;
    e.preventDefault();
    if (key === 'ArrowUp' && direction.dy !== 1) nextDirection = { dx: 0, dy: -1 };
    else if (key === 'ArrowDown' && direction.dy !== -1) nextDirection = { dx: 0, dy: 1 };
    else if (key === 'ArrowLeft' && direction.dx !== 1) nextDirection = { dx: -1, dy: 0 };
    else if (key === 'ArrowRight' && direction.dx !== -1) nextDirection = { dx: 1, dy: 0 };
    else if (key === 'p' || key === 'P') togglePause();
    else if (key === 'r' || key === 'R') resetGame();
});

function togglePause() {
    if (gameOver) return;
    paused = !paused;
    document.getElementById('pauseLabel').textContent = paused ? 'Resume' : 'Pause';
    msgEl.textContent = paused ? '⏸️ Paused' : '⬆️⬇️⬅️➡️ Move';
    draw();
}

function resetGame() {
    clearInterval(gameInterval);
    lives = 3;
    initGame();
    gameInterval = setInterval(gameLoop, speed);
    playSound('eat');
}

// ---- Difficulty ----
document.querySelectorAll('.difficulty-selector button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.difficulty-selector button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        difficulty = this.dataset.diff;
        localStorage.setItem('snake_difficulty', difficulty);
        updateSpeed();
        resetGame();
    });
});

// ---- Start ----
initGame();
gameInterval = setInterval(gameLoop, speed);
console.log('🐍 Snake Pro loaded with food types, obstacles, lives, high-score.');
</script>
</body>
</html>
