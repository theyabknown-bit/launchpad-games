<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCore · Hospital Sim</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-container {
      max-width: 1100px;
      width: 100%;
      background: rgba(18, 28, 40, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 3rem;
      padding: 2rem;
      border: 1px solid rgba(100, 200, 255, 0.12);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      border-bottom: 1px solid rgba(100, 200, 255, 0.08);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      color: white;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 .logo {
      background: linear-gradient(135deg, #1a4a6a, #4fc3f7);
      padding: 0.3rem 0.8rem;
      border-radius: 50px;
      font-size: 0.8rem;
      color: white;
      font-weight: 700;
      letter-spacing: 1px;
      border: 1px solid #4fc3f7;
      box-shadow: 0 0 20px rgba(79,195,247,0.2);
    }
    .header h1 i { color: #4fc3f7; }
    .back-btn {
      background: #1a3045;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      text-decoration: none;
      color: #b0d4f0;
      border: 1px solid #2a5a7a;
      font-size: 0.9rem;
      transition: 0.15s;
    }
    .back-btn:hover { background: #2a4a6a; }

    .role-selector {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      background: rgba(0,0,0,0.2);
      padding: 0.8rem 1.2rem;
      border-radius: 1.5rem;
      border: 1px solid rgba(100, 200, 255, 0.06);
    }
    .role-btn {
      background: #1a2a3a;
      border: 2px solid #2a4a5a;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      color: #9bbfd9;
      cursor: pointer;
      font-weight: 500;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .role-btn:hover:not(.locked) { background: #2a4a6a; border-color: #4a8aaa; }
    .role-btn.active {
      background: #1a4a6a;
      border-color: #4fc3f7;
      color: white;
      box-shadow: 0 0 20px rgba(79, 195, 247, 0.15);
    }
    .role-btn.locked {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #3a2a2a;
    }
    .role-btn.locked::after {
      content: ' 🔒';
      font-size: 0.7rem;
    }
    .role-btn .cost-badge {
      font-size: 0.6rem;
      background: #2a1a1a;
      padding: 0.1rem 0.5rem;
      border-radius: 10px;
      color: #ffb347;
      margin-left: 4px;
    }
    .role-btn i { font-size: 1rem; }

    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 760px) { .main-grid { grid-template-columns: 1fr; } }

    .panel {
      background: rgba(10, 20, 30, 0.6);
      border-radius: 1.5rem;
      padding: 1.2rem;
      border: 1px solid rgba(100, 200, 255, 0.06);
    }
    .panel-title {
      color: #8ab4d8;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .patient-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 280px;
      overflow-y: auto;
    }
    .patient-list::-webkit-scrollbar { width: 4px; }
    .patient-list::-webkit-scrollbar-thumb { background: #2a5a7a; border-radius: 10px; }

    .patient-card {
      background: rgba(20, 40, 60, 0.4);
      border-radius: 1rem;
      padding: 0.8rem 1rem;
      border-left: 4px solid #4fc3f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .patient-card .info { display: flex; flex-direction: column; }
    .patient-card .name { color: white; font-weight: 600; font-size: 1rem; }
    .patient-card .detail { color: #8ab4d8; font-size: 0.8rem; }
    .patient-card .status { font-size: 0.75rem; padding: 0.15rem 0.8rem; border-radius: 20px; background: #1a3a2a; color: #7cf5b0; }
    .patient-card .status.critical { background: #3a1a1a; color: #ff7a7a; }
    .patient-card .status.stable { background: #1a2a3a; color: #7fc9ff; }
    .patient-card .action-btn {
      background: #1a4a6a;
      border: none;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.1s;
    }
    .patient-card .action-btn:hover { background: #2a6a8a; }
    .patient-card .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .stat-box {
      background: rgba(0,0,0,0.3);
      border-radius: 0.8rem;
      padding: 0.6rem 1rem;
      text-align: center;
    }
    .stat-box .val { color: white; font-size: 1.4rem; font-weight: 700; }
    .stat-box .label { color: #7f9fb9; font-size: 0.7rem; text-transform: uppercase; }
    .stat-box .val i { color: #4fc3f7; font-size: 1.2rem; margin-right: 4px; }

    .xp-bar {
      background: #0a1a2a;
      border-radius: 1rem;
      height: 18px;
      overflow: hidden;
      border: 1px solid #1a3a5a;
      margin: 0.5rem 0;
    }
    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #4fc3f7, #7cf5b0);
      border-radius: 1rem;
      transition: width 0.3s;
      width: 0%;
    }

    .log-area {
      background: rgba(0,0,0,0.3);
      border-radius: 0.8rem;
      padding: 0.6rem;
      max-height: 100px;
      overflow-y: auto;
      font-size: 0.8rem;
      color: #9bbfd9;
      border: 1px solid rgba(100, 200, 255, 0.05);
    }
    .log-area::-webkit-scrollbar { width: 4px; }
    .log-area::-webkit-scrollbar-thumb { background: #2a5a7a; border-radius: 10px; }
    .log-entry { padding: 0.2rem 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .log-entry i { margin-right: 6px; }

    .computer-panel {
      background: rgba(0, 20, 30, 0.5);
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid #1a3a5a;
      margin-top: 0.8rem;
    }
    .computer-panel .screen {
      background: #0a121a;
      border-radius: 0.6rem;
      padding: 0.8rem;
      font-family: 'Courier New', monospace;
      color: #7cf5b0;
      font-size: 0.85rem;
      min-height: 60px;
      border: 1px solid #1a3a5a;
    }
    .computer-panel .screen .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .action-bar {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }
    .action-bar .btn {
      background: #1a3a5a;
      border: 1px solid #2a5a7a;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.1s;
    }
    .action-bar .btn:hover { background: #2a5a7a; }
    .action-bar .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .level-up {
      background: linear-gradient(135deg, #1a4a3a, #2a6a4a);
      border: 2px solid #7cf5b0;
      border-radius: 1rem;
      padding: 0.8rem;
      text-align: center;
      color: white;
      margin: 0.5rem 0;
      display: none;
    }
    .level-up.show { display: block; }
    .level-up i { color: #ffd966; font-size: 1.5rem; }

    /* Mini-game overlay */
    .minigame-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .minigame-overlay.show { display: flex; }
    .minigame-box {
      background: #1a2a3a;
      border-radius: 2rem;
      padding: 2rem;
      max-width: 580px;
      width: 100%;
      border: 2px solid #4fc3f7;
      box-shadow: 0 0 60px rgba(79,195,247,0.15);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .minigame-box h2 {
      color: white;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .minigame-box h2 i { color: #ffb347; }
    .minigame-box .close-btn {
      position: sticky;
      top: 0;
      float: right;
      background: none;
      border: none;
      color: #6a8aaa;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
    }
    .minigame-box .close-btn:hover { color: white; }
    .minigame-content { color: #d0e8f0; }
    .minigame-content .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin: 1rem 0;
    }
    .minigame-content .option-btn {
      background: #0a1a2a;
      border: 2px solid #2a4a5a;
      padding: 0.8rem;
      border-radius: 1rem;
      color: white;
      cursor: pointer;
      transition: 0.1s;
      font-size: 1rem;
    }
    .minigame-content .option-btn:hover:not(:disabled) { background: #1a3a5a; border-color: #4fc3f7; }
    .minigame-content .option-btn.correct { border-color: #7cf5b0; background: #1a4a3a; }
    .minigame-content .option-btn.wrong { border-color: #ff7a7a; background: #4a1a1a; }
    .minigame-content .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .minigame-content .result-msg {
      padding: 0.8rem;
      border-radius: 0.8rem;
      margin: 0.8rem 0;
      text-align: center;
      font-weight: 600;
    }
    .minigame-content .result-msg.success { background: #1a4a3a; color: #7cf5b0; }
    .minigame-content .result-msg.fail { background: #4a1a1a; color: #ff7a7a; }
    .minigame-content .timer { color: #ffb347; font-size: 1.2rem; font-weight: 700; }

    .coworker-section {
      background: rgba(0,0,0,0.2);
      border-radius: 0.8rem;
      padding: 0.6rem;
      margin-top: 0.5rem;
      border: 1px solid rgba(100,200,255,0.05);
    }
    .coworker-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .coworker-item .name { color: #b0d4f0; font-size: 0.85rem; }
    .coworker-item .status { font-size: 0.7rem; color: #7cf5b0; }
    .coworker-item .hire-btn {
      background: #1a4a3a;
      border: 1px solid #2a6a4a;
      padding: 0.1rem 0.8rem;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      font-size: 0.7rem;
    }
    .coworker-item .hire-btn:hover { background: #2a6a4a; }
    .coworker-item .hire-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    @media (max-width: 500px) {
      .game-container { padding: 1rem; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .role-selector { flex-direction: column; }
      .role-btn { justify-content: center; }
      .minigame-box { padding: 1.2rem; }
      .minigame-content .options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <h1>
      <i class="fas fa-hospital"></i>
      MediCore
      <span class="logo"><i class="fas fa-heartbeat"></i> v2.0</span>
    </h1>
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> back</a>
  </div>

  <!-- Role Selector -->
  <div class="role-selector" id="roleSelector">
    <button class="role-btn active" data-role="doctor" data-cost="0"><i class="fas fa-user-md"></i> Doctor</button>
    <button class="role-btn locked" data-role="nurse" data-cost="30"><i class="fas fa-user-nurse"></i> Nurse <span class="cost-badge">30 XP</span></button>
    <button class="role-btn locked" data-role="surgeon" data-cost="50"><i class="fas fa-scalpel"></i> Surgeon <span class="cost-badge">50 XP</span></button>
    <button class="role-btn locked" data-role="admin" data-cost="80"><i class="fas fa-user-tie"></i> Admin <span class="cost-badge">80 XP</span></button>
  </div>

  <!-- Level Up Notification -->
  <div class="level-up" id="levelUpBox">
    <i class="fas fa-arrow-up"></i> <span id="levelUpText">LEVEL UP!</span>
  </div>

  <div class="main-grid">
    <!-- Left: Patients & Actions -->
    <div class="panel">
      <div class="panel-title">
        <span><i class="fas fa-bed"></i> Patients</span>
        <span style="font-size:0.7rem; color:#4a6a8a;" id="patientCount">0 active</span>
      </div>
      <div class="patient-list" id="patientList">
        <div style="color:#4a6a8a; text-align:center; padding:1rem;">No patients yet. Use "Admit" to start.</div>
      </div>

      <!-- Co-workers -->
      <div class="coworker-section">
        <div style="display:flex; justify-content:space-between; color:#6a8aaa; font-size:0.7rem; margin-bottom:0.3rem;">
          <span><i class="fas fa-users"></i> Co-workers</span>
          <span id="coworkerCount">0 hired</span>
        </div>
        <div id="coworkerList"></div>
      </div>

      <div class="action-bar">
        <button class="btn" id="admitBtn"><i class="fas fa-plus-circle"></i> Admit</button>
        <button class="btn" id="treatBtn"><i class="fas fa-heartbeat"></i> Treat</button>
        <button class="btn" id="dischargeBtn"><i class="fas fa-door-open"></i> Discharge</button>
        <button class="btn" id="restBtn"><i class="fas fa-coffee"></i> Rest</button>
        <button class="btn" id="askCoworkerBtn"><i class="fas fa-handshake"></i> Ask Help</button>
      </div>
    </div>

    <!-- Right: Stats, XP, Computer -->
    <div class="panel">
      <div class="panel-title">
        <span><i class="fas fa-chart-line"></i> Status</span>
        <span style="font-size:0.7rem; color:#4a6a8a;" id="roleDisplay">Doctor</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><div class="val" id="levelDisplay">1</div><div class="label">Level</div></div>
        <div class="stat-box"><div class="val" id="xpDisplay">0</div><div class="label">XP</div></div>
        <div class="stat-box"><div class="val" id="energyDisplay">100</div><div class="label">Energy</div></div>
        <div class="stat-box"><div class="val" id="treatedDisplay">0</div><div class="label">Treated</div></div>
      </div>

      <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#4a6a8a;">
        <span>XP to next: <span id="xpToNext">20</span></span>
        <span>Efficiency: <span id="efficiencyDisplay">100</span>%</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>

      <!-- Computer / Console -->
      <div class="computer-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
          <span style="color:#4a6a8a; font-size:0.7rem;"><i class="fas fa-desktop"></i> MediCore OS</span>
          <span style="color:#2a5a7a; font-size:0.6rem;" id="timeDisplay">00:00</span>
        </div>
        <div class="screen" id="computerScreen">
          <span style="color:#4a6a8a;">> system ready</span><br>
          <span style="color:#7cf5b0;">> welcome, doctor</span><span class="cursor">▌</span>
        </div>
      </div>

      <!-- Log -->
      <div class="panel-title" style="margin-top:0.8rem;"><span><i class="fas fa-list"></i> Log</span></div>
      <div class="log-area" id="logArea">
        <div class="log-entry"><i class="fas fa-info-circle" style="color:#4a6a8a;"></i> Welcome to MediCore v2.0</div>
      </div>
    </div>
  </div>
</div>

<!-- MINI-GAME OVERLAY -->
<div class="minigame-overlay" id="minigameOverlay">
  <div class="minigame-box">
    <button class="close-btn" id="closeMinigame"><i class="fas fa-times"></i></button>
    <h2 id="minigameTitle"><i class="fas fa-gamepad"></i> Mini-Game</h2>
    <div class="minigame-content" id="minigameContent">
      <div id="minigameBody"></div>
    </div>
  </div>
</div>

<script>
  // ===================== GAME STATE =====================
  const state = {
    role: 'doctor',
    level: 1,
    xp: 0,
    energy: 100,
    treated: 0,
    patients: [],
    log: [],
    time: 0,
    tickInterval: null,
    gameRunning: true,
    miniGameActive: false,
    coworkers: [],
    hiredCoworkers: [],
    roleUnlocked: { doctor: true, nurse: false, surgeon: false, admin: false },
    roleCosts: { doctor: 0, nurse: 30, surgeon: 50, admin: 80 },
  };

  const XP_PER_LEVEL = 25;
  const MAX_ENERGY = 100;
  const PATIENT_NAMES = ['Elena V.', 'Marcus T.', 'Sofia R.', 'James K.', 'Lily M.', 'Omar H.', 'Nina P.', 'David C.', 'Aisha W.', 'Leo G.'];
  const AILMENTS = ['Fever', 'Infection', 'Fracture', 'Flu', 'Migraine', 'Stomach Pain', 'Allergy', 'Pneumonia', 'Arthritis', 'Asthma'];
  const DIAGNOSIS_OPTIONS = ['Viral Infection', 'Bacterial Infection', 'Allergic Reaction', 'Stress-related', 'Nutritional Deficiency', 'Parasitic', 'Autoimmune', 'Fungal'];
  const SURGERY_STEPS = ['Clean incision', 'Clamp vessels', 'Remove tissue', 'Suture', 'Dress wound', 'Apply antiseptic', 'Close layers'];
  const MEDICINES = ['Amoxicillin', 'Ibuprofen', 'Paracetamol', 'Metformin', 'Lisinopril', 'Omeprazole', 'Ciprofloxacin', 'Prednisone'];
  const COWORKER_NAMES = ['Dr. Sarah Chen', 'Nurse Mike Ross', 'Dr. Emily Park', 'Nurse Anna Kim', 'Dr. James Wong', 'Nurse Lisa Torres'];

  // DOM refs
  const patientList = document.getElementById('patientList');
  const patientCount = document.getElementById('patientCount');
  const levelDisplay = document.getElementById('levelDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const energyDisplay = document.getElementById('energyDisplay');
  const treatedDisplay = document.getElementById('treatedDisplay');
  const xpFill = document.getElementById('xpFill');
  const xpToNext = document.getElementById('xpToNext');
  const efficiencyDisplay = document.getElementById('efficiencyDisplay');
  const computerScreen = document.getElementById('computerScreen');
  const logArea = document.getElementById('logArea');
  const levelUpBox = document.getElementById('levelUpBox');
  const levelUpText = document.getElementById('levelUpText');
  const roleDisplay = document.getElementById('roleDisplay');
  const timeDisplay = document.getElementById('timeDisplay');
  const coworkerList = document.getElementById('coworkerList');
  const coworkerCount = document.getElementById('coworkerCount');

  // Mini-game refs
  const minigameOverlay = document.getElementById('minigameOverlay');
  const minigameBody = document.getElementById('minigameBody');
  const minigameTitle = document.getElementById('minigameTitle');
  const closeMinigameBtn = document.getElementById('closeMinigame');

  let minigameCallback = null;
  let surgeryCurrentStep = 0;
  let surgerySteps = [];
  let timerInterval = null;

  // ===================== HELPERS =====================
  function random(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function getEfficiency() {
    let base = 100;
    if (state.role === 'doctor') base = 110;
    else if (state.role === 'surgeon') base = 130;
    else if (state.role === 'nurse') base = 105;
    else if (state.role === 'admin') base = 95;
    if (state.energy < 30) base -= 35;
    else if (state.energy < 50) base -= 20;
    base += state.level * 3;
    base += state.hiredCoworkers.length * 5;
    return Math.min(180, Math.max(40, base));
  }

  function getXpForLevel() { return XP_PER_LEVEL + (state.level - 1) * 8; }

  function addLog(msg, icon = 'fa-info-circle', color = '#4a6a8a') {
    state.log.unshift({ msg, icon, color });
    if (state.log.length > 30) state.log.pop();
    renderLog();
  }

  function renderLog() {
    logArea.innerHTML = state.log.map(e =>
      `<div class="log-entry"><i class="fas ${e.icon}" style="color:${e.color};"></i> ${e.msg}</div>`
    ).join('');
  }

  function updateComputer(text, color = '#7cf5b0') {
    const lines = computerScreen.innerHTML.split('<br>');
    if (lines.length > 5) lines.shift();
    const newLine = `<span style="color:${color};">> ${text}</span>`;
    lines.push(newLine);
    computerScreen.innerHTML = lines.join('<br>') + '<span class="cursor">▌</span>';
    computerScreen.scrollTop = computerScreen.scrollHeight;
  }

  function addXP(amount) {
    const eff = getEfficiency() / 100;
    const actual = Math.round(amount * eff);
    state.xp += actual;
    state.treated += 1;
    updateUI();
    addLog(`+${actual} XP (${Math.round(eff*100)}% efficiency)`, 'fa-star', '#ffd966');
    updateComputer(`+${actual} XP earned`, '#ffd966');
    checkLevelUp();
    checkRoleUnlocks();
  }

  function checkLevelUp() {
    const needed = getXpForLevel();
    while (state.xp >= needed) {
      state.xp -= needed;
      state.level++;
      state.energy = Math.min(MAX_ENERGY, state.energy + 25);
      addLog(`🎉 LEVEL UP! You are now level ${state.level}`, 'fa-trophy', '#ffd966');
      updateComputer(`🎉 LEVEL ${state.level} REACHED!`, '#ffd966');
      levelUpBox.classList.add('show');
      levelUpText.textContent = `LEVEL ${state.level}! +${state.level*3}% efficiency`;
      setTimeout(() => levelUpBox.classList.remove('show'), 3000);
      updateUI();
    }
    updateUI();
  }

  function checkRoleUnlocks() {
    const roles = ['nurse', 'surgeon', 'admin'];
    let changed = false;
    roles.forEach(role => {
      if (!state.roleUnlocked[role] && state.xp >= state.roleCosts[role]) {
        state.roleUnlocked[role] = true;
        changed = true;
        addLog(`🔓 ${role.charAt(0).toUpperCase()+role.slice(1)} role unlocked!`, 'fa-unlock', '#4fc3f7');
        updateComputer(`role ${role} unlocked!`, '#4fc3f7');
      }
    });
    if (changed) updateRoleButtons();
  }

  // ===================== PATIENT SYSTEM =====================
  function generatePatient() {
    const name = random(PATIENT_NAMES);
    const ailment = random(AILMENTS);
    const severity = rand(2, 6);
    const treatmentTime = rand(3, 8);
    return {
      id: Date.now() + Math.random(),
      name,
      ailment,
      severity,
      treatmentTime,
      progress: 0,
      status: 'waiting',
      miniGameDone: false,
    };
  }

  function admitPatient() {
    if (state.energy < 10) {
      addLog('Too tired to admit! Rest first.', 'fa-exclamation-triangle', '#ff7a7a');
      updateComputer('energy low! rest required', '#ff7a7a');
      return;
    }
    if (state.patients.length >= 7) {
      addLog('Ward is full! Discharge someone first.', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    const patient = generatePatient();
    state.patients.push(patient);
    state.energy -= 6;
    addLog(`Admitted ${patient.name} (${patient.ailment})`, 'fa-user-plus', '#4fc3f7');
    updateComputer(`admitted: ${patient.name} - ${patient.ailment}`, '#4fc3f7');
    updateUI();
    renderPatients();
  }

  // ===================== CO-WORKER SYSTEM =====================
  function initCoworkers() {
    state.coworkers = COWORKER_NAMES.map(name => ({
      name,
      hired: false,
      cooldown: 0,
    }));
    renderCoworkers();
  }

  function renderCoworkers() {
    const available = state.coworkers.filter(c => !c.hired);
    if (available.length === 0) {
      coworkerList.innerHTML = '<div style="color:#4a6a8a; font-size:0.8rem;">All co-workers hired!</div>';
      coworkerCount.textContent = `${state.hiredCoworkers.length} hired`;
      return;
    }
    coworkerList.innerHTML = available.slice(0, 3).map(c => `
      <div class="coworker-item">
        <span class="name">${c.name}</span>
        <button class="hire-btn" onclick="hireCoworker('${c.name}')" ${state.xp < 40 ? 'disabled' : ''}>
          <i class="fas fa-user-plus"></i> Hire (40 XP)
        </button>
      </div>
    `).join('');
    coworkerCount.textContent = `${state.hiredCoworkers.length} hired`;
  }

  function hireCoworker(name) {
    if (state.xp < 40) {
      addLog('Not enough XP to hire! (need 40)', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    const coworker = state.coworkers.find(c => c.name === name && !c.hired);
    if (!coworker) return;
    coworker.hired = true;
    state.hiredCoworkers.push(coworker);
    state.xp -= 40;
    addLog(`Hired ${name} as a co-worker!`, 'fa-user-plus', '#7cf5b0');
    updateComputer(`hired ${name}`, '#7cf5b0');
    updateUI();
    renderCoworkers();
    checkRoleUnlocks();
  }

  function askCoworkerHelp() {
    if (state.hiredCoworkers.length === 0) {
      addLog('No co-workers hired! Hire one first.', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    if (state.patients.length === 0) {
      addLog('No patients to help with.', 'fa-info-circle', '#4a6a8a');
      return;
    }
    const available = state.hiredCoworkers.filter(c => c.cooldown === 0);
    if (available.length === 0) {
      addLog('All co-workers are on cooldown!', 'fa-exclamation-triangle', '#ffb347');
      return;
    }
    const helper = random(available);
    helper.cooldown = 5;
    const waiting = state.patients.filter(p => p.status === 'waiting' || p.status === 'treating');
    if (waiting.length === 0) {
      addLog('No patients need treatment.', 'fa-info-circle', '#4a6a8a');
      return;
    }
    const patient = random(waiting);
    const progressAmount = Math.round((4 + state.level * 0.5) * (getEfficiency()/100));
    patient.progress += progressAmount;
    patient.status = 'treating';
    addLog(`${helper.name} helped treat ${patient.name} (+${progressAmount})`, 'fa-handshake', '#7cf5b0');
    updateComputer(`${helper.name} helped with ${patient.name}`, '#7cf5b0');
    if (patient.progress >= patient.treatmentTime) completeTreatment(patient);
    renderPatients();
    updateUI();
    renderCoworkers();
  }

  // ===================== MINI-GAMES =====================
  function startMiniGame(patient, onComplete) {
    if (state.miniGameActive) return;
    state.miniGameActive = true;
    const games = ['diagnosis', 'surgery', 'pharmacy'];
    const gameType = random(games);
    minigameOverlay.classList.add('show');
    if (gameType === 'diagnosis') startDiagnosisGame(patient, onComplete);
    else if (gameType === 'surgery') startSurgeryGame(patient, onComplete);
    else if (gameType === 'pharmacy') startPharmacyGame(patient, onComplete);
  }

  function closeMinigame() {
    if (timerInterval) clearInterval(timerInterval);
    minigameOverlay.classList.remove('show');
    state.miniGameActive = false;
    if (minigameCallback) {
      minigameCallback(false);
      minigameCallback = null;
    }
  }

  // ---- DIAGNOSIS GAME ----
  function startDiagnosisGame(patient, onComplete) {
    minigameTitle.innerHTML = '<i class="fas fa-stethoscope"></i> Advanced Diagnosis';
    const correct = random(DIAGNOSIS_OPTIONS);
    const wrongs = DIAGNOSIS_OPTIONS.filter(o => o !== correct).sort(() => Math.random() - 0.5).slice(0, 5);
    const options = [correct, ...wrongs].sort(() => Math.random() - 0.5);
    const symptoms = ['Fever, cough, fatigue, night sweats','Headache, nausea, dizziness, blurred vision','Rash, itching, swelling, difficulty breathing','Joint pain, stiffness, redness, swelling','Chest pain, shortness of breath, palpitations','Abdominal pain, diarrhea, vomiting, dehydration','Fatigue, weight loss, increased thirst','Muscle weakness, tremors, anxiety'];
    const symptom = random(symptoms);
    let timeLeft = 15, timerRunning = true;

    minigameBody.innerHTML = `
      <p style="margin-bottom:0.5rem;"><strong>Patient:</strong> ${patient.name}</p>
      <p style="margin-bottom:0.5rem;"><strong>Symptoms:</strong> ${symptom}</p>
      <p style="margin-bottom:0.5rem;">What is the most likely diagnosis?</p>
      <div class="timer" id="diagTimer">⏱️ ${timeLeft}s</div>
      <div class="options">${options.map(opt => `<button class="option-btn" data-answer="${opt}">${opt}</button>`).join('')}</div>
      <div id="diagResult"></div>
    `;
    const btns = minigameBody.querySelectorAll('.option-btn');
    const timerDisplay = document.getElementById('diagTimer');
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = `⏱️ ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval); timerRunning = false;
        btns.forEach(b => b.disabled = true);
        document.getElementById('diagResult').innerHTML = `<div class="result-msg fail"><i class="fas fa-clock"></i> Time\'s up! The answer was: ${correct}</div>`;
        setTimeout(() => { closeMinigame(); renderPatients(); updateUI(); }, 2000);
      }
    }, 1000);
    btns.forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.disabled || !timerRunning) return;
        clearInterval(timerInterval);
        btns.forEach(b => b.disabled = true);
        const isCorrect = this.dataset.answer === correct;
        const resultDiv = document.getElementById('diagResult');
        if (isCorrect) {
          this.classList.add('correct');
          const bonus = Math.max(5, timeLeft);
          resultDiv.innerHTML = `<div class="result-msg success"><i class="fas fa-check-circle"></i> Correct! +${15 + bonus} XP (time bonus ${bonus})</div>`;
          addXP(15 + bonus);
          patient.miniGameDone = true;
          onComplete(true);
        } else {
          this.classList.add('wrong');
          btns.forEach(b => { if (b.dataset.answer === correct) b.classList.add('correct'); });
          resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-times-circle"></i> Wrong. The answer was: ${correct}</div>`;
          onComplete(false);
        }
        setTimeout(() => { closeMinigame(); renderPatients(); updateUI(); }, 2500);
      });
    });
  }

  // ---- SURGERY GAME ----
  function startSurgeryGame(patient, onComplete) {
    minigameTitle.innerHTML = '<i class="fas fa-scalpel"></i> Critical Surgery';
    const allSteps = ['Clean incision', 'Clamp vessels', 'Remove tissue', 'Suture', 'Dress wound', 'Apply antiseptic', 'Close layers'];
    surgerySteps = allSteps.sort(() => Math.random() - 0.5).slice(0, rand(5, 7));
    let currentStep = 0, mistakes = 0, maxMistakes = 2, timeLeft = 20, timerRunning = true;

    minigameBody.innerHTML = `
      <p style="margin-bottom:0.5rem;"><strong>Patient:</strong> ${patient.name}</p>
      <p style="margin-bottom:0.5rem;">Perform surgery in the correct order! (${maxMistakes+1} mistakes allowed)</p>
      <div class="timer" id="surgeryTimer">⏱️ ${timeLeft}s</div>
      <div id="surgeryProgress" style="margin-bottom:0.5rem; color:#6a8aaa;">Step ${currentStep+1}/${surgerySteps.length}</div>
      <div class="options" id="surgeryOptions">${surgerySteps.map((step, i) => `<button class="option-btn" data-index="${i}">${step}</button>`).join('')}</div>
      <div id="surgeryResult"></div>
    `;
    const btns = minigameBody.querySelectorAll('.option-btn');
    const progressDiv = document.getElementById('surgeryProgress');
    const timerDisplay = document.getElementById('surgeryTimer');
    const resultDiv = document.getElementById('surgeryResult');
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = `⏱️ ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval); timerRunning = false;
        btns.forEach(b => b.disabled = true);
        resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-clock"></i> Surgery failed! Time ran out.</div>`;
        setTimeout(() => { closeMinigame(); renderPatients(); updateUI(); }, 2000);
      }
    }, 1000);
    btns.forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.disabled || !timerRunning) return;
        const idx = parseInt(this.dataset.index);
        if (idx === currentStep) {
          this.classList.add('correct'); this.disabled = true; currentStep++;
          progressDiv.textContent = `Step ${currentStep+1}/${surgerySteps.length}`;
          if (currentStep === surgerySteps.length) {
            clearInterval(timerInterval);
            const bonus = Math.max(5, timeLeft);
            resultDiv.innerHTML = `<div class="result-msg success"><i class="fas fa-check-circle"></i> Surgery successful! +${20 + bonus} XP (time bonus ${bonus})</div>`;
            addXP(20 + bonus);
            patient.miniGameDone = true;
            onComplete(true);
            setTimeout(() => { closeMinigame(); renderPatients(); updateUI(); }, 2500);
          }
        } else {
          mistakes++;
          this.classList.add('wrong');
          setTimeout(() => this.classList.remove('wrong'), 500);
          if (mistakes > maxMistakes) {
            clearInterval(timerInterval); timerRunning = false;
            btns.forEach(b => b.disabled = true);
            resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-times-circle"></i> Too many mistakes! Surgery failed.</div>`;
            setTimeout(() => { closeMinigame(); renderPatients(); updateUI(); }, 2000);
          }
        }
      });
    });
  }

    }, 1000);

  // ===================== TREAT PATIENT =====================
  function treatPatient() {
    if (state.energy < 15) {
      addLog('Too exhausted to treat!', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    const waiting = state.patients.filter(p => p.status === 'waiting' || p.status === 'treating');
    if (waiting.length === 0) {
      addLog('No patients to treat.', 'fa-info-circle', '#4a6a8a');
      return;
    }
    const patient = waiting[0];
    if (!patient.miniGameDone && patient.status !== 'treating') {
      startMiniGame(patient, (success) => {
        if (success) {
          const progressAmount = Math.round((6 + state.level * 0.5) * (getEfficiency()/100));
          patient.progress += progressAmount;
          patient.status = 'treating';
          state.energy -= 5;
          addLog(`Mini-game success! ${patient.name} progress +${progressAmount}`, 'fa-star', '#7cf5b0');
          updateComputer(`mini-game: ${patient.name} improved`, '#7cf5b0');
          if (patient.progress >= patient.treatmentTime) completeTreatment(patient);
        } else {
          const progressAmount = Math.round(3 * (getEfficiency()/100));
          patient.progress += progressAmount;
          patient.status = 'treating';
          state.energy -= 3;
          addLog(`Mini-game failed. ${patient.name} progress +${progressAmount}`, 'fa-exclamation-triangle', '#ffb347');
          updateComputer(`mini-game failed for ${patient.name}`, '#ffb347');
          if (patient.progress >= patient.treatmentTime) completeTreatment(patient);
        }
        renderPatients();
        updateUI();
      });
      return;
    }
    const eff = getEfficiency() / 100;
    const progressAmount = Math.round((4 + state.level * 0.5) * eff);
    patient.progress += progressAmount;
    patient.status = 'treating';
    state.energy -= 8;
    addLog(`Treating ${patient.name} (${patient.progress}/${patient.treatmentTime})`, 'fa-heartbeat', '#7cf5b0');
    updateComputer(`treating ${patient.name}... ${patient.progress}/${patient.treatmentTime}`, '#7cf5b0');
    if (patient.progress >= patient.treatmentTime) completeTreatment(patient);
    renderPatients();
    updateUI();
  }

  function completeTreatment(patient) {
    patient.status = 'stable';
    const xpGain = 12 + patient.severity * 3 + state.level;
    addXP(xpGain);
    addLog(`✅ ${patient.name} is stable! +${xpGain} XP`, 'fa-check-circle', '#7cf5b0');
    updateComputer(`✅ ${patient.name} recovered!`, '#7cf5b0');
    setTimeout(() => {
      if (state.patients.includes(patient)) dischargePatient(patient.id);
    }, 3000);
    renderPatients();
    updateUI();
  }

  function dischargePatient(id) {
    const idx = state.patients.findIndex(p => p.id === id);
    if (idx === -1) return;
    const p = state.patients[idx];
    if (p.status !== 'stable' && p.status !== 'critical') {
      addLog(`Can't discharge ${p.name} - not stable.`, 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    state.patients.splice(idx, 1);
    state.energy -= 3;
    addLog(`Discharged ${p.name}`, 'fa-door-open', '#4fc3f7');
    updateComputer(`discharged: ${p.name}`, '#4fc3f7');
    renderPatients();
    updateUI();
  }

  function dischargeRandom() {
    const stable = state.patients.filter(p => p.status === 'stable' || p.status === 'critical');
    if (stable.length === 0) {
      addLog('No stable patients to discharge.', 'fa-info-circle', '#4a6a8a');
      return;
    }
    dischargePatient(stable[0].id);
  }

  function rest() {
    state.energy = Math.min(MAX_ENERGY, state.energy + 30);
    addLog(`Rested. Energy: ${state.energy}`, 'fa-coffee', '#ffb347');
    updateComputer(`energy restored to ${state.energy}`, '#ffb347');
    updateUI();
  }

  // ===================== RENDER =====================
  function renderPatients() {
    if (state.patients.length === 0) {
      patientList.innerHTML = `<div style="color:#4a6a8a; text-align:center; padding:1rem;">No patients. Admit someone!</div>`;
      patientCount.textContent = '0 active';
      return;
    }
    patientList.innerHTML = state.patients.map(p => {
      const statusClass = p.status === 'critical' ? 'critical' : p.status === 'stable' ? 'stable' : '';
      const statusLabel = p.status === 'waiting' ? '⏳ Waiting' : p.status === 'treating' ? '💉 Treating' : p.status === 'stable' ? '✅ Stable' : '⚠️ Critical';
      const progress = p.progress > 0 ? `${p.progress}/${p.treatmentTime}` : '—';
      const miniGameIcon = p.miniGameDone ? ' 🎮' : '';
      return `
        <div class="patient-card">
          <div class="info">
            <div class="name">${p.name}${miniGameIcon}</div>
            <div class="detail">${p.ailment} · severity ${p.severity} · ${progress}</div>
          </div>
          <div class="status ${statusClass}">${statusLabel}</div>
          <button class="action-btn" onclick="window.dischargePatient(${p.id})" ${p.status !== 'stable' && p.status !== 'critical' ? 'disabled' : ''}>
            <i class="fas fa-door-open"></i>
          </button>
        </div>
      `;
    }).join('');
    patientCount.textContent = `${state.patients.length} active`;
  }

  function updateUI() {
    levelDisplay.textContent = state.level;
    xpDisplay.textContent = state.xp;
    energyDisplay.textContent = state.energy;
    treatedDisplay.textContent = state.treated;
    const needed = getXpForLevel();
    const pct = Math.min(100, (state.xp / needed) * 100);
    xpFill.style.width = pct + '%';
    xpToNext.textContent = needed - state.xp;
    efficiencyDisplay.textContent = Math.round(getEfficiency());
    roleDisplay.textContent = state.role.charAt(0).toUpperCase() + state.role.slice(1);
    if (state.energy < 30) energyDisplay.style.color = '#ff7a7a';
    else if (state.energy < 60) energyDisplay.style.color = '#ffb347';
    else energyDisplay.style.color = '#7cf5b0';
    renderCoworkers();
  }

  // ===================== ROLE SYSTEM =====================
  function updateRoleButtons() {
    document.querySelectorAll('.role-btn').forEach(btn => {
      const role = btn.dataset.role;
      const cost = parseInt(btn.dataset.cost);
      if (state.role === role) {
        btn.classList.add('active');
        btn.classList.remove('locked');
      } else if (state.roleUnlocked[role] || role === 'doctor') {
        btn.classList.remove('locked');
        btn.classList.remove('active');
      } else {
        btn.classList.add('locked');
        btn.classList.remove('active');
      }
    });
  }

  function setRole(role) {
    if (role === state.role) return;
    if (!state.roleUnlocked[role] && role !== 'doctor') {
      addLog(`Role ${role} is locked! Earn ${state.roleCosts[role]} XP to unlock.`, 'fa-lock', '#ff7a7a');
      return;
    }
    state.role = role;
    addLog(`Switched to ${role}`, 'fa-sync', '#4fc3f7');
    updateComputer(`role set to ${role}`, '#4fc3f7');
    updateUI();
    updateRoleButtons();
  }

  // ===================== TIME SYSTEM =====================
  function tick() {
    if (!state.gameRunning) return;
    state.time++;
    const mins = Math.floor(state.time / 60);
    const secs = state.time % 60;
    timeDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    if (state.time % 3 === 0 && state.patients.length > 0) state.energy = Math.max(0, state.energy - 1);
    state.hiredCoworkers.forEach(c => { if (c.cooldown > 0) c.cooldown--; });
    if (state.time % 7 === 0 && state.patients.length < 6 && state.energy > 20) {
      if (Math.random() < 0.45) admitPatient();
    }
    if (state.time % 10 === 0 && state.patients.length > 0) {
      const p = random(state.patients);
      if (p.status !== 'stable' && Math.random() < 0.12) {
        p.status = 'critical';
        addLog(`⚠️ ${p.name} became critical!`, 'fa-exclamation-triangle', '#ff7a7a');
        updateComputer(`⚠️ ${p.name} CRITICAL!`, '#ff7a7a');
      }
    }
    if (state.time % 5 === 0) {
      const stable = state.patients.filter(p => p.status === 'stable');
      if (stable.length > 3) dischargePatient(stable[0].id);
    }
    renderPatients();
    updateUI();
  }

  // ===================== INIT =====================
  function init() {
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', () => setRole(btn.dataset.role));
    });
    document.getElementById('admitBtn').addEventListener('click', admitPatient);
    document.getElementById('treatBtn').addEventListener('click', treatPatient);
    document.getElementById('dischargeBtn').addEventListener('click', dischargeRandom);
    document.getElementById('restBtn').addEventListener('click', rest);
    document.getElementById('askCoworkerBtn').addEventListener('click', askCoworkerHelp);
    closeMinigameBtn.addEventListener('click', closeMinigame);

    initCoworkers();
    for (let i = 0; i < 2; i++) {
      const p = generatePatient();
      p.status = 'waiting';
      state.patients.push(p);
    }
    addLog('🏥 MediCore v2.0 initialized', 'fa-hospital', '#4fc3f7');
    updateComputer('system ready', '#4fc3f7');
    updateUI();
    updateRoleButtons();
    renderPatients();

    state.tickInterval = setInterval(tick, 1500);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'a') admitPatient();
      else if (e.key === 't') treatPatient();
      else if (e.key === 'd') dischargeRandom();
      else if (e.key === 'r') rest();
      else if (e.key === 'h') askCoworkerHelp();
      else if (e.key === 'Escape') closeMinigame();
    });
  }

  window.dischargePatient = dischargePatient;
  window.hireCoworker = hireCoworker;
  init();
</script>
</body>
</html>
