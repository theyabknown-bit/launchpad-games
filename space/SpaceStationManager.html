<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Station Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(10,14,30,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #2a3f5a;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; display: flex; align-items: center; gap: 10px; justify-content: center; }
    h1 i { color: #7fc9ff; }
    .back { display: inline-block; margin-bottom: 1rem; color: #b6ddf5; text-decoration: none; background: #1c4055; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #3a6b88; }
    .back:hover { background: #2a5a78; }
    .station-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.6rem; margin: 1rem 0; }
    .module {
      background: rgba(0,0,0,0.3); border-radius: 1rem; padding: 0.8rem;
      border: 2px solid #1a3a5a; cursor: pointer; transition: 0.15s;
    }
    .module:hover:not(.built) { border-color: #4a8aaa; transform: scale(1.02); }
    .module.built { border-color: #7cf5b0; background: rgba(26,74,58,0.2); }
    .module .icon { font-size: 2rem; }
    .module .name { color: white; font-size: 0.8rem; margin-top: 0.2rem; }
    .module .cost { color: #6a8aaa; font-size: 0.7rem; }
    .module .status { font-size: 0.6rem; padding: 0.1rem 0.5rem; border-radius: 20px; background: #1a3a2a; color: #7cf5b0; display: inline-block; margin-top: 0.2rem; }
    .module .status.not-built { background: #3a1a1a; color: #ff7a7a; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin: 0.8rem 0; }
    .stat-box { background: rgba(0,0,0,0.3); border-radius: 0.8rem; padding: 0.5rem; text-align: center; }
    .stat-box .val { color: white; font-size: 1.2rem; font-weight: 700; }
    .stat-box .label { color: #7f9fb9; font-size: 0.7rem; text-transform: uppercase; }
    .action-bar { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin: 0.5rem 0; }
    .action-bar .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.5rem 1.2rem; border-radius: 40px; color: white; cursor: pointer; transition: 0.15s; }
    .action-bar .btn:hover { background: #2a5a7a; }
    .action-bar .btn.danger { background: #4a1a1a; border-color: #6a2a2a; }
    .action-bar .btn.danger:hover { background: #6a2a2a; }
    .message { margin-top: 0.5rem; padding: 0.6rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; font-size: 0.9rem; }
    .xp-bar { background: #0a1a2a; border-radius: 1rem; height: 16px; overflow: hidden; border: 1px solid #1a3a5a; margin: 0.3rem 0; }
    .xp-fill { height: 100%; background: linear-gradient(90deg, #4fc3f7, #7cf5b0); border-radius: 1rem; transition: width 0.3s; width: 0%; }
    @media (max-width: 500px) { .station-grid { grid-template-columns: 1fr 1fr; } .stats-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-rocket"></i> Space Station</h1>
  
  <div class="stats-grid">
    <div class="stat-box"><div class="val" id="resourcesDisplay">50</div><div class="label">Resources</div></div>
    <div class="stat-box"><div class="val" id="energyDisplay">100</div><div class="label">Energy</div></div>
    <div class="stat-box"><div class="val" id="crewDisplay">3</div><div class="label">Crew</div></div>
  </div>

  <div class="station-grid" id="moduleGrid"></div>

  <div class="action-bar">
    <button class="btn" id="collectBtn"><i class="fas fa-hand-holding-heart"></i> Collect</button>
    <button class="btn danger" id="resetBtn"><i class="fas fa-rotate"></i> Reset</button>
  </div>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> Click modules to build them!</div>
  
  <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#4a6a8a;">
    <span>Level: <span id="levelDisplay">1</span></span>
    <span>XP: <span id="xpDisplay">0</span></span>
  </div>
  <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
</div>

<script>
  const MODULES = [
    { id: 'solar', name: 'Solar Panels', icon: '☀️', cost: 20, energy: 15, crew: 0, desc: '+15 Energy' },
    { id: 'habitat', name: 'Habitat', icon: '🏠', cost: 30, energy: -5, crew: 2, desc: '+2 Crew' },
    { id: 'lab', name: 'Research Lab', icon: '🔬', cost: 40, energy: -10, crew: 1, desc: '+1 Crew, -10 Energy' },
    { id: 'farm', name: 'Hydroponics', icon: '🌱', cost: 25, energy: -8, crew: 0, desc: 'Food production' },
    { id: 'dorm', name: 'Crew Dorm', icon: '🛏️', cost: 35, energy: -5, crew: 3, desc: '+3 Crew' },
    { id: 'reactor', name: 'Fusion Reactor', icon: '⚡', cost: 50, energy: 30, crew: 1, desc: '+30 Energy' }
  ];

  let resources = 50, energy = 100, crew = 3, level = 1, xp = 0, xpToNext = 20;
  let built = {};

  const moduleGrid = document.getElementById('moduleGrid');
  const resourcesDisplay = document.getElementById('resourcesDisplay');
  const energyDisplay = document.getElementById('energyDisplay');
  const crewDisplay = document.getElementById('crewDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const xpFill = document.getElementById('xpFill');
  const messageBox = document.getElementById('messageBox');

  function addXP(amount) {
    xp += amount;
    while (xp >= xpToNext) {
      xp -= xpToNext;
      level++;
      xpToNext = Math.floor(xpToNext * 1.2) + 10;
      messageBox.innerHTML = `<i class="fas fa-trophy" style="color:#ffd700;"></i> 🎉 LEVEL UP! You're now level ${level}!`;
    }
    updateUI();
  }

  function buildModule(id) {
    if (built[id]) { messageBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Already built!'; return; }
    const mod = MODULES.find(m => m.id === id);
    if (resources < mod.cost) { messageBox.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Need ${mod.cost} resources!`; return; }
    resources -= mod.cost;
    energy += mod.energy || 0;
    crew += mod.crew || 0;
    built[id] = true;
    const xpGain = 5 + Math.floor(mod.cost / 5);
    addXP(xpGain);
    messageBox.innerHTML = `<i class="fas fa-check-circle" style="color:#7cf5b0;"></i> ${mod.name} built! +${xpGain} XP`;
    updateUI();
    renderModules();
  }

  function collect() {
    const bonus = Object.keys(built).length * 2 + level;
    resources += 5 + bonus;
    energy = Math.min(150, energy + 5);
    const xpGain = 2 + Math.floor(bonus / 2);
    addXP(xpGain);
    messageBox.innerHTML = `<i class="fas fa-hand-holding-heart"></i> Collected ${5+bonus} resources, +${xpGain} XP`;
    updateUI();
  }

  function renderModules() {
    moduleGrid.innerHTML = MODULES.map(m => `
      <div class="module ${built[m.id]?'built':''}" onclick="buildModule('${m.id}')">
        <div class="icon">${m.icon}</div>
        <div class="name">${m.name}</div>
        <div class="cost">💰 ${m.cost}</div>
        <div class="status ${built[m.id]?'':'not-built'}">${built[m.id]?'✅ Built':'🔨 Build'}</div>
      </div>
    `).join('');
  }

  function updateUI() {
    resourcesDisplay.textContent = resources;
    energyDisplay.textContent = energy;
    crewDisplay.textContent = crew;
    levelDisplay.textContent = level;
    xpDisplay.textContent = xp;
    const pct = Math.min(100, (xp / xpToNext) * 100);
    xpFill.style.width = pct + '%';
  }

  function resetGame() {
    if (!confirm('Reset station?')) return;
    resources = 50; energy = 100; crew = 3; level = 1; xp = 0; xpToNext = 20; built = {};
    renderModules(); updateUI();
    messageBox.innerHTML = '<i class="fas fa-rotate"></i> Station reset!';
  }

  document.getElementById('collectBtn').addEventListener('click', collect);
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  window.buildModule = buildModule;
  renderModules(); updateUI();
</script>
</body>
</html>
