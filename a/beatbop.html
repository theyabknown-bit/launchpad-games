<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Beat Bop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.beat-btn{width:100%;padding:30px;border-radius:12px;border:3px solid #2a4a5e;background:#1a3344;font-size:3rem;cursor:pointer;transition:0.15s;touch-action:manipulation;}
.beat-btn:active{transform:scale(0.95);}
.beat-btn.hit{background:#1a4a3a;border-color:#7cf5b0;}
.beat-btn.miss{background:#3a1a1a;border-color:#ff6b6b;}
.beat-display{font-size:2rem;margin:20px 0;min-height:50px;color:#ffd93d;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-music" style="color:#ff6b6b;"></i> Beat Bop</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="combo">0</span><span class="label">Combo</span></div>
    </div>
    <div class="beat-display" id="beatDisplay">🎵 Tap the beat!</div>
    <button class="beat-btn" id="beatBtn">👆</button>
    <div class="message" id="message">🎯 Tap to the rhythm!</div>
</div>
<script>
function updateGameProgress(gameId){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.games)s.games={};if(!s.games[gameId])s.games[gameId]={played:false,xp:0};var g=s.games[gameId];if(!g.played){g.played=true;s.gamesPlayed=(s.gamesPlayed||0)+1;}g.xp=(g.xp||0)+1;var t=0,p=0;Object.values(s.games).forEach(function(x){t+=(x.xp||0);if(x.played)p++;});s.totalXp=t;s.gamesPlayed=p;localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

let score=0,combo=0,beats=0,lastBeat=0;
const beatBtn=document.getElementById('beatBtn');
const scoreDisplay=document.getElementById('score'),comboDisplay=document.getElementById('combo');
const beatDisplay=document.getElementById('beatDisplay'),msg=document.getElementById('message');

function playTone(freq,dur=150){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.value=0.15;gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur/1000);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+dur/1000);}catch(e){}}

function hitBeat(){
    const now=Date.now();
    const diff=now-lastBeat;
    const hit=true;
    if(hit){
        combo++;
        score+=combo*2;
        playTone(440+combo*20);
        beatBtn.classList.add('hit');
        setTimeout(()=>beatBtn.classList.remove('hit'),200);
        beatDisplay.textContent='💥 BOOM!';
        msg.textContent='🔥 Combo x'+combo;
    }
    if(combo>50){
        beatDisplay.textContent='🌈 GODLIKE!';
    }else if(combo>30){
        beatDisplay.textContent='⚡ AMAZING!';
    }else if(combo>15){
        beatDisplay.textContent='🌟 GREAT!';
    }else if(combo>5){
        beatDisplay.textContent='👍 GOOD!';
    }
    scoreDisplay.textContent=score;
    comboDisplay.textContent=combo;
    lastBeat=now;
    updateGameProgress('beatbop');
}

beatBtn.addEventListener('click',hitBeat);
document.addEventListener('keydown',(e)=>{if(e.key===' '||e.key==='Space'){e.preventDefault();hitBeat();}});
msg.textContent='🎯 Tap to the rhythm!';
</script>
</body>
</html>
