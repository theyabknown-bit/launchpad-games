<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛡️ ScamSavvy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.question{font-size:1.3rem;margin:20px 0;padding:20px;background:#1a3344;border-radius:12px;border:1px solid #2a4a5e;min-height:80px;display:flex;align-items:center;justify-content:center;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.option{background:#1a3344;padding:15px;border-radius:10px;border:2px solid #2a4a5e;cursor:pointer;transition:0.2s;touch-action:manipulation;}
.option:hover{background:#2a4a5e;border-color:#4fc3f7;}
.option.correct{background:#1a4a3a;border-color:#7cf5b0;}
.option.wrong{background:#3a1a1a;border-color:#ff6b6b;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-shield-alt" style="color:#4fc3f7;"></i> ScamSavvy</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="total">0</span><span class="label">Total</span></div>
    </div>
    <div class="question" id="question">Loading...</div>
    <div class="options" id="options"></div>
    <button class="btn" id="nextBtn">Next Question</button>
    <div class="message" id="message">🎯 Spot the scams!</div>
</div>
<script>
function updateGameProgress(gameId){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.games)s.games={};if(!s.games[gameId])s.games[gameId]={played:false,xp:0};var g=s.games[gameId];if(!g.played){g.played=true;s.gamesPlayed=(s.gamesPlayed||0)+1;}g.xp=(g.xp||0)+1;var t=0,p=0;Object.values(s.games).forEach(function(x){t+=(x.xp||0);if(x.played)p++;});s.totalXp=t;s.gamesPlayed=p;localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

const QUESTIONS=[
    {q:'You get an email saying "You won $1,000,000!" What do you do?',options:['Click the link!','Delete it - it\'s a scam!','Reply asking for more info','Forward to friends'],correct:1},
    {q:'Someone calls saying they\'re from "Microsoft" and your computer has a virus.',options:['Give them remote access','Hang up - it\'s a scam!','Ask for their number','Panic and pay them'],correct:1},
    {q:'A text says "Your bank account is frozen. Click here to verify."',options:['Click the link','Call your bank directly','Reply with your PIN','Ignore it, it\'s a scam!'],correct:3},
    {q:'Someone offers you a "guaranteed" way to make $10,000/month from home.',options:['Sign up immediately','It\'s a scam - too good to be true','Invest your savings','Tell your friends'],correct:1},
    {q:'A website asks for your credit card to "verify your identity" for a free trial.',options:['Enter your card','Leave the site - it\'s a scam!','Give them your SSN too','It\'s probably fine'],correct:1},
    {q:'You get a friend request from someone you don\'t know on social media.',options:['Accept it, they might be cool','Ignore it - could be a scam','Message them first','Send them money'],correct:1},
    {q:'Someone says you owe back taxes and must pay immediately with gift cards.',options:['Buy gift cards','It\'s a scam - the IRS doesn\'t accept gift cards!','Pay them','Ask for a discount'],correct:1},
    {q:'A "prize" requires you to pay a small fee to collect your winnings.',options:['Pay the fee','Scam! Real prizes don\'t cost money','It\'s probably legit','Send them your bank info'],correct:1}
];
let currentIndex=0,score=0,total=0;

const questionEl=document.getElementById('question'),optionsEl=document.getElementById('options');
const scoreEl=document.getElementById('score'),totalEl=document.getElementById('total');
const msg=document.getElementById('message');

function loadQuestion(){
    if(currentIndex>=QUESTIONS.length){
        questionEl.textContent='🎉 You completed all questions!';
        optionsEl.innerHTML='';
        document.getElementById('nextBtn').style.display='none';
        msg.textContent='Score: '+score+'/'+total;
        return;
    }
    const q=QUESTIONS[currentIndex];
    questionEl.textContent=q.q;
    optionsEl.innerHTML='';
    q.options.forEach((opt,idx)=>{
        const div=document.createElement('div');
        div.className='option';
        div.textContent=opt;
        div.addEventListener('click',()=>selectAnswer(idx));
        optionsEl.appendChild(div);
    });
    document.getElementById('nextBtn').style.display='none';
    msg.textContent='🤔 Which one is the scam?';
    total++;
    totalEl.textContent=total;
}

function selectAnswer(idx){
    const q=QUESTIONS[currentIndex];
    const options=optionsEl.querySelectorAll('.option');
    options.forEach((el,i)=>{
        el.style.pointerEvents='none';
        if(i===q.correct)el.classList.add('correct');
        else if(i===idx&&idx!==q.correct)el.classList.add('wrong');
    });
    if(idx===q.correct){score++;scoreEl.textContent=score;msg.textContent='✅ Correct!';}
    else msg.textContent='❌ Wrong! The correct answer was: '+q.options[q.correct];
    document.getElementById('nextBtn').style.display='inline-block';
    if(currentIndex===QUESTIONS.length-1)document.getElementById('nextBtn').textContent='Finish';
}

document.getElementById('nextBtn').addEventListener('click',()=>{
    currentIndex++;
    if(currentIndex>=QUESTIONS.length){
        msg.textContent='🎉 Complete! Score: '+score+'/'+total;
        questionEl.textContent='Great job! You\'re ScamSavvy!';
        optionsEl.innerHTML='';
        document.getElementById('nextBtn').style.display='none';
        updateGameProgress('scam');
        return;
    }
    loadQuestion();
});

loadQuestion();
</script>
</body>
</html>
