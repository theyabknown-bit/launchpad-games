<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Memory Pro</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .game-container { text-align: center; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .status-bar .stat { color: #8899aa; }
        .status-bar .stat span { color: #d0e8f0; font-weight: 700; }
        .board {
            display: grid;
            gap: 10px;
            justify-content: center;
            margin: 20px auto;
            max-width: 500px;
        }
        .card {
            aspect-ratio: 1/1;
            perspective: 600px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card.matched .card-inner { transform: rotateY(180deg) scale(0.95); }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: rgba(26,51,68,0.4);
            border: 2px solid rgba(79,195,247,0.1);
        }
        .card-front {
            transform: rotateY(180deg);
            background: rgba(0,0,0,0.3);
            border-color: rgba(79,195,247,0.2);
        }
        .card-back {
            background: linear-gradient(135deg, rgba(79,195,247,0.15), rgba(124,245,176,0.05));
            border-color: rgba(79,195,247,0.15);
            font-size: 2rem;
            color: #4fc3f7;
        }
        .card.matched .card-front { border-color: #7cf5b0; background: rgba(124,245,176,0.05); }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .controls button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); }
        .difficulty-selector { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
        .difficulty-selector button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; padding: 6px 16px; }
        .difficulty-selector button.active { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        #message { min-height: 2rem; font-size: 1rem; }
        .combo-display { color: #ffd93d; font-weight: 700; }
    </style>
</head>
<body>
<div class="game-container">
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    <h1 class="game-title">🧠 Memory Pro</h1>

    <!-- Difficulty -->
    <div class="difficulty-selector">
        <button data-diff="easy">Easy (4x4)</button>
        <button data-diff="medium" class="active">Medium (4x6)</button>
        <button data-diff="hard">Hard (6x6)</button>
    </div>

    <!-- Status -->
    <div class="status-bar">
        <div class="stat">🔄 Moves: <span id="moves">0</span></div>
        <div class="stat">⏱️ Time: <span id="timer">0s</span></div>
        <div class="stat">🏆 Best: <span id="bestScore">-</span></div>
        <div class="stat combo-display">🔥 Combo: <span id="combo">0</span>x</div>
    </div>

    <div class="board" id="board"></div>

    <div id="message">Find all matching pairs!</div>

    <div class="controls">
        <button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button>
        <button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button>
    </div>
</div>

<script>
// ============================================================
// MEMORY PRO – Difficulty, timer, combo, high-score
// ============================================================
const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timerEl = document.getElementById('timer');
const bestEl = document.getElementById('bestScore');
const comboEl = document.getElementById('combo');
const msgEl = document.getElementById('message');

let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let totalPairs = 0;
let moves = 0;
let combo = 0;
let maxCombo = 0;
let timerInterval = null;
let seconds = 0;
let paused = false;
let gameOver = false;
let lockBoard = false;
let difficulty = 'medium';
let bestScore = null;

// Emojis for cards
const EMOJIS = ['🚀','👾','🛸','🌠','⭐','🪐','☄️','🌙','🔮','🧬','👽','🤖','🦄','🌈','🎮','⚡','🔥','💎','👑','🦋','🐉','🍕','🚁','🏎️'];

const DIFFICULTY_CONFIG = {
    easy: { cols: 4, rows: 4 },
    medium: { cols: 4, rows: 6 },
    hard: { cols: 6, rows: 6 }
};

// Load best score
(function load() {
    try {
        const saved = JSON.parse(localStorage.getItem('memory_best') || '{}');
        bestScore = saved[difficulty] || null;
        if (bestScore !== null) bestEl.textContent = bestScore + ' moves';
        else bestEl.textContent = '-';
    } catch(e) {}
    const diff = localStorage.getItem('memory_difficulty') || 'medium';
    difficulty = diff;
    document.querySelectorAll('.difficulty-selector button').forEach(b => {
        b.classList.toggle('active', b.dataset.diff === difficulty);
    });
})();

function saveBest(moves) {
    if (bestScore === null || moves < bestScore) {
        bestScore = moves;
        const saved = JSON.parse(localStorage.getItem('memory_best') || '{}');
        saved[difficulty] = moves;
        localStorage.setItem('memory_best', JSON.stringify(saved));
        bestEl.textContent = moves + ' moves';
    }
}

function initGame() {
    const config = DIFFICULTY_CONFIG[difficulty];
    const total = config.rows * config.cols;
    totalPairs = total / 2;
    const usedEmojis = EMOJIS.slice(0, totalPairs);
    let deck = [...usedEmojis, ...usedEmojis];
    // Shuffle
    for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    cards = deck.map((emoji, index) => ({
        id: index,
        emoji: emoji,
        flipped: false,
        matched: false
    }));
    flippedCards = [];
    matchedPairs = 0;
    moves = 0;
    combo = 0;
    maxCombo = 0;
    seconds = 0;
    gameOver = false;
    paused = false;
    lockBoard = false;
    document.getElementById('pauseLabel').textContent = 'Pause';
    movesEl.textContent = moves;
    comboEl.textContent = combo;
    timerEl.textContent = '0s';
    msgEl.textContent = 'Find all matching pairs!';
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    renderBoard();
}

function renderBoard() {
    const config = DIFFICULTY_CONFIG[difficulty];
    boardEl.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;
    boardEl.innerHTML = '';
    cards.forEach((card, index) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card' + (card.flipped ? ' flipped' : '') + (card.matched ? ' matched' : '');
        cardDiv.dataset.index = index;
        cardDiv.innerHTML = `
            <div class="card-inner">
                <div class="card-front">${card.matched ? '✅' : card.flipped ? card.emoji : '❓'}</div>
                <div class="card-back"><i class="fas fa-question"></i></div>
            </div>
        `;
        if (!card.matched && !gameOver && !paused) {
            cardDiv.addEventListener('click', () => flipCard(index));
        }
        boardEl.appendChild(cardDiv);
    });
}

function flipCard(index) {
    if (lockBoard || paused || gameOver) return;
    const card = cards[index];
    if (card.flipped || card.matched) return;
    if (flippedCards.length === 2) return;

    card.flipped = true;
    flippedCards.push(index);
    renderBoard();
    playSound('flip');

    if (flippedCards.length === 2) {
        lockBoard = true;
        moves++;
        movesEl.textContent = moves;
        const idx1 = flippedCards[0];
        const idx2 = flippedCards[1];
        if (cards[idx1].emoji === cards[idx2].emoji) {
            // Match!
            cards[idx1].matched = true;
            cards[idx2].matched = true;
            matchedPairs++;
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            comboEl.textContent = combo;
            playSound('match');
            flippedCards = [];
            lockBoard = false;
            renderBoard();
            if (matchedPairs === totalPairs) {
                gameOver = true;
                clearInterval(timerInterval);
                saveBest(moves);
                msgEl.textContent = `🎉 You won in ${moves} moves! Best: ${bestScore} moves`;
                playSound('win');
                spawnConfetti();
            }
        } else {
            // No match
            combo = 0;
            comboEl.textContent = combo;
            playSound('nomatch');
            setTimeout(() => {
                cards[idx1].flipped = false;
                cards[idx2].flipped = false;
                flippedCards = [];
                lockBoard = false;
                renderBoard();
            }, 600);
        }
        // Start timer on first move
        if (moves === 1 && !timerInterval) {
            timerInterval = setInterval(() => {
                seconds++;
                timerEl.textContent = seconds + 's';
            }, 1000);
        }
    } else {
        // single flip, no action
    }
}

function togglePause() {
    if (gameOver) return;
    paused = !paused;
    document.getElementById('pauseLabel').textContent = paused ? 'Resume' : 'Pause';
    msgEl.textContent = paused ? '⏸️ Paused' : 'Find all matching pairs!';
    renderBoard();
}

function resetGame() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    initGame();
}

// ---- Difficulty ----
document.querySelectorAll('.difficulty-selector button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.difficulty-selector button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        difficulty = this.dataset.diff;
        localStorage.setItem('memory_difficulty', difficulty);
        // Reload best
        const saved = JSON.parse(localStorage.getItem('memory_best') || '{}');
        bestScore = saved[difficulty] || null;
        if (bestScore !== null) bestEl.textContent = bestScore + ' moves';
        else bestEl.textContent = '-';
        resetGame();
    });
});

// ---- Sound ----
function playSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'flip') {
            osc.frequency.value = 500;
            gain.gain.value = 0.05;
            osc.start();
            osc.stop(ctx.currentTime + 0.06);
        } else if (type === 'match') {
            osc.frequency.value = 800;
            gain.gain.value = 0.08;
            osc.start();
            setTimeout(() => { osc.frequency.value = 1000; }, 100);
            osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'nomatch') {
            osc.frequency.value = 300;
            gain.gain.value = 0.06;
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'win') {
            osc.frequency.value = 600;
            gain.gain.value = 0.1;
            osc.start();
            setTimeout(() => { osc.frequency.value = 800; }, 150);
            setTimeout(() => { osc.frequency.value = 1000; }, 300);
            osc.stop(ctx.currentTime + 0.5);
        }
    } catch(e) {}
}

// ---- Confetti (simple) ----
function spawnConfetti() {
    const container = document.createElement('div');
    container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden;';
    document.body.appendChild(container);
    const colors = ['#4fc3f7','#7cf5b0','#ffd93d','#ff6b6b','#a29bfe'];
    for (let i=0; i<60; i++) {
        const piece = document.createElement('div');
        piece.style.cssText = `
            position:absolute;
            left:${Math.random()*100}%;
            width:${Math.random()*8+4}px;
            height:${Math.random()*8+4}px;
            background:${colors[Math.floor(Math.random()*colors.length)]};
            border-radius:2px;
            animation: fall ${Math.random()*2+1.5}s linear infinite;
            animation-delay:${Math.random()*0.5}s;
        `;
        container.appendChild(piece);
    }
    const style = document.createElement('style');
    style.textContent = `
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity:1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity:0; }
        }
    `;
    document.head.appendChild(style);
    setTimeout(() => {
        container.remove();
        style.remove();
    }, 4000);
}

// ---- Init ----
initGame();
console.log('🧠 Memory Pro loaded with difficulty, timer, combo, high-score.');
</script>
</body>
</html>
