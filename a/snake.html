<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Snake</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
canvas{background:#0f1f2e;border-radius:12px;border:2px solid #1a3344;touch-action:none;}
.controls{display:flex;gap:10px;justify-content:center;margin:15px 0;flex-wrap:wrap;}
.controls button{background:#1a3344;color:#d0e8f0;border:2px solid #2a4a5e;padding:10px 20px;border-radius:8px;font-size:1.2rem;cursor:pointer;touch-action:manipulation;}
.controls button:hover{background:#2a4a5e;border-color:#4fc3f7;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-dragon" style="color:#7cf5b0;"></i> Snake</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="highScore">0</span><span class="label">Best</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
        <button id="upBtn">⬆</button>
        <button id="downBtn">⬇</button>
        <button id="leftBtn">⬅</button>
        <button id="rightBtn">➡</button>
    </div>
    <button class="btn" id="startBtn">▶ Start Game</button>
    <div class="message" id="message">🎯 Press Start to play!</div>
</div>
<script>
    // ============================================================
    // FIXED SOUND SYSTEM - WORKS ON FIRST CLICK
    // ============================================================
    let soundEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;

    function unlockAudio() {
        if (audioUnlocked) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioUnlocked = true;
            console.log('🔊 Audio unlocked!');
        } catch(e) { console.log('Audio error:', e); }
    }

    // Unlock audio on any click
    document.addEventListener('click', unlockAudio, { once: false });
    document.addEventListener('touchstart', unlockAudio, { once: false });
    document.addEventListener('keydown', unlockAudio, { once: false });

    function getAudioCtx() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playTone(frequency, duration = 150, type = 'sine') {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration / 1000);
        } catch(e) { console.log('Play error:', e); }
    }

    function playClick() { playTone(600, 80); }
    function playWin() { 
        playTone(523, 150); 
        setTimeout(() => playTone(659, 150), 150); 
        setTimeout(() => playTone(784, 200), 300); 
    }
    function playLose() { 
        playTone(300, 200); 
        setTimeout(() => playTone(200, 300), 200); 
    }
    function playCorrect() { playTone(800, 100); }
    function playWrong() { playTone(250, 200); }
    function playLevelUp() { 
        playTone(440, 100); 
        setTimeout(() => playTone(523, 100), 100); 
        setTimeout(() => playTone(659, 150), 200); 
    }
function updateGameProgress(gameId){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.games)s.games={};if(!s.games[gameId])s.games[gameId]={played:false,xp:0};var g=s.games[gameId];if(!g.played){g.played=true;s.gamesPlayed=(s.gamesPlayed||0)+1;}g.xp=(g.xp||0)+1;var t=0,p=0;Object.values(s.games).forEach(function(x){t+=(x.xp||0);if(x.played)p++;});s.totalXp=t;s.gamesPlayed=p;localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const size=20;
let snake=[{x:10,y:10}],food={x:15,y:15},direction='right',nextDirection='right';
let score=0,highScore=parseInt(localStorage.getItem('snakeHigh'))||0;
let gameActive=false,gameInterval=null;

function draw(){
    ctx.fillStyle='#0f1f2e';
    ctx.fillRect(0,0,400,400);
    // Draw grid lines
    ctx.strokeStyle='rgba(255,255,255,0.03)';
    ctx.lineWidth=1;
    for(let i=0;i<=20;i++){ctx.beginPath();ctx.moveTo(i*20,0);ctx.lineTo(i*20,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*20);ctx.lineTo(400,i*20);ctx.stroke();}
    // Draw food
    ctx.fillStyle='#ff6b6b';
    ctx.beginPath();
    ctx.arc(food.x*size+size/2,food.y*size+size/2,size/2-2,0,Math.PI*2);
    ctx.fill();
    // Draw snake
    snake.forEach((seg,i)=>{
        const gradient=ctx.createRadialGradient(seg.x*size+size/2,seg.y*size+size/2,2,seg.x*size+size/2,seg.y*size+size/2,size/2);
        gradient.addColorStop(0,i===0?'#7cf5b0':'#4fc3f7');
        gradient.addColorStop(1,i===0?'#4fc3f7':'#1a3344');
        ctx.fillStyle=gradient;
        ctx.beginPath();
        ctx.roundRect(seg.x*size+2,seg.y*size+2,size-4,size-4,4);
        ctx.fill();
    });
}

function move(){
    direction=nextDirection;
    const head={...snake[0]};
    if(direction==='right')head.x++;
    if(direction==='left')head.x--;
    if(direction==='up')head.y--;
    if(direction==='down')head.y++;
    // Check food
    if(head.x===food.x&&head.y===food.y){
        score++;
        document.getElementById('score').textContent=score;
        if(score>highScore){highScore=score;localStorage.setItem('snakeHigh',highScore);document.getElementById('highScore').textContent=highScore;}
        snake.unshift(head);
        spawnFood();
        draw();
        return;
    }
    snake.pop();
    snake.unshift(head);
    // Check collision
    if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.slice(1).some(s=>s.x===head.x&&s.y===head.y)){
        endGame();
        return;
    }
    draw();
}

function spawnFood(){
    let pos;
    do{pos={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
    food=pos;
}

function startGame(){
    if(gameActive)return;
    updateGameProgress('snake');
    snake=[{x:10,y:10}];
    direction='right';nextDirection='right';
    score=0;
    document.getElementById('score').textContent=0;
    document.getElementById('highScore').textContent=highScore;
    document.getElementById('message').textContent='⚡ Playing...';
    document.getElementById('startBtn').textContent='⏳ Playing';
    gameActive=true;
    spawnFood();
    draw();
    if(gameInterval)clearInterval(gameInterval);
    gameInterval=setInterval(()=>{if(gameActive)move();},150);
}

function endGame(){
    gameActive=false;
    if(gameInterval)clearInterval(gameInterval);
    document.getElementById('message').textContent='💀 Game Over! Score: '+score;
    document.getElementById('startBtn').textContent='▶ Play Again';
    draw();
}

// Keyboard controls
document.addEventListener('keydown',(e)=>{
    if(!gameActive)return;
    if(e.key==='ArrowUp'&&direction!=='down')nextDirection='up';
    if(e.key==='ArrowDown'&&direction!=='up')nextDirection='down';
    if(e.key==='ArrowLeft'&&direction!=='right')nextDirection='left';
    if(e.key==='ArrowRight'&&direction!=='left')nextDirection='right';
    if(e.key===' '||e.key==='Enter')startGame();
});

// Button controls
document.getElementById('upBtn').addEventListener('click',()=>{if(gameActive&&direction!=='down')nextDirection='up';});
document.getElementById('downBtn').addEventListener('click',()=>{if(gameActive&&direction!=='up')nextDirection='down';});
document.getElementById('leftBtn').addEventListener('click',()=>{if(gameActive&&direction!=='right')nextDirection='left';});
document.getElementById('rightBtn').addEventListener('click',()=>{if(gameActive&&direction!=='left')nextDirection='right';});

document.getElementById('startBtn').addEventListener('click',startGame);

// RoundRect polyfill for canvas
if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){if(r>w/2)r=w/2;if(r>h/2)r=h/2;this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath();return this;};
}

document.getElementById('highScore').textContent=highScore;
draw();
document.getElementById('message').textContent='🎯 Press Start to play!';
    
    

    // Add sound toggle to settings
    function addSoundToggle() {
        const settings = document.getElementById('settingsPanel');
        if (!settings) return;
        const item = document.createElement('div');
        item.className = 'settings-item';
        item.innerHTML = `
            <span class="label">🔊 Sound Effects</span>
            <div class="settings-toggle active" id="soundToggle"><div class="knob"></div></div>
        `;
        settings.appendChild(item);
        document.getElementById('soundToggle').addEventListener('click', function() {
            this.classList.toggle('active');
            soundEnabled = this.classList.contains('active');
            if (soundEnabled) playClick();
        });
    }

    // Minigame: Quick Tap Challenge
    function startQuickTap() {
        if (document.getElementById('minigameOverlay')) return;
        const overlay = document.createElement('div');
        overlay.id = 'minigameOverlay';
        overlay.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; padding: 20px;
            animation: fadeIn 0.3s ease;
        `;
        overlay.innerHTML = `
            <div style="background: #1a1a2e; border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; border: 2px solid rgba(255,215,0,0.1);">
                <h2 style="color: #ffd700; margin-bottom: 10px;">🎯 Quick Tap Challenge</h2>
                <p style="color: #888; margin-bottom: 15px;">Tap as fast as you can!</p>
                <div style="font-size: 72px; margin: 15px 0;" id="tapCounter">0</div>
                <div style="font-size: 24px; color: #ff6b6b; margin-bottom: 10px;" id="tapTimer">3s</div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="tapBtn" style="
                        background: linear-gradient(135deg, #ffd700, #f5a623);
                        border: none; padding: 15px 40px; border-radius: 30px;
                        font-weight: 700; font-size: 18px; color: #1a1a2e;
                        cursor: pointer; font-family: 'Segoe UI', sans-serif;
                    ">👆 TAP!</button>
                    <button onclick="this.closest('#minigameOverlay').remove()" style="
                        background: rgba(255,255,255,0.05);
                        border: 1px solid rgba(255,255,255,0.1);
                        padding: 15px 20px; border-radius: 30px;
                        color: #888; cursor: pointer; font-size: 14px;
                        font-family: 'Segoe UI', sans-serif;
                    ">✕ Close</button>
                </div>
                <div id="tapResult" style="margin-top: 10px; color: #7cf5b0; font-weight: 700;"></div>
            </div>
        `;
        document.body.appendChild(overlay);

        let taps = 0;
        let timeLeft = 3;
        let active = true;

        const tapBtn = document.getElementById('tapBtn');
        const counter = document.getElementById('tapCounter');
        const timer = document.getElementById('tapTimer');
        const result = document.getElementById('tapResult');

        tapBtn.addEventListener('click', function() {
            if (!active) return;
            taps++;
            counter.textContent = taps;
            playClick();
            this.style.transform = 'scale(0.9)';
            setTimeout(() => this.style.transform = '', 100);
        });

        const interval = setInterval(() => {
            timeLeft--;
            timer.textContent = timeLeft + 's';
            if (timeLeft <= 0) {
                clearInterval(interval);
                active = false;
                tapBtn.disabled = true;
                tapBtn.style.opacity = '0.5';
                const reward = taps * 50;
                result.textContent = '🏆 You tapped ' + taps + ' times! +' + reward + ' points!';
                playWin();
                // Add points if game supports it
                if (typeof points !== 'undefined') {
                    points += reward;
                    if (typeof updateUI === 'function') updateUI();
                    if (typeof saveGame === 'function') saveGame();
                }
                setTimeout(() => {
                    overlay.querySelector('button:last-child').click();
                }, 3000);
            }
        }, 1000);

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = '@keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }';
        document.head.appendChild(style);
    }

    // Add minigame button to games
    function addMinigameButton() {
        const container = document.querySelector('.container') || document.querySelector('#app');
        if (!container) return;
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.style.cssText = `
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white; border: none; padding: 10px 20px;
            border-radius: 30px; font-weight: 700; font-size: 13px;
            cursor: pointer; margin: 5px;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
        `;
        btn.textContent = '🎯 Quick Tap Challenge';
        btn.onmouseover = function() { this.style.transform = 'scale(1.05)'; };
        btn.onmouseout = function() { this.style.transform = ''; };
        btn.onclick = startQuickTap;
        container.appendChild(btn);
    }

    // Initialize sound and minigame
    document.addEventListener('DOMContentLoaded', function() {
        // Add sound toggle if settings exist
        setTimeout(addSoundToggle, 100);
        // Add minigame button
        setTimeout(addMinigameButton, 200);
    });
    // ============================================================
    // ACHIEVEMENT POPUP SYSTEM - WORKS EVERYWHERE
    // ============================================================
    
    // Check achievements and show popup
    function checkAchievements() {
        try {
            const progress = JSON.parse(localStorage.getItem('launchpad_progress') || '{"games":{},"totalXp":0,"gamesPlayed":0}');
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            let newAchievements = [];

            // First game
            if (progress.gamesPlayed >= 1 && !unlocked.includes('first_game')) {
                newAchievements.push('first_game');
                showAchievementPopup('🎮', 'First Game!', 'Played your first game!');
            }

            // Game master (10 games)
            if (progress.gamesPlayed >= 10 && !unlocked.includes('game_master')) {
                newAchievements.push('game_master');
                showAchievementPopup('👑', 'Game Master!', 'Played 10 games!');
            }

            // XP collector
            if (progress.totalXp >= 100 && !unlocked.includes('xp_collector')) {
                newAchievements.push('xp_collector');
                showAchievementPopup('⭐', 'XP Collector!', 'Earned 100 XP!');
            }

            // Level up
            const level = Math.floor((progress.totalXp || 0) / 100) + 1;
            if (level >= 5 && !unlocked.includes('level_up')) {
                newAchievements.push('level_up');
                showAchievementPopup('🏅', 'Level Up!', 'Reached Level 5!');
            }

            // Save new achievements
            if (newAchievements.length > 0) {
                const all = [...unlocked, ...newAchievements];
                localStorage.setItem('launchpad_achievements', JSON.stringify(all));
                updateAchievementCount();
            }

            return newAchievements;
        } catch(e) { return []; }
    }

    // Show achievement popup
    function showAchievementPopup(emoji, title, desc) {
        try { playAchievement(); } catch(e) {}
        // Check if popup already exists
        let popup = document.getElementById('achievementPopupGlobal');
        if (!popup) {
            popup = document.createElement('div');
            popup.id = 'achievementPopupGlobal';
            popup.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(18, 16, 30, 0.96);
                backdrop-filter: blur(20px);
                border: 2px solid #7cf5b0;
                border-radius: 16px;
                padding: 16px 24px;
                max-width: 350px;
                z-index: 99999;
                box-shadow: 0 20px 60px rgba(0,0,0,0.6);
                display: none;
                animation: slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
                color: #d0e8f0;
                font-family: 'Segoe UI', Roboto, sans-serif;
            `;
            document.body.appendChild(popup);
            
            // Add animation styles
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideInRight {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes slideOutRight {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
                @keyframes pulseGold {
                    0%, 100% { box-shadow: 0 0 20px rgba(124, 245, 176, 0.1); }
                    50% { box-shadow: 0 0 40px rgba(124, 245, 176, 0.3); }
                }
            `;
            document.head.appendChild(style);
        }

        // Fill popup content
        popup.innerHTML = `
            <div style="display:flex;align-items:center;gap:14px;">
                <div style="font-size:2.8rem;line-height:1;">${emoji}</div>
                <div>
                    <div style="color:#7cf5b0;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;">🏆 Achievement Unlocked!</div>
                    <div style="color:#f0f8ff;font-weight:700;font-size:1.1rem;">${title}</div>
                    <div style="color:#8899aa;font-size:0.85rem;">${desc}</div>
                </div>
            </div>
            <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end;">
                <button onclick="document.getElementById('achievementPopupGlobal').style.display='none'" style="
                    background:rgba(255,255,255,0.05);
                    border:1px solid rgba(255,255,255,0.1);
                    color:#8899aa;
                    padding:4px 14px;
                    border-radius:20px;
                    cursor:pointer;
                    font-size:0.7rem;
                    font-family:'Segoe UI',sans-serif;
                ">Dismiss</button>
            </div>
        `;

        // Show popup
        popup.style.display = 'block';
        popup.style.animation = 'slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';

        // Auto-hide after 6 seconds
        clearTimeout(popup._timeout);
        popup._timeout = setTimeout(() => {
            popup.style.animation = 'slideOutRight 0.4s ease-in';
            setTimeout(() => {
                popup.style.display = 'none';
                popup.style.animation = '';
            }, 400);
        }, 6000);

        // Play sound
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [523, 659, 784, 1047].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }, i * 120);
            });
        } catch(e) {}
    }

    // Update achievement count in stats
    function updateAchievementCount() {
        try {
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            const countEl = document.getElementById('achievementCount');
            if (countEl) countEl.textContent = unlocked.length;
        } catch(e) {}
    }

    // Check achievements every 10 seconds
    setInterval(checkAchievements, 10000);

    // Also check on page load
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(checkAchievements, 1000);
    });

    // Check when progress updates
    const origSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        origSetItem.apply(this, arguments);
        if (key === 'launchpad_progress') {
            setTimeout(checkAchievements, 500);
        }
    };
</script>
</body>
</html>
