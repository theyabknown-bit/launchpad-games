<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 Color Match</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.color-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:15px auto;}
.color-btn{aspect-ratio:1;border-radius:12px;border:3px solid #2a4a5e;cursor:pointer;transition:0.15s;touch-action:manipulation;}
.color-btn:hover{transform:scale(1.05);}
.color-btn:active{transform:scale(0.92);}
.color-btn.correct{animation:flashGreen 0.3s;}
.color-btn.wrong{animation:flashRed 0.3s;}
@keyframes flashGreen{0%,100%{border-color:#2a4a5e;}50%{border-color:#7cf5b0;}}
@keyframes flashRed{0%,100%{border-color:#2a4a5e;}50%{border-color:#ff6b6b;}}
.target-display{font-size:2rem;font-weight:700;color:#ffd93d;margin:15px 0;min-height:60px;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-palette" style="color:#4fc3f7;"></i> Color Match</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="time">30</span><span class="label">Time</span></div>
        <div class="stat-box"><span id="highScore">0</span><span class="label">Best</span></div>
    </div>
    <div class="target-display" id="targetDisplay">Find the color</div>
    <div class="color-grid" id="colorGrid"></div>
    <button class="btn" id="startBtn">▶ Start Game</button>
    <div class="message" id="message">🎯 Find the matching color!</div>
</div>
<script>
function updateGameProgress(gameId){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.games)s.games={};if(!s.games[gameId])s.games[gameId]={played:false,xp:0};var g=s.games[gameId];if(!g.played){g.played=true;s.gamesPlayed=(s.gamesPlayed||0)+1;}g.xp=(g.xp||0)+1;var t=0,p=0;Object.values(s.games).forEach(function(x){t+=(x.xp||0);if(x.played)p++;});s.totalXp=t;s.gamesPlayed=p;localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

const COLORS=['#FF6B6B','#4FC3F7','#7CF5B0','#FFD93D','#FF9F43','#A29BFE','#FF6B6B','#4FC3F7','#7CF5B0','#FFD93D','#FF9F43','#A29BFE'];
const NAMES=['Red','Blue','Green','Yellow','Orange','Purple'];
let score=0,timeLeft=30,highScore=parseInt(localStorage.getItem('colorHigh'))||0;
let gameActive=false,timerInterval=null,targetColor='',targetName='';

const grid=document.getElementById('colorGrid'),targetDisplay=document.getElementById('targetDisplay');
const scoreDisplay=document.getElementById('score'),timeDisplay=document.getElementById('time');
const highDisplay=document.getElementById('highScore'),msg=document.getElementById('message');

function initGrid(){
    grid.innerHTML='';
    for(let i=0;i<9;i++){
        const btn=document.createElement('div');
        btn.className='color-btn';
        const color=COLORS[Math.floor(Math.random()*COLORS.length)];
        btn.style.backgroundColor=color;
        btn.dataset.color=color;
        btn.addEventListener('click',()=>checkColor(color));
        grid.appendChild(btn);
    }
}

function setTarget(){
    const idx=Math.floor(Math.random()*NAMES.length);
    targetName=NAMES[idx];
    targetColor=COLORS[idx*2];
    targetDisplay.textContent='Find: '+targetName;
    // Make sure target color is in the grid
    const btns=grid.querySelectorAll('.color-btn');
    btns.forEach(btn=>{
        const colors=[targetColor,COLORS[Math.floor(Math.random()*COLORS.length)]];
        btn.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
        btn.dataset.color=btn.style.backgroundColor;
    });
    // Ensure at least one matches
    const matchIdx=Math.floor(Math.random()*9);
    btns[matchIdx].style.backgroundColor=targetColor;
    btns[matchIdx].dataset.color=targetColor;
}

function checkColor(color){
    if(!gameActive)return;
    if(color===targetColor){
        score++;
        scoreDisplay.textContent=score;
        // Flash green
        const btns=grid.querySelectorAll('.color-btn');
        btns.forEach(b=>{if(b.dataset.color===color)b.classList.add('correct');});
        setTimeout(()=>btns.forEach(b=>b.classList.remove('correct')),300);
        setTarget();
    }else{
        msg.textContent='❌ Wrong! Try again!';
        setTimeout(()=>msg.textContent='⚡ Find the matching color!',500);
    }
}

function startGame(){
    if(gameActive)return;
    updateGameProgress('colormatch');
    score=0;timeLeft=30;
    scoreDisplay.textContent=0;timeDisplay.textContent=30;
    document.getElementById('startBtn').textContent='⏳ Playing...';
    gameActive=true;
    msg.textContent='⚡ GO!';
    initGrid();
    setTarget();
    timerInterval=setInterval(()=>{
        timeLeft--;
        timeDisplay.textContent=timeLeft;
        if(timeLeft<=0)endGame();
    },1000);
}

function endGame(){
    gameActive=false;
    clearInterval(timerInterval);
    if(score>highScore){highScore=score;localStorage.setItem('colorHigh',highScore);}
    highDisplay.textContent=highScore;
    msg.textContent='🎉 Game Over! Score: '+score;
    document.getElementById('startBtn').textContent='▶ Play Again';
}

document.getElementById('startBtn').addEventListener('click',startGame);
highDisplay.textContent=highScore;
initGrid();
</script>
</body>
</html>
