<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🏥 MediCore Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.status-bar .stat{background:rgba(0,0,0,0.3);padding:6px 10px;border-radius:8px;border:1px solid rgba(79,195,247,0.05)}
.status-bar .stat .label{font-size:.7rem;color:#8899aa}
.status-bar .stat .value{font-weight:700;font-size:1.1rem}
.patients{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.patient-card{background:rgba(0,0,0,0.3);padding:10px;border-radius:12px;border:1px solid rgba(79,195,247,0.05);width:160px;text-align:center;font-size:.8rem}
.patient-card .name{font-weight:700;color:#d0e8f0}
.patient-card .symptom{color:#ff6b6b;font-size:.7rem}
.patient-card .status{color:#ffd93d;font-size:.7rem}
.patient-card .status.cured{color:#7cf5b0}
.patient-card .status.died{color:#ff6b6b}
.departments{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.dept-btn{background:rgba(79,195,247,0.05);border:1px solid rgba(79,195,247,0.1);color:#d0e8f0;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem}
.dept-btn:hover{background:rgba(79,195,247,0.1)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.actions button{background:rgba(79,195,247,0.05);border:1px solid rgba(79,195,247,0.1);color:#d0e8f0;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem}
.actions button:hover{background:rgba(79,195,247,0.1)}
.events{background:rgba(255,215,0,0.03);border:1px solid rgba(255,215,0,0.05);border-radius:8px;padding:8px;margin:10px 0;font-size:.85rem;min-height:40px;color:#8899aa}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
#message{min-height:2rem;font-size:.9rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🏥 MediCore Pro</h1>
<div class="status-bar"><div class="stat"><div class="label">💰 Budget</div><div class="value" id="budget">100</div></div><div class="stat"><div class="label">🏆 Score</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">🏅 Best</div><div class="value" id="bestScore">-</div></div><div class="stat"><div class="label">👨‍⚕️ Staff</div><div class="value" id="staffCount">1</div></div></div>
<div class="patients" id="patientList"><span style="color:#8899aa;font-size:.8rem">No patients yet.</span></div>
<div class="departments"><button class="dept-btn" onclick="admitPatient()">🚑 Admit Patient</button><button class="dept-btn" onclick="treatPatient()">💊 Treat Patient</button><button class="dept-btn" onclick="hireStaff()">👨‍⚕️ Hire Staff ($15)</button></div>
<div class="actions"><button onclick="upgradeHospital()">🏗️ Upgrade Hospital ($25)</button><button onclick="runLabTest()">🔬 Run Lab Test ($5)</button></div>
<div class="events" id="events">🏥 Welcome to MediCore!</div>
<div id="message">💡 Admit patients, diagnose, and treat them!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const budgetEl=document.getElementById('budget'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),staffCountEl=document.getElementById('staffCount'),patientList=document.getElementById('patientList'),eventsEl=document.getElementById('events'),msgEl=document.getElementById('message');
const SYMPTOMS=['Fever','Cough','Headache','Fatigue','Nausea','Chest Pain','Shortness of Breath','Dizziness','Sore Throat','Joint Pain','Rash','Stomach Pain'];
const DISEASES=[
{name:'Common Cold',treatment:'Rest',time:2},
{name:'Flu',treatment:'Antivirals',time:3},
{name:'Pneumonia',treatment:'Antibiotics',time:4},
{name:'Migraine',treatment:'Painkillers',time:2},
{name:'Food Poisoning',treatment:'Hydration',time:3},
{name:'Bronchitis',treatment:'Inhaler',time:3},
{name:'Strep Throat',treatment:'Antibiotics',time:2},
{name:'Arthritis',treatment:'Anti-inflammatory',time:4},
{name:'Heartburn',treatment:'Antacids',time:1},
{name:'Allergy',treatment:'Antihistamines',time:2}
];
let state={budget:100,score:0,staff:1,hospitalLevel:1,patients:[],gameActive:!1,paused:!1,timerId:null,eventTimer:null,bestScore:0};
(function load(){try{let s=JSON.parse(localStorage.getItem('medicore_best')||'{}');state.bestScore=s['all']||0;bestEl.textContent=state.bestScore||'-'}catch(e){}})();
function saveBest(){if(state.score>state.bestScore){state.bestScore=state.score;let s=JSON.parse(localStorage.getItem('medicore_best')||'{}');s['all']=state.score;localStorage.setItem('medicore_best',JSON.stringify(s));bestEl.textContent=state.score}}
function saveState(){try{localStorage.setItem('medicore_state',JSON.stringify(state))}catch(e){}}
function renderPatients(){if(state.patients.length===0){patientList.innerHTML='<span style="color:#8899aa;font-size:.8rem">No patients yet.</span>';return}patientList.innerHTML=state.patients.map(p=>{let statusClass=p.treated?'cured':p.died?'died':'';return'<div class="patient-card"><div class="name">'+p.name+'</div><div class="symptom">🤒 '+p.symptom+'</div><div class="status '+statusClass+'">'+(p.treated?'✅ Cured':p.died?'💀 Died':'⏳ '+p.time+' days left')+'</div></div>'}).join('')}
function admitPatient(){if(!state.gameActive||state.paused)return;let name='Patient '+ (state.patients.length+1);let symptom=SYMPTOMS[Math.floor(Math.random()*SYMPTOMS.length)];let disease=DISEASES[Math.floor(Math.random()*DISEASES.length)];let patient={name,symptom,disease:disease.name,treatment:disease.treatment,time:disease.time,treated:!1,died:!1};state.patients.push(patient);state.budget+=5;state.score+=1;addEvent('🚑 Admitted '+name+' ('+symptom+')');playSound('admit');saveState();renderPatients();updateUI()}
function treatPatient(){if(!state.gameActive||state.paused)return;let pending=state.patients.filter(p=>!p.treated&&!p.died);if(pending.length===0){msgEl.textContent='❌ No patients to treat!';return}let p=pending[0];let success=Math.random()<0.5+state.hospitalLevel*0.1+state.staff*0.05;if(success){p.treated=!0;state.score+=10+state.hospitalLevel;state.budget+=8;addEvent('💊 '+p.name+' cured! (+'+(10+state.hospitalLevel)+' points)');playSound('treat')}else{p.died=!0;state.budget-=5;addEvent('💀 '+p.name+' died. Treatment failed.');playSound('die')}saveState();renderPatients();updateUI()}
function runLabTest(){if(!state.gameActive||state.paused)return;if(state.budget<5){msgEl.textContent='❌ Need $5 for lab test!';return}state.budget-=5;let pending=state.patients.filter(p=>!p.treated&&!p.died);if(pending.length===0){msgEl.textContent='❌ No patients to test!';return}let p=pending[0];let test=Math.random()<0.7;if(test){state.score+=2;addEvent('🔬 Lab test reveals '+p.disease+'! Treatment: '+p.treatment);playSound('test')}else{addEvent('🔬 Lab test inconclusive.');playSound('test')}saveState();updateUI()}
function hireStaff(){if(!state.gameActive||state.paused)return;if(state.budget<15){msgEl.textContent='❌ Need $15!';return}state.budget-=15;state.staff++;state.score+=3;addEvent('👨‍⚕️ Hired new staff! Total: '+state.staff);playSound('hire');saveState();updateUI()}
function upgradeHospital(){if(!state.gameActive||state.paused)return;if(state.budget<25){msgEl.textContent='❌ Need $25!';return}state.budget-=25;state.hospitalLevel++;state.score+=5;addEvent('🏗️ Hospital upgraded to Level '+state.hospitalLevel+'!');playSound('upgrade');saveState();updateUI()}
function addEvent(msg){eventsEl.textContent='🏥 '+msg}
function updateUI(){budgetEl.textContent=Math.round(state.budget);scoreEl.textContent=Math.round(state.score);bestEl.textContent=state.bestScore||'-';staffCountEl.textContent=state.staff;renderPatients()}
function processPatients(){if(!state.gameActive||state.paused)return;state.patients.forEach(p=>{if(!p.treated&&!p.died){p.time--;if(p.time<=0){let success=Math.random()<0.4+state.hospitalLevel*0.05+state.staff*0.02;if(success){p.treated=!0;state.score+=5;state.budget+=3;addEvent('💊 '+p.name+' recovered!');playSound('treat')}else{p.died=!0;state.budget-=3;addEvent('💀 '+p.name+' died.');playSound('die')}}}});saveState();updateUI()}
function randomEvent(){if(!state.gameActive||state.paused)return;let events=[{msg:'🚨 Flu outbreak! +2 patients',fn:()=>{for(let i=0;i<2;i++)admitPatient()}},{msg:'⚡ Power outage! Budget -10',fn:()=>{state.budget=Math.max(0,state.budget-10)}},{msg:'🌟 Donation received! +20 budget',fn:()=>{state.budget+=20}},{msg:'🔬 Medical breakthrough! +10 score',fn:()=>{state.score+=10}},{msg:'📈 Patient surge! +1 patient',fn:()=>{admitPatient()}}];let e=events[Math.floor(Math.random()*events.length)];e.fn();addEvent(e.msg);playSound('event');saveState();updateUI()}
function startGame(){state.gameActive=!0;state.paused=!1;state.budget=100;state.score=0;state.staff=1;state.hospitalLevel=1;state.patients=[];document.getElementById('pauseLabel').textContent='Pause';addEvent('🏥 Hospital opened!');if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);state.timerId=setInterval(()=>{processPatients()},3000);state.eventTimer=setInterval(()=>{randomEvent()},8000);saveState();updateUI();msgEl.textContent='💡 Admit and treat patients to grow!'}
function togglePause(){if(!state.gameActive)return;state.paused=!state.paused;document.getElementById('pauseLabel').textContent=state.paused?'Resume':'Pause';msgEl.textContent=state.paused?'⏸️ Paused':'💡 Keep saving lives!';if(state.paused){if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer)}else{state.timerId=setInterval(()=>{processPatients()},3000);state.eventTimer=setInterval(()=>{randomEvent()},8000)}}
function resetGame(){if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);state.gameActive=!1;state.paused=!1;state.budget=100;state.score=0;state.staff=1;state.hospitalLevel=1;state.patients=[];document.getElementById('pauseLabel').textContent='Pause';addEvent('🔄 Hospital reset.');saveState();updateUI();msgEl.textContent='💡 Click Start to begin!'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='admit'){o.frequency.value=500;g.gain.value=.04;o.start();setTimeout(()=>{o.frequency.value=700},100);o.stop(c.currentTime+.2)}else if(type==='treat'){o.frequency.value=600;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=800},100);o.stop(c.currentTime+.2)}else if(type==='die'){o.frequency.value=300;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=200},100);o.stop(c.currentTime+.2)}else if(type==='test'){o.frequency.value=400;g.gain.value=.04;o.start();setTimeout(()=>{o.frequency.value=600},100);o.stop(c.currentTime+.15)}else if(type==='hire'){o.frequency.value=700;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=900},100);o.stop(c.currentTime+.2)}else if(type==='upgrade'){o.frequency.value=500;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=700},100);setTimeout(()=>{o.frequency.value=900},200);o.stop(c.currentTime+.35)}else if(type==='event'){o.frequency.value=400;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=600},100);o.stop(c.currentTime+.2)}}catch(e){}}
loadState();updateUI();console.log('🏥 MediCore Pro loaded');
</script></body></html>
