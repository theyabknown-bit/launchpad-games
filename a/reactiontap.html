<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Reaction Tap</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.reaction-area{width:100%;height:200px;background:#1a3344;border-radius:12px;border:3px solid #2a4a5e;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:700;cursor:pointer;transition:0.15s;touch-action:manipulation;}
.reaction-area.waiting{background:#1a3344;border-color:#2a4a5e;}
.reaction-area.ready{background:#1a4a3a;border-color:#7cf5b0;}
.reaction-area.go{background:#1a3a3a;border-color:#ffd93d;}
.reaction-area.fail{background:#3a1a1a;border-color:#ff6b6b;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-bolt" style="color:#ffd93d;"></i> Reaction Tap</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="best">0ms</span><span class="label">Best</span></div>
        <div class="stat-box"><span id="avg">0ms</span><span class="label">Avg</span></div>
    </div>
    <div class="reaction-area waiting" id="reactionArea">Tap to start</div>
    <button class="btn" id="resetBtn">🔄 Reset Stats</button>
    <div class="message" id="message">🎯 Tap when the screen turns green!</div>
</div>
<script>
function updateGameProgress(gameId){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.games)s.games={};if(!s.games[gameId])s.games[gameId]={played:false,xp:0};var g=s.games[gameId];if(!g.played){g.played=true;s.gamesPlayed=(s.gamesPlayed||0)+1;}g.xp=(g.xp||0)+1;var t=0,p=0;Object.values(s.games).forEach(function(x){t+=(x.xp||0);if(x.played)p++;});s.totalXp=t;s.gamesPlayed=p;localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

let state='waiting',startTime=0,totalTime=0,count=0,best=Infinity;
const area=document.getElementById('reactionArea');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),avgEl=document.getElementById('avg');
const msg=document.getElementById('message');

function updateStats(){
    scoreEl.textContent=count;
    bestEl.textContent=best===Infinity?'-':best+'ms';
    avgEl.textContent=count===0?'-':Math.round(totalTime/count)+'ms';
}

function resetGame(){
    state='waiting';
    area.className='reaction-area waiting';
    area.textContent='Tap to start';
    msg.textContent='🎯 Tap when the screen turns green!';
    count=0;totalTime=0;best=Infinity;
    updateStats();
    updateGameProgress('reactiontap');
}

function startRound(){
    state='waiting';
    area.className='reaction-area waiting';
    area.textContent='Wait...';
    msg.textContent='⏳ Wait for green...';
    const delay=1000+Math.random()*3000;
    setTimeout(()=>{
        if(state==='waiting'){
            state='ready';
            area.className='reaction-area ready';
            area.textContent='👆 TAP NOW!';
            startTime=Date.now();
            msg.textContent='⚡ TAP NOW!';
        }
    },delay);
}

area.addEventListener('click',()=>{
    if(state==='waiting'){
        startRound();
        return;
    }
    if(state==='ready'){
        const reaction=Date.now()-startTime;
        count++;
        totalTime+=reaction;
        if(reaction<best)best=reaction;
        updateStats();
        state='done';
        area.className='reaction-area go';
        area.textContent='✅ '+reaction+'ms';
        msg.textContent='✅ Reaction: '+reaction+'ms';
        setTimeout(startRound,1000);
        return;
    }
    if(state==='done')return;
    // Tap too early
    state='fail';
    area.className='reaction-area fail';
    area.textContent='❌ Too early!';
    msg.textContent='❌ Too early! Wait for green!';
    setTimeout(startRound,1500);
});

document.getElementById('resetBtn').addEventListener('click',resetGame);
resetGame();
</script>
</body>
</html>
