<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛏️ Astrio Miner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a26;
            color: #d0e8f0;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1a3344;
            color: #4fc3f7;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
        }
        .back-btn:hover { background: #2a4a5e; }
        .container { max-width: 500px; width: 100%; text-align: center; margin-top: 60px; }
        h1 { color: #4fc3f7; font-size: 2.5rem; }
        .subtitle { color: #7cf5b0; margin-bottom: 15px; }

        .stats { display: flex; justify-content: center; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 10px 20px; border-radius: 10px; border: 1px solid #2a4a5e; min-width: 70px; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.2rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.7rem; }

        .mine-area {
            background: #0f1f2e;
            border-radius: 20px;
            padding: 30px;
            border: 2px solid #1a3344;
            margin: 10px 0;
        }

        #asteroidEmoji {
            font-size: 8rem;
            display: block;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }
        #asteroidEmoji:active { transform: scale(0.85); }

        .mine-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 10px 0;
            font-size: 1rem;
            color: #8899aa;
        }
        .mine-info span { color: #ffd93d; font-weight: 700; }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-mine {
            background: linear-gradient(135deg, #ffd93d, #f5a623);
            color: #0b1a26;
        }
        .btn-mine:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,217,61,0.25); }
        .btn-reset {
            background: #1a3344;
            color: #d0e8f0;
            border: 2px solid #2a4a5e;
        }
        .btn-reset:hover { background: #2a4a5e; }

        #message {
            font-size: 1.1rem;
            min-height: 40px;
            color: #ffd93d;
            margin: 15px 0;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            #asteroidEmoji { font-size: 5rem; }
            .btn { padding: 10px 20px; font-size: 0.9rem; }
            .stat-box { padding: 8px 12px; min-width: 60px; }
            .stat-box span { font-size: 1rem; }
        }
    </style>
</head>
<body>

<a href="../base.html" class="back-btn">← Back</a>

<div class="container">
    <h1>⛏️ Astrio Miner</h1>
    <p class="subtitle">Mine asteroids for resources!</p>

    <div class="stats">
        <div class="stat-box">
            <span id="resources">0</span>
            <div class="label">💰 Resources</div>
        </div>
        <div class="stat-box">
            <span id="mines">0</span>
            <div class="label">⛏️ Mines</div>
        </div>
        <div class="stat-box">
            <span id="combo">0</span>
            <div class="label">🔥 Combo</div>
        </div>
    </div>

    <div class="mine-area">
        <div id="asteroidEmoji">☄️</div>
        <div class="mine-info">
            <span>💎 <span id="mineValue">1-5</span></span>
            <span>⚡ <span id="minePower">1x</span></span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-mine" id="mineBtn">⛏️ Mine!</button>
        <button class="btn btn-reset" id="resetBtn">🔄 Reset</button>
    </div>

    <div id="message">☄️ Click the asteroid or press Space to mine!</div>
</div>

<script>
// ============================================================
// ASTRIO MINER - SIMPLE WORKING VERSION
// ============================================================

// Game data
var resources = 0;
var mines = 0;
var combo = 0;

var asteroidTypes = [
    { emoji: '☄️', name: 'Asteroid', min: 1, max: 5 },
    { emoji: '🪨', name: 'Rock', min: 3, max: 8 },
    { emoji: '💎', name: 'Diamond', min: 10, max: 25 },
    { emoji: '🌟', name: 'Star Fragment', min: 5, max: 15 },
    { emoji: '🔮', name: 'Crystal', min: 8, max: 20 },
    { emoji: '✨', name: 'Stardust', min: 15, max: 30 },
    { emoji: '💫', name: 'Cosmic Gem', min: 20, max: 50 },
    { emoji: '⭐', name: 'Star Core', min: 30, max: 60 }
];

var currentAsteroid = asteroidTypes[0];

// ============================================================
// UPDATE UI
// ============================================================
function updateUI() {
    document.getElementById('resources').textContent = resources;
    document.getElementById('mines').textContent = mines;
    document.getElementById('combo').textContent = combo;
}

// ============================================================
// NEW ASTEROID
// ============================================================
function newAsteroid() {
    var random = Math.random();
    var idx = 0;
    if (random < 0.35) idx = 0;
    else if (random < 0.60) idx = 1;
    else if (random < 0.70) idx = 2;
    else if (random < 0.85) idx = 3;
    else if (random < 0.93) idx = 4;
    else if (random < 0.97) idx = 5;
    else if (random < 0.995) idx = 6;
    else idx = 7;
    
    currentAsteroid = asteroidTypes[idx];
    
    document.getElementById('asteroidEmoji').textContent = currentAsteroid.emoji;
    document.getElementById('mineValue').textContent = currentAsteroid.min + '-' + currentAsteroid.max;
    document.getElementById('minePower').textContent = (1 + Math.floor(combo / 5)) + 'x';
}

// ============================================================
// MINE
// ============================================================
function mine() {
    var amount = Math.floor(Math.random() * (currentAsteroid.max - currentAsteroid.min + 1)) + currentAsteroid.min;
    var comboBonus = 1 + Math.floor(combo / 5);
    var totalAmount = amount * comboBonus;
    
    resources += totalAmount;
    mines++;
    combo++;
    
    var msg = document.getElementById('message');
    msg.textContent = '⛏️ Mined ' + totalAmount + ' ' + currentAsteroid.name + '! (' + amount + ' × ' + comboBonus + 'x)';
    
    if (combo >= 10) msg.textContent = '🔥 COMBO x' + combo + '! AMAZING!';
    else if (combo >= 5) msg.textContent = '⚡ Combo x' + combo + '! Keep going!';
    
    updateUI();
    newAsteroid();
}

// ============================================================
// RESET
// ============================================================
function resetGame() {
    if (!confirm('Reset all progress?')) return;
    resources = 0;
    mines = 0;
    combo = 0;
    updateUI();
    newAsteroid();
    document.getElementById('message').textContent = '🔄 Reset! Start mining again!';
}

// ============================================================
// SETUP - RUNS WHEN PAGE LOADS
// ============================================================
function setup() {
    // Mine button
    document.getElementById('mineBtn').onclick = mine;
    
    // Reset button
    document.getElementById('resetBtn').onclick = resetGame;
    
    // Click asteroid
    document.getElementById('asteroidEmoji').onclick = mine;
    
    // Keyboard shortcuts
    document.onkeydown = function(e) {
        if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            mine();
        }
        if (e.key === 'r' || e.key === 'R') {
            resetGame();
        }
    };
    
    // Init
    newAsteroid();
    updateUI();
    document.getElementById('message').textContent = '☄️ Click the asteroid or press Space to mine!';
    console.log('⛏️ Astrio Miner loaded!');
}

// Start when page loads
setup();
</script>
</body>
</html>
