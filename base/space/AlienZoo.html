<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alien Zoo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(10,14,30,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #2a3f5a;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; display: flex; align-items: center; gap: 10px; justify-content: center; }
    h1 i { color: #7cf5b0; }
    .back { display: inline-block; margin-bottom: 1rem; color: #b6ddf5; text-decoration: none; background: #1c4055; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #3a6b88; }
    .back:hover { background: #2a5a78; }
    .zoo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.6rem; margin: 0.8rem 0; }
    .enclosure {
      background: rgba(0,0,0,0.3); border-radius: 1rem; padding: 0.8rem;
      border: 2px solid #1a3a5a; min-height: 120px;
    }
    .enclosure .creature { font-size: 3rem; }
    .enclosure .name { color: white; font-size: 0.8rem; margin-top: 0.2rem; }
    .enclosure .status { font-size: 0.6rem; color: #6a8aaa; }
    .enclosure .action-btn {
      background: #1a3a5a; border: none; padding: 0.2rem 0.8rem;
      border-radius: 40px; color: white; cursor: pointer; font-size: 0.7rem; margin: 0.1rem;
    }
    .enclosure .action-btn:hover { background: #2a5a7a; }
    .enclosure .action-btn.feed { background: #1a4a3a; }
    .enclosure .action-btn.feed:hover { background: #2a6a4a; }
    .enclosure .action-btn.clean { background: #3a3a1a; }
    .enclosure .action-btn.clean:hover { background: #5a5a2a; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin: 0.5rem 0; }
    .stat-box { background: rgba(0,0,0,0.3); border-radius: 0.8rem; padding: 0.4rem; text-align: center; }
    .stat-box .val { color: white; font-size: 1.2rem; font-weight: 700; }
    .stat-box .label { color: #7f9fb9; font-size: 0.65rem; text-transform: uppercase; }
    .action-bar { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin: 0.5rem 0; }
    .action-bar .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.5rem 1.5rem; border-radius: 40px; color: white; cursor: pointer; transition: 0.15s; }
    .action-bar .btn:hover { background: #2a5a7a; }
    .action-bar .btn.danger { background: #4a1a1a; border-color: #6a2a2a; }
    .action-bar .btn.danger:hover { background: #6a2a2a; }
    .message { margin-top: 0.5rem; padding: 0.6rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
    .xp-bar { background: #0a1a2a; border-radius: 1rem; height: 16px; overflow: hidden; border: 1px solid #1a3a5a; margin: 0.3rem 0; }
    .xp-fill { height: 100%; background: linear-gradient(90deg, #4fc3f7, #7cf5b0); border-radius: 1rem; transition: width 0.3s; width: 0%; }
    @media (max-width: 500px) { .zoo-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-paw"></i> Alien Zoo</h1>
  
  <div class="stats-grid">
    <div class="stat-box"><div class="val" id="creaturesDisplay">0</div><div class="label">Creatures</div></div>
    <div class="stat-box"><div class="val" id="levelDisplay">1</div><div class="label">Level</div></div>
    <div class="stat-box"><div class="val" id="xpDisplay">0</div><div class="label">XP</div></div>
  </div>

  <div class="zoo-grid" id="zooGrid"></div>

  <div class="action-bar">
    <button class="btn" id="collectBtn"><i class="fas fa-hand-holding-heart"></i> Collect</button>
    <button class="btn danger" id="resetBtn"><i class="fas fa-rotate"></i> Reset</button>
  </div>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> Care for your alien creatures!</div>
  
  <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#4a6a8a;">
    <span>Happiness: <span id="happinessDisplay">100</span>%</span>
  </div>
  <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
</div>

<script>
  const CREATURES = [
    { name: 'Zorp', emoji: '👾', maxHp: 100 },
    { name: 'Gloop', emoji: '🦑', maxHp: 80 },
    { name: 'Fluff', emoji: '🐉', maxHp: 120 },
    { name: 'Glimmer', emoji: '✨', maxHp: 70 },
    { name: 'Snort', emoji: '🐗', maxHp: 90 },
    { name: 'Wiggles', emoji: '🐛', maxHp: 60 },
    { name: 'Blorp', emoji: '🟣', maxHp: 110 },
    { name: 'Squish', emoji: '🧽', maxHp: 85 },
    { name: 'Zap', emoji: '⚡', maxHp: 75 }
  ];

  let zoo = [];
  let level = 1, xp = 0, xpToNext = 15;
  let happiness = 100;

  const zooGrid = document.getElementById('zooGrid');
  const creaturesDisplay = document.getElementById('creaturesDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const xpFill = document.getElementById('xpFill');
  const happinessDisplay = document.getElementById('happinessDisplay');
  const messageBox = document.getElementById('messageBox');

  function shuffle(arr) { for (let i=arr.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

  function addXP(amount) {
    xp += amount;
    while (xp >= xpToNext) {
      xp -= xpToNext;
      level++;
      xpToNext = Math.floor(xpToNext * 1.3) + 5;
      messageBox.innerHTML = `<i class="fas fa-trophy" style="color:#ffd700;"></i> 🎉 LEVEL UP! You're now level ${level}!`;
    }
    updateUI();
  }

  function collectCreature() {
    if (zoo.length >= 6) {
      messageBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Zoo is full!';
      return;
    }
    const available = CREATURES.filter(c => !zoo.some(z => z.name === c.name));
    if (available.length === 0) {
      messageBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> All creatures collected!';
      return;
    }
    const creature = available[Math.floor(Math.random() * available.length)];
    zoo.push({
      ...creature,
      hp: creature.maxHp,
      hunger: 0,
      dirty: 0
    });
    const xpGain = 5 + Math.floor(level * 0.5);
    addXP(xpGain);
    messageBox.innerHTML = `<i class="fas fa-paw"></i> New creature: ${creature.emoji} ${creature.name}! +${xpGain} XP`;
    renderZoo();
    updateUI();
  }

  function feedCreature(index) {
    const c = zoo[index];
    if (!c) return;
    c.hunger = Math.max(0, c.hunger - 30);
    c.hp = Math.min(c.maxHp, c.hp + 10);
    const xpGain = 3 + Math.floor(level * 0.3);
    addXP(xpGain);
    messageBox.innerHTML = `<i class="fas fa-apple-alt"></i> Fed ${c.emoji} ${c.name}! +${xpGain} XP`;
    renderZoo();
    updateUI();
  }

  function cleanCreature(index) {
    const c = zoo[index];
    if (!c) return;
    c.dirty = Math.max(0, c.dirty - 30);
    c.hp = Math.min(c.maxHp, c.hp + 5);
    const xpGain = 2 + Math.floor(level * 0.2);
    addXP(xpGain);
    messageBox.innerHTML = `<i class="fas fa-soap"></i> Cleaned ${c.emoji} ${c.name}! +${xpGain} XP`;
    renderZoo();
    updateUI();
  }

  function renderZoo() {
    zooGrid.innerHTML = zoo.map((c, i) => {
      const hpPct = Math.floor((c.hp / c.maxHp) * 100);
      const hungerPct = Math.floor(c.hunger);
      const dirtyPct = Math.floor(c.dirty);
      const hpColor = hpPct > 70 ? '#7cf5b0' : hpPct > 40 ? '#f5c87c' : '#ff7a7a';
      return `
        <div class="enclosure">
          <div class="creature">${c.emoji}</div>
          <div class="name">${c.name}</div>
          <div class="status">❤️ ${hpPct}% | 🍽️ ${hungerPct}% | 🧹 ${dirtyPct}%</div>
          <div>
            <button class="action-btn feed" onclick="feedCreature(${i})"><i class="fas fa-apple-alt"></i> Feed</button>
            <button class="action-btn clean" onclick="cleanCreature(${i})"><i class="fas fa-soap"></i> Clean</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function updateUI() {
    creaturesDisplay.textContent = zoo.length;
    levelDisplay.textContent = level;
    xpDisplay.textContent = xp;
    const pct = Math.min(100, (xp / xpToNext) * 100);
    xpFill.style.width = pct + '%';
    happinessDisplay.textContent = Math.floor(happiness);
  }

  function updateZoo() {
    let totalHp = 0;
    for (let c of zoo) {
      c.hunger = Math.min(100, c.hunger + Math.random() * 2);
      c.dirty = Math.min(100, c.dirty + Math.random() * 1.5);
      if (c.hunger > 70) c.hp -= 0.5;
      if (c.dirty > 70) c.hp -= 0.3;
      c.hp = Math.max(0, c.hp);
      totalHp += c.hp / c.maxHp;
    }
    happiness = zoo.length > 0 ? (totalHp / zoo.length) * 100 : 100;
    happiness = Math.max(0, Math.min(100, happiness));
    renderZoo();
    updateUI();
  }

  function resetGame() {
    if (!confirm('Reset zoo?')) return;
    zoo = [];
    level = 1; xp = 0; xpToNext = 15; happiness = 100;
    renderZoo();
    updateUI();
    messageBox.innerHTML = '<i class="fas fa-rotate"></i> Zoo reset!';
  }

  document.getElementById('collectBtn').addEventListener('click', collectCreature);
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  window.feedCreature = feedCreature;
  window.cleanCreature = cleanCreature;

  // Auto-update zoo every 5 seconds
  setInterval(updateZoo, 5000);

  // Start with 2 creatures
  setTimeout(collectCreature, 100);
  setTimeout(collectCreature, 300);

  renderZoo();
  updateUI();
</script>
</body>
</html>
