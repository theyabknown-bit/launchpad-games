<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launchpad Games Hub</title>
    <!-- CSP meta (fallback) -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' data: 'unsafe-inline' 'unsafe-eval'; script-src * 'self' 'unsafe-inline' 'unsafe-eval' data:; style-src * 'self' 'unsafe-inline'; img-src * 'self' data: https:; connect-src * 'self' https:;">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <!-- Include Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* minimal styling for forms */
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #d0e8f0; font-size: 14px; }
        .form-group input { padding: 10px; border: 2px solid rgba(79,195,247,0.1); border-radius: 8px; background: rgba(0,0,0,0.3); color: #d0e8f0; font-size: 14px; }
        .form-group input:focus { border-color: #4fc3f7; outline: none; }
        .btn-primary { background: #4fc3f7; color: #0b1a26; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .btn-success { background: #7cf5b0; color: #0b1a26; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <!-- Your existing content goes here -->
    <!-- We'll keep it minimal for demo; but we'll put the forms with labels -->

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('loginModal').classList.remove('show')">&times;</span>
            <h2>Login</h2>
            <form id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>
                <div id="loginError" style="display:none;color:#ff6b6b;"></div>
                <button type="submit" class="btn-primary" id="loginSubmitBtn" onclick="loginUser()">Login</button>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('registerModal').classList.remove('show')">&times;</span>
            <h2>Register</h2>
            <form id="registerForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="Choose username" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Choose password" required>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
                </div>
                <div id="registerError" style="display:none;color:#ff6b6b;"></div>
                <button type="submit" class="btn-success" id="registerSubmitBtn" onclick="registerUser()">Register</button>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIG (with modern settings)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBlNDLv-6M3Qt6skPY6e37t8-cCBieck00",
            authDomain: "mono-launchgamepad.firebaseapp.com",
            projectId: "mono-launchgamepad",
            storageBucket: "mono-launchgamepad.firebasestorage.app",
            messagingSenderId: "577252894102",
            appId: "1:577252894102:web:f67df25ddaa7096e5029b7",
            measurementId: "G-9FFFLNB8T1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Modern cache settings (prevents deprecation warning)
        db.settings({
            cache: {
                enabled: true,
                tabSync: true
            }
        });

        console.log("✅ Firestore configured");

        // ============================================================
        // CONSOLE WARN SUPPRESSION (fixes unload violations)
        // ============================================================
        (function() {
            var ow = console.warn;
            console.warn = function() {
                if (arguments.length && typeof arguments[0] === "string" && arguments[0].includes("unload is not allowed")) {
                    return;
                }
                ow.apply(console, arguments);
            };
            console.log("✅ unload warnings suppressed");
        })();

        // ============================================================
        // REGISTRATION & LOGIN (global functions)
        // ============================================================
        window.registerUser = function() {
            console.log("🔵 Register clicked");
            var username = document.getElementById('regUsername').value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var password = document.getElementById('regPassword').value.trim();
            var error = document.getElementById('registerError');

            error.style.display = 'none';
            error.textContent = '';

            if (!username || !email || !password) {
                error.textContent = '⚠️ Please fill in all fields';
                error.style.display = 'block';
                return;
            }
            if (username.length < 3) {
                error.textContent = '⚠️ Username must be at least 3 characters';
                error.style.display = 'block';
                return;
            }
            if (email.indexOf('@') === -1 || email.indexOf('.') === -1) {
                error.textContent = '⚠️ Please enter a valid email';
                error.style.display = 'block';
                return;
            }
            if (password.length < 4) {
                error.textContent = '⚠️ Password must be at least 4 characters';
                error.style.display = 'block';
                return;
            }

            // Save offline (localStorage) – simple demo
            var users = JSON.parse(localStorage.getItem('offlineUsers') || '{}');
            if (users[username]) {
                error.textContent = '⚠️ Username "' + username + '" already taken';
                error.style.display = 'block';
                return;
            }

            users[username] = {
                password: password,
                email: email,
                friendCode: '123ABC',
                deviceName: 'Browser',
                friends: [],
                friendRequests: [],
                bio: '',
                achievements: [],
                gameAchievements: [],
                chatCount: 0,
                createdAt: new Date().toISOString()
            };
            localStorage.setItem('offlineUsers', JSON.stringify(users));

            // Auto-login
            localStorage.setItem('launchPadUser', username);
            alert('🎉 Registration successful! Welcome ' + username + '!');
            document.getElementById('registerModal').classList.remove('show');
            // You can reload or update UI here
            location.reload(); // simplest for demo
        };

        window.loginUser = function() {
            console.log("🔵 Login clicked");
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            var error = document.getElementById('loginError');

            error.style.display = 'none';
            error.textContent = '';

            if (!username || !password) {
                error.textContent = '⚠️ Please enter username and password';
                error.style.display = 'block';
                return;
            }

            var users = JSON.parse(localStorage.getItem('offlineUsers') || '{}');
            if (!users[username]) {
                error.textContent = '⚠️ Username not found. Please register first.';
                error.style.display = 'block';
                return;
            }
            if (users[username].password !== password) {
                error.textContent = '⚠️ Incorrect password';
                error.style.display = 'block';
                return;
            }

            localStorage.setItem('launchPadUser', username);
            alert('🎉 Welcome back, ' + username + '!');
            document.getElementById('loginModal').classList.remove('show');
            location.reload();
        };

        console.log("✅ registerUser and loginUser ready");

        // ============================================================
        // AUTO‑LABEL FALLBACK (for any other inputs)
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('input:not([type="hidden"]):not([type="submit"]):not([type="button"])').forEach(function(input) {
                if (!input.id) return;
                if (!document.querySelector('label[for="' + input.id + '"]')) {
                    var label = document.createElement('label');
                    label.setAttribute('for', input.id);
                    label.textContent = input.placeholder || input.name || input.id;
                    input.parentNode.insertBefore(label, input);
                }
            });
        });
    </script>
<script>
// Register Service Worker to override CSP
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
        .then(function(reg) {
            console.log('✅ Service Worker registered with scope:', reg.scope);
        })
        .catch(function(err) {
            console.error('❌ Service Worker registration failed:', err);
        });
    // Force reload once the worker takes control
    navigator.serviceWorker.addEventListener('controllerchange', function() {
        console.log('🔄 Service Worker activated – reloading to apply CSP');
        location.reload();
    });
}
</script>
</body>
</html>
