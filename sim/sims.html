<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Sims Mini</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #d0e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(26,51,68,0.3);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid rgba(79,195,247,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header .title {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #4fc3f7, #7cf5b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: #8899aa;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat {
            background: rgba(0,0,0,0.3);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(79,195,247,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat .label { font-size: 0.8rem; color: #8899aa; }
        .stat .value { font-weight: 700; font-size: 1.1rem; }
        .stat .value.money { color: #ffd93d; }
        .stat .value.happiness { color: #ff6b6b; }
        .stat .value.energy { color: #4fc3f7; }
        .stat .value.knowledge { color: #7cf5b0; }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            color: #0b1a26;
            font-family: 'Segoe UI', sans-serif;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.95); }
        .btn-study { background: linear-gradient(135deg, #7cf5b0, #4fc3f7); }
        .btn-work { background: linear-gradient(135deg, #ffd93d, #f6b93b); }
        .btn-relax { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .btn-job { background: linear-gradient(135deg, #a29bfe, #6c5ce7); color: white; }

        .job-section {
            margin: 15px 0;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            border: 1px solid rgba(79,195,247,0.05);
        }
        .job-section select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #d0e8f0;
            border: 1px solid rgba(79,195,247,0.2);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .job-section .job-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8899aa;
        }
        .job-section .job-info span { color: #d0e8f0; }

        .message {
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            min-height: 40px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .message .emoji { margin-right: 6px; }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #4fc3f7;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-btn:hover { text-decoration: underline; }

        @media (max-width: 500px) {
            .stats { grid-template-columns: 1fr 1fr; }
            .actions { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">🏠 Sims Mini</div>
        <div class="sub">Live your digital life</div>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat"><span class="label">💰 Money</span><span class="value money" id="money">100</span></div>
        <div class="stat"><span class="label">😊 Happiness</span><span class="value happiness" id="happiness">80</span></div>
        <div class="stat"><span class="label">⚡ Energy</span><span class="value energy" id="energy">70</span></div>
        <div class="stat"><span class="label">📚 Knowledge</span><span class="value knowledge" id="knowledge">10</span></div>
    </div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn btn-study" onclick="study()"><i class="fas fa-book"></i> Study</button>
        <button class="btn btn-work" onclick="work()"><i class="fas fa-briefcase"></i> Work</button>
        <button class="btn btn-relax" onclick="relax()"><i class="fas fa-bed"></i> Relax</button>
        <button class="btn btn-job" onclick="showJobInfo()"><i class="fas fa-user-tie"></i> Job Info</button>
    </div>

    <!-- Job System -->
    <div class="job-section">
        <label for="jobSelect">Choose your career:</label>
        <select id="jobSelect" onchange="changeJob()">
            <option value="unemployed">Unemployed ($0/hr)</option>
            <option value="cashier">Cashier ($5/hr)</option>
            <option value="teacher">Teacher ($10/hr)</option>
            <option value="doctor">Doctor ($15/hr) - needs Knowledge 30</option>
            <option value="programmer">Programmer ($20/hr) - needs Knowledge 50</option>
            <option value="engineer">Engineer ($25/hr) - needs Knowledge 70</option>
        </select>
        <div class="job-info">
            <span>Current Job: <span id="currentJobDisplay">Unemployed</span></span>
            <span>Pay: <span id="payDisplay">$0</span>/hr</span>
        </div>
    </div>

    <!-- Message Area -->
    <div class="message" id="message">💡 Click Study to gain knowledge, Work to earn money!</div>

    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
</div>

<script>
// ============================================================
// SIMS STATE (saved in localStorage)
// ============================================================
const DEFAULT_STATE = {
    money: 100,
    happiness: 80,
    energy: 70,
    knowledge: 10,
    job: 'unemployed'
};

const JOBS = {
    unemployed: { label: 'Unemployed', pay: 0, reqKnowledge: 0 },
    cashier: { label: 'Cashier', pay: 5, reqKnowledge: 0 },
    teacher: { label: 'Teacher', pay: 10, reqKnowledge: 0 },
    doctor: { label: 'Doctor', pay: 15, reqKnowledge: 30 },
    programmer: { label: 'Programmer', pay: 20, reqKnowledge: 50 },
    engineer: { label: 'Engineer', pay: 25, reqKnowledge: 70 }
};

let state = {};

function loadState() {
    try {
        const saved = localStorage.getItem('simsUltimate');
        if (saved) {
            state = JSON.parse(saved);
        } else {
            state = { ...DEFAULT_STATE };
        }
    } catch(e) {
        state = { ...DEFAULT_STATE };
    }
    // Ensure all fields exist
    for (let key in DEFAULT_STATE) {
        if (!(key in state)) state[key] = DEFAULT_STATE[key];
    }
    if (!(state.job in JOBS)) state.job = 'unemployed';
}

function saveState() {
    localStorage.setItem('simsUltimate', JSON.stringify(state));
}

function updateUI() {
    document.getElementById('money').textContent = state.money;
    document.getElementById('happiness').textContent = state.happiness;
    document.getElementById('energy').textContent = state.energy;
    document.getElementById('knowledge').textContent = state.knowledge;

    // Update job display
    const job = JOBS[state.job];
    document.getElementById('currentJobDisplay').textContent = job.label;
    document.getElementById('payDisplay').textContent = '$' + job.pay;

    // Set select to current job
    document.getElementById('jobSelect').value = state.job;
}

function setMessage(text, isGood = true) {
    const el = document.getElementById('message');
    el.innerHTML = text;
    el.style.borderColor = isGood ? 'rgba(124,245,176,0.2)' : 'rgba(255,107,107,0.2)';
}

// ============================================================
// ACTIONS
// ============================================================
function study() {
    if (state.energy < 10) {
        setMessage('😴 Too tired to study! Relax first.', false);
        return;
    }
    state.energy -= 10;
    state.knowledge += 5;
    state.happiness -= 2; // studying is boring
    if (state.happiness < 0) state.happiness = 0;
    saveState();
    updateUI();
    setMessage('📚 Studied hard! Knowledge +5, Energy -10.');
}

function work() {
    const job = JOBS[state.job];
    if (job.pay === 0) {
        setMessage('💼 You have no job! Choose a career first.', false);
        return;
    }
    if (state.energy < 15) {
        setMessage('😴 Too tired to work! Relax first.', false);
        return;
    }
    if (state.happiness < 10) {
        setMessage('😢 Too unhappy to work! Do something fun.', false);
        return;
    }
    // Check knowledge requirement
    if (state.knowledge < job.reqKnowledge) {
        setMessage(`📚 You need ${job.reqKnowledge} Knowledge to work as ${job.label}. Study more!`, false);
        return;
    }
    state.energy -= 15;
    state.happiness -= 5;
    state.money += job.pay;
    if (state.happiness < 0) state.happiness = 0;
    saveState();
    updateUI();
    setMessage(`💰 Worked as ${job.label} and earned $${job.pay}!`);
}

function relax() {
    if (state.energy >= 100) {
        setMessage('⚡ Already full energy!', false);
        return;
    }
    state.energy += 20;
    if (state.energy > 100) state.energy = 100;
    state.happiness += 5;
    if (state.happiness > 100) state.happiness = 100;
    saveState();
    updateUI();
    setMessage('😌 Relaxed! Energy +20, Happiness +5.');
}

// ============================================================
// JOB SYSTEM
// ============================================================
function changeJob() {
    const selected = document.getElementById('jobSelect').value;
    const job = JOBS[selected];
    if (state.knowledge < job.reqKnowledge) {
        setMessage(`📚 You need ${job.reqKnowledge} Knowledge to become ${job.label}.`, false);
        // Revert select back to current job
        document.getElementById('jobSelect').value = state.job;
        return;
    }
    state.job = selected;
    saveState();
    updateUI();
    setMessage(`💼 You are now a ${job.label}!`);
}

function showJobInfo() {
    const job = JOBS[state.job];
    let req = job.reqKnowledge > 0 ? `Requires ${job.reqKnowledge} Knowledge` : 'No requirements';
    setMessage(`💼 ${job.label}: $${job.pay}/hr. ${req}`);
}

// ============================================================
// INIT
// ============================================================
loadState();
updateUI();
setMessage('💡 Click Study to gain knowledge, Work to earn money!');
console.log('✅ Sims Mini loaded with Study and Job system.');
</script>
</body>
</html>
