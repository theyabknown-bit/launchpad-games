<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashier Sim · Retail Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e121a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-container {
      max-width: 1100px;
      width: 100%;
      background: rgba(18, 28, 40, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 3rem;
      padding: 2rem;
      border: 1px solid rgba(100, 200, 255, 0.12);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      border-bottom: 1px solid rgba(100, 200, 255, 0.08);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      color: white;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 i { color: #4fc3f7; }
    .back-btn {
      background: #1a3045;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      text-decoration: none;
      color: #b0d4f0;
      border: 1px solid #2a5a7a;
      font-size: 0.9rem;
    }
    .back-btn:hover { background: #2a4a6a; }

    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 760px) { .main-grid { grid-template-columns: 1fr; } }

    .panel {
      background: rgba(10, 20, 30, 0.6);
      border-radius: 1.5rem;
      padding: 1.2rem;
      border: 1px solid rgba(100, 200, 255, 0.06);
    }
    .panel-title {
      color: #8ab4d8;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .customer-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 280px;
      overflow-y: auto;
    }
    .customer-list::-webkit-scrollbar { width: 4px; }
    .customer-list::-webkit-scrollbar-thumb { background: #2a5a7a; border-radius: 10px; }

    .customer-card {
      background: rgba(20, 40, 60, 0.4);
      border-radius: 1rem;
      padding: 0.8rem 1rem;
      border-left: 4px solid #4fc3f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .customer-card .info { display: flex; flex-direction: column; }
    .customer-card .name { color: white; font-weight: 600; font-size: 1rem; }
    .customer-card .detail { color: #8ab4d8; font-size: 0.8rem; }
    .customer-card .status { font-size: 0.75rem; padding: 0.15rem 0.8rem; border-radius: 20px; background: #1a3a2a; color: #7cf5b0; }
    .customer-card .status.waiting { background: #1a2a3a; color: #7fc9ff; }
    .customer-card .status.served { background: #1a3a2a; color: #7cf5b0; }
    .customer-card .status.angry { background: #3a1a1a; color: #ff7a7a; }
    .customer-card .action-btn {
      background: #1a4a6a;
      border: none;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.1s;
    }
    .customer-card .action-btn:hover { background: #2a6a8a; }
    .customer-card .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .stat-box {
      background: rgba(0,0,0,0.3);
      border-radius: 0.8rem;
      padding: 0.6rem 1rem;
      text-align: center;
    }
    .stat-box .val { color: white; font-size: 1.4rem; font-weight: 700; }
    .stat-box .label { color: #7f9fb9; font-size: 0.7rem; text-transform: uppercase; }
    .stat-box .val i { color: #4fc3f7; font-size: 1.2rem; margin-right: 4px; }

    .xp-bar {
      background: #0a1a2a;
      border-radius: 1rem;
      height: 18px;
      overflow: hidden;
      border: 1px solid #1a3a5a;
      margin: 0.5rem 0;
    }
    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #4fc3f7, #7cf5b0);
      border-radius: 1rem;
      transition: width 0.3s;
      width: 0%;
    }

    .log-area {
      background: rgba(0,0,0,0.3);
      border-radius: 0.8rem;
      padding: 0.6rem;
      max-height: 100px;
      overflow-y: auto;
      font-size: 0.8rem;
      color: #9bbfd9;
      border: 1px solid rgba(100, 200, 255, 0.05);
    }
    .log-area::-webkit-scrollbar { width: 4px; }
    .log-area::-webkit-scrollbar-thumb { background: #2a5a7a; border-radius: 10px; }
    .log-entry { padding: 0.2rem 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .log-entry i { margin-right: 6px; }

    .computer-panel {
      background: rgba(0, 20, 30, 0.5);
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid #1a3a5a;
      margin-top: 0.8rem;
    }
    .computer-panel .screen {
      background: #0a121a;
      border-radius: 0.6rem;
      padding: 0.8rem;
      font-family: 'Courier New', monospace;
      color: #7cf5b0;
      font-size: 0.85rem;
      min-height: 60px;
      border: 1px solid #1a3a5a;
    }
    .computer-panel .screen .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .action-bar {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }
    .action-bar .btn {
      background: #1a3a5a;
      border: 1px solid #2a5a7a;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.1s;
    }
    .action-bar .btn:hover { background: #2a5a7a; }
    .action-bar .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .level-up {
      background: linear-gradient(135deg, #1a4a3a, #2a6a4a);
      border: 2px solid #7cf5b0;
      border-radius: 1rem;
      padding: 0.8rem;
      text-align: center;
      color: white;
      margin: 0.5rem 0;
      display: none;
    }
    .level-up.show { display: block; }
    .level-up i { color: #ffd966; font-size: 1.5rem; }

    /* Mini-game overlay */
    .minigame-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .minigame-overlay.show { display: flex; }
    .minigame-box {
      background: #1a2a3a;
      border-radius: 2rem;
      padding: 2rem;
      max-width: 580px;
      width: 100%;
      border: 2px solid #4fc3f7;
      box-shadow: 0 0 60px rgba(79,195,247,0.15);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .minigame-box h2 {
      color: white;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .minigame-box h2 i { color: #ffb347; }
    .minigame-box .close-btn {
      position: sticky;
      top: 0;
      float: right;
      background: none;
      border: none;
      color: #6a8aaa;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
    }
    .minigame-box .close-btn:hover { color: white; }
    .minigame-content { color: #d0e8f0; }
    .minigame-content .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin: 1rem 0;
    }
    .minigame-content .option-btn {
      background: #0a1a2a;
      border: 2px solid #2a4a5a;
      padding: 0.8rem;
      border-radius: 1rem;
      color: white;
      cursor: pointer;
      transition: 0.1s;
      font-size: 1rem;
    }
    .minigame-content .option-btn:hover:not(:disabled) { background: #1a3a5a; border-color: #4fc3f7; }
    .minigame-content .option-btn.correct { border-color: #7cf5b0; background: #1a4a3a; }
    .minigame-content .option-btn.wrong { border-color: #ff7a7a; background: #4a1a1a; }
    .minigame-content .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .minigame-content .result-msg {
      padding: 0.8rem;
      border-radius: 0.8rem;
      margin: 0.8rem 0;
      text-align: center;
      font-weight: 600;
    }
    .minigame-content .result-msg.success { background: #1a4a3a; color: #7cf5b0; }
    .minigame-content .result-msg.fail { background: #4a1a1a; color: #ff7a7a; }
    .minigame-content .timer { color: #ffb347; font-size: 1.2rem; font-weight: 700; }
    .minigame-content .math-display { font-size: 2.5rem; text-align: center; padding: 0.5rem; background: #0a121a; border-radius: 1rem; margin: 0.5rem 0; }
    .minigame-content .math-input { display: flex; gap: 0.8rem; justify-content: center; align-items: center; flex-wrap: wrap; }
    .minigame-content .math-input input {
      background: #0a121a;
      border: 2px solid #2a4a5a;
      padding: 0.6rem 1rem;
      border-radius: 60px;
      font-size: 1.2rem;
      color: white;
      width: 120px;
      text-align: center;
      outline: none;
    }
    .minigame-content .math-input input:focus { border-color: #4fc3f7; }

    @media (max-width: 500px) {
      .game-container { padding: 1rem; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .minigame-box { padding: 1.2rem; }
      .minigame-content .options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <h1><i class="fas fa-cash-register"></i> Cashier Sim</h1>
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> back</a>
  </div>

  <!-- Level Up Notification -->
  <div class="level-up" id="levelUpBox">
    <i class="fas fa-arrow-up"></i> <span id="levelUpText">LEVEL UP!</span>
  </div>

  <div class="main-grid">
    <!-- Left: Customers & Actions -->
    <div class="panel">
      <div class="panel-title">
        <span><i class="fas fa-users"></i> Customers</span>
        <span style="font-size:0.7rem; color:#4a6a8a;" id="customerCount">0 waiting</span>
      </div>
      <div class="customer-list" id="customerList">
        <div style="color:#4a6a8a; text-align:center; padding:1rem;">No customers yet. Wait for them to arrive!</div>
      </div>

      <div class="action-bar">
        <button class="btn" id="serveBtn"><i class="fas fa-handshake"></i> Serve</button>
        <button class="btn" id="mathBtn"><i class="fas fa-calculator"></i> Math</button>
        <button class="btn" id="talkBtn"><i class="fas fa-comment"></i> Talk</button>
        <button class="btn" id="restBtn"><i class="fas fa-coffee"></i> Rest</button>
      </div>
    </div>

    <!-- Right: Stats, XP, Computer -->
    <div class="panel">
      <div class="panel-title">
        <span><i class="fas fa-chart-line"></i> Status</span>
        <span style="font-size:0.7rem; color:#4a6a8a;">Level <span id="levelDisplay">1</span></span>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><div class="val" id="xpDisplay">0</div><div class="label">XP</div></div>
        <div class="stat-box"><div class="val" id="energyDisplay">100</div><div class="label">Energy</div></div>
        <div class="stat-box"><div class="val" id="servedDisplay">0</div><div class="label">Served</div></div>
        <div class="stat-box"><div class="val" id="moneyDisplay">$0</div><div class="label">Earnings</div></div>
      </div>

      <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#4a6a8a;">
        <span>XP to next: <span id="xpToNext">20</span></span>
        <span>Speed: <span id="speedDisplay">100</span>%</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>

      <!-- Computer / Cash Register -->
      <div class="computer-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
          <span style="color:#4a6a8a; font-size:0.7rem;"><i class="fas fa-desktop"></i> POS System</span>
          <span style="color:#2a5a7a; font-size:0.6rem;" id="timeDisplay">00:00</span>
        </div>
        <div class="screen" id="computerScreen">
          <span style="color:#4a6a8a;">> register ready</span><br>
          <span style="color:#7cf5b0;">> welcome, cashier</span><span class="cursor">▌</span>
        </div>
      </div>

      <!-- Log -->
      <div class="panel-title" style="margin-top:0.8rem;"><span><i class="fas fa-list"></i> Log</span></div>
      <div class="log-area" id="logArea">
        <div class="log-entry"><i class="fas fa-info-circle" style="color:#4a6a8a;"></i> Welcome to Cashier Sim</div>
      </div>
    </div>
  </div>
</div>

<!-- MINI-GAME OVERLAY -->
<div class="minigame-overlay" id="minigameOverlay">
  <div class="minigame-box">
    <button class="close-btn" id="closeMinigame"><i class="fas fa-times"></i></button>
    <h2 id="minigameTitle"><i class="fas fa-gamepad"></i> Mini-Game</h2>
    <div class="minigame-content" id="minigameContent">
      <div id="minigameBody"></div>
    </div>
  </div>
</div>

<script>
  // ===================== GAME STATE =====================
  const state = {
    level: 1,
    xp: 0,
    energy: 100,
    served: 0,
    money: 0,
    customers: [],
    log: [],
    time: 0,
    tickInterval: null,
    gameRunning: true,
    miniGameActive: false,
    currentCustomer: null,
  };

  const XP_PER_LEVEL = 20;
  const MAX_ENERGY = 100;
  const CUSTOMER_NAMES = ['Emma W.', 'Liam K.', 'Sophia R.', 'Noah C.', 'Olivia P.', 'Mason D.', 'Ava S.', 'Ethan J.', 'Mia L.', 'Logan B.'];
  const ITEMS = ['Bread', 'Milk', 'Eggs', 'Butter', 'Cheese', 'Apples', 'Bananas', 'Rice', 'Pasta', 'Chicken', 'Fish', 'Juice'];
  const CONVERSATION_TOPICS = ['Weather', 'Sports', 'News', 'Holiday', 'Movies', 'Music', 'Food', 'Travel', 'Family', 'Work'];

  // DOM refs
  const customerList = document.getElementById('customerList');
  const customerCount = document.getElementById('customerCount');
  const levelDisplay = document.getElementById('levelDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const energyDisplay = document.getElementById('energyDisplay');
  const servedDisplay = document.getElementById('servedDisplay');
  const moneyDisplay = document.getElementById('moneyDisplay');
  const xpFill = document.getElementById('xpFill');
  const xpToNext = document.getElementById('xpToNext');
  const speedDisplay = document.getElementById('speedDisplay');
  const computerScreen = document.getElementById('computerScreen');
  const logArea = document.getElementById('logArea');
  const levelUpBox = document.getElementById('levelUpBox');
  const levelUpText = document.getElementById('levelUpText');
  const timeDisplay = document.getElementById('timeDisplay');

  // Mini-game refs
  const minigameOverlay = document.getElementById('minigameOverlay');
  const minigameBody = document.getElementById('minigameBody');
  const minigameTitle = document.getElementById('minigameTitle');
  const closeMinigameBtn = document.getElementById('closeMinigame');

  let minigameCallback = null;
  let timerInterval = null;

  // ===================== HELPERS =====================
  function random(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function getSpeed() {
    let base = 100;
    if (state.energy < 30) base -= 30;
    else if (state.energy < 50) base -= 15;
    base += state.level * 3;
    return Math.min(150, Math.max(40, base));
  }

  function getXpForLevel() { return XP_PER_LEVEL + (state.level - 1) * 6; }

  function addLog(msg, icon = 'fa-info-circle', color = '#4a6a8a') {
    state.log.unshift({ msg, icon, color });
    if (state.log.length > 30) state.log.pop();
    renderLog();
  }

  function renderLog() {
    logArea.innerHTML = state.log.map(e =>
      `<div class="log-entry"><i class="fas ${e.icon}" style="color:${e.color};"></i> ${e.msg}</div>`
    ).join('');
  }

  function updateComputer(text, color = '#7cf5b0') {
    const lines = computerScreen.innerHTML.split('<br>');
    if (lines.length > 5) lines.shift();
    const newLine = `<span style="color:${color};">> ${text}</span>`;
    lines.push(newLine);
    computerScreen.innerHTML = lines.join('<br>') + '<span class="cursor">▌</span>';
    computerScreen.scrollTop = computerScreen.scrollHeight;
  }

  function addXP(amount) {
    const speed = getSpeed() / 100;
    const actual = Math.round(amount * speed);
    state.xp += actual;
    state.served += 1;
    updateUI();
    addLog(`+${actual} XP (${Math.round(speed*100)}% speed)`, 'fa-star', '#ffd966');
    updateComputer(`+${actual} XP earned`, '#ffd966');
    checkLevelUp();
  }

  function checkLevelUp() {
    const needed = getXpForLevel();
    while (state.xp >= needed) {
      state.xp -= needed;
      state.level++;
      state.energy = Math.min(MAX_ENERGY, state.energy + 20);
      addLog(`🎉 LEVEL UP! You are now level ${state.level}`, 'fa-trophy', '#ffd966');
      updateComputer(`🎉 LEVEL ${state.level} REACHED!`, '#ffd966');
      levelUpBox.classList.add('show');
      levelUpText.textContent = `LEVEL ${state.level}! +${state.level*3}% speed`;
      setTimeout(() => levelUpBox.classList.remove('show'), 3000);
      updateUI();
    }
    updateUI();
  }

  // ===================== CUSTOMER SYSTEM =====================
  function generateCustomer() {
    const name = random(CUSTOMER_NAMES);
    const itemCount = rand(2, 5);
    const items = [];
    for (let i = 0; i < itemCount; i++) {
      items.push({ name: random(ITEMS), price: rand(1, 15) });
    }
    const total = items.reduce((sum, item) => sum + item.price, 0);
    return {
      id: Date.now() + Math.random(),
      name,
      items,
      total,
      patience: 100,
      status: 'waiting',
      served: false,
      happiness: 100,
    };
  }

  function spawnCustomer() {
    if (state.customers.length >= 6) return;
    const customer = generateCustomer();
    state.customers.push(customer);
    state.currentCustomer = customer;
    addLog(`${customer.name} arrived with ${customer.items.length} items ($${customer.total})`, 'fa-user-plus', '#4fc3f7');
    updateComputer(`${customer.name} at register`, '#4fc3f7');
    renderCustomers();
    updateUI();
  }

  // ===================== SERVE CUSTOMER =====================
  function serveCustomer() {
    if (state.energy < 10) {
      addLog('Too tired! Rest first.', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    const waiting = state.customers.filter(c => c.status === 'waiting');
    if (waiting.length === 0) {
      addLog('No customers waiting.', 'fa-info-circle', '#4a6a8a');
      return;
    }
    const customer = waiting[0];
    state.currentCustomer = customer;
    // Start math mini-game
    startMathGame(customer);
  }

  // ===================== MATH MINI-GAME =====================
  function startMathGame(customer) {
    if (state.miniGameActive) return;
    state.miniGameActive = true;
    minigameOverlay.classList.add('show');
    minigameTitle.innerHTML = '<i class="fas fa-calculator"></i> Cashier Math';

    const total = customer.total;
    const paid = total + rand(1, 5);
    const change = paid - total;
    const operation = random(['+', '-', '*']);
    let a, b, correctAnswer;
    if (operation === '+') { a = rand(5, 30); b = rand(5, 30); correctAnswer = a + b; }
    else if (operation === '-') { a = rand(15, 50); b = rand(5, a-1); correctAnswer = a - b; }
    else { a = rand(2, 10); b = rand(2, 8); correctAnswer = a * b; }

    let timeLeft = 12;
    let timerRunning = true;

    minigameBody.innerHTML = `
      <p style="margin-bottom:0.5rem;"><strong>Customer:</strong> ${customer.name}</p>
      <p style="margin-bottom:0.5rem;">Total: $${total} | Paid: $${paid} | Change: $${change}</p>
      <p style="margin-bottom:0.5rem;">Calculate:</p>
      <div class="math-display">${a} ${operation} ${b} = ?</div>
      <div class="timer" id="mathTimer">⏱️ ${timeLeft}s</div>
      <div class="math-input">
        <input type="number" id="mathAnswer" placeholder="answer" autofocus>
        <button class="option-btn" id="mathSubmit" style="padding:0.6rem 1.5rem;">Submit</button>
      </div>
      <div id="mathResult"></div>
    `;

    const answerInput = document.getElementById('mathAnswer');
    const submitBtn = document.getElementById('mathSubmit');
    const timerDisplay = document.getElementById('mathTimer');
    const resultDiv = document.getElementById('mathResult');

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = `⏱️ ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-clock"></i> Time\'s up! The answer was: ${correctAnswer}</div>`;
        setTimeout(() => {
          closeMinigame();
          renderCustomers();
          updateUI();
        }, 2000);
      }
    }, 1000);

    function checkMath() {
      if (!timerRunning) return;
      const val = parseInt(answerInput.value);
      if (isNaN(val)) {
        resultDiv.innerHTML = `<div class="result-msg fail">Enter a number!</div>`;
        return;
      }
      clearInterval(timerInterval);
      timerRunning = false;
      answerInput.disabled = true;
      submitBtn.disabled = true;

      const isCorrect = val === correctAnswer;
      if (isCorrect) {
        const bonus = Math.max(3, timeLeft);
        const xpGain = 10 + bonus;
        addXP(xpGain);
        state.money += customer.total;
        customer.status = 'served';
        customer.served = true;
        addLog(`✅ Served ${customer.name}! +$${customer.total} +${xpGain} XP`, 'fa-check-circle', '#7cf5b0');
        updateComputer(`served ${customer.name}`, '#7cf5b0');
        resultDiv.innerHTML = `<div class="result-msg success"><i class="fas fa-check-circle"></i> Correct! +${xpGain} XP (time bonus ${bonus})</div>`;
        setTimeout(() => {
          closeMinigame();
          removeCustomer(customer.id);
          renderCustomers();
          updateUI();
        }, 2000);
      } else {
        resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-times-circle"></i> Wrong. The answer was: ${correctAnswer}</div>`;
        customer.patience -= 30;
        if (customer.patience <= 0) {
          customer.status = 'angry';
          addLog(`😡 ${customer.name} left angry!`, 'fa-exclamation-triangle', '#ff7a7a');
          updateComputer(`${customer.name} left angry`, '#ff7a7a');
          setTimeout(() => {
            closeMinigame();
            removeCustomer(customer.id);
            renderCustomers();
            updateUI();
          }, 2000);
        } else {
          setTimeout(() => {
            closeMinigame();
            renderCustomers();
            updateUI();
          }, 1500);
        }
      }
    }

    submitBtn.addEventListener('click', checkMath);
    answerInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); checkMath(); }
    });
    setTimeout(() => answerInput.focus(), 100);
  }

  // ===================== TALK MINI-GAME =====================
  function startTalkGame() {
    if (state.miniGameActive) return;
    const waiting = state.customers.filter(c => c.status === 'waiting');
    if (waiting.length === 0) {
      addLog('No customers to talk to.', 'fa-info-circle', '#4a6a8a');
      return;
    }
    if (state.energy < 8) {
      addLog('Too tired to talk!', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    const customer = waiting[0];
    state.miniGameActive = true;
    minigameOverlay.classList.add('show');
    minigameTitle.innerHTML = '<i class="fas fa-comment"></i> Customer Chat';

    const topics = ['Weather', 'Sports', 'News', 'Holiday', 'Movies', 'Music', 'Food', 'Travel', 'Family', 'Work'];
    const correctTopic = random(topics);
    const wrongTopics = topics.filter(t => t !== correctTopic).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [correctTopic, ...wrongTopics].sort(() => Math.random() - 0.5);
    const questions = [
      `What do you think about the ${correctTopic.toLowerCase()} today?`,
      `Do you follow ${correctTopic.toLowerCase()} closely?`,
      `What's your favorite thing about ${correctTopic.toLowerCase()}?`
    ];
    const question = random(questions);
    let timeLeft = 10;
    let timerRunning = true;

    minigameBody.innerHTML = `
      <p style="margin-bottom:0.5rem;"><strong>Customer:</strong> ${customer.name}</p>
      <p style="margin-bottom:0.5rem;">They say: "${question}"</p>
      <p style="margin-bottom:0.5rem;">What topic are they interested in?</p>
      <div class="timer" id="talkTimer">⏱️ ${timeLeft}s</div>
      <div class="options">
        ${options.map(opt => `<button class="option-btn" data-answer="${opt}">${opt}</button>`).join('')}
      </div>
      <div id="talkResult"></div>
    `;

    const btns = minigameBody.querySelectorAll('.option-btn');
    const timerDisplay = document.getElementById('talkTimer');
    const resultDiv = document.getElementById('talkResult');

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = `⏱️ ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        btns.forEach(b => b.disabled = true);
        resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-clock"></i> Time\'s up! They were interested in: ${correctTopic}</div>`;
        customer.patience -= 20;
        setTimeout(() => {
          closeMinigame();
          renderCustomers();
          updateUI();
        }, 2000);
      }
    }, 1000);

    btns.forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.disabled || !timerRunning) return;
        clearInterval(timerInterval);
        btns.forEach(b => b.disabled = true);
        const isCorrect = this.dataset.answer === correctTopic;
        if (isCorrect) {
          this.classList.add('correct');
          const bonus = Math.max(3, timeLeft);
          const xpGain = 8 + bonus;
          addXP(xpGain);
          customer.happiness = Math.min(100, customer.happiness + 20);
          addLog(`💬 Great chat! +${xpGain} XP`, 'fa-comment', '#7cf5b0');
          updateComputer(`good talk with ${customer.name}`, '#7cf5b0');
          resultDiv.innerHTML = `<div class="result-msg success"><i class="fas fa-check-circle"></i> Great conversation! +${xpGain} XP</div>`;
          setTimeout(() => {
            closeMinigame();
            renderCustomers();
            updateUI();
          }, 2000);
        } else {
          this.classList.add('wrong');
          btns.forEach(b => { if (b.dataset.answer === correctTopic) b.classList.add('correct'); });
          resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-times-circle"></i> Wrong. They were interested in: ${correctTopic}</div>`;
          customer.patience -= 15;
          setTimeout(() => {
            closeMinigame();
            renderCustomers();
            updateUI();
          }, 2000);
        }
      });
    });
  }

  // ===================== REMOVE CUSTOMER =====================
  function removeCustomer(id) {
    const idx = state.customers.findIndex(c => c.id === id);
    if (idx !== -1) state.customers.splice(idx, 1);
    state.currentCustomer = state.customers.length > 0 ? state.customers[0] : null;
    renderCustomers();
    updateUI();
  }

  // ===================== REST =====================
  function rest() {
    state.energy = Math.min(MAX_ENERGY, state.energy + 30);
    addLog(`Rested. Energy: ${state.energy}`, 'fa-coffee', '#ffb347');
    updateComputer(`energy restored to ${state.energy}`, '#ffb347');
    updateUI();
  }

  // ===================== RENDER =====================
  function renderCustomers() {
    if (state.customers.length === 0) {
      customerList.innerHTML = `<div style="color:#4a6a8a; text-align:center; padding:1rem;">No customers. Waiting for arrivals...</div>`;
      customerCount.textContent = '0 waiting';
      return;
    }
    customerList.innerHTML = state.customers.map(c => {
      const statusClass = c.status === 'waiting' ? 'waiting' : c.status === 'served' ? 'served' : 'angry';
      const statusLabel = c.status === 'waiting' ? '⏳ Waiting' : c.status === 'served' ? '✅ Served' : '😡 Angry';
      const itemList = c.items.map(i => `${i.name}($${i.price})`).join(', ');
      const happinessBar = '❤️'.repeat(Math.floor(c.happiness / 20)) + '🖤'.repeat(5 - Math.floor(c.happiness / 20));
      return `
        <div class="customer-card">
          <div class="info">
            <div class="name">${c.name}</div>
            <div class="detail">${itemList} · $${c.total} · ${happinessBar}</div>
          </div>
          <div class="status ${statusClass}">${statusLabel}</div>
          <button class="action-btn" onclick="window.removeCustomer(${c.id})" ${c.status !== 'served' && c.status !== 'angry' ? 'disabled' : ''}>
            <i class="fas fa-trash"></i>
          </button>
        </div>
      `;
    }).join('');
    customerCount.textContent = `${state.customers.filter(c => c.status === 'waiting').length} waiting`;
  }

  function updateUI() {
    levelDisplay.textContent = state.level;
    xpDisplay.textContent = state.xp;
    energyDisplay.textContent = state.energy;
    servedDisplay.textContent = state.served;
    moneyDisplay.textContent = `$${state.money}`;
    const needed = getXpForLevel();
    const pct = Math.min(100, (state.xp / needed) * 100);
    xpFill.style.width = pct + '%';
    xpToNext.textContent = needed - state.xp;
    speedDisplay.textContent = Math.round(getSpeed());
    if (state.energy < 30) energyDisplay.style.color = '#ff7a7a';
    else if (state.energy < 60) energyDisplay.style.color = '#ffb347';
    else energyDisplay.style.color = '#7cf5b0';
  }

  function closeMinigame() {
    if (timerInterval) clearInterval(timerInterval);
    minigameOverlay.classList.remove('show');
    state.miniGameActive = false;
    if (minigameCallback) {
      minigameCallback(false);
      minigameCallback = null;
    }
  }

  // ===================== TIME SYSTEM =====================
  function tick() {
    if (!state.gameRunning) return;
    state.time++;
    const mins = Math.floor(state.time / 60);
    const secs = state.time % 60;
    timeDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

    // Energy drain
    if (state.time % 2 === 0 && state.customers.length > 0) {
      state.energy = Math.max(0, state.energy - 1);
    }

    // Spawn customers
    if (state.time % 5 === 0 && state.customers.length < 5) {
      if (Math.random() < 0.5) spawnCustomer();
    }

    // Customer patience drain
    state.customers.forEach(c => {
      if (c.status === 'waiting') {
        c.patience -= 0.5;
        if (c.patience <= 0) {
          c.status = 'angry';
          addLog(`😡 ${c.name} left angry!`, 'fa-exclamation-triangle', '#ff7a7a');
          updateComputer(`${c.name} left angry`, '#ff7a7a');
          setTimeout(() => removeCustomer(c.id), 1000);
        }
      }
    });

    renderCustomers();
    updateUI();
  }

  // ===================== INIT =====================
  function init() {
    document.getElementById('serveBtn').addEventListener('click', serveCustomer);
    document.getElementById('mathBtn').addEventListener('click', () => {
      const waiting = state.customers.filter(c => c.status === 'waiting');
      if (waiting.length === 0) {
        addLog('No customers to serve.', 'fa-info-circle', '#4a6a8a');
        return;
      }
      startMathGame(waiting[0]);
    });
    document.getElementById('talkBtn').addEventListener('click', startTalkGame);
    document.getElementById('restBtn').addEventListener('click', rest);
    closeMinigameBtn.addEventListener('click', closeMinigame);

    // Spawn initial customers
    for (let i = 0; i < 2; i++) {
      setTimeout(() => spawnCustomer(), i * 1000);
    }

    addLog('🏪 Cashier Sim initialized', 'fa-cash-register', '#4fc3f7');
    updateComputer('system ready', '#4fc3f7');
    updateUI();
    renderCustomers();

    state.tickInterval = setInterval(tick, 1500);

    document.addEventListener('keydown', (e) => {
      if (e.key === 's') serveCustomer();
      else if (e.key === 'm') document.getElementById('mathBtn').click();
      else if (e.key === 't') startTalkGame();
      else if (e.key === 'r') rest();
      else if (e.key === 'Escape') closeMinigame();
    });
  }

  window.removeCustomer = removeCustomer;
  init();
</script>
</body>
</html>
