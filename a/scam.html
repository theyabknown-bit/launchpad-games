<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🕵️ Scam Detective Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.status-bar .stat{color:#8899aa;font-size:.9rem}
.status-bar .stat span{color:#d0e8f0;font-weight:700}
.scenario-area{background:rgba(0,0,0,0.3);border-radius:16px;padding:20px;margin:15px 0;min-height:120px;border:2px solid rgba(79,195,247,0.05)}
.scenario-area .scenario{font-size:1.1rem;line-height:1.6;text-align:left}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.options button{padding:12px;border-radius:12px;border:2px solid rgba(79,195,247,0.1);background:rgba(0,0,0,0.3);color:#d0e8f0;cursor:pointer;transition:.2s;font-size:.95rem}
.options button:hover{border-color:#4fc3f7;background:rgba(79,195,247,0.05)}
.options button.correct{border-color:#7cf5b0;background:rgba(124,245,176,0.1)}
.options button.wrong{border-color:#ff6b6b;background:rgba(255,107,107,0.1)}
.options button:disabled{cursor:default;opacity:.6}
.timer-bar{width:100%;height:6px;background:rgba(255,255,255,0.05);border-radius:3px;margin:10px 0;overflow:hidden}
.timer-bar .fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#7cf5b0);border-radius:3px;transition:width .1s linear;width:100%}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
#message{min-height:2rem;font-size:1rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🕵️ Scam Detective Pro</h1>
<div class="status-bar"><div class="stat">🏆 Score: <span id="score">0</span></div><div class="stat">🏅 Best: <span id="bestScore">-</span></div><div class="stat">📊 Question: <span id="qNum">0</span>/10</div></div>
<div class="timer-bar"><div class="fill" id="timerFill"></div></div>
<div class="scenario-area"><div class="scenario" id="scenarioText">Click Start to begin!</div></div>
<div class="options" id="options"></div>
<div id="message">🕵️ Spot the scam and choose the safe response!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),qNumEl=document.getElementById('qNum'),scenarioEl=document.getElementById('scenarioText'),optionsEl=document.getElementById('options'),timerFill=document.getElementById('timerFill'),msgEl=document.getElementById('message');
const SCENARIOS=[
{scenario:"You receive an email from your bank saying your account is locked. It asks you to click a link and enter your password.",options:["Click the link and enter password","Call the bank's official number to verify","Reply to the email with your details"],correct:1},
{scenario:"A pop-up appears on your screen saying your computer is infected. It offers to fix it for $99 if you call the number.",options:["Call the number immediately","Close the pop-up and run your own antivirus","Pay the $99 to fix it"],correct:1},
{scenario:"You get a text from 'Amazon' saying a package is delayed and you need to confirm your address via a link.",options:["Click the link to confirm","Log in to Amazon directly from their official app","Reply with your address"],correct:1},
{scenario:"A person calls claiming to be from the IRS, saying you owe taxes and must pay immediately with gift cards.",options:["Buy gift cards and give them the codes","Hang up and call the IRS directly","Pay the amount they demand"],correct:1},
{scenario:"You win a prize in a lottery you never entered. They ask for a 'processing fee' to release your winnings.",options:["Pay the fee to claim your prize","Ignore it – it's a classic scam","Send them your bank details"],correct:1},
{scenario:"A friend on social media sends you a message asking for money because they're stranded.",options:["Send money immediately","Call them to verify it's really them","Send a smaller amount"],correct:1},
{scenario:"You receive an email with a PDF attachment from an unknown sender, saying 'Invoice attached'.",options:["Open the attachment to check","Delete the email without opening","Forward it to your boss"],correct:1},
{scenario:"A website offers you a free iPhone if you complete a survey and enter your credit card details for 'shipping'.",options:["Complete the survey and enter card details","Leave the site – it's a scam","Share it with friends"],correct:1},
{scenario:"You get a call from 'Microsoft' saying your computer has a virus and they need remote access to fix it.",options:["Grant them remote access","Hang up and ignore – they don't do that","Give them your password"],correct:1},
{scenario:"An email says you've inherited money from a distant relative, but you need to pay legal fees to release it.",options:["Pay the legal fees","Delete the email – it's a known scam","Reply with your bank info"],correct:1},
{scenario:"A fake job offer asks for your Social Security number and bank details before you've even had an interview.",options:["Provide the information","Refuse – no legitimate job asks that upfront","Give it but request an interview"],correct:1},
{scenario:"You get a message from 'Apple' saying your account has been suspended. Click the link to reactivate.",options:["Click the link","Go to Apple's official site directly","Enter your password in the link"],correct:1},
{scenario:"A charity calls asking for donations for a disaster relief, but they can only take gift cards.",options:["Donate with a gift card","Ask for their registered charity number and verify","Give cash"],correct:1},
{scenario:"A friend's Facebook account posts a link to a 'free giveaway' that asks for your login details.",options:["Enter your details to claim the prize","Message your friend to check if they posted it","Click the link to see"],correct:1},
{scenario:"You receive a text saying your bank card has been frozen. Call this number to fix it.",options:["Call the number","Call the number on the back of your card instead","Text them back"],correct:1},
{scenario:"A pop-up offers you a free antivirus scan, but it asks for your email and password to 'activate'.",options:["Scan with it","Close the pop-up – it's fake","Enter your details"],correct:1},
{scenario:"You get a call from 'your phone company' offering a discount if you confirm your PIN.",options:["Give your PIN","Tell them you'll call back on their official number","Accept the discount"],correct:1},
{scenario:"A website shows a 'virus detected' warning and offers to remove it for a payment.",options:["Pay to remove it","Leave the site – it's a scareware scam","Run a full scan yourself"],correct:1},
{scenario:"A stranger sends you a friend request and immediately asks for money to pay for a family emergency.",options:["Send them a small amount","Block and report them","Ask for proof"],correct:1},
{scenario:"You get an email saying you've been caught on a webcam and they'll leak a video unless you pay Bitcoin.",options:["Pay the Bitcoin","Ignore it – it's a sextortion scam","Reply and ask for proof"],correct:1}
];
let questions=[],currentQ=0,score=0,bestScore=0,totalQ=10,timeLeft=10,maxTime=10,gameActive=!1,paused=!1,timerId=null,answerLocked=!1;
(function load(){try{let s=JSON.parse(localStorage.getItem('scam_best')||'{}');bestScore=s['all']||0;bestEl.textContent=bestScore||'-'}catch(e){}})();
function saveBest(){if(score>bestScore){bestScore=score;let s=JSON.parse(localStorage.getItem('scam_best')||'{}');s['all']=score;localStorage.setItem('scam_best',JSON.stringify(s));bestEl.textContent=score}}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function getQuestions(){return shuffle([...SCENARIOS]).slice(0,totalQ)}
function startGame(){questions=getQuestions();currentQ=0;score=0;timeLeft=maxTime;gameActive=!0;paused=!1;answerLocked=!1;document.getElementById('pauseLabel').textContent='Pause';scoreEl.textContent=score;qNumEl.textContent='0/'+totalQ;timerFill.style.width='100%';msgEl.textContent='🕵️ Choose the safe response!';showQuestion()}
function showQuestion(){if(currentQ>=totalQ){endGame();return}answerLocked=!1;let q=questions[currentQ];scenarioEl.textContent=q.scenario;optionsEl.innerHTML='';q.options.forEach((opt,idx)=>{let btn=document.createElement('button');btn.textContent=opt;btn.dataset.idx=idx;btn.onclick=()=>selectAnswer(idx);optionsEl.appendChild(btn)});qNumEl.textContent=(currentQ+1)+'/'+totalQ;timeLeft=maxTime;timerFill.style.width='100%';if(timerId)clearInterval(timerId);timerId=setInterval(()=>{if(!paused){timeLeft--;timerFill.style.width=(timeLeft/maxTime*100)+'%';if(timeLeft<=0){clearInterval(timerId);answerLocked=!0;let btns=optionsEl.querySelectorAll('button');btns.forEach(b=>b.disabled=!0);let correct=questions[currentQ].correct;btns[correct].classList.add('correct');msgEl.textContent='⏰ Time\'s up! The safe answer was: '+q.options[correct];playSound('wrong');setTimeout(()=>{if(gameActive&&!paused){currentQ++;showQuestion()}},1500)}}},1000)}
function selectAnswer(idx){if(answerLocked||!gameActive||paused)return;answerLocked=!0;clearInterval(timerId);let q=questions[currentQ];let correct=q.correct;let btns=optionsEl.querySelectorAll('button');btns.forEach(b=>b.disabled=!0);if(idx===correct){score+=10+Math.floor(timeLeft/2);scoreEl.textContent=score;btns[idx].classList.add('correct');msgEl.textContent='✅ Correct! +'+(10+Math.floor(timeLeft/2))+' points';playSound('correct');saveBest()}else{btns[idx].classList.add('wrong');btns[correct].classList.add('correct');msgEl.textContent='❌ Wrong! The safe answer was: '+q.options[correct];playSound('wrong')}setTimeout(()=>{if(gameActive&&!paused){currentQ++;showQuestion()}},1500)}
function endGame(){gameActive=!1;if(timerId)clearInterval(timerId);msgEl.textContent='🏁 Game Over! Score: '+score;playSound('gameover');saveBest();scenarioEl.textContent='🎉 You completed all questions!';optionsEl.innerHTML=''}
function togglePause(){if(!gameActive)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'🕵️ Choose the safe response!';if(paused&&timerId)clearInterval(timerId);else if(!paused&&gameActive&&!answerLocked){timerId=setInterval(()=>{if(!paused){timeLeft--;timerFill.style.width=(timeLeft/maxTime*100)+'%';if(timeLeft<=0){clearInterval(timerId);answerLocked=!0;let btns=optionsEl.querySelectorAll('button');btns.forEach(b=>b.disabled=!0);let q=questions[currentQ];btns[q.correct].classList.add('correct');msgEl.textContent='⏰ Time\'s up! The safe answer was: '+q.options[q.correct];playSound('wrong');setTimeout(()=>{if(gameActive&&!paused){currentQ++;showQuestion()}},1500)}}},1000)}}
function resetGame(){if(timerId)clearInterval(timerId);gameActive=!1;paused=!1;score=0;currentQ=0;scoreEl.textContent=score;qNumEl.textContent='0/'+totalQ;timerFill.style.width='100%';scenarioEl.textContent='Click Start to begin!';optionsEl.innerHTML='';msgEl.textContent='🕵️ Spot the scam and choose the safe response!';document.getElementById('pauseLabel').textContent='Pause'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='correct'){o.frequency.value=800;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=1000},80);o.stop(c.currentTime+.15)}else if(type==='wrong'){o.frequency.value=300;g.gain.value=.06;o.start();o.stop(c.currentTime+.15)}else if(type==='gameover'){o.frequency.value=500;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=700},150);setTimeout(()=>{o.frequency.value=900},300);o.stop(c.currentTime+.5)}}catch(e){}}
resetGame();console.log('🕵️ Scam Detective Pro loaded');
</script></body></html>
