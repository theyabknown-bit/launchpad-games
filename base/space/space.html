<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Explorer · Solar System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
    }
    .game-wrapper {
      background: rgba(10, 14, 30, 0.9);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #2a3f5a;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #b6ddf5;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .game-header h1 {
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
    }
    .game-header h1 i { color: #7fc9ff; }
    .back-btn {
      background: #1c4055;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      text-decoration: none;
      color: #b6ddf5;
      border: 1px solid #3a6b88;
      font-weight: 500;
    }
    .back-btn:hover { background: #2a5a78; }
    .stats {
      display: flex;
      gap: 2rem;
      color: #9bbfd9;
      font-weight: 500;
    }
    .stats span i { margin-right: 6px; }
    .game-area {
      background: #0f172a;
      border-radius: 1.5rem;
      padding: 1.5rem;
      border: 1px solid #1e3347;
      position: relative;
      min-height: 420px;
    }
    .stars {
      position: relative;
      height: 340px;
      background: radial-gradient(ellipse at center, #0d1b2a 0%, #05080f 100%);
      border-radius: 1rem;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #1a3045;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      width: 3px;
      height: 3px;
      animation: twinkle 2s infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    .planet {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: white;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      transition: 0.3s;
      cursor: pointer;
      font-size: 0.7rem;
      box-shadow: inset -8px -8px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      user-select: none;
      z-index: 2;
    }
    .planet:hover {
      transform: scale(1.15);
      z-index: 10;
      filter: brightness(1.2);
    }
    .planet.discovered {
      border: 2px solid #7fc9ff;
      box-shadow: 0 0 30px rgba(127, 201, 255, 0.3);
    }
    .planet.sun {
      border: 2px solid #ffb347;
      box-shadow: 0 0 40px rgba(255, 180, 50, 0.4);
      animation: pulseGlow 2s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 30px rgba(255, 180, 50, 0.3); }
      100% { box-shadow: 0 0 60px rgba(255, 180, 50, 0.6); }
    }
    .planet-label {
      position: absolute;
      background: rgba(0,0,0,0.7);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.6rem;
      white-space: nowrap;
      pointer-events: none;
      color: #c4e2ff;
      border: 1px solid #2a4a66;
      z-index: 3;
    }
    .info-panel {
      margin-top: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .info-panel .discovery {
      background: #1c3348;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      color: #b6ddf5;
      border: 1px solid #2a5a78;
      font-size: 0.9rem;
    }
    .info-panel .discovery i { color: #ffb347; margin-right: 6px; }
    .reset-game {
      background: #1c4055;
      border: 1px solid #3a6b88;
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.15s;
    }
    .reset-game:hover { background: #2a5a78; }
    .discover-msg {
      margin-top: 0.8rem;
      padding: 0.8rem 1.2rem;
      background: #1a2f42;
      border-radius: 1rem;
      color: #c4e2ff;
      border-left: 4px solid #7fc9ff;
      min-height: 50px;
      font-size: 0.95rem;
      transition: 0.3s;
    }
    .discover-msg i { margin-right: 8px; }
    @media (max-width: 600px) {
      .game-wrapper { padding: 1rem; }
      .stars { height: 300px; }
      .stats { gap: 0.8rem; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-header">
    <h1><i class="fas fa-globe"></i> Space Explorer</h1>
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> back</a>
  </div>

  <div class="stats">
    <span><i class="fas fa-rocket"></i> <span id="discoveredCount">0</span> / 9</span>
    <span><i class="fas fa-star"></i> <span id="clickCount">0</span> clicks</span>
  </div>

  <div class="game-area">
    <div class="stars" id="starfield"></div>

    <div class="info-panel">
      <div class="discovery"><i class="fas fa-compass"></i> click planets to discover</div>
      <button class="reset-game" onclick="resetGame()"><i class="fas fa-rotate"></i> reset</button>
    </div>
    <div class="discover-msg" id="discoverMsg">🪐 Click a planet to learn about it!</div>
  </div>
</div>

<script>
  // All celestial bodies including Sun and Pluto
  const allBodies = [
    { name: 'Sun', emoji: '☀️', size: 60, color: '#ffb347', x: 48, y: 30, info: 'The heart of our solar system! A yellow dwarf star that provides light and heat to all planets.' },
    { name: 'Mercury', emoji: '☿', size: 22, color: '#b0b0b0', x: 10, y: 15, info: 'Closest to the Sun. A day on Mercury lasts 59 Earth days. No atmosphere means extreme temperatures.' },
    { name: 'Venus', emoji: '♀', size: 32, color: '#e8b87a', x: 25, y: 42, info: 'Hottest planet — thick atmosphere traps heat. Rotates backwards! Often called Earth\'s "sister planet".' },
    { name: 'Earth', emoji: '🌍', size: 38, color: '#4a8bc2', x: 45, y: 55, info: 'Our home! The only known planet with liquid water on its surface. 71% covered in water.' },
    { name: 'Mars', emoji: '♂', size: 28, color: '#c4713b', x: 65, y: 20, info: 'The Red Planet. Has the tallest mountain in the solar system: Olympus Mons (2.5x Everest!).' },
    { name: 'Jupiter', emoji: '♃', size: 50, color: '#c88b5a', x: 18, y: 75, info: 'Largest planet. The Great Red Spot is a storm bigger than Earth. Has at least 95 known moons!' },
    { name: 'Saturn', emoji: '♄', size: 45, color: '#d4b87a', x: 75, y: 65, info: 'Famous for its rings. Made mostly of gas — it would float in water! Has 146 known moons.' },
    { name: 'Uranus', emoji: '⛢', size: 34, color: '#7fd4d4', x: 85, y: 35, info: 'Rotates on its side! Has a blue-green color from methane in its atmosphere. Discovered in 1781.' },
    { name: 'Neptune', emoji: '♆', size: 32, color: '#4a6ab5', x: 60, y: 80, info: 'The windiest planet! Winds reach 1,200 mph. Farthest planet from the Sun. Discovered in 1846.' },
    { name: 'Pluto', emoji: '♇', size: 18, color: '#b8a89a', x: 90, y: 12, info: 'A dwarf planet! Reclassified in 2006. Has a heart-shaped glacier called Sputnik Planitia.' }
  ];

  let planets = [];
  let discovered = [];
  let totalClicks = 0;

  const starfield = document.getElementById('starfield');
  const discoverMsg = document.getElementById('discoverMsg');
  const discoveredCount = document.getElementById('discoveredCount');
  const clickCount = document.getElementById('clickCount');

  // Generate random positions for planets on reset
  function generateRandomPositions() {
    const shuffled = [...allBodies];
    // Shuffle positions while keeping Sun roughly centered
    const sun = shuffled.find(p => p.name === 'Sun');
    const others = shuffled.filter(p => p.name !== 'Sun');
    
    // Shuffle others
    for (let i = others.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [others[i], others[j]] = [others[j], others[i]];
    }
    
    // Assign random positions within bounds (avoid edges)
    const positions = [];
    const margin = 8;
    const usedPositions = [];
    
    // Sun stays roughly centered
    const sunPos = { x: 45 + Math.random() * 10, y: 25 + Math.random() * 10 };
    
    // Generate positions for others
    others.forEach((p, idx) => {
      let attempts = 0;
      let pos;
      let valid;
      do {
        const x = margin + Math.random() * (100 - margin * 2);
        const y = margin + Math.random() * (100 - margin * 2);
        pos = { x, y };
        valid = true;
        // Check distance from Sun
        const distFromSun = Math.sqrt(Math.pow(pos.x - sunPos.x, 2) + Math.pow(pos.y - sunPos.y, 2));
        if (distFromSun < 12) valid = false;
        // Check distance from other planets
        for (const used of usedPositions) {
          const dist = Math.sqrt(Math.pow(pos.x - used.x, 2) + Math.pow(pos.y - used.y, 2));
          if (dist < 10) valid = false;
        }
        attempts++;
        if (attempts > 100) break;
      } while (!valid);
      usedPositions.push(pos);
      positions.push(pos);
    });
    
    // Assign positions
    const result = [];
    result.push({ ...sun, x: sunPos.x, y: sunPos.y });
    others.forEach((p, idx) => {
      result.push({ ...p, x: positions[idx].x, y: positions[idx].y });
    });
    
    return result;
  }

  function createStars() {
    // Clear existing stars
    starfield.querySelectorAll('.star').forEach(el => el.remove());
    for (let i = 0; i < 180; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
      starfield.appendChild(star);
    }
  }

  function renderPlanets() {
    // Remove old planets and labels
    document.querySelectorAll('.planet, .planet-label').forEach(el => el.remove());

    planets.forEach((p, idx) => {
      const isDiscovered = discovered[idx];
      const isSun = p.name === 'Sun';
      
      const planet = document.createElement('div');
      planet.className = `planet ${isDiscovered ? 'discovered' : ''} ${isSun ? 'sun' : ''}`;
      planet.style.left = p.x + '%';
      planet.style.top = p.y + '%';
      planet.style.width = p.size + 'px';
      planet.style.height = p.size + 'px';
      
      // Special gradient for Sun
      if (isSun) {
        planet.style.background = `radial-gradient(circle at 35% 30%, #ffcc66, #ff8800)`;
      } else {
        planet.style.background = `radial-gradient(circle at 35% 30%, ${p.color}, ${adjustColor(p.color, -30)})`;
      }
      
      planet.style.fontSize = (p.size * 0.45) + 'px';
      planet.textContent = isDiscovered ? p.emoji : '?';
      planet.dataset.index = idx;
      planet.addEventListener('click', (e) => {
        e.stopPropagation();
        discoverPlanet(idx);
      });
      starfield.appendChild(planet);

      // Label
      const label = document.createElement('div');
      label.className = 'planet-label';
      label.style.left = (p.x + 5) + '%';
      label.style.top = (p.y - 8) + '%';
      label.textContent = isDiscovered ? p.name : '???';
      label.style.display = isDiscovered ? 'block' : 'none';
      label.dataset.labelIdx = idx;
      starfield.appendChild(label);
    });
    updateStats();
  }

  function adjustColor(hex, percent) {
    let r = parseInt(hex.slice(1,2), 16) * 17 || parseInt(hex.slice(1,3), 16);
    let g = parseInt(hex.slice(2,3), 16) * 17 || parseInt(hex.slice(3,5), 16);
    let b = parseInt(hex.slice(3,4), 16) * 17 || parseInt(hex.slice(5,7), 16);
    r = Math.max(0, Math.min(255, r + percent));
    g = Math.max(0, Math.min(255, g + percent));
    b = Math.max(0, Math.min(255, b + percent));
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  }

  function discoverPlanet(idx) {
    totalClicks++;
    clickCount.textContent = totalClicks;

    if (discovered[idx]) {
      discoverMsg.innerHTML = `<i class="fas fa-info-circle"></i> ${planets[idx].name}: ${planets[idx].info}`;
      return;
    }

    discovered[idx] = true;
    const count = discovered.filter(d => d).length;
    discoveredCount.textContent = count;

    const p = planets[idx];
    discoverMsg.innerHTML = `<i class="fas fa-rocket"></i> 🪐 Discovered <strong>${p.name}</strong>! ${p.info}`;

    // Update visual
    renderPlanets();

    if (count === planets.length) {
      discoverMsg.innerHTML = `🚀 <strong>CONGRATULATIONS!</strong> You've discovered all 10 celestial bodies! You're a true space explorer! 🌟`;
    }
  }

  function updateStats() {
    const count = discovered.filter(d => d).length;
    discoveredCount.textContent = count;
    clickCount.textContent = totalClicks;
  }

  function resetGame() {
    // Generate new random positions
    planets = generateRandomPositions();
    discovered = new Array(planets.length).fill(false);
    totalClicks = 0;
    discoverMsg.innerHTML = '🪐 Click a planet to discover it!';
    createStars();
    renderPlanets();
    updateStats();
  }

  // Click background for fun
  starfield.addEventListener('click', () => {
    totalClicks++;
    clickCount.textContent = totalClicks;
    discoverMsg.innerHTML = `✨ You clicked the stars! Keep exploring... (${totalClicks} clicks)`;
  });

  // Initialize
  planets = generateRandomPositions();
  discovered = new Array(planets.length).fill(false);
  createStars();
  renderPlanets();
  updateStats();
</script>
</body>
</html>
