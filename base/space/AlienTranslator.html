<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alien Translator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(10,14,30,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #2a3f5a;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; display: flex; align-items: center; gap: 10px; justify-content: center; }
    h1 i { color: #7fc9ff; }
    .back { display: inline-block; margin-bottom: 1rem; color: #b6ddf5; text-decoration: none; background: #1c4055; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #3a6b88; }
    .back:hover { background: #2a5a78; }
    .translation-area {
      background: #0f172a;
      border-radius: 1.5rem;
      padding: 1.5rem;
      margin: 1rem 0;
      border: 1px solid #1e3347;
    }
    .alien-text { font-size: 2.5rem; letter-spacing: 8px; color: #7cf5b0; font-family: 'Courier New', monospace; padding: 0.5rem; background: #0a121a; border-radius: 1rem; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin: 1rem 0; }
    .option-btn {
      background: rgba(20,40,60,0.4); border: 2px solid #2a4a5a; padding: 0.8rem;
      border-radius: 1rem; color: white; cursor: pointer; transition: 0.15s; font-size: 1rem;
    }
    .option-btn:hover:not(:disabled) { background: rgba(20,40,60,0.6); border-color: #7fc9ff; }
    .option-btn.correct { border-color: #7cf5b0; background: rgba(26,74,58,0.4); }
    .option-btn.wrong { border-color: #ff7a7a; background: rgba(74,26,26,0.4); }
    .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .feedback { margin-top: 0.8rem; padding: 0.7rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
    .stats { display: flex; justify-content: space-between; color: #9bbfd9; margin-top: 0.8rem; flex-wrap: wrap; gap: 0.5rem; }
    .stats span i { margin-right: 4px; }
    .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.6rem 1.5rem; border-radius: 40px; color: white; cursor: pointer; transition: 0.15s; }
    .btn:hover { background: #2a5a7a; }
    .xp-bar { background: #0a1a2a; border-radius: 1rem; height: 16px; overflow: hidden; border: 1px solid #1a3a5a; margin: 0.5rem 0; }
    .xp-fill { height: 100%; background: linear-gradient(90deg, #4fc3f7, #7cf5b0); border-radius: 1rem; transition: width 0.3s; width: 0%; }
    @media (max-width: 500px) { .options { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-language"></i> Alien Translator</h1>
  
  <div class="translation-area">
    <div style="color:#6a8aaa; font-size:0.8rem;">Translate this alien message:</div>
    <div class="alien-text" id="alienText">▲ ▼ ● ■ ◆</div>
    <div class="options" id="optionsContainer"></div>
    <div id="feedback" class="feedback"><i class="fas fa-info-circle"></i> Choose the correct translation</div>
    <div class="stats">
      <span><i class="fas fa-star"></i> Score: <span id="scoreDisplay">0</span></span>
      <span><i class="fas fa-bolt"></i> Streak: <span id="streakDisplay">0</span></span>
      <span><i class="fas fa-list"></i> <span id="qNumDisplay">1</span>/10</span>
    </div>
    <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#4a6a8a;">
      <span>XP: <span id="xpDisplay">0</span></span>
      <span>Level: <span id="levelDisplay">1</span></span>
    </div>
    <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
    <button class="btn" id="resetBtn"><i class="fas fa-rotate"></i> New Game</button>
  </div>
</div>

<script>
  const WORDS = [
    { alien: '▲ ▼ ●', meaning: 'Hello', hint: 'Greeting' },
    { alien: '◆ ■ ▲', meaning: 'Friend', hint: 'Someone you trust' },
    { alien: '● ● ●', meaning: 'Star', hint: 'Shines in the sky' },
    { alien: '▼ ▲ ▼', meaning: 'Water', hint: 'You drink it' },
    { alien: '■ ◆ ■', meaning: 'Fire', hint: 'Burns and glows' },
    { alien: '▲ ● ▲', meaning: 'Sky', hint: 'Above you' },
    { alien: '◆ ▼ ◆', meaning: 'Earth', hint: 'Ground' },
    { alien: '● ■ ●', meaning: 'Moon', hint: 'Night light' },
    { alien: '▼ ■ ▼', meaning: 'Sun', hint: 'Day star' },
    { alien: '■ ● ■', meaning: 'Love', hint: 'Strong feeling' },
    { alien: '▲ ◆ ▲', meaning: 'Peace', hint: 'Calm' },
    { alien: '● ▼ ●', meaning: 'War', hint: 'Conflict' },
    { alien: '◆ ▲ ◆', meaning: 'Wisdom', hint: 'Knowledge' },
    { alien: '▼ ● ▼', meaning: 'Power', hint: 'Strength' },
    { alien: '■ ▲ ■', meaning: 'Truth', hint: 'Honesty' }
  ];

  let current = 0, score = 0, streak = 0, xp = 0, level = 1, xpToNext = 15;
  let questions = [], answered = false;
  const alienText = document.getElementById('alienText');
  const optionsContainer = document.getElementById('optionsContainer');
  const feedback = document.getElementById('feedback');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const streakDisplay = document.getElementById('streakDisplay');
  const qNumDisplay = document.getElementById('qNumDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const xpFill = document.getElementById('xpFill');

  function shuffle(arr) { for (let i=arr.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

  function getQuestions() {
    const shuffled = shuffle([...WORDS]);
    return shuffled.slice(0, 10);
  }

  function addXP(amount) {
    xp += amount;
    while (xp >= xpToNext) {
      xp -= xpToNext;
      level++;
      xpToNext = Math.floor(xpToNext * 1.2) + 5;
      feedback.innerHTML = `<i class="fas fa-trophy" style="color:#ffd700;"></i> 🎉 LEVEL UP! You're now level ${level}!`;
    }
    updateUI();
  }

  function loadQuestion() {
    if (current >= questions.length) { showResults(); return; }
    const q = questions[current];
    alienText.textContent = q.alien;
    const wrongs = WORDS.filter(w => w.meaning !== q.meaning).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = shuffle([q.meaning, ...wrongs.map(w => w.meaning)]);
    optionsContainer.innerHTML = options.map(opt => 
      `<button class="option-btn" data-answer="${opt}">${opt}</button>`
    ).join('');
    optionsContainer.querySelectorAll('.option-btn').forEach(b => b.addEventListener('click', () => selectAnswer(b.dataset.answer)));
    qNumDisplay.textContent = current+1;
    feedback.innerHTML = `<i class="fas fa-info-circle"></i> ${q.hint}`;
    answered = false;
  }

  function selectAnswer(answer) {
    if (answered) return;
    answered = true;
    const q = questions[current];
    const btns = optionsContainer.querySelectorAll('.option-btn');
    btns.forEach(b => {
      b.disabled = true;
      if (b.dataset.answer === q.meaning) b.classList.add('correct');
      else if (b.dataset.answer === answer && answer !== q.meaning) b.classList.add('wrong');
    });
    const isCorrect = answer === q.meaning;
    if (isCorrect) { score++; streak++; const xpGain = 5 + streak; addXP(xpGain); }
    else { streak = 0; }
    feedback.innerHTML = isCorrect ? 
      `<i class="fas fa-check-circle" style="color:#7cf5b0;"></i> Correct! +${5+streak} XP` :
      `<i class="fas fa-times-circle" style="color:#ff7a7a;"></i> Wrong! The answer was: ${q.meaning}`;
    current++;
    setTimeout(() => loadQuestion(), 1500);
  }

  function showResults() {
    alienText.textContent = '🏆';
    optionsContainer.innerHTML = '';
    feedback.innerHTML = `<i class="fas fa-trophy" style="color:#ffd700;"></i> Complete! Score: ${score}/10, XP: ${xp}`;
  }

  function resetGame() {
    current = 0; score = 0; streak = 0; questions = getQuestions();
    updateUI();
    loadQuestion();
  }

  function updateUI() {
    scoreDisplay.textContent = score;
    streakDisplay.textContent = streak;
    xpDisplay.textContent = xp;
    levelDisplay.textContent = level;
    const pct = Math.min(100, (xp / xpToNext) * 100);
    xpFill.style.width = pct + '%';
  }

  document.getElementById('resetBtn').addEventListener('click', resetGame);
  resetGame();
</script>
</body>
</html>
