<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Slide Puzzle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a26;
            color: #d0e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1a3344;
            color: #4fc3f7;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            font-size: 14px;
        }
        .back-btn:hover { background: #2a4a5e; transform: translateX(-5px); }
        .container { max-width: 500px; width: 100%; text-align: center; margin-top: 60px; }
        h1 { color: #4fc3f7; font-size: 2.5rem; margin-bottom: 4px; }
        .subtitle { color: #7cf5b0; font-size: 0.9rem; margin-bottom: 15px; }

        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 10px 20px; border-radius: 10px; min-width: 80px; border: 1px solid #2a4a5e; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.2rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.7rem; text-transform: uppercase; }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            max-width: 400px;
            margin: 15px auto;
            background: #0f1f2e;
            padding: 10px;
            border-radius: 16px;
            border: 2px solid #1a3344;
        }
        .tile {
            aspect-ratio: 1;
            background: #1a3344;
            border-radius: 10px;
            border: 2px solid #2a4a5e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #4fc3f7;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            user-select: none;
            text-shadow: 0 0 20px rgba(79, 195, 247, 0.1);
        }
        .tile:hover { background: #2a4a5e; border-color: #4fc3f7; transform: scale(1.02); }
        .tile:active { transform: scale(0.92); }
        .tile.empty {
            background: transparent;
            border-color: transparent;
            cursor: default;
            box-shadow: none;
        }
        .tile.empty:hover { background: transparent; border-color: transparent; transform: none; }

        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary {
            background: linear-gradient(135deg, #4fc3f7, #1a6a8a);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79,195,247,0.2); }
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            color: white;
        }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,107,107,0.2); }

        .message { font-size: 1.1rem; min-height: 30px; color: #ffd93d; margin: 10px 0; font-weight: 600; }

        @media (max-width: 480px) {
            .container { margin-top: 50px; }
            h1 { font-size: 2rem; }
            .grid { gap: 4px; padding: 8px; }
            .tile { font-size: 1.6rem; border-radius: 8px; }
            .btn { padding: 10px 18px; font-size: 0.9rem; }
            .stats { gap: 10px; }
            .stat-box { padding: 6px 12px; min-width: 60px; }
            .stat-box span { font-size: 1rem; }
            .back-btn { font-size: 12px; padding: 8px 12px; top: 10px; left: 10px; }
        }
    </style>
</head>
<body>

<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

<div class="container">
    <h1><i class="fas fa-puzzle-piece" style="color:#4fc3f7;"></i> Slide Puzzle</h1>
    <p class="subtitle">Slide the tiles to order them from 1 to 15!</p>

    <div class="stats">
        <div class="stat-box"><span id="moves">0</span><span class="label">Moves</span></div>
        <div class="stat-box"><span id="time">0s</span><span class="label">Time</span></div>
        <div class="stat-box"><span id="best">0</span><span class="label">Best</span></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="btn-group">
        <button class="btn btn-primary" id="shuffleBtn">🔀 Shuffle</button>
        <button class="btn btn-danger" id="resetBtn">🔄 Reset</button>
    </div>

    <div class="message" id="message">🎯 Click a tile next to the empty space to move it!</div>
</div>

<script>
// ============================================================
// SLIDE PUZZLE - COMPLETE FIXED VERSION
// ============================================================

// ============================================================
// GAME STATE
// ============================================================
let tiles = [];
let emptyIndex = 15;
let moves = 0;
let seconds = 0;
let timerInterval = null;
let bestScore = parseInt(localStorage.getItem('slidePuzzleBest')) || 0;
const gridSize = 4;
const totalTiles = 16;

// ============================================================
// SOUND SYSTEM
// ============================================================
let soundEnabled = true;
let audioCtx = null;
let audioUnlocked = false;

function unlockAudio() {
    if (audioUnlocked) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        audioUnlocked = true;
    } catch(e) {}
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);

function getAudioCtx() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playTone(freq, dur = 150) {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur / 1000);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur / 1000);
    } catch(e) {}
}

function playMove() { playTone(500, 80); }
function playWin() { playTone(523, 150); setTimeout(() => playTone(659, 150), 150); setTimeout(() => playTone(784, 200), 300); }
function playShuffle() { playTone(300, 100); setTimeout(() => playTone(400, 100), 100); setTimeout(() => playTone(500, 100), 200); }

// ============================================================
// INIT GRID
// ============================================================
function initGrid() {
    // Create solved state: 1-15 and empty (0) at the end
    tiles = [];
    for (let i = 1; i < 16; i++) {
        tiles.push(i);
    }
    tiles.push(0); // Empty space at index 15
    emptyIndex = 15;
    moves = 0;
    seconds = 0;
    document.getElementById('moves').textContent = moves;
    document.getElementById('time').textContent = seconds + 's';
    document.getElementById('best').textContent = bestScore;
    document.getElementById('message').textContent = '🎯 Click a tile next to the empty space to move it!';
    
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    
    renderGrid();
}

// ============================================================
// RENDER GRID
// ============================================================
function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    
    for (let i = 0; i < totalTiles; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        if (tiles[i] === 0) {
            tile.classList.add('empty');
            tile.textContent = '';
        } else {
            tile.textContent = tiles[i];
            tile.dataset.index = i;
            tile.addEventListener('click', () => handleTileClick(i));
        }
        grid.appendChild(tile);
    }
}

// ============================================================
// CHECK IF TILE CAN MOVE
// ============================================================
function canMove(index) {
    const row = Math.floor(index / gridSize);
    const col = index % gridSize;
    const emptyRow = Math.floor(emptyIndex / gridSize);
    const emptyCol = emptyIndex % gridSize;
    
    // Check if adjacent (up, down, left, right)
    return (Math.abs(row - emptyRow) + Math.abs(col - emptyCol)) === 1;
}

// ============================================================
// HANDLE TILE CLICK
// ============================================================
function handleTileClick(index) {
    if (!canMove(index)) {
        // Play wrong sound and show message
        playTone(200, 150);
        document.getElementById('message').textContent = '❌ That tile can\'t move! Click a tile next to the empty space.';
        return;
    }
    
    // Move the tile
    tiles[emptyIndex] = tiles[index];
    tiles[index] = 0;
    emptyIndex = index;
    moves++;
    document.getElementById('moves').textContent = moves;
    playMove();
    
    // Start timer on first move
    if (moves === 1 && !timerInterval) {
        timerInterval = setInterval(() => {
            seconds++;
            document.getElementById('time').textContent = seconds + 's';
        }, 1000);
    }
    
    renderGrid();
    document.getElementById('message').textContent = '✅ Moved! Keep going!';
    
    // Check if solved
    if (checkWin()) {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        playWin();
        if (bestScore === 0 || moves < bestScore) {
            bestScore = moves;
            localStorage.setItem('slidePuzzleBest', bestScore);
            document.getElementById('best').textContent = bestScore;
            document.getElementById('message').textContent = '🎉 NEW BEST SCORE: ' + bestScore + ' moves!';
        } else {
            document.getElementById('message').textContent = '🎉 You solved it in ' + moves + ' moves!';
        }
    }
}

// ============================================================
// CHECK WIN
// ============================================================
function checkWin() {
    for (let i = 0; i < 15; i++) {
        if (tiles[i] !== i + 1) return false;
    }
    return tiles[15] === 0;
}

// ============================================================
// SHUFFLE
// ============================================================
function shuffle() {
    // Reset timer
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    
    // Start from solved state
    initGrid();
    
    // Perform many random moves to shuffle
    let shuffleMoves = 0;
    const maxShuffleMoves = 100 + Math.floor(Math.random() * 50);
    
    for (let i = 0; i < maxShuffleMoves; i++) {
        // Find all tiles that can move
        const movable = [];
        for (let j = 0; j < totalTiles; j++) {
            if (tiles[j] !== 0 && canMove(j)) {
                movable.push(j);
            }
        }
        
        if (movable.length > 0) {
            const randomIndex = movable[Math.floor(Math.random() * movable.length)];
            // Move the tile
            tiles[emptyIndex] = tiles[randomIndex];
            tiles[randomIndex] = 0;
            emptyIndex = randomIndex;
            shuffleMoves++;
        }
    }
    
    // Reset move counter but keep shuffled state
    moves = 0;
    seconds = 0;
    document.getElementById('moves').textContent = moves;
    document.getElementById('time').textContent = seconds + 's';
    document.getElementById('message').textContent = '🔀 Shuffled! Try to solve it!';
    playShuffle();
    renderGrid();
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', function(e) {
    if (e.key === 's' || e.key === 'S') shuffle();
    if (e.key === 'r' || e.key === 'R') initGrid();
    
    // Arrow keys for moving
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        const emptyRow = Math.floor(emptyIndex / gridSize);
        const emptyCol = emptyIndex % gridSize;
        let targetIndex = -1;
        
        if (e.key === 'ArrowUp' && emptyRow < 3) targetIndex = emptyIndex + gridSize;
        else if (e.key === 'ArrowDown' && emptyRow > 0) targetIndex = emptyIndex - gridSize;
        else if (e.key === 'ArrowLeft' && emptyCol < 3) targetIndex = emptyIndex + 1;
        else if (e.key === 'ArrowRight' && emptyCol > 0) targetIndex = emptyIndex - 1;
        
        if (targetIndex !== -1 && targetIndex >= 0 && targetIndex < 16) {
            handleTileClick(targetIndex);
        }
    }
});

// ============================================================
// INIT
// ============================================================
document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('resetBtn').addEventListener('click', initGrid);

initGrid();
document.getElementById('best').textContent = bestScore;
console.log('🧩 Slide Puzzle loaded!');
console.log('⌨️ Arrow keys to move, S=Shuffle, R=Reset');
</script>
</body>
</html>
