<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🎵 Simon Says Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}.status-bar .stat{color:#8899aa;font-size:.9rem}.status-bar .stat span{color:#d0e8f0;font-weight:700}.simon-board{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:300px;margin:20px auto}.simon-btn{aspect-ratio:1/1;border-radius:16px;border:3px solid rgba(255,255,255,0.05);cursor:pointer;transition:.15s;box-shadow:0 4px 20px rgba(0,0,0,0.3)}.simon-btn:active{transform:scale(.95)}.simon-btn.active{filter:brightness(1.6);transform:scale(1.02)}.simon-btn.color-0{background:#ff6b6b}.simon-btn.color-1{background:#ffd93d}.simon-btn.color-2{background:#4fc3f7}.simon-btn.color-3{background:#7cf5b0}.simon-btn.color-0.active{box-shadow:0 0 40px #ff6b6b}.simon-btn.color-1.active{box-shadow:0 0 40px #ffd93d}.simon-btn.color-2.active{box-shadow:0 0 40px #4fc3f7}.simon-btn.color-3.active{box-shadow:0 0 40px #7cf5b0}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}.difficulty-selector{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}.difficulty-selector button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);font-size:.8rem;padding:6px 16px}.difficulty-selector button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7}#message{min-height:2rem;font-size:1rem}.round-display{font-size:1.2rem;color:#ffd93d;font-weight:700}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🎵 Simon Says Pro</h1>
<div class="difficulty-selector"><button data-diff="easy">Easy</button><button data-diff="medium" class="active">Medium</button><button data-diff="hard">Hard</button></div>
<div class="status-bar"><div class="stat">🏆 Score: <span id="score">0</span></div><div class="stat">🏅 Best: <span id="bestScore">-</span></div><div class="stat round-display">🌀 Round: <span id="round">0</span></div></div>
<div class="simon-board" id="simonBoard"><div class="simon-btn color-0" data-color="0"></div><div class="simon-btn color-1" data-color="1"></div><div class="simon-btn color-2" data-color="2"></div><div class="simon-btn color-3" data-color="3"></div></div>
<div id="message">🎵 Watch the pattern, then repeat it!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),roundEl=document.getElementById('round'),msgEl=document.getElementById('message'),simonBtns=document.querySelectorAll('.simon-btn');
let seq=[],playerSeq=[],round=0,score=0,bestScore=0,diff='medium',isPlaying=!1,isPlayerTurn=!1,gameOver=!1,paused=!1,speed=600;
(function load(){try{let s=JSON.parse(localStorage.getItem('simon_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';let d=localStorage.getItem('simon_difficulty')||'medium';diff=d;document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.classList.toggle('active',b.dataset.diff===diff)})}catch(e){}})();
function saveBest(){if(score>bestScore){bestScore=score;let s=JSON.parse(localStorage.getItem('simon_best')||'{}');s[diff]=score;localStorage.setItem('simon_best',JSON.stringify(s));bestEl.textContent=score}}
function getMaxRounds(){return{easy:4,medium:8,hard:12}[diff]||8}
function getSpeed(){return Math.max(150,({easy:800,medium:600,hard:400}[diff]||600)-round*15)}
function playTone(f,d=200){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.08;o.start();o.stop(c.currentTime+d/1000)}catch(e){}}
function playColorSound(i){playTone([300,500,700,900][i]||400,150)}
function lightButton(i){let b=simonBtns[i];b.classList.add('active');playColorSound(i);setTimeout(()=>b.classList.remove('active'),250)}
function flashAll(){simonBtns.forEach((b,i)=>setTimeout(()=>lightButton(i),i*100))}
function startGame(){seq=[];playerSeq=[];round=0;score=0;gameOver=!1;isPlayerTurn=!1;paused=!1;document.getElementById('pauseLabel').textContent='Pause';msgEl.textContent='🎵 Watch the pattern...';updateUI();setTimeout(nextRound,500)}
function nextRound(){if(gameOver||paused)return;round++;roundEl.textContent=round;seq.push(Math.floor(Math.random()*4));playerSeq=[];isPlayerTurn=!1;msgEl.textContent='🎵 Round '+round+' – Watch!';playSequence(0)}
function playSequence(i){if(i>=seq.length){isPlayerTurn=!0;msgEl.textContent='🎵 Your turn! Repeat the pattern.';return}lightButton(seq[i]);setTimeout(()=>playSequence(i+1),speed)}
function playerMove(i){if(!isPlayerTurn||gameOver||paused)return;playerSeq.push(i);lightButton(i);let step=playerSeq.length-1;if(playerSeq[step]!==seq[step]){gameOver=!0;playTone(200,300);msgEl.textContent='❌ Wrong! You reached round '+round+'. Score: '+score;playSound('lose');saveBest();return}if(playerSeq.length===seq.length){isPlayerTurn=!1;let bonus=Math.max(1,round);score+=10*bonus;scoreEl.textContent=score;msgEl.textContent='✅ Correct! +'+(10*bonus)+' points. Next round...';playSound('win');saveBest();setTimeout(()=>{if(!gameOver&&!paused)nextRound()},800)}}
simonBtns.forEach((b,i)=>b.addEventListener('click',()=>playerMove(i)));
function togglePause(){if(gameOver)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'🎵 Watch the pattern...'}
function resetGame(){if(confirm('Reset game?')){seq=[];playerSeq=[];round=0;score=0;gameOver=!0;isPlayerTurn=!1;paused=!1;document.getElementById('pauseLabel').textContent='Pause';updateUI();msgEl.textContent='🎵 Press Start to begin!';flashAll()}}
function updateUI(){scoreEl.textContent=score;roundEl.textContent=round}
document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.difficulty-selector button').forEach(x=>x.classList.remove('active'));this.classList.add('active');diff=this.dataset.diff;localStorage.setItem('simon_difficulty',diff);let s=JSON.parse(localStorage.getItem('simon_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';resetGame()})});
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='win'){o.frequency.value=600;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=800},150);setTimeout(()=>{o.frequency.value=1000},300);o.stop(c.currentTime+.5)}else if(type==='lose'){o.frequency.value=300;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=200},100);o.stop(c.currentTime+.4)}}catch(e){}}
resetGame();console.log('🎵 Simon Says Pro loaded');
</script></body></html>
