<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Blitz · typing challenge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0e1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(20,18,40,0.9);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #4a3a7a;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; margin-bottom: 0.3rem; }
    h1 i { color: #c084f5; margin-right: 10px; }
    .back { display: inline-block; margin-bottom: 1.2rem; color: #b6b0d9; text-decoration: none; background: #2a2545; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #5a4a8a; font-size: 0.9rem; }
    .back:hover { background: #3f3570; }
    .word-display {
      background: #1e1a30;
      border-radius: 1.5rem;
      padding: 2rem;
      margin: 1.2rem 0;
      border: 2px solid #3a2a6a;
    }
    .word { font-size: 4rem; font-weight: 700; color: #f0eaff; letter-spacing: 6px; font-family: 'Courier New', monospace; }
    .input-area { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
    #wordInput { background: #12101f; border: 2px solid #3a2a6a; padding: 0.8rem 1.5rem; border-radius: 60px; font-size: 1.3rem; color: white; width: 220px; text-align: center; outline: none; transition: 0.15s; }
    #wordInput:focus { border-color: #8a6af5; box-shadow: 0 0 20px rgba(138,106,245,0.2); }
    .btn { background: #3f3570; border: none; padding: 0.8rem 2rem; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; transition: 0.15s; border: 1px solid #5a4a8a; }
    .btn:hover { background: #5a4a9a; transform: scale(1.02); }
    .stats { display: flex; justify-content: space-between; color: #b6b0d9; margin-top: 1.2rem; font-weight: 500; flex-wrap: wrap; gap: 0.8rem; }
    .stats span i { margin-right: 6px; }
    .message { margin-top: 1rem; padding: 0.7rem; border-radius: 1rem; background: #1e1a30; color: #d4caff; min-height: 50px; border-left: 4px solid #8a6af5; }
    .message i { margin-right: 8px; }
    .game-over { color: #ff7a7a; }
    .win { color: #7af5b0; }
    @media (max-width: 500px) { .word { font-size: 2.8rem; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-keyboard"></i> Word Blitz</h1>
  <div class="word-display">
    <div class="word" id="wordDisplay">START</div>
  </div>
  <div class="input-area">
    <input type="text" id="wordInput" placeholder="type the word..." autofocus>
    <button class="btn" id="submitBtn"><i class="fas fa-arrow-right"></i> submit</button>
  </div>
  <div class="stats">
    <span><i class="fas fa-star"></i> score: <span id="scoreDisplay">0</span></span>
    <span><i class="fas fa-clock"></i> time: <span id="timerDisplay">30</span>s</span>
    <span><i class="fas fa-bolt"></i> streak: <span id="streakDisplay">0</span></span>
  </div>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> type the word and hit enter</div>
</div>
<script>
  const words = ['CODE', 'FAST', 'TYPE', 'GAME', 'WORD', 'BOLT', 'STAR', 'FIRE', 'MIND', 'SPEED', 'QUIZ', 'JUMP', 'RUSH', 'CLICK', 'ZONE', 'MAX', 'GOAL', 'PLAY', 'WIN', 'CORE'];
  let currentWord = '';
  let score = 0;
  let streak = 0;
  let timeLeft = 30;
  let gameActive = false;
  let timerInterval = null;

  const wordDisplay = document.getElementById('wordDisplay');
  const wordInput = document.getElementById('wordInput');
  const submitBtn = document.getElementById('submitBtn');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const timerDisplay = document.getElementById('timerDisplay');
  const streakDisplay = document.getElementById('streakDisplay');
  const messageBox = document.getElementById('messageBox');

  function getRandomWord() { return words[Math.floor(Math.random() * words.length)]; }

  function newWord() {
    currentWord = getRandomWord();
    wordDisplay.textContent = currentWord;
    wordInput.value = '';
    wordInput.focus();
  }

  function updateUI() {
    scoreDisplay.textContent = score;
    timerDisplay.textContent = timeLeft;
    streakDisplay.textContent = streak;
  }

  function endGame(win = false) {
    gameActive = false;
    if (timerInterval) clearInterval(timerInterval);
    wordInput.disabled = true;
    submitBtn.disabled = true;
    if (win) {
      messageBox.innerHTML = `<i class="fas fa-trophy"></i> 🎉 YOU WIN! final score: ${score}`;
      messageBox.className = 'message win';
    } else {
      messageBox.innerHTML = `<i class="fas fa-times-circle"></i> ⏰ time\'s up! final score: ${score}`;
      messageBox.className = 'message game-over';
    }
  }

  function startGame() {
    score = 0; streak = 0; timeLeft = 30; gameActive = true;
    wordInput.disabled = false; submitBtn.disabled = false;
    updateUI();
    messageBox.className = 'message';
    messageBox.innerHTML = '<i class="fas fa-play"></i> go! type fast!';
    newWord();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = timeLeft;
      if (timeLeft <= 0) { endGame(false); }
    }, 1000);
  }

  function handleSubmit() {
    if (!gameActive) { startGame(); return; }
    const typed = wordInput.value.trim().toUpperCase();
    if (typed === '') { messageBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> type something!'; return; }
    if (typed === currentWord) {
      score += 10 + streak * 2;
      streak++;
      messageBox.innerHTML = `<i class="fas fa-check-circle" style="color:#7af5b0;"></i> correct! +${10 + (streak-1)*2} pts`;
      messageBox.className = 'message';
    } else {
      streak = 0;
      messageBox.innerHTML = `<i class="fas fa-times-circle" style="color:#ff7a7a;"></i> wrong! it was "${currentWord}"`;
    }
    updateUI();
    newWord();
    if (score >= 100) { endGame(true); }
  }

  wordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); handleSubmit(); } });
  submitBtn.addEventListener('click', handleSubmit);

  // auto-start
  startGame();
</script>
</body>
</html>
