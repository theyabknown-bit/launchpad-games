<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🌍 Planet Builder Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.planet-display{width:150px;height:150px;border-radius:50%;margin:15px auto;border:3px solid rgba(79,195,247,0.1);box-shadow:0 0 60px rgba(79,195,247,0.05);transition:.5s}
.status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.status-bar .stat{background:rgba(0,0,0,0.3);padding:6px 10px;border-radius:8px;border:1px solid rgba(79,195,247,0.05)}
.status-bar .stat .label{font-size:.7rem;color:#8899aa}
.status-bar .stat .value{font-weight:700;font-size:1.1rem}
.resources{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.resource{background:rgba(0,0,0,0.2);padding:6px;border-radius:8px;border:1px solid rgba(79,195,247,0.05)}
.resource .bar{height:6px;background:rgba(255,255,255,0.05);border-radius:3px;margin-top:4px;overflow:hidden}
.resource .bar .fill{height:100%;border-radius:3px;transition:width .3s}
.resource .bar .fill.heat{background:#ff6b6b}
.resource .bar .fill.oxygen{background:#4fc3f7}
.resource .bar .fill.water{background:#55efc4}
.resource .bar .fill.soil{background:#fdcb6e}
.buildings{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.building-btn{background:rgba(79,195,247,0.05);border:1px solid rgba(79,195,247,0.1);color:#d0e8f0;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem}
.building-btn:hover{background:rgba(79,195,247,0.1)}
.events{background:rgba(255,215,0,0.03);border:1px solid rgba(255,215,0,0.05);border-radius:8px;padding:8px;margin:10px 0;font-size:.85rem;min-height:40px;color:#8899aa}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
#message{min-height:2rem;font-size:.9rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🌍 Planet Builder Pro</h1>
<div class="planet-display" id="planet" style="background:radial-gradient(circle at 30% 30%, #4fc3f7, #1a4a5e)"></div>
<div class="status-bar"><div class="stat"><div class="label">👨‍🚀 Pop</div><div class="value" id="population">0</div></div><div class="stat"><div class="label">🏆 Score</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">🏅 Best</div><div class="value" id="bestScore">-</div></div><div class="stat"><div class="label">🔬 Level</div><div class="value" id="level">1</div></div></div>
<div class="resources"><div class="resource"><div>🌡️ Heat <span id="heatVal">50</span>%</div><div class="bar"><div class="fill heat" id="heatBar" style="width:50%"></div></div></div><div class="resource"><div>🅾️ Oxygen <span id="oxygenVal">50</span>%</div><div class="bar"><div class="fill oxygen" id="oxygenBar" style="width:50%"></div></div></div><div class="resource"><div>💧 Water <span id="waterVal">50</span>%</div><div class="bar"><div class="fill water" id="waterBar" style="width:50%"></div></div></div><div class="resource"><div>🌱 Soil <span id="soilVal">50</span>%</div><div class="bar"><div class="fill soil" id="soilBar" style="width:50%"></div></div></div></div>
<div class="events" id="events">🌍 A new world awaits. Build your planet!</div>
<div class="buildings"><button class="building-btn" onclick="build('farm')">🌾 Farm ($10)</button><button class="building-btn" onclick="build('solar')">☀️ Solar ($15)</button><button class="building-btn" onclick="build('dome')">🛸 Dome ($20)</button><button class="building-btn" onclick="build('lab')">🔬 Lab ($25)</button><button class="building-btn" onclick="build('forest')">🌳 Forest ($12)</button></div>
<div id="message">💡 Build structures to grow your planet!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const planet=document.getElementById('planet'),popEl=document.getElementById('population'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),levelEl=document.getElementById('level');
const heatVal=document.getElementById('heatVal'),oxygenVal=document.getElementById('oxygenVal'),waterVal=document.getElementById('waterVal'),soilVal=document.getElementById('soilVal');
const heatBar=document.getElementById('heatBar'),oxygenBar=document.getElementById('oxygenBar'),waterBar=document.getElementById('waterBar'),soilBar=document.getElementById('soilBar');
const eventsEl=document.getElementById('events'),msgEl=document.getElementById('message');
let state={heat:50,oxygen:50,water:50,soil:50,pop:0,score:0,level:1,buildings:{farm:0,solar:0,dome:0,lab:0,forest:0},gameActive:!1,paused:!1,timerId:null,eventTimer:null,bestScore:0};
(function load(){try{let s=JSON.parse(localStorage.getItem('planet_best')||'{}');state.bestScore=s['all']||0;bestEl.textContent=state.bestScore||'-'}catch(e){}})();
function saveBest(){if(state.score>state.bestScore){state.bestScore=state.score;let s=JSON.parse(localStorage.getItem('planet_best')||'{}');s['all']=state.score;localStorage.setItem('planet_best',JSON.stringify(s));bestEl.textContent=state.score}}
function saveState(){try{localStorage.setItem('planet_state',JSON.stringify(state))}catch(e){}}
function updateUI(){popEl.textContent=state.pop;scoreEl.textContent=state.score;levelEl.textContent=state.level;heatVal.textContent=Math.round(state.heat);oxygenVal.textContent=Math.round(state.oxygen);waterVal.textContent=Math.round(state.water);soilVal.textContent=Math.round(state.soil);heatBar.style.width=state.heat+'%';oxygenBar.style.width=state.oxygen+'%';waterBar.style.width=state.water+'%';soilBar.style.width=state.soil+'%';let color=state.heat>50?'#ff6b6b':state.heat>25?'#4fc3f7':'#1a4a5e';let color2=state.oxygen>50?'#7cf5b0':state.oxygen>25?'#55efc4':'#2d5a4a';planet.style.background='radial-gradient(circle at 30% 30%, '+color2+', '+color+')'}
function addEvent(msg){eventsEl.textContent='🌍 '+msg}
function build(type){if(!state.gameActive||state.paused)return;let costs={farm:10,solar:15,dome:20,lab:25,forest:12};let effect={farm:{heat:-2,oxygen:5,water:-2,soil:3,pop:2},solar:{heat:10,oxygen:2,water:0,soil:0,pop:1},dome:{heat:3,oxygen:3,water:3,soil:2,pop:5},lab:{heat:-5,oxygen:5,water:2,soil:3,pop:3},forest:{heat:-3,oxygen:8,water:5,soil:5,pop:1}};if(state.score<costs[type]){msgEl.textContent='❌ Not enough score! Need '+costs[type];return}state.score-=costs[type];state.buildings[type]++;let e=effect[type];state.heat=Math.min(100,Math.max(0,state.heat+e.heat));state.oxygen=Math.min(100,Math.max(0,state.oxygen+e.oxygen));state.water=Math.min(100,Math.max(0,state.water+e.water));state.soil=Math.min(100,Math.max(0,state.soil+e.soil));state.pop+=e.pop;state.level=1+Math.floor(state.buildings.farm/3)+Math.floor(state.buildings.solar/2)+Math.floor(state.buildings.dome/2);state.score+=5;addEvent('🏗️ Built '+type+'! Population +'+e.pop);playSound('build');saveState();updateUI()}
function grow(){if(!state.gameActive||state.paused)return;let growth=0.05+state.buildings.farm*0.02+state.buildings.dome*0.03+state.buildings.forest*0.02+state.buildings.solar*0.01+state.buildings.lab*0.02;state.pop+=growth;state.heat=Math.max(0,state.heat-0.1);state.oxygen=Math.max(0,state.oxygen-0.1);state.water=Math.max(0,state.water-0.1);state.soil=Math.max(0,state.soil-0.1);if(state.pop>0&&state.heat>10&&state.oxygen>10&&state.water>10&&state.soil>10){state.score+=0.1}saveState();updateUI()}
function randomEvent(){if(!state.gameActive||state.paused)return;let events=[{msg:'☀️ Solar flare! Heat +10',fn:()=>{state.heat=Math.min(100,state.heat+10)}},{msg:'🌠 Meteor shower! Damage -5 all',fn:()=>{state.heat=Math.max(0,state.heat-5);state.oxygen=Math.max(0,state.oxygen-5);state.water=Math.max(0,state.water-5);state.soil=Math.max(0,state.soil-5)}},{msg:'🛸 Alien visitors! Population +2',fn:()=>{state.pop+=2}},{msg:'🌧️ Rain storm! Water +15',fn:()=>{state.water=Math.min(100,state.water+15)}},{msg:'🌱 Fertile season! Soil +10',fn:()=>{state.soil=Math.min(100,state.soil+10)}},{msg:'🔬 Research breakthrough! Score +10',fn:()=>{state.score+=10}}];let e=events[Math.floor(Math.random()*events.length)];e.fn();addEvent(e.msg);playSound('event');saveState();updateUI()}
function startGame(){state.gameActive=!0;state.paused=!1;state.heat=50;state.oxygen=50;state.water=50;state.soil=50;state.pop=0;state.score=0;state.level=1;state.buildings={farm:0,solar:0,dome:0,lab:0,forest:0};document.getElementById('pauseLabel').textContent='Pause';addEvent('🚀 Planet building started!');if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);state.timerId=setInterval(()=>{grow()},1000);state.eventTimer=setInterval(()=>{randomEvent()},6000);saveState();updateUI();msgEl.textContent='💡 Build structures to grow your planet!'}
function togglePause(){if(!state.gameActive)return;state.paused=!state.paused;document.getElementById('pauseLabel').textContent=state.paused?'Resume':'Pause';msgEl.textContent=state.paused?'⏸️ Paused':'💡 Build and grow!';if(state.paused){if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer)}else{state.timerId=setInterval(()=>{grow()},1000);state.eventTimer=setInterval(()=>{randomEvent()},6000)}}
function resetGame(){if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);state.gameActive=!1;state.paused=!1;state.heat=50;state.oxygen=50;state.water=50;state.soil=50;state.pop=0;state.score=0;state.level=1;state.buildings={farm:0,solar:0,dome:0,lab:0,forest:0};document.getElementById('pauseLabel').textContent='Pause';addEvent('🔄 Planet reset.');saveState();updateUI();msgEl.textContent='💡 Click Start to begin!'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='build'){o.frequency.value=600;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=800},100);o.stop(c.currentTime+.2)}else if(type==='event'){o.frequency.value=500;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=400},100);o.stop(c.currentTime+.2)}}catch(e){}}
loadState();updateUI();console.log('🌍 Planet Builder Pro loaded');
</script></body></html>
