<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 Black Hole Escape</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1a26; color: #d0e8f0; font-family: 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .back-btn { position: fixed; top: 20px; left: 20px; background: #1a3344; color: #4fc3f7; padding: 12px 20px; border: none; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; z-index: 100; }
        .back-btn:hover { background: #2a4a5e; transform: translateX(-5px); }
        .container { max-width: 500px; width: 100%; text-align: center; margin-top: 60px; }
        h1 { color: #4fc3f7; font-size: 2.5rem; margin-bottom: 10px; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 10px 20px; border-radius: 10px; min-width: 80px; border: 1px solid #2a4a5e; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.2rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.7rem; text-transform: uppercase; }
        .black-hole { font-size: 8rem; margin: 15px 0; display: block; animation: spin 10s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { background: #4fc3f7; color: #0b1a26; border: none; padding: 12px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin: 5px; }
        .btn:hover { background: #7cf5b0; }
        .btn-escape { background: linear-gradient(135deg, #ff6b6b, #c0392b); color: white; }
        .btn-escape:hover { background: linear-gradient(135deg, #c0392b, #78281f); }
        .message { font-size: 1.2rem; min-height: 30px; color: #ffd93d; margin: 10px 0; }
    </style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-circle" style="color:#6c5ce7;"></i> Black Hole Escape</h1>
    <div class="stats">
        <div class="stat-box"><span id="escapes">0</span><span class="label">Escapes</span></div>
        <div class="stat-box"><span id="attempts">0</span><span class="label">Attempts</span></div>
    </div>
    <span class="black-hole" id="blackHoleEmoji">🌀</span>
    <div>
        <button class="btn btn-escape" id="escapeBtn">🚀 Escape!</button>
        <button class="btn" id="resetBtn">🔄 Reset</button>
    </div>
    <div class="message" id="message">🌀 Escape the black hole!</div>
</div>
<script>
let escapes = 0, attempts = 0;

function escape() {
    attempts++;
    const chance = Math.random();
    if (chance > 0.4) {
        escapes++;
        document.getElementById('message').textContent = '🚀 ESCAPED! +1 escape!';
        document.getElementById('blackHoleEmoji').textContent = '⭐';
        setTimeout(() => document.getElementById('blackHoleEmoji').textContent = '🌀', 500);
    } else {
        document.getElementById('message').textContent = '💀 Pulled back in! Try again!';
    }
    updateUI();
}

function resetGame() {
    escapes = 0; attempts = 0;
    document.getElementById('message').textContent = '🔄 Reset!';
    updateUI();
}

function updateUI() {
    document.getElementById('escapes').textContent = escapes;
    document.getElementById('attempts').textContent = attempts;
}

document.getElementById('escapeBtn').addEventListener('click', escape);
document.getElementById('resetBtn').addEventListener('click', resetGame);
updateUI();
</script>
</body>
</html>
