<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Space Explorer Pro</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .game-container { text-align: center; position: relative; }
        canvas {
            display: block;
            margin: 15px auto;
            background: #0a0a1a;
            border-radius: 16px;
            border: 2px solid rgba(79,195,247,0.1);
            box-shadow: 0 0 60px rgba(79,195,247,0.03);
            max-width: 100%;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .status-bar .stat { color: #8899aa; font-size: 0.9rem; }
        .status-bar .stat span { color: #d0e8f0; font-weight: 700; }
        .stat .health { color: #ff6b6b; }
        .stat .fuel { color: #ffd93d; }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .controls button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); }
        .difficulty-selector { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
        .difficulty-selector button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; padding: 6px 16px; }
        .difficulty-selector button.active { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        #message { min-height: 2rem; font-size: 1rem; }
        .powerup-display { position: absolute; top: 10px; right: 20px; font-size: 1.2rem; color: #7cf5b0; }
        @media (max-width: 600px) { canvas { width: 100%; height: auto; } }
    </style>
</head>
<body>
<div class="game-container">
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    <h1 class="game-title">🚀 Space Explorer Pro</h1>

    <!-- Difficulty -->
    <div class="difficulty-selector">
        <button data-diff="easy">Easy</button>
        <button data-diff="medium" class="active">Medium</button>
        <button data-diff="hard">Hard</button>
    </div>

    <!-- Status -->
    <div class="status-bar">
        <div class="stat">🏆 Score: <span id="score">0</span></div>
        <div class="stat">🏅 Best: <span id="bestScore">-</span></div>
        <div class="stat">❤️ Health: <span class="health" id="health">100</span>%</div>
        <div class="stat">⛽ Fuel: <span class="fuel" id="fuel">100</span>%</div>
        <div class="stat">💥 Enemies: <span id="enemyCount">0</span></div>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div id="message">⬆️⬇️⬅️➡️ Move | Space to shoot</div>

    <div class="controls">
        <button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button>
        <button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button>
    </div>
</div>

<script>
// ============================================================
// SPACE EXPLORER PRO – Fuel, enemies, health, power-ups, high-score
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('bestScore');
const healthEl = document.getElementById('health');
const fuelEl = document.getElementById('fuel');
const enemyCountEl = document.getElementById('enemyCount');
const msgEl = document.getElementById('message');

const W = canvas.width;
const H = canvas.height;

let player = { x: 50, y: H/2, w: 30, h: 30, speed: 4 };
let bullets = [];
let enemies = [];
let powerups = [];
let stars = [];
let score = 0;
let health = 100;
let fuel = 100;
let maxFuel = 100;
let gameOver = false;
let paused = false;
let difficulty = 'medium';
let bestScore = 0;
let frame = 0;
let keys = {};
let shootCooldown = 0;
let enemySpawnTimer = 0;
let fuelConsumptionRate = 0.02;
let difficultySettings = {
    easy: { enemySpeed: 1, spawnRate: 40, enemyHealth: 1, bulletSpeed: 3 },
    medium: { enemySpeed: 1.8, spawnRate: 25, enemyHealth: 2, bulletSpeed: 4 },
    hard: { enemySpeed: 2.5, spawnRate: 15, enemyHealth: 3, bulletSpeed: 5 }
};

// Load best score and difficulty
(function load() {
    try {
        const saved = JSON.parse(localStorage.getItem('space_explorer_best') || '{}');
        bestScore = saved[difficulty] || 0;
        if (bestScore) bestEl.textContent = bestScore;
        else bestEl.textContent = '-';
        const diff = localStorage.getItem('space_explorer_difficulty') || 'medium';
        difficulty = diff;
        document.querySelectorAll('.difficulty-selector button').forEach(b => {
            b.classList.toggle('active', b.dataset.diff === difficulty);
        });
    } catch(e) {}
})();

function saveBest() {
    if (score > bestScore) {
        bestScore = score;
        const saved = JSON.parse(localStorage.getItem('space_explorer_best') || '{}');
        saved[difficulty] = score;
        localStorage.setItem('space_explorer_best', JSON.stringify(saved));
        bestEl.textContent = score;
    }
}

function getSettings() {
    return difficultySettings[difficulty] || difficultySettings.medium;
}

// ---- Stars (parallax background) ----
function initStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.5 + 0.2
        });
    }
}

function updateStars() {
    stars.forEach(s => {
        s.x -= s.speed;
        if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    });
}

function drawStars() {
    stars.forEach(s => {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + s.size/6})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ---- Player ----
function drawPlayer() {
    // Ship body
    ctx.shadowColor = '#4fc3f7';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#4fc3f7';
    ctx.beginPath();
    ctx.moveTo(player.x + player.w, player.y + player.h/2);
    ctx.lineTo(player.x, player.y);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // Cockpit
    ctx.fillStyle = '#7cf5b0';
    ctx.beginPath();
    ctx.arc(player.x + player.w*0.3, player.y + player.h/2, 4, 0, Math.PI*2);
    ctx.fill();
    // Engine glow
    if (!paused && !gameOver) {
        ctx.fillStyle = `rgba(255,215,0,${0.2 + 0.3 * Math.sin(frame/10)})`;
        ctx.beginPath();
        ctx.arc(player.x - 5, player.y + player.h/2, 8, 0, Math.PI*2);
        ctx.fill();
    }
}

function movePlayer() {
    if (paused || gameOver) return;
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx = -1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dx = 1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) dy = -1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) dy = 1;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    player.x += dx * player.speed;
    player.y += dy * player.speed;
    // Boundaries
    player.x = Math.max(0, Math.min(W - player.w, player.x));
    player.y = Math.max(0, Math.min(H - player.h, player.y));

    // Consume fuel
    if (dx !== 0 || dy !== 0) {
        fuel -= fuelConsumptionRate * player.speed;
        if (fuel < 0) fuel = 0;
        fuelEl.textContent = Math.round(fuel);
        if (fuel <= 0) {
            gameOver = true;
            msgEl.textContent = '💀 Out of fuel! Game Over.';
            playSound('explode');
        }
    }
}

// ---- Shooting ----
function shoot() {
    if (paused || gameOver || shootCooldown > 0) return;
    bullets.push({
        x: player.x + player.w,
        y: player.y + player.h/2 - 2,
        w: 10,
        h: 4,
        speed: 8,
        damage: 1
    });
    shootCooldown = 10;
    playSound('shoot');
}

function updateBullets() {
    bullets.forEach(b => {
        b.x += b.speed;
    });
    bullets = bullets.filter(b => b.x < W);
}

function drawBullets() {
    bullets.forEach(b => {
        ctx.fillStyle = '#7cf5b0';
        ctx.shadowColor = '#7cf5b0';
        ctx.shadowBlur = 15;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.shadowBlur = 0;
    });
}

// ---- Enemies ----
function spawnEnemy() {
    const settings = getSettings();
    const y = Math.random() * (H - 30) + 15;
    const type = Math.random() < 0.2 ? 'shooter' : 'normal';
    enemies.push({
        x: W + 20,
        y: y,
        w: 30,
        h: 30,
        speed: settings.enemySpeed * (0.8 + Math.random() * 0.4),
        health: settings.enemyHealth,
        maxHealth: settings.enemyHealth,
        type: type,
        shootTimer: 0,
        shootInterval: 60 + Math.random() * 30
    });
}

function updateEnemies() {
    const settings = getSettings();
    enemies.forEach(e => {
        e.x -= e.speed;
        // Enemy shooting
        if (e.type === 'shooter' && e.shootTimer <= 0) {
            // Shoot at player
            const angle = Math.atan2(player.y - e.y, player.x - e.x);
            enemies.push({
                x: e.x - 10,
                y: e.y + e.h/2 - 2,
                w: 8,
                h: 8,
                speed: settings.bulletSpeed * 0.6,
                health: 0,
                isBullet: true,
                angle: angle
            });
            e.shootTimer = e.shootInterval;
        }
        if (e.shootTimer > 0) e.shootTimer--;
    });
    // Remove off-screen enemies and bullets
    enemies = enemies.filter(e => {
        if (e.isBullet) {
            return e.x > 0 && e.x < W && e.y > 0 && e.y < H;
        }
        return e.x > -50;
    });
    enemyCountEl.textContent = enemies.filter(e => !e.isBullet).length;
}

function drawEnemies() {
    enemies.forEach(e => {
        if (e.isBullet) {
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(e.x, e.y, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            return;
        }
        // Enemy ship
        ctx.fillStyle = '#ff6b6b';
        ctx.shadowColor = '#ff6b6b';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(e.x - e.w, e.y + e.h/2);
        ctx.lineTo(e.x, e.y);
        ctx.lineTo(e.x, e.y + e.h);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        // Health bar
        if (e.maxHealth > 1) {
            const barW = e.w * 0.8;
            const pct = e.health / e.maxHealth;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(e.x - e.w/2, e.y - 6, barW, 3);
            ctx.fillStyle = pct > 0.5 ? '#7cf5b0' : '#ff6b6b';
            ctx.fillRect(e.x - e.w/2, e.y - 6, barW * pct, 3);
        }
        // Shooter indicator
        if (e.type === 'shooter') {
            ctx.fillStyle = '#ffd93d';
            ctx.font = '10px sans-serif';
            ctx.fillText('🔫', e.x - 10, e.y - 10);
        }
    });
}

// ---- Power-ups ----
function spawnPowerup(x, y) {
    const types = ['fuel', 'health', 'shield'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({
        x: x, y: y,
        w: 20, h: 20,
        type: type,
        speed: 1.5
    });
}

function updatePowerups() {
    powerups.forEach(p => {
        p.x -= p.speed;
    });
    powerups = powerups.filter(p => p.x > -20);
}

function drawPowerups() {
    powerups.forEach(p => {
        const colors = { fuel: '#ffd93d', health: '#ff6b6b', shield: '#4fc3f7' };
        const icons = { fuel: '⛽', health: '❤️', shield: '🛡️' };
        ctx.fillStyle = colors[p.type] || '#fff';
        ctx.shadowColor = colors[p.type] || '#fff';
        ctx.shadowBlur = 20;
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icons[p.type], p.x + p.w/2, p.y + p.h/2);
        ctx.shadowBlur = 0;
    });
}

// ---- Collision Detection ----
function checkCollisions() {
    // Bullets vs Enemies
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (e.isBullet) continue;
            if (b.x < e.x + e.w/2 && b.x + b.w > e.x - e.w/2 &&
                b.y < e.y + e.h && b.y + b.h > e.y) {
                e.health -= b.damage;
                bullets.splice(i, 1);
                if (e.health <= 0) {
                    score += 10;
                    scoreEl.textContent = score;
                    spawnPowerup(e.x, e.y);
                    playSound('explode');
                    enemies.splice(j, 1);
                    saveBest();
                }
                break;
            }
        }
    }

    // Enemy bullets vs Player
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (!e.isBullet) continue;
        if (e.x > player.x && e.x < player.x + player.w &&
            e.y > player.y && e.y < player.y + player.h) {
            health -= 10;
            healthEl.textContent = Math.max(0, health);
            enemies.splice(i, 1);
            playSound('hit');
            if (health <= 0) {
                gameOver = true;
                msgEl.textContent = '💀 You died! Game Over.';
                playSound('explode');
            }
        }
    }

    // Enemies vs Player (collision)
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.isBullet) continue;
        if (e.x - e.w/2 < player.x + player.w && e.x + e.w/2 > player.x &&
            e.y < player.y + player.h && e.y + e.h > player.y) {
            health -= 20;
            healthEl.textContent = Math.max(0, health);
            enemies.splice(i, 1);
            playSound('hit');
            if (health <= 0) {
                gameOver = true;
                msgEl.textContent = '💀 You crashed! Game Over.';
                playSound('explode');
            }
        }
    }

    // Powerups vs Player
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        if (p.x < player.x + player.w && p.x + p.w > player.x &&
            p.y < player.y + player.h && p.y + p.h > player.y) {
            if (p.type === 'fuel') {
                fuel = Math.min(100, fuel + 20);
                fuelEl.textContent = Math.round(fuel);
                playSound('collect');
            } else if (p.type === 'health') {
                health = Math.min(100, health + 15);
                healthEl.textContent = Math.round(health);
                playSound('collect');
            } else if (p.type === 'shield') {
                // Shield: invincible for a few seconds (we'll just add health)
                health = Math.min(100, health + 10);
                healthEl.textContent = Math.round(health);
                playSound('collect');
            }
            powerups.splice(i, 1);
        }
    }
}

// ---- Drawing ----
function draw() {
    ctx.clearRect(0, 0, W, H);
    drawStars();
    drawBullets();
    drawEnemies();
    drawPowerups();
    drawPlayer();
    // HUD
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, 0, W, 20);
}

// ---- Sound ----
function playSound(type) {
    try {
        const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        if (type === 'shoot') {
            osc.frequency.value = 600;
            gain.gain.value = 0.04;
            osc.start();
            osc.stop(ctxAudio.currentTime + 0.06);
        } else if (type === 'explode') {
            osc.frequency.value = 200;
            gain.gain.value = 0.08;
            osc.start();
            setTimeout(() => { osc.frequency.value = 100; }, 100);
            osc.stop(ctxAudio.currentTime + 0.3);
        } else if (type === 'hit') {
            osc.frequency.value = 300;
            gain.gain.value = 0.06;
            osc.start();
            osc.stop(ctxAudio.currentTime + 0.1);
        } else if (type === 'collect') {
            osc.frequency.value = 800;
            gain.gain.value = 0.05;
            osc.start();
            setTimeout(() => { osc.frequency.value = 1000; }, 80);
            osc.stop(ctxAudio.currentTime + 0.15);
        }
    } catch(e) {}
}

// ---- Game Loop ----
function gameLoop() {
    if (!gameOver && !paused) {
        frame++;
        movePlayer();
        // Shooting
        if (shootCooldown > 0) shootCooldown--;
        if (keys[' '] || keys['Space']) { shoot(); }
        // Spawn enemies
        const settings = getSettings();
        if (frame % Math.max(10, settings.spawnRate - Math.floor(score / 50)) === 0) {
            if (enemies.filter(e => !e.isBullet).length < 10 + Math.floor(score / 20)) {
                spawnEnemy();
            }
        }
        // Update
        updateStars();
        updateBullets();
        updateEnemies();
        updatePowerups();
        checkCollisions();
        // Fuel consumption
        fuel -= fuelConsumptionRate * 0.1;
        if (fuel < 0) fuel = 0;
        fuelEl.textContent = Math.round(fuel);
        if (fuel <= 0) {
            gameOver = true;
            msgEl.textContent = '💀 Out of fuel! Game Over.';
            playSound('explode');
        }
        // Update UI
        healthEl.textContent = Math.round(health);
    }
    draw();
    requestAnimationFrame(gameLoop);
}

// ---- Controls ----
document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        shoot();
    }
    if (e.key === 'p' || e.key === 'P') togglePause();
    if (e.key === 'r' || e.key === 'R') resetGame();
});
document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

function togglePause() {
    if (gameOver) return;
    paused = !paused;
    document.getElementById('pauseLabel').textContent = paused ? 'Resume' : 'Pause';
    msgEl.textContent = paused ? '⏸️ Paused' : '⬆️⬇️⬅️➡️ Move | Space to shoot';
}

function resetGame() {
    if (confirm('Reset game?')) {
        player.x = 50; player.y = H/2;
        health = 100;
        fuel = 100;
        score = 0;
        gameOver = false;
        paused = false;
        bullets = [];
        enemies = [];
        powerups = [];
        shootCooldown = 0;
        scoreEl.textContent = score;
        healthEl.textContent = health;
        fuelEl.textContent = fuel;
        enemyCountEl.textContent = 0;
        msgEl.textContent = '⬆️⬇️⬅️➡️ Move | Space to shoot';
        document.getElementById('pauseLabel').textContent = 'Pause';
        saveBest();
        initStars();
    }
}

// ---- Difficulty ----
document.querySelectorAll('.difficulty-selector button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.difficulty-selector button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        difficulty = this.dataset.diff;
        localStorage.setItem('space_explorer_difficulty', difficulty);
        resetGame();
    });
});

// ---- Init ----
initStars();
resetGame();
gameLoop();
console.log('🚀 Space Explorer Pro loaded with fuel, enemies, health, power-ups.');
</script>
</body>
</html>
