<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galactic Delivery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(10,14,30,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #2a3f5a;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; display: flex; align-items: center; gap: 10px; justify-content: center; }
    h1 i { color: #7fc9ff; }
    .back { display: inline-block; margin-bottom: 1rem; color: #b6ddf5; text-decoration: none; background: #1c4055; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #3a6b88; }
    .back:hover { background: #2a5a78; }
    .delivery-area { background: #0f172a; border-radius: 1.5rem; padding: 1.5rem; margin: 1rem 0; border: 1px solid #1e3347; }
    .planet-row { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; margin: 0.8rem 0; }
    .planet-btn {
      background: rgba(0,0,0,0.3); border-radius: 1rem; padding: 0.8rem 1.2rem;
      border: 2px solid #1a3a5a; cursor: pointer; transition: 0.15s; color: white;
      min-width: 80px;
    }
    .planet-btn:hover:not(:disabled) { border-color: #7fc9ff; transform: scale(1.05); }
    .planet-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .planet-btn .emoji { font-size: 1.8rem; }
    .planet-btn .name { font-size: 0.8rem; margin-top: 0.2rem; }
    .delivery-info { background: #0a121a; border-radius: 1rem; padding: 1rem; margin: 0.8rem 0; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin: 0.5rem 0; }
    .stat-box { background: rgba(0,0,0,0.3); border-radius: 0.8rem; padding: 0.4rem; text-align: center; }
    .stat-box .val { color: white; font-size: 1.2rem; font-weight: 700; }
    .stat-box .label { color: #7f9fb9; font-size: 0.65rem; text-transform: uppercase; }
    .action-bar { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin: 0.5rem 0; }
    .action-bar .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.5rem 1.5rem; border-radius: 40px; color: white; cursor: pointer; transition: 0.15s; }
    .action-bar .btn:hover { background: #2a5a7a; }
    .action-bar .btn.danger { background: #4a1a1a; border-color: #6a2a2a; }
    .action-bar .btn.danger:hover { background: #6a2a2a; }
    .message { margin-top: 0.5rem; padding: 0.6rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
    .xp-bar { background: #0a1a2a; border-radius: 1rem; height: 16px; overflow: hidden; border: 1px solid #1a3a5a; margin: 0.3rem 0; }
    .xp-fill { height: 100%; background: linear-gradient(90deg, #4fc3f7, #7cf5b0); border-radius: 1rem; transition: width 0.3s; width: 0%; }
    .timer { color: #f5c87c; font-size: 1.2rem; font-weight: 700; }
    @media (max-width: 500px) { .planet-row { gap: 0.4rem; } .planet-btn { min-width: 60px; padding: 0.5rem 0.8rem; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-shipping-fast"></i> Galactic Delivery</h1>
  
  <div class="stats-grid">
    <div class="stat-box"><div class="val" id="scoreDisplay">0</div><div class="label">Deliveries</div></div>
    <div class="stat-box"><div class="val" id="levelDisplay">1</div><div class="label">Level</div></div>
    <div class="stat-box"><div class="val" id="xpDisplay">0</div><div class="label">XP</div></div>
  </div>

  <div class="delivery-area">
    <div class="delivery-info">
      <div style="color:#6a8aaa; font-size:0.8rem;">📦 Deliver to:</div>
      <div style="font-size:1.5rem; color:white; font-weight:600;" id="targetDisplay">🌍 Earth</div>
      <div class="timer" id="timerDisplay">⏱️ 10s</div>
    </div>
    <div class="planet-row" id="planetRow"></div>
  </div>

  <div class="action-bar">
    <button class="btn" id="nextBtn"><i class="fas fa-arrow-right"></i> Next Delivery</button>
    <button class="btn danger" id="resetBtn"><i class="fas fa-rotate"></i> Reset</button>
  </div>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> Click the correct planet to deliver!</div>
  
  <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#4a6a8a;">
    <span>XP to next: <span id="xpToNext">10</span></span>
  </div>
  <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
</div>

<script>
  const PLANETS = [
    { name: 'Mercury', emoji: '☿', color: '#b0b0b0' },
    { name: 'Venus', emoji: '♀', color: '#e8b87a' },
    { name: 'Earth', emoji: '🌍', color: '#4a8bc2' },
    { name: 'Mars', emoji: '♂', color: '#c4713b' },
    { name: 'Jupiter', emoji: '♃', color: '#c88b5a' },
    { name: 'Saturn', emoji: '♄', color: '#d4b87a' },
    { name: 'Uranus', emoji: '⛢', color: '#7fd4d4' },
    { name: 'Neptune', emoji: '♆', color: '#4a6ab5' },
    { name: 'Pluto', emoji: '♇', color: '#b8a89a' }
  ];

  let score = 0, level = 1, xp = 0, xpToNext = 10;
  let target = null, timeLeft = 10, timerRunning = false, timerInterval = null;
  let usedPlanets = [];

  const targetDisplay = document.getElementById('targetDisplay');
  const timerDisplay = document.getElementById('timerDisplay');
  const planetRow = document.getElementById('planetRow');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const xpFill = document.getElementById('xpFill');
  const xpToNextDisplay = document.getElementById('xpToNext');
  const messageBox = document.getElementById('messageBox');

  function shuffle(arr) { for (let i=arr.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

  function addXP(amount) {
    xp += amount;
    while (xp >= xpToNext) {
      xp -= xpToNext;
      level++;
      xpToNext = Math.floor(xpToNext * 1.3) + 5;
      messageBox.innerHTML = `<i class="fas fa-trophy" style="color:#ffd700;"></i> 🎉 LEVEL UP! You're now level ${level}!`;
    }
    updateUI();
  }

  function getRandomPlanet(exclude) {
    const available = PLANETS.filter(p => p.name !== exclude);
    return available[Math.floor(Math.random() * available.length)];
  }

  function startDelivery() {
    if (timerInterval) clearInterval(timerInterval);
    target = getRandomPlanet();
    targetDisplay.textContent = `${target.emoji} ${target.name}`;
    timeLeft = 10 + Math.floor(level / 2);
    timerDisplay.textContent = `⏱️ ${timeLeft}s`;
    timerRunning = true;
    
    // Generate options
    let options = [target];
    const others = shuffle(PLANETS.filter(p => p.name !== target.name));
    for (let i = 0; i < 3 && options.length < 4; i++) {
      if (!options.includes(others[i])) options.push(others[i]);
    }
    options = shuffle(options);
    
    planetRow.innerHTML = options.map(p => `
      <button class="planet-btn" onclick="deliver('${p.name}')">
        <div class="emoji">${p.emoji}</div>
        <div class="name">${p.name}</div>
      </button>
    `).join('');

    messageBox.innerHTML = `<i class="fas fa-rocket"></i> Deliver to ${target.name}!`;

    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = `⏱️ ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        messageBox.innerHTML = `<i class="fas fa-times-circle" style="color:#ff7a7a;"></i> ⏰ Time\'s up! The target was ${target.name}`;
        setTimeout(startDelivery, 1500);
      }
    }, 1000);
  }

  function deliver(planetName) {
    if (!timerRunning) return;
    clearInterval(timerInterval);
    timerRunning = false;
    
    const isCorrect = planetName === target.name;
    const btns = planetRow.querySelectorAll('.planet-btn');
    btns.forEach(b => {
      b.disabled = true;
      if (b.textContent.trim() === target.name) b.style.borderColor = '#7cf5b0';
      else if (b.textContent.trim() === planetName && !isCorrect) b.style.borderColor = '#ff7a7a';
    });

    if (isCorrect) {
      score++;
      const xpGain = 5 + Math.floor(level * 0.5);
      addXP(xpGain);
      messageBox.innerHTML = `<i class="fas fa-check-circle" style="color:#7cf5b0;"></i> ✅ Delivered to ${target.name}! +${xpGain} XP`;
    } else {
      messageBox.innerHTML = `<i class="fas fa-times-circle" style="color:#ff7a7a;"></i> ❌ Wrong! The target was ${target.name}`;
    }
    updateUI();
    setTimeout(startDelivery, 1500);
  }

  function updateUI() {
    scoreDisplay.textContent = score;
    levelDisplay.textContent = level;
    xpDisplay.textContent = xp;
    xpToNextDisplay.textContent = xpToNext - xp;
    const pct = Math.min(100, (xp / xpToNext) * 100);
    xpFill.style.width = pct + '%';
  }

  function resetGame() {
    if (timerInterval) clearInterval(timerInterval);
    if (!confirm('Reset game?')) return;
    score = 0; level = 1; xp = 0; xpToNext = 10;
    timerRunning = false;
    updateUI();
    startDelivery();
  }

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (timerInterval) clearInterval(timerInterval);
    startDelivery();
  });
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  window.deliver = deliver;
  startDelivery();
</script>
</body>
</html>
