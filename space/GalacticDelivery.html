<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🚚 Galactic Delivery Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.status-bar .stat{background:rgba(0,0,0,0.3);padding:6px 10px;border-radius:8px;border:1px solid rgba(79,195,247,0.05)}
.status-bar .stat .label{font-size:.7rem;color:#8899aa}
.status-bar .stat .value{font-weight:700;font-size:1.1rem}
.status-bar .stat .value.fuel{color:#ffd93d}
.planet-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}
.planet{background:rgba(0,0,0,0.3);padding:12px;border-radius:12px;border:2px solid rgba(79,195,247,0.05);cursor:pointer;transition:.2s}
.planet:hover{border-color:rgba(79,195,247,0.2)}
.planet .emoji{font-size:2rem;display:block}
.planet .name{font-size:.7rem;color:#8899aa;margin-top:4px}
.planet.current{border-color:#4fc3f7;background:rgba(79,195,247,0.05)}
.planet.has-cargo{border-color:#ffd93d;background:rgba(255,215,0,0.03)}
.cargo-area{background:rgba(0,0,0,0.2);border-radius:12px;padding:12px;margin:10px 0;border:1px solid rgba(79,195,247,0.05)}
.cargo-area .cargo-item{display:inline-block;padding:4px 12px;margin:4px;border-radius:20px;background:rgba(79,195,247,0.05);border:1px solid rgba(79,195,247,0.1);font-size:.8rem}
.events{background:rgba(255,215,0,0.03);border:1px solid rgba(255,215,0,0.05);border-radius:8px;padding:8px;margin:10px 0;font-size:.85rem;min-height:40px;color:#8899aa}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.actions button{background:rgba(79,195,247,0.05);border:1px solid rgba(79,195,247,0.1);color:#d0e8f0;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem}
.actions button:hover{background:rgba(79,195,247,0.1)}
#message{min-height:2rem;font-size:.9rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🚚 Galactic Delivery Pro</h1>
<div class="status-bar"><div class="stat"><div class="label">⛽ Fuel</div><div class="value fuel" id="fuel">100</div></div><div class="stat"><div class="label">📦 Cargo</div><div class="value" id="cargoCount">0</div></div><div class="stat"><div class="label">🏆 Score</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">🏅 Best</div><div class="value" id="bestScore">-</div></div></div>
<div class="planet-grid" id="planetGrid"></div>
<div class="cargo-area" id="cargoArea"><span style="color:#8899aa;font-size:.8rem">No cargo. Visit a planet to pick up delivery.</span></div>
<div class="events" id="events">🚀 Ready for delivery!</div>
<div class="actions"><button onclick="pickupCargo()">📦 Pickup Cargo</button><button onclick="deliverCargo()">🚚 Deliver Cargo</button><button onclick="refuel()">⛽ Refuel ($5)</button><button onclick="upgradeShip()">⬆️ Upgrade Ship ($30)</button></div>
<div id="message">💡 Visit planets, pick up cargo, deliver for profit!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const fuelEl=document.getElementById('fuel'),cargoEl=document.getElementById('cargoCount'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),planetGrid=document.getElementById('planetGrid'),cargoArea=document.getElementById('cargoArea'),eventsEl=document.getElementById('events'),msgEl=document.getElementById('message');
const PLANETS=[{name:'Earth',emoji:'🌍',distance:1},{name:'Mars',emoji:'🔴',distance:2},{name:'Venus',emoji:'🟡',distance:3},{name:'Jupiter',emoji:'🟠',distance:4},{name:'Saturn',emoji:'🪐',distance:5}];
const CARGO_TYPES=['Food','Medicine','Tech','Fuel','Water','Minerals','Data','Weapons','Art','Spices'];
let state={fuel:100,maxFuel:100,cargo:[],score:0,currentPlanet:0,bestScore:0,shipLevel:1,gameActive:!1,paused:!1,timerId:null};
(function load(){try{let s=JSON.parse(localStorage.getItem('delivery_best')||'{}');state.bestScore=s['all']||0;bestEl.textContent=state.bestScore||'-'}catch(e){}})();
function saveBest(){if(state.score>state.bestScore){state.bestScore=state.score;let s=JSON.parse(localStorage.getItem('delivery_best')||'{}');s['all']=state.score;localStorage.setItem('delivery_best',JSON.stringify(s));bestEl.textContent=state.score}}
function saveState(){try{localStorage.setItem('delivery_state',JSON.stringify(state))}catch(e){}}
function renderPlanets(){planetGrid.innerHTML='';PLANETS.forEach((p,i)=>{let div=document.createElement('div');div.className='planet'+(i===state.currentPlanet?' current':'')+(state.cargo.some(c=>c.planet===i)?' has-cargo':'');div.innerHTML='<span class="emoji">'+p.emoji+'</span><div class="name">'+p.name+'</div>';div.onclick=()=>{if(state.gameActive&&!state.paused)travelTo(i)};planetGrid.appendChild(div)})}
function renderCargo(){if(state.cargo.length===0){cargoArea.innerHTML='<span style="color:#8899aa;font-size:.8rem">No cargo. Visit a planet to pick up delivery.</span>';cargoEl.textContent=0;return}cargoArea.innerHTML=state.cargo.map(c=>'<span class="cargo-item">📦 '+c.type+' → '+PLANETS[c.planet].emoji+' '+PLANETS[c.planet].name+'</span>').join('');cargoEl.textContent=state.cargo.length}
function travelTo(idx){if(!state.gameActive||state.paused)return;let dist=PLANETS[idx].distance;let fuelCost=dist*2;if(state.fuel<fuelCost){msgEl.textContent='❌ Not enough fuel! Need '+fuelCost;return}state.fuel-=fuelCost;state.currentPlanet=idx;renderPlanets();addEvent('🛸 Traveled to '+PLANETS[idx].name);playSound('travel');saveState();updateUI()}
function pickupCargo(){if(!state.gameActive||state.paused)return;if(state.cargo.length>=3+state.shipLevel){msgEl.textContent='❌ Cargo hold full! Upgrade ship.';return}let types=CARGO_TYPES.filter(t=>!state.cargo.some(c=>c.type===t));if(types.length===0){msgEl.textContent='❌ No cargo types available';return}let type=types[Math.floor(Math.random()*types.length)];let dest=(state.currentPlanet+1+Math.floor(Math.random()*(PLANETS.length-1)))%PLANETS.length;state.cargo.push({type,planet:dest});renderCargo();addEvent('📦 Picked up '+type+' for '+PLANETS[dest].name);playSound('pickup');saveState();updateUI()}
function deliverCargo(){if(!state.gameActive||state.paused)return;if(state.cargo.length===0){msgEl.textContent='❌ No cargo to deliver!';return}let delivered=[];state.cargo.forEach((c,i)=>{if(c.planet===state.currentPlanet){delivered.push(i)}});if(delivered.length===0){msgEl.textContent='❌ No cargo for this planet!';return}let deliveredCount=0;delivered.reverse().forEach(i=>{let c=state.cargo[i];let profit=10+Math.floor(Math.random()*15)+state.shipLevel*2;state.score+=profit;state.cargo.splice(i,1);deliveredCount++});saveBest();addEvent('🚚 Delivered '+deliveredCount+' cargo! +'+(10+state.shipLevel*2)+' each');playSound('deliver');renderCargo();saveState();updateUI()}
function refuel(){if(!state.gameActive||state.paused)return;if(state.score<5){msgEl.textContent='❌ Need 5 score to refuel!';return}state.score-=5;state.fuel=Math.min(state.maxFuel,state.fuel+30);addEvent('⛽ Refueled +30 fuel');playSound('refuel');saveState();updateUI()}
function upgradeShip(){if(!state.gameActive||state.paused)return;if(state.score<30){msgEl.textContent='❌ Need 30 score to upgrade!';return}state.score-=30;state.shipLevel++;state.maxFuel+=10;state.fuel=Math.min(state.maxFuel,state.fuel+10);addEvent('⬆️ Ship upgraded! Level '+state.shipLevel);playSound('upgrade');saveState();updateUI()}
function addEvent(msg){eventsEl.textContent='🚀 '+msg}
function updateUI(){fuelEl.textContent=Math.round(state.fuel);scoreEl.textContent=Math.round(state.score);bestEl.textContent=state.bestScore||'-';renderPlanets();renderCargo()}
function startGame(){state.gameActive=!0;state.paused=!1;state.fuel=100;state.maxFuel=100;state.cargo=[];state.score=0;state.currentPlanet=0;state.shipLevel=1;document.getElementById('pauseLabel').textContent='Pause';addEvent('🚀 Delivery service started!');if(state.timerId)clearInterval(state.timerId);state.timerId=setInterval(()=>{if(!state.paused&&state.gameActive){state.fuel=Math.max(0,state.fuel-0.5);if(state.fuel<=0){addEvent('💀 Out of fuel! Game Over.');state.gameActive=!1;playSound('gameover')}saveState();updateUI()}},2000);saveState();updateUI();msgEl.textContent='💡 Travel, pickup, deliver!'}
function togglePause(){if(!state.gameActive)return;state.paused=!state.paused;document.getElementById('pauseLabel').textContent=state.paused?'Resume':'Pause';msgEl.textContent=state.paused?'⏸️ Paused':'💡 Keep delivering!';if(state.paused&&state.timerId)clearInterval(state.timerId);else if(!state.paused){state.timerId=setInterval(()=>{if(!state.paused&&state.gameActive){state.fuel=Math.max(0,state.fuel-0.5);if(state.fuel<=0){addEvent('💀 Out of fuel! Game Over.');state.gameActive=!1;playSound('gameover')}saveState();updateUI()}},2000)}}
function resetGame(){if(state.timerId)clearInterval(state.timerId);state.gameActive=!1;state.paused=!1;state.fuel=100;state.maxFuel=100;state.cargo=[];state.score=0;state.currentPlanet=0;state.shipLevel=1;document.getElementById('pauseLabel').textContent='Pause';addEvent('🔄 Station reset.');saveState();updateUI();msgEl.textContent='💡 Click Start to begin!'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='travel'){o.frequency.value=500;g.gain.value=.04;o.start();setTimeout(()=>{o.frequency.value=700},100);o.stop(c.currentTime+.2)}else if(type==='pickup'){o.frequency.value=600;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=800},80);o.stop(c.currentTime+.15)}else if(type==='deliver'){o.frequency.value=700;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=900},100);setTimeout(()=>{o.frequency.value=1100},200);o.stop(c.currentTime+.3)}else if(type==='refuel'){o.frequency.value=400;g.gain.value=.04;o.start();setTimeout(()=>{o.frequency.value=500},100);o.stop(c.currentTime+.15)}else if(type==='upgrade'){o.frequency.value=500;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=700},100);setTimeout(()=>{o.frequency.value=900},200);o.stop(c.currentTime+.35)}else if(type==='gameover'){o.frequency.value=300;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=200},200);o.stop(c.currentTime+.5)}}catch(e){}}
loadState();updateUI();console.log('🚚 Galactic Delivery Pro loaded');
</script></body></html>
