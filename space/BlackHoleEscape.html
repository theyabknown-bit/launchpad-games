<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Hole Escape</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(10,14,30,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #2a3f5a;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; display: flex; align-items: center; gap: 10px; justify-content: center; }
    h1 i { color: #ff6b6b; }
    .back { display: inline-block; margin-bottom: 1rem; color: #b6ddf5; text-decoration: none; background: #1c4055; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #3a6b88; }
    .back:hover { background: #2a5a78; }
    .canvas-wrap { background: #0f172a; border-radius: 1.5rem; padding: 0.5rem; border: 1px solid #1e3347; margin: 0.5rem 0; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 600/400; background: radial-gradient(ellipse at center, #0d1b2a 0%, #000000 100%); border-radius: 1rem; cursor: pointer; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin: 0.5rem 0; }
    .stat-box { background: rgba(0,0,0,0.3); border-radius: 0.8rem; padding: 0.4rem; text-align: center; }
    .stat-box .val { color: white; font-size: 1.2rem; font-weight: 700; }
    .stat-box .label { color: #7f9fb9; font-size: 0.65rem; text-transform: uppercase; }
    .action-bar { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin: 0.5rem 0; }
    .action-bar .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.5rem 1.5rem; border-radius: 40px; color: white; cursor: pointer; transition: 0.15s; }
    .action-bar .btn:hover { background: #2a5a7a; }
    .action-bar .btn.danger { background: #4a1a1a; border-color: #6a2a2a; }
    .action-bar .btn.danger:hover { background: #6a2a2a; }
    .message { margin-top: 0.5rem; padding: 0.6rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
    .xp-bar { background: #0a1a2a; border-radius: 1rem; height: 16px; overflow: hidden; border: 1px solid #1a3a5a; margin: 0.3rem 0; }
    .xp-fill { height: 100%; background: linear-gradient(90deg, #4fc3f7, #7cf5b0); border-radius: 1rem; transition: width 0.3s; width: 0%; }
    .win-text { color: #7cf5b0; }
    .gameover-text { color: #ff7a7a; }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-circle"></i> Black Hole Escape</h1>
  
  <div class="stats-grid">
    <div class="stat-box"><div class="val" id="scoreDisplay">0</div><div class="label">Score</div></div>
    <div class="stat-box"><div class="val" id="levelDisplay">1</div><div class="label">Level</div></div>
    <div class="stat-box"><div class="val" id="xpDisplay">0</div><div class="label">XP</div></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
  </div>

  <div class="action-bar">
    <button class="btn" id="boostBtn"><i class="fas fa-rocket"></i> Boost</button>
    <button class="btn danger" id="resetBtn"><i class="fas fa-rotate"></i> Reset</button>
  </div>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> Move mouse to escape! Click to boost!</div>
  
  <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#4a6a8a;">
    <span>Distance: <span id="distDisplay">0</span> light-years</span>
    <span>Speed: <span id="speedDisplay">0</span></span>
  </div>
  <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = 600, H = 400;

  let ship = { x: 100, y: 200, vx: 0, vy: 0 };
  let blackHole = { x: 350, y: 200, pull: 0.15 };
  let score = 0, level = 1, xp = 0, xpToNext = 15;
  let distance = 0, maxDistance = 0;
  let gameOver = false;
  let escaped = false;
  let particles = [];
  let targetX = 100, targetY = 200;

  const scoreDisplay = document.getElementById('scoreDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const xpFill = document.getElementById('xpFill');
  const distDisplay = document.getElementById('distDisplay');
  const speedDisplay = document.getElementById('speedDisplay');
  const messageBox = document.getElementById('messageBox');

  function addXP(amount) {
    xp += amount;
    while (xp >= xpToNext) {
      xp -= xpToNext;
      level++;
      xpToNext = Math.floor(xpToNext * 1.3) + 5;
      messageBox.innerHTML = `<i class="fas fa-trophy" style="color:#ffd700;"></i> 🎉 LEVEL UP! You're now level ${level}!`;
    }
    updateUI();
  }

  function resetGame() {
    ship.x = 100; ship.y = 200; ship.vx = 0; ship.vy = 0;
    score = 0; level = 1; xp = 0; xpToNext = 15;
    distance = 0; maxDistance = 0; gameOver = false; escaped = false;
    particles = [];
    blackHole.x = 350 + Math.random() * 100 - 50;
    blackHole.y = 200 + Math.random() * 100 - 50;
    targetX = ship.x; targetY = ship.y;
    updateUI();
    messageBox.innerHTML = '<i class="fas fa-rocket"></i> Escape the black hole!';
    messageBox.className = 'message';
  }

  function updateUI() {
    scoreDisplay.textContent = score;
    levelDisplay.textContent = level;
    xpDisplay.textContent = xp;
    const pct = Math.min(100, (xp / xpToNext) * 100);
    xpFill.style.width = pct + '%';
    distDisplay.textContent = Math.floor(distance);
    const spd = Math.sqrt(ship.vx*ship.vx + ship.vy*ship.vy);
    speedDisplay.textContent = spd.toFixed(1);
  }

  function addParticles(x, y, count) {
    for (let i=0; i<count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 40 + Math.random() * 30,
        maxLife: 70,
        r: Math.random() * 3 + 1,
        color: ['#ff6b6b','#ffd93d','#ffa502','#7fc9ff'][Math.floor(Math.random()*4)]
      });
    }
  }

  function update() {
    if (gameOver || escaped) return;

    // Move ship toward target
    ship.x += (targetX - ship.x) * 0.08;
    ship.y += (targetY - ship.y) * 0.08;

    // Black hole pull
    const dx = blackHole.x - ship.x;
    const dy = blackHole.y - ship.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 0) {
      const pullForce = blackHole.pull / (dist * 0.5 + 10);
      ship.vx += (dx / dist) * pullForce;
      ship.vy += (dy / dist) * pullForce;
    }

    // Speed limit
    const spd = Math.sqrt(ship.vx*ship.vx + ship.vy*ship.vy);
    if (spd > 8) {
      ship.vx = (ship.vx / spd) * 8;
      ship.vy = (ship.vy / spd) * 8;
    }

    // Apply velocity
    ship.x += ship.vx;
    ship.y += ship.vy;

    // Distance from start
    distance += 0.1;
    if (distance > maxDistance) maxDistance = distance;
    if (distance % 20 < 0.5) {
      score++;
      addXP(0.5);
    }

    // Check if swallowed by black hole
    const toBlackHole = Math.sqrt(dx*dx + dy*dy);
    if (toBlackHole < 20) {
      gameOver = true;
      addParticles(ship.x, ship.y, 50);
      addParticles(blackHole.x, blackHole.y, 30);
      messageBox.innerHTML = `<i class="fas fa-times-circle" style="color:#ff7a7a;"></i> 💀 Swallowed by the black hole! Score: ${score}`;
      messageBox.className = 'message gameover-text';
    }

    // Check if escaped (reached the exit zone on the right)
    if (ship.x > 550 && ship.y > 50 && ship.y < 350) {
      escaped = true;
      const bonus = Math.floor(maxDistance / 50);
      const xpGain = 10 + bonus;
      addXP(xpGain);
      messageBox.innerHTML = `<i class="fas fa-check-circle" style="color:#7cf5b0;"></i> 🚀 ESCAPED! +${xpGain} XP!`;
      messageBox.className = 'message win-text';
      addParticles(ship.x, ship.y, 40);
      addParticles(ship.x-20, ship.y-20, 20);
    }

    // Particles
    for (let i=particles.length-1; i>=0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.02;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    updateUI();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Stars
    for (let i=0; i<80; i++) {
      const sx = (i*137 + 30) % W, sy = (i*273 + 50) % H;
      ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.7 * Math.random()})`;
      ctx.beginPath();
      ctx.arc(sx, sy, (i%3)+1, 0, Math.PI*2);
      ctx.fill();
    }

    // Black hole
    const grad = ctx.createRadialGradient(blackHole.x, blackHole.y, 0, blackHole.x, blackHole.y, 40);
    grad.addColorStop(0, '#000000');
    grad.addColorStop(0.5, '#1a0a0a');
    grad.addColorStop(0.8, '#2a1a1a');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(blackHole.x, blackHole.y, 40, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ff4444';
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⬤', blackHole.x, blackHole.y);

    // Particles
    for (let p of particles) {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Ship
    ctx.shadowColor = '#7fc9ff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#4a8bc2';
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#7fc9ff';
    ctx.beginPath();
    ctx.arc(ship.x-3, ship.y-3, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Escape zone (EXIT)
    ctx.strokeStyle = 'rgba(124,245,176,0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8,8]);
    ctx.strokeRect(550, 50, 50, 300);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(124,245,176,0.08)';
    ctx.fillRect(550, 50, 50, 300);
    ctx.fillStyle = '#6a8aaa';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🚀 EXIT', 575, 190);

    // Distance
    ctx.fillStyle = '#6a8aaa';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Dist: ${Math.floor(distance)} ly`, 10, 20);

    // Status overlays
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff7a7a';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('💀 GAME OVER', W/2, H/2-20);
      ctx.font = '18px sans-serif';
      ctx.fillStyle = '#b0d4f0';
      ctx.fillText(`Score: ${score}`, W/2, H/2+30);
    }

    if (escaped) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#7cf5b0';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🚀 ESCAPED!', W/2, H/2-20);
      ctx.font = '20px sans-serif';
      ctx.fillStyle = '#b0d4f0';
      ctx.fillText(`Score: ${score}  |  XP: ${xp}`, W/2, H/2+30);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // Controls
  canvas.addEventListener('mousemove', (e) => {
    if (gameOver || escaped) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    targetX = Math.max(10, Math.min(W-10, x));
    targetY = Math.max(10, Math.min(H-10, y));
  });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (gameOver || escaped) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const touch = e.touches[0];
    const x = (touch.clientX - rect.left) * scaleX;
    const y = (touch.clientY - rect.top) * scaleY;
    targetX = Math.max(10, Math.min(W-10, x));
    targetY = Math.max(10, Math.min(H-10, y));
  }, { passive: false });

  document.getElementById('boostBtn').addEventListener('click', () => {
    if (gameOver || escaped) return;
    const angle = Math.atan2(ship.y - blackHole.y, ship.x - blackHole.x);
    ship.vx += Math.cos(angle) * 0.5;
    ship.vy += Math.sin(angle) * 0.5;
    addParticles(ship.x, ship.y, 10);
  });

  document.getElementById('resetBtn').addEventListener('click', resetGame);
  resetGame();
  gameLoop();
</script>
</body>
</html>
