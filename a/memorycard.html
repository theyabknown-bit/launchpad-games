<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Memory Card</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:15px auto;}
.card{aspect-ratio:1;background:#1a3344;border-radius:12px;border:2px solid #2a4a5e;display:flex;align-items:center;justify-content:center;font-size:2.5rem;cursor:pointer;transition:0.15s;touch-action:manipulation;}
.card:hover{transform:scale(1.02);border-color:#4fc3f7;}
.card.flipped{background:#1a4a3a;border-color:#7cf5b0;}
.card.matched{background:#1a4a3a;border-color:#7cf5b0;cursor:default;opacity:0.7;}
.card.matched:hover{transform:none;}
.card .back{display:block;}
.card .front{display:none;}
.card.flipped .back{display:none;}
.card.flipped .front{display:block;}
.card.matched .back{display:none;}
.card.matched .front{display:block;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-brain" style="color:#4fc3f7;"></i> Memory Card</h1>
    <div class="stats">
        <div class="stat-box"><span id="moves">0</span><span class="label">Moves</span></div>
        <div class="stat-box"><span id="matches">0</span><span class="label">Matches</span></div>
    </div>
    <div class="grid" id="grid"></div>
    <button class="btn" onclick="resetGame()">🔄 New Game</button>
    <div class="message" id="message">🎯 Find all matching pairs!</div>
</div>
<script>
const EMOJIS=['🚀','🛸','🌍','⭐','🌙','🪐','☄️','👾'];
let cards=[], flipped=[], matched=0, moves=0, lock=false;

function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}

function initGame(){
    const deck=shuffle([...EMOJIS,...EMOJIS]);
    cards=deck.map((emoji,index)=>({id:index,emoji,flipped:false,matched:false}));
    flipped=[];matched=0;moves=0;lock=false;
    document.getElementById('moves').textContent=0;
    document.getElementById('matches').textContent=0;
    document.getElementById('message').textContent='🎯 Find all matching pairs!';
    renderGrid();
}

function renderGrid(){
    const grid=document.getElementById('grid');
    grid.innerHTML='';
    cards.forEach((card,index)=>{
        const div=document.createElement('div');
        div.className='card'+(card.flipped?' flipped':'')+(card.matched?' matched':'');
        div.innerHTML='<span class="back">❓</span><span class="front">'+card.emoji+'</span>';
        div.addEventListener('click',()=>flipCard(index));
        grid.appendChild(div);
    });
}

function flipCard(index){
    if(lock)return;
    if(cards[index].flipped||cards[index].matched)return;
    cards[index].flipped=true;
    flipped.push(index);
    renderGrid();
    if(flipped.length===2){
        moves++;
        document.getElementById('moves').textContent=moves;
        lock=true;
        const [i1,i2]=flipped;
        if(cards[i1].emoji===cards[i2].emoji){
            cards[i1].matched=true;cards[i2].matched=true;
            matched++;
            document.getElementById('matches').textContent=matched;
            flipped=[];
            lock=false;
            renderGrid();
            if(matched===EMOJIS.length){
                document.getElementById('message').textContent='🎉 You won in '+moves+' moves!';
            }
        }else{
            setTimeout(()=>{
                cards[i1].flipped=false;cards[i2].flipped=false;
                flipped=[];lock=false;
                renderGrid();
            },800);
        }
    }
}

function resetGame(){initGame();}
initGame();
</script>
</body>
</html>
