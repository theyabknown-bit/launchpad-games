<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Tic Tac Toe Pro</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .game-container { text-align: center; }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 360px;
            margin: 20px auto;
            background: rgba(79,195,247,0.05);
            padding: 10px;
            border-radius: 16px;
        }
        .cell {
            aspect-ratio: 1/1;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(79,195,247,0.1);
            border-radius: 12px;
            font-size: 4rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            color: #4fc3f7;
            text-shadow: 0 0 20px rgba(79,195,247,0.2);
        }
        .cell:hover:not(.taken) { border-color: #4fc3f7; background: rgba(79,195,247,0.05); }
        .cell.taken { cursor: default; opacity: 0.8; }
        .cell.win { background: rgba(124,245,176,0.15); border-color: #7cf5b0; color: #7cf5b0; }
        .cell.lose { background: rgba(255,107,107,0.1); border-color: #ff6b6b; color: #ff6b6b; }
        .cell.draw { background: rgba(255,215,0,0.05); border-color: #ffd93d; color: #ffd93d; }
        .status {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 10px 0;
            min-height: 3rem;
        }
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .scoreboard span { color: #8899aa; }
        .scoreboard .wins { color: #7cf5b0; }
        .scoreboard .losses { color: #ff6b6b; }
        .scoreboard .draws { color: #ffd93d; }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .controls button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); }
        .controls button.active { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        .difficulty-selector { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
        .difficulty-selector button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; padding: 6px 16px; }
        .difficulty-selector button.active { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        .message { animation: pop 0.3s ease; }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; overflow: hidden; }
        .confetti-piece { position: absolute; width: 10px; height: 10px; background: #4fc3f7; border-radius: 2px; animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>
<div class="game-container">
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    <h1 class="game-title">🎮 Tic Tac Toe Pro</h1>

    <!-- Scoreboard -->
    <div class="scoreboard">
        <span>🏆 Wins: <span class="wins" id="wins">0</span></span>
        <span>💀 Losses: <span class="losses" id="losses">0</span></span>
        <span>🤝 Draws: <span class="draws" id="draws">0</span></span>
    </div>

    <!-- Difficulty -->
    <div class="difficulty-selector">
        <button data-diff="easy" class="active">Easy</button>
        <button data-diff="medium">Medium</button>
        <button data-diff="hard">Hard</button>
    </div>

    <!-- Status -->
    <div class="status" id="status">Your turn! (X)</div>

    <!-- Board -->
    <div class="board" id="board"></div>

    <!-- Controls -->
    <div class="controls">
        <button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button>
        <button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button>
    </div>

    <div id="confettiContainer" class="confetti" style="display:none;"></div>
</div>

<script>
// ============================================================
// TIC TAC TOE PRO – AI, Animations, Score, Sound
// ============================================================
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const winsEl = document.getElementById('wins');
const lossesEl = document.getElementById('losses');
const drawsEl = document.getElementById('draws');
const confettiContainer = document.getElementById('confettiContainer');

let board = Array(9).fill(null);
let currentPlayer = 'X'; // X always goes first
let gameOver = false;
let paused = false;
let difficulty = 'easy';
let scores = { wins: 0, losses: 0, draws: 0 };

// Load scores & difficulty
(function load() {
    try {
        const saved = JSON.parse(localStorage.getItem('tictactoe_scores') || '{"wins":0,"losses":0,"draws":0}');
        scores = saved;
        const diff = localStorage.getItem('tictactoe_difficulty') || 'easy';
        difficulty = diff;
    } catch(e) {}
    updateScoreUI();
    document.querySelectorAll('.difficulty-selector button').forEach(b => {
        b.classList.toggle('active', b.dataset.diff === difficulty);
    });
})();

function saveScores() {
    localStorage.setItem('tictactoe_scores', JSON.stringify(scores));
    localStorage.setItem('tictactoe_difficulty', difficulty);
}

function updateScoreUI() {
    winsEl.textContent = scores.wins;
    lossesEl.textContent = scores.losses;
    drawsEl.textContent = scores.draws;
}

// ---- Board Rendering ----
function renderBoard() {
    boardEl.innerHTML = '';
    board.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell' + (val ? ' taken' : '');
        cell.textContent = val || '';
        if (!val && !gameOver && !paused && currentPlayer === 'X') {
            cell.style.cursor = 'pointer';
            cell.onclick = () => humanMove(i);
        } else {
            cell.style.cursor = 'default';
        }
        if (val) {
            if (val === 'X') cell.style.color = '#4fc3f7';
            else cell.style.color = '#ff6b6b';
        }
        boardEl.appendChild(cell);
    });
    statusEl.textContent = gameOver ? statusEl.textContent : (paused ? '⏸️ Paused' : (currentPlayer === 'X' ? 'Your turn! (X)' : 'AI is thinking...'));
}

// ---- Human Move ----
function humanMove(index) {
    if (gameOver || paused || board[index] || currentPlayer !== 'X') return;
    makeMove(index, 'X');
    if (!gameOver && !checkWinner(board)) {
        currentPlayer = 'O';
        renderBoard();
        setTimeout(aiMove, 400);
    }
}

// ---- Make Move ----
function makeMove(index, player) {
    board[index] = player;
    renderBoard();
    const winner = checkWinner(board);
    if (winner) {
        gameOver = true;
        highlightWinningCells(winner);
        statusEl.textContent = winner === 'X' ? '🎉 You win!' : '💀 AI wins!';
        if (winner === 'X') { scores.wins++; saveScores(); updateScoreUI(); spawnConfetti(); }
        else if (winner === 'O') { scores.losses++; saveScores(); updateScoreUI(); }
        renderBoard();
        return;
    }
    if (board.every(c => c !== null)) {
        gameOver = true;
        statusEl.textContent = '🤝 Draw!';
        scores.draws++; saveScores(); updateScoreUI();
        renderBoard();
        return;
    }
}

// ---- Check Winner ----
function checkWinner(b) {
    const lines = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];
    for (let line of lines) {
        const [a,b,c] = line;
        if (b[a] && b[a] === b[b] && b[a] === b[c]) return b[a];
    }
    return null;
}

function highlightWinningCells(winner) {
    const lines = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];
    for (let line of lines) {
        const [a,b,c] = line;
        if (board[a] === winner && board[b] === winner && board[c] === winner) {
            boardEl.children[a].classList.add(winner === 'X' ? 'win' : 'lose');
            boardEl.children[b].classList.add(winner === 'X' ? 'win' : 'lose');
            boardEl.children[c].classList.add(winner === 'X' ? 'win' : 'lose');
            break;
        }
    }
}

// ---- AI Move (with difficulty) ----
function aiMove() {
    if (gameOver || paused || currentPlayer !== 'O') return;
    let index = -1;
    if (difficulty === 'easy') index = randomMove();
    else if (difficulty === 'medium') {
        // 70% smart, 30% random
        index = Math.random() < 0.7 ? getBestMove() : randomMove();
    } else { // hard
        index = getBestMove();
    }
    if (index === -1) { // fallback
        const empty = board.map((v,i) => v === null ? i : null).filter(v => v !== null);
        if (empty.length) index = empty[Math.floor(Math.random() * empty.length)];
    }
    if (index !== -1) {
        makeMove(index, 'O');
        if (!gameOver && !checkWinner(board)) {
            currentPlayer = 'X';
            renderBoard();
        }
    }
}

function randomMove() {
    const empty = board.map((v,i) => v === null ? i : null).filter(v => v !== null);
    return empty.length ? empty[Math.floor(Math.random() * empty.length)] : -1;
}

function getBestMove() {
    // Minimax for Tic Tac Toe
    function minimax(b, depth, isMaximizing) {
        const winner = checkWinner(b);
        if (winner === 'O') return 10 - depth;
        if (winner === 'X') return depth - 10;
        if (b.every(c => c !== null)) return 0;
        if (isMaximizing) {
            let best = -Infinity;
            for (let i=0; i<9; i++) {
                if (!b[i]) {
                    b[i] = 'O';
                    const val = minimax(b, depth+1, false);
                    b[i] = null;
                    best = Math.max(best, val);
                }
            }
            return best;
        } else {
            let best = Infinity;
            for (let i=0; i<9; i++) {
                if (!b[i]) {
                    b[i] = 'X';
                    const val = minimax(b, depth+1, true);
                    b[i] = null;
                    best = Math.min(best, val);
                }
            }
            return best;
        }
    }
    let bestScore = -Infinity;
    let bestMove = -1;
    for (let i=0; i<9; i++) {
        if (!board[i]) {
            board[i] = 'O';
            const score = minimax(board, 0, false);
            board[i] = null;
            if (score > bestScore) {
                bestScore = score;
                bestMove = i;
            }
        }
    }
    return bestMove;
}

// ---- Confetti ----
function spawnConfetti() {
    confettiContainer.style.display = 'block';
    const colors = ['#4fc3f7','#7cf5b0','#ffd93d','#ff6b6b','#a29bfe'];
    for (let i=0; i<60; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.width = (Math.random() * 8 + 4) + 'px';
        piece.style.height = (Math.random() * 8 + 4) + 'px';
        piece.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
        piece.style.animationDelay = (Math.random() * 0.5) + 's';
        confettiContainer.appendChild(piece);
    }
    setTimeout(() => {
        confettiContainer.innerHTML = '';
        confettiContainer.style.display = 'none';
    }, 3000);
}

// ---- Pause ----
function togglePause() {
    paused = !paused;
    document.getElementById('pauseLabel').textContent = paused ? 'Resume' : 'Pause';
    renderBoard();
}

// ---- Restart ----
function resetGame() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    paused = false;
    document.getElementById('pauseLabel').textContent = 'Pause';
    statusEl.textContent = 'Your turn! (X)';
    renderBoard();
}

// ---- Difficulty ----
document.querySelectorAll('.difficulty-selector button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.difficulty-selector button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        difficulty = this.dataset.diff;
        localStorage.setItem('tictactoe_difficulty', difficulty);
        resetGame();
    });
});

// ---- Sound (optional) ----
function playSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'click') { osc.frequency.value = 600; gain.gain.value = 0.05; osc.start(); osc.stop(ctx.currentTime + 0.08); }
        else if (type === 'win') { osc.frequency.value = 800; gain.gain.value = 0.1; osc.start(); setTimeout(() => { osc.frequency.value = 1000; }, 100); osc.stop(ctx.currentTime + 0.3); }
        else if (type === 'lose') { osc.frequency.value = 300; gain.gain.value = 0.08; osc.start(); setTimeout(() => { osc.frequency.value = 200; }, 100); osc.stop(ctx.currentTime + 0.4); }
    } catch(e) {}
}

// Override makeMove to add sounds
const origMakeMove = makeMove;
makeMove = function(index, player) {
    origMakeMove(index, player);
    if (!gameOver) playSound('click');
    else if (checkWinner(board) === 'X') playSound('win');
    else if (checkWinner(board) === 'O') playSound('lose');
};

// ---- Init ----
resetGame();
console.log('✅ Tic Tac Toe Pro loaded with AI, scores, sounds.');
</script>
</body>
</html>
