<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛏️ Asteroid Mining</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1a26; color: #d0e8f0; font-family: 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .back-btn { position: fixed; top: 20px; left: 20px; background: #1a3344; color: #4fc3f7; padding: 12px 20px; border: none; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; z-index: 100; }
        .back-btn:hover { background: #2a4a5e; transform: translateX(-5px); }
        .container { max-width: 500px; width: 100%; text-align: center; margin-top: 60px; }
        h1 { color: #4fc3f7; font-size: 2.5rem; margin-bottom: 10px; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 10px 20px; border-radius: 10px; min-width: 80px; border: 1px solid #2a4a5e; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.2rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.7rem; text-transform: uppercase; }
        .mining-area { font-size: 6rem; margin: 15px 0; display: block; }
        .btn { background: #4fc3f7; color: #0b1a26; border: none; padding: 12px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin: 5px; }
        .btn:hover { background: #7cf5b0; }
        .btn-mine { background: linear-gradient(135deg, #ffd93d, #ff9f43); color: #0b1a26; }
        .btn-mine:hover { background: linear-gradient(135deg, #ff9f43, #ff6b6b); }
        .message { font-size: 1.2rem; min-height: 30px; color: #ffd93d; margin: 10px 0; }
    </style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-pickaxe" style="color:#ffd93d;"></i> Asteroid Mining</h1>
    <div class="stats">
        <div class="stat-box"><span id="resources">0</span><span class="label">Resources</span></div>
        <div class="stat-box"><span id="mines">0</span><span class="label">Mines</span></div>
    </div>
    <span class="mining-area" id="miningEmoji">☄️</span>
    <div>
        <button class="btn btn-mine" id="mineBtn">⛏️ Mine!</button>
        <button class="btn" id="resetBtn">🔄 Reset</button>
    </div>
    <div class="message" id="message">☄️ Mine asteroids for resources!</div>
</div>
<script>
let resources = 0, mines = 0;

function mine() {
    const amount = Math.floor(Math.random() * 10) + 1;
    resources += amount;
    mines++;
    document.getElementById('message').textContent = '⛏️ Mined ' + amount + ' resources! Total: ' + resources;
    updateUI();
    if (resources >= 100) document.getElementById('message').textContent = '🌟 RICH ASTEROID!';
}

function resetGame() {
    resources = 0; mines = 0;
    document.getElementById('message').textContent = '🔄 Reset!';
    updateUI();
}

function updateUI() {
    document.getElementById('resources').textContent = resources;
    document.getElementById('mines').textContent = mines;
    const emojis = ['☄️', '🪨', '💎', '⭐'];
    const idx = Math.min(Math.floor(resources / 25), emojis.length - 1);
    document.getElementById('miningEmoji').textContent = emojis[idx];
}

document.getElementById('mineBtn').addEventListener('click', mine);
document.getElementById('resetBtn').addEventListener('click', resetGame);
updateUI();
</script>
</body>
</html>
