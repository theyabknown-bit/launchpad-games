<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Security-Policy" 
      content="default-src * 'self' data: 'unsafe-inline' 'unsafe-eval'; 
               script-src * 'self' 'unsafe-inline' 'unsafe-eval' data:; 'unsafe-eval'; 'unsafe-eval'; 
               style-src * 'self' 'unsafe-inline'; 
               img-src * 'self' data: https:; 
               connect-src * 'self' https:; 
               font-src * 'self' data:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎣 Fishing Sim</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a26;
            color: #d0e8f0;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 400px; width: 100%; text-align: center; }
        h1 { color: #4fc3f7; font-size: 2rem; margin-bottom: 10px; }
        .fish-pool {
            background: #1a3344;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #2a4a5e;
            margin: 15px 0;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .fish-pool .emoji { font-size: 4rem; }
        .fish-pool .status { font-size: 1.2rem; margin: 10px 0; color: #ffd93d; }
        .stats { display: flex; justify-content: space-around; margin: 10px 0; }
        .stat-box { background: #0f1f2e; padding: 8px 15px; border-radius: 10px; border: 1px solid #1a3344; }
        .stat-box span { color: #7cf5b0; font-weight: 700; font-size: 1.3rem; display: block; }
        .stat-box .label { font-size: 0.6rem; color: #8899aa; text-transform: uppercase; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #4fc3f7; color: #0b1a26; }
        .btn-success { background: #7cf5b0; color: #0b1a26; }
        .btn-warning { background: #ffd93d; color: #0b1a26; }
        .btn-danger { background: #ff6b6b; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #4fc3f7;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        .catch-log {
            background: #0f1f2e;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.8rem;
            color: #8899aa;
            text-align: left;
        }
        .catch-log .catch { color: #7cf5b0; }
        .catch-log .miss { color: #ff6b6b; }
    </style>
<script>
// Suppress unload violation warnings
(function() {
    var ow = console.warn;
    console.warn = function() {
        if (arguments.length && typeof arguments[0] === "string" && arguments[0].includes("unload is not allowed")) {
            return;
        }
        ow.apply(console, arguments);
    };
})();
</script>
</head>
<body>
<div class="container">
    <h1>🎣 Fishing Sim</h1>
    <div class="fish-pool" id="fishPool">
        <div class="emoji" id="fishEmoji">🐟</div>
        <div class="status" id="statusMsg">Cast your line!</div>
    </div>
    <div class="stats">
        <div class="stat-box"><span id="fishCount">0</span><span class="label">🐟 Caught</span></div>
        <div class="stat-box"><span id="money">0</span><span class="label">💰 Money</span></div>
        <div class="stat-box"><span id="castCount">0</span><span class="label">🎣 Casts</span></div>
    </div>
    <div>
        <button class="btn btn-primary" id="castBtn" onclick="castLine()">🎣 Cast Line</button>
        <button class="btn btn-warning" onclick="sellFish()">💰 Sell Fish (✦5 each)</button>
        <button class="btn btn-danger" onclick="resetGame()">🔄 Reset</button>
    </div>
    <div class="catch-log" id="catchLog">
        <div>🎣 Welcome! Start fishing!</div>
    </div>
    <a href="../base.html" class="back-link">← Back to Hub</a>
</div>

<script>
let fishCount = 0;
let money = 0;
let castCount = 0;
let isCasting = false;
let fishTypes = ['🐟', '🐠', '🐡', '🐙', '🦑', '🐚', '🦀', '🐋', '🐊', '🐬', '🐳', '🐠', '🐟'];
let fishNames = ['Tilapia', 'Salmon', 'Pufferfish', 'Octopus', 'Squid', 'Clam', 'Crab', 'Whale', 'Crocodile', 'Dolphin', 'Blue Whale', 'Goldfish'];

function loadGame() {
    try {
        const data = JSON.parse(localStorage.getItem('fishingGameData'));
        if (data) {
            fishCount = data.fishCount || 0;
            money = data.money || 0;
            castCount = data.castCount || 0;
            updateUI();
        }
    } catch(e) {}
}

function saveGame() {
    try {
        localStorage.setItem('fishingGameData', JSON.stringify({ fishCount, money, castCount }));
    } catch(e) {}
}

function updateUI() {
    document.getElementById('fishCount').textContent = fishCount;
    document.getElementById('money').textContent = money;
    document.getElementById('castCount').textContent = castCount;
}

function addLog(msg, type = 'normal') {
    const log = document.getElementById('catchLog');
    const div = document.createElement('div');
    div.className = type;
    div.textContent = msg;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    if (log.children.length > 20) log.removeChild(log.firstChild);
}

function castLine() {
    if (isCasting) return;
    const btn = document.getElementById('castBtn');
    btn.disabled = true;
    isCasting = true;
    castCount++;
    document.getElementById('statusMsg').textContent = '🎣 Casting...';
    document.getElementById('fishEmoji').textContent = '🎣';
    updateUI();
    saveGame();

    // Random delay (1-3 seconds)
    const delay = 1000 + Math.random() * 2000;
    setTimeout(() => {
        const caught = Math.random() < 0.6; // 60% catch rate
        if (caught) {
            const fishIndex = Math.floor(Math.random() * fishTypes.length);
            const emoji = fishTypes[fishIndex];
            const name = fishNames[fishIndex];
            fishCount++;
// Track achievement progress
try {
    const progress = JSON.parse(localStorage.getItem('fishing_progress') || '{}');
    progress.total = (progress.total || 0) + 1;
    localStorage.setItem('fishing_progress', JSON.stringify(progress));
    // Update Launchpad
    const lp = JSON.parse(localStorage.getItem('launchpad_progress') || '{}');
    if (!lp.games) lp.games = {};
    if (!lp.games['fishing']) lp.games['fishing'] = { played: true, xp: 0 };
    lp.games['fishing'].played = true;
    lp.games['fishing'].xp = (lp.games['fishing'].xp || 0) + 1;
    lp.totalXp = (lp.totalXp || 0) + 1;
    localStorage.setItem('launchpad_progress', JSON.stringify(lp));
    // Check achievements in parent window
    if (window.parent && window.parent.checkGameAchievement) {
        window.parent.checkGameAchievement('fishing', { total: progress.total });
    }
} catch(e) {}
            money += 5; // each fish worth 5
            document.getElementById('fishEmoji').textContent = emoji;
            document.getElementById('statusMsg').textContent = `🎣 Caught a ${name}! ${emoji}`;
            addLog(`✅ Caught ${name} ${emoji} (✦5)`, 'catch');
        } else {
            document.getElementById('fishEmoji').textContent = '💨';
            document.getElementById('statusMsg').textContent = '😤 Nothing bit! Try again.';
            addLog('❌ Missed!', 'miss');
        }
        isCasting = false;
        btn.disabled = false;
        updateUI();
        saveGame();
        // Update stats in Launchpad progress
        try {
            const progress = JSON.parse(localStorage.getItem('launchpad_progress') || '{}');
            if (!progress.games) progress.games = {};
            if (!progress.games['fishing']) progress.games['fishing'] = { played: false, xp: 0 };
            progress.games['fishing'].played = true;
            progress.games['fishing'].xp = (progress.games['fishing'].xp || 0) + 1;
            localStorage.setItem('launchpad_progress', JSON.stringify(progress));
        } catch(e) {}
    }, delay);
}

function sellFish() {
    if (fishCount === 0) {
        addLog('❌ No fish to sell!', 'miss');
        return;
    }
    const earnings = fishCount * 5;
    money += earnings;
    addLog(`💰 Sold ${fishCount} fish for ✦${earnings}!`, 'catch');
    fishCount = 0;
    updateUI();
    saveGame();
}

function resetGame() {
    if (!confirm('Reset all fishing progress?')) return;
    fishCount = 0;
    money = 0;
    castCount = 0;
    document.getElementById('fishEmoji').textContent = '🐟';
    document.getElementById('statusMsg').textContent = 'Cast your line!';
    document.getElementById('catchLog').innerHTML = '<div>🔄 Reset!</div>';
    updateUI();
    saveGame();
}

loadGame();
updateUI();
document.getElementById('statusMsg').textContent = '🎣 Ready to fish!';
console.log('🎣 Fishing Sim loaded!');
</script>
<script>
// Modern page lifecycle handling
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
        // Pause or save state
        console.log('Page hidden – auto-save triggered');
    }
});
window.addEventListener('beforeunload', function(e) {
    // Final cleanup before unload
    console.log('Page unloading – saving state');
});
</script>
</body>
</html>
