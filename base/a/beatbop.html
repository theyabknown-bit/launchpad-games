<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat Bop · Rhythm Game</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e121a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(18,28,40,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid rgba(100,200,255,0.12);
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; }
    h1 i { color: #f57c9f; margin-right: 10px; }
    .back { display: inline-block; margin-bottom: 1.2rem; color: #b0d4f0; text-decoration: none; background: #1a3045; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #2a5a7a; font-size: 0.9rem; }
    .back:hover { background: #2a4a6a; }
    .beat-area {
      background: #0f172a;
      border-radius: 1.5rem;
      padding: 1.5rem;
      margin: 1.2rem 0;
      border: 2px solid #1e3347;
      position: relative;
      min-height: 300px;
    }
    .lane { display: flex; justify-content: center; gap: 2rem; margin: 1rem 0; }
    .key-btn {
      width: 80px; height: 80px; border-radius: 50%; border: 3px solid #2a4a5a;
      background: #0a121a; color: white; font-size: 2rem; font-weight: 700;
      cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center;
    }
    .key-btn:hover { background: #1a3a5a; border-color: #4a8aaa; }
    .key-btn.active { background: #4a8aaa; border-color: #7fc9ff; transform: scale(0.95); box-shadow: 0 0 30px rgba(127,201,255,0.3); }
    .key-btn.hit { border-color: #7cf5b0; background: #1a4a3a; }
    .key-btn.miss { border-color: #ff7a7a; background: #4a1a1a; }
    .beat-display { color: #f5c87c; font-size: 1.2rem; font-weight: 600; margin: 0.5rem 0; }
    .combo { color: #7fc9ff; font-size: 1.1rem; }
    .stats { display: flex; justify-content: space-between; color: #9bbfd9; margin-top: 1rem; flex-wrap: wrap; gap: 0.8rem; }
    .stats span i { margin-right: 6px; }
    .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.6rem 1.5rem; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .btn:hover { background: #2a5a7a; }
    .message { margin-top: 0.8rem; padding: 0.7rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
    .message i { margin-right: 8px; }
    @media (max-width: 500px) { .key-btn { width: 60px; height: 60px; font-size: 1.5rem; } .lane { gap: 1rem; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-music"></i> Beat Bop</h1>
  <div class="beat-area">
    <div class="beat-display" id="beatDisplay">🎵 Press a key!</div>
    <div class="lane" id="laneContainer">
      <button class="key-btn" data-key="A">A</button>
      <button class="key-btn" data-key="S">S</button>
      <button class="key-btn" data-key="D">D</button>
      <button class="key-btn" data-key="F">F</button>
    </div>
    <div class="combo">🔥 Combo: <span id="comboDisplay">0</span></div>
  </div>
  <div class="stats">
    <span><i class="fas fa-star"></i> score: <span id="scoreDisplay">0</span></span>
    <span><i class="fas fa-check-circle"></i> hits: <span id="hitDisplay">0</span></span>
    <span><i class="fas fa-times-circle"></i> misses: <span id="missDisplay">0</span></span>
  </div>
  <button class="btn" id="resetBtn"><i class="fas fa-rotate"></i> restart</button>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> press A S D F in rhythm</div>
</div>
<script>
  const KEYS = ['A','S','D','F']; let score=0, combo=0, hits=0, misses=0, gameActive=true, sequence=[], currentIndex=0, isWaiting=false;
  const scoreDisplay=document.getElementById('scoreDisplay'), hitDisplay=document.getElementById('hitDisplay'), missDisplay=document.getElementById('missDisplay'), comboDisplay=document.getElementById('comboDisplay'), beatDisplay=document.getElementById('beatDisplay'), messageBox=document.getElementById('messageBox');
  const keyBtns = document.querySelectorAll('.key-btn');
  function generateSequence() {
    const len = 4 + Math.floor(Math.random() * 3);
    sequence = []; for(let i=0;i<len;i++) sequence.push(KEYS[Math.floor(Math.random()*KEYS.length)]);
    currentIndex=0; isWaiting=false;
    showSequence();
  }
  function showSequence() {
    beatDisplay.textContent = `🎵 Watch! ${sequence.length} notes`;
    let i=0;
    const interval = setInterval(() => {
      if(i>=sequence.length) { clearInterval(interval); beatDisplay.textContent='🎵 Your turn!'; isWaiting=true; return; }
      const btn = document.querySelector(`.key-btn[data-key="${sequence[i]}"]`);
      btn.classList.add('active');
      setTimeout(() => btn.classList.remove('active'), 300);
      i++;
    }, 500);
  }
  function handleKeyPress(key) {
    if(!gameActive || !isWaiting) return;
    const btn = document.querySelector(`.key-btn[data-key="${key}"]`);
    if(key === sequence[currentIndex]) {
      btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 200);
      combo++; hits++; score += 10 + combo * 2;
      beatDisplay.textContent = `✅ ${key} correct!`;
      currentIndex++;
      if(currentIndex >= sequence.length) {
        beatDisplay.textContent = `🎉 Perfect! +${10+combo*2} pts`;
        combo = 0;
        setTimeout(() => { if(gameActive) generateSequence(); }, 600);
      }
    } else {
      btn.classList.add('miss'); setTimeout(() => btn.classList.remove('miss'), 200);
      combo = 0; misses++;
      beatDisplay.textContent = `❌ wrong! was ${sequence[currentIndex]}`;
      setTimeout(() => { if(gameActive) { currentIndex=0; showSequence(); } }, 800);
    }
    updateUI();
  }
  function updateUI() { scoreDisplay.textContent=score; hitDisplay.textContent=hits; missDisplay.textContent=misses; comboDisplay.textContent=combo; }
  function resetGame() { score=0; combo=0; hits=0; misses=0; gameActive=true; updateUI(); generateSequence(); messageBox.innerHTML='<i class="fas fa-play"></i> new round!'; }
  keyBtns.forEach(btn => btn.addEventListener('click', () => handleKeyPress(btn.dataset.key)));
  document.addEventListener('keydown', (e) => { const k=e.key.toUpperCase(); if(KEYS.includes(k)) { e.preventDefault(); handleKeyPress(k); } });
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  generateSequence();
</script>
</body>
</html>
