<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 Galactic Delivery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{{margin:0;padding:0;box-sizing:border-box;}}
body{{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}}
.back-btn{{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}}
.back-btn:hover{{background:#2a4a5e;transform:translateX(-5px);}}
.container{{max-width:500px;width:100%;text-align:center;}}
h1{{color:#4fc3f7;margin-bottom:10px;}}
.stats{{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}}
.stat-box{{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}}
.stat-box span{{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}}
.stat-box .label{{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}}
.btn{{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}}
.btn:hover{{background:#7cf5b0;}}
.message{{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}}
.game-area{{background:#0f1f2e;border-radius:12px;padding:30px;margin:15px 0;border:2px solid #1a3344;min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;}}
.big-emoji{{font-size:5rem;}}
.click-btn{{background:#ff9f43;color:#0b1a26;border:none;padding:15px 40px;border-radius:30px;font-size:1.2rem;font-weight:700;cursor:pointer;transition:0.2s;}}
.click-btn:hover{{transform:scale(1.05);}}
.click-btn:active{{transform:scale(0.95);}}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fa-shipping-fast" style="color:#ff9f43;"></i> Galactic Delivery</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="clicks">0</span><span class="label">Clicks</span></div>
    </div>
    <div class="game-area">
        <div class="big-emoji">📦</div>
        <button class="click-btn" id="clickBtn">Click Me! ✨</button>
    </div>
    <div class="message" id="message">🎯 Click to explore!</div>
    <button class="btn" onclick="resetGame()">🔄 Reset</button>
</div>
<script>
let score=0,clicks=0;
function updateUI(){{document.getElementById('score').textContent=score;document.getElementById('clicks').textContent=clicks;}}
document.getElementById('clickBtn').addEventListener('click',function(){{
    clicks++;score+=Math.floor(Math.random()*5)+1;
    document.getElementById('message').textContent='✨ +'+score+' points!';
    updateUI();
    this.style.transform='scale(0.9)';
    setTimeout(()=>this.style.transform='',100);
}});
function resetGame(){{score=0;clicks=0;updateUI();document.getElementById('message').textContent='🔄 Reset! Start again!';}}
updateUI();
</script>
</body>
</html>
