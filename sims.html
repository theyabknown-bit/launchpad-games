<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sims Mini</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1a26; font-family: 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .game-box { background: rgba(18,28,40,0.95); border-radius: 2.5rem; padding: 2rem; border: 1px solid rgba(100,200,255,0.12); max-width: 600px; width: 100%; text-align: center; }
        .back { display: inline-block; margin-bottom: 1rem; color: #b6ddf5; text-decoration: none; background: #1c4055; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #3a6b88; }
        .back:hover { background: #2a5a78; }
        h1 { color: white; font-size: 2rem; margin-bottom: 0.5rem; }
        h1 i { color: #7cf5b0; }
        .sim-character { font-size: 4rem; margin: 0.5rem 0; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin: 1rem 0; }
        .stat-box { background: rgba(0,0,0,0.3); border-radius: 0.8rem; padding: 0.5rem; text-align: center; }
        .stat-box .val { color: white; font-size: 1.2rem; font-weight: 700; }
        .stat-box .label { color: #7f9fb9; font-size: 0.6rem; text-transform: uppercase; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 1rem 0; }
        .actions .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.6rem; border-radius: 1rem; color: white; cursor: pointer; transition: 0.15s; font-size: 0.9rem; touch-action: manipulation; }
        .actions .btn:hover { background: #2a5a7a; }
        .actions .btn:active { transform: scale(0.95); }
        .actions .btn.work { background: #1a4a3a; border-color: #2a6a4a; }
        .actions .btn.work:hover { background: #2a6a4a; }
        .actions .btn.eat { background: #4a3a1a; border-color: #6a5a2a; }
        .actions .btn.eat:hover { background: #6a5a2a; }
        .actions .btn.sleep { background: #1a2a4a; border-color: #2a4a6a; }
        .actions .btn.sleep:hover { background: #2a4a6a; }
        .actions .btn.play { background: #4a1a2a; border-color: #6a2a4a; }
        .actions .btn.play:hover { background: #6a2a4a; }
        .message { margin-top: 0.5rem; padding: 0.6rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
        .level-up { background: linear-gradient(135deg, #1a4a3a, #2a6a4a); border: 2px solid #7cf5b0; border-radius: 1rem; padding: 0.8rem; color: white; margin: 0.5rem 0; display: none; }
        .level-up.show { display: block; }
        @media (max-width: 500px) { .stats { grid-template-columns: 1fr 1fr 1fr; } .actions { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
<div class="game-box">
    <a href="base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
    <h1><i class="fas fa-user"></i> Sims Mini</h1>
    <div class="sim-character" id="characterEmoji">😊</div>
    <div class="stats">
        <div class="stat-box"><div class="val" id="energy">100</div><div class="label">Energy</div></div>
        <div class="stat-box"><div class="val" id="hunger">100</div><div class="label">Hunger</div></div>
        <div class="stat-box"><div class="val" id="happiness">100</div><div class="label">Happiness</div></div>
    </div>
    <div class="stats">
        <div class="stat-box"><div class="val" id="levelDisplay">1</div><div class="label">Level</div></div>
        <div class="stat-box"><div class="val" id="xpDisplay">0</div><div class="label">XP</div></div>
        <div class="stat-box"><div class="val" id="coinsDisplay">0</div><div class="label">Coins</div></div>
    </div>
    <div class="level-up" id="levelUpBox"><i class="fas fa-arrow-up"></i> <span id="levelUpText">LEVEL UP!</span></div>
    <div class="actions">
        <button class="btn work" onclick="doAction('work')"><i class="fas fa-briefcase"></i> Work</button>
        <button class="btn eat" onclick="doAction('eat')"><i class="fas fa-utensils"></i> Eat</button>
        <button class="btn sleep" onclick="doAction('sleep')"><i class="fas fa-bed"></i> Sleep</button>
        <button class="btn play" onclick="doAction('play')"><i class="fas fa-gamepad"></i> Play</button>
    </div>
    <div class="message" id="msg"><i class="fas fa-info-circle"></i> Take care of your sim!</div>
</div>
<script>
let energy = 100, hunger = 100, happiness = 100, level = 1, xp = 0, coins = 0, xpToNext = 20;
const msg = document.getElementById('msg');
const energyDisplay = document.getElementById('energy');
const hungerDisplay = document.getElementById('hunger');
const happinessDisplay = document.getElementById('happiness');
const levelDisplay = document.getElementById('levelDisplay');
const xpDisplay = document.getElementById('xpDisplay');
const coinsDisplay = document.getElementById('coinsDisplay');
const levelUpBox = document.getElementById('levelUpBox');
const levelUpText = document.getElementById('levelUpText');
const emojiDisplay = document.getElementById('characterEmoji');

function updateUI() {
    energy = Math.max(0, Math.min(100, energy));
    hunger = Math.max(0, Math.min(100, hunger));
    happiness = Math.max(0, Math.min(100, happiness));
    energyDisplay.textContent = Math.round(energy);
    hungerDisplay.textContent = Math.round(hunger);
    happinessDisplay.textContent = Math.round(happiness);
    levelDisplay.textContent = level;
    xpDisplay.textContent = xp;
    coinsDisplay.textContent = coins;
    
    if (energy < 30) emojiDisplay.textContent = '😴';
    else if (hunger < 30) emojiDisplay.textContent = '😫';
    else if (happiness < 30) emojiDisplay.textContent = '😢';
    else if (energy > 80 && hunger > 80 && happiness > 80) emojiDisplay.textContent = '😊';
    else emojiDisplay.textContent = '🙂';
}

function addXP(amount) {
    xp += amount;
    while (xp >= xpToNext) {
        xp -= xpToNext;
        level++;
        xpToNext = Math.floor(xpToNext * 1.3) + 10;
        levelUpBox.classList.add('show');
        levelUpText.textContent = 'LEVEL ' + level + '! +' + (level * 2) + ' coins bonus!';
        coins += level * 2;
        setTimeout(() => levelUpBox.classList.remove('show'), 2500);
        updateUI();
    }
    updateUI();
}

function doAction(action) {
    if (energy <= 0 || hunger <= 0 || happiness <= 0) {
        msg.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#ff7a7a;"></i> Your sim is too weak! Restore their stats first!';
        return;
    }
    
    let xpGain = 0, coinGain = 0;
    let msgText = '';
    
    switch(action) {
        case 'work':
            energy -= 20;
            hunger -= 15;
            happiness -= 10;
            coinGain = 10 + Math.floor(level * 2);
            xpGain = 5 + level;
            msgText = 'Worked hard! Earned ' + coinGain + ' coins and ' + xpGain + ' XP!';
            break;
        case 'eat':
            energy -= 5;
            hunger = Math.min(100, hunger + 25);
            happiness += 5;
            xpGain = 2 + Math.floor(level / 2);
            msgText = 'Ate a meal! Hunger restored! +' + xpGain + ' XP';
            break;
        case 'sleep':
            energy = Math.min(100, energy + 30);
            hunger -= 5;
            happiness += 5;
            xpGain = 2 + Math.floor(level / 2);
            msgText = 'Slept well! Energy restored! +' + xpGain + ' XP';
            break;
        case 'play':
            energy -= 10;
            hunger -= 5;
            happiness = Math.min(100, happiness + 20);
            coinGain = 2 + Math.floor(level / 3);
            xpGain = 3 + level;
            msgText = 'Played games! Happiness +' + coinGain + ' coins, +' + xpGain + ' XP!';
            break;
    }
    
    coins += coinGain || 0;
    addXP(xpGain || 0);
    msg.innerHTML = '<i class="fas fa-check-circle" style="color:#7cf5b0;"></i> ' + msgText;
    updateUI();
    
    if (energy <= 0 || hunger <= 0 || happiness <= 0) {
        msg.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#ff7a7a;"></i> Your sim is exhausted! Take care of them!';
    }
}

setInterval(() => {
    if (energy > 0) energy -= 0.5;
    if (hunger > 0) hunger -= 0.5;
    if (happiness > 0) happiness -= 0.3;
    updateUI();
}, 3000);

updateUI();
</script>
</body>
</html>
