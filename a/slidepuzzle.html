<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 Slide Puzzle</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:400px;margin:15px auto;}
.tile{aspect-ratio:1;background:#1a3344;border-radius:8px;border:2px solid #2a4a5e;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;cursor:pointer;transition:0.15s;touch-action:manipulation;}
.tile:hover{background:#2a4a5e;border-color:#4fc3f7;}
.tile.empty{background:transparent;border-color:transparent;cursor:default;}
.tile.empty:hover{background:transparent;border-color:transparent;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-puzzle-piece" style="color:#4fc3f7;"></i> Slide Puzzle</h1>
    <div class="stats">
        <div class="stat-box"><span id="moves">0</span><span class="label">Moves</span></div>
    </div>
    <div class="grid" id="grid"></div>
    <button class="btn" id="shuffleBtn">🔀 Shuffle</button>
    <div class="message" id="message">🎯 Slide the tiles to order them!</div>
</div>
<script>
let tiles=[], moves=0, emptyIndex=15, gridSize=4;

function initGrid(){
    tiles=Array.from({length:16},(_,i)=>i);
    emptyIndex=15;
    moves=0;
    document.getElementById('moves').textContent=0;
    renderGrid();
}

function renderGrid(){
    const grid=document.getElementById('grid');
    grid.innerHTML='';
    tiles.forEach((tile,index)=>{
        const div=document.createElement('div');
        div.className='tile'+(tile===0?' empty':'');
        div.textContent=tile===0?'':tile;
        div.addEventListener('click',()=>moveTile(index));
        grid.appendChild(div);
    });
}

function moveTile(index){
    const row=Math.floor(index/gridSize),col=index%gridSize;
    const emptyRow=Math.floor(emptyIndex/gridSize),emptyCol=emptyIndex%gridSize;
    if(Math.abs(row-emptyRow)+Math.abs(col-emptyCol)!==1)return;
    tiles[emptyIndex]=tiles[index];
    tiles[index]=0;
    emptyIndex=index;
    moves++;
    document.getElementById('moves').textContent=moves;
    renderGrid();
    checkWin();
}

function checkWin(){
    for(let i=0;i<15;i++){if(tiles[i]!==i+1)return;}
    document.getElementById('message').textContent='🎉 You won in '+moves+' moves!';
}

function shuffle(){
    for(let i=0;i<100;i++){
        const neighbors=[];
        const row=Math.floor(emptyIndex/gridSize),col=emptyIndex%gridSize;
        if(row>0)neighbors.push(emptyIndex-gridSize);
        if(row<gridSize-1)neighbors.push(emptyIndex+gridSize);
        if(col>0)neighbors.push(emptyIndex-1);
        if(col<gridSize-1)neighbors.push(emptyIndex+1);
        const random=neighbors[Math.floor(Math.random()*neighbors.length)];
        tiles[emptyIndex]=tiles[random];
        tiles[random]=0;
        emptyIndex=random;
    }
    moves=0;
    document.getElementById('moves').textContent=0;
    document.getElementById('message').textContent='🔀 Shuffled! Try to solve it!';
    renderGrid();
}

document.getElementById('shuffleBtn').addEventListener('click',shuffle);
initGrid();
</script>
</body>
</html>
