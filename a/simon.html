<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 Simon Says</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a26;
            color: #d0e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1a3344;
            color: #4fc3f7;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        .back-btn:hover {
            background: #2a4a5e;
            transform: translateX(-5px);
            box-shadow: 0 4px 15px rgba(79, 195, 247, 0.3);
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin-top: 60px;
            text-align: center;
        }

        h1 {
            color: #4fc3f7;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(79, 195, 247, 0.3);
        }
        .subtitle {
            color: #7cf5b0;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: #1a3344;
            padding: 10px 20px;
            border-radius: 10px;
            min-width: 80px;
        }
        .stat-box span {
            color: #4fc3f7;
            font-weight: bold;
            font-size: 1.2rem;
            display: block;
        }
        .stat-box .label {
            color: #8899aa;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .simon-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background: #0f1f2e;
            border-radius: 20px;
            border: 2px solid #1a3344;
        }

        .simon-btn {
            aspect-ratio: 1;
            border-radius: 20px;
            border: 3px solid #1a3344;
            cursor: pointer;
            transition: all 0.1s ease;
            position: relative;
            min-height: 120px;
            touch-action: manipulation;
        }

        .simon-btn:active {
            transform: scale(0.92);
        }

        .simon-btn .btn-label {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .simon-btn.red {
            background: #c0392b;
            box-shadow: 0 8px 0 #78281f;
        }
        .simon-btn.red.active {
            background: #ff6b6b;
            box-shadow: 0 0 30px rgba(255,107,107,0.6);
            transform: scale(0.95);
        }
        .simon-btn.red.lit {
            background: #ff6b6b;
            box-shadow: 0 0 50px rgba(255,107,107,0.8);
        }

        .simon-btn.blue {
            background: #2980b9;
            box-shadow: 0 8px 0 #1a5276;
        }
        .simon-btn.blue.active {
            background: #4fc3f7;
            box-shadow: 0 0 30px rgba(79,195,247,0.6);
            transform: scale(0.95);
        }
        .simon-btn.blue.lit {
            background: #4fc3f7;
            box-shadow: 0 0 50px rgba(79,195,247,0.8);
        }

        .simon-btn.green {
            background: #27ae60;
            box-shadow: 0 8px 0 #1a6a3a;
        }
        .simon-btn.green.active {
            background: #7cf5b0;
            box-shadow: 0 0 30px rgba(124,245,176,0.6);
            transform: scale(0.95);
        }
        .simon-btn.green.lit {
            background: #7cf5b0;
            box-shadow: 0 0 50px rgba(124,245,176,0.8);
        }

        .simon-btn.yellow {
            background: #f39c12;
            box-shadow: 0 8px 0 #b86d0e;
        }
        .simon-btn.yellow.active {
            background: #ffd93d;
            box-shadow: 0 0 30px rgba(255,217,61,0.6);
            transform: scale(0.95);
        }
        .simon-btn.yellow.lit {
            background: #ffd93d;
            box-shadow: 0 0 50px rgba(255,217,61,0.8);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .btn {
            background: #1a3344;
            color: #d0e8f0;
            border: 2px solid #2a4a5e;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #2a4a5e;
            border-color: #4fc3f7;
            transform: translateY(-2px);
        }
        .btn-primary {
            background: #4fc3f7;
            color: #0b1a26;
            border-color: #4fc3f7;
        }
        .btn-primary:hover {
            background: #7cf5b0;
            border-color: #7cf5b0;
        }
        .btn-danger {
            background: #ff6b6b;
            color: #0b1a26;
            border-color: #ff6b6b;
        }
        .btn-danger:hover {
            background: #ff4444;
            border-color: #ff4444;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .message {
            font-size: 1.3rem;
            min-height: 40px;
            color: #ffd93d;
            font-weight: 600;
            margin: 10px 0;
        }

        .difficulty {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 10px 0;
        }
        .difficulty .btn {
            font-size: 0.8rem;
            padding: 8px 18px;
        }
        .difficulty .btn.active {
            background: #4fc3f7;
            color: #0b1a26;
            border-color: #4fc3f7;
        }

        @media (max-width: 480px) {
            .simon-btn { min-height: 80px; }
            h1 { font-size: 2rem; }
            .stats { gap: 15px; }
            .stat-box { padding: 8px 15px; min-width: 60px; }
            .simon-btn .btn-label { font-size: 0.5rem; bottom: 5px; }
            .back-btn { font-size: 12px; padding: 8px 14px; top: 10px; left: 10px; }
        }
    </style>
</head>
<body>

    <a href="../base.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <div class="container">
        <h1><i class="fas fa-lightbulb" style="color: #ffd93d;"></i> Simon Says</h1>
        <p class="subtitle">Repeat the pattern!</p>

        <div class="stats">
            <div class="stat-box">
                <span id="score">0</span>
                <span class="label">Score</span>
            </div>
            <div class="stat-box">
                <span id="highScore">0</span>
                <span class="label">Best</span>
            </div>
            <div class="stat-box">
                <span id="level">1</span>
                <span class="label">Level</span>
            </div>
        </div>

        <div class="message" id="message">🎯 Watch the pattern!</div>

        <div class="difficulty">
            <button class="btn active" data-speed="1000" onclick="setDifficulty(1000, this)">🐢 Easy</button>
            <button class="btn" data-speed="700" onclick="setDifficulty(700, this)">⚡ Medium</button>
            <button class="btn" data-speed="400" onclick="setDifficulty(400, this)">🔥 Hard</button>
        </div>

        <div class="simon-board" id="board">
            <div class="simon-btn red" data-color="red" onclick="handleClick('red')">
                <span class="btn-label">Red</span>
            </div>
            <div class="simon-btn blue" data-color="blue" onclick="handleClick('blue')">
                <span class="btn-label">Blue</span>
            </div>
            <div class="simon-btn green" data-color="green" onclick="handleClick('green')">
                <span class="btn-label">Green</span>
            </div>
            <div class="simon-btn yellow" data-color="yellow" onclick="handleClick('yellow')">
                <span class="btn-label">Yellow</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn" onclick="startGame()">
                <i class="fas fa-play"></i> Start
            </button>
            <button class="btn btn-danger" onclick="resetGame()">
                <i class="fas fa-redo"></i> Reset
            </button>
        </div>
    </div>

    <script>
    // Game-specific save function - override this in your game
    function saveGame() {
        // For games with their own save system, this will be overridden
        // For games without, it does nothing
        console.log('💾 Save called but no game-specific save implemented');
        return true;
    }
    // ============================================================
    // FIXED SOUND SYSTEM - WORKS ON FIRST CLICK
    // ============================================================
    let soundEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;

    function unlockAudio() {
        if (audioUnlocked) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioUnlocked = true;
            console.log('🔊 Audio unlocked!');
        } catch(e) { console.log('Audio error:', e); }
    }

    // Unlock audio on any click
    document.addEventListener('click', unlockAudio, { once: false });
    document.addEventListener('touchstart', unlockAudio, { once: false });
    document.addEventListener('keydown', unlockAudio, { once: false });

    function getAudioCtx() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playTone(frequency, duration = 150, type = 'sine') {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration / 1000);
        } catch(e) { console.log('Play error:', e); }
    }

    function playClick() { playTone(600, 80); }
    function playWin() { 
        playTone(523, 150); 
        setTimeout(() => playTone(659, 150), 150); 
        setTimeout(() => playTone(784, 200), 300); 
    }
    function playLose() { 
        playTone(300, 200); 
        setTimeout(() => playTone(200, 300), 200); 
    }
    function playCorrect() { playTone(800, 100); }
    function playWrong() { playTone(250, 200); }
    function playLevelUp() { 
        playTone(440, 100); 
        setTimeout(() => playTone(523, 100), 100); 
        setTimeout(() => playTone(659, 150), 200); 
    }
        // ============================================
        // SAVE SYSTEM (Universal)
        // ============================================
        function loadGameState(gameId) {
            try {
                var save = JSON.parse(localStorage.getItem('launchpad_progress') || '{}');
                if (save.gameStates && save.gameStates[gameId]) {
                    return save.gameStates[gameId].data;
                }
            } catch(e) { return null; }
            return null;
        }

        function saveGameState(gameId, stateData) {
            try {
                var save = JSON.parse(localStorage.getItem('launchpad_progress') || '{}');
                if (!save.gameStates) save.gameStates = {};
                save.gameStates[gameId] = { data: stateData, timestamp: new Date().toISOString() };
                localStorage.setItem('launchpad_progress', JSON.stringify(save));
                return true;
            } catch(e) { return false; }
        }

        function updateGameProgress(gameId) {
            try {
                var save = JSON.parse(localStorage.getItem('launchpad_progress') || '{}');
                if (!save.games) save.games = {};
                if (!save.games[gameId]) save.games[gameId] = { played: false, xp: 0 };
                var game = save.games[gameId];
                if (!game.played) { game.played = true; save.gamesPlayed = (save.gamesPlayed || 0) + 1; }
                game.xp = (game.xp || 0) + 1;
                var totalXp = 0, gamesPlayed = 0;
                Object.values(save.games).forEach(function(g) { totalXp += (g.xp || 0); if (g.played) gamesPlayed++; });
                save.totalXp = totalXp;
                save.gamesPlayed = gamesPlayed;
                localStorage.setItem('launchpad_progress', JSON.stringify(save));
            } catch(e) {}
        }

        // ============================================
        // SIMON SAYS GAME
        // ============================================
        const GAME_ID = 'simon';
        const COLORS = ['red', 'blue', 'green', 'yellow'];

        let sequence = [];
        let playerSequence = [];
        let isPlaying = false;
        let isPlayerTurn = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('simonHighScore')) || 0;
        let level = 1;
        let speed = 1000;
        let gameStarted = false;

        // Sound effects using Web Audio API
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
            return audioCtx;
        }

        function playTone(frequency, duration = 0.15) {
            try {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(frequency, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        const colorSounds = {
            red: 220,
            blue: 330,
            green: 440,
            yellow: 550
        };

        function playColorSound(color) {
            playTone(colorSounds[color] || 440);
        }

        function getColorElement(color) {
            return document.querySelector(`.simon-btn[data-color="${color}"]`);
        }

        function lightColor(color, duration = 300) {
            const el = getColorElement(color);
            if (!el) return;
            el.classList.add('lit');
            playColorSound(color);
            setTimeout(() => el.classList.remove('lit'), duration);
        }

        function flashColor(color) {
            return new Promise(resolve => {
                lightColor(color, 400);
                setTimeout(resolve, 400);
            });
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('level').textContent = level;
        }

        function setMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.color = isError ? '#ff6b6b' : '#ffd93d';
        }

        function setDifficulty(newSpeed, btn) {
            if (isPlaying) return;
            speed = newSpeed;
            document.querySelectorAll('.difficulty .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            setMessage('🎯 Difficulty: ' + btn.textContent.trim());
        }

        function startGame() {
            if (isPlaying) return;
            gameStarted = true;
            updateGameProgress(GAME_ID);
            sequence = [];
            playerSequence = [];
            score = 0;
            level = 1;
            isPlaying = true;
            isPlayerTurn = false;
            document.getElementById('startBtn').disabled = true;
            setMessage('🎯 Watch the pattern!');
            updateUI();
            setTimeout(showSequence, 500);
        }

        function showSequence() {
            const newColor = COLORS[Math.floor(Math.random() * COLORS.length)];
            sequence.push(newColor);
            playerSequence = [];
            isPlayerTurn = false;
            setMessage('👀 Watch...');

            let i = 0;
            function showNext() {
                if (i >= sequence.length) {
                    isPlayerTurn = true;
                    setMessage('🎯 Your turn!');
                    document.getElementById('startBtn').disabled = false;
                    return;
                }
                flashColor(sequence[i]).then(() => {
                    i++;
                    setTimeout(showNext, speed * 0.3);
                });
            }
            setTimeout(showNext, 400);
        }

        function handleClick(color) {
            if (!isPlayerTurn || !isPlaying) return;

            playerSequence.push(color);
            lightColor(color, 200);

            const index = playerSequence.length - 1;
            if (playerSequence[index] !== sequence[index]) {
                // Wrong!
                setMessage('❌ Wrong! Game Over!', true);
                isPlaying = false;
                isPlayerTurn = false;
                document.getElementById('startBtn').disabled = false;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('simonHighScore', highScore);
                    setMessage('🎉 New High Score: ' + highScore + '!', false);
                    updateUI();
                }
                // Save game state
                saveGameState(GAME_ID, { score: score, highScore: highScore, level: level });
                return;
            }

            if (playerSequence.length === sequence.length) {
                // Correct! Level up!
                score += sequence.length * 10;
                level++;
                setMessage('✅ Correct! Level ' + level + '!', false);
                updateUI();
                isPlayerTurn = false;
                document.getElementById('startBtn').disabled = true;
                setTimeout(() => {
                    showSequence();
                }, 800);
            }

            // Auto-save progress
            saveGameState(GAME_ID, { score: score, highScore: highScore, level: level });
        }

        function resetGame() {
            if (isPlaying) {
                if (!confirm('Reset game?')) return;
            }
            isPlaying = false;
            isPlayerTurn = false;
            sequence = [];
            playerSequence = [];
            score = 0;
            level = 1;
            document.getElementById('startBtn').disabled = false;
            setMessage('🔄 Game reset! Press Start to play.');
            updateUI();
        }

        // ============================================
        // KEYBOARD SUPPORT
        // ============================================
        document.addEventListener('keydown', function(e) {
            const keyMap = {
                '1': 'red',
                '2': 'blue',
                '3': 'green',
                '4': 'yellow',
                'r': 'red',
                'b': 'blue',
                'g': 'green',
                'y': 'yellow'
            };
            const color = keyMap[e.key.toLowerCase()];
            if (color && isPlayerTurn) {
                handleClick(color);
            }
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                if (!isPlaying) startGame();
            }
        });

        // ============================================
        // LOAD SAVED STATE
        // ============================================
        function loadSavedState() {
            const state = loadGameState(GAME_ID);
            if (state) {
                score = state.score || 0;
                highScore = state.highScore || parseInt(localStorage.getItem('simonHighScore')) || 0;
                level = state.level || 1;
                updateUI();
                setMessage('📂 Loaded saved game! Press Start.');
                return true;
            }
            return false;
        }

        // ============================================
        // INIT
        // ============================================
        function init() {
            highScore = parseInt(localStorage.getItem('simonHighScore')) || 0;
            loadSavedState();
            updateUI();
            setMessage('🎯 Press Start to play!');

            // Touch feedback
            document.querySelectorAll('.simon-btn').forEach(btn => {
                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                });
            });
        }

        // Make functions global for onclick
        window.startGame = startGame;
        window.resetGame = resetGame;
        window.handleClick = handleClick;
        window.setDifficulty = setDifficulty;

        // Start
        init();
        // ============================================================
    // ACHIEVEMENT POPUP SYSTEM - WORKS EVERYWHERE
    // ============================================================
    
    // Check achievements and show popup
    function checkAchievements() {
        try {
            const progress = JSON.parse(localStorage.getItem('launchpad_progress') || '{"games":{},"totalXp":0,"gamesPlayed":0}');
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            let newAchievements = [];

            // First game
            if (progress.gamesPlayed >= 1 && !unlocked.includes('first_game')) {
                newAchievements.push('first_game');
                showAchievementPopup('🎮', 'First Game!', 'Played your first game!');
            }

            // Game master (10 games)
            if (progress.gamesPlayed >= 10 && !unlocked.includes('game_master')) {
                newAchievements.push('game_master');
                showAchievementPopup('👑', 'Game Master!', 'Played 10 games!');
            }

            // XP collector
            if (progress.totalXp >= 100 && !unlocked.includes('xp_collector')) {
                newAchievements.push('xp_collector');
                showAchievementPopup('⭐', 'XP Collector!', 'Earned 100 XP!');
            }

            // Level up
            const level = Math.floor((progress.totalXp || 0) / 100) + 1;
            if (level >= 5 && !unlocked.includes('level_up')) {
                newAchievements.push('level_up');
                showAchievementPopup('🏅', 'Level Up!', 'Reached Level 5!');
            }

            // Save new achievements
            if (newAchievements.length > 0) {
                const all = [...unlocked, ...newAchievements];
                localStorage.setItem('launchpad_achievements', JSON.stringify(all));
                updateAchievementCount();
            }

            return newAchievements;
        } catch(e) { return []; }
    }

    // Show achievement popup
    function showAchievementPopup(emoji, title, desc) {
        try { playAchievement(); } catch(e) {}
        // Check if popup already exists
        let popup = document.getElementById('achievementPopupGlobal');
        if (!popup) {
            popup = document.createElement('div');
            popup.id = 'achievementPopupGlobal';
            popup.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(18, 16, 30, 0.96);
                backdrop-filter: blur(20px);
                border: 2px solid #7cf5b0;
                border-radius: 16px;
                padding: 16px 24px;
                max-width: 350px;
                z-index: 99999;
                box-shadow: 0 20px 60px rgba(0,0,0,0.6);
                display: none;
                animation: slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
                color: #d0e8f0;
                font-family: 'Segoe UI', Roboto, sans-serif;
            `;
            document.body.appendChild(popup);
            
            // Add animation styles
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideInRight {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes slideOutRight {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
                @keyframes pulseGold {
                    0%, 100% { box-shadow: 0 0 20px rgba(124, 245, 176, 0.1); }
                    50% { box-shadow: 0 0 40px rgba(124, 245, 176, 0.3); }
                }
            `;
            document.head.appendChild(style);
        }

        // Fill popup content
        popup.innerHTML = `
            <div style="display:flex;align-items:center;gap:14px;">
                <div style="font-size:2.8rem;line-height:1;">${emoji}</div>
                <div>
                    <div style="color:#7cf5b0;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;">🏆 Achievement Unlocked!</div>
                    <div style="color:#f0f8ff;font-weight:700;font-size:1.1rem;">${title}</div>
                    <div style="color:#8899aa;font-size:0.85rem;">${desc}</div>
                </div>
            </div>
            <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end;">
                <button onclick="document.getElementById('achievementPopupGlobal').style.display='none'" style="
                    background:rgba(255,255,255,0.05);
                    border:1px solid rgba(255,255,255,0.1);
                    color:#8899aa;
                    padding:4px 14px;
                    border-radius:20px;
                    cursor:pointer;
                    font-size:0.7rem;
                    font-family:'Segoe UI',sans-serif;
                ">Dismiss</button>
            </div>
        `;

        // Show popup
        popup.style.display = 'block';
        popup.style.animation = 'slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';

        // Auto-hide after 6 seconds
        clearTimeout(popup._timeout);
        popup._timeout = setTimeout(() => {
            popup.style.animation = 'slideOutRight 0.4s ease-in';
            setTimeout(() => {
                popup.style.display = 'none';
                popup.style.animation = '';
            }, 400);
        }, 6000);

        // Play sound
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [523, 659, 784, 1047].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }, i * 120);
            });
        } catch(e) {}
    }

    // Update achievement count in stats
    function updateAchievementCount() {
        try {
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            const countEl = document.getElementById('achievementCount');
            if (countEl) countEl.textContent = unlocked.length;
        } catch(e) {}
    }

    // Check achievements every 10 seconds
    setInterval(checkAchievements, 10000);

    // Also check on page load
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(checkAchievements, 1000);
    });

    // Check when progress updates
    const origSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        origSetItem.apply(this, arguments);
        if (key === 'launchpad_progress') {
            setTimeout(checkAchievements, 500);
        }
    };
    // ============================================================
    // UNIVERSAL SAVE SYSTEM - Auto & Manual Save
    // ============================================================
    
    // Save system variables
    let saveEnabled = true;
    let saveInterval = null;
    let lastSaveTime = 'Never';
    
    // ============================================================
    // SAVE FUNCTIONS
    // ============================================================
    function saveGameData(gameId, data) {
        try {
            const saves = JSON.parse(localStorage.getItem('gameSaves') || '{}');
            saves[gameId] = {
                data: data,
                timestamp: Date.now()
            };
            localStorage.setItem('gameSaves', JSON.stringify(saves));
            showSaveFeedback('✅ Saved!');
            return true;
        } catch(e) {
            console.log('Save error:', e);
            return false;
        }
    }
    
    function loadGameData(gameId) {
        try {
            const saves = JSON.parse(localStorage.getItem('gameSaves') || '{}');
            if (saves[gameId]) {
                return saves[gameId].data;
            }
        } catch(e) {
            console.log('Load error:', e);
        }
        return null;
    }
    
    function showSaveFeedback(message) {
        let indicator = document.getElementById('saveIndicator');
        if (!indicator) {
            indicator = document.createElement('div');
            indicator.id = 'saveIndicator';
            indicator.style.cssText = `
                text-align: center;
                font-size: 11px;
                color: #666;
                padding: 6px 0;
                margin-top: 8px;
                border-top: 1px solid rgba(255,255,255,0.05);
                transition: color 0.3s;
                font-family: 'Segoe UI', sans-serif;
            `;
            const container = document.querySelector('.container') || document.querySelector('#app') || document.body;
            container.appendChild(indicator);
        }
        
        indicator.textContent = '💾 ' + message;
        indicator.style.color = '#7cf5b0';
        setTimeout(() => {
            indicator.style.color = '#666';
            const now = new Date();
            indicator.textContent = '💾 Auto-saved at ' + now.toLocaleTimeString();
        }, 2000);
    }
    
    function manualSave() {
        if (typeof saveGame === 'function') {
            saveGame();
            showSaveFeedback('✅ Manually saved!');
            return true;
        }
        return false;
    }
    
    // ============================================================
    // AUTO-SAVE
    // ============================================================
    function startAutoSave(interval = 5000) {
        if (saveInterval) clearInterval(saveInterval);
        
        saveInterval = setInterval(() => {
            if (typeof saveGame === 'function') {
                saveGame();
            }
        }, interval);
        
        console.log('💾 Auto-save started (every ' + (interval/1000) + 's)');
    }
    
    // ============================================================
    // KEYBOARD SHORTCUT - Ctrl+S
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            if (typeof manualSave === 'function') {
                manualSave();
            }
        }
    });
    
    // ============================================================
    // SAVE ON PAGE CLOSE
    // ============================================================
    window.addEventListener('beforeunload', function() {
        if (typeof saveGame === 'function') {
            saveGame();
        }
    });
    
    // ============================================================
    // SAVE INDICATOR STYLES
    // ============================================================
    const saveStyles = document.createElement('style');
    saveStyles.textContent = `
        #saveIndicator {
            text-align: center;
            font-size: 11px;
            color: #666;
            padding: 6px 0;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
            transition: color 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }
        #saveIndicator.saving {
            color: #7cf5b0 !important;
        }
        .save-btn {
            background: rgba(79,195,247,0.08);
            border: 1px solid rgba(79,195,247,0.12);
            color: #4fc3f7;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
            margin: 2px;
        }
        .save-btn:hover {
            background: rgba(79,195,247,0.15);
        }
    `;
    document.head.appendChild(saveStyles);
    
    // ============================================================
    // ADD MANUAL SAVE BUTTON
    // ============================================================
    function addSaveButton() {
        const container = document.querySelector('.container') || document.querySelector('#app');
        if (!container) return;
        
        // Check if button already exists
        if (document.getElementById('manualSaveBtn')) return;
        
        const btn = document.createElement('button');
        btn.id = 'manualSaveBtn';
        btn.className = 'save-btn';
        btn.textContent = '💾 Manual Save';
        btn.onclick = function() {
            if (typeof manualSave === 'function') {
                manualSave();
            }
        };
        
        // Find footer or add at bottom
        const footer = container.querySelector('.footer');
        if (footer) {
            const btnContainer = document.createElement('div');
            btnContainer.style.cssText = 'margin-top: 6px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;';
            btnContainer.appendChild(btn);
            footer.appendChild(btnContainer);
        } else {
            container.appendChild(btn);
        }
    }
    
    // ============================================================
    // INIT
    // ============================================================
    console.log('💾 Save system loaded!');
    console.log('⌨️  Press Ctrl+S to save manually');
    console.log('💾 Auto-save every 5 seconds');
    
    // Add save button when page loads
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(addSaveButton, 500);
        if (typeof startAutoSave === 'function') {
            startAutoSave(5000);
        }
    });
    
    // Also run immediately if DOM already loaded
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(addSaveButton, 500);
        if (typeof startAutoSave === 'function') {
            startAutoSave(5000);
        }
    }
// ============================================================
// AUTO-REFRESH ON PAGE LOAD (Ctrl+Shift+R effect)
// ============================================================

// Check if this is the first time loading
function checkAndRefresh() {
    const pageId = window.location.pathname.split('/').pop();
    const key = 'refresh_' + pageId;
    
    // Check if we already refreshed this session
    if (sessionStorage.getItem(key) === 'true') {
        console.log('🔄 Already refreshed this session');
        return;
    }
    
    // Mark as refreshed
    sessionStorage.setItem(key, 'true');
    
    // Show loading message
    const container = document.querySelector('.container') || document.querySelector('#app') || document.body;
    const msg = document.createElement('div');
    msg.id = 'refreshMessage';
    msg.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.85);
        color: #7cf5b0;
        padding: 20px 40px;
        border-radius: 16px;
        font-size: 18px;
        font-weight: 700;
        z-index: 99999;
        font-family: 'Segoe UI', sans-serif;
        text-align: center;
        border: 2px solid #4fc3f7;
        box-shadow: 0 0 60px rgba(79,195,247,0.2);
    `;
    msg.innerHTML = `
        <div style="font-size: 48px; margin-bottom: 10px;">🔄</div>
        <div>Refreshing game...</div>
        <div style="font-size: 12px; color: #666; margin-top: 8px;">Loading latest version</div>
    `;
    document.body.appendChild(msg);
    
    // Perform a hard refresh (Ctrl+Shift+R equivalent)
    setTimeout(() => {
        // Clear all caches
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) {
                    caches.delete(name);
                }
            });
        }
        
        // Force reload with cache-buster
        const url = window.location.href.split('?')[0] + '?t=' + Date.now();
        window.location.replace(url);
    }, 1000);
}

// Run on page load
if (document.readyState === 'complete') {
    checkAndRefresh();
} else {
    document.addEventListener('DOMContentLoaded', checkAndRefresh);
}

// Also force refresh if user manually clicks
console.log('🔄 Auto-refresh ready - Ctrl+Shift+R will force reload');
</script>
