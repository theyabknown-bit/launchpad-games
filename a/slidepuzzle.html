<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🧩 Slide Puzzle Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.status-bar .stat{color:#8899aa;font-size:.9rem}
.status-bar .stat span{color:#d0e8f0;font-weight:700}
.puzzle-grid{display:grid;gap:4px;margin:15px auto;max-width:400px;aspect-ratio:1/1}
.tile{aspect-ratio:1/1;background:rgba(79,195,247,0.15);border-radius:8px;border:1px solid rgba(79,195,247,0.1);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#d0e8f0;cursor:pointer;transition:.15s;text-shadow:0 0 10px rgba(79,195,247,0.1)}
.tile:hover{background:rgba(79,195,247,0.25)}
.tile.empty{background:transparent;border-color:transparent;cursor:default}
.tile.correct{background:rgba(124,245,176,0.05);border-color:rgba(124,245,176,0.1)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.difficulty-selector{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.difficulty-selector button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);font-size:.8rem;padding:6px 16px}
.difficulty-selector button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7}
#message{min-height:2rem;font-size:1rem}
.confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🧩 Slide Puzzle Pro</h1>
<div class="difficulty-selector"><button data-size="3">3x3</button><button data-size="4" class="active">4x4</button><button data-size="5">5x5</button></div>
<div class="status-bar"><div class="stat">📊 Moves: <span id="moves">0</span></div><div class="stat">⏱️ Time: <span id="timer">0s</span></div><div class="stat">🏅 Best: <span id="bestScore">-</span></div></div>
<div class="puzzle-grid" id="grid"></div>
<div id="message">🧩 Click a tile next to the empty space to slide it.</div>
<div class="controls"><button onclick="shufflePuzzle()"><i class="fas fa-random"></i> Shuffle</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const gridEl=document.getElementById('grid'),movesEl=document.getElementById('moves'),timerEl=document.getElementById('timer'),bestEl=document.getElementById('bestScore'),msgEl=document.getElementById('message');
let size=4,tiles=[],emptyPos=0,moves=0,seconds=0,timerId=null,gameOver=!1,paused=!1,bestScore=null;
(function load(){try{let s=JSON.parse(localStorage.getItem('slide_best')||'{}');bestScore=s[size]||null;bestEl.textContent=bestScore!==null?bestScore+' moves':'-';let d=parseInt(localStorage.getItem('slide_size'))||4;size=d;document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.classList.toggle('active',parseInt(b.dataset.size)===size)})}catch(e){}})();
function saveBest(){if(bestScore===null||moves<bestScore){bestScore=moves;let s=JSON.parse(localStorage.getItem('slide_best')||'{}');s[size]=moves;localStorage.setItem('slide_best',JSON.stringify(s));bestEl.textContent=moves+' moves'}}
function initGrid(s){size=s;tiles=[];for(let i=0;i<size*size;i++)tiles.push(i);emptyPos=size*size-1;moves=0;seconds=0;gameOver=!1;paused=!1;if(timerId)clearInterval(timerId);timerId=null;movesEl.textContent=moves;timerEl.textContent='0s';msgEl.textContent='🧩 Click a tile next to the empty space to slide it.';document.getElementById('pauseLabel').textContent='Pause';renderGrid()}
function renderGrid(){gridEl.style.gridTemplateColumns='repeat('+size+',1fr)';gridEl.innerHTML='';tiles.forEach((val,i)=>{let tile=document.createElement('div');tile.className='tile'+(val===0?' empty':'');if(val!==0){tile.textContent=val;let correct=(i+1)%(size*size)===val;if(correct)tile.classList.add('correct')}else tile.textContent='';tile.dataset.index=i;tile.addEventListener('click',()=>clickTile(i));gridEl.appendChild(tile)})}
function clickTile(i){if(gameOver||paused)return;let emptyRow=Math.floor(emptyPos/size),emptyCol=emptyPos%size;let row=Math.floor(i/size),col=i%size;if(Math.abs(row-emptyRow)+Math.abs(col-emptyCol)===1){[tiles[i],tiles[emptyPos]]=[tiles[emptyPos],tiles[i]];emptyPos=i;moves++;movesEl.textContent=moves;playSound('move');renderGrid();if(checkWin()){gameOver=!0;if(timerId)clearInterval(timerId);saveBest();msgEl.textContent='🎉 You solved it! Moves: '+moves+' Time: '+seconds+'s';playSound('win');spawnConfetti()}}}
function checkWin(){for(let i=0;i<tiles.length;i++){if(tiles[i]!==(i+1)%(size*size))return!1}return!0}
function shufflePuzzle(){if(gameOver&&!confirm('Shuffle current puzzle?'))return;if(timerId)clearInterval(timerId);timerId=null;initGrid(size);for(let i=0;i<200;i++){let neighbors=[];let r=Math.floor(emptyPos/size),c=emptyPos%size;[[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{let nr=r+dr,nc=c+dc;if(nr>=0&&nr<size&&nc>=0&&nc<size){neighbors.push(nr*size+nc)}});let rand=neighbors[Math.floor(Math.random()*neighbors.length)];[tiles[emptyPos],tiles[rand]]=[tiles[rand],tiles[emptyPos]];emptyPos=rand}renderGrid();moves=0;seconds=0;movesEl.textContent=moves;timerEl.textContent='0s';gameOver=!1;msgEl.textContent='🧩 Shuffled! Start sliding.';timerId=setInterval(()=>{if(!paused){seconds++;timerEl.textContent=seconds+'s'}},1000)}
function resetGame(){if(confirm('Reset?')){if(timerId)clearInterval(timerId);timerId=null;initGrid(size);shufflePuzzle()}}
function togglePause(){if(gameOver)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'🧩 Slide tiles to solve!';if(!paused&&!timerId){timerId=setInterval(()=>{if(!paused){seconds++;timerEl.textContent=seconds+'s'}},1000)}}
document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.difficulty-selector button').forEach(x=>x.classList.remove('active'));this.classList.add('active');let newSize=parseInt(this.dataset.size);size=newSize;localStorage.setItem('slide_size',size);let s=JSON.parse(localStorage.getItem('slide_best')||'{}');bestScore=s[size]||null;bestEl.textContent=bestScore!==null?bestScore+' moves':'-';if(timerId)clearInterval(timerId);timerId=null;initGrid(size);shufflePuzzle()})});
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='move'){o.frequency.value=500;g.gain.value=.04;o.start();o.stop(c.currentTime+.06)}else if(type==='win'){o.frequency.value=600;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=800},150);setTimeout(()=>{o.frequency.value=1000},300);o.stop(c.currentTime+.5)}}catch(e){}}
function spawnConfetti(){let container=document.createElement('div');container.className='confetti';document.body.appendChild(container);let colors=['#4fc3f7','#7cf5b0','#ffd93d','#ff6b6b','#a29bfe'];for(let i=0;i<60;i++){let p=document.createElement('div');p.className='confetti-piece';p.style.left=Math.random()*100+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.width=(Math.random()*8+4)+'px';p.style.height=(Math.random()*8+4)+'px';p.style.animationDuration=(Math.random()*2+1.5)+'s';p.style.animationDelay=(Math.random()*.5)+'s';container.appendChild(p)}setTimeout(()=>{container.remove()},4000)}
initGrid(size);shufflePuzzle();console.log('🧩 Slide Puzzle Pro loaded');
</script></body></html>
