<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Match · reflex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e0b14;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(20,16,30,0.9);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #6a4a7a;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; margin-bottom: 0.3rem; }
    h1 i { color: #f57c9f; margin-right: 10px; }
    .back { display: inline-block; margin-bottom: 1.2rem; color: #c0b0d9; text-decoration: none; background: #2a1f35; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #5a4a7a; font-size: 0.9rem; }
    .back:hover { background: #3f2a55; }
    .color-box {
      background: #1a1425;
      border-radius: 1.5rem;
      padding: 2rem;
      margin: 1.2rem 0;
      border: 2px solid #3a2a4a;
    }
    .color-display {
      width: 100%;
      height: 140px;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 0 30px rgba(0,0,0,0.8);
      transition: 0.15s;
      background: #4a3a5a;
      user-select: none;
    }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin: 1.2rem 0;
    }
    .color-btn {
      padding: 0.9rem;
      border-radius: 1rem;
      border: 2px solid #3a2a4a;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.1s;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .color-btn:hover { transform: scale(1.02); filter: brightness(1.1); }
    .color-btn:active { transform: scale(0.96); }
    .stats { display: flex; justify-content: space-between; color: #c0b0d9; margin-top: 0.8rem; font-weight: 500; flex-wrap: wrap; gap: 0.8rem; }
    .stats span i { margin-right: 6px; }
    .message { margin-top: 1rem; padding: 0.7rem; border-radius: 1rem; background: #1a1425; color: #d4caff; min-height: 50px; border-left: 4px solid #b07ad9; }
    .message i { margin-right: 8px; }
    .btn { background: #3f2a55; border: none; padding: 0.6rem 1.8rem; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; border: 1px solid #5a4a7a; transition: 0.15s; margin-top: 0.5rem; }
    .btn:hover { background: #5a3a7a; }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-palette"></i> Color Match</h1>
  <div class="color-box">
    <div class="color-display" id="colorDisplay">RED</div>
  </div>
  <div class="options" id="optionsContainer"></div>
  <div class="stats">
    <span><i class="fas fa-star"></i> score: <span id="scoreDisplay">0</span></span>
    <span><i class="fas fa-bolt"></i> streak: <span id="streakDisplay">0</span></span>
    <span><i class="fas fa-heart"></i> lives: <span id="livesDisplay">3</span></span>
  </div>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> pick the color that matches the word</div>
  <button class="btn" id="resetBtn"><i class="fas fa-rotate"></i> restart</button>
</div>
<script>
  const colors = [
    { name: 'Red', hex: '#e74c3c' },
    { name: 'Blue', hex: '#3498db' },
    { name: 'Green', hex: '#2ecc71' },
    { name: 'Yellow', hex: '#f1c40f' },
    { name: 'Purple', hex: '#9b59b6' },
    { name: 'Orange', hex: '#e67e22' },
    { name: 'Pink', hex: '#fd79a8' },
    { name: 'Teal', hex: '#00b894' }
  ];

  let currentColor = null;
  let score = 0;
  let streak = 0;
  let lives = 3;
  let gameActive = true;

  const colorDisplay = document.getElementById('colorDisplay');
  const optionsContainer = document.getElementById('optionsContainer');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const streakDisplay = document.getElementById('streakDisplay');
  const livesDisplay = document.getElementById('livesDisplay');
  const messageBox = document.getElementById('messageBox');

  function shuffleArray(arr) { for (let i = arr.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

  function newRound() {
    if (!gameActive) return;
    // pick a random color
    const idx = Math.floor(Math.random() * colors.length);
    currentColor = colors[idx];
    // display the word in a random color (could be different)
    const displayColorIdx = Math.floor(Math.random() * colors.length);
    colorDisplay.textContent = currentColor.name.toUpperCase();
    colorDisplay.style.color = colors[displayColorIdx].hex;
    colorDisplay.style.background = '#1a1425';

    // generate options: 4 colors including the correct one
    let opts = [currentColor];
    let pool = colors.filter(c => c.name !== currentColor.name);
    shuffleArray(pool);
    while (opts.length < 4 && pool.length > 0) { opts.push(pool.pop()); }
    shuffleArray(opts);
    optionsContainer.innerHTML = '';
    opts.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'color-btn';
      btn.textContent = c.name;
      btn.style.background = c.hex;
      btn.dataset.color = c.name;
      btn.addEventListener('click', () => handleGuess(c.name));
      optionsContainer.appendChild(btn);
    });
  }

  function handleGuess(guess) {
    if (!gameActive) return;
    if (guess === currentColor.name) {
      score += 10 + streak * 2;
      streak++;
      messageBox.innerHTML = `<i class="fas fa-check-circle" style="color:#7af5b0;"></i> correct! +${10 + (streak-1)*2}`;
    } else {
      streak = 0;
      lives--;
      messageBox.innerHTML = `<i class="fas fa-times-circle" style="color:#ff7a7a;"></i> wrong! it was ${currentColor.name}`;
      if (lives <= 0) {
        gameActive = false;
        messageBox.innerHTML = `<i class="fas fa-skull"></i> game over! score: ${score}`;
        optionsContainer.innerHTML = '';
        updateUI();
        return;
      }
    }
    updateUI();
    if (score >= 100) {
      gameActive = false;
      messageBox.innerHTML = `<i class="fas fa-trophy"></i> 🎉 YOU WIN! final score: ${score}`;
      optionsContainer.innerHTML = '';
      updateUI();
      return;
    }
    newRound();
  }

  function updateUI() {
    scoreDisplay.textContent = score;
    streakDisplay.textContent = streak;
    livesDisplay.textContent = lives;
  }

  function resetGame() {
    score = 0; streak = 0; lives = 3; gameActive = true;
    updateUI();
    messageBox.innerHTML = '<i class="fas fa-play"></i> new game!';
    newRound();
  }

  document.getElementById('resetBtn').addEventListener('click', resetGame);
  resetGame();
</script>
</body>
</html>
