<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-A-Mole</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1a26; font-family: 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .game-box { background: rgba(18,28,40,0.95); border-radius: 2.5rem; padding: 2rem; border: 1px solid rgba(100,200,255,0.12); max-width: 600px; width: 100%; text-align: center; }
        .back { display: inline-block; margin-bottom: 1rem; color: #b6ddf5; text-decoration: none; background: #1c4055; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #3a6b88; }
        .back:hover { background: #2a5a78; }
        h1 { color: white; font-size: 2rem; margin-bottom: 0.5rem; }
        h1 i { color: #ffb347; }
        .grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; max-width: 400px; margin: 1rem auto; }
        .hole { aspect-ratio: 1; background: #0a121a; border-radius: 50%; border: 4px solid #1e3347; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 3rem; transition: 0.1s; user-select: none; }
        .hole.mole { background: #2a4a3a; border-color: #7cf5b0; transform: scale(0.95); box-shadow: 0 0 30px rgba(124,245,176,0.2); }
        .hole.hit { background: #4a2a2a; border-color: #ff7a7a; }
        .stats { display: flex; justify-content: space-between; color: #9bbfd9; margin-top: 1rem; flex-wrap: wrap; gap: 0.8rem; }
        .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.6rem 1.5rem; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #2a5a7a; }
        .message { margin-top: 0.8rem; padding: 0.7rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
        @media (max-width: 500px) { .hole { font-size: 2rem; } }
    </style>
</head>
<body>
<div class="game-box">
    <a href="base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
    <h1><i class="fas fa-hammer"></i> Whack-A-Mole</h1>
    <div class="grid" id="gridContainer"></div>
    <div class="stats">
        <span><i class="fas fa-star"></i> score: <span id="scoreDisplay">0</span></span>
        <span><i class="fas fa-clock"></i> time: <span id="timerDisplay">30</span>s</span>
        <span><i class="fas fa-bolt"></i> combo: <span id="comboDisplay">0</span></span>
    </div>
    <button class="btn" id="resetBtn"><i class="fas fa-play"></i> start</button>
    <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> click the moles!</div>
</div>
<script>
const SIZE=9; let moles=[], score=0, combo=0, timeLeft=30, gameActive=false, timerInterval=null, spawnInterval=null;
const grid=document.getElementById('gridContainer'), scoreDisplay=document.getElementById('scoreDisplay'), timerDisplay=document.getElementById('timerDisplay'), comboDisplay=document.getElementById('comboDisplay'), messageBox=document.getElementById('messageBox');
function initGrid(){moles=Array(SIZE).fill(false);render();}
function render(){grid.innerHTML=moles.map((m,i)=>`<div class="hole ${m?'mole':''}" onclick="whack(${i})">${m?'🐭':''}</div>`).join('');}
function spawnMole(){if(!gameActive)return;let avail=[];for(let i=0;i<moles.length;i++)if(!moles[i])avail.push(i);if(avail.length===0)return;let idx=avail[Math.floor(Math.random()*avail.length)];moles[idx]=true;render();setTimeout(()=>{if(gameActive&&moles[idx]){moles[idx]=false;render();}},1200+Math.random()*800);}
function whack(idx){if(!gameActive||!moles[idx])return;moles[idx]=false;combo++;score+=10+combo*2;render();updateUI();}
function updateUI(){scoreDisplay.textContent=score;comboDisplay.textContent=combo;timerDisplay.textContent=timeLeft;}
function endGame(){gameActive=false;if(timerInterval)clearInterval(timerInterval);if(spawnInterval)clearInterval(spawnInterval);messageBox.innerHTML='⏰ time\'s up! score: '+score;}
function startGame(){if(timerInterval)clearInterval(timerInterval);if(spawnInterval)clearInterval(spawnInterval);score=0;combo=0;timeLeft=30;gameActive=true;initGrid();updateUI();messageBox.innerHTML='GO! click the moles!';timerInterval=setInterval(()=>{timeLeft--;timerDisplay.textContent=timeLeft;if(timeLeft<=0)endGame();},1000);spawnInterval=setInterval(spawnMole,700);setTimeout(spawnMole,100);setTimeout(spawnMole,300);setTimeout(spawnMole,500);}
document.getElementById('resetBtn').addEventListener('click',startGame);initGrid();updateUI();
</script>
</body>
</html>
