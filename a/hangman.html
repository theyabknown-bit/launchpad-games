<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔤 Hangman Pro</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .game-container { text-align: center; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .status-bar .stat { color: #8899aa; font-size: 0.9rem; }
        .status-bar .stat span { color: #d0e8f0; font-weight: 700; }
        .word-display {
            font-size: 2.5rem;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
            color: #d0e8f0;
            text-shadow: 0 0 20px rgba(79,195,247,0.1);
        }
        .hint-area {
            color: #8899aa;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            max-width: 500px;
            margin: 15px auto;
        }
        .keyboard button {
            padding: 10px 0;
            border-radius: 8px;
            border: 2px solid rgba(79,195,247,0.1);
            background: rgba(0,0,0,0.3);
            color: #d0e8f0;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 700;
        }
        .keyboard button:hover { border-color: #4fc3f7; background: rgba(79,195,247,0.05); }
        .keyboard button.used { opacity: 0.3; cursor: default; }
        .keyboard button.correct { border-color: #7cf5b0; background: rgba(124,245,176,0.1); }
        .keyboard button.wrong { border-color: #ff6b6b; background: rgba(255,107,107,0.1); }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .controls button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); }
        .difficulty-selector { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
        .difficulty-selector button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; padding: 6px 16px; }
        .difficulty-selector button.active { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        .category-selector { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
        .category-selector button { background: rgba(255,255,255,0.03); color: #8899aa; border: 1px solid rgba(255,255,255,0.05); font-size: 0.7rem; padding: 4px 12px; border-radius: 20px; cursor: pointer; transition: 0.2s; }
        .category-selector button.active { background: rgba(79,195,247,0.1); color: #4fc3f7; border-color: #4fc3f7; }
        #message { min-height: 2rem; font-size: 1rem; }
        .guesses-left { color: #ffd93d; font-weight: 700; }
        .hint-btn { background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.2); color: #ffd93d; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .hint-btn:hover { background: rgba(255,215,0,0.2); }
        .letter-pop {
            animation: popLetter 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popLetter {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @media (max-width: 500px) { .keyboard { grid-template-columns: repeat(7, 1fr); } .word-display { font-size: 1.8rem; letter-spacing: 4px; } }
    </style>
</head>
<body>
<div class="game-container">
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    <h1 class="game-title">🔤 Hangman Pro</h1>

    <!-- Difficulty -->
    <div class="difficulty-selector">
        <button data-diff="easy">Easy</button>
        <button data-diff="medium" class="active">Medium</button>
        <button data-diff="hard">Hard</button>
    </div>

    <!-- Category -->
    <div class="category-selector" id="categorySelector">
        <button data-cat="all" class="active">All</button>
        <button data-cat="animals">🐾 Animals</button>
        <button data-cat="countries">🌍 Countries</button>
        <button data-cat="food">🍕 Food</button>
        <button data-cat="movies">🎬 Movies</button>
        <button data-cat="science">🔬 Science</button>
    </div>

    <!-- Status -->
    <div class="status-bar">
        <div class="stat">🏆 Score: <span id="score">0</span></div>
        <div class="stat">🏅 Best: <span id="bestScore">-</span></div>
        <div class="stat">❌ Guesses: <span class="guesses-left" id="guessesLeft">6</span></div>
        <div class="stat">📊 Words: <span id="wordsDone">0</span></div>
    </div>

    <!-- Word Display -->
    <div class="word-display" id="wordDisplay">_ _ _ _ _</div>

    <div class="hint-area">
        <span id="hintText">💡 Category: <span id="categoryDisplay">All</span></span>
        <button class="hint-btn" onclick="useHint()">💡 Reveal Letter</button>
    </div>

    <!-- Keyboard -->
    <div class="keyboard" id="keyboard"></div>

    <div id="message">🔤 Guess a letter to start!</div>

    <div class="controls">
        <button onclick="nextWord()"><i class="fas fa-forward"></i> Next Word</button>
        <button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button>
        <button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button>
    </div>
</div>

<script>
// ============================================================
// HANGMAN PRO – Categories, difficulty, hint, high-score
// ============================================================
const wordDisplay = document.getElementById('wordDisplay');
const keyboardEl = document.getElementById('keyboard');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('bestScore');
const guessesLeftEl = document.getElementById('guessesLeft');
const wordsDoneEl = document.getElementById('wordsDone');
const hintText = document.getElementById('hintText');
const categoryDisplay = document.getElementById('categoryDisplay');
const msgEl = document.getElementById('message');

let currentWord = '';
let displayedWord = [];
let guessedLetters = [];
let wrongLetters = [];
let correctLetters = [];
let guessesLeft = 6;
let score = 0;
let wordsDone = 0;
let bestScore = 0;
let difficulty = 'medium';
let category = 'all';
let gameOver = false;
let paused = false;
let hintUsed = false;
let wordPool = [];

// ---- Word Bank ----
const WORDS = {
    animals: ['elephant', 'giraffe', 'dolphin', 'penguin', 'kangaroo', 'crocodile', 'butterfly', 'cheetah', 'zebra', 'rhinoceros', 'hippopotamus', 'alligator', 'leopard', 'gazelle', 'chimpanzee'],
    countries: ['australia', 'brazil', 'canada', 'denmark', 'egypt', 'france', 'germany', 'india', 'japan', 'mexico', 'norway', 'peru', 'russia', 'sweden', 'turkey'],
    food: ['pizza', 'hamburger', 'spaghetti', 'chocolate', 'cheese', 'sandwich', 'sushi', 'tacos', 'pancakes', 'waffles', 'cookies', 'icecream', 'cupcake', 'doughnut', 'pretzel'],
    movies: ['titanic', 'avatar', 'inception', 'gladiator', 'matrix', 'interstellar', 'jaws', 'rocky', 'casablanca', 'godfather', 'pulp', 'forrest', 'fightclub', 'gravity', 'alien'],
    science: ['gravity', 'dna', 'electron', 'neutron', 'proton', 'molecule', 'atom', 'quantum', 'nebula', 'cosmos', 'fossil', 'magnet', 'laser', 'robot', 'solar']
};

const HINTS = {
    elephant: 'Largest land animal',
    giraffe: 'Tallest animal',
    dolphin: 'Intelligent sea mammal',
    penguin: 'Bird that cannot fly',
    kangaroo: 'Animal that jumps',
    crocodile: 'Reptile with powerful jaws',
    butterfly: 'Insect with colorful wings',
    cheetah: 'Fastest land animal',
    zebra: 'Black and white striped animal',
    rhinoceros: 'Animal with a horn',
    hippopotamus: 'Large African mammal',
    alligator: 'Reptile with powerful bite',
    leopard: 'Big cat with spots',
    gazelle: 'Swift African antelope',
    chimpanzee: 'Great ape',
    australia: 'Continent and country',
    brazil: 'Largest country in South America',
    canada: 'Country north of USA',
    denmark: 'Scandinavian country',
    egypt: 'Land of pyramids',
    france: 'Country known for the Eiffel Tower',
    germany: 'Country known for cars',
    india: 'Country of the Taj Mahal',
    japan: 'Country of the Rising Sun',
    mexico: 'Country known for tacos',
    norway: 'Country of the fjords',
    peru: 'Home of Machu Picchu',
    russia: 'Largest country',
    sweden: 'Country of the Vikings',
    turkey: 'Transcontinental country',
    pizza: 'Italian flatbread',
    hamburger: 'Ground beef sandwich',
    spaghetti: 'Italian pasta dish',
    chocolate: 'Sweet treat from cacao',
    cheese: 'Dairy product',
    sandwich: 'Bread with filling',
    sushi: 'Japanese rice and fish',
    tacos: 'Mexican folded dish',
    pancakes: 'Breakfast cakes',
    waffles: 'Gridded breakfast food',
    cookies: 'Sweet baked treats',
    icecream: 'Frozen dessert',
    cupcake: 'Small cake',
    doughnut: 'Fried dough ring',
    pretzel: 'Baked twisty snack',
    titanic: 'Famous sunken ship',
    avatar: 'Blue aliens movie',
    inception: 'Dream within a dream',
    gladiator: 'Roman empire movie',
    matrix: 'Virtual reality movie',
    interstellar: 'Space exploration movie',
    jaws: 'Shark movie',
    rocky: 'Boxing movie',
    casablanca: 'Classic romance film',
    godfather: 'Mafia movie',
    pulp: 'Quentin Tarantino film',
    forrest: 'Life is like a box of chocolates',
    fightclub: 'First rule: do not talk about it',
    gravity: 'Space survival film',
    alien: 'Extraterrestrial horror',
    dna: 'Genetic code',
    electron: 'Subatomic particle',
    neutron: 'Subatomic particle with no charge',
    proton: 'Positively charged particle',
    molecule: 'Group of atoms bonded',
    atom: 'Basic unit of matter',
    quantum: 'Physics at small scales',
    nebula: 'Interstellar cloud',
    cosmos: 'The universe',
    fossil: 'Remains of ancient life',
    magnet: 'Metal that attracts iron',
    laser: 'Concentrated light beam',
    robot: 'Automated machine',
    solar: 'Related to the sun'
};

// Load best score
(function load() {
    try {
        const saved = JSON.parse(localStorage.getItem('hangman_best') || '{}');
        bestScore = saved[difficulty] || 0;
        if (bestScore) bestEl.textContent = bestScore;
        else bestEl.textContent = '-';
        const diff = localStorage.getItem('hangman_difficulty') || 'medium';
        difficulty = diff;
        document.querySelectorAll('.difficulty-selector button').forEach(b => {
            b.classList.toggle('active', b.dataset.diff === difficulty);
        });
    } catch(e) {}
})();

function saveBest() {
    if (score > bestScore) {
        bestScore = score;
        const saved = JSON.parse(localStorage.getItem('hangman_best') || '{}');
        saved[difficulty] = score;
        localStorage.setItem('hangman_best', JSON.stringify(saved));
        bestEl.textContent = score;
    }
}

function getMaxGuesses() {
    return { easy: 8, medium: 6, hard: 4 }[difficulty] || 6;
}

function getWordPool() {
    let pool = [];
    if (category === 'all') {
        for (let key in WORDS) {
            pool = pool.concat(WORDS[key]);
        }
    } else {
        pool = WORDS[category] || [];
    }
    return pool;
}

// ---- Game Functions ----
function pickWord() {
    const pool = getWordPool();
    if (pool.length === 0) {
        // fallback
        return 'hangman';
    }
    return pool[Math.floor(Math.random() * pool.length)];
}

function startNewWord() {
    currentWord = pickWord();
    displayedWord = currentWord.split('').map(() => '_');
    guessedLetters = [];
    wrongLetters = [];
    correctLetters = [];
    hintUsed = false;
    guessesLeft = getMaxGuesses();
    gameOver = false;
    document.getElementById('pauseLabel').textContent = 'Pause';
    msgEl.textContent = '🔤 Guess a letter!';
    categoryDisplay.textContent = category.charAt(0).toUpperCase() + category.slice(1);
    hintText.textContent = '💡 ' + (HINTS[currentWord] || 'No hint available');
    updateUI();
    renderKeyboard();
}

function updateUI() {
    wordDisplay.textContent = displayedWord.join(' ');
    guessesLeftEl.textContent = guessesLeft;
    scoreEl.textContent = score;
    wordsDoneEl.textContent = wordsDone;
    // Style the word display with animation
    wordDisplay.innerHTML = displayedWord.map((letter, i) => {
        if (letter !== '_') {
            return `<span class="letter-pop">${letter}</span>`;
        }
        return '_';
    }).join(' ');
}

function renderKeyboard() {
    keyboardEl.innerHTML = '';
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    letters.split('').forEach(l => {
        const btn = document.createElement('button');
        btn.textContent = l;
        btn.dataset.letter = l;
        if (guessedLetters.includes(l)) {
            btn.disabled = true;
            btn.classList.add('used');
            if (correctLetters.includes(l)) btn.classList.add('correct');
            else btn.classList.add('wrong');
        }
        btn.addEventListener('click', () => makeGuess(l));
        keyboardEl.appendChild(btn);
    });
}

function makeGuess(letter) {
    if (gameOver || paused || guessedLetters.includes(letter)) return;

    guessedLetters.push(letter);

    if (currentWord.includes(letter)) {
        correctLetters.push(letter);
        // Reveal all occurrences
        for (let i = 0; i < currentWord.length; i++) {
            if (currentWord[i] === letter) {
                displayedWord[i] = letter;
            }
        }
        playSound('correct');
        msgEl.textContent = `✅ Correct! '${letter}' is in the word!`;
        updateUI();
        renderKeyboard();

        // Check win
        if (!displayedWord.includes('_')) {
            gameOver = true;
            const bonus = Math.max(0, guessesLeft * 2);
            score += 10 + bonus;
            wordsDone++;
            scoreEl.textContent = score;
            saveBest();
            msgEl.textContent = `🎉 You got it! +${10 + bonus} points!`;
            playSound('win');
            renderKeyboard();
        }
    } else {
        wrongLetters.push(letter);
        guessesLeft--;
        playSound('wrong');
        msgEl.textContent = `❌ '${letter}' is not in the word. ${guessesLeft} guesses left.`;
        updateUI();
        renderKeyboard();

        if (guessesLeft <= 0) {
            gameOver = true;
            msgEl.textContent = `💀 Game Over! The word was "${currentWord}".`;
            playSound('lose');
            renderKeyboard();
        }
    }
    saveBest();
}

function useHint() {
    if (gameOver || paused || hintUsed) return;
    // Find an unrevealed letter
    const unrevealed = [];
    for (let i = 0; i < currentWord.length; i++) {
        if (displayedWord[i] === '_') {
            unrevealed.push(i);
        }
    }
    if (unrevealed.length === 0) return;
    const idx = unrevealed[Math.floor(Math.random() * unrevealed.length)];
    const letter = currentWord[idx];
    // Add it as guessed
    if (!guessedLetters.includes(letter)) {
        guessedLetters.push(letter);
        correctLetters.push(letter);
        displayedWord[idx] = letter;
        hintUsed = true;
        playSound('correct');
        msgEl.textContent = `💡 Hint: '${letter}' revealed!`;
        updateUI();
        renderKeyboard();
        // Check win
        if (!displayedWord.includes('_')) {
            gameOver = true;
            const bonus = Math.max(0, guessesLeft * 2);
            score += 5 + bonus;
            wordsDone++;
            scoreEl.textContent = score;
            saveBest();
            msgEl.textContent = `🎉 You got it with a hint! +${5 + bonus} points!`;
            playSound('win');
            renderKeyboard();
        }
    }
}

function nextWord() {
    if (!gameOver) {
        // If game not over, you can still skip
        if (!confirm('Skip current word?')) return;
    }
    startNewWord();
}

function resetGame() {
    if (confirm('Reset all progress?')) {
        score = 0;
        wordsDone = 0;
        bestScore = 0;
        localStorage.removeItem('hangman_best');
        bestEl.textContent = '-';
        startNewWord();
        msgEl.textContent = '🔄 Reset complete!';
    }
}

function togglePause() {
    if (gameOver) return;
    paused = !paused;
    document.getElementById('pauseLabel').textContent = paused ? 'Resume' : 'Pause';
    msgEl.textContent = paused ? '⏸️ Paused' : '🔤 Guess a letter!';
}

// ---- Difficulty ----
document.querySelectorAll('.difficulty-selector button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.difficulty-selector button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        difficulty = this.dataset.diff;
        localStorage.setItem('hangman_difficulty', difficulty);
        // Reload best
        const saved = JSON.parse(localStorage.getItem('hangman_best') || '{}');
        bestScore = saved[difficulty] || 0;
        if (bestScore) bestEl.textContent = bestScore;
        else bestEl.textContent = '-';
        startNewWord();
    });
});

// ---- Category ----
document.querySelectorAll('.category-selector button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.category-selector button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        category = this.dataset.cat;
        startNewWord();
    });
});

// ---- Keyboard Input ----
document.addEventListener('keydown', (e) => {
    const key = e.key.toUpperCase();
    if (key.length === 1 && key >= 'A' && key <= 'Z') {
        makeGuess(key);
    }
    if (e.key === 'p' || e.key === 'P') togglePause();
    if (e.key === 'r' || e.key === 'R') resetGame();
    if (e.key === 'n' || e.key === 'N') nextWord();
});

// ---- Sound ----
function playSound(type) {
    try {
        const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        if (type === 'correct') {
            osc.frequency.value = 800;
            gain.gain.value = 0.06;
            osc.start();
            setTimeout(() => { osc.frequency.value = 1000; }, 80);
            osc.stop(ctxAudio.currentTime + 0.15);
        } else if (type === 'wrong') {
            osc.frequency.value = 300;
            gain.gain.value = 0.06;
            osc.start();
            osc.stop(ctxAudio.currentTime + 0.15);
        } else if (type === 'win') {
            osc.frequency.value = 600;
            gain.gain.value = 0.08;
            osc.start();
            setTimeout(() => { osc.frequency.value = 800; }, 150);
            setTimeout(() => { osc.frequency.value = 1000; }, 300);
            osc.stop(ctxAudio.currentTime + 0.5);
        } else if (type === 'lose') {
            osc.frequency.value = 300;
            gain.gain.value = 0.08;
            osc.start();
            setTimeout(() => { osc.frequency.value = 200; }, 100);
            osc.stop(ctxAudio.currentTime + 0.4);
        }
    } catch(e) {}
}

// ---- Init ----
startNewWord();
console.log('🔤 Hangman Pro loaded with categories, difficulty, hints, high-score.');
</script>
</body>
</html>
