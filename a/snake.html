<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Snake</title>
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#0b1a26;font-family:Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}.game-box{background:rgba(18,28,40,0.95);border-radius:2.5rem;padding:2rem;border:1px solid rgba(100,200,255,0.12);max-width:500px;width:100%;text-align:center;}.back{display:inline-block;margin-bottom:1rem;color:#b6ddf5;text-decoration:none;background:#1c4055;padding:0.3rem 1.2rem;border-radius:40px;border:1px solid #3a6b88;}.back:hover{background:#2a5a78;}h1{color:white;font-size:2rem;margin-bottom:0.5rem;}h1 i{color:#7cf5b0;}.canvas-wrap{background:#0f172a;border-radius:1.5rem;padding:0.5rem;border:1px solid #1e3347;margin:0.5rem 0;}canvas{display:block;width:100%;height:auto;aspect-ratio:400/400;background:#0a121a;border-radius:1rem;}.stats{display:flex;justify-content:space-between;color:#9bbfd9;margin-top:0.5rem;flex-wrap:wrap;gap:0.5rem;}.btn{background:#1a3a5a;border:1px solid #2a5a7a;padding:0.5rem 1.5rem;border-radius:40px;color:white;cursor:pointer;transition:0.15s;}.btn:hover{background:#2a5a7a;}.message{margin-top:0.5rem;padding:0.6rem;border-radius:1rem;background:#0f172a;color:#b0d4f0;min-height:40px;border-left:4px solid #7fc9ff;}
</style></head>
<body>
<div class="game-box">
<a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
<h1><i class="fas fa-dragon"></i> Snake</h1>
<div class="canvas-wrap"><canvas id="canvas" width="400" height="400"></canvas></div>
<div class="stats"><span>Score: <span id="score">0</span></span><span>High Score: <span id="highScore">0</span></span></div>
<button class="btn" onclick="resetGame()"><i class="fas fa-rotate"></i> restart</button>
<div class="message" id="msg"><i class="fas fa-info-circle"></i> Use arrow keys to move!</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),highScoreEl=document.getElementById('highScore'),msg=document.getElementById('msg');
const SIZE=20,COLS=20,ROWS=20;
let snake=[{x:10,y:10}],food={x:15,y:10},dx=1,dy=0,score=0,highScore=0,gameOver=false;
function initGame(){snake=[{x:10,y:10}];dx=1;dy=0;score=0;gameOver=false;msg.innerHTML='<i class="fas fa-info-circle"></i> Use arrow keys to move!';spawnFood();highScore=parseInt(localStorage.getItem('snake_high')||'0');highScoreEl.textContent=highScore;}
function spawnFood(){let pos;do{pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}while(snake.some(s=>s.x===pos.x&&s.y===pos.y));food=pos;}
function update(){if(gameOver)return;const head={x:snake[0].x+dx,y:snake[0].y+dy};if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver=true;if(score>highScore){highScore=score;localStorage.setItem('snake_high',String(highScore));highScoreEl.textContent=highScore;}msg.innerHTML='<i class="fas fa-times-circle" style="color:#ff7a7a;"></i> ?? Game Over! Score: '+score;return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;spawnFood();}else{snake.pop();}draw();}
function draw(){ctx.fillStyle='#0a121a';ctx.fillRect(0,0,400,400);snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#7fc9ff':'#4a8bc2';ctx.fillRect(s.x*SIZE,s.y*SIZE,SIZE-2,SIZE-2);});ctx.fillStyle='#ff6b35';ctx.fillRect(food.x*SIZE,food.y*SIZE,SIZE-2,SIZE-2);}
function resetGame(){initGame();draw();}
document.addEventListener('keydown',e=>{if(gameOver)return;if(e.key==='ArrowUp'&&dy!==1){dx=0;dy=-1;}else if(e.key==='ArrowDown'&&dy!==-1){dx=0;dy=1;}else if(e.key==='ArrowLeft'&&dx!==1){dx=-1;dy=0;}else if(e.key==='ArrowRight'&&dx!==-1){dx=1;dy=0;}});
setInterval(update,150);initGame();draw();
</script>
</body>
</html>
