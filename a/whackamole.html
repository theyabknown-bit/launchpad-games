<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🔨 Whack‑A‑Mole Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.status-bar .stat{color:#8899aa;font-size:.9rem}
.status-bar .stat span{color:#d0e8f0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:360px;margin:15px auto}
.hole{aspect-ratio:1/1;background:rgba(0,0,0,0.4);border-radius:50%;border:3px solid rgba(79,195,247,0.1);cursor:pointer;position:relative;transition:.1s;overflow:hidden}
.hole .mole{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem;transform:translateY(100%);transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.hole.active .mole{transform:translateY(0)}
.hole.hit{background:rgba(124,245,176,0.15);border-color:#7cf5b0}
.hole.miss{background:rgba(255,107,107,0.15);border-color:#ff6b6b}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.difficulty-selector{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.difficulty-selector button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);font-size:.8rem;padding:6px 16px}
.difficulty-selector button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7}
#message{min-height:2rem;font-size:1rem}
.timer-bar{width:100%;height:6px;background:rgba(255,255,255,0.05);border-radius:3px;margin:10px 0;overflow:hidden}
.timer-bar .fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#7cf5b0);border-radius:3px;transition:width .3s linear;width:100%}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🔨 Whack‑A‑Mole Pro</h1>
<div class="difficulty-selector"><button data-diff="easy">Easy</button><button data-diff="medium" class="active">Medium</button><button data-diff="hard">Hard</button></div>
<div class="status-bar"><div class="stat">🏆 Score: <span id="score">0</span></div><div class="stat">🏅 Best: <span id="bestScore">-</span></div><div class="stat">⏱️ Time: <span id="timer">30</span>s</div><div class="stat">🔥 Combo: <span id="combo">0</span>x</div></div>
<div class="timer-bar"><div class="fill" id="timerFill"></div></div>
<div class="grid" id="grid"></div>
<div id="message">🔨 Click Start to begin!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),timerEl=document.getElementById('timer'),comboEl=document.getElementById('combo'),msgEl=document.getElementById('message'),grid=document.getElementById('grid'),timerFill=document.getElementById('timerFill');
let score=0,bestScore=0,combo=0,timeLeft=30,maxTime=30,diff='medium',gameOver=!0,paused=!1,timerId=null,moleInterval=null,holes=[],activeHoles=[];
const EMOJIS=['🐭','🐹','🐿️','🦔','🐀'];
(function load(){try{let s=JSON.parse(localStorage.getItem('whack_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';let d=localStorage.getItem('whack_difficulty')||'medium';diff=d;document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.classList.toggle('active',b.dataset.diff===diff)})}catch(e){}})();
function saveBest(){if(score>bestScore){bestScore=score;let s=JSON.parse(localStorage.getItem('whack_best')||'{}');s[diff]=score;localStorage.setItem('whack_best',JSON.stringify(s));bestEl.textContent=score}}
function getSettings(){return{easy:{interval:1200,maxMoles:1},medium:{interval:800,maxMoles:2},hard:{interval:500,maxMoles:3}}[diff]||{interval:800,maxMoles:2}}
function buildGrid(){grid.innerHTML='';for(let i=0;i<9;i++){let d=document.createElement('div');d.className='hole';d.dataset.index=i;let m=document.createElement('div');m.className='mole';m.textContent=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];d.appendChild(m);d.addEventListener('click',()=>whack(i));grid.appendChild(d)}}
function spawnMole(){if(gameOver||paused)return;let settings=getSettings();let available=[];holes.forEach((h,i)=>{if(!h.classList.contains('active')&&!h.classList.contains('hit'))available.push(i)});if(available.length===0)return;let count=Math.min(settings.maxMoles,available.length);for(let i=0;i<count;i++){let idx=available.splice(Math.floor(Math.random()*available.length),1)[0];holes[idx].classList.add('active');activeHoles.push(idx)}}
function whack(index){if(gameOver||paused)return;let hole=holes[index];if(hole.classList.contains('active')){hole.classList.remove('active');hole.classList.add('hit');score+=10+(combo*2);combo++;scoreEl.textContent=score;comboEl.textContent=combo;playSound('hit');setTimeout(()=>{hole.classList.remove('hit')},300);let idx=activeHoles.indexOf(index);if(idx!==-1)activeHoles.splice(idx,1)}else{score=Math.max(0,score-5);scoreEl.textContent=score;combo=0;comboEl.textContent=0;hole.classList.add('miss');playSound('miss');setTimeout(()=>{hole.classList.remove('miss')},300)}saveBest()}
function startGame(){score=0;combo=0;timeLeft=maxTime;gameOver=!1;paused=!1;activeHoles=[];document.getElementById('pauseLabel').textContent='Pause';scoreEl.textContent=score;comboEl.textContent=combo;timerEl.textContent=timeLeft;timerFill.style.width='100%';msgEl.textContent='🔨 Whack the moles!';holes=document.querySelectorAll('.hole');holes.forEach(h=>{h.classList.remove('active','hit','miss')});if(timerId)clearInterval(timerId);if(moleInterval)clearInterval(moleInterval);timerId=setInterval(()=>{if(paused)return;timeLeft--;timerEl.textContent=timeLeft;timerFill.style.width=(timeLeft/maxTime*100)+'%';if(timeLeft<=0){gameOver=!0;msgEl.textContent='⏰ Time\'s up! Score: '+score;if(timerId)clearInterval(timerId);if(moleInterval)clearInterval(moleInterval);playSound('gameover');saveBest()}},1000);moleInterval=setInterval(spawnMole,getSettings().interval);setTimeout(spawnMole,200)}
function togglePause(){if(gameOver)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'🔨 Whack the moles!';if(paused&&moleInterval)clearInterval(moleInterval);else if(!paused){moleInterval=setInterval(spawnMole,getSettings().interval);spawnMole()}}
function resetGame(){if(confirm('Reset game?')){if(timerId)clearInterval(timerId);if(moleInterval)clearInterval(moleInterval);gameOver=!0;paused=!1;activeHoles=[];holes=document.querySelectorAll('.hole');holes.forEach(h=>{h.classList.remove('active','hit','miss')});score=0;combo=0;timeLeft=maxTime;scoreEl.textContent=score;comboEl.textContent=combo;timerEl.textContent=timeLeft;timerFill.style.width='100%';msgEl.textContent='🔨 Click Start to begin!';document.getElementById('pauseLabel').textContent='Pause'}}
document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.difficulty-selector button').forEach(x=>x.classList.remove('active'));this.classList.add('active');diff=this.dataset.diff;localStorage.setItem('whack_difficulty',diff);let s=JSON.parse(localStorage.getItem('whack_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';resetGame()})});
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='hit'){o.frequency.value=800;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=1000},80);o.stop(c.currentTime+.15)}else if(type==='miss'){o.frequency.value=300;g.gain.value=.06;o.start();o.stop(c.currentTime+.15)}else if(type==='gameover'){o.frequency.value=400;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=300},200);o.stop(c.currentTime+.4)}}catch(e){}}
buildGrid();resetGame();console.log('🔨 Whack‑A‑Mole Pro loaded');
</script></body></html>
