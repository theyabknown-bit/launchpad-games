<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🚀 Space Station Manager Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.status-bar .stat{background:rgba(0,0,0,0.3);padding:6px 10px;border-radius:8px;border:1px solid rgba(79,195,247,0.05)}
.status-bar .stat .label{font-size:.7rem;color:#8899aa}
.status-bar .stat .value{font-weight:700;font-size:1.1rem}
.status-bar .stat .value.oxygen{color:#4fc3f7}
.status-bar .stat .value.food{color:#7cf5b0}
.status-bar .stat .value.energy{color:#ffd93d}
.status-bar .stat .value.water{color:#55efc4}
.resources{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.resource{background:rgba(0,0,0,0.2);padding:6px;border-radius:8px;border:1px solid rgba(79,195,247,0.05)}
.resource .bar{height:6px;background:rgba(255,255,255,0.05);border-radius:3px;margin-top:4px;overflow:hidden}
.resource .bar .fill{height:100%;border-radius:3px;transition:width .3s}
.resource .bar .fill.oxygen{background:#4fc3f7}
.resource .bar .fill.food{background:#7cf5b0}
.resource .bar .fill.energy{background:#ffd93d}
.resource .bar .fill.water{background:#55efc4}
.crew-area{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.crew-member{background:rgba(0,0,0,0.3);padding:6px 12px;border-radius:8px;border:1px solid rgba(79,195,247,0.05);font-size:.8rem;display:flex;align-items:center;gap:8px}
.crew-member .status{width:8px;height:8px;border-radius:50%;display:inline-block}
.crew-member .status.alive{background:#7cf5b0}
.crew-member .status.busy{background:#ffd93d}
.events{background:rgba(255,215,0,0.03);border:1px solid rgba(255,215,0,0.05);border-radius:8px;padding:8px;margin:10px 0;font-size:.85rem;min-height:40px;color:#8899aa}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.actions button{background:rgba(79,195,247,0.05);border:1px solid rgba(79,195,247,0.1);color:#d0e8f0;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem}
.actions button:hover{background:rgba(79,195,247,0.1)}
#message{min-height:2rem;font-size:.9rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🚀 Space Station Manager Pro</h1>
<div class="status-bar"><div class="stat"><div class="label">💰 Credits</div><div class="value" id="credits">100</div></div><div class="stat"><div class="label">👨‍🚀 Crew</div><div class="value" id="crewCount">1</div></div><div class="stat"><div class="label">🔬 Research</div><div class="value" id="researchLevel">0</div></div><div class="stat"><div class="label">🏆 Score</div><div class="value" id="score">0</div></div></div>
<div class="resources"><div class="resource"><div>🅾️ Oxygen <span id="oxygenVal">100</span>%</div><div class="bar"><div class="fill oxygen" id="oxygenBar" style="width:100%"></div></div></div><div class="resource"><div>🍔 Food <span id="foodVal">100</span>%</div><div class="bar"><div class="fill food" id="foodBar" style="width:100%"></div></div></div><div class="resource"><div>⚡ Energy <span id="energyVal">100</span>%</div><div class="bar"><div class="fill energy" id="energyBar" style="width:100%"></div></div></div><div class="resource"><div>💧 Water <span id="waterVal">100</span>%</div><div class="bar"><div class="fill water" id="waterBar" style="width:100%"></div></div></div></div>
<div class="crew-area" id="crewArea"><div class="crew-member"><span class="status alive"></span> Commander</div><div class="crew-member"><span class="status alive"></span> Engineer</div></div>
<div class="events" id="events">🚀 Station operational. Ready for launch.</div>
<div class="actions"><button onclick="collectResources()">📦 Collect Resources</button><button onclick="hireCrew()">👨‍🚀 Hire Crew ($25)</button><button onclick="research()">🔬 Research ($30)</button><button onclick="repairStation()">🔧 Repair ($20)</button></div>
<div id="message">💡 Manage resources, hire crew, research upgrades!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const creditsEl=document.getElementById('credits'),crewCountEl=document.getElementById('crewCount'),researchEl=document.getElementById('researchLevel'),scoreEl=document.getElementById('score');
const oxygenVal=document.getElementById('oxygenVal'),foodVal=document.getElementById('foodVal'),energyVal=document.getElementById('energyVal'),waterVal=document.getElementById('waterVal');
const oxygenBar=document.getElementById('oxygenBar'),foodBar=document.getElementById('foodBar'),energyBar=document.getElementById('energyBar'),waterBar=document.getElementById('waterBar');
const crewArea=document.getElementById('crewArea'),eventsEl=document.getElementById('events'),msgEl=document.getElementById('message');
let state={credits:100,crew:2,research:0,score:0,oxygen:100,food:100,energy:100,water:100,max:100,gameActive:!1,paused:!1,timerId:null,eventTimer:null,crewNames:['Commander','Engineer','Scientist','Medic','Pilot','Chef','Technician','Biologist','Physicist','Astronaut']};
function loadState(){try{let s=localStorage.getItem('station_state');if(s){let p=JSON.parse(s);state={...state,...p}}}catch(e){}}
function saveState(){try{localStorage.setItem('station_state',JSON.stringify(state))}catch(e){}}
function updateUI(){creditsEl.textContent=state.credits;crewCountEl.textContent=state.crew;researchEl.textContent=state.research;scoreEl.textContent=state.score;oxygenVal.textContent=Math.round(state.oxygen);foodVal.textContent=Math.round(state.food);energyVal.textContent=Math.round(state.energy);waterVal.textContent=Math.round(state.water);oxygenBar.style.width=state.oxygen+'%';foodBar.style.width=state.food+'%';energyBar.style.width=state.energy+'%';waterBar.style.width=state.water+'%';crewArea.innerHTML=state.crewNames.slice(0,state.crew).map((n,i)=>`<div class="crew-member"><span class="status ${i<2?'alive':'busy'}"></span> ${n}</div>`).join('')}
function collectResources(){if(!state.gameActive||state.paused)return;let gain=Math.floor(Math.random()*20)+10;state.credits+=gain;state.score+=5;addEvent('📦 Collected '+gain+' credits!');playSound('collect');saveState();updateUI()}
function hireCrew(){if(!state.gameActive||state.paused)return;if(state.credits<25){msgEl.textContent='❌ Not enough credits!';return}state.credits-=25;state.crew++;state.score+=10;let names=['Scientist','Medic','Pilot','Chef','Technician','Biologist'];state.crewNames.push(names[Math.floor(Math.random()*names.length)]||'Crew');addEvent('👨‍🚀 New crew member hired!');playSound('hire');saveState();updateUI()}
function research(){if(!state.gameActive||state.paused)return;if(state.credits<30){msgEl.textContent='❌ Need 30 credits!';return}state.credits-=30;state.research++;state.score+=15;addEvent('🔬 Research complete! Level '+state.research);playSound('research');saveState();updateUI()}
function repairStation(){if(!state.gameActive||state.paused)return;if(state.credits<20){msgEl.textContent='❌ Need 20 credits!';return}state.credits-=20;state.oxygen=Math.min(100,state.oxygen+10);state.food=Math.min(100,state.food+10);state.energy=Math.min(100,state.energy+10);state.water=Math.min(100,state.water+10);state.score+=5;addEvent('🔧 Station repaired! Resources restored.');playSound('repair');saveState();updateUI()}
function addEvent(msg){eventsEl.textContent='🛸 '+msg}
function resourceDecay(){if(!state.gameActive||state.paused)return;let rate=0.1+state.crew*0.02;state.oxygen=Math.max(0,state.oxygen-rate*2);state.food=Math.max(0,state.food-rate*1.5);state.energy=Math.max(0,state.energy-rate*2);state.water=Math.max(0,state.water-rate*1.5);if(state.oxygen<10||state.food<10||state.energy<10||state.water<10){addEvent('⚠️ Critical resources low! Repair or collect!')}if(state.oxygen<=0||state.food<=0||state.energy<=0||state.water<=0){addEvent('💀 Station failure! Game Over.');state.gameActive=!1;if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);playSound('gameover')}saveState();updateUI()}
function randomEvent(){if(!state.gameActive||state.paused)return;let events=[{msg:'☀️ Solar flare! Energy -15',fn:()=>{state.energy=Math.max(0,state.energy-15)}},{msg:'🌠 Meteor shower! Station damaged. Oxygen -10',fn:()=>{state.oxygen=Math.max(0,state.oxygen-10)}},{msg:'📡 Communications down. Food -5',fn:()=>{state.food=Math.max(0,state.food-5)}},{msg:'💧 Water leak! Water -10',fn:()=>{state.water=Math.max(0,state.water-10)}},{msg:'⚡ Power surge! Energy +10',fn:()=>{state.energy=Math.min(100,state.energy+10)}},{msg:'🛸 Supply ship arrived! Credits +15',fn:()=>{state.credits+=15}},{msg:'🔬 Science breakthrough! Research +1',fn:()=>{state.research++;state.score+=10}}];let e=events[Math.floor(Math.random()*events.length)];e.fn();addEvent(e.msg);playSound('event');saveState();updateUI()}
function startGame(){state.gameActive=!0;state.paused=!1;state.credits=100;state.crew=2;state.research=0;state.score=0;state.oxygen=100;state.food=100;state.energy=100;state.water=100;state.crewNames=['Commander','Engineer'];document.getElementById('pauseLabel').textContent='Pause';addEvent('🚀 Station launched!');if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);state.timerId=setInterval(()=>{resourceDecay()},2000);state.eventTimer=setInterval(()=>{randomEvent()},8000);saveState();updateUI();msgEl.textContent='💡 Manage your space station!'}
function togglePause(){if(!state.gameActive)return;state.paused=!state.paused;document.getElementById('pauseLabel').textContent=state.paused?'Resume':'Pause';msgEl.textContent=state.paused?'⏸️ Paused':'💡 Manage resources!';if(state.paused){if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer)}else{state.timerId=setInterval(()=>{resourceDecay()},2000);state.eventTimer=setInterval(()=>{randomEvent()},8000)}}
function resetGame(){if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);state.gameActive=!1;state.paused=!1;state.credits=100;state.crew=2;state.research=0;state.score=0;state.oxygen=100;state.food=100;state.energy=100;state.water=100;state.crewNames=['Commander','Engineer'];document.getElementById('pauseLabel').textContent='Pause';addEvent('🔄 Station reset.');saveState();updateUI();msgEl.textContent='💡 Click Start to begin!'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='collect'){o.frequency.value=600;g.gain.value=.04;o.start();o.stop(c.currentTime+.06)}else if(type==='hire'||type==='research'){o.frequency.value=700;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=900},100);o.stop(c.currentTime+.2)}else if(type==='repair'){o.frequency.value=400;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=600},150);o.stop(c.currentTime+.25)}else if(type==='event'){o.frequency.value=500;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=300},100);o.stop(c.currentTime+.2)}else if(type==='gameover'){o.frequency.value=300;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=200},200);o.stop(c.currentTime+.5)}}catch(e){}}
loadState();updateUI();console.log('🚀 Space Station Manager Pro loaded');
</script></body></html>
