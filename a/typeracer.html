<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>⌨️ Type Racer Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.status-bar .stat{color:#8899aa;font-size:.9rem}
.status-bar .stat span{color:#d0e8f0;font-weight:700}
.quote-area{background:rgba(0,0,0,0.3);border-radius:16px;padding:20px;font-size:1.4rem;line-height:1.8;margin:15px 0;border:2px solid rgba(79,195,247,0.05);font-family:'Courier New',monospace;text-align:left;min-height:100px}
.quote-area .char{transition:.1s}
.quote-area .char.correct{color:#7cf5b0}
.quote-area .char.wrong{color:#ff6b6b;background:rgba(255,107,107,0.1);border-radius:2px}
.quote-area .char.current{background:rgba(79,195,247,0.1);border-left:2px solid #4fc3f7}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.difficulty-selector{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.difficulty-selector button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);font-size:.8rem;padding:6px 16px}
.difficulty-selector button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7}
#message{min-height:2rem;font-size:1rem}
.timer-bar{width:100%;height:6px;background:rgba(255,255,255,0.05);border-radius:3px;margin:10px 0;overflow:hidden}
.timer-bar .fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#7cf5b0);border-radius:3px;transition:width .3s linear;width:100%}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">⌨️ Type Racer Pro</h1>
<div class="difficulty-selector"><button data-diff="easy">Easy</button><button data-diff="medium" class="active">Medium</button><button data-diff="hard">Hard</button></div>
<div class="status-bar"><div class="stat">📊 WPM: <span id="wpm">0</span></div><div class="stat">🎯 Accuracy: <span id="accuracy">100</span>%</div><div class="stat">✅ Correct: <span id="correct">0</span></div><div class="stat">❌ Errors: <span id="errors">0</span></div></div>
<div class="timer-bar"><div class="fill" id="timerFill"></div></div>
<div class="quote-area" id="quoteDisplay"></div>
<div id="message">⌨️ Start typing to begin!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const quoteEl=document.getElementById('quoteDisplay'),wpmEl=document.getElementById('wpm'),accEl=document.getElementById('accuracy'),correctEl=document.getElementById('correct'),errorsEl=document.getElementById('errors'),msgEl=document.getElementById('message'),timerFill=document.getElementById('timerFill');
const QUOTES=["The only way to do great work is to love what you do.","Life is what happens when you're busy making other plans.","In three words I can sum up everything I've learned about life: it goes on.","To be or not to be, that is the question.","The future belongs to those who believe in the beauty of their dreams.","It is during our darkest moments that we must focus to see the light.","The best time to plant a tree was twenty years ago. The second best time is now.","Do not go gentle into that good night.","All we have to decide is what to do with the time that is given us.","Not all those who wander are lost.","The journey of a thousand miles begins with one step.","That which does not kill us makes us stronger.","To live is the rarest thing in the world. Most people exist, that is all.","The unexamined life is not worth living.","Life is really simple, but we insist on making it complicated.","The purpose of our lives is to be happy.","Wherever you go, go with all your heart.","It does not matter how slowly you go as long as you do not stop.","The secret of getting ahead is getting started.","The only impossible journey is the one you never begin."];
let quote="",chars=[],currentIndex=0,correctCount=0,errorCount=0,startTime=null,timerId=null,timeLeft=30,maxTime=30,gameActive=!1,paused=!1,diff='medium',bestWPM=0;
(function load(){try{let s=JSON.parse(localStorage.getItem('typeracer_best')||'{}');bestWPM=s[diff]||0;document.getElementById('bestScore')?document.getElementById('bestScore').textContent=bestWPM||'-':null;let d=localStorage.getItem('typeracer_difficulty')||'medium';diff=d;document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.classList.toggle('active',b.dataset.diff===diff)})}catch(e){}})();
function saveBest(){if(wpmEl.textContent>bestWPM){bestWPM=parseInt(wpmEl.textContent);let s=JSON.parse(localStorage.getItem('typeracer_best')||'{}');s[diff]=bestWPM;localStorage.setItem('typeracer_best',JSON.stringify(s))}}
function getTime(){return{easy:45,medium:30,hard:20}[diff]||30}
function pickQuote(){return QUOTES[Math.floor(Math.random()*QUOTES.length)]}
function renderQuote(){quoteEl.innerHTML=chars.map((c,i)=>{let cls='char';if(i===currentIndex)cls+=' current';if(i<currentIndex){if(correctCount>i)cls+=' correct';else cls+=' wrong'}return'<span class="'+cls+'">'+c+'</span>'}).join('')}
function startGame(){quote=pickQuote();chars=quote.split('');currentIndex=0;correctCount=0;errorCount=0;startTime=Date.now();gameActive=!0;paused=!1;document.getElementById('pauseLabel').textContent='Pause';timeLeft=getTime();maxTime=timeLeft;wpmEl.textContent=0;accEl.textContent=100;correctEl.textContent=0;errorsEl.textContent=0;timerFill.style.width='100%';msgEl.textContent='⌨️ Type the quote!';renderQuote();if(timerId)clearInterval(timerId);timerId=setInterval(()=>{if(!paused){timeLeft--;timerFill.style.width=(timeLeft/maxTime*100)+'%';if(timeLeft<=0){gameActive=!1;clearInterval(timerId);let elapsed=(Date.now()-startTime)/60000;let words=(correctCount/5);let wpm=Math.round(words/elapsed)||0;wpmEl.textContent=wpm;saveBest();msgEl.textContent='⏰ Time\'s up! WPM: '+wpm;playSound('gameover')}}},1000)}
function handleKey(e){if(!gameActive||paused)return;let key=e.key;if(key.length===1){if(currentIndex<chars.length){let expected=chars[currentIndex];if(key===expected){correctCount++;correctEl.textContent=correctCount;playSound('correct')}else{errorCount++;errorsEl.textContent=errorCount;playSound('error')}currentIndex++;renderQuote();let elapsed=(Date.now()-startTime)/60000;let words=(correctCount/5);let wpm=Math.round(words/elapsed)||0;wpmEl.textContent=wpm;let acc=Math.round((correctCount/(correctCount+errorCount))*100)||100;accEl.textContent=acc;if(currentIndex===chars.length){gameActive=!1;clearInterval(timerId);let finalWPM=wpm;wpmEl.textContent=finalWPM;saveBest();msgEl.textContent='🎉 Complete! WPM: '+finalWPM;playSound('win')}}}else if(e.key==='Backspace'&&currentIndex>0){currentIndex--;if(chars[currentIndex]===chars[currentIndex]?)}}}
document.addEventListener('keydown',handleKey);
function togglePause(){if(!gameActive)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'⌨️ Keep typing!'}
function resetGame(){if(timerId)clearInterval(timerId);gameActive=!1;paused=!1;currentIndex=0;correctCount=0;errorCount=0;wpmEl.textContent=0;accEl.textContent=100;correctEl.textContent=0;errorsEl.textContent=0;timerFill.style.width='100%';msgEl.textContent='⌨️ Click Start to begin!';quote='';chars=[];renderQuote();document.getElementById('pauseLabel').textContent='Pause'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='correct'){o.frequency.value=800;g.gain.value=.04;o.start();o.stop(c.currentTime+.05)}else if(type==='error'){o.frequency.value=300;g.gain.value=.05;o.start();o.stop(c.currentTime+.1)}else if(type==='win'){o.frequency.value=600;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=800},150);setTimeout(()=>{o.frequency.value=1000},300);o.stop(c.currentTime+.5)}else if(type==='gameover'){o.frequency.value=400;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=300},200);o.stop(c.currentTime+.4)}}catch(e){}}
document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.difficulty-selector button').forEach(x=>x.classList.remove('active'));this.classList.add('active');diff=this.dataset.diff;localStorage.setItem('typeracer_difficulty',diff);let s=JSON.parse(localStorage.getItem('typeracer_best')||'{}');bestWPM=s[diff]||0;document.getElementById('bestScore')?document.getElementById('bestScore').textContent=bestWPM||'-':null;resetGame()})});
resetGame();console.log('⌨️ Type Racer Pro loaded');
</script></body></html>
