<script>
    // Game-specific save function - override this in your game
    function saveGame() {
        // For games with their own save system, this will be overridden
        // For games without, it does nothing
        console.log('💾 Save called but no game-specific save implemented');
        return true;
    }
    // ============================================================
    // FIXED SOUND SYSTEM - WORKS ON FIRST CLICK
    // ============================================================
    let soundEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;

    function unlockAudio() {
        if (audioUnlocked) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioUnlocked = true;
            console.log('🔊 Audio unlocked!');
        } catch(e) { console.log('Audio error:', e); }
    }

    // Unlock audio on any click
    document.addEventListener('click', unlockAudio, { once: false });
    document.addEventListener('touchstart', unlockAudio, { once: false });
    document.addEventListener('keydown', unlockAudio, { once: false });

    function getAudioCtx() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playTone(frequency, duration = 150, type = 'sine') {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration / 1000);
        } catch(e) { console.log('Play error:', e); }
    }

    function playClick() { playTone(600, 80); }
    function playWin() { 
        playTone(523, 150); 
        setTimeout(() => playTone(659, 150), 150); 
        setTimeout(() => playTone(784, 200), 300); 
    }
    function playLose() { 
        playTone(300, 200); 
        setTimeout(() => playTone(200, 300), 200); 
    }
    function playCorrect() { playTone(800, 100); }
    function playWrong() { playTone(250, 200); }
    function playLevelUp() { 
        playTone(440, 100); 
        setTimeout(() => playTone(523, 100), 100); 
        setTimeout(() => playTone(659, 150), 200); 
    }
// Save system
function updateGameProgress(gameId){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.games)s.games={};if(!s.games[gameId])s.games[gameId]={played:false,xp:0};var g=s.games[gameId];if(!g.played){g.played=true;s.gamesPlayed=(s.gamesPlayed||0)+1;}g.xp=(g.xp||0)+1;var t=0,p=0;Object.values(s.games).forEach(function(x){t+=(x.xp||0);if(x.played)p++;});s.totalXp=t;s.gamesPlayed=p;localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

const GAME_ID='whackamole';
let score=0,timeLeft=30,highScore=parseInt(localStorage.getItem('whackHigh'))||0;
let gameActive=false,moleInterval=null,timerInterval=null;
let holes=[];

function initGrid(){
    const grid=document.getElementById('grid');
    grid.innerHTML='';
    holes=[];
    for(let i=0;i<9;i++){
        const div=document.createElement('div');
        div.className='hole';
        div.dataset.index=i;
        div.addEventListener('click',()=>whack(i));
        grid.appendChild(div);
        holes.push(div);
    }
}

function whack(index){
    if(!gameActive)return;
    const hole=holes[index];
    if(hole.classList.contains('mole')){
        score++;
        hole.classList.remove('mole');
        hole.textContent='';
        document.getElementById('score').textContent=score;
        // Particle effect
        const rect=hole.getBoundingClientRect();
        const el=document.createElement('div');
        el.textContent='💥';
        el.style.position='fixed';
        el.style.left=(rect.left+rect.width/2-20)+'px';
        el.style.top=(rect.top-20)+'px';
        el.style.fontSize='40px';
        el.style.pointerEvents='none';
        el.style.zIndex='999';
        el.style.animation='floatUp 0.8s ease-out forwards';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),800);
    }
}

function spawnMole(){
    if(!gameActive)return;
    // Clear all moles
    holes.forEach(h=>{h.classList.remove('mole');h.textContent='';});
    // Spawn random mole
    const idx=Math.floor(Math.random()*9);
    holes[idx].classList.add('mole');
    holes[idx].textContent='🐹';
}

function startGame(){
    if(gameActive)return;
    updateGameProgress(GAME_ID);
    score=0;timeLeft=30;
    document.getElementById('score').textContent=0;
    document.getElementById('time').textContent=30;
    document.getElementById('message').textContent='⚡ GO!';
    document.getElementById('startBtn').textContent='⏳ Playing...';
    gameActive=true;
    // Clear old moles
    holes.forEach(h=>{h.classList.remove('mole');h.textContent='';});
    // Start timer
    timerInterval=setInterval(()=>{
        timeLeft--;
        document.getElementById('time').textContent=timeLeft;
        if(timeLeft<=0){
            endGame();
        }
    },1000);
    // Spawn moles
    spawnMole();
    moleInterval=setInterval(spawnMole,800);
}

function endGame(){
    gameActive=false;
    clearInterval(timerInterval);
    clearInterval(moleInterval);
    holes.forEach(h=>{h.classList.remove('mole');h.textContent='';});
    if(score>highScore){highScore=score;localStorage.setItem('whackHigh',highScore);}
    document.getElementById('highScore').textContent=highScore;
    document.getElementById('message').textContent='🎉 Game Over! Score: '+score;
    document.getElementById('startBtn').textContent='▶ Play Again';
    // Save progress
    saveGameState(GAME_ID,{score:score,highScore:highScore});
}

function saveGameState(gameId,data){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.gameStates)s.gameStates={};s.gameStates[gameId]={data:data};localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

document.getElementById('startBtn').addEventListener('click',startGame);
document.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' ')startGame();});

// Add CSS animation
const style=document.createElement('style');
style.textContent='@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(0.5)}100%{opacity:0;transform:translateY(-100px) scale(1.5)}}';
document.head.appendChild(style);

initGrid();
document.getElementById('highScore').textContent=highScore;
document.getElementById('message').textContent='🎯 Click Start to play!';
    
    

    // Add sound toggle to settings
    function addSoundToggle() {
        const settings = document.getElementById('settingsPanel');
        if (!settings) return;
        const item = document.createElement('div');
        item.className = 'settings-item';
        item.innerHTML = `
            <span class="label">🔊 Sound Effects</span>

        `;

        document.getElementById('soundToggle').addEventListener('click', function() {

    // Minigame: Quick Tap Challenge
    function startQuickTap() {
        if (document.getElementById('minigameOverlay')) return;
        const overlay = document.createElement('div');
        overlay.id = 'minigameOverlay';
        overlay.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;

            flex-direction: column; padding: 20px;

        `;
        overlay.innerHTML = `
            <div style="background: #1a1a2e; border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; border: 2px solid rgba(255,215,0,0.1);">
                <h2 style="color: #ffd700; margin-bottom: 10px;">🎯 Quick Tap Challenge</h2>
                <p style="color: #888; margin-bottom: 15px;">Tap as fast as you can!</p>
                <div style="font-size: 72px; margin: 15px 0;" id="tapCounter">0</div>
                <div style="font-size: 24px; color: #ff6b6b; margin-bottom: 10px;" id="tapTimer">3s</div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="tapBtn" style="
                        background: linear-gradient(135deg, #ffd700, #f5a623);
                        border: none; padding: 15px 40px; border-radius: 30px;
                        font-weight: 700; font-size: 18px; color: #1a1a2e;
                        cursor: pointer; font-family: 'Segoe UI', sans-serif;
                    ">👆 TAP!</button>
                    <button onclick="this.closest('#minigameOverlay').remove()" style="
                        background: rgba(255,255,255,0.05);
                        border: 1px solid rgba(255,255,255,0.1);
                        padding: 15px 20px; border-radius: 30px;
                        color: #888; cursor: pointer; font-size: 14px;
                        font-family: 'Segoe UI', sans-serif;
                    ">✕ Close</button>
                </div>
                <div id="tapResult" style="margin-top: 10px; color: #7cf5b0; font-weight: 700;"></div>
            </div>
        `;
        document.body.appendChild(overlay);

        let taps = 0;
        let timeLeft = 3;
        let active = true;

        const tapBtn = document.getElementById('tapBtn');
        const counter = document.getElementById('tapCounter');
        const timer = document.getElementById('tapTimer');
        const result = document.getElementById('tapResult');

        tapBtn.addEventListener('click', function() {
            if (!active) return;
            taps++;
            counter.textContent = taps;
            playClick();
            this.style.transform = 'scale(0.9)';
            setTimeout(() => this.style.transform = '', 100);
        });

        const interval = setInterval(() => {
            timeLeft--;
            timer.textContent = timeLeft + 's';
            if (timeLeft <= 0) {
                clearInterval(interval);
                active = false;
                tapBtn.disabled = true;
                tapBtn.style.opacity = '0.5';
                const reward = taps * 50;
                result.textContent = '🏆 You tapped ' + taps + ' times! +' + reward + ' points!';
                playWin();
                // Add points if game supports it
                if (typeof points !== 'undefined') {
                    points += reward;
                    if (typeof updateUI === 'function') updateUI();
                    if (typeof saveGame === 'function') saveGame();
                }
                setTimeout(() => {
                    overlay.querySelector('button:last-child').click();
                }, 3000);
            }
        }, 1000);

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = '@keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }';
        document.head.appendChild(style);
    }

    // Add minigame button to games
    function addMinigameButton() {
        const container = document.querySelector('.container') || document.querySelector('#app');
        if (!container) return;
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.style.cssText = `
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white; border: none; padding: 10px 20px;
            border-radius: 30px; font-weight: 700; font-size: 13px;
            cursor: pointer; margin: 5px;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
        `;
        btn.textContent = '🎯 Quick Tap Challenge';
        btn.onmouseover = function() { this.style.transform = 'scale(1.05)'; };
        btn.onmouseout = function() { this.style.transform = ''; };
        btn.onclick = startQuickTap;
        container.appendChild(btn);
    }

    // Initialize sound and minigame
    document.addEventListener('DOMContentLoaded', function() {
        // Add sound toggle if settings exist
        setTimeout(addSoundToggle, 100);
        // Add minigame button
        setTimeout(addMinigameButton, 200);
    });
    // ============================================================
    // ACHIEVEMENT POPUP SYSTEM - WORKS EVERYWHERE
    // ============================================================
    
    // Check achievements and show popup
    function checkAchievements() {
        try {
            const progress = JSON.parse(localStorage.getItem('launchpad_progress') || '{"games":{},"totalXp":0,"gamesPlayed":0}');
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            let newAchievements = [];

            // First game
            if (progress.gamesPlayed >= 1 && !unlocked.includes('first_game')) {
                newAchievements.push('first_game');
                showAchievementPopup('🎮', 'First Game!', 'Played your first game!');
            }

            // Game master (10 games)
            if (progress.gamesPlayed >= 10 && !unlocked.includes('game_master')) {
                newAchievements.push('game_master');
                showAchievementPopup('👑', 'Game Master!', 'Played 10 games!');
            }

            // XP collector
            if (progress.totalXp >= 100 && !unlocked.includes('xp_collector')) {
                newAchievements.push('xp_collector');
                showAchievementPopup('⭐', 'XP Collector!', 'Earned 100 XP!');
            }

            // Level up
            const level = Math.floor((progress.totalXp || 0) / 100) + 1;
            if (level >= 5 && !unlocked.includes('level_up')) {
                newAchievements.push('level_up');
                showAchievementPopup('🏅', 'Level Up!', 'Reached Level 5!');
            }

            // Save new achievements
            if (newAchievements.length > 0) {
                const all = [...unlocked, ...newAchievements];
                localStorage.setItem('launchpad_achievements', JSON.stringify(all));
                updateAchievementCount();
            }

            return newAchievements;
        } catch(e) { return []; }
    }

    // Show achievement popup
    function showAchievementPopup(emoji, title, desc) {
        try { playAchievement(); } catch(e) {}
        // Check if popup already exists
        let popup = document.getElementById('achievementPopupGlobal');
        if (!popup) {
            popup = document.createElement('div');
            popup.id = 'achievementPopupGlobal';
            popup.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(18, 16, 30, 0.96);
                backdrop-filter: blur(20px);
                border: 2px solid #7cf5b0;
                border-radius: 16px;
                padding: 16px 24px;
                max-width: 350px;
                z-index: 99999;
                box-shadow: 0 20px 60px rgba(0,0,0,0.6);
                display: none;
                animation: slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
                color: #d0e8f0;
                font-family: 'Segoe UI', Roboto, sans-serif;
            `;
            document.body.appendChild(popup);
            
            // Add animation styles
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideInRight {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes slideOutRight {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
                @keyframes pulseGold {
                    0%, 100% { box-shadow: 0 0 20px rgba(124, 245, 176, 0.1); }
                    50% { box-shadow: 0 0 40px rgba(124, 245, 176, 0.3); }
                }
            `;
            document.head.appendChild(style);
        }

        // Fill popup content
        popup.innerHTML = `
            <div style="display:flex;align-items:center;gap:14px;">
                <div style="font-size:2.8rem;line-height:1;">${emoji}</div>
                <div>
                    <div style="color:#7cf5b0;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;">🏆 Achievement Unlocked!</div>
                    <div style="color:#f0f8ff;font-weight:700;font-size:1.1rem;">${title}</div>
                    <div style="color:#8899aa;font-size:0.85rem;">${desc}</div>
                </div>
            </div>
            <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end;">
                <button onclick="document.getElementById('achievementPopupGlobal').style.display='none'" style="
                    background:rgba(255,255,255,0.05);
                    border:1px solid rgba(255,255,255,0.1);
                    color:#8899aa;
                    padding:4px 14px;
                    border-radius:20px;
                    cursor:pointer;
                    font-size:0.7rem;
                    font-family:'Segoe UI',sans-serif;
                ">Dismiss</button>
            </div>
        `;

        // Show popup
        popup.style.display = 'block';
        popup.style.animation = 'slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';

        // Auto-hide after 6 seconds
        clearTimeout(popup._timeout);
        popup._timeout = setTimeout(() => {
            popup.style.animation = 'slideOutRight 0.4s ease-in';
            setTimeout(() => {
                popup.style.display = 'none';
                popup.style.animation = '';
            }, 400);
        }, 6000);

        // Play sound
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [523, 659, 784, 1047].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }, i * 120);
            });
        } catch(e) {}
    }

    // Update achievement count in stats
    function updateAchievementCount() {
        try {
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            const countEl = document.getElementById('achievementCount');
            if (countEl) countEl.textContent = unlocked.length;
        } catch(e) {}
    }

    // Check achievements every 10 seconds
    setInterval(checkAchievements, 10000);

    // Also check on page load
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(checkAchievements, 1000);
    });

    // Check when progress updates
    const origSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        origSetItem.apply(this, arguments);
        if (key === 'launchpad_progress') {
            setTimeout(checkAchievements, 500);
        }
    };
    // ============================================================
    // UNIVERSAL SAVE SYSTEM - Auto & Manual Save
    // ============================================================
    
    // Save system variables
    let saveEnabled = true;
    let saveInterval = null;
    let lastSaveTime = 'Never';
    
    // ============================================================
    // SAVE FUNCTIONS
    // ============================================================
    function saveGameData(gameId, data) {
        try {
            const saves = JSON.parse(localStorage.getItem('gameSaves') || '{}');
            saves[gameId] = {
                data: data,
                timestamp: Date.now()
            };
            localStorage.setItem('gameSaves', JSON.stringify(saves));
            showSaveFeedback('✅ Saved!');
            return true;
        } catch(e) {
            console.log('Save error:', e);
            return false;
        }
    }
    
    function loadGameData(gameId) {
        try {
            const saves = JSON.parse(localStorage.getItem('gameSaves') || '{}');
            if (saves[gameId]) {
                return saves[gameId].data;
            }
        } catch(e) {
            console.log('Load error:', e);
        }
        return null;
    }
    
    function showSaveFeedback(message) {
        let indicator = document.getElementById('saveIndicator');
        if (!indicator) {
            indicator = document.createElement('div');
            indicator.id = 'saveIndicator';
            indicator.style.cssText = `
                text-align: center;
                font-size: 11px;
                color: #666;
                padding: 6px 0;
                margin-top: 8px;
                border-top: 1px solid rgba(255,255,255,0.05);
                transition: color 0.3s;
                font-family: 'Segoe UI', sans-serif;
            `;
            const container = document.querySelector('.container') || document.querySelector('#app') || document.body;
            container.appendChild(indicator);
        }
        
        indicator.textContent = '💾 ' + message;
        indicator.style.color = '#7cf5b0';
        setTimeout(() => {
            indicator.style.color = '#666';
            const now = new Date();
            indicator.textContent = '💾 Auto-saved at ' + now.toLocaleTimeString();
        }, 2000);
    }
    
    function manualSave() {
        if (typeof saveGame === 'function') {
            saveGame();
            showSaveFeedback('✅ Manually saved!');
            return true;
        }
        return false;
    }
    
    // ============================================================
    // AUTO-SAVE
    // ============================================================
    function startAutoSave(interval = 5000) {
        if (saveInterval) clearInterval(saveInterval);
        
        saveInterval = setInterval(() => {
            if (typeof saveGame === 'function') {
                saveGame();
            }
        }, interval);
        
        console.log('💾 Auto-save started (every ' + (interval/1000) + 's)');
    }
    
    // ============================================================
    // KEYBOARD SHORTCUT - Ctrl+S
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            if (typeof manualSave === 'function') {
                manualSave();
            }
        }
    });
    
    // ============================================================
    // SAVE ON PAGE CLOSE
    // ============================================================
    window.addEventListener('beforebeforebeforeunload', function() {
        if (typeof saveGame === 'function') {
            saveGame();
        }
    });
    
    // ============================================================
    // SAVE INDICATOR STYLES
    // ============================================================
    const saveStyles = document.createElement('style');
    saveStyles.textContent = `
        #saveIndicator {
            text-align: center;
            font-size: 11px;
            color: #666;
            padding: 6px 0;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
            transition: color 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }
        #saveIndicator.saving {
            color: #7cf5b0 !important;
        }
        .save-btn {
            background: rgba(79,195,247,0.08);
            border: 1px solid rgba(79,195,247,0.12);
            color: #4fc3f7;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
            margin: 2px;
        }
        .save-btn:hover {
            background: rgba(79,195,247,0.15);
        }
    `;
    document.head.appendChild(saveStyles);
    
    // ============================================================
    // ADD MANUAL SAVE BUTTON
    // ============================================================
    function addSaveButton() {
        const container = document.querySelector('.container') || document.querySelector('#app');
        if (!container) return;
        
        // Check if button already exists
        if (document.getElementById('manualSaveBtn')) return;
        
        const btn = document.createElement('button');
        btn.id = 'manualSaveBtn';
        btn.className = 'save-btn';
        btn.textContent = '💾 Manual Save';
        btn.onclick = function() {
            if (typeof manualSave === 'function') {
                manualSave();
            }
        };
        
        // Find footer or add at bottom
        const footer = container.querySelector('.footer');
        if (footer) {
            const btnContainer = document.createElement('div');
            btnContainer.style.cssText = 'margin-top: 6px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;';
            btnContainer.appendChild(btn);
            footer.appendChild(btnContainer);
        } else {
            container.appendChild(btn);
        }
    }
    
    // ============================================================
    // INIT
    // ============================================================
    console.log('💾 Save system loaded!');
    console.log('⌨️  Press Ctrl+S to save manually');
    console.log('💾 Auto-save every 5 seconds');
    
    // Add save button when page loads
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(addSaveButton, 500);
        if (typeof startAutoSave === 'function') {
            startAutoSave(5000);
        }
    });
    
    // Also run immediately if DOM already loaded
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(addSaveButton, 500);
        if (typeof startAutoSave === 'function') {
            startAutoSave(5000);
        }
    }
// ============================================================
// AUTO-REFRESH ON PAGE LOAD (Ctrl+Shift+R effect)
// ============================================================

// Check if this is the first time loading
function checkAndRefresh() {
    const pageId = window.location.pathname.split('/').pop();
    const key = 'refresh_' + pageId;
    
    // Check if we already refreshed this session
    if (sessionStorage.getItem(key) === 'true') {
        console.log('🔄 Already refreshed this session');
        return;
    }
    
    // Mark as refreshed
    sessionStorage.setItem(key, 'true');
    
    // Show loading message
    const container = document.querySelector('.container') || document.querySelector('#app') || document.body;
    const msg = document.createElement('div');
    msg.id = 'refreshMessage';
    msg.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.85);
        color: #7cf5b0;
        padding: 20px 40px;
        border-radius: 16px;
        font-size: 18px;
        font-weight: 700;
        z-index: 99999;
        font-family: 'Segoe UI', sans-serif;
        text-align: center;
        border: 2px solid #4fc3f7;
        box-shadow: 0 0 60px rgba(79,195,247,0.2);
    `;
    msg.innerHTML = `
        <div style="font-size: 48px; margin-bottom: 10px;">🔄</div>
        <div>Refreshing game...</div>
        <div style="font-size: 12px; color: #666; margin-top: 8px;">Loading latest version</div>
    `;
    document.body.appendChild(msg);
    
    // Perform a hard refresh (Ctrl+Shift+R equivalent)
    setTimeout(() => {
        // Clear all caches
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) {
                    caches.delete(name);
                }
            });
        }
        
        // Force reload with cache-buster
        const url = window.location.href.split('?')[0] + '?t=' + Date.now();
        window.location.replace(url);
    }, 1000);
}

// Run on page load
if (document.readyState === 'complete') {
    checkAndRefresh();
} else {
    document.addEventListener('DOMContentLoaded', checkAndRefresh);
}

// Also force refresh if user manually clicks
console.log('🔄 Auto-refresh ready - Ctrl+Shift+R will force reload');
</script>

        // Pause or save state
        console.log('Page hidden – auto-save triggered');
    }
});
window.addEventListener('beforeunload', function(e) {
    // Final cleanup before unload
    console.log('Page unloading – saving state');
});
</script>
