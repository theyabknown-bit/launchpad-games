<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 Black Hole Escape</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1a26; color: #d0e8f0; font-family: 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .back-btn { position: fixed; top: 20px; left: 20px; background: #1a3344; color: #4fc3f7; padding: 12px 20px; border: none; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; z-index: 100; }
        .back-btn:hover { background: #2a4a5e; transform: translateX(-5px); }
        .container { max-width: 500px; width: 100%; text-align: center; margin-top: 60px; }
        h1 { color: #4fc3f7; font-size: 2.5rem; margin-bottom: 10px; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 10px 20px; border-radius: 10px; min-width: 80px; border: 1px solid #2a4a5e; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.2rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.7rem; text-transform: uppercase; }
        .black-hole { font-size: 8rem; margin: 15px 0; display: block; animation: spin 10s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { background: #4fc3f7; color: #0b1a26; border: none; padding: 12px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin: 5px; }
        .btn:hover { background: #7cf5b0; }
        .btn-escape { background: linear-gradient(135deg, #ff6b6b, #c0392b); color: white; }
        .btn-escape:hover { background: linear-gradient(135deg, #c0392b, #78281f); }
        .message { font-size: 1.2rem; min-height: 30px; color: #ffd93d; margin: 10px 0; }
    </style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-circle" style="color:#6c5ce7;"></i> Black Hole Escape</h1>
    <div class="stats">
        <div class="stat-box"><span id="escapes">0</span><span class="label">Escapes</span></div>
        <div class="stat-box"><span id="attempts">0</span><span class="label">Attempts</span></div>
    </div>
    <span class="black-hole" id="blackHoleEmoji">🌀</span>
    <div>
        <button class="btn btn-escape" id="escapeBtn">🚀 Escape!</button>
        <button class="btn" id="resetBtn">🔄 Reset</button>
    </div>
    <div class="message" id="message">🌀 Escape the black hole!</div>
</div>
<script>
    // ============================================================
    // FIXED SOUND SYSTEM - WORKS ON FIRST CLICK
    // ============================================================
    let soundEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;

    function unlockAudio() {
        if (audioUnlocked) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioUnlocked = true;
            console.log('🔊 Audio unlocked!');
        } catch(e) { console.log('Audio error:', e); }
    }

    // Unlock audio on any click
    document.addEventListener('click', unlockAudio, { once: false });
    document.addEventListener('touchstart', unlockAudio, { once: false });
    document.addEventListener('keydown', unlockAudio, { once: false });

    function getAudioCtx() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playTone(frequency, duration = 150, type = 'sine') {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration / 1000);
        } catch(e) { console.log('Play error:', e); }
    }

    function playClick() { playTone(600, 80); }
    function playWin() { 
        playTone(523, 150); 
        setTimeout(() => playTone(659, 150), 150); 
        setTimeout(() => playTone(784, 200), 300); 
    }
    function playLose() { 
        playTone(300, 200); 
        setTimeout(() => playTone(200, 300), 200); 
    }
    function playCorrect() { playTone(800, 100); }
    function playWrong() { playTone(250, 200); }
    function playLevelUp() { 
        playTone(440, 100); 
        setTimeout(() => playTone(523, 100), 100); 
        setTimeout(() => playTone(659, 150), 200); 
    }
let escapes = 0, attempts = 0;

function escape() {
    attempts++;
    const chance = Math.random();
    if (chance > 0.4) {
        escapes++;
        document.getElementById('message').textContent = '🚀 ESCAPED! +1 escape!';
        document.getElementById('blackHoleEmoji').textContent = '⭐';
        setTimeout(() => document.getElementById('blackHoleEmoji').textContent = '🌀', 500);
    } else {
        document.getElementById('message').textContent = '💀 Pulled back in! Try again!';
    }
    updateUI();
}

function resetGame() {
    escapes = 0; attempts = 0;
    document.getElementById('message').textContent = '🔄 Reset!';
    updateUI();
}

function updateUI() {
    document.getElementById('escapes').textContent = escapes;
    document.getElementById('attempts').textContent = attempts;
}

document.getElementById('escapeBtn').addEventListener('click', escape);
document.getElementById('resetBtn').addEventListener('click', resetGame);
updateUI();
    
    

    // Add sound toggle to settings
    function addSoundToggle() {
        const settings = document.getElementById('settingsPanel');
        if (!settings) return;
        const item = document.createElement('div');
        item.className = 'settings-item';
        item.innerHTML = `
            <span class="label">🔊 Sound Effects</span>
            <div class="settings-toggle active" id="soundToggle"><div class="knob"></div></div>
        `;
        settings.appendChild(item);
        document.getElementById('soundToggle').addEventListener('click', function() {
            this.classList.toggle('active');
            soundEnabled = this.classList.contains('active');
            if (soundEnabled) playClick();
        });
    }

    // Minigame: Quick Tap Challenge
    function startQuickTap() {
        if (document.getElementById('minigameOverlay')) return;
        const overlay = document.createElement('div');
        overlay.id = 'minigameOverlay';
        overlay.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; padding: 20px;
            animation: fadeIn 0.3s ease;
        `;
        overlay.innerHTML = `
            <div style="background: #1a1a2e; border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; border: 2px solid rgba(255,215,0,0.1);">
                <h2 style="color: #ffd700; margin-bottom: 10px;">🎯 Quick Tap Challenge</h2>
                <p style="color: #888; margin-bottom: 15px;">Tap as fast as you can!</p>
                <div style="font-size: 72px; margin: 15px 0;" id="tapCounter">0</div>
                <div style="font-size: 24px; color: #ff6b6b; margin-bottom: 10px;" id="tapTimer">3s</div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="tapBtn" style="
                        background: linear-gradient(135deg, #ffd700, #f5a623);
                        border: none; padding: 15px 40px; border-radius: 30px;
                        font-weight: 700; font-size: 18px; color: #1a1a2e;
                        cursor: pointer; font-family: 'Segoe UI', sans-serif;
                    ">👆 TAP!</button>
                    <button onclick="this.closest('#minigameOverlay').remove()" style="
                        background: rgba(255,255,255,0.05);
                        border: 1px solid rgba(255,255,255,0.1);
                        padding: 15px 20px; border-radius: 30px;
                        color: #888; cursor: pointer; font-size: 14px;
                        font-family: 'Segoe UI', sans-serif;
                    ">✕ Close</button>
                </div>
                <div id="tapResult" style="margin-top: 10px; color: #7cf5b0; font-weight: 700;"></div>
            </div>
        `;
        document.body.appendChild(overlay);

        let taps = 0;
        let timeLeft = 3;
        let active = true;

        const tapBtn = document.getElementById('tapBtn');
        const counter = document.getElementById('tapCounter');
        const timer = document.getElementById('tapTimer');
        const result = document.getElementById('tapResult');

        tapBtn.addEventListener('click', function() {
            if (!active) return;
            taps++;
            counter.textContent = taps;
            playClick();
            this.style.transform = 'scale(0.9)';
            setTimeout(() => this.style.transform = '', 100);
        });

        const interval = setInterval(() => {
            timeLeft--;
            timer.textContent = timeLeft + 's';
            if (timeLeft <= 0) {
                clearInterval(interval);
                active = false;
                tapBtn.disabled = true;
                tapBtn.style.opacity = '0.5';
                const reward = taps * 50;
                result.textContent = '🏆 You tapped ' + taps + ' times! +' + reward + ' points!';
                playWin();
                // Add points if game supports it
                if (typeof points !== 'undefined') {
                    points += reward;
                    if (typeof updateUI === 'function') updateUI();
                    if (typeof saveGame === 'function') saveGame();
                }
                setTimeout(() => {
                    overlay.querySelector('button:last-child').click();
                }, 3000);
            }
        }, 1000);

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = '@keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }';
        document.head.appendChild(style);
    }

    // Add minigame button to games
    function addMinigameButton() {
        const container = document.querySelector('.container') || document.querySelector('#app');
        if (!container) return;
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.style.cssText = `
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white; border: none; padding: 10px 20px;
            border-radius: 30px; font-weight: 700; font-size: 13px;
            cursor: pointer; margin: 5px;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
        `;
        btn.textContent = '🎯 Quick Tap Challenge';
        btn.onmouseover = function() { this.style.transform = 'scale(1.05)'; };
        btn.onmouseout = function() { this.style.transform = ''; };
        btn.onclick = startQuickTap;
        container.appendChild(btn);
    }

    // Initialize sound and minigame
    document.addEventListener('DOMContentLoaded', function() {
        // Add sound toggle if settings exist
        setTimeout(addSoundToggle, 100);
        // Add minigame button
        setTimeout(addMinigameButton, 200);
    });
</script>
</body>
</html>
