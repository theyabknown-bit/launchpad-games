<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🎨 Color Match Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.status-bar .stat{color:#8899aa;font-size:.9rem}
.status-bar .stat span{color:#d0e8f0;font-weight:700}
.target-color{width:80px;height:80px;border-radius:50%;margin:15px auto;border:3px solid rgba(255,255,255,0.1);box-shadow:0 0 30px rgba(79,195,247,0.1)}
.grid{display:grid;gap:12px;max-width:300px;margin:15px auto}
.grid-4{grid-template-columns:repeat(2,1fr)}
.grid-6{grid-template-columns:repeat(3,1fr)}
.grid-9{grid-template-columns:repeat(3,1fr)}
.color-btn{aspect-ratio:1/1;border-radius:12px;border:2px solid rgba(255,255,255,0.05);cursor:pointer;transition:.15s}
.color-btn:hover{transform:scale(1.02)}
.color-btn:active{transform:scale(.95)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.difficulty-selector{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.difficulty-selector button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);font-size:.8rem;padding:6px 16px}
.difficulty-selector button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7}
#message{min-height:2rem;font-size:1rem}
.timer-bar{width:100%;height:6px;background:rgba(255,255,255,0.05);border-radius:3px;margin:10px 0;overflow:hidden}
.timer-bar .fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#7cf5b0);border-radius:3px;transition:width .3s linear;width:100%}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🎨 Color Match Pro</h1>
<div class="difficulty-selector"><button data-diff="easy">Easy</button><button data-diff="medium" class="active">Medium</button><button data-diff="hard">Hard</button></div>
<div class="status-bar"><div class="stat">🏆 Score: <span id="score">0</span></div><div class="stat">🏅 Best: <span id="bestScore">-</span></div><div class="stat">🔥 Combo: <span id="combo">0</span>x</div><div class="stat">✅ Matches: <span id="matches">0</span></div></div>
<div class="timer-bar"><div class="fill" id="timerFill"></div></div>
<div class="target-color" id="targetColor"></div>
<div class="grid" id="colorGrid"></div>
<div id="message">🎯 Tap the matching color!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),comboEl=document.getElementById('combo'),matchesEl=document.getElementById('matches'),targetEl=document.getElementById('targetColor'),gridEl=document.getElementById('colorGrid'),timerFill=document.getElementById('timerFill'),msgEl=document.getElementById('message');
const COLORS=['#ff6b6b','#ffd93d','#4fc3f7','#7cf5b0','#a29bfe','#fd79a8','#fdcb6e','#55efc4','#fab1a0','#81ecec','#ff7675','#74b9ff','#ffeaa7','#dfe6e9','#00b894','#e17055','#0984e3','#6c5ce7','#fdcb6e','#00cec9'];
let gridColors=[],targetColor='',score=0,bestScore=0,combo=0,matches=0,diff='medium',gameActive=!1,paused=!1,timerId=null,timeLeft=30,maxTime=30,currentTarget='';
(function load(){try{let s=JSON.parse(localStorage.getItem('colormatch_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';let d=localStorage.getItem('colormatch_difficulty')||'medium';diff=d;document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.classList.toggle('active',b.dataset.diff===diff)})}catch(e){}})();
function saveBest(){if(score>bestScore){bestScore=score;let s=JSON.parse(localStorage.getItem('colormatch_best')||'{}');s[diff]=score;localStorage.setItem('colormatch_best',JSON.stringify(s));bestEl.textContent=score}}
function getGridSize(){return{easy:4,medium:6,hard:9}[diff]||6}
function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function generateGrid(){let size=getGridSize();let pool=shuffleArray([...COLORS]);let selected=pool.slice(0,size);targetColor=selected[Math.floor(Math.random()*selected.length)];gridColors=shuffleArray([...selected]);renderGrid()}
function renderGrid(){targetEl.style.backgroundColor=targetColor;gridEl.className='grid grid-'+gridColors.length;gridEl.innerHTML='';gridColors.forEach(c=>{let btn=document.createElement('div');btn.className='color-btn';btn.style.backgroundColor=c;btn.addEventListener('click',()=>tapColor(c));gridEl.appendChild(btn)})}
function tapColor(c){if(!gameActive||paused)return;if(c===targetColor){combo++;score+=10*combo;matches++;scoreEl.textContent=score;comboEl.textContent=combo;matchesEl.textContent=matches;playSound('correct');msgEl.textContent='✅ Correct! +'+(10*combo)+' points!';saveBest();generateGrid();setTimeout(()=>{if(gameActive)generateGrid()},200)}else{combo=0;comboEl.textContent=combo;playSound('wrong');msgEl.textContent='❌ Wrong!';// flash red on target
targetEl.style.borderColor='#ff6b6b';setTimeout(()=>{targetEl.style.borderColor='rgba(255,255,255,0.1)'},300)}}
function startGame(){score=0;combo=0;matches=0;timeLeft=maxTime;gameActive=!0;paused=!1;document.getElementById('pauseLabel').textContent='Pause';scoreEl.textContent=score;comboEl.textContent=combo;matchesEl.textContent=matches;timerFill.style.width='100%';msgEl.textContent='🎯 Tap the matching color!';generateGrid();if(timerId)clearInterval(timerId);timerId=setInterval(()=>{if(!paused){timeLeft--;timerFill.style.width=(timeLeft/maxTime*100)+'%';if(timeLeft<=0){gameActive=!1;msgEl.textContent='⏰ Time\'s up! Score: '+score;playSound('gameover');saveBest()}}},1000)}
function togglePause(){if(!gameActive)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'🎯 Tap the matching color!';if(paused&&timerId)clearInterval(timerId);else if(!paused){timerId=setInterval(()=>{if(!paused){timeLeft--;timerFill.style.width=(timeLeft/maxTime*100)+'%';if(timeLeft<=0){gameActive=!1;msgEl.textContent='⏰ Time\'s up! Score: '+score;playSound('gameover');saveBest()}}},1000)}}
function resetGame(){if(timerId)clearInterval(timerId);gameActive=!1;paused=!1;score=0;combo=0;matches=0;scoreEl.textContent=score;comboEl.textContent=combo;matchesEl.textContent=matches;timerFill.style.width='100%';msgEl.textContent='🎯 Click Start to begin!';targetEl.style.backgroundColor='#333';gridEl.innerHTML='';document.getElementById('pauseLabel').textContent='Pause'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='correct'){o.frequency.value=800;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=1000},80);o.stop(c.currentTime+.15)}else if(type==='wrong'){o.frequency.value=300;g.gain.value=.06;o.start();o.stop(c.currentTime+.15)}else if(type==='gameover'){o.frequency.value=400;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=300},200);o.stop(c.currentTime+.4)}}catch(e){}}
document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.difficulty-selector button').forEach(x=>x.classList.remove('active'));this.classList.add('active');diff=this.dataset.diff;localStorage.setItem('colormatch_difficulty',diff);let s=JSON.parse(localStorage.getItem('colormatch_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';resetGame()})});
resetGame();console.log('🎨 Color Match Pro loaded');
</script></body></html>
