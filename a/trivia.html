<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Quiz · General Knowledge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e121a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(18,28,40,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid rgba(100,200,255,0.12);
      max-width: 650px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; }
    h1 i { color: #7fc9ff; margin-right: 10px; }
    .back { display: inline-block; margin-bottom: 1.2rem; color: #b0d4f0; text-decoration: none; background: #1a3045; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #2a5a7a; font-size: 0.9rem; }
    .back:hover { background: #2a4a6a; }
    .quiz-area { background: #0f172a; border-radius: 1.5rem; padding: 1.5rem; border: 2px solid #1e3347; margin: 1rem 0; min-height: 300px; }
    .question { color: white; font-size: 1.3rem; font-weight: 600; margin-bottom: 1rem; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .option-btn {
      background: #0a121a; border: 2px solid #1e3347; padding: 0.8rem;
      border-radius: 1rem; color: white; cursor: pointer;
      transition: 0.15s; font-size: 1rem;
    }
    .option-btn:hover:not(:disabled) { background: #1a3a5a; border-color: #4a8aaa; }
    .option-btn.correct { border-color: #7cf5b0; background: #1a4a3a; }
    .option-btn.wrong { border-color: #ff7a7a; background: #4a1a1a; }
    .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .stats { display: flex; justify-content: space-between; color: #9bbfd9; margin-top: 1rem; flex-wrap: wrap; gap: 0.8rem; }
    .stats span i { margin-right: 6px; }
    .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.6rem 1.5rem; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .btn:hover { background: #2a5a7a; }
    .message { margin-top: 0.8rem; padding: 0.7rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
    .message i { margin-right: 8px; }
    @media (max-width: 500px) { .options { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-brain"></i> Trivia Quiz</h1>
  <div class="quiz-area">
    <div class="question" id="questionDisplay">Loading...</div>
    <div class="options" id="optionsContainer"></div>
    <div class="stats">
      <span><i class="fas fa-star"></i> score: <span id="scoreDisplay">0</span></span>
      <span><i class="fas fa-list"></i> <span id="qNumDisplay">1</span>/10</span>
    </div>
  </div>
  <button class="btn" id="resetBtn"><i class="fas fa-rotate"></i> restart</button>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> answer the questions</div>
</div>
<script>
  const QUESTIONS = [
    { q: 'What is the capital of France?', options: ['London','Paris','Berlin','Madrid'], answer:1 },
    { q: 'Which planet is known as the Red Planet?', options: ['Venus','Jupiter','Mars','Saturn'], answer:2 },
    { q: 'What is the largest ocean on Earth?', options: ['Atlantic','Indian','Arctic','Pacific'], answer:3 },
    { q: 'Who painted the Mona Lisa?', options: ['Michelangelo','Leonardo da Vinci','Raphael','Donatello'], answer:1 },
    { q: 'What is the chemical symbol for water?', options: ['H2O','CO2','NaCl','HCl'], answer:0 },
    { q: 'Which country has the most people?', options: ['USA','India','China','Indonesia'], answer:2 },
    { q: 'What is the fastest land animal?', options: ['Lion','Cheetah','Horse','Leopard'], answer:1 },
    { q: 'How many continents are there?', options: ['5','6','7','8'], answer:2 },
    { q: 'What is the hardest natural substance?', options: ['Gold','Iron','Diamond','Platinum'], answer:2 },
    { q: 'Who developed the theory of relativity?', options: ['Newton','Einstein','Hawking','Galileo'], answer:1 }
  ];
  let current=0, score=0, answered=false, gameActive=true;
  const questionDisplay=document.getElementById('questionDisplay'), optionsContainer=document.getElementById('optionsContainer'), scoreDisplay=document.getElementById('scoreDisplay'), qNumDisplay=document.getElementById('qNumDisplay'), messageBox=document.getElementById('messageBox');
  function loadQuestion() {
    if(current>=QUESTIONS.length) { endGame(); return; }
    const q=QUESTIONS[current]; answered=false; gameActive=true;
    questionDisplay.textContent=q.q; qNumDisplay.textContent=current+1; scoreDisplay.textContent=score;
    optionsContainer.innerHTML = q.options.map((opt,i) =>
      `<button class="option-btn" data-index="${i}">${opt}</button>`
    ).join('');
    optionsContainer.querySelectorAll('.option-btn').forEach(btn => btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.index))));
    messageBox.innerHTML=`<i class="fas fa-question-circle"></i> Question ${current+1} of ${QUESTIONS.length}`; messageBox.className='message';
  }
  function selectAnswer(idx) {
    if(answered || !gameActive) return;
    answered=true; const q=QUESTIONS[current]; const btns=optionsContainer.querySelectorAll('.option-btn');
    btns.forEach((b,i) => { b.disabled=true; if(i===q.answer) b.classList.add('correct'); if(i===idx && i!==q.answer) b.classList.add('wrong'); });
    if(idx===q.answer) { score += 10 + Math.floor(score/10); messageBox.innerHTML=`<i class="fas fa-check-circle" style="color:#7cf5b0;"></i> correct! +${10+Math.floor(score/10)} pts`; }
    else { messageBox.innerHTML=`<i class="fas fa-times-circle" style="color:#ff7a7a;"></i> wrong! the answer was: ${q.options[q.answer]}`; }
    scoreDisplay.textContent=score;
    setTimeout(() => { current++; loadQuestion(); }, 1500);
  }
  function endGame() {
    gameActive=false; messageBox.innerHTML=`<i class="fas fa-trophy"></i> 🎉 QUIZ COMPLETE! Final score: ${score}`; messageBox.className='message win';
    optionsContainer.innerHTML='';
    questionDisplay.textContent='✅ All done!';
  }
  function resetGame() { current=0; score=0; gameActive=true; loadQuestion(); }
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  loadQuestion();
</script>
</body>
</html>
