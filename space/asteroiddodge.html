<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☄️ Asteroid Dodge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a26;
            color: #d0e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1a3344;
            color: #4fc3f7;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            font-size: 14px;
        }
        .back-btn:hover { background: #2a4a5e; transform: translateX(-5px); }
        .container { max-width: 500px; width: 100%; text-align: center; margin-top: 60px; }
        h1 { color: #4fc3f7; font-size: 2.5rem; margin-bottom: 4px; }
        .subtitle { color: #7cf5b0; font-size: 0.9rem; margin-bottom: 15px; }

        .stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 8px 16px; border-radius: 10px; min-width: 70px; border: 1px solid #2a4a5e; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.1rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.6rem; text-transform: uppercase; }

        canvas {
            background: #0f1f2e;
            border-radius: 20px;
            border: 2px solid #1a3344;
            touch-action: none;
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 1;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 200px;
            margin: 12px auto;
        }
        .controls button {
            padding: 12px;
            background: #1a3344;
            color: #d0e8f0;
            border: 2px solid #2a4a5e;
            border-radius: 10px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }
        .controls button:hover { background: #2a4a5e; border-color: #4fc3f7; }
        .controls button:active { transform: scale(0.92); }
        .controls .empty { visibility: hidden; }

        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start {
            background: linear-gradient(135deg, #4fc3f7, #1a6a8a);
            color: white;
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79,195,247,0.2); }
        .btn-reset {
            background: #1a3344;
            color: #d0e8f0;
            border: 2px solid #2a4a5e;
        }
        .btn-reset:hover { background: #2a4a5e; border-color: #ff6b6b; }

        .message { font-size: 1.1rem; min-height: 30px; color: #ffd93d; margin: 8px 0; font-weight: 600; }

        @media (max-width: 480px) {
            .container { margin-top: 50px; }
            h1 { font-size: 2rem; }
            .controls { max-width: 160px; gap: 5px; }
            .controls button { padding: 8px; font-size: 1.1rem; }
            .btn { padding: 8px 18px; font-size: 0.9rem; }
            .stats { gap: 10px; }
            .stat-box { padding: 6px 12px; min-width: 60px; }
            .back-btn { font-size: 12px; padding: 8px 12px; top: 10px; left: 10px; }
        }
    </style>
</head>
<body>

<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

<div class="container">
    <h1><i class="fas fa-meteor" style="color:#ff6b6b;"></i> Asteroid Dodge</h1>
    <p class="subtitle">☄️ Dodge the asteroids!</p>

    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="highScore">0</span><span class="label">Best</span></div>
        <div class="stat-box"><span id="destroyed">0</span><span class="label">💥 Destroyed</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <div class="empty"></div>
        <button id="upBtn">⬆</button>
        <div class="empty"></div>
        <button id="leftBtn">⬅</button>
        <button id="downBtn">⬇</button>
        <button id="rightBtn">➡</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-start" id="startBtn">▶ Start</button>
        <button class="btn btn-reset" id="resetBtn">🔄 Reset Score</button>
    </div>

    <div class="message" id="message">🎯 Dodge the asteroids!</div>
</div>

<script>
// ============================================================
// ASTEROID DODGER - SIMPLE WORKING VERSION
// ============================================================

// Canvas setup
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');

// Player
var player = { x: 185, y: 350, w: 30, h: 30 };

// Game state
var asteroids = [];
var score = 0;
var highScore = parseInt(localStorage.getItem('asteroidHigh')) || 0;
var destroyed = 0;
var gameActive = false;
var gameInterval = null;
var spawnInterval = null;

// Stars for background
var stars = [];
for (var i = 0; i < 50; i++) {
    stars.push({
        x: Math.random() * 400,
        y: Math.random() * 400,
        size: Math.random() * 2 + 0.5,
        brightness: Math.random() * 0.5 + 0.1
    });
}

// ============================================================
// DRAW
// ============================================================
function draw() {
    // Clear
    ctx.fillStyle = '#0f1f2e';
    ctx.fillRect(0, 0, 400, 400);

    // Draw stars
    for (var i = 0; i < stars.length; i++) {
        ctx.fillStyle = 'rgba(255,255,255,' + stars[i].brightness + ')';
        ctx.fillRect(stars[i].x, stars[i].y, stars[i].size, stars[i].size);
    }

    // Draw player
    ctx.shadowColor = '#4fc3f7';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#4fc3f7';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.shadowBlur = 0;

    // Draw player emoji
    ctx.font = '20px sans-serif';
    ctx.fillStyle = '#0b1a26';
    ctx.fillText('🚀', player.x + 4, player.y + 22);

    // Draw asteroids
    for (var i = 0; i < asteroids.length; i++) {
        var a = asteroids[i];
        ctx.shadowColor = a.color;
        ctx.shadowBlur = 20;
        ctx.fillStyle = a.color;
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Asteroid emoji
        ctx.font = (a.size * 0.8) + 'px sans-serif';
        ctx.fillStyle = '#0b1a26';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(a.emoji, a.x, a.y + 2);
    }
}

// ============================================================
// UPDATE
// ============================================================
function update() {
    // Move asteroids
    for (var i = 0; i < asteroids.length; i++) {
        asteroids[i].y += asteroids[i].speed;
    }

    // Remove off-screen asteroids
    asteroids = asteroids.filter(function(a) { return a.y < 420; });

    // Check collisions
    for (var i = 0; i < asteroids.length; i++) {
        var a = asteroids[i];
        if (a.x > player.x && a.x < player.x + player.w &&
            a.y > player.y && a.y < player.y + player.h) {
            endGame();
            return;
        }
    }

    draw();
}

// ============================================================
// SPAWN ASTEROID
// ============================================================
function spawnAsteroid() {
    if (!gameActive) return;
    var size = Math.random() * 20 + 10;
    var colors = ['#ff6b6b', '#ffd93d', '#ff9f43', '#a29bfe', '#4fc3f7', '#7cf5b0'];
    var emojis = ['☄️', '🪨', '💎', '⭐', '🔥', '💫'];
    asteroids.push({
        x: Math.random() * 370 + 15,
        y: -size,
        size: size,
        speed: Math.random() * 3 + 1.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        emoji: emojis[Math.floor(Math.random() * emojis.length)]
    });
}

// ============================================================
// START GAME
// ============================================================
function startGame() {
    if (gameActive) return;
    score = 0;
    destroyed = 0;
    asteroids = [];
    player = { x: 185, y: 350, w: 30, h: 30 };
    document.getElementById('score').textContent = 0;
    document.getElementById('highScore').textContent = highScore;
    document.getElementById('destroyed').textContent = 0;
    document.getElementById('message').textContent = '⚡ Playing! Dodge!';
    document.getElementById('startBtn').textContent = '⏳ Playing';
    gameActive = true;

    if (gameInterval) clearInterval(gameInterval);
    if (spawnInterval) clearInterval(spawnInterval);

    gameInterval = setInterval(update, 50);
    spawnInterval = setInterval(spawnAsteroid, 700);

    setTimeout(spawnAsteroid, 200);
}

// ============================================================
// END GAME
// ============================================================
function endGame() {
    gameActive = false;
    if (gameInterval) clearInterval(gameInterval);
    if (spawnInterval) clearInterval(spawnInterval);

    if (score > highScore) {
        highScore = score;
        localStorage.setItem('asteroidHigh', highScore);
        document.getElementById('message').textContent = '🎉 NEW HIGH SCORE: ' + highScore + '!';
    } else {
        document.getElementById('message').textContent = '💀 Game Over! Score: ' + score;
    }

    document.getElementById('highScore').textContent = highScore;
    document.getElementById('startBtn').textContent = '▶ Play Again';
    draw();
}

// ============================================================
// RESET SCORE
// ============================================================
function resetScore() {
    highScore = 0;
    localStorage.setItem('asteroidHigh', 0);
    document.getElementById('highScore').textContent = 0;
    document.getElementById('message').textContent = '🔄 High score reset!';
}

// ============================================================
// MOVE PLAYER
// ============================================================
function movePlayer(dx, dy) {
    if (!gameActive) return;
    player.x = Math.max(0, Math.min(400 - player.w, player.x + dx));
    player.y = Math.max(0, Math.min(400 - player.h, player.y + dy));
}

// ============================================================
// KEYBOARD CONTROLS
// ============================================================
document.addEventListener('keydown', function(e) {
    if (!gameActive) return;
    if (e.key === 'ArrowLeft') movePlayer(-20, 0);
    if (e.key === 'ArrowRight') movePlayer(20, 0);
    if (e.key === 'ArrowUp') movePlayer(0, -20);
    if (e.key === 'ArrowDown') movePlayer(0, 20);
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!gameActive) startGame(); }
});

// ============================================================
// BUTTON CONTROLS
// ============================================================
document.getElementById('leftBtn').addEventListener('click', function() { movePlayer(-20, 0); });
document.getElementById('rightBtn').addEventListener('click', function() { movePlayer(20, 0); });
document.getElementById('upBtn').addEventListener('click', function() { movePlayer(0, -20); });
document.getElementById('downBtn').addEventListener('click', function() { movePlayer(0, 20); });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resetBtn').addEventListener('click', resetScore);

// ============================================================
// INIT
// ============================================================
document.getElementById('highScore').textContent = highScore;
draw();
document.getElementById('message').textContent = '🎯 Dodge the asteroids!';
console.log('☄️ Asteroid Dodge loaded!');
console.log('⌨️ Arrow keys to move, Space to start');
</script>
</body>
</html>
