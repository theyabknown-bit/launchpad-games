<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🌀 Black Hole Escape Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
canvas{display:block;margin:15px auto;background:#0a0a1a;border-radius:16px;border:2px solid rgba(79,195,247,0.1);max-width:100%}
.status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.status-bar .stat{background:rgba(0,0,0,0.3);padding:6px 10px;border-radius:8px;border:1px solid rgba(79,195,247,0.05)}
.status-bar .stat .label{font-size:.7rem;color:#8899aa}
.status-bar .stat .value{font-weight:700;font-size:1.1rem}
.status-bar .stat .value.fuel{color:#ffd93d}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.difficulty-selector{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.difficulty-selector button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);font-size:.8rem;padding:6px 16px}
.difficulty-selector button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7}
#message{min-height:2rem;font-size:.9rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🌀 Black Hole Escape Pro</h1>
<div class="difficulty-selector"><button data-diff="easy">Easy</button><button data-diff="medium" class="active">Medium</button><button data-diff="hard">Hard</button></div>
<div class="status-bar"><div class="stat"><div class="label">📏 Distance</div><div class="value" id="distance">0</div></div><div class="stat"><div class="label">⛽ Fuel</div><div class="value fuel" id="fuel">100</div></div><div class="stat"><div class="label">🏆 Score</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">🏅 Best</div><div class="value" id="bestScore">-</div></div></div>
<canvas id="canvas" width="600" height="400"></canvas>
<div id="message">🌀 Use Arrow Keys or WASD to thrust away from the black hole!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const distEl=document.getElementById('distance'),fuelEl=document.getElementById('fuel'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),msgEl=document.getElementById('message');
const W=canvas.width,H=canvas.height;
let ship={x:300,y:200,vx:0,vy:0,size:12},bh={x:300,y:200,radius:40},fuel=100,maxFuel=100,score=0,bestScore=0,difficulty='medium',gameActive=!1,paused=!1,keys={},frame=0,thrust=!1,particles=[],pickups=[],debris=[],gameOver=!1,timerId=null;
(function load(){try{let s=JSON.parse(localStorage.getItem('blackhole_best')||'{}');bestScore=s[difficulty]||0;bestEl.textContent=bestScore||'-';let d=localStorage.getItem('blackhole_difficulty')||'medium';difficulty=d;document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.classList.toggle('active',b.dataset.diff===difficulty)})}catch(e){}})();
function saveBest(){if(score>bestScore){bestScore=score;let s=JSON.parse(localStorage.getItem('blackhole_best')||'{}');s[difficulty]=score;localStorage.setItem('blackhole_best',JSON.stringify(s));bestEl.textContent=score}}
function getConfig(){return{easy:{gravity:.008,fuelCost:.3,debrisSpawn:60},medium:{gravity:.015,fuelCost:.5,debrisSpawn:40},hard:{gravity:.025,fuelCost:.8,debrisSpawn:25}}[difficulty]||{gravity:.015,fuelCost:.5,debrisSpawn:40}}
function resetShip(){ship={x:W/2,y:H/2-80,vx:0,vy:0,size:12};fuel=maxFuel;score=0;gameOver=!1;particles=[];pickups=[];debris=[];frame=0;updateUI()}
function spawnPickup(){if(!gameActive||paused)return;let angle=Math.random()*Math.PI*2;let dist=60+Math.random()*150;pickups.push({x:bh.x+Math.cos(angle)*dist,y:bh.y+Math.sin(angle)*dist,size:8,type:'fuel',collected:!1})}
function spawnDebris(){if(!gameActive||paused)return;let config=getConfig();if(frame%config.debrisSpawn!==0)return;let angle=Math.random()*Math.PI*2;let dist=50+Math.random()*180;debris.push({x:bh.x+Math.cos(angle)*dist,y:bh.y+Math.sin(angle)*dist,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,size:6+Math.random()*10})}
function updateUI(){distEl.textContent=Math.round(Math.sqrt((ship.x-bh.x)**2+(ship.y-bh.y)**2));fuelEl.textContent=Math.round(fuel);scoreEl.textContent=Math.round(score);bestEl.textContent=bestScore||'-'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='thrust'){o.frequency.value=400;g.gain.value=.03;o.start();o.stop(c.currentTime+.05)}else if(type==='collect'){o.frequency.value=700;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=900},80);o.stop(c.currentTime+.15)}else if(type==='hit'){o.frequency.value=300;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=200},100);o.stop(c.currentTime+.2)}else if(type==='gameover'){o.frequency.value=400;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=300},150);o.stop(c.currentTime+.4)}}catch(e){}}
function update(){if(!gameActive||paused||gameOver)return;frame++;let config=getConfig();let dx=bh.x-ship.x,dy=bh.y-ship.y;let dist=Math.sqrt(dx*dx+dy*dy);let gravForce=config.gravity/(dist/100+0.5);ship.vx+=dx/dist*gravForce;ship.vy+=dy/dist*gravForce;if(thrust&&fuel>0){let speed=0.4;if(keys['w']||keys['W']||keys['ArrowUp']){ship.vy-=speed;fuel-=config.fuelCost}if(keys['s']||keys['S']||keys['ArrowDown']){ship.vy+=speed;fuel-=config.fuelCost}if(keys['a']||keys['A']||keys['ArrowLeft']){ship.vx-=speed;fuel-=config.fuelCost}if(keys['d']||keys['D']||keys['ArrowRight']){ship.vx+=speed;fuel-=config.fuelCost}if(keys['w']||keys['W']||keys['ArrowUp']||keys['s']||keys['S']||keys['ArrowDown']||keys['a']||keys['A']||keys['ArrowLeft']||keys['d']||keys['D']||keys['ArrowRight']){playSound('thrust');for(let i=0;i<3;i++){particles.push({x:ship.x+(Math.random()-.5)*10,y:ship.y+(Math.random()-.5)*10,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:20,size:2+Math.random()*3})}}}ship.x+=ship.vx;ship.y+=ship.vy;if(ship.x<0||ship.x>W||ship.y<0||ship.y>H){gameOver=!0;msgEl.textContent='💀 You flew too far! Game Over.';playSound('gameover');saveBest();return}if(dist<bh.radius+ship.size){gameOver=!0;msgEl.textContent='🌀 Sucked into the black hole! Game Over.';playSound('gameover');saveBest();return}if(fuel<=0){fuel=0;gameOver=!0;msgEl.textContent='💀 Out of fuel! Game Over.';playSound('gameover');saveBest();return}score+=Math.max(0,dist/10);if(frame%100===0)spawnPickup();spawnDebris();pickups.forEach(p=>{let d2=Math.sqrt((ship.x-p.x)**2+(ship.y-p.y)**2);if(d2<ship.size+p.size&&!p.collected){p.collected=!0;fuel=Math.min(maxFuel,fuel+20);score+=5;playSound('collect');updateUI()}});pickups=pickups.filter(p=>!p.collected);debris.forEach(d=>{let d2=Math.sqrt((ship.x-d.x)**2+(ship.y-d.y)**2);if(d2<ship.size+d.size){gameOver=!0;msgEl.textContent='💥 Hit by debris! Game Over.';playSound('hit');saveBest();return}});particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});updateUI()}
function draw(){ctx.clearRect(0,0,W,H);let grad=ctx.createRadialGradient(bh.x,bh.y,0,bh.x,bh.y,bh.radius*2);grad.addColorStop(0,'rgba(0,0,0,0.8)');grad.addColorStop(0.5,'rgba(79,195,247,0.05)');grad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);// Black hole
ctx.shadowColor='#4fc3f7';ctx.shadowBlur=30;let grd=ctx.createRadialGradient(bh.x,bh.y,0,bh.x,bh.y,bh.radius);grd.addColorStop(0,'#000');grd.addColorStop(0.5,'#1a2a3a');grd.addColorStop(1,'rgba(79,195,247,0.1)');ctx.fillStyle=grd;ctx.beginPath();ctx.arc(bh.x,bh.y,bh.radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(79,195,247,0.1)';ctx.lineWidth=1;for(let i=1;i<4;i++){ctx.beginPath();ctx.arc(bh.x,bh.y,bh.radius+i*15,0,Math.PI*2);ctx.stroke()}// Pickups
pickups.forEach(p=>{ctx.fillStyle='#ffd93d';ctx.shadowColor='#ffd93d';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}); // Debris
debris.forEach(d=>{ctx.fillStyle='#ff6b6b';ctx.shadowColor='#ff6b6b';ctx.shadowBlur=10;ctx.fillRect(d.x-d.size/2,d.y-d.size/2,d.size,d.size);ctx.shadowBlur=0}); // Particles
particles.forEach(p=>{ctx.fillStyle='rgba(79,195,247,'+(p.life/20)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}); // Ship
ctx.save();ctx.translate(ship.x,ship.y);ctx.shadowColor='#4fc3f7';ctx.shadowBlur=20;ctx.fillStyle='#4fc3f7';ctx.beginPath();ctx.moveTo(ship.size,0);ctx.lineTo(-ship.size*0.6,-ship.size*0.6);ctx.lineTo(-ship.size*0.6,ship.size*0.6);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#7cf5b0';ctx.beginPath();ctx.arc(ship.size*0.3,0,3,0,Math.PI*2);ctx.fill();ctx.restore(); // Thrust glow
if(thrust&&fuel>0){ctx.fillStyle='rgba(255,215,0,0.1)';ctx.beginPath();ctx.arc(ship.x-ship.size*0.8,ship.y,15,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(0,0,W,20)}
function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}
function startGame(){if(gameActive&&!gameOver){if(confirm('Restart?'))resetGame();else return}gameActive=!0;paused=!1;gameOver=!1;resetShip();msgEl.textContent='🌀 Escape the black hole!';document.getElementById('pauseLabel').textContent='Pause';if(timerId)clearInterval(timerId);timerId=setInterval(()=>{if(!paused&&gameActive){if(Math.random()<0.01)spawnPickup()}},5000);updateUI()}
function togglePause(){if(!gameActive)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'🌀 Keep thrusting!';if(paused&&timerId)clearInterval(timerId);else if(!paused&&gameActive){timerId=setInterval(()=>{if(!paused&&gameActive){if(Math.random()<0.01)spawnPickup()}},5000)}}
function resetGame(){gameActive=!1;paused=!1;gameOver=!0;if(timerId)clearInterval(timerId);resetShip();document.getElementById('pauseLabel').textContent='Pause';msgEl.textContent='🌀 Click Start to begin!';updateUI();saveBest()}
document.addEventListener('keydown',e=>{keys[e.key]=!0;if(e.key==='w'||e.key==='W'||e.key==='ArrowUp'||e.key==='s'||e.key==='S'||e.key==='ArrowDown'||e.key==='a'||e.key==='A'||e.key==='ArrowLeft'||e.key==='d'||e.key==='D'||e.key==='ArrowRight'){e.preventDefault();thrust=!0}});
document.addEventListener('keyup',e=>{keys[e.key]=!1;if(e.key==='p'||e.key==='P')togglePause();if(e.key==='r'||e.key==='R')resetGame();if(e.key==='w'||e.key==='W'||e.key==='ArrowUp'||e.key==='s'||e.key==='S'||e.key==='ArrowDown'||e.key==='a'||e.key==='A'||e.key==='ArrowLeft'||e.key==='d'||e.key==='D'||e.key==='ArrowRight'){thrust=Object.keys(keys).some(k=>['w','W','ArrowUp','s','S','ArrowDown','a','A','ArrowLeft','d','D','ArrowRight'].includes(k)&&keys[k])}});
document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.difficulty-selector button').forEach(x=>x.classList.remove('active'));this.classList.add('active');difficulty=this.dataset.diff;localStorage.setItem('blackhole_difficulty',difficulty);let s=JSON.parse(localStorage.getItem('blackhole_best')||'{}');bestScore=s[difficulty]||0;bestEl.textContent=bestScore||'-';resetGame()})});
resetShip();updateUI();gameLoop();console.log('🌀 Black Hole Escape Pro loaded');
</script></body></html>
