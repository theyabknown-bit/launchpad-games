<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🥁 Beat Bop Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.status-bar .stat{color:#8899aa;font-size:.9rem}
.status-bar .stat span{color:#d0e8f0;font-weight:700}
.target-zone{display:flex;justify-content:center;gap:20px;margin:20px 0}
.arrow-slot{width:80px;height:80px;border-radius:12px;border:3px solid rgba(79,195,247,0.1);background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:3rem;transition:.15s}
.arrow-slot.highlight{background:rgba(79,195,247,0.2);border-color:#4fc3f7;box-shadow:0 0 30px rgba(79,195,247,0.2)}
.arrow-slot.perfect{background:rgba(124,245,176,0.2);border-color:#7cf5b0;box-shadow:0 0 30px rgba(124,245,176,0.2)}
.arrow-slot.miss{background:rgba(255,107,107,0.2);border-color:#ff6b6b;box-shadow:0 0 30px rgba(255,107,107,0.2)}
.note-display{font-size:2.5rem;margin:10px 0;min-height:4rem;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.note-item{padding:4px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05)}
.note-item.active{background:rgba(79,195,247,0.1);border-color:#4fc3f7}
.note-item.hit{background:rgba(124,245,176,0.1);border-color:#7cf5b0}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.difficulty-selector{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.difficulty-selector button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);font-size:.8rem;padding:6px 16px}
.difficulty-selector button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7}
#message{min-height:2rem;font-size:1rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🥁 Beat Bop Pro</h1>
<div class="difficulty-selector"><button data-diff="easy">Easy</button><button data-diff="medium" class="active">Medium</button><button data-diff="hard">Hard</button></div>
<div class="status-bar"><div class="stat">🏆 Score: <span id="score">0</span></div><div class="stat">🏅 Best: <span id="bestScore">-</span></div><div class="stat">🔥 Combo: <span id="combo">0</span>x</div><div class="stat">🎯 Hits: <span id="hits">0</span>/<span id="total">0</span></div></div>
<div class="target-zone"><div class="arrow-slot" id="slotUp">⬆️</div><div class="arrow-slot" id="slotDown">⬇️</div><div class="arrow-slot" id="slotLeft">⬅️</div><div class="arrow-slot" id="slotRight">➡️</div></div>
<div class="note-display" id="noteDisplay">🎵 Press Start</div>
<div id="message">🥁 Press the arrow key when it reaches the target!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),comboEl=document.getElementById('combo'),hitsEl=document.getElementById('hits'),totalEl=document.getElementById('total'),noteDisplay=document.getElementById('noteDisplay'),msgEl=document.getElementById('message');
const slotUp=document.getElementById('slotUp'),slotDown=document.getElementById('slotDown'),slotLeft=document.getElementById('slotLeft'),slotRight=document.getElementById('slotRight');
const ARROWS=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
const ARROW_NAMES={ArrowUp:'⬆️',ArrowDown:'⬇️',ArrowLeft:'⬅️',ArrowRight:'➡️'};
const SLOTS={ArrowUp:slotUp,ArrowDown:slotDown,ArrowLeft:slotLeft,ArrowRight:slotRight};
let sequence=[],currentIndex=0,score=0,bestScore=0,combo=0,hits=0,total=0,diff='medium',gameActive=!1,paused=!1,gameOver=!1,currentKey=null,waitingForKey=!1,timeoutId=null,roundTimeout=null;
(function load(){try{let s=JSON.parse(localStorage.getItem('beatbop_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';let d=localStorage.getItem('beatbop_difficulty')||'medium';diff=d;document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.classList.toggle('active',b.dataset.diff===diff)})}catch(e){}})();
function saveBest(){if(score>bestScore){bestScore=score;let s=JSON.parse(localStorage.getItem('beatbop_best')||'{}');s[diff]=score;localStorage.setItem('beatbop_best',JSON.stringify(s));bestEl.textContent=score}}
function getConfig(){return{easy:{notes:10,speed:1500},medium:{notes:15,speed:1000},hard:{notes:20,speed:600}}[diff]||{notes:15,speed:1000}}
function generateSequence(){let config=getConfig();let seq=[];for(let i=0;i<config.notes;i++)seq.push(ARROWS[Math.floor(Math.random()*ARROWS.length)]);return seq}
function startGame(){sequence=generateSequence();currentIndex=0;score=0;combo=0;hits=0;total=sequence.length;gameActive=!0;paused=!1;gameOver=!1;document.getElementById('pauseLabel').textContent='Pause';scoreEl.textContent=score;comboEl.textContent=combo;hitsEl.textContent=hits;totalEl.textContent=total;msgEl.textContent='🥁 Watch the arrows...';showNote();waitingForKey=!1;clearTimeouts()}
function showNote(){if(!gameActive||gameOver||paused)return;if(currentIndex>=sequence.length){endGame();return}currentKey=sequence[currentIndex];let display=ARROW_NAMES[currentKey];noteDisplay.innerHTML='🎯 '+display;highlightSlot(currentKey);waitingForKey=!0;if(timeoutId)clearTimeout(timeoutId);let config=getConfig();timeoutId=setTimeout(()=>{if(waitingForKey&&gameActive&&!paused&&!gameOver){missKey()}},config.speed)}
function highlightSlot(key){Object.values(SLOTS).forEach(s=>s.className='arrow-slot');let slot=SLOTS[key];if(slot)slot.classList.add('highlight')}
function missKey(){if(!gameActive||gameOver||paused||!waitingForKey)return;waitingForKey=!1;combo=0;comboEl.textContent=combo;playSound('miss');msgEl.textContent='❌ Missed!';let slot=SLOTS[currentKey];if(slot){slot.classList.remove('highlight');slot.classList.add('miss');setTimeout(()=>slot.classList.remove('miss'),300)}currentIndex++;setTimeout(()=>{if(gameActive&&!paused&&!gameOver)showNote()},300)}
function handleKey(e){if(!gameActive||paused||gameOver||!waitingForKey)return;let key=e.key;if(key===currentKey){waitingForKey=!1;combo++;score+=10*combo;hits++;scoreEl.textContent=score;comboEl.textContent=combo;hitsEl.textContent=hits;playSound('hit');let slot=SLOTS[key];if(slot){slot.classList.remove('highlight');slot.classList.add('perfect');setTimeout(()=>slot.classList.remove('perfect'),300)}msgEl.textContent='✅ Hit! +'+(10*combo)+' points!';saveBest();currentIndex++;setTimeout(()=>{if(gameActive&&!paused&&!gameOver)showNote()},200)}else{// wrong key
playSound('wrong');msgEl.textContent='❌ Wrong key!';combo=0;comboEl.textContent=combo;let slot=SLOTS[key];if(slot){slot.classList.add('miss');setTimeout(()=>slot.classList.remove('miss'),300)}}}
document.addEventListener('keydown',handleKey);
function endGame(){gameActive=!1;gameOver=!0;clearTimeouts();msgEl.textContent='🎉 Complete! Score: '+score;playSound('gameover');saveBest();noteDisplay.textContent='🏁 Done!'}
function clearTimeouts(){if(timeoutId)clearTimeout(timeoutId);if(roundTimeout)clearTimeout(roundTimeout)}
function togglePause(){if(!gameActive||gameOver)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'🥁 Keep going!';if(paused){clearTimeouts()}else{if(!gameOver&&waitingForKey){let config=getConfig();timeoutId=setTimeout(()=>{if(waitingForKey&&gameActive&&!paused&&!gameOver)missKey()},config.speed)}}}
function resetGame(){clearTimeouts();gameActive=!1;gameOver=!1;paused=!1;waitingForKey=!1;sequence=[];currentIndex=0;score=0;combo=0;hits=0;total=0;scoreEl.textContent=score;comboEl.textContent=combo;hitsEl.textContent=hits;totalEl.textContent=total;noteDisplay.textContent='🎵 Press Start';msgEl.textContent='🥁 Press Start to begin!';document.getElementById('pauseLabel').textContent='Pause';Object.values(SLOTS).forEach(s=>s.className='arrow-slot')}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='hit'){o.frequency.value=800;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=1000},80);o.stop(c.currentTime+.15)}else if(type==='miss'){o.frequency.value=300;g.gain.value=.06;o.start();o.stop(c.currentTime+.15)}else if(type==='wrong'){o.frequency.value=400;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=300},100);o.stop(c.currentTime+.2)}else if(type==='gameover'){o.frequency.value=600;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=800},150);setTimeout(()=>{o.frequency.value=1000},300);o.stop(c.currentTime+.5)}}catch(e){}}
document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.difficulty-selector button').forEach(x=>x.classList.remove('active'));this.classList.add('active');diff=this.dataset.diff;localStorage.setItem('beatbop_difficulty',diff);let s=JSON.parse(localStorage.getItem('beatbop_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';resetGame()})});
resetGame();console.log('🥁 Beat Bop Pro loaded');
</script></body></html>
