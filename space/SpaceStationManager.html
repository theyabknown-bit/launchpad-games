<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛸 Space Station</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1a26; color: #d0e8f0; font-family: 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .back-btn { position: fixed; top: 20px; left: 20px; background: #1a3344; color: #4fc3f7; padding: 12px 20px; border: none; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; z-index: 100; }
        .back-btn:hover { background: #2a4a5e; transform: translateX(-5px); }
        .container { max-width: 500px; width: 100%; text-align: center; margin-top: 60px; }
        h1 { color: #4fc3f7; font-size: 2.5rem; margin-bottom: 10px; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 10px 20px; border-radius: 10px; min-width: 80px; border: 1px solid #2a4a5e; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.2rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.7rem; text-transform: uppercase; }
        .station-display { font-size: 6rem; margin: 15px 0; display: block; }
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .btn { background: #1a3344; color: #d0e8f0; border: 2px solid #2a4a5e; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn:hover { background: #2a4a5e; border-color: #4fc3f7; }
        .btn-primary { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        .btn-primary:hover { background: #7cf5b0; border-color: #7cf5b0; }
        .message { font-size: 1.2rem; min-height: 30px; color: #ffd93d; margin: 10px 0; }
    </style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-rocket" style="color:#4fc3f7;"></i> Space Station</h1>
    <div class="stats">
        <div class="stat-box"><span id="modules">0</span><span class="label">Modules</span></div>
        <div class="stat-box"><span id="crew">0</span><span class="label">Crew</span></div>
    </div>
    <span class="station-display" id="stationEmoji">🛸</span>
    <div class="btn-group">
        <button class="btn btn-primary" id="addModuleBtn">➕ Add Module</button>
        <button class="btn" id="addCrewBtn">👨‍🚀 Add Crew</button>
        <button class="btn" id="resetBtn">🔄 Reset</button>
    </div>
    <div class="message" id="message">🛸 Build your space station!</div>
</div>
<script>
let modules = 0, crew = 0;
const emojis = ['🛸', '🚀', '🛰️', '🌌'];

function updateUI() {
    document.getElementById('modules').textContent = modules;
    document.getElementById('crew').textContent = crew;
    const idx = Math.min(Math.floor(modules / 3), emojis.length - 1);
    document.getElementById('stationEmoji').textContent = emojis[idx];
}

function addModule() {
    modules++;
    document.getElementById('message').textContent = '🚀 Module added! Total: ' + modules;
    updateUI();
    if (modules >= 10) document.getElementById('message').textContent = '🌟 MEGA STATION!';
}

function addCrew() {
    if (crew < modules * 2) {
        crew++;
        document.getElementById('message').textContent = '👨‍🚀 Crew member added! Total: ' + crew;
    } else {
        document.getElementById('message').textContent = '❌ Not enough modules! Build more!';
    }
    updateUI();
}

function resetGame() {
    modules = 0; crew = 0;
    document.getElementById('message').textContent = '🔄 Station reset!';
    updateUI();
}

document.getElementById('addModuleBtn').addEventListener('click', addModule);
document.getElementById('addCrewBtn').addEventListener('click', addCrew);
document.getElementById('resetBtn').addEventListener('click', resetGame);
updateUI();
</script>
</body>
</html>
