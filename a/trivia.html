<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Trivia Pro</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .game-container { text-align: center; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .status-bar .stat { color: #8899aa; }
        .status-bar .stat span { color: #d0e8f0; font-weight: 700; }
        .question-area {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 16px;
            margin: 15px 0;
            min-height: 150px;
        }
        .question-area .question { font-size: 1.4rem; font-weight: 600; margin-bottom: 15px; }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .options button {
            padding: 12px;
            border-radius: 12px;
            border: 2px solid rgba(79,195,247,0.1);
            background: rgba(0,0,0,0.3);
            color: #d0e8f0;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .options button:hover { border-color: #4fc3f7; background: rgba(79,195,247,0.05); }
        .options button.correct { border-color: #7cf5b0; background: rgba(124,245,176,0.1); }
        .options button.wrong { border-color: #ff6b6b; background: rgba(255,107,107,0.1); }
        .options button:disabled { cursor: default; opacity: 0.6; }
        .timer-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
        }
        .timer-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #7cf5b0);
            border-radius: 3px;
            transition: width 0.3s linear;
            width: 100%;
        }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .controls button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); }
        .difficulty-selector { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
        .difficulty-selector button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; padding: 6px 16px; }
        .difficulty-selector button.active { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        #message { min-height: 2rem; font-size: 1rem; }
        .score-display { font-size: 1.2rem; color: #ffd93d; font-weight: 700; }
        .progress { font-size: 0.9rem; color: #8899aa; }
    </style>
</head>
<body>
<div class="game-container">
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    <h1 class="game-title">🧠 Trivia Pro</h1>

    <!-- Difficulty -->
    <div class="difficulty-selector">
        <button data-diff="easy">Easy</button>
        <button data-diff="medium" class="active">Medium</button>
        <button data-diff="hard">Hard</button>
    </div>

    <!-- Status -->
    <div class="status-bar">
        <div class="stat">🏆 Score: <span id="score">0</span></div>
        <div class="stat">🏅 Best: <span id="bestScore">-</span></div>
        <div class="stat">📊 <span id="questionCounter">0</span>/10</div>
    </div>

    <!-- Timer -->
    <div class="timer-bar"><div class="fill" id="timerFill"></div></div>

    <!-- Question -->
    <div class="question-area" id="questionArea">
        <div class="question" id="question">Click Start to begin!</div>
        <div class="options" id="options"></div>
    </div>

    <div id="message">💡 15 seconds per question. Answer fast for bonus points!</div>

    <div class="controls">
        <button onclick="startGame()"><i class="fas fa-play"></i> Start</button>
        <button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button>
        <button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button>
    </div>
</div>

<script>
// ============================================================
// TRIVIA PRO – 100+ questions, difficulty, timer, high-score
// ============================================================
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('bestScore');
const counterEl = document.getElementById('questionCounter');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const timerFill = document.getElementById('timerFill');
const msgEl = document.getElementById('message');

let questions = [];
let currentQ = 0;
let score = 0;
let bestScore = null;
let totalQuestions = 10;
let timer = null;
let timeLeft = 15;
let maxTime = 15;
let paused = false;
let gameOver = false;
let difficulty = 'medium';
let answerLocked = false;

// ---- Question Bank ----
const QUESTION_BANK = [
    { q: "What is the chemical symbol for water?", options: ["H2O", "CO2", "NaCl", "HCl"], correct: 0 },
    { q: "What is the speed of light approximately?", options: ["300,000 km/s", "150,000 km/s", "500,000 km/s", "1,000,000 km/s"], correct: 0 },
    { q: "What planet is known as the Red Planet?", options: ["Mars", "Venus", "Jupiter", "Saturn"], correct: 0 },
    { q: "What is the largest organ in the human body?", options: ["Liver", "Brain", "Skin", "Heart"], correct: 2 },
    { q: "What is the chemical formula for table salt?", options: ["NaCl", "KCl", "CaCO3", "NaOH"], correct: 0 },
    { q: "What is the powerhouse of the cell?", options: ["Nucleus", "Ribosome", "Mitochondria", "Golgi"], correct: 2 },
    { q: "What is the most abundant gas in Earth's atmosphere?", options: ["Oxygen", "Nitrogen", "CO2", "Argon"], correct: 1 },
    { q: "What is the hardest natural substance?", options: ["Gold", "Iron", "Diamond", "Platinum"], correct: 2 },
    { q: "How many bones are in the adult human body?", options: ["206", "208", "210", "212"], correct: 0 },
    { q: "What is the boiling point of water in Celsius?", options: ["90°C", "100°C", "110°C", "120°C"], correct: 1 },
    { q: "When did World War II end?", options: ["1944", "1945", "1946", "1947"], correct: 1 },
    { q: "Who was the first President of the USA?", options: ["Washington", "Adams", "Jefferson", "Lincoln"], correct: 0 },
    { q: "What ancient civilization built the pyramids?", options: ["Greek", "Egyptian", "Roman", "Persian"], correct: 1 },
    { q: "What year was the United Nations founded?", options: ["1943", "1944", "1945", "1946"], correct: 2 },
    { q: "Who discovered America in 1492?", options: ["Columbus", "Vespucci", "Magellan", "Drake"], correct: 0 },
    { q: "What was the longest war in history?", options: ["100 Years War", "Thirty Years War", "Vietnam War", "Cold War"], correct: 0 },
    { q: "Who was the last Pharaoh of Egypt?", options: ["Cleopatra", "Nefertiti", "Hatshepsut", "Ramesses"], correct: 0 },
    { q: "What ancient language was used to write the Bible?", options: ["Latin", "Greek", "Hebrew", "Aramaic"], correct: 2 },
    { q: "Where was the first known democracy?", options: ["Athens", "Rome", "Sparta", "Carthage"], correct: 0 },
    { q: "What empire was ruled by Genghis Khan?", options: ["Roman", "Mongol", "Ottoman", "Persian"], correct: 1 },
    { q: "Who wrote the Harry Potter books?", options: ["Rowling", "Tolkien", "Martin", "Pratchett"], correct: 0 },
    { q: "What is the name of the black panther in Marvel?", options: ["T'Challa", "M'Baku", "Killmonger", "Nakia"], correct: 0 },
    { q: "Who sang 'Shape of You'?", options: ["Beyoncé", "Ed Sheeran", "Justin Bieber", "Taylor Swift"], correct: 1 },
    { q: "What is the highest-grossing film of all time?", options: ["Avatar", "Titanic", "Avengers", "Star Wars"], correct: 0 },
    { q: "What is the name of the main character in The Witcher?", options: ["Geralt", "Ciri", "Yennefer", "Triss"], correct: 0 },
    { q: "Who created the game Minecraft?", options: ["Notch", "Jeb", "Dinnerbone", "Grumm"], correct: 0 },
    { q: "What is the name of the robot in Wall-E?", options: ["Wall-E", "EVE", "M-O", "BURN-E"], correct: 0 },
    { q: "Who played Iron Man in the MCU?", options: ["Downey Jr.", "Evans", "Hemsworth", "Ruffalo"], correct: 0 },
    { q: "What is the best-selling book series of all time?", options: ["Harry Potter", "Lord of the Rings", "Twilight", "Percy Jackson"], correct: 0 },
    { q: "Which band is known for the song 'Bohemian Rhapsody'?", options: ["Queen", "Led Zeppelin", "Pink Floyd", "The Beatles"], correct: 0 },
    { q: "What is the largest continent?", options: ["Asia", "Africa", "North America", "Europe"], correct: 0 },
    { q: "What is the longest river in the world?", options: ["Amazon", "Nile", "Yangtze", "Mississippi"], correct: 1 },
    { q: "What is the smallest country in the world?", options: ["Monaco", "Vatican", "San Marino", "Liechtenstein"], correct: 1 },
    { q: "What country has the most people?", options: ["China", "India", "USA", "Indonesia"], correct: 0 },
    { q: "What is the capital of France?", options: ["London", "Berlin", "Paris", "Rome"], correct: 2 },
    { q: "What desert is the largest in the world?", options: ["Sahara", "Gobi", "Kalahari", "Atacama"], correct: 0 },
    { q: "What ocean is the largest?", options: ["Pacific", "Atlantic", "Indian", "Arctic"], correct: 0 },
    { q: "What is the highest mountain in the world?", options: ["K2", "Everest", "Kangchenjunga", "Lhotse"], correct: 1 },
    { q: "What country has the most islands?", options: ["Indonesia", "Sweden", "Philippines", "Japan"], correct: 1 },
    { q: "What is the capital of Australia?", options: ["Sydney", "Melbourne", "Canberra", "Brisbane"], correct: 2 }
];

// Load best score
(function load() {
    try {
        const saved = JSON.parse(localStorage.getItem('trivia_best') || '{}');
        bestScore = saved[difficulty] || null;
        if (bestScore !== null) bestEl.textContent = bestScore;
        else bestEl.textContent = '-';
    } catch(e) {}
    const diff = localStorage.getItem('trivia_difficulty') || 'medium';
    difficulty = diff;
    document.querySelectorAll('.difficulty-selector button').forEach(b => {
        b.classList.toggle('active', b.dataset.diff === difficulty);
    });
})();

function saveBest(score) {
    if (bestScore === null || score > bestScore) {
        bestScore = score;
        const saved = JSON.parse(localStorage.getItem('trivia_best') || '{}');
        saved[difficulty] = score;
        localStorage.setItem('trivia_best', JSON.stringify(saved));
        bestEl.textContent = score;
    }
}

function getQuestions() {
    const shuffled = [...QUESTION_BANK];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, totalQuestions);
}

function startGame() {
    questions = getQuestions();
    currentQ = 0;
    score = 0;
    gameOver = false;
    paused = false;
    answerLocked = false;
    document.getElementById('pauseLabel').textContent = 'Pause';
    scoreEl.textContent = score;
    counterEl.textContent = `0/${totalQuestions}`;
    msgEl.textContent = '💡 Answer fast for bonus points!';
    showQuestion();
}

function showQuestion() {
    if (currentQ >= totalQuestions) {
        endGame();
        return;
    }
    answerLocked = false;
    const q = questions[currentQ];
    questionEl.textContent = q.q;
    optionsEl.innerHTML = '';
    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.dataset.idx = idx;
        btn.addEventListener('click', () => selectAnswer(idx));
        optionsEl.appendChild(btn);
    });
    counterEl.textContent = `${currentQ+1}/${totalQuestions}`;
    // Reset timer
    timeLeft = maxTime;
    timerFill.style.width = '100%';
    if (timer) clearInterval(timer);
    timer = setInterval(() => {
        if (paused) return;
        timeLeft--;
        const pct = (timeLeft / maxTime) * 100;
        timerFill.style.width = pct + '%';
        if (timeLeft <= 0) {
            clearInterval(timer);
            playSound('timeout');
            msgEl.textContent = '⏰ Time\'s up!';
            answerLocked = true;
            highlightCorrectAnswer();
            setTimeout(() => {
                currentQ++;
                showQuestion();
            }, 1000);
        }
    }, 1000);
}

function selectAnswer(idx) {
    if (answerLocked || paused || gameOver) return;
    answerLocked = true;
    clearInterval(timer);
    const q = questions[currentQ];
    const isCorrect = idx === q.correct;
    const bonus = Math.max(0, Math.floor(timeLeft / 3));
    if (isCorrect) {
        const points = 10 + bonus;
        score += points;
        scoreEl.textContent = score;
        playSound('correct');
        msgEl.textContent = `✅ Correct! +${points} points (bonus: +${bonus})`;
    } else {
        playSound('wrong');
        msgEl.textContent = `❌ Wrong! The answer was: ${q.options[q.correct]}`;
    }
    const buttons = optionsEl.querySelectorAll('button');
    buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.correct) btn.classList.add('correct');
        if (i === idx && !isCorrect) btn.classList.add('wrong');
    });
    setTimeout(() => {
        currentQ++;
        showQuestion();
    }, 1500);
}

function highlightCorrectAnswer() {
    const q = questions[currentQ];
    const buttons = optionsEl.querySelectorAll('button');
    buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.correct) btn.classList.add('correct');
    });
}

function endGame() {
    gameOver = true;
    clearInterval(timer);
    saveBest(score);
    questionEl.textContent = `🎉 Game Over! Final Score: ${score}`;
    optionsEl.innerHTML = '';
    msgEl.textContent = `🏆 Best Score: ${bestScore || score}`;
    playSound('win');
}

function togglePause() {
    if (gameOver) return;
    paused = !paused;
    document.getElementById('pauseLabel').textContent = paused ? 'Resume' : 'Pause';
    msgEl.textContent = paused ? '⏸️ Paused' : '💡 Answer fast!';
}

function resetGame() {
    clearInterval(timer);
    gameOver = true;
    startGame();
}

document.querySelectorAll('.difficulty-selector button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.difficulty-selector button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        difficulty = this.dataset.diff;
        localStorage.setItem('trivia_difficulty', difficulty);
        const speeds = { easy: 20, medium: 15, hard: 10 };
        maxTime = speeds[difficulty] || 15;
        const saved = JSON.parse(localStorage.getItem('trivia_best') || '{}');
        bestScore = saved[difficulty] || null;
        if (bestScore !== null) bestEl.textContent = bestScore;
        else bestEl.textContent = '-';
        resetGame();
    });
});

function playSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'correct') {
            osc.frequency.value = 800;
            gain.gain.value = 0.08;
            osc.start();
            setTimeout(() => { osc.frequency.value = 1000; }, 100);
            osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'wrong' || type === 'timeout') {
            osc.frequency.value = 300;
            gain.gain.value = 0.08;
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'win') {
            osc.frequency.value = 600;
            gain.gain.value = 0.1;
            osc.start();
            setTimeout(() => { osc.frequency.value = 800; }, 150);
            setTimeout(() => { osc.frequency.value = 1000; }, 300);
            osc.stop(ctx.currentTime + 0.5);
        }
    } catch(e) {}
}

const speeds = { easy: 20, medium: 15, hard: 10 };
maxTime = speeds[difficulty] || 15;
questionEl.textContent = 'Press "Start" to begin!';
msgEl.textContent = '💡 100+ questions, 3 difficulty levels.';
console.log('🧠 Trivia Pro loaded.');
</script>
</body>
</html>
