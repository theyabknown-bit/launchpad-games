<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Puzzle · 15 Puzzle</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e121a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(18,28,40,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid rgba(100,200,255,0.12);
      max-width: 550px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; }
    h1 i { color: #f5c87c; margin-right: 10px; }
    .back { display: inline-block; margin-bottom: 1.2rem; color: #b0d4f0; text-decoration: none; background: #1a3045; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #2a5a7a; font-size: 0.9rem; }
    .back:hover { background: #2a4a6a; }
    .puzzle-container {
      background: #0f172a;
      border-radius: 1.5rem;
      padding: 1.5rem;
      border: 2px solid #1e3347;
      margin: 1rem 0;
    }
    .grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; max-width: 400px; margin: 0 auto; }
    .tile {
      aspect-ratio: 1; background: #1a3a5a; border-radius: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: white;
      cursor: pointer; transition: 0.15s; user-select: none;
      border: 2px solid #2a5a7a;
    }
    .tile:hover:not(.empty) { background: #2a5a7a; transform: scale(1.02); }
    .tile.empty { background: transparent; border-color: transparent; cursor: default; }
    .tile.correct { border-color: #7cf5b0; box-shadow: 0 0 20px rgba(124,245,176,0.15); }
    .stats { display: flex; justify-content: space-between; color: #9bbfd9; margin-top: 1rem; flex-wrap: wrap; gap: 0.8rem; }
    .stats span i { margin-right: 6px; }
    .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.6rem 1.5rem; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .btn:hover { background: #2a5a7a; }
    .message { margin-top: 0.8rem; padding: 0.7rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
    .message i { margin-right: 8px; }
    .win { border-color: #7cf5b0; color: #7cf5b0; }
    @media (max-width: 500px) { .tile { font-size: 1.4rem; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-puzzle-piece"></i> Slide Puzzle</h1>
  <div class="puzzle-container">
    <div class="grid" id="gridContainer"></div>
    <div class="stats">
      <span><i class="fas fa-arrow-right"></i> moves: <span id="moveDisplay">0</span></span>
      <span><i class="fas fa-clock"></i> time: <span id="timerDisplay">0</span>s</span>
    </div>
  </div>
  <button class="btn" id="resetBtn"><i class="fas fa-rotate"></i> shuffle</button>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> slide tiles to order 1-15</div>
</div>
<script>
  const SIZE = 4, TOTAL = 16; let tiles=[], moves=0, time=0, gameActive=true, timerInterval=null, emptyIndex=15;
  const gridContainer=document.getElementById('gridContainer'), moveDisplay=document.getElementById('moveDisplay'), timerDisplay=document.getElementById('timerDisplay'), messageBox=document.getElementById('messageBox');
  function initTiles() { tiles=[]; for(let i=1;i<TOTAL;i++) tiles.push(i); tiles.push(0); }
  function shuffle() {
    let shuffled=false; let attempts=0;
    while(!shuffled && attempts<100) {
      initTiles(); for(let i=TOTAL-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [tiles[i],tiles[j]]=[tiles[j],tiles[i]]; }
      if(!isSolvable()) { attempts++; continue; }
      shuffled=true;
    }
    if(!shuffled) initTiles();
    emptyIndex=tiles.indexOf(0); moves=0; time=0; gameActive=true;
    if(timerInterval) clearInterval(timerInterval);
    timerInterval=setInterval(()=>{ if(gameActive){ time++; timerDisplay.textContent=time; } },1000);
    render();
    messageBox.innerHTML='<i class="fas fa-play"></i> slide tiles to order 1-15'; messageBox.className='message';
  }
  function isSolvable() {
    let inv=0; for(let i=0;i<TOTAL;i++) for(let j=i+1;j<TOTAL;j++) if(tiles[i]&&tiles[j]&&tiles[i]>tiles[j]) inv++;
    const rowFromBottom = 4 - Math.floor(tiles.indexOf(0)/4);
    return (inv + rowFromBottom) % 2 === 0;
  }
  function render() {
    gridContainer.innerHTML = tiles.map((v,i) => {
      const isCorrect = v === i+1 || (v===0 && i===15);
      return `<div class="tile ${v===0?'empty':''} ${isCorrect&&v!==0?'correct':''}" data-index="${i}">${v||''}</div>`;
    }).join('');
    moveDisplay.textContent=moves; timerDisplay.textContent=time;
    if(checkWin()) { gameActive=false; if(timerInterval) clearInterval(timerInterval); messageBox.innerHTML='<i class="fas fa-trophy"></i> 🎉 YOU WIN!'; messageBox.className='message win'; }
  }
  function checkWin() { for(let i=0;i<15;i++) if(tiles[i] !== i+1) return false; return true; }
  function getNeighbors(idx) { const r=Math.floor(idx/4), c=idx%4; const n=[]; if(r>0) n.push(idx-4); if(r<3) n.push(idx+4); if(c>0) n.push(idx-1); if(c<3) n.push(idx+1); return n; }
  function moveTile(idx) {
    if(!gameActive) return;
    const neighbors=getNeighbors(emptyIndex);
    if(!neighbors.includes(idx)) return;
    [tiles[emptyIndex], tiles[idx]] = [tiles[idx], tiles[emptyIndex]];
    emptyIndex=idx; moves++; render();
  }
  gridContainer.addEventListener('click', (e) => {
    const tile=e.target.closest('.tile'); if(!tile || tile.classList.contains('empty')) return;
    const idx=parseInt(tile.dataset.index); moveTile(idx);
  });
  document.addEventListener('keydown', (e) => {
    const dir = {ArrowUp:-4,ArrowDown:4,ArrowLeft:-1,ArrowRight:1}[e.key];
    if(dir) { e.preventDefault(); const idx=emptyIndex+dir; if(idx>=0&&idx<16&&Math.abs(idx%4-emptyIndex%4)<=1) moveTile(idx); }
  });
  document.getElementById('resetBtn').addEventListener('click', shuffle);
  shuffle();
</script>
</body>
</html>
