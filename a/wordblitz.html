<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🔤 Word Blitz Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.status-bar .stat{color:#8899aa;font-size:.9rem}
.status-bar .stat span{color:#d0e8f0;font-weight:700}
.word-display{font-size:3rem;font-weight:700;margin:20px 0;color:#d0e8f0;text-shadow:0 0 30px rgba(79,195,247,0.1)}
.input-area{display:flex;gap:10px;justify-content:center;margin:15px 0}
.input-area input{padding:12px 20px;border-radius:12px;border:2px solid rgba(79,195,247,0.1);background:rgba(0,0,0,0.3);color:#d0e8f0;font-size:1.2rem;width:200px;text-align:center}
.input-area button{padding:12px 20px;border-radius:12px;border:none;background:#4fc3f7;color:#0b1a26;font-weight:700;cursor:pointer}
.timer-bar{width:100%;height:6px;background:rgba(255,255,255,0.05);border-radius:3px;margin:10px 0;overflow:hidden}
.timer-bar .fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#7cf5b0);border-radius:3px;transition:width .1s linear;width:100%}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.difficulty-selector{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.difficulty-selector button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);font-size:.8rem;padding:6px 16px}
.difficulty-selector button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7}
#message{min-height:2rem;font-size:1rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🔤 Word Blitz Pro</h1>
<div class="difficulty-selector"><button data-diff="easy">Easy</button><button data-diff="medium" class="active">Medium</button><button data-diff="hard">Hard</button></div>
<div class="status-bar"><div class="stat">🏆 Score: <span id="score">0</span></div><div class="stat">🏅 Best: <span id="bestScore">-</span></div><div class="stat">🔥 Combo: <span id="combo">0</span>x</div><div class="stat">📊 Words: <span id="wordCount">0</span></div></div>
<div class="timer-bar"><div class="fill" id="timerFill"></div></div>
<div class="word-display" id="wordDisplay">Ready?</div>
<div class="input-area"><input type="text" id="wordInput" placeholder="Type the word..." autofocus><button onclick="submitWord()"><i class="fas fa-arrow-right"></i> Go</button></div>
<div id="message">🔤 Click Start to begin!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),comboEl=document.getElementById('combo'),wordCountEl=document.getElementById('wordCount'),wordDisplay=document.getElementById('wordDisplay'),input=document.getElementById('wordInput'),timerFill=document.getElementById('timerFill'),msgEl=document.getElementById('message');
const WORDS={animals:['cat','dog','fish','bird','lion','tiger','bear','wolf','fox','eagle','shark','whale','deer','moose','panda','koala','zebra','hippo','rhino','giraffe'],food:['pizza','pasta','sushi','taco','burger','fries','steak','bread','rice','beans','apple','banana','mango','peach','grape','melon','toast','salad','soup','curry'],colors:['red','blue','green','yellow','purple','orange','pink','black','white','brown','gold','gray','silver','navy','teal','coral','lime','olive','indigo','violet'],science:['atom','gene','cell','dna','cosmos','laser','magnet','robot','solar','quantum','fossil','nebula','proton','electron','neutron','molecule','gravity','orbit','photon','plasma'],sports:['run','swim','golf','tennis','soccer','basket','baseball','hockey','boxing','skiing','cycling','rowing','diving','karate','yoga','pilates','surfing','climbing','fencing','archery']};
const CATEGORY_KEYS=['animals','food','colors','science','sports'];
let words=[],currentWord='',score=0,bestScore=0,combo=0,wordCount=0,diff='medium',gameActive=!1,paused=!1,timerId=null,timeLeft=10,maxTime=10;
(function load(){try{let s=JSON.parse(localStorage.getItem('wordblitz_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';let d=localStorage.getItem('wordblitz_difficulty')||'medium';diff=d;document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.classList.toggle('active',b.dataset.diff===diff)})}catch(e){}})();
function saveBest(){if(score>bestScore){bestScore=score;let s=JSON.parse(localStorage.getItem('wordblitz_best')||'{}');s[diff]=score;localStorage.setItem('wordblitz_best',JSON.stringify(s));bestEl.textContent=score}}
function getWordPool(){let pool=[];CATEGORY_KEYS.forEach(k=>{pool=pool.concat(WORDS[k])});return pool}
function pickWord(){let pool=getWordPool();let len={easy:3,medium:5,hard:7}[diff];let filtered=pool.filter(w=>w.length>=len && w.length<=len+2);if(filtered.length===0)filtered=pool;return filtered[Math.floor(Math.random()*filtered.length)]}
function startGame(){score=0;combo=0;wordCount=0;gameActive=!0;paused=!1;document.getElementById('pauseLabel').textContent='Pause';scoreEl.textContent=score;comboEl.textContent=combo;wordCountEl.textContent=wordCount;msgEl.textContent='🔤 Type the word!';input.value='';input.disabled=!1;input.focus();nextWord()}
function nextWord(){if(!gameActive||paused)return;currentWord=pickWord();wordDisplay.textContent=currentWord;timeLeft=maxTime;timerFill.style.width='100%';input.value='';input.focus();if(timerId)clearInterval(timerId);timerId=setInterval(()=>{if(!paused){timeLeft--;timerFill.style.width=(timeLeft/maxTime*100)+'%';if(timeLeft<=0){gameActive=!1;msgEl.textContent='⏰ Time\'s up! Score: '+score;playSound('gameover');saveBest();input.disabled=!0}}},100)}
function submitWord(){if(!gameActive||paused||!input.value.trim())return;let typed=input.value.trim().toLowerCase();if(typed===currentWord){combo++;score+=10*combo;wordCount++;scoreEl.textContent=score;comboEl.textContent=combo;wordCountEl.textContent=wordCount;playSound('correct');msgEl.textContent='✅ Correct! +'+(10*combo)+' points!';saveBest();setTimeout(nextWord,300)}else{playSound('wrong');msgEl.textContent='❌ Wrong! The word was "'+currentWord+'".';combo=0;comboEl.textContent=combo;setTimeout(nextWord,500)}input.value=''}
input.addEventListener('keydown',e=>{if(e.key==='Enter')submitWord()});
function togglePause(){if(!gameActive)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'🔤 Keep typing!';if(paused&&timerId)clearInterval(timerId);else if(!paused){timerId=setInterval(()=>{if(!paused){timeLeft--;timerFill.style.width=(timeLeft/maxTime*100)+'%';if(timeLeft<=0){gameActive=!1;msgEl.textContent='⏰ Time\'s up! Score: '+score;playSound('gameover');saveBest();input.disabled=!0}}},100)}}
function resetGame(){if(timerId)clearInterval(timerId);gameActive=!1;paused=!1;input.disabled=!0;input.value='';wordDisplay.textContent='Ready?';score=0;combo=0;wordCount=0;scoreEl.textContent=score;comboEl.textContent=combo;wordCountEl.textContent=wordCount;timerFill.style.width='100%';msgEl.textContent='🔤 Click Start to begin!';document.getElementById('pauseLabel').textContent='Pause'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='correct'){o.frequency.value=800;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=1000},80);o.stop(c.currentTime+.15)}else if(type==='wrong'){o.frequency.value=300;g.gain.value=.06;o.start();o.stop(c.currentTime+.15)}else if(type==='gameover'){o.frequency.value=400;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=300},200);o.stop(c.currentTime+.4)}}catch(e){}}
document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.difficulty-selector button').forEach(x=>x.classList.remove('active'));this.classList.add('active');diff=this.dataset.diff;localStorage.setItem('wordblitz_difficulty',diff);let s=JSON.parse(localStorage.getItem('wordblitz_best')||'{}');bestScore=s[diff]||0;bestEl.textContent=bestScore||'-';resetGame()})});
resetGame();console.log('🔤 Word Blitz Pro loaded');
</script></body></html>
