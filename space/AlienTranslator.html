<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👽 Alien Translator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1a26; color: #d0e8f0; font-family: 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .back-btn { position: fixed; top: 20px; left: 20px; background: #1a3344; color: #4fc3f7; padding: 12px 20px; border: none; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; z-index: 100; }
        .back-btn:hover { background: #2a4a5e; transform: translateX(-5px); }
        .container { max-width: 500px; width: 100%; text-align: center; margin-top: 60px; }
        h1 { color: #4fc3f7; font-size: 2.5rem; margin-bottom: 10px; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 10px 20px; border-radius: 10px; min-width: 80px; border: 1px solid #2a4a5e; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.2rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.7rem; text-transform: uppercase; }
        .alien-text { font-size: 2.5rem; padding: 20px; background: #1a3344; border-radius: 16px; border: 2px solid #2a4a5e; margin: 15px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }
        .input-area { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .input-area input { padding: 12px 16px; border-radius: 12px; border: 2px solid #2a4a5e; background: #1a3344; color: #d0e8f0; font-size: 1rem; flex: 1; min-width: 200px; outline: none; }
        .input-area input:focus { border-color: #4fc3f7; }
        .btn { background: #4fc3f7; color: #0b1a26; border: none; padding: 12px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #7cf5b0; }
        .message { font-size: 1.2rem; min-height: 30px; color: #ffd93d; margin: 10px 0; }
    </style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-language" style="color:#a29bfe;"></i> Alien Translator</h1>
    <div class="stats">
        <div class="stat-box"><span id="count">0</span><span class="label">Translated</span></div>
    </div>
    <div class="alien-text" id="alienText">👽 👾 🛸</div>
    <div class="input-area">
        <input type="text" id="humanInput" placeholder="Type a message...">
        <button class="btn" id="translateBtn">🔮 Translate</button>
    </div>
    <div class="message" id="message">👽 Translate your message to alien!</div>
</div>
<script>
const ALIEN_WORDS = ['👾', '🛸', '👽', '🤖', '👁️', '🌌', '⭐', '💫', '🌀', '✨', '🔮', '🪐'];
let count = 0;

function translate(text) {
    let result = '';
    for (let char of text) {
        if (char === ' ') { result += '  '; }
        else if (char.match(/[a-zA-Z]/)) {
            const idx = char.toLowerCase().charCodeAt(0) - 97;
            result += ALIEN_WORDS[idx % ALIEN_WORDS.length] + ' ';
        } else {
            result += char + ' ';
        }
    }
    return result.trim() || '👾 👾 👾';
}

function doTranslate() {
    const input = document.getElementById('humanInput');
    const text = input.value.trim();
    if (!text) { document.getElementById('message').textContent = '👽 Say something!'; return; }
    const translated = translate(text);
    document.getElementById('alienText').textContent = translated;
    count++;
    document.getElementById('count').textContent = count;
    document.getElementById('message').textContent = '👽 Translated!';
    input.value = '';
}

document.getElementById('translateBtn').addEventListener('click', doTranslate);
document.getElementById('humanInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doTranslate();
});
</script>
</body>
</html>
