<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🖌️ Draw It! Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
canvas{display:block;margin:15px auto;background:#fff;border-radius:12px;border:2px solid rgba(79,195,247,0.1);touch-action:none;max-width:100%;width:500px;height:400px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.toolbar .color-btn{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.1);cursor:pointer;transition:.15s;display:inline-block}
.toolbar .color-btn.active{border-color:#4fc3f7;box-shadow:0 0 15px rgba(79,195,247,0.3)}
.toolbar button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem}
.toolbar button:hover{background:rgba(79,195,247,0.1)}
.toolbar input[type=range]{width:80px;background:rgba(255,255,255,0.05);border-radius:4px;height:4px;-webkit-appearance:none;appearance:none}
.toolbar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:#4fc3f7;cursor:pointer}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.status-bar .stat{color:#8899aa;font-size:.9rem}
.status-bar .stat span{color:#d0e8f0;font-weight:700}
#message{min-height:2rem;font-size:1rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🖌️ Draw It! Pro</h1>
<div class="status-bar"><div class="stat">🖊️ Size: <span id="sizeDisplay">5</span></div><div class="stat">⏱️ Timer: <span id="timer">0</span>s</div><div class="stat">📝 Steps: <span id="steps">0</span></div></div>
<canvas id="canvas" width="500" height="400"></canvas>
<div class="toolbar">
<div class="color-palette" id="palette"></div>
<input type="range" id="brushSize" min="2" max="30" value="5">
<button onclick="undo()"><i class="fas fa-undo"></i></button>
<button onclick="redo()"><i class="fas fa-redo"></i></button>
<button onclick="clearCanvas()"><i class="fas fa-trash"></i> Clear</button>
<button onclick="saveImage()"><i class="fas fa-download"></i> Save</button>
<button onclick="toggleTimer()"><i class="fas fa-clock"></i> <span id="timerLabel">Start Timer</span></button>
</div>
<div id="message">🎨 Draw anything! Use colors, brush size, undo/redo.</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),palette=document.getElementById('palette'),sizeSlider=document.getElementById('brushSize'),sizeDisplay=document.getElementById('sizeDisplay'),timerEl=document.getElementById('timer'),stepsEl=document.getElementById('steps'),msgEl=document.getElementById('message'),timerLabel=document.getElementById('timerLabel');
const COLORS=['#000000','#ffffff','#ff6b6b','#ffd93d','#4fc3f7','#7cf5b0','#a29bfe','#fd79a8','#fdcb6e','#55efc4','#e17055','#6c5ce7'];
let currentColor='#000000',brushSize=5,drawing=!1,lastX=0,lastY=0,history=[],historyIndex=-1,steps=0,timerId=null,seconds=0,timerActive=!1;
function initPalette(){palette.innerHTML='';COLORS.forEach(c=>{let btn=document.createElement('span');btn.className='color-btn'+(c===currentColor?' active':'');btn.style.background=c;btn.onclick=()=>{currentColor=c;document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')};palette.appendChild(btn)})}
function getPos(e){let rect=canvas.getBoundingClientRect(),scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;let x=(e.clientX||e.touches[0].clientX)-rect.left,y=(e.clientY||e.touches[0].clientY)-rect.top;return{x:x*scaleX,y:y*scaleY}}
function startDraw(e){e.preventDefault();drawing=!0;let pos=getPos(e);lastX=pos.x;lastY=pos.y;saveState()}
function draw(e){e.preventDefault();if(!drawing)return;let pos=getPos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(pos.x,pos.y);ctx.strokeStyle=currentColor;ctx.lineWidth=brushSize;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();lastX=pos.x;lastY=pos.y;steps++;stepsEl.textContent=steps}
function endDraw(e){e.preventDefault();drawing=!1}
canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',draw);canvas.addEventListener('mouseup',endDraw);canvas.addEventListener('mouseleave',endDraw);
canvas.addEventListener('touchstart',startDraw);canvas.addEventListener('touchmove',draw);canvas.addEventListener('touchend',endDraw);
sizeSlider.addEventListener('input',()=>{brushSize=parseInt(sizeSlider.value);sizeDisplay.textContent=brushSize});
function saveState(){history=history.slice(0,historyIndex+1);history.push(canvas.toDataURL());historyIndex=history.length-1}
function undo(){if(historyIndex>0){historyIndex--;let img=new Image();img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0)};img.src=history[historyIndex];steps--;stepsEl.textContent=Math.max(0,steps)}}
function redo(){if(historyIndex<history.length-1){historyIndex++;let img=new Image();img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0)};img.src=history[historyIndex];steps++;stepsEl.textContent=steps}}
function clearCanvas(){if(confirm('Clear drawing?')){ctx.clearRect(0,0,canvas.width,canvas.height);saveState();steps=0;stepsEl.textContent=steps;playSound('clear')}}
function saveImage(){let link=document.createElement('a');link.download='drawing.png';link.href=canvas.toDataURL();link.click();playSound('save')}
function toggleTimer(){timerActive=!timerActive;timerLabel.textContent=timerActive?'Stop Timer':'Start Timer';if(timerActive){timerId=setInterval(()=>{seconds++;timerEl.textContent=seconds},1000);msgEl.textContent='⏱️ Timer running!'}else{clearInterval(timerId);timerId=null;msgEl.textContent='⏱️ Timer stopped at '+seconds+'s'}}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=600;g.gain.value=.03;o.start();o.stop(c.currentTime+.05)}catch(e){}}
initPalette();ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);saveState();console.log('🖌️ Draw It! Pro loaded');
</script></body></html>
