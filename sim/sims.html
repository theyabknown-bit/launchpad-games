<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="/launchpad-games/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👤 Sims Mini - Multi-Device Friends</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1a26; color: #d0e8f0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #4fc3f7; font-size: 1.8rem; margin-bottom: 10px; }
        .stats { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 4px 8px; border-radius: 10px; border: 1px solid #2a4a5e; min-width: 50px; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 0.85rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.4rem; text-transform: uppercase; }
        .stat-box.dead { border-color: #ff6b6b; }
        .stat-box.dead span { color: #ff6b6b; }
        .stat-box.life-stage { border-color: #b07cf5; }
        .stat-box.life-stage span { color: #b07cf5; }
        .stat-box.friend-box { border-color: #7cf5b0; }
        .stat-box.friend-box span { color: #7cf5b0; }
        .tab-bar { display: flex; gap: 3px; margin: 8px 0; flex-wrap: wrap; justify-content: center; }
        .tab { background: #1a3344; color: #8899aa; border: 1px solid #2a4a5e; padding: 4px 10px; border-radius: 20px; cursor: pointer; font-size: 0.6rem; border: none; }
        .tab:hover { background: #2a4a5e; color: #d0e8f0; }
        .tab.active { background: #4fc3f7; color: #0b1a26; }
        .panel { display: none; background: #0f1f2e; border-radius: 16px; padding: 10px; border: 1px solid #1a3344; margin: 8px 0; min-height: 150px; }
        .panel.active { display: block; }
        .btn { padding: 5px 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.7rem; cursor: pointer; margin: 3px; }
        .btn-primary { background: #4fc3f7; color: #0b1a26; }
        .btn-success { background: #7cf5b0; color: #0b1a26; }
        .btn-warning { background: #ffd93d; color: #0b1a26; }
        .btn-danger { background: #ff6b6b; color: white; }
        .btn-purple { background: #b07cf5; color: #0b1a26; }
        .btn-pink { background: #ff6b9d; color: white; }
        .btn-cyan { background: #4fc3f7; color: #0b1a26; }
        .btn-orange { background: #ffa500; color: #0b1a26; }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-small { padding: 3px 8px; font-size: 0.6rem; }
        .message { font-size: 0.9rem; min-height: 25px; color: #ffd93d; margin: 5px 0; font-weight: 600; }
        .shop-item, .friend-item { background: #1a3344; border-radius: 12px; padding: 6px; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a4a5e; }
        .shop-item .name, .friend-item .name { font-weight: 700; color: #f0f8ff; font-size: 0.8rem; }
        .shop-item .price { color: #ffd93d; font-weight: 700; font-size: 0.8rem; }
        .job-card, .school-card { background: #1a3344; border-radius: 12px; padding: 6px; margin: 4px 0; border: 1px solid #2a4a5e; text-align: left; }
        .job-card .name, .school-card .name { font-weight: 700; color: #f0f8ff; font-size: 0.85rem; }
        .job-card .diff { font-size: 0.5rem; padding: 2px 6px; border-radius: 20px; display: inline-block; margin: 2px 0; }
        .job-card .diff.easy { background: #1a4a3a; color: #7cf5b0; }
        .job-card .diff.medium { background: #3a3a1a; color: #ffd93d; }
        .job-card .diff.hard { background: #3a1a1a; color: #ff6b6b; }
        .job-card .diff.expert { background: #2a1a3a; color: #b07cf5; }
        .location-btn { background: #1a3344; border: 2px solid #2a4a5e; border-radius: 12px; padding: 6px; margin: 3px; display: inline-block; cursor: pointer; min-width: 50px; }
        .location-btn:hover { border-color: #4fc3f7; }
        .location-btn .emoji { font-size: 1.2rem; display: block; }
        .location-btn .name { font-size: 0.5rem; color: #d0e8f0; }
        .back-link { display: inline-block; margin-top: 10px; color: #4fc3f7; text-decoration: none; font-size: 0.8rem; }
        .back-link:hover { text-decoration: underline; }
        .click-challenge { background: #1a3344; border: 2px solid #ffd93d; border-radius: 12px; padding: 12px; margin: 8px 0; }
        .click-challenge .big-btn { font-size: 1.8rem; padding: 15px 25px; background: #4fc3f7; color: #0b1a26; border: none; border-radius: 16px; cursor: pointer; font-weight: 700; width: 100%; }
        .click-challenge .big-btn:hover { transform: scale(1.02); }
        .click-challenge .big-btn:active { transform: scale(0.95); }
        .click-challenge .timer { font-size: 1.3rem; color: #ffd93d; margin: 8px 0; }
        .click-challenge .clicks { font-size: 1rem; color: #7cf5b0; }
        .death-message { background: #3a1a1a; border: 2px solid #ff6b6b; border-radius: 12px; padding: 15px; margin: 8px 0; color: #ff6b6b; font-size: 1rem; }
        .death-message .big { font-size: 2.5rem; }
        .school-item { background: #1a3344; border-radius: 12px; padding: 6px; margin: 4px 0; border: 1px solid #2a4a5e; }
        .school-item .name { font-weight: 700; color: #f0f8ff; font-size: 0.85rem; }
        .school-item .desc { font-size: 0.7rem; color: #8899aa; }
        .friend-code-box { background: #0f1f2e; border: 2px solid #4fc3f7; border-radius: 12px; padding: 10px; margin: 8px 0; }
        .friend-code-box .code { font-size: 1.5rem; font-weight: 700; color: #7cf5b0; letter-spacing: 4px; }
        .friend-code-box .label { font-size: 0.6rem; color: #8899aa; }
        .friend-item .friend-stage { font-size: 0.6rem; color: #b07cf5; }
        .friend-item .friend-house { font-size: 0.6rem; color: #ffd93d; }
        .friend-item .friend-device { font-size: 0.55rem; color: #4fc3f7; }
        .friend-status.healthy { color: #7cf5b0; }
        .friend-status.sick { color: #ff6b6b; }
        .friend-status.dead { color: #ff6b6b; text-decoration: line-through; }
        .friend-status.offline { color: #8899aa; }
        .input-group { display: flex; gap: 5px; margin: 5px 0; justify-content: center; }
        .input-group input { background: #1a3344; border: 1px solid #2a4a5e; color: #d0e8f0; padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; width: 150px; }
        .input-group input:focus { outline: none; border-color: #4fc3f7; }
        .friend-code-box .device-info { font-size: 0.7rem; color: #8899aa; margin-top: 4px; }
        .online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
        .online-dot.online { background: #7cf5b0; }
        .online-dot.offline { background: #8899aa; }
    </style>
</head>
<body>

            

    
</div>

    
</div>

    
</div>
<div id="fakeFriendSystem" style="margin:10px; padding:10px; background:#1a3344; border-radius:8px; border:1px solid #2a4a5e;">
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <button onclick="meetFakePerson()" style="background:#ffd93d; color:#0b1a26; border:none; padding:6px 14px; border-radius:6px; font-weight:bold; cursor:pointer;">👤 Meet Someone</button>
        <button onclick="clearFakeFriends()" style="background:#ff6b6b; color:white; border:none; padding:6px 14px; border-radius:6px; font-weight:bold; cursor:pointer;">🗑️ Clear</button>
    </div>
    <div id="fakeFriendList" style="margin-top:8px; color:#8899aa; font-size:0.8rem;">
        <span id="fakeFriendDisplay">No fake friends yet. Click "Meet Someone"!</span>
    </div>
</div>
</body>
</html>
