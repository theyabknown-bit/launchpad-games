<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎣 Fishing Pro</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .game-container { text-align: center; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .status-bar .stat { color: #8899aa; font-size: 0.9rem; }
        .status-bar .stat span { color: #d0e8f0; font-weight: 700; }
        .lake-area {
            background: radial-gradient(ellipse at center, rgba(79,195,247,0.05), rgba(0,0,0,0.3));
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            min-height: 200px;
            border: 1px solid rgba(79,195,247,0.05);
            position: relative;
        }
        .lake-area .fish-icon {
            font-size: 4rem;
            animation: floatFish 2s ease-in-out infinite;
        }
        @keyframes floatFish {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        .cast-meter {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
            cursor: pointer;
        }
        .cast-meter .fill {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #ffd93d, #ff6b6b);
            border-radius: 10px;
            transition: width 0.05s linear;
            width: 0%;
        }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .controls button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); }
        .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        .bait-shop { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
        .bait-shop button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; padding: 6px 16px; }
        .bait-shop button.active { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 6px;
            margin: 10px 0;
        }
        .collection-item {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            font-size: 0.7rem;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .collection-item.caught { border-color: rgba(124,245,176,0.2); background: rgba(124,245,176,0.03); }
        .collection-item .emoji { font-size: 1.5rem; display: block; }
        .collection-item .name { color: #8899aa; }
        #message { min-height: 2rem; font-size: 1rem; }
        .weather-display { font-size: 0.9rem; color: #8899aa; }
        .weather-display span { color: #d0e8f0; }
    </style>
</head>
<body>
<div class="game-container">
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    <h1 class="game-title">🎣 Fishing Pro</h1>

    <!-- Status -->
    <div class="status-bar">
        <div class="stat">💰 Cash: <span id="cash">50</span></div>
        <div class="stat">🎣 Casts: <span id="casts">0</span></div>
        <div class="stat">🏆 Best: <span id="bestScore">-</span></div>
        <div class="stat weather-display">🌤️ <span id="weatherDisplay">Sunny</span></div>
    </div>

    <!-- Lake -->
    <div class="lake-area" id="lakeArea">
        <div class="fish-icon" id="fishDisplay">🐟</div>
        <div id="catchDisplay" style="font-size:1.2rem; margin-top:10px;">Cast your line!</div>
    </div>

    <!-- Cast Meter -->
    <div class="cast-meter" id="castMeter" onclick="castPower()">
        <div class="fill" id="powerFill"></div>
    </div>

    <!-- Bait Shop -->
    <div class="bait-shop">
        <button data-bait="none" class="active">No Bait (free)</button>
        <button data-bait="worm">🪱 Worm ($5)</button>
        <button data-bait="minnow">🐟 Minnow ($10)</button>
        <button data-bait="lure">🎣 Lure ($20)</button>
    </div>

    <div id="message">💡 Click the meter to cast! Power = distance, timing = accuracy.</div>

    <div class="controls">
        <button onclick="castLine()" id="castBtn"><i class="fas fa-fish"></i> Cast</button>
        <button onclick="sellCatch()"><i class="fas fa-coins"></i> Sell Catch</button>
        <button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button>
        <button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button>
    </div>

    <!-- Collection -->
    <div class="section" style="margin-top:15px;">
        <h3>🐠 Collection (<span id="collectionCount">0</span>/<span id="totalFish">0</span>)</h3>
        <div class="collection-grid" id="collectionGrid"></div>
    </div>
</div>

<script>
// ============================================================
// FISHING PRO – Fish types, casting, weather, bait, collection
// ============================================================
const cashEl = document.getElementById('cash');
const castsEl = document.getElementById('casts');
const bestEl = document.getElementById('bestScore');
const weatherEl = document.getElementById('weatherDisplay');
const fishDisplay = document.getElementById('fishDisplay');
const catchDisplay = document.getElementById('catchDisplay');
const powerFill = document.getElementById('powerFill');
const msgEl = document.getElementById('message');
const castBtn = document.getElementById('castBtn');
const collectionGrid = document.getElementById('collectionGrid');
const collectionCount = document.getElementById('collectionCount');
const totalFishEl = document.getElementById('totalFish');

let cash = 50;
let casts = 0;
let bestScore = 0;
let currentCatch = null;
let power = 0;
let powerDirection = 1;
let castInterval = null;
let weather = 'sunny';
let bait = 'none';
let isCasting = false;
let gameOver = false;
let paused = false;
let collection = {};
let fishCaught = 0;

// Fish types
const FISH_TYPES = [
    { id: 'minnow', name: 'Minnow', emoji: '🐟', rarity: 'Common', value: 2, minSize: 2, maxSize: 5 },
    { id: 'perch', name: 'Perch', emoji: '🐠', rarity: 'Common', value: 3, minSize: 3, maxSize: 8 },
    { id: 'bass', name: 'Bass', emoji: '🐡', rarity: 'Uncommon', value: 5, minSize: 5, maxSize: 12 },
    { id: 'trout', name: 'Trout', emoji: '🎣', rarity: 'Uncommon', value: 6, minSize: 4, maxSize: 15 },
    { id: 'salmon', name: 'Salmon', emoji: '🐟', rarity: 'Rare', value: 10, minSize: 8, maxSize: 20 },
    { id: 'pike', name: 'Pike', emoji: '🐊', rarity: 'Rare', value: 12, minSize: 10, maxSize: 25 },
    { id: 'sturgeon', name: 'Sturgeon', emoji: '🐋', rarity: 'Epic', value: 20, minSize: 15, maxSize: 35 },
    { id: 'muskie', name: 'Muskie', emoji: '🦈', rarity: 'Epic', value: 25, minSize: 18, maxSize: 40 },
    { id: 'goldfish', name: 'Golden Fish', emoji: '🐠', rarity: 'Legendary', value: 50, minSize: 5, maxSize: 10 },
    { id: 'dragonfish', name: 'Dragon Fish', emoji: '🐉', rarity: 'Legendary', value: 100, minSize: 20, maxSize: 50 }
];

const WEATHERS = ['sunny', 'rainy', 'stormy'];
const WEATHER_ICONS = { sunny: '☀️', rainy: '🌧️', stormy: '⛈️' };
const BAIT_BONUS = { none: 1, worm: 1.2, minnow: 1.5, lure: 2.0 };
const BAIT_COST = { none: 0, worm: 5, minnow: 10, lure: 20 };

// Load saved data
(function load() {
    try {
        const saved = JSON.parse(localStorage.getItem('fishing_save') || '{}');
        cash = saved.cash || 50;
        bestScore = saved.bestScore || 0;
        collection = saved.collection || {};
        fishCaught = saved.fishCaught || 0;
        if (bestScore) bestEl.textContent = bestScore;
        else bestEl.textContent = '-';
        const baitSaved = localStorage.getItem('fishing_bait') || 'none';
        bait = baitSaved;
        document.querySelectorAll('.bait-shop button').forEach(b => {
            b.classList.toggle('active', b.dataset.bait === bait);
        });
    } catch(e) {}
    updateUI();
})();

function saveGame() {
    try {
        localStorage.setItem('fishing_save', JSON.stringify({
            cash, bestScore, collection, fishCaught
        }));
        localStorage.setItem('fishing_bait', bait);
    } catch(e) {}
}

function updateUI() {
    cashEl.textContent = cash;
    castsEl.textContent = casts;
    weatherEl.textContent = WEATHER_ICONS[weather] + ' ' + weather.charAt(0).toUpperCase() + weather.slice(1);
    // Collection
    const total = FISH_TYPES.length;
    const caught = Object.keys(collection).length;
    collectionCount.textContent = caught;
    totalFishEl.textContent = total;
    collectionGrid.innerHTML = FISH_TYPES.map(f => {
        const has = collection[f.id];
        return `<div class="collection-item ${has ? 'caught' : ''}">
            <span class="emoji">${f.emoji}</span>
            <span class="name">${has ? f.name : '???'}</span>
        </div>`;
    }).join('');
}

function getWeather() {
    const r = Math.random();
    if (r < 0.5) return 'sunny';
    if (r < 0.8) return 'rainy';
    return 'stormy';
}

function changeWeather() {
    weather = getWeather();
    updateUI();
}

// ---- Casting ----
function castLine() {
    if (isCasting || paused || gameOver) return;
    isCasting = true;
    power = 0;
    powerDirection = 1;
    powerFill.style.width = '0%';
    msgEl.textContent = '⚡ Charging power... Click again to set!';
    castBtn.disabled = true;
    if (castInterval) clearInterval(castInterval);
    castInterval = setInterval(() => {
        if (paused) return;
        power += powerDirection * 1.5;
        if (power >= 100) { power = 100; powerDirection = -1; }
        if (power <= 0) { power = 0; powerDirection = 1; }
        powerFill.style.width = power + '%';
    }, 30);
    // One-time click on meter to set power
    const meter = document.getElementById('castMeter');
    meter.onclick = function() {
        if (!isCasting) return;
        clearInterval(castInterval);
        castInterval = null;
        // Accuracy based on how close to 50% power is
        const accuracy = Math.max(0, 100 - Math.abs(power - 50) * 2);
        const result = getFishResult(accuracy);
        currentCatch = result;
        fishDisplay.textContent = result.emoji;
        catchDisplay.textContent = `🎣 Caught a ${result.rarity} ${result.name}! (${result.weight} lbs)`;
        msgEl.textContent = `💰 Value: $${result.value} | Accuracy: ${Math.round(accuracy)}%`;
        casts++;
        cash += result.value;
        // Add to collection
        if (!collection[result.id]) {
            collection[result.id] = 0;
        }
        collection[result.id]++;
        fishCaught++;
        playSound('catch');
        saveGame();
        updateUI();
        isCasting = false;
        castBtn.disabled = false;
        meter.onclick = null;
        // Random weather change
        if (Math.random() < 0.2) changeWeather();
    };
}

function getFishResult(accuracy) {
    const weatherModifier = { sunny: 1, rainy: 1.2, stormy: 0.7 };
    const wMod = weatherModifier[weather] || 1;
    const baitMod = BAIT_BONUS[bait] || 1;
    const roll = Math.random() * 100 * wMod * baitMod;
    // Determine fish rarity based on roll + bait + weather
    let rarity = 'Common';
    if (roll > 80) rarity = 'Legendary';
    else if (roll > 60) rarity = 'Epic';
    else if (roll > 40) rarity = 'Rare';
    else if (roll > 20) rarity = 'Uncommon';
    const pool = FISH_TYPES.filter(f => f.rarity === rarity);
    if (pool.length === 0) {
        // fallback
        const fallback = FISH_TYPES.find(f => f.id === 'minnow');
        return { ...fallback, weight: 3, value: 2 };
    }
    const fish = pool[Math.floor(Math.random() * pool.length)];
    const sizeRange = fish.maxSize - fish.minSize;
    const weight = Math.round((fish.minSize + Math.random() * sizeRange) * 10) / 10;
    const value = Math.round(fish.value * (weight / 10) * (accuracy / 50) * 10) / 10;
    return {
        ...fish,
        weight,
        value: Math.max(1, Math.round(value))
    };
}

function sellCatch() {
    if (!currentCatch) {
        msgEl.textContent = 'Nothing to sell. Go fishing!';
        return;
    }
    const val = currentCatch.value;
    cash += val;
    cashEl.textContent = cash;
    msgEl.textContent = `💰 Sold ${currentCatch.name} for $${val}!`;
    playSound('sell');
    currentCatch = null;
    fishDisplay.textContent = '🐟';
    catchDisplay.textContent = 'Cast your line!';
    saveGame();
    updateUI();
}

function togglePause() {
    if (gameOver) return;
    paused = !paused;
    document.getElementById('pauseLabel').textContent = paused ? 'Resume' : 'Pause';
    msgEl.textContent = paused ? '⏸️ Paused' : 'Cast your line!';
}

function resetGame() {
    if (confirm('Reset everything?')) {
        localStorage.removeItem('fishing_save');
        localStorage.removeItem('fishing_bait');
        cash = 50;
        casts = 0;
        bestScore = 0;
        collection = {};
        fishCaught = 0;
        currentCatch = null;
        gameOver = false;
        paused = false;
        bait = 'none';
        document.querySelectorAll('.bait-shop button').forEach(b => {
            b.classList.toggle('active', b.dataset.bait === bait);
        });
        saveGame();
        updateUI();
        fishDisplay.textContent = '🐟';
        catchDisplay.textContent = 'Cast your line!';
        msgEl.textContent = '🔄 Reset complete!';
        castBtn.disabled = false;
        if (castInterval) { clearInterval(castInterval); castInterval = null; }
    }
}

// ---- Bait ----
document.querySelectorAll('.bait-shop button').forEach(btn => {
    btn.addEventListener('click', function() {
        const newBait = this.dataset.bait;
        const cost = BAIT_COST[newBait] || 0;
        if (cost > 0 && cash < cost) {
            msgEl.textContent = `❌ Not enough cash! Need $${cost}`;
            return;
        }
        if (cost > 0) {
            cash -= cost;
            cashEl.textContent = cash;
        }
        bait = newBait;
        document.querySelectorAll('.bait-shop button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        localStorage.setItem('fishing_bait', bait);
        saveGame();
        msgEl.textContent = `🎣 Bait set to ${this.textContent.trim()}`;
    });
});

// ---- Sound ----
function playSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'catch') {
            osc.frequency.value = 600;
            gain.gain.value = 0.08;
            osc.start();
            setTimeout(() => { osc.frequency.value = 800; }, 80);
            setTimeout(() => { osc.frequency.value = 1000; }, 160);
            osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'sell') {
            osc.frequency.value = 400;
            gain.gain.value = 0.06;
            osc.start();
            setTimeout(() => { osc.frequency.value = 600; }, 100);
            osc.stop(ctx.currentTime + 0.2);
        }
    } catch(e) {}
}

// ---- Init ----
changeWeather();
updateUI();
msgEl.textContent = '🎣 Click "Cast" then click the meter to set power!';
console.log('🎣 Fishing Pro loaded with 10 fish types, weather, bait, collection.');
</script>
</body>
</html>
