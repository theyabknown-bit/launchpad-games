<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🦄 Alien Zoo Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.status-bar .stat{background:rgba(0,0,0,0.3);padding:6px 10px;border-radius:8px;border:1px solid rgba(79,195,247,0.05)}
.status-bar .stat .label{font-size:.7rem;color:#8899aa}
.status-bar .stat .value{font-weight:700;font-size:1.1rem}
.aliens{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.alien-card{background:rgba(0,0,0,0.3);padding:8px;border-radius:12px;border:1px solid rgba(79,195,247,0.05);width:100px;text-align:center;font-size:.8rem}
.alien-card .emoji{font-size:2rem}
.alien-card .name{color:#8899aa}
.alien-card .happiness{color:#7cf5b0}
.alien-card .happiness.low{color:#ff6b6b}
.alien-card .rarity{font-size:.6rem;padding:2px 8px;border-radius:10px;display:inline-block}
.alien-card .rarity.common{background:rgba(255,255,255,0.05);color:#8899aa}
.alien-card .rarity.rare{background:rgba(79,195,247,0.1);color:#4fc3f7}
.alien-card .rarity.epic{background:rgba(124,245,176,0.1);color:#7cf5b0}
.alien-card .rarity.legendary{background:rgba(255,215,0,0.1);color:#ffd93d}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.actions button{background:rgba(79,195,247,0.05);border:1px solid rgba(79,195,247,0.1);color:#d0e8f0;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem}
.actions button:hover{background:rgba(79,195,247,0.1)}
.events{background:rgba(255,215,0,0.03);border:1px solid rgba(255,215,0,0.05);border-radius:8px;padding:8px;margin:10px 0;font-size:.85rem;min-height:40px;color:#8899aa}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
#message{min-height:2rem;font-size:.9rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🦄 Alien Zoo Pro</h1>
<div class="status-bar"><div class="stat"><div class="label">💰 Coins</div><div class="value" id="coins">50</div></div><div class="stat"><div class="label">🏆 Score</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">🏅 Best</div><div class="value" id="bestScore">-</div></div><div class="stat"><div class="label">🦄 Aliens</div><div class="value" id="alienCount">0</div></div></div>
<div class="aliens" id="alienList"><span style="color:#8899aa;font-size:.8rem">No aliens yet. Collect some!</span></div>
<div class="actions"><button onclick="collectAlien()">🔍 Collect Alien</button><button onclick="feedAliens()">🍎 Feed Aliens ($5)</button><button onclick="cleanAliens()">🧹 Clean Aliens ($3)</button><button onclick="playWithAliens()">🎾 Play with Aliens ($4)</button><button onclick="upgradeZoo()">⬆️ Upgrade Zoo ($20)</button></div>
<div class="events" id="events">🦄 Welcome to the Alien Zoo!</div>
<div id="message">💡 Collect aliens, keep them happy, earn coins!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const coinsEl=document.getElementById('coins'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),alienCountEl=document.getElementById('alienCount'),alienList=document.getElementById('alienList'),eventsEl=document.getElementById('events'),msgEl=document.getElementById('message');
const ALIEN_SPECIES=[
{name:'Zorgon',emoji:'👽',rarity:'common',happiness:80},
{name:'Xylar',emoji:'🛸',rarity:'common',happiness:75},
{name:'Nebulon',emoji:'🌠',rarity:'rare',happiness:70},
{name:'Vortex',emoji:'🌀',rarity:'rare',happiness:65},
{name:'Lumina',emoji:'✨',rarity:'epic',happiness:60},
{name:'Quasar',emoji:'💥',rarity:'epic',happiness:55},
{name:'Glorp',emoji:'🐙',rarity:'legendary',happiness:50},
{name:'Zorax',emoji:'🦎',rarity:'common',happiness:80},
{name:'Floof',emoji:'🐑',rarity:'common',happiness:85},
{name:'Squib',emoji:'🐟',rarity:'rare',happiness:70},
{name:'Glimmer',emoji:'💎',rarity:'epic',happiness:60},
{name:'Voidling',emoji:'🕳️',rarity:'legendary',happiness:45}
];
let state={coins:50,score:0,zooLevel:1,aliens:[],gameActive:!1,paused:!1,timerId:null,eventTimer:null,bestScore:0};
(function load(){try{let s=JSON.parse(localStorage.getItem('zoo_best')||'{}');state.bestScore=s['all']||0;bestEl.textContent=state.bestScore||'-'}catch(e){}})();
function saveBest(){if(state.score>state.bestScore){state.bestScore=state.score;let s=JSON.parse(localStorage.getItem('zoo_best')||'{}');s['all']=state.score;localStorage.setItem('zoo_best',JSON.stringify(s));bestEl.textContent=state.score}}
function saveState(){try{localStorage.setItem('zoo_state',JSON.stringify(state))}catch(e){}}
function renderAliens(){if(state.aliens.length===0){alienList.innerHTML='<span style="color:#8899aa;font-size:.8rem">No aliens yet. Collect some!</span>';alienCountEl.textContent=0;return}alienList.innerHTML=state.aliens.map(a=>{let happyClass=a.happiness>60?'':'low';return'<div class="alien-card"><div class="emoji">'+a.emoji+'</div><div class="name">'+a.name+'</div><div class="happiness '+happyClass+'">❤️ '+Math.round(a.happiness)+'%</div><div class="rarity '+a.rarity+'">'+a.rarity+'</div></div>'}).join('');alienCountEl.textContent=state.aliens.length}
function collectAlien(){if(!state.gameActive||state.paused)return;let available=ALIEN_SPECIES.filter(s=>!state.aliens.some(a=>a.name===s.name));if(available.length===0){msgEl.textContent='❌ All aliens collected!';return}let species=available[Math.floor(Math.random()*available.length)];let newAlien={...species};state.aliens.push(newAlien);state.score+=5;addEvent('🔍 Collected '+species.name+' ('+species.rarity+')!');playSound('collect');saveState();renderAliens();updateUI()}
function feedAliens(){if(!state.gameActive||state.paused)return;if(state.coins<5){msgEl.textContent='❌ Need 5 coins!';return}state.coins-=5;state.aliens.forEach(a=>{a.happiness=Math.min(100,a.happiness+10)});state.score+=2;addEvent('🍎 All aliens fed! +10 happiness');playSound('feed');saveState();renderAliens();updateUI()}
function cleanAliens(){if(!state.gameActive||state.paused)return;if(state.coins<3){msgEl.textContent='❌ Need 3 coins!';return}state.coins-=3;state.aliens.forEach(a=>{a.happiness=Math.min(100,a.happiness+5)});state.score+=1;addEvent('🧹 Zoo cleaned! +5 happiness');playSound('clean');saveState();renderAliens();updateUI()}
function playWithAliens(){if(!state.gameActive||state.paused)return;if(state.coins<4){msgEl.textContent='❌ Need 4 coins!';return}state.coins-=4;state.aliens.forEach(a=>{a.happiness=Math.min(100,a.happiness+15)});state.score+=3;addEvent('🎾 Played with aliens! +15 happiness');playSound('play');saveState();renderAliens();updateUI()}
function upgradeZoo(){if(!state.gameActive||state.paused)return;if(state.coins<20){msgEl.textContent='❌ Need 20 coins!';return}state.coins-=20;state.zooLevel++;state.score+=10;addEvent('⬆️ Zoo upgraded to Level '+state.zooLevel+'!');playSound('upgrade');saveState();updateUI()}
function addEvent(msg){eventsEl.textContent='🦄 '+msg}
function updateUI(){coinsEl.textContent=Math.round(state.coins);scoreEl.textContent=Math.round(state.score);bestEl.textContent=state.bestScore||'-';renderAliens()}
function passiveIncome(){if(!state.gameActive||state.paused)return;let income=1+state.aliens.length/2+state.zooLevel;state.coins+=income;state.score+=0.5;state.aliens.forEach(a=>{a.happiness=Math.max(0,a.happiness-0.5);if(a.happiness<10){addEvent('⚠️ '+a.name+' is unhappy! Feed or play with them.')}});if(Math.random()<0.02){let r=Math.random();if(r<0.01){addEvent('🌟 Rare visitor! +10 coins!');state.coins+=10;playSound('event')}else if(r<0.02){let alien=state.aliens[Math.floor(Math.random()*state.aliens.length)];if(alien){alien.happiness=Math.max(0,alien.happiness-20);addEvent('🚨 '+alien.name+' escaped! Happiness -20');playSound('event')}}}saveState();updateUI()}
function startGame(){state.gameActive=!0;state.paused=!1;state.coins=50;state.score=0;state.zooLevel=1;state.aliens=[];document.getElementById('pauseLabel').textContent='Pause';addEvent('🦄 Zoo opened!');if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);state.timerId=setInterval(()=>{passiveIncome()},2000);state.eventTimer=setInterval(()=>{if(!state.paused&&state.gameActive){addEvent('⏰ Time passes...');saveState();updateUI()}},5000);saveState();updateUI();msgEl.textContent='💡 Collect aliens, keep them happy, earn coins!'}
function togglePause(){if(!state.gameActive)return;state.paused=!state.paused;document.getElementById('pauseLabel').textContent=state.paused?'Resume':'Pause';msgEl.textContent=state.paused?'⏸️ Paused':'💡 Keep managing!';if(state.paused){if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer)}else{state.timerId=setInterval(()=>{passiveIncome()},2000);state.eventTimer=setInterval(()=>{if(!state.paused&&state.gameActive){addEvent('⏰ Time passes...');saveState();updateUI()}},5000)}}
function resetGame(){if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);state.gameActive=!1;state.paused=!1;state.coins=50;state.score=0;state.zooLevel=1;state.aliens=[];document.getElementById('pauseLabel').textContent='Pause';addEvent('🔄 Zoo reset.');saveState();updateUI();msgEl.textContent='💡 Click Start to begin!'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='collect'){o.frequency.value=600;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=800},80);o.stop(c.currentTime+.15)}else if(type==='feed'||type==='play'){o.frequency.value=500;g.gain.value=.04;o.start();setTimeout(()=>{o.frequency.value=700},100);o.stop(c.currentTime+.2)}else if(type==='clean'){o.frequency.value=400;g.gain.value=.04;o.start();setTimeout(()=>{o.frequency.value=500},100);o.stop(c.currentTime+.15)}else if(type==='upgrade'){o.frequency.value=500;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=700},100);setTimeout(()=>{o.frequency.value=900},200);o.stop(c.currentTime+.35)}else if(type==='event'){o.frequency.value=300;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=500},100);o.stop(c.currentTime+.2)}}catch(e){}}
loadState();updateUI();console.log('🦄 Alien Zoo Pro loaded');
</script></body></html>
