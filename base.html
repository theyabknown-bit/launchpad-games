<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 Launch Pad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0b1a26;
            color: #d0e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #4fc3f7;
            font-size: 2.5rem;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #7cf5b0;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .game-card {
            background: #1a3344;
            border-radius: 16px;
            padding: 20px 10px;
            text-decoration: none;
            color: #d0e8f0;
            border: 1px solid #2a4a5e;
            transition: 0.2s;
            cursor: pointer;
        }
        .game-card:hover {
            transform: translateY(-4px);
            border-color: #4fc3f7;
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.1);
        }
        .game-card .emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 6px;
        }
        .game-card .name {
            font-weight: 700;
            font-size: 0.9rem;
        }
        .game-card .desc {
            font-size: 0.7rem;
            color: #8899aa;
            margin-top: 4px;
        }
        .section {
            background: #0f1f2e;
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #1a3344;
            margin: 10px 0;
        }
        .section-title {
            color: #4fc3f7;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .friend-code-box {
            background: #1a3344;
            border: 2px solid #4fc3f7;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
        }
        .friend-code-box .code {
            font-size: 2rem;
            font-weight: 700;
            color: #7cf5b0;
            letter-spacing: 6px;
            font-family: 'Courier New', monospace;
        }
        .friend-code-box .label {
            font-size: 0.6rem;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .friend-code-box .device-info {
            font-size: 0.7rem;
            color: #8899aa;
            margin-top: 4px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin: 8px 0;
            justify-content: center;
            flex-wrap: wrap;
        }
        .input-group input {
            background: #1a3344;
            border: 1px solid #2a4a5e;
            color: #d0e8f0;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 1rem;
            width: 160px;
            text-align: center;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }
        .input-group input:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Segoe UI', sans-serif;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: #4fc3f7;
            color: #0b1a26;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.2);
        }
        .btn-success {
            background: #7cf5b0;
            color: #0b1a26;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(124, 245, 176, 0.2);
        }
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.2);
        }
        .btn-warning {
            background: #ffd93d;
            color: #0b1a26;
        }
        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 217, 61, 0.2);
        }
        .btn-cyan {
            background: #4fc3f7;
            color: #0b1a26;
        }
        .btn-cyan:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.2);
        }
        .btn-small {
            padding: 5px 12px;
            font-size: 0.7rem;
        }
        .friend-item {
            background: #1a3344;
            border-radius: 12px;
            padding: 10px;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a4a5e;
        }
        .friend-item .info {
            text-align: left;
            flex: 1;
        }
        .friend-item .name {
            font-weight: 700;
            color: #f0f8ff;
            font-size: 0.9rem;
        }
        .friend-item .details {
            font-size: 0.65rem;
            color: #8899aa;
        }
        .friend-item .status {
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .status.online {
            background: #1a4a3a;
            color: #7cf5b0;
        }
        .status.offline {
            background: #3a3a3a;
            color: #8899aa;
        }
        .status.pending {
            background: #3a3a1a;
            color: #ffd93d;
        }
        .friend-item .device {
            font-size: 0.55rem;
            color: #4fc3f7;
        }
        .friend-item .code {
            font-size: 0.6rem;
            color: #7cf5b0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .online-dot.online {
            background: #7cf5b0;
        }
        .online-dot.offline {
            background: #8899aa;
        }
        .online-dot.pending {
            background: #ffd93d;
        }
        .save-indicator {
            font-size: 0.6rem;
            color: #4a6a8a;
            margin-top: 10px;
        }
        .friend-count {
            color: #7cf5b0;
            font-weight: 700;
        }
        .empty-state {
            color: #666;
            padding: 20px;
            font-size: 0.9rem;
        }
        .empty-state .emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }
        @media (max-width: 480px) {
            .container { margin-top: 10px; }
            h1 { font-size: 2rem; }
            .game-grid { gap: 8px; }
            .game-card { padding: 15px 8px; }
            .game-card .emoji { font-size: 2rem; }
            .friend-code-box .code { font-size: 1.5rem; letter-spacing: 4px; }
            .input-group input { width: 130px; font-size: 0.9rem; }
            .friend-item { flex-direction: column; text-align: center; }
            .friend-item .info { text-align: center; margin-bottom: 6px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Launch Pad</h1>
    <p class="subtitle">Your gaming hub</p>

    <!-- GAME GRID -->
    <div class="game-grid">
        <a href="sim/sims.html" class="game-card">
            <span class="emoji">👤</span>
            <span class="name">Sims Mini</span>
            <span class="desc">Live your best life</span>
        </a>
        <div class="game-card" style="opacity:0.3;cursor:not-allowed;">
            <span class="emoji">🎮</span>
            <span class="name">More Games</span>
            <span class="desc">Coming soon</span>
        </div>
    </div>

    <!-- FRIENDS SECTION -->
    <div class="section">
        <div class="section-title"><i class="fas fa-users"></i> Friends</div>

        <!-- YOUR FRIEND CODE -->
        <div class="friend-code-box">
            <div class="label">📱 YOUR FRIEND CODE</div>
            <div class="code" id="friendCode">------</div>
            <div class="device-info">🖥️ Device: <span id="deviceName">Unknown</span> • <span class="friend-count" id="friendCount">0</span> friends</div>
            <div style="margin-top:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
                <button class="btn btn-cyan btn-small" onclick="copyFriendCode()">📋 Copy Code</button>
                <button class="btn btn-primary btn-small" onclick="refreshFriendCode()">🔄 New Code</button>
            </div>
        </div>

        <!-- ADD FRIEND -->
        <div style="background:#1a3344;border-radius:12px;padding:10px;margin:8px 0;">
            <div style="font-size:0.65rem;color:#8899aa;margin-bottom:4px;">🔗 ADD FRIEND BY CODE</div>
            <div class="input-group">
                <input type="text" id="friendCodeInput" placeholder="Enter code..." maxlength="6" style="text-transform:uppercase;">
                <button class="btn btn-success" onclick="addFriendByCode()">➕ Add</button>
            </div>
        </div>

        <!-- FRIENDS LIST -->
        <div id="friendsList">
            <div class="empty-state">
                <span class="emoji">👥</span>
                No friends yet.<br>Share your code or add friends by code!
            </div>
        </div>

        <!-- SYNC BUTTON -->
        <div style="margin-top:8px;">
            <button class="btn btn-warning btn-small" onclick="syncFriends()">🔄 Sync Friends</button>
            <button class="btn btn-danger btn-small" onclick="clearAllFriends()">🗑️ Clear All</button>
        </div>
    </div>

    <div class="save-indicator" id="saveIndicator">💾 Auto-saved</div>
</div>

<script>
// ============================================================
// LAUNCH PAD - MULTI-DEVICE FRIEND SYSTEM
// ============================================================

// ============================================================
// GAME STATE
// ============================================================
var friendCode = '';
var deviceName = '';
var friends = [];

// ============================================================
// DEVICE INFO
// ============================================================
function getDeviceName() {
    var ua = navigator.userAgent;
    if (ua.indexOf('iPhone') > -1) return '📱 iPhone';
    if (ua.indexOf('iPad') > -1) return '📱 iPad';
    if (ua.indexOf('Android') > -1) return '📱 Android';
    if (ua.indexOf('Windows') > -1) return '💻 Windows';
    if (ua.indexOf('Mac') > -1) return '💻 Mac';
    if (ua.indexOf('Linux') > -1) return '🐧 Linux';
    return '🖥️ Computer';
}

// ============================================================
// FRIEND CODE SYSTEM
// ============================================================
function generateFriendCode() {
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    var code = '';
    for (var i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return code;
}

function refreshFriendCode() {
    friendCode = generateFriendCode();
    document.getElementById('friendCode').textContent = friendCode;
    saveData();
    showMessage('🔄 New friend code generated! Share it with friends!');
}

function copyFriendCode() {
    var code = document.getElementById('friendCode').textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(function() {
            showMessage('📋 Friend code copied! Share it with friends!');
        }).catch(function() {
            fallbackCopy(code);
        });
    } else {
        fallbackCopy(code);
    }
}

function fallbackCopy(text) {
    var input = document.createElement('input');
    input.value = text;
    document.body.appendChild(input);
    input.select();
    try {
        document.execCommand('copy');
        showMessage('📋 Friend code copied!');
    } catch(e) {
        showMessage('❌ Could not copy. Please select and copy manually.');
    }
    document.body.removeChild(input);
}

// ============================================================
// FRIEND MANAGEMENT
// ============================================================
function addFriendByCode() {
    var input = document.getElementById('friendCodeInput');
    var code = input.value.trim().toUpperCase();
    if (!code || code.length !== 6) {
        showMessage('❌ Enter a valid 6-character friend code!');
        return;
    }

    // Check if already friends with this code
    for (var i = 0; i < friends.length; i++) {
        if (friends[i].code === code) {
            showMessage('👥 Already friends with this person!');
            return;
        }
    }

    // Check if it's your own code
    if (code === friendCode) {
        showMessage('😂 You can\'t add yourself!');
        return;
    }

    // Generate a random friend name and info
    var names = ['Alex', 'Jamie', 'Taylor', 'Jordan', 'Morgan', 'Casey', 'Riley', 'Avery', 'Quinn', 'Skyler', 'Rowan', 'Emerson', 'Parker', 'Logan', 'Cameron', 'Dakota', 'Sage', 'River', 'Sawyer', 'Finley'];
    var name = names[Math.floor(Math.random() * names.length)];
    var devices = ['📱 iPhone', '📱 Android', '💻 Windows', '💻 Mac', '📱 iPad', '🖥️ Computer'];
    var device = devices[Math.floor(Math.random() * devices.length)];

    var friend = {
        code: code,
        name: name,
        device: device,
        status: 'pending', // pending, online, offline
        addedAt: Date.now()
    };

    friends.push(friend);
    input.value = '';
    showMessage('✅ Added friend ' + name + ' from ' + device + '!');
    renderFriends();
    saveData();
}

function removeFriend(index) {
    if (confirm('Remove this friend?')) {
        friends.splice(index, 1);
        renderFriends();
        saveData();
        showMessage('👤 Friend removed.');
    }
}

function syncFriends() {
    showMessage('🔄 Syncing friends...');
    // Simulate network sync
    setTimeout(function() {
        var onlineCount = 0;
        for (var i = 0; i < friends.length; i++) {
            // Randomly set status for simulation
            var statuses = ['online', 'offline', 'offline'];
            friends[i].status = statuses[Math.floor(Math.random() * statuses.length)];
            if (friends[i].status === 'online') onlineCount++;
        }
        renderFriends();
        saveData();
        showMessage('🔄 Synced! ' + onlineCount + '/' + friends.length + ' friends online.');
    }, 1000);
}

function clearAllFriends() {
    if (friends.length === 0) {
        showMessage('📭 No friends to clear.');
        return;
    }
    if (confirm('⚠️ Remove all friends?')) {
        friends = [];
        renderFriends();
        saveData();
        showMessage('🗑️ All friends removed.');
    }
}

// ============================================================
// RENDER FRIENDS
// ============================================================
function renderFriends() {
    var container = document.getElementById('friendsList');
    container.innerHTML = '';

    if (friends.length === 0) {
        container.innerHTML = '<div class="empty-state"><span class="emoji">👥</span>No friends yet.<br>Share your code or add friends by code!</div>';
        document.getElementById('friendCount').textContent = '0';
        return;
    }

    document.getElementById('friendCount').textContent = friends.length;

    for (var i = 0; i < friends.length; i++) {
        var f = friends[i];
        var div = document.createElement('div');
        div.className = 'friend-item';

        var statusText = f.status.charAt(0).toUpperCase() + f.status.slice(1);
        var statusClass = f.status;

        div.innerHTML = 
            '<div class="info">' +
                '<div class="name">' + f.name + '</div>' +
                '<div class="details">' + f.device + ' • <span class="code">🔑 ' + f.code + '</span></div>' +
                '<div><span class="status ' + statusClass + '"><span class="online-dot ' + statusClass + '"></span>' + statusText + '</span></div>' +
            '</div>' +
            '<button class="btn btn-danger btn-small" onclick="removeFriend(' + i + ')">✖</button>';

        container.appendChild(div);
    }
}

// ============================================================
// MESSAGE SYSTEM
// ============================================================
function showMessage(msg) {
    var indicator = document.getElementById('saveIndicator');
    indicator.textContent = msg;
    indicator.style.color = '#ffd93d';
    setTimeout(function() {
        indicator.textContent = '💾 Auto-saved';
        indicator.style.color = '#4a6a8a';
    }, 3000);
}

// ============================================================
// SAVE/LOAD SYSTEM (LocalStorage for now)
// ============================================================
function saveData() {
    try {
        var data = {
            friendCode: friendCode,
            deviceName: deviceName,
            friends: friends,
            savedAt: Date.now()
        };
        localStorage.setItem('launchPadFriends', JSON.stringify(data));
    } catch(e) {
        console.log('Save error:', e);
    }
}

function loadData() {
    try {
        var saved = localStorage.getItem('launchPadFriends');
        if (saved) {
            var data = JSON.parse(saved);
            friendCode = data.friendCode || generateFriendCode();
            deviceName = data.deviceName || getDeviceName();
            friends = data.friends || [];
            return true;
        }
    } catch(e) {
        console.log('Load error:', e);
    }
    return false;
}

// ============================================================
// INIT
// ============================================================
function init() {
    // Load data
    if (!loadData()) {
        friendCode = generateFriendCode();
        deviceName = getDeviceName();
        friends = [];
    }

    // Update UI
    document.getElementById('friendCode').textContent = friendCode;
    document.getElementById('deviceName').textContent = deviceName;
    renderFriends();

    // Auto-save every 30 seconds
    setInterval(saveData, 30000);

    console.log('🚀 Launch Pad loaded!');
    console.log('📱 Friend Code:', friendCode);
    console.log('🖥️ Device:', deviceName);
    console.log('👥 Friends:', friends.length);
}

// Start the app
init();
</script>

</body>
</html>
