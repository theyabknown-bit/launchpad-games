<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tic Tac Toe</title>
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#0b1a26;font-family:Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}.game-box{background:rgba(18,28,40,0.95);border-radius:2.5rem;padding:2rem;border:1px solid rgba(100,200,255,0.12);max-width:500px;width:100%;text-align:center;}.back{display:inline-block;margin-bottom:1rem;color:#b6ddf5;text-decoration:none;background:#1c4055;padding:0.3rem 1.2rem;border-radius:40px;border:1px solid #3a6b88;}.back:hover{background:#2a5a78;}h1{color:white;font-size:2rem;margin-bottom:0.5rem;}h1 i{color:#f5c87c;}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;max-width:300px;margin:1rem auto;}.cell{aspect-ratio:1;background:#0a121a;border-radius:1rem;display:flex;align-items:center;justify-content:center;font-size:4rem;cursor:pointer;border:2px solid #1a3a5a;transition:0.15s;}.cell:hover:not(.taken){border-color:#7fc9ff;}.cell.taken{cursor:default;}.cell.x{color:#7fc9ff;}.cell.o{color:#f5c87c;}.stats{display:flex;justify-content:space-between;color:#9bbfd9;margin-top:1rem;flex-wrap:wrap;gap:0.5rem;}.btn{background:#1a3a5a;border:1px solid #2a5a7a;padding:0.5rem 1.5rem;border-radius:40px;color:white;cursor:pointer;transition:0.15s;}.btn:hover{background:#2a5a7a;}.message{margin-top:0.5rem;padding:0.6rem;border-radius:1rem;background:#0f172a;color:#b0d4f0;min-height:40px;border-left:4px solid #7fc9ff;}
</style></head>
<body>
<div class="game-box">
<a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
<h1><i class="fas fa-times"></i> Tic Tac Toe</h1>
<div class="board" id="board"></div>
<div class="stats"><span>Player: <span id="turn">X</span></span><span>Score: X <span id="scoreX">0</span> - O <span id="scoreO">0</span></span></div>
<button class="btn" onclick="resetGame()"><i class="fas fa-rotate"></i> restart</button>
<div class="message" id="msg"><i class="fas fa-info-circle"></i> X goes first!</div>
</div>
<script>
let board=[], current='X', gameOver=false, scoreX=0, scoreO=0;
const boardEl=document.getElementById('board'), turnEl=document.getElementById('turn'), msg=document.getElementById('msg'), scoreXEl=document.getElementById('scoreX'), scoreOEl=document.getElementById('scoreO');
function initGame(){board=Array(9).fill(null);current='X';gameOver=false;render();msg.innerHTML='<i class="fas fa-info-circle"></i> X goes first!';}
function render(){boardEl.innerHTML=board.map((cell,i)=><div class="cell " onclick="makeMove()"></div>).join('');turnEl.textContent=current;}
function makeMove(i){if(board[i]||gameOver)return;board[i]=current;if(checkWinner()){const winner=current;gameOver=true;msg.innerHTML='<i class="fas fa-trophy" style="color:#ffd700;"></i> 🎉 '+winner+' wins!';if(winner==='X')scoreX++;else scoreO++;updateScore();render();return;}if(board.every(c=>c)){gameOver=true;msg.innerHTML='<i class="fas fa-handshake"></i> It\'s a tie!';render();return;}current=current==='X'?'O':'X';render();}
function checkWinner(){const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return wins.some(w=>board[w[0]]&&board[w[0]]===board[w[1]]&&board[w[0]]===board[w[2]]);}
function updateScore(){scoreXEl.textContent=scoreX;scoreOEl.textContent=scoreO;}
function resetGame(){initGame();updateScore();}
initGame();
</script>
</body>
</html>
