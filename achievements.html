<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Achievements</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a26;
            color: #d0e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8);
        }
        .back-btn {
            display: inline-block;
            color: #4fc3f7;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            transition: 0.2s;
        }
        .back-btn:hover { color: #7cf5b0; transform: translateX(-4px); }
        h1 { color: #4fc3f7; font-size: 2.5rem; margin-bottom: 0.5rem; text-align: center; }
        .subtitle { color: #8899aa; text-align: center; margin-bottom: 2rem; font-size: 1rem; }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 2rem;
        }
        .stat-box {
            background: #1a3344;
            padding: 12px 8px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #2a4a5e;
        }
        .stat-box .number { color: #4fc3f7; font-size: 1.5rem; font-weight: 700; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.6rem; text-transform: uppercase; }

        .achievement-grid {
            display: grid;
            gap: 12px;
        }
        .achievement {
            background: #1a3344;
            border-radius: 16px;
            padding: 16px 20px;
            border: 2px solid #2a4a5e;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.2s;
        }
        .achievement.unlocked {
            border-color: #7cf5b0;
            background: #1a4a3a;
        }
        .achievement.locked {
            opacity: 0.5;
            filter: grayscale(0.5);
        }
        .achievement .icon { font-size: 2.5rem; min-width: 50px; text-align: center; }
        .achievement .info { flex: 1; }
        .achievement .info .name { font-weight: 700; font-size: 1.1rem; color: #f0f8ff; }
        .achievement .info .desc { font-size: 0.85rem; color: #8899aa; }
        .achievement .info .progress { font-size: 0.75rem; color: #4a6a8a; margin-top: 4px; }
        .achievement .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .achievement .badge.unlocked { background: #1a4a3a; color: #7cf5b0; }
        .achievement .badge.locked { background: #2a2a3a; color: #4a6a8a; }

        @media (max-width: 480px) {
            .stats-summary { grid-template-columns: repeat(2, 1fr); }
            .achievement { padding: 12px 14px; }
            .achievement .icon { font-size: 2rem; min-width: 40px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Launchpad</a>
    <h1>🏆 Achievements</h1>
    <p class="subtitle">Track your gaming progress!</p>

    <div class="stats-summary">
        <div class="stat-box">
            <span class="number" id="totalGames">0</span>
            <span class="label">Games Played</span>
        </div>
        <div class="stat-box">
            <span class="number" id="totalXp">0</span>
            <span class="label">Total XP</span>
        </div>
        <div class="stat-box">
            <span class="number" id="playerLevel">1</span>
            <span class="label">Level</span>
        </div>
        <div class="stat-box">
            <span class="number" id="achievementCount">0</span>
            <span class="label">Unlocked</span>
        </div>
    </div>

    <div class="achievement-grid" id="achievementGrid"></div>
</div>

<script>
// ============================================================
// ACHIEVEMENTS DATA
// ============================================================
const ACHIEVEMENTS = [
    { 
        id: 'first_game',
        name: '🎮 First Game!',
        desc: 'Play your first game',
        emoji: '🎮',
        check: (progress) => (progress.gamesPlayed || 0) >= 1
    },
    { 
        id: 'game_master',
        name: '🎯 Game Master!',
        desc: 'Play 10 different games',
        emoji: '👑',
        check: (progress) => (progress.gamesPlayed || 0) >= 10
    },
    { 
        id: 'xp_collector',
        name: '⭐ XP Collector!',
        desc: 'Earn 100 total XP',
        emoji: '⭐',
        check: (progress) => (progress.totalXp || 0) >= 100
    },
    { 
        id: 'level_up',
        name: '⬆️ Level Up!',
        desc: 'Reach Level 5',
        emoji: '🏅',
        check: (progress) => {
            const level = Math.floor((progress.totalXp || 0) / 100) + 1;
            return level >= 5;
        }
    }
];

// ============================================================
// LOAD PROGRESS
// ============================================================
function loadProgress() {
    try {
        const data = localStorage.getItem('launchpad_progress');
        if (data) {
            return JSON.parse(data);
        }
    } catch(e) {}
    return { games: {}, totalXp: 0, gamesPlayed: 0 };
}

function loadAchievements() {
    try {
        const data = localStorage.getItem('launchpad_achievements');
        if (data) {
            return JSON.parse(data);
        }
    } catch(e) {}
    return [];
}

// ============================================================
// RENDER
// ============================================================
function render() {
    const progress = loadProgress();
    const unlocked = loadAchievements();
    
    // Stats
    const gamesPlayed = progress.gamesPlayed || 0;
    const totalXp = progress.totalXp || 0;
    const level = Math.floor(totalXp / 100) + 1;
    
    document.getElementById('totalGames').textContent = gamesPlayed;
    document.getElementById('totalXp').textContent = totalXp;
    document.getElementById('playerLevel').textContent = level;
    document.getElementById('achievementCount').textContent = unlocked.length + '/4';

    // Achievement grid
    const grid = document.getElementById('achievementGrid');
    grid.innerHTML = '';

    ACHIEVEMENTS.forEach(ach => {
        const isUnlocked = unlocked.includes(ach.id);
        const div = document.createElement('div');
        div.className = 'achievement ' + (isUnlocked ? 'unlocked' : 'locked');
        
        div.innerHTML = `
            <div class="icon">${ach.emoji}</div>
            <div class="info">
                <div class="name">${ach.name}</div>
                <div class="desc">${ach.desc}</div>
            </div>
            <span class="badge ${isUnlocked ? 'unlocked' : 'locked'}">
                ${isUnlocked ? '✅ Unlocked' : '🔒 Locked'}
            </span>
        `;
        grid.appendChild(div);
    });
}

// ============================================================
// INIT
// ============================================================
render();

// Refresh every 5 seconds
setInterval(render, 5000);
    // ============================================================
    // ACHIEVEMENT POPUP SYSTEM - WORKS EVERYWHERE
    // ============================================================
    
    // Check achievements and show popup
    function checkAchievements() {
        try {
            const progress = JSON.parse(localStorage.getItem('launchpad_progress') || '{"games":{},"totalXp":0,"gamesPlayed":0}');
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            let newAchievements = [];

            // First game
            if (progress.gamesPlayed >= 1 && !unlocked.includes('first_game')) {
                newAchievements.push('first_game');
                showAchievementPopup('🎮', 'First Game!', 'Played your first game!');
            }

            // Game master (10 games)
            if (progress.gamesPlayed >= 10 && !unlocked.includes('game_master')) {
                newAchievements.push('game_master');
                showAchievementPopup('👑', 'Game Master!', 'Played 10 games!');
            }

            // XP collector
            if (progress.totalXp >= 100 && !unlocked.includes('xp_collector')) {
                newAchievements.push('xp_collector');
                showAchievementPopup('⭐', 'XP Collector!', 'Earned 100 XP!');
            }

            // Level up
            const level = Math.floor((progress.totalXp || 0) / 100) + 1;
            if (level >= 5 && !unlocked.includes('level_up')) {
                newAchievements.push('level_up');
                showAchievementPopup('🏅', 'Level Up!', 'Reached Level 5!');
            }

            // Save new achievements
            if (newAchievements.length > 0) {
                const all = [...unlocked, ...newAchievements];
                localStorage.setItem('launchpad_achievements', JSON.stringify(all));
                updateAchievementCount();
            }

            return newAchievements;
        } catch(e) { return []; }
    }

    // Show achievement popup
    function showAchievementPopup(emoji, title, desc) {
        try { playAchievement(); } catch(e) {}
        // Check if popup already exists
        let popup = document.getElementById('achievementPopupGlobal');
        if (!popup) {
            popup = document.createElement('div');
            popup.id = 'achievementPopupGlobal';
            popup.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(18, 16, 30, 0.96);
                backdrop-filter: blur(20px);
                border: 2px solid #7cf5b0;
                border-radius: 16px;
                padding: 16px 24px;
                max-width: 350px;
                z-index: 99999;
                box-shadow: 0 20px 60px rgba(0,0,0,0.6);
                display: none;
                animation: slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
                color: #d0e8f0;
                font-family: 'Segoe UI', Roboto, sans-serif;
            `;
            document.body.appendChild(popup);
            
            // Add animation styles
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideInRight {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes slideOutRight {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
                @keyframes pulseGold {
                    0%, 100% { box-shadow: 0 0 20px rgba(124, 245, 176, 0.1); }
                    50% { box-shadow: 0 0 40px rgba(124, 245, 176, 0.3); }
                }
            `;
            document.head.appendChild(style);
        }

        // Fill popup content
        popup.innerHTML = `
            <div style="display:flex;align-items:center;gap:14px;">
                <div style="font-size:2.8rem;line-height:1;">${emoji}</div>
                <div>
                    <div style="color:#7cf5b0;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;">🏆 Achievement Unlocked!</div>
                    <div style="color:#f0f8ff;font-weight:700;font-size:1.1rem;">${title}</div>
                    <div style="color:#8899aa;font-size:0.85rem;">${desc}</div>
                </div>
            </div>
            <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end;">
                <button onclick="document.getElementById('achievementPopupGlobal').style.display='none'" style="
                    background:rgba(255,255,255,0.05);
                    border:1px solid rgba(255,255,255,0.1);
                    color:#8899aa;
                    padding:4px 14px;
                    border-radius:20px;
                    cursor:pointer;
                    font-size:0.7rem;
                    font-family:'Segoe UI',sans-serif;
                ">Dismiss</button>
            </div>
        `;

        // Show popup
        popup.style.display = 'block';
        popup.style.animation = 'slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';

        // Auto-hide after 6 seconds
        clearTimeout(popup._timeout);
        popup._timeout = setTimeout(() => {
            popup.style.animation = 'slideOutRight 0.4s ease-in';
            setTimeout(() => {
                popup.style.display = 'none';
                popup.style.animation = '';
            }, 400);
        }, 6000);

        // Play sound
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [523, 659, 784, 1047].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }, i * 120);
            });
        } catch(e) {}
    }

    // Update achievement count in stats
    function updateAchievementCount() {
        try {
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            const countEl = document.getElementById('achievementCount');
            if (countEl) countEl.textContent = unlocked.length;
        } catch(e) {}
    }

    // Check achievements every 10 seconds
    setInterval(checkAchievements, 10000);

    // Also check on page load
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(checkAchievements, 1000);
    });

    // Check when progress updates
    const origSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        origSetItem.apply(this, arguments);
        if (key === 'launchpad_progress') {
            setTimeout(checkAchievements, 500);
        }
    };
    // ============================================================
    // UNIVERSAL SOUND SYSTEM - FIXED FOR ALL GAMES
    // ============================================================
    let soundEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;

    function unlockAudio() {
        if (audioUnlocked) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioUnlocked = true;
            console.log('🔊 Audio unlocked!');
        } catch(e) { console.log('Audio error:', e); }
    }

    // Unlock on any user interaction
    document.addEventListener('click', unlockAudio, { once: false });
    document.addEventListener('touchstart', unlockAudio, { once: false });
    document.addEventListener('keydown', unlockAudio, { once: false });

    function getAudioCtx() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playTone(frequency, duration = 150, volume = 0.12, type = 'sine') {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(frequency, ctx.currentTime);
            gain.gain.setValueAtTime(volume, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + duration / 1000);
        } catch(e) { console.log('Play error:', e); }
    }

    // Sound effects
    function playClick() { playTone(600, 80); }
    function playWin() { 
        playTone(523, 150); 
        setTimeout(() => playTone(659, 150), 150); 
        setTimeout(() => playTone(784, 200), 300); 
    }
    function playLose() { 
        playTone(300, 200); 
        setTimeout(() => playTone(200, 300), 200); 
    }
    function playCorrect() { playTone(800, 100); }
    function playWrong() { playTone(250, 200); }
    function playLevelUp() { 
        playTone(440, 100); 
        setTimeout(() => playTone(523, 100), 100); 
        setTimeout(() => playTone(659, 150), 200); 
    }
    function playAchievement() {
        // Special achievement sound - ascending tones
        playTone(523, 150, 0.15);
        setTimeout(() => playTone(659, 150, 0.15), 150);
        setTimeout(() => playTone(784, 150, 0.15), 300);
        setTimeout(() => playTone(1047, 200, 0.12), 450);
        setTimeout(() => playTone(1318, 250, 0.10), 600);
    }
    function playMine() { playTone(500, 80, 0.10, 'square'); }
    function playCrash() { playTone(150, 400, 0.15); setTimeout(() => playTone(100, 300, 0.10), 200); }
    function playCollect() { playTone(880, 100, 0.10); setTimeout(() => playTone(1100, 120, 0.10), 100); }

    // Add sound toggle to settings if it exists
    function addSoundToggle() {
        const settings = document.getElementById('settingsPanel');
        if (!settings) return;
        // Check if toggle already exists
        if (settings.querySelector('#soundToggle')) return;
        const item = document.createElement('div');
        item.className = 'settings-item';
        item.innerHTML = `
            <span class="label">🔊 Sound Effects</span>
            <div class="settings-toggle active" id="soundToggle"><div class="knob"></div></div>
        `;
        settings.appendChild(item);
        document.getElementById('soundToggle').addEventListener('click', function() {
            this.classList.toggle('active');
            soundEnabled = this.classList.contains('active');
            if (soundEnabled) playClick();
        });
    }

    // Try to add sound toggle when page loads
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(addSoundToggle, 500);
    });

    console.log('🔊 Sound system loaded!');
</script>
</body>
</html>
