<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Builder</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(10,14,30,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #2a3f5a;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; display: flex; align-items: center; gap: 10px; justify-content: center; }
    h1 i { color: #ffb347; }
    .back { display: inline-block; margin-bottom: 1rem; color: #b6ddf5; text-decoration: none; background: #1c4055; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #3a6b88; }
    .back:hover { background: #2a5a78; }
    .planet-container {
      background: #0f172a;
      border-radius: 1.5rem;
      padding: 2rem;
      margin: 1rem 0;
      border: 1px solid #1e3347;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .planet-display {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      transition: 0.3s;
      position: relative;
      margin: 0 auto;
      box-shadow: 0 0 40px rgba(255,180,50,0.2);
    }
    .planet-display .size-label {
      position: absolute;
      bottom: -30px;
      color: #8ab4d8;
      font-size: 0.9rem;
    }
    .planet-display .name-label {
      position: absolute;
      top: -35px;
      color: white;
      font-size: 1.2rem;
      font-weight: 600;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.8rem;
      margin: 1rem 0;
      width: 100%;
    }
    .stat-box {
      background: rgba(0,0,0,0.3);
      border-radius: 0.8rem;
      padding: 0.5rem;
      text-align: center;
    }
    .stat-box .val { color: white; font-size: 1.3rem; font-weight: 700; }
    .stat-box .label { color: #7f9fb9; font-size: 0.7rem; text-transform: uppercase; }
    .action-bar { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin-top: 0.5rem; }
    .action-bar .btn {
      background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.6rem 1.5rem;
      border-radius: 40px; color: white; cursor: pointer; font-size: 0.9rem; transition: 0.15s;
    }
    .action-bar .btn:hover { background: #2a5a7a; }
    .action-bar .btn.danger { background: #4a1a1a; border-color: #6a2a2a; }
    .action-bar .btn.danger:hover { background: #6a2a2a; }
    .action-bar .btn.grow { background: #1a4a3a; border-color: #2a6a4a; }
    .action-bar .btn.grow:hover { background: #2a6a4a; }
    .message { margin-top: 0.8rem; padding: 0.7rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
    .xp-bar { background: #0a1a2a; border-radius: 1rem; height: 18px; overflow: hidden; border: 1px solid #1a3a5a; margin: 0.5rem 0; }
    .xp-fill { height: 100%; background: linear-gradient(90deg, #4fc3f7, #7cf5b0); border-radius: 1rem; transition: width 0.3s; width: 0%; }
    .level-up { background: linear-gradient(135deg, #1a4a3a, #2a6a4a); border: 2px solid #7cf5b0; border-radius: 1rem; padding: 0.8rem; text-align: center; color: white; margin: 0.5rem 0; display: none; }
    .level-up.show { display: block; }
    .level-up i { color: #ffd966; font-size: 1.5rem; }
    @media (max-width: 500px) { .planet-display { width: 150px; height: 150px; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-globe"></i> Planet Builder</h1>
  
  <div class="level-up" id="levelUpBox">
    <i class="fas fa-arrow-up"></i> <span id="levelUpText">LEVEL UP!</span>
  </div>

  <div class="planet-container">
    <div class="planet-display" id="planetDisplay">
      <span class="name-label" id="planetName">🌍 Earth</span>
      <span id="planetEmoji">🌍</span>
      <span class="size-label" id="planetSize">Size: 1</span>
    </div>
    
    <div class="stats-grid">
      <div class="stat-box"><div class="val" id="massDisplay">10</div><div class="label">Mass</div></div>
      <div class="stat-box"><div class="val" id="levelDisplay">1</div><div class="label">Level</div></div>
      <div class="stat-box"><div class="val" id="xpDisplay">0</div><div class="label">XP</div></div>
    </div>
    
    <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#4a6a8a;">
      <span>XP to next: <span id="xpToNext">10</span></span>
      <span>Gravity: <span id="gravityDisplay">1.0</span>G</span>
    </div>
    <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>

    <div class="action-bar">
      <button class="btn grow" id="growBtn"><i class="fas fa-arrow-up"></i> Grow</button>
      <button class="btn" id="mineBtn"><i class="fas fa-pickaxe"></i> Mine</button>
      <button class="btn danger" id="resetBtn"><i class="fas fa-rotate"></i> Reset</button>
    </div>
    <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> Click Grow to expand your planet!</div>
  </div>
</div>

<script>
  const PLANETS = [
    { name: 'Moon', emoji: '🌙', minMass: 0, maxMass: 5, color: '#b0b0b0', gravity: 0.2 },
    { name: 'Mars', emoji: '🟠', minMass: 6, maxMass: 15, color: '#c4713b', gravity: 0.4 },
    { name: 'Earth', emoji: '🌍', minMass: 16, maxMass: 30, color: '#4a8bc2', gravity: 1.0 },
    { name: 'Jupiter', emoji: '🟤', minMass: 31, maxMass: 60, color: '#c88b5a', gravity: 2.5 },
    { name: 'Star', emoji: '⭐', minMass: 61, maxMass: 100, color: '#ffb347', gravity: 5.0 }
  ];

  let mass = 10, level = 1, xp = 0, xpToNext = 10;
  const massDisplay = document.getElementById('massDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const xpFill = document.getElementById('xpFill');
  const xpToNextDisplay = document.getElementById('xpToNext');
  const gravityDisplay = document.getElementById('gravityDisplay');
  const planetDisplay = document.getElementById('planetDisplay');
  const planetName = document.getElementById('planetName');
  const planetEmoji = document.getElementById('planetEmoji');
  const planetSize = document.getElementById('planetSize');
  const messageBox = document.getElementById('messageBox');
  const levelUpBox = document.getElementById('levelUpBox');
  const levelUpText = document.getElementById('levelUpText');

  function getPlanet() {
    for (let p of PLANETS) {
      if (mass >= p.minMass && mass <= p.maxMass) return p;
    }
    return PLANETS[PLANETS.length-1];
  }

  function updateUI() {
    const p = getPlanet();
    massDisplay.textContent = mass;
    levelDisplay.textContent = level;
    xpDisplay.textContent = xp;
    const pct = Math.min(100, (xp / xpToNext) * 100);
    xpFill.style.width = pct + '%';
    xpToNextDisplay.textContent = xpToNext - xp;
    gravityDisplay.textContent = p.gravity.toFixed(1);
    
    planetName.textContent = p.name;
    planetEmoji.textContent = p.emoji;
    planetSize.textContent = `Size: ${mass}`;
    planetDisplay.style.background = `radial-gradient(circle at 35% 30%, ${p.color}, ${adjustColor(p.color, -40)})`;
    const size = 100 + mass * 1.2;
    planetDisplay.style.width = Math.min(250, size) + 'px';
    planetDisplay.style.height = Math.min(250, size) + 'px';
    planetDisplay.style.fontSize = Math.min(5, 2 + mass * 0.04) + 'rem';
  }

  function adjustColor(hex, percent) {
    let r = parseInt(hex.slice(1,2), 16)*17||parseInt(hex.slice(1,3),16);
    let g = parseInt(hex.slice(2,3), 16)*17||parseInt(hex.slice(3,5),16);
    let b = parseInt(hex.slice(3,4), 16)*17||parseInt(hex.slice(5,7),16);
    r = Math.max(0, Math.min(255, r + percent));
    g = Math.max(0, Math.min(255, g + percent));
    b = Math.max(0, Math.min(255, b + percent));
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  }

  function addXP(amount) {
    xp += amount;
    while (xp >= xpToNext) {
      xp -= xpToNext;
      level++;
      xpToNext = Math.floor(xpToNext * 1.3) + 5;
      levelUpBox.classList.add('show');
      levelUpText.textContent = `LEVEL ${level}! Planet growing!`;
      setTimeout(() => levelUpBox.classList.remove('show'), 2500);
    }
    updateUI();
  }

  function grow() {
    if (mass >= 100) {
      messageBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Your planet is already a star! You can\'t grow bigger!';
      return;
    }
    const gain = Math.floor(Math.random() * 3) + 1 + level;
    mass += gain;
    const xpGain = gain * 2 + level;
    addXP(xpGain);
    messageBox.innerHTML = `<i class="fas fa-check-circle" style="color:#7cf5b0;"></i> Planet grew! +${gain} mass, +${xpGain} XP`;
    updateUI();
    checkEvolution();
  }

  function mine() {
    if (mass < 5) {
      messageBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Planet too small to mine! Grow first.';
      return;
    }
    const loss = Math.floor(Math.random() * 2) + 1;
    mass = Math.max(1, mass - loss);
    const xpGain = loss * 3 + level;
    addXP(xpGain);
    messageBox.innerHTML = `<i class="fas fa-pickaxe"></i> Mining complete! Lost ${loss} mass, gained ${xpGain} XP`;
    updateUI();
  }

  function checkEvolution() {
    const p = getPlanet();
    if (p.name === 'Star') {
      messageBox.innerHTML = '<i class="fas fa-star" style="color:#ffd700;"></i> ⭐ Your planet has become a STAR! Amazing!';
    } else if (p.name === 'Jupiter' && mass >= 40) {
      messageBox.innerHTML = '<i class="fas fa-gas-pump"></i> Your planet is becoming a gas giant!';
    }
  }

  function resetGame() {
    if (!confirm('Reset your planet?')) return;
    mass = 10; level = 1; xp = 0; xpToNext = 10;
    updateUI();
    messageBox.innerHTML = '<i class="fas fa-rotate"></i> Planet reset! Start again.';
  }

  document.getElementById('growBtn').addEventListener('click', grow);
  document.getElementById('mineBtn').addEventListener('click', mine);
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  updateUI();
</script>
</body>
</html>
