<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✏️ Draw It!</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
canvas{background:#0f1f2e;border-radius:12px;border:2px solid #1a3344;touch-action:none;width:100%;max-width:400px;height:auto;aspect-ratio:1;}
.controls{display:flex;gap:10px;justify-content:center;margin:15px 0;flex-wrap:wrap;}
.controls button{background:#1a3344;color:#d0e8f0;border:2px solid #2a4a5e;padding:8px 16px;border-radius:8px;cursor:pointer;touch-action:manipulation;}
.controls button:hover{background:#2a4a5e;border-color:#4fc3f7;}
.controls button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-paint-brush" style="color:#4fc3f7;"></i> Draw It!</h1>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="controls">
        <button id="penBtn" class="active">✏️ Pen</button>
        <button id="eraserBtn">🧹 Eraser</button>
        <button id="clearBtn">🗑️ Clear</button>
    </div>
    <div class="message" id="message">🎯 Draw anything you want!</div>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let drawing=false,lastX=0,lastY=0,color='#4fc3f7',size=3,mode='pen';

ctx.fillStyle='#0f1f2e';
ctx.fillRect(0,0,400,400);

function startDraw(e){drawing=true;const rect=canvas.getBoundingClientRect();const scaleX=canvas.width/rect.width;const scaleY=canvas.height/rect.height;lastX=(e.clientX||e.touches[0].clientX-rect.left)*scaleX;lastY=(e.clientY||e.touches[0].clientY-rect.top)*scaleY;}
function draw(e){if(!drawing)return;e.preventDefault();const rect=canvas.getBoundingClientRect();const scaleX=canvas.width/rect.width;const scaleY=canvas.height/rect.height;const x=(e.clientX||e.touches[0].clientX-rect.left)*scaleX;const y=(e.clientY||e.touches[0].clientY-rect.top)*scaleY;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.strokeStyle=mode==='eraser'?'#0f1f2e':color;ctx.lineWidth=mode==='eraser'?20:size;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();lastX=x;lastY=y;}
function endDraw(){drawing=false;}

canvas.addEventListener('mousedown',startDraw);
canvas.addEventListener('mousemove',draw);
canvas.addEventListener('mouseup',endDraw);
canvas.addEventListener('mouseleave',endDraw);
canvas.addEventListener('touchstart',(e)=>{e.preventDefault();startDraw(e);});
canvas.addEventListener('touchmove',(e)=>{e.preventDefault();draw(e);});
canvas.addEventListener('touchend',endDraw);

document.getElementById('penBtn').addEventListener('click',function(){mode='pen';document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));this.classList.add('active');});
document.getElementById('eraserBtn').addEventListener('click',function(){mode='eraser';document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));this.classList.add('active');});
document.getElementById('clearBtn').addEventListener('click',()=>{ctx.fillStyle='#0f1f2e';ctx.fillRect(0,0,400,400);});
</script>
</body>
</html>
