<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔢 Number Crunch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.problem{font-size:3rem;font-weight:700;color:#ffd93d;margin:20px 0;min-height:80px;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.option{background:#1a3344;padding:15px;border-radius:10px;border:2px solid #2a4a5e;cursor:pointer;font-size:1.5rem;font-weight:700;transition:0.2s;touch-action:manipulation;}
.option:hover{background:#2a4a5e;border-color:#4fc3f7;}
.option.correct{background:#1a4a3a;border-color:#7cf5b0;}
.option.wrong{background:#3a1a1a;border-color:#ff6b6b;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-calculator" style="color:#4fc3f7;"></i> Number Crunch</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="time">30</span><span class="label">Time</span></div>
        <div class="stat-box"><span id="highScore">0</span><span class="label">Best</span></div>
    </div>
    <div class="problem" id="problem">?</div>
    <div class="options" id="options"></div>
    <button class="btn" id="startBtn">▶ Start Game</button>
    <div class="message" id="message">🎯 Solve math problems fast!</div>
</div>
<script>
function updateGameProgress(gameId){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.games)s.games={};if(!s.games[gameId])s.games[gameId]={played:false,xp:0};var g=s.games[gameId];if(!g.played){g.played=true;s.gamesPlayed=(s.gamesPlayed||0)+1;}g.xp=(g.xp||0)+1;var t=0,p=0;Object.values(s.games).forEach(function(x){t+=(x.xp||0);if(x.played)p++;});s.totalXp=t;s.gamesPlayed=p;localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

let score=0,timeLeft=30,highScore=parseInt(localStorage.getItem('numberHigh'))||0;
let gameActive=false,timerInterval=null;

const problemEl=document.getElementById('problem'),optionsEl=document.getElementById('options');
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time');
const highEl=document.getElementById('highScore'),msg=document.getElementById('message');

function generateProblem(){
    const ops=['+','-','×'];
    const op=ops[Math.floor(Math.random()*ops.length)];
    let a=Math.floor(Math.random()*12)+1,b=Math.floor(Math.random()*12)+1;
    if(op==='-'){if(a<b)[a,b]=[b,a];}
    if(op==='×'){a=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*10)+1;}
    let answer;
    if(op==='+')answer=a+b;
    else if(op==='-')answer=a-b;
    else answer=a*b;
    problemEl.textContent=a+' '+op+' '+b+' = ?';
    // Generate options
    let options=[answer];
    while(options.length<4){
        let wrong=answer+(Math.floor(Math.random()*10)-5);
        if(wrong!==answer&&!options.includes(wrong)&&wrong>0)options.push(wrong);
    }
    // Shuffle
    for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}
    optionsEl.innerHTML='';
    options.forEach(opt=>{
        const div=document.createElement('div');
        div.className='option';
        div.textContent=opt;
        div.addEventListener('click',()=>checkAnswer(opt,answer));
        optionsEl.appendChild(div);
    });
}

function checkAnswer(selected,correct){
    if(!gameActive)return;
    const options=optionsEl.querySelectorAll('.option');
    options.forEach(el=>el.style.pointerEvents='none');
    if(selected===correct){
        score++;
        scoreEl.textContent=score;
        options.forEach(el=>{if(parseInt(el.textContent)===correct)el.classList.add('correct');});
        setTimeout(()=>{if(gameActive)generateProblem();},300);
    }else{
        options.forEach(el=>{
            if(parseInt(el.textContent)===correct)el.classList.add('correct');
            if(parseInt(el.textContent)===selected&&selected!==correct)el.classList.add('wrong');
        });
        setTimeout(()=>{if(gameActive)generateProblem();},500);
    }
}

function startGame(){
    if(gameActive)return;
    updateGameProgress('numbercrunch');
    score=0;timeLeft=30;
    scoreEl.textContent=0;timeEl.textContent=30;
    highEl.textContent=highScore;
    document.getElementById('startBtn').textContent='⏳ Playing...';
    gameActive=true;
    msg.textContent='⚡ GO!';
    generateProblem();
    timerInterval=setInterval(()=>{
        timeLeft--;
        timeEl.textContent=timeLeft;
        if(timeLeft<=0)endGame();
    },1000);
}

function endGame(){
    gameActive=false;
    clearInterval(timerInterval);
    if(score>highScore){highScore=score;localStorage.setItem('numberHigh',highScore);}
    highEl.textContent=highScore;
    msg.textContent='🎉 Game Over! Score: '+score;
    document.getElementById('startBtn').textContent='▶ Play Again';
    problemEl.textContent='🎯 Done!';
    optionsEl.innerHTML='';
}

document.getElementById('startBtn').addEventListener('click',startGame);
highEl.textContent=highScore;
msg.textContent='🎯 Solve math problems fast!';
</script>
</body>
</html>
