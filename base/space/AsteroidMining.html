<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteroid Mining</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e1a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-box {
      background: rgba(10,14,30,0.95);
      border-radius: 2.5rem;
      padding: 2rem;
      border: 1px solid #2a3f5a;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }
    h1 { color: white; font-size: 2rem; display: flex; align-items: center; gap: 10px; justify-content: center; }
    h1 i { color: #ffb347; }
    .back { display: inline-block; margin-bottom: 1rem; color: #b6ddf5; text-decoration: none; background: #1c4055; padding: 0.3rem 1.2rem; border-radius: 40px; border: 1px solid #3a6b88; }
    .back:hover { background: #2a5a78; }
    .asteroid-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.8rem; margin: 1rem 0; }
    .asteroid {
      background: rgba(0,0,0,0.3); border-radius: 1.5rem; padding: 1rem;
      border: 2px solid #1a3a5a; cursor: pointer; transition: 0.15s;
    }
    .asteroid:hover:not(.mined) { border-color: #ffb347; transform: scale(1.05); }
    .asteroid.mined { opacity: 0.3; cursor: not-allowed; }
    .asteroid .icon { font-size: 2.5rem; }
    .asteroid .name { color: white; font-size: 0.9rem; margin-top: 0.2rem; }
    .asteroid .value { color: #f5c87c; font-size: 0.8rem; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin: 0.8rem 0; }
    .stat-box { background: rgba(0,0,0,0.3); border-radius: 0.8rem; padding: 0.5rem; text-align: center; }
    .stat-box .val { color: white; font-size: 1.3rem; font-weight: 700; }
    .stat-box .label { color: #7f9fb9; font-size: 0.7rem; text-transform: uppercase; }
    .action-bar { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin: 0.5rem 0; }
    .action-bar .btn { background: #1a3a5a; border: 1px solid #2a5a7a; padding: 0.5rem 1.5rem; border-radius: 40px; color: white; cursor: pointer; transition: 0.15s; }
    .action-bar .btn:hover { background: #2a5a7a; }
    .action-bar .btn.danger { background: #4a1a1a; border-color: #6a2a2a; }
    .action-bar .btn.danger:hover { background: #6a2a2a; }
    .message { margin-top: 0.5rem; padding: 0.6rem; border-radius: 1rem; background: #0f172a; color: #b0d4f0; min-height: 40px; border-left: 4px solid #7fc9ff; }
    .xp-bar { background: #0a1a2a; border-radius: 1rem; height: 16px; overflow: hidden; border: 1px solid #1a3a5a; margin: 0.3rem 0; }
    .xp-fill { height: 100%; background: linear-gradient(90deg, #4fc3f7, #7cf5b0); border-radius: 1rem; transition: width 0.3s; width: 0%; }
    @media (max-width: 500px) { .asteroid-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<div class="game-box">
  <a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
  <h1><i class="fas fa-pickaxe"></i> Asteroid Mining</h1>
  
  <div class="stats-grid">
    <div class="stat-box"><div class="val" id="resourcesDisplay">0</div><div class="label">Resources</div></div>
    <div class="stat-box"><div class="val" id="levelDisplay">1</div><div class="label">Level</div></div>
    <div class="stat-box"><div class="val" id="xpDisplay">0</div><div class="label">XP</div></div>
  </div>

  <div class="asteroid-grid" id="asteroidGrid"></div>

  <div class="action-bar">
    <button class="btn" id="refreshBtn"><i class="fas fa-sync"></i> New Asteroids</button>
    <button class="btn danger" id="resetBtn"><i class="fas fa-rotate"></i> Reset</button>
  </div>
  <div class="message" id="messageBox"><i class="fas fa-info-circle"></i> Click asteroids to mine them!</div>
  
  <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#4a6a8a;">
    <span>XP to next: <span id="xpToNext">10</span></span>
  </div>
  <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
</div>

<script>
  const ASTEROIDS = [
    { name: 'Rocky', icon: '🪨', value: 5 },
    { name: 'Iron', icon: '🪨', value: 10 },
    { name: 'Gold', icon: '⭐', value: 20 },
    { name: 'Crystal', icon: '💎', value: 30 },
    { name: 'Platinum', icon: '🔵', value: 40 },
    { name: 'Diamond', icon: '💠', value: 50 },
    { name: 'Uranium', icon: '☢️', value: 60 },
    { name: 'Vibranium', icon: '🟣', value: 80 },
    { name: 'Dark Matter', icon: '🌌', value: 100 }
  ];

  let resources = 0, level = 1, xp = 0, xpToNext = 10;
  let currentAsteroids = [];
  let mined = [];

  const asteroidGrid = document.getElementById('asteroidGrid');
  const resourcesDisplay = document.getElementById('resourcesDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const xpFill = document.getElementById('xpFill');
  const xpToNextDisplay = document.getElementById('xpToNext');
  const messageBox = document.getElementById('messageBox');

  function shuffle(arr) { for (let i=arr.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

  function generateAsteroids() {
    const shuffled = shuffle([...ASTEROIDS]);
    currentAsteroids = shuffled.slice(0, 6);
    mined = Array(6).fill(false);
    renderAsteroids();
  }

  function renderAsteroids() {
    asteroidGrid.innerHTML = currentAsteroids.map((a, i) => `
      <div class="asteroid ${mined[i]?'mined':''}" onclick="mineAsteroid(${i})">
        <div class="icon">${a.icon}</div>
        <div class="name">${a.name}</div>
        <div class="value">💰 ${a.value}</div>
      </div>
    `).join('');
  }

  function addXP(amount) {
    xp += amount;
    while (xp >= xpToNext) {
      xp -= xpToNext;
      level++;
      xpToNext = Math.floor(xpToNext * 1.3) + 5;
      messageBox.innerHTML = `<i class="fas fa-trophy" style="color:#ffd700;"></i> 🎉 LEVEL UP! You're now level ${level}!`;
    }
    updateUI();
  }

  function mineAsteroid(index) {
    if (mined[index]) { messageBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Already mined!'; return; }
    const a = currentAsteroids[index];
    const bonus = Math.floor(level * 1.5);
    const total = a.value + bonus;
    resources += total;
    mined[index] = true;
    const xpGain = 2 + Math.floor(a.value / 10);
    addXP(xpGain);
    messageBox.innerHTML = `<i class="fas fa-pickaxe"></i> Mined ${a.name}! +${total} resources, +${xpGain} XP`;
    renderAsteroids();
    updateUI();
  }

  function refreshAsteroids() {
    generateAsteroids();
    messageBox.innerHTML = '<i class="fas fa-sync"></i> New asteroids appeared!';
  }

  function updateUI() {
    resourcesDisplay.textContent = resources;
    levelDisplay.textContent = level;
    xpDisplay.textContent = xp;
    xpToNextDisplay.textContent = xpToNext - xp;
    const pct = Math.min(100, (xp / xpToNext) * 100);
    xpFill.style.width = pct + '%';
  }

  function resetGame() {
    if (!confirm('Reset mining progress?')) return;
    resources = 0; level = 1; xp = 0; xpToNext = 10;
    generateAsteroids();
    updateUI();
    messageBox.innerHTML = '<i class="fas fa-rotate"></i> Game reset!';
  }

  document.getElementById('refreshBtn').addEventListener('click', refreshAsteroids);
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  window.mineAsteroid = mineAsteroid;
  generateAsteroids();
  updateUI();
</script>
</body>
</html>
