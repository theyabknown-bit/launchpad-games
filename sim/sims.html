<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👤 Sims Mini - Energy Life</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a26;
            color: #d0e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1a3344;
            color: #4fc3f7;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            z-index: 100;
        }
        .back-btn:hover { background: #2a4a5e; transform: translateX(-5px); }
        .container {
            max-width: 500px;
            width: 100%;
            margin-top: 60px;
            text-align: center;
        }
        h1 {
            color: #4fc3f7;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(79, 195, 247, 0.3);
        }
        .subtitle { color: #7cf5b0; margin-bottom: 20px; font-size: 1.1rem; }

        .sim-card {
            background: #0f1f2e;
            border-radius: 20px;
            padding: 25px;
            border: 2px solid #1a3344;
            margin: 15px 0;
        }
        .sim-avatar {
            font-size: 5rem;
            margin: 10px 0;
            display: block;
        }
        .sim-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #4fc3f7;
        }

        .stat-bar {
            margin: 12px 0;
            text-align: left;
        }
        .stat-bar .label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #8899aa;
            margin-bottom: 4px;
        }
        .stat-bar .bar {
            width: 100%;
            height: 12px;
            background: #1a3344;
            border-radius: 10px;
            overflow: hidden;
        }
        .stat-bar .bar .fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .stat-bar .bar .fill.energy { background: linear-gradient(90deg, #4fc3f7, #7cf5b0); }
        .stat-bar .bar .fill.happiness { background: linear-gradient(90deg, #ffd93d, #ff9f43); }
        .stat-bar .bar .fill.hunger { background: linear-gradient(90deg, #ff6b6b, #ff9f43); }
        .stat-bar .bar .fill.sleep { background: linear-gradient(90deg, #a29bfe, #6c5ce7); }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .actions .btn {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .actions .btn:active { transform: scale(0.95); }
        .actions .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-work { background: linear-gradient(135deg, #4fc3f7, #1a6a8a); color: white; }
        .btn-eat { background: linear-gradient(135deg, #ffd93d, #f5a623); color: #0b1a26; }
        .btn-sleep { background: linear-gradient(135deg, #a29bfe, #6c5ce7); color: white; }
        .btn-play { background: linear-gradient(135deg, #7cf5b0, #2d8b4e); color: #0b1a26; }
        .btn-dead { background: linear-gradient(135deg, #ff6b6b, #c0392b); color: white; }

        .btn-reset {
            background: #4fc3f7;
            color: #0b1a26;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn-reset:hover { background: #7cf5b0; }

        .message {
            font-size: 1.2rem;
            min-height: 40px;
            color: #ffd93d;
            font-weight: 600;
            margin: 10px 0;
        }
        .message.dead {
            color: #ff6b6b;
            font-size: 1.5rem;
        }
        .message.dead .skull {
            font-size: 3rem;
            display: block;
            margin: 10px 0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            margin: 5px 0;
        }
        .status-badge.alive { background: #1a4a3a; color: #7cf5b0; }
        .status-badge.dead { background: #3a1a1a; color: #ff6b6b; animation: pulseDead 1s infinite; }

        @keyframes pulseDead {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .death-screen {
            background: rgba(255,0,0,0.05);
            border: 2px solid #ff6b6b;
            border-radius: 20px;
            padding: 30px;
            margin: 15px 0;
        }
        .death-screen .big-skull {
            font-size: 6rem;
            display: block;
            margin: 10px 0;
        }

        @media (max-width: 480px) {
            .actions { grid-template-columns: 1fr 1fr; gap: 8px; }
            .actions .btn { font-size: 0.8rem; padding: 10px; }
            h1 { font-size: 2rem; }
            .sim-avatar { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <a href="../base.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <div class="container">
        <h1><i class="fas fa-user" style="color: #4fc3f7;"></i> Sims Mini</h1>
        <p class="subtitle">Keep your sim alive!</p>

        <div class="sim-card" id="simCard">
            <span class="sim-avatar" id="simAvatar">👤</span>
            <div class="sim-name" id="simName">Your Sim</div>
            <div>
                <span class="status-badge alive" id="statusBadge">✅ Alive</span>
            </div>

            <div class="stat-bar">
                <div class="label">
                    <span>⚡ Energy</span>
                    <span id="energyText">100%</span>
                </div>
                <div class="bar">
                    <div class="fill energy" id="energyBar" style="width:100%"></div>
                </div>
            </div>

            <div class="stat-bar">
                <div class="label">
                    <span>😊 Happiness</span>
                    <span id="happinessText">100%</span>
                </div>
                <div class="bar">
                    <div class="fill happiness" id="happinessBar" style="width:100%"></div>
                </div>
            </div>

            <div class="stat-bar">
                <div class="label">
                    <span>🍖 Hunger</span>
                    <span id="hungerText">100%</span>
                </div>
                <div class="bar">
                    <div class="fill hunger" id="hungerBar" style="width:100%"></div>
                </div>
            </div>

            <div class="stat-bar">
                <div class="label">
                    <span>😴 Sleep</span>
                    <span id="sleepText">100%</span>
                </div>
                <div class="bar">
                    <div class="fill sleep" id="sleepBar" style="width:100%"></div>
                </div>
            </div>
        </div>

        <div class="message" id="message">🎯 Keep your sim alive!</div>

        <div class="actions" id="actions">
            <button class="btn btn-work" id="workBtn">💼 Work (+Energy)</button>
            <button class="btn btn-eat" id="eatBtn">🍕 Eat (+Hunger)</button>
            <button class="btn btn-sleep" id="sleepBtn">😴 Sleep (+Sleep)</button>
            <button class="btn btn-play" id="playBtn">🎮 Play (+Happiness)</button>
        </div>

        <button class="btn-reset" id="resetBtn">🔄 Reset Sim</button>
        <div style="margin-top: 10px; font-size: 0.7rem; color: #444;">
            ⚡ Energy regenerates slowly (1% per 5 seconds)
        </div>
    </div>

    <script>
    // ============================================================
    // FIXED SOUND SYSTEM - WORKS ON FIRST CLICK
    // ============================================================
    let soundEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;

    function unlockAudio() {
        if (audioUnlocked) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioUnlocked = true;
            console.log('🔊 Audio unlocked!');
        } catch(e) { console.log('Audio error:', e); }
    }

    // Unlock audio on any click
    document.addEventListener('click', unlockAudio, { once: false });
    document.addEventListener('touchstart', unlockAudio, { once: false });
    document.addEventListener('keydown', unlockAudio, { once: false });

    function getAudioCtx() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playTone(frequency, duration = 150, type = 'sine') {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration / 1000);
        } catch(e) { console.log('Play error:', e); }
    }

    function playClick() { playTone(600, 80); }
    function playWin() { 
        playTone(523, 150); 
        setTimeout(() => playTone(659, 150), 150); 
        setTimeout(() => playTone(784, 200), 300); 
    }
    function playLose() { 
        playTone(300, 200); 
        setTimeout(() => playTone(200, 300), 200); 
    }
    function playCorrect() { playTone(800, 100); }
    function playWrong() { playTone(250, 200); }
    function playLevelUp() { 
        playTone(440, 100); 
        setTimeout(() => playTone(523, 100), 100); 
        setTimeout(() => playTone(659, 150), 200); 
    }
        // ============================================
        // SIMS MINI - ENERGY SYSTEM
        // ============================================

        // Save system
        function updateGameProgress(gameId) {
            try {
                var s = JSON.parse(localStorage.getItem('launchpad_progress') || '{}');
                if (!s.games) s.games = {};
                if (!s.games[gameId]) s.games[gameId] = { played: false, xp: 0 };
                var g = s.games[gameId];
                if (!g.played) { g.played = true; s.gamesPlayed = (s.gamesPlayed || 0) + 1; }
                g.xp = (g.xp || 0) + 1;
                var t = 0, p = 0;
                Object.values(s.games).forEach(function(x) { t += (x.xp || 0); if (x.played) p++; });
                s.totalXp = t; s.gamesPlayed = p;
                localStorage.setItem('launchpad_progress', JSON.stringify(s));
            } catch(e) {}
        }

        // Game state
        const GAME_ID = 'sims';
        let sim = {
            energy: 100,
            happiness: 100,
            hunger: 100,
            sleep: 100,
            isDead: false,
            lastSave: Date.now()
        };

        let gameInterval = null;
        let energyRegenInterval = null;

        function loadGame() {
            try {
                const saved = localStorage.getItem('simsMiniData');
                if (saved) {
                    const data = JSON.parse(saved);
                    sim = data;
                    // If sim was dead, keep it dead
                    if (sim.isDead) {
                        showDeathScreen();
                    }
                    return true;
                }
            } catch(e) {}
            return false;
        }

        function saveGame() {
            try {
                sim.lastSave = Date.now();
                localStorage.setItem('simsMiniData', JSON.stringify(sim));
            } catch(e) {}
        }

        function updateUI() {
            document.getElementById('energyText').textContent = Math.round(sim.energy) + '%';
            document.getElementById('energyBar').style.width = Math.max(0, sim.energy) + '%';

            document.getElementById('happinessText').textContent = Math.round(sim.happiness) + '%';
            document.getElementById('happinessBar').style.width = Math.max(0, sim.happiness) + '%';

            document.getElementById('hungerText').textContent = Math.round(sim.hunger) + '%';
            document.getElementById('hungerBar').style.width = Math.max(0, sim.hunger) + '%';

            document.getElementById('sleepText').textContent = Math.round(sim.sleep) + '%';
            document.getElementById('sleepBar').style.width = Math.max(0, sim.sleep) + '%';

            const badge = document.getElementById('statusBadge');
            const msg = document.getElementById('message');
            const actions = document.getElementById('actions');

            if (sim.isDead) {
                badge.className = 'status-badge dead';
                badge.textContent = '💀 DEAD';
                msg.className = 'message dead';
                msg.innerHTML = '<span class="skull">💀</span> YOUR SIM DIED! 💀';
                actions.style.display = 'none';
                document.getElementById('simCard').style.borderColor = '#ff6b6b';
                document.getElementById('simAvatar').textContent = '💀';
                document.getElementById('simName').style.color = '#ff6b6b';
            } else {
                badge.className = 'status-badge alive';
                badge.textContent = '✅ Alive';
                msg.className = 'message';
                msg.textContent = '🎯 Keep your sim alive!';
                actions.style.display = 'grid';
                document.getElementById('simCard').style.borderColor = '#1a3344';
                document.getElementById('simAvatar').textContent = '👤';
                document.getElementById('simName').style.color = '#4fc3f7';
            }
        }

        function checkDeath() {
            if (sim.isDead) return true;

            // Check if any stat is 0 or below
            if (sim.energy <= 0 || sim.happiness <= 0 || sim.hunger <= 0 || sim.sleep <= 0) {
                sim.isDead = true;
                // Record that the sim died
                updateGameProgress(GAME_ID);
                saveGame();
                updateUI();
                showDeathScreen();
                return true;
            }
            return false;
        }

        function showDeathScreen() {
            const msg = document.getElementById('message');
            msg.className = 'message dead';
            msg.innerHTML = `
                <span class="skull">💀</span>
                YOUR SIM DIED!<br>
                <span style="font-size:1rem; color:#8899aa;">
                    Energy: ${Math.round(sim.energy)}% | Happiness: ${Math.round(sim.happiness)}%<br>
                    Hunger: ${Math.round(sim.hunger)}% | Sleep: ${Math.round(sim.sleep)}%
                </span>
            `;
            document.getElementById('actions').style.display = 'none';
            document.getElementById('simCard').style.borderColor = '#ff6b6b';
            document.getElementById('simAvatar').textContent = '💀';
            document.getElementById('simName').style.color = '#ff6b6b';
            const badge = document.getElementById('statusBadge');
            badge.className = 'status-badge dead';
            badge.textContent = '💀 DEAD';
        }

        // Actions
        function work() {
            if (sim.isDead) return;
            if (sim.energy < 10) { document.getElementById('message').textContent = '❌ Too tired to work!'; return; }
            sim.energy = Math.min(100, sim.energy + 15);
            sim.happiness = Math.max(0, sim.happiness - 5);
            sim.hunger = Math.max(0, sim.hunger - 10);
            sim.sleep = Math.max(0, sim.sleep - 8);
            document.getElementById('message').textContent = '💼 Worked hard! +15 Energy';
            saveGame();
            updateUI();
            checkDeath();
        }

        function eat() {
            if (sim.isDead) return;
            if (sim.hunger >= 90) { document.getElementById('message').textContent = '🍖 Not hungry!'; return; }
            sim.hunger = Math.min(100, sim.hunger + 25);
            sim.energy = Math.max(0, sim.energy + 5);
            sim.happiness = Math.min(100, sim.happiness + 5);
            document.getElementById('message').textContent = '🍕 Delicious! +25 Hunger';
            saveGame();
            updateUI();
            checkDeath();
        }

        function sleep() {
            if (sim.isDead) return;
            if (sim.sleep >= 90) { document.getElementById('message').textContent = '😴 Not sleepy!'; return; }
            sim.sleep = Math.min(100, sim.sleep + 30);
            sim.energy = Math.min(100, sim.energy + 10);
            sim.hunger = Math.max(0, sim.hunger - 5);
            document.getElementById('message').textContent = '😴 Zzz... +30 Sleep';
            saveGame();
            updateUI();
            checkDeath();
        }

        function play() {
            if (sim.isDead) return;
            if (sim.happiness >= 90) { document.getElementById('message').textContent = '😊 Already happy!'; return; }
            sim.happiness = Math.min(100, sim.happiness + 20);
            sim.energy = Math.max(0, sim.energy - 8);
            sim.hunger = Math.max(0, sim.hunger - 5);
            document.getElementById('message').textContent = '🎮 Fun! +20 Happiness';
            saveGame();
            updateUI();
            checkDeath();
        }

        function resetSim() {
            if (!confirm('Reset your sim? This will start a new life!')) return;
            sim = {
                energy: 100,
                happiness: 100,
                hunger: 100,
                sleep: 100,
                isDead: false,
                lastSave: Date.now()
            };
            document.getElementById('actions').style.display = 'grid';
            saveGame();
            updateUI();
            document.getElementById('message').textContent = '🔄 New life begun! Keep your sim alive!';
            document.getElementById('simCard').style.borderColor = '#1a3344';
            document.getElementById('simAvatar').textContent = '👤';
            document.getElementById('simName').style.color = '#4fc3f7';
            updateGameProgress(GAME_ID);
        }

        // ============================================
        // GAME LOOP - DECAY AND REGEN
        // ============================================
        function startGameLoop() {
            if (gameInterval) clearInterval(gameInterval);
            if (energyRegenInterval) clearInterval(energyRegenInterval);

            // Decay stats every 5 seconds
            gameInterval = setInterval(() => {
                if (sim.isDead) return;

                // Decay stats
                sim.energy = Math.max(0, sim.energy - 2);
                sim.hunger = Math.max(0, sim.hunger - 3);
                sim.sleep = Math.max(0, sim.sleep - 2);
                sim.happiness = Math.max(0, sim.happiness - 1);

                // Check for death
                if (checkDeath()) {
                    saveGame();
                    updateUI();
                    return;
                }

                // Update UI
                updateUI();
                saveGame();

                // Warning messages when stats are low
                const msg = document.getElementById('message');
                if (sim.energy < 20) msg.textContent = '⚠️ Low Energy! Rest or work!';
                else if (sim.hunger < 20) msg.textContent = '⚠️ Starving! Eat something!';
                else if (sim.sleep < 20) msg.textContent = '⚠️ Exhausted! Get some sleep!';
                else if (sim.happiness < 20) msg.textContent = '⚠️ Sad! Do something fun!';
                else if (!msg.textContent.includes('⚠️') && !msg.textContent.includes('💀') && !msg.textContent.includes('🎯')) {
                    msg.textContent = '🎯 Keep your sim alive!';
                }

            }, 5000);

            // Energy regeneration (1% per 5 seconds)
            energyRegenInterval = setInterval(() => {
                if (sim.isDead) return;
                if (sim.energy < 100) {
                    sim.energy = Math.min(100, sim.energy + 1);
                    updateUI();
                    saveGame();
                }
            }, 5000);
        }

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (sim.isDead) return;
            switch(e.key) {
                case 'w': case 'W': work(); break;
                case 'e': case 'E': eat(); break;
                case 's': case 'S': sleep(); break;
                case 'p': case 'P': play(); break;
                case 'r': case 'R': resetSim(); break;
            }
        });

        // ============================================
        // INIT
        // ============================================
        function init() {
            loadGame();
            updateUI();
            startGameLoop();

            // Event listeners
            document.getElementById('workBtn').addEventListener('click', work);
            document.getElementById('eatBtn').addEventListener('click', eat);
            document.getElementById('sleepBtn').addEventListener('click', sleep);
            document.getElementById('playBtn').addEventListener('click', play);
            document.getElementById('resetBtn').addEventListener('click', resetSim);

            if (sim.isDead) {
                showDeathScreen();
            }

            console.log('🧑 Sims Mini - Energy System Loaded!');
            console.log('⚡ Energy regenerates 1% per 5 seconds');
            console.log('💀 If any stat hits 0, your sim dies!');
            console.log('⌨️  W=Work  E=Eat  S=Sleep  P=Play  R=Reset');
        }

        // Start
        init();
        
    

    // Add sound toggle to settings
    function addSoundToggle() {
        const settings = document.getElementById('settingsPanel');
        if (!settings) return;
        const item = document.createElement('div');
        item.className = 'settings-item';
        item.innerHTML = `
            <span class="label">🔊 Sound Effects</span>
            <div class="settings-toggle active" id="soundToggle"><div class="knob"></div></div>
        `;
        settings.appendChild(item);
        document.getElementById('soundToggle').addEventListener('click', function() {
            this.classList.toggle('active');
            soundEnabled = this.classList.contains('active');
            if (soundEnabled) playClick();
        });
    }

    // Minigame: Quick Tap Challenge
    function startQuickTap() {
        if (document.getElementById('minigameOverlay')) return;
        const overlay = document.createElement('div');
        overlay.id = 'minigameOverlay';
        overlay.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; padding: 20px;
            animation: fadeIn 0.3s ease;
        `;
        overlay.innerHTML = `
            <div style="background: #1a1a2e; border-radius: 24px; padding: 30px; max-width: 400px; width: 100%; text-align: center; border: 2px solid rgba(255,215,0,0.1);">
                <h2 style="color: #ffd700; margin-bottom: 10px;">🎯 Quick Tap Challenge</h2>
                <p style="color: #888; margin-bottom: 15px;">Tap as fast as you can!</p>
                <div style="font-size: 72px; margin: 15px 0;" id="tapCounter">0</div>
                <div style="font-size: 24px; color: #ff6b6b; margin-bottom: 10px;" id="tapTimer">3s</div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="tapBtn" style="
                        background: linear-gradient(135deg, #ffd700, #f5a623);
                        border: none; padding: 15px 40px; border-radius: 30px;
                        font-weight: 700; font-size: 18px; color: #1a1a2e;
                        cursor: pointer; font-family: 'Segoe UI', sans-serif;
                    ">👆 TAP!</button>
                    <button onclick="this.closest('#minigameOverlay').remove()" style="
                        background: rgba(255,255,255,0.05);
                        border: 1px solid rgba(255,255,255,0.1);
                        padding: 15px 20px; border-radius: 30px;
                        color: #888; cursor: pointer; font-size: 14px;
                        font-family: 'Segoe UI', sans-serif;
                    ">✕ Close</button>
                </div>
                <div id="tapResult" style="margin-top: 10px; color: #7cf5b0; font-weight: 700;"></div>
            </div>
        `;
        document.body.appendChild(overlay);

        let taps = 0;
        let timeLeft = 3;
        let active = true;

        const tapBtn = document.getElementById('tapBtn');
        const counter = document.getElementById('tapCounter');
        const timer = document.getElementById('tapTimer');
        const result = document.getElementById('tapResult');

        tapBtn.addEventListener('click', function() {
            if (!active) return;
            taps++;
            counter.textContent = taps;
            playClick();
            this.style.transform = 'scale(0.9)';
            setTimeout(() => this.style.transform = '', 100);
        });

        const interval = setInterval(() => {
            timeLeft--;
            timer.textContent = timeLeft + 's';
            if (timeLeft <= 0) {
                clearInterval(interval);
                active = false;
                tapBtn.disabled = true;
                tapBtn.style.opacity = '0.5';
                const reward = taps * 50;
                result.textContent = '🏆 You tapped ' + taps + ' times! +' + reward + ' points!';

                // Add points if game supports it
                if (typeof points !== 'undefined') {
                    points += reward;
                    if (typeof updateUI === 'function') updateUI();
                    if (typeof saveGame === 'function') saveGame();
                }
                setTimeout(() => {

                }, 3000);
            }

        style.textContent = '@keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }';

    // Check achievements and show popup
    function checkAchievements() {
        try {
            const progress = JSON.parse(localStorage.getItem('launchpad_progress') || '{"games":{},"totalXp":0,"gamesPlayed":0}');
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            let newAchievements = [];

            // First game
            if (progress.gamesPlayed >= 1 && !unlocked.includes('first_game')) {
                newAchievements.push('first_game');
                showAchievementPopup('🎮', 'First Game!', 'Played your first game!');
            }

            // Game master (10 games)
            if (progress.gamesPlayed >= 10 && !unlocked.includes('game_master')) {
                newAchievements.push('game_master');
                showAchievementPopup('👑', 'Game Master!', 'Played 10 games!');
            }

            // XP collector
            if (progress.totalXp >= 100 && !unlocked.includes('xp_collector')) {
                newAchievements.push('xp_collector');
                showAchievementPopup('⭐', 'XP Collector!', 'Earned 100 XP!');
            }

            // Level up
            const level = Math.floor((progress.totalXp || 0) / 100) + 1;
            if (level >= 5 && !unlocked.includes('level_up')) {
                newAchievements.push('level_up');
                showAchievementPopup('🏅', 'Level Up!', 'Reached Level 5!');
            }

            // Save new achievements
            if (newAchievements.length > 0) {
                const all = [...unlocked, ...newAchievements];
                localStorage.setItem('launchpad_achievements', JSON.stringify(all));
                updateAchievementCount();
            }

            return newAchievements;
        } catch(e) { return []; }
    }

                ">Dismiss</button>
            </div>
        `;

        // Show popup
        popup.style.display = 'block';
        popup.style.animation = 'slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';

        // Auto-hide after 6 seconds
        clearTimeout(popup._timeout);
        popup._timeout = setTimeout(() => {
            popup.style.animation = 'slideOutRight 0.4s ease-in';
            setTimeout(() => {
                popup.style.display = 'none';
                popup.style.animation = '';
            }, 400);
        }, 6000);

        // Play sound
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [523, 659, 784, 1047].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }, i * 120);
            });
        } catch(e) {}
    }

    // ============================================================
    // UNIVERSAL SAVE SYSTEM - Auto & Manual Save
    // ============================================================
    
    // Save system variables
    let saveEnabled = true;

    let lastSaveTime = 'Never';
    
    // ============================================================
    // SAVE FUNCTIONS
    // ============================================================
    function saveGameData(gameId, data) {
        try {
            const saves = JSON.parse(localStorage.getItem('gameSaves') || '{}');

                data: data,

            };
            localStorage.setItem('gameSaves', JSON.stringify(saves));
            showSaveFeedback('✅ Saved!');

        } catch(e) {
            console.log('Save error:', e);
            return false;
        }
    }
    
    function loadGameData(gameId) {
        try {
            const saves = JSON.parse(localStorage.getItem('gameSaves') || '{}');
            if (saves[gameId]) {
                return saves[gameId].data;
            }
        } catch(e) {
            console.log('Load error:', e);
        }
        return null;
    }

    function manualSave() {
        if (typeof saveGame === 'function') {

            return true;
        }
        return false;
    }
    
    // ============================================================
    // AUTO-SAVE
    // ============================================================
    function startAutoSave(interval = 5000) {
        if (saveInterval) clearInterval(saveInterval);
        
        saveInterval = setInterval(() => {
            if (typeof saveGame === 'function') {
                saveGame();
            }

// ============================================================
// AUTO-REFRESH ON PAGE LOAD (Ctrl+Shift+R effect)
// ============================================================

// Check if this is the first time loading
function checkAndRefresh() {
    const pageId = window.location.pathname.split('/').pop();
    const key = 'refresh_' + pageId;
    
    // Check if we already refreshed this session
    if (sessionStorage.getItem(key) === 'true') {
        console.log('🔄 Already refreshed this session');
        return;
    }
    
    // Mark as refreshed
    sessionStorage.setItem(key, 'true');
    
    // Show loading message
    const container = document.querySelector('.container') || document.querySelector('#app') || document.body;
    const msg = document.createElement('div');
    msg.id = 'refreshMessage';
    msg.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.85);
        color: #7cf5b0;
        padding: 20px 40px;
        border-radius: 16px;
        font-size: 18px;
        font-weight: 700;
        z-index: 99999;
        font-family: 'Segoe UI', sans-serif;
        text-align: center;
        border: 2px solid #4fc3f7;
        box-shadow: 0 0 60px rgba(79,195,247,0.2);
    `;
    msg.innerHTML = `
        <div style="font-size: 48px; margin-bottom: 10px;">🔄</div>
        <div>Refreshing game...</div>
        <div style="font-size: 12px; color: #666; margin-top: 8px;">Loading latest version</div>
    `;
    document.body.appendChild(msg);
    
    // Perform a hard refresh (Ctrl+Shift+R equivalent)
    setTimeout(() => {
        // Clear all caches
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) {
                    caches.delete(name);
                }
            });
        }
        
        // Force reload with cache-buster
        const url = window.location.href.split('?')[0] + '?t=' + Date.now();
        window.location.replace(url);
    }, 1000);
}

// Run on page load
if (document.readyState === 'complete') {
    checkAndRefresh();
} else {
    document.addEventListener('DOMContentLoaded', checkAndRefresh);
}

// Also force refresh if user manually clicks
console.log('🔄 Auto-refresh ready - Ctrl+Shift+R will force reload');
