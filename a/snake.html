<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Snake</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
canvas{background:#0f1f2e;border-radius:12px;border:2px solid #1a3344;touch-action:none;}
.controls{display:flex;gap:10px;justify-content:center;margin:15px 0;flex-wrap:wrap;}
.controls button{background:#1a3344;color:#d0e8f0;border:2px solid #2a4a5e;padding:10px 20px;border-radius:8px;font-size:1.2rem;cursor:pointer;touch-action:manipulation;}
.controls button:hover{background:#2a4a5e;border-color:#4fc3f7;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-dragon" style="color:#7cf5b0;"></i> Snake</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="highScore">0</span><span class="label">Best</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
        <button id="upBtn">⬆</button>
        <button id="downBtn">⬇</button>
        <button id="leftBtn">⬅</button>
        <button id="rightBtn">➡</button>
    </div>
    <button class="btn" id="startBtn">▶ Start Game</button>
    <div class="message" id="message">🎯 Press Start to play!</div>
</div>
<script>
function updateGameProgress(gameId){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.games)s.games={};if(!s.games[gameId])s.games[gameId]={played:false,xp:0};var g=s.games[gameId];if(!g.played){g.played=true;s.gamesPlayed=(s.gamesPlayed||0)+1;}g.xp=(g.xp||0)+1;var t=0,p=0;Object.values(s.games).forEach(function(x){t+=(x.xp||0);if(x.played)p++;});s.totalXp=t;s.gamesPlayed=p;localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const size=20;
let snake=[{x:10,y:10}],food={x:15,y:15},direction='right',nextDirection='right';
let score=0,highScore=parseInt(localStorage.getItem('snakeHigh'))||0;
let gameActive=false,gameInterval=null;

function draw(){
    ctx.fillStyle='#0f1f2e';
    ctx.fillRect(0,0,400,400);
    // Draw grid lines
    ctx.strokeStyle='rgba(255,255,255,0.03)';
    ctx.lineWidth=1;
    for(let i=0;i<=20;i++){ctx.beginPath();ctx.moveTo(i*20,0);ctx.lineTo(i*20,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*20);ctx.lineTo(400,i*20);ctx.stroke();}
    // Draw food
    ctx.fillStyle='#ff6b6b';
    ctx.beginPath();
    ctx.arc(food.x*size+size/2,food.y*size+size/2,size/2-2,0,Math.PI*2);
    ctx.fill();
    // Draw snake
    snake.forEach((seg,i)=>{
        const gradient=ctx.createRadialGradient(seg.x*size+size/2,seg.y*size+size/2,2,seg.x*size+size/2,seg.y*size+size/2,size/2);
        gradient.addColorStop(0,i===0?'#7cf5b0':'#4fc3f7');
        gradient.addColorStop(1,i===0?'#4fc3f7':'#1a3344');
        ctx.fillStyle=gradient;
        ctx.beginPath();
        ctx.roundRect(seg.x*size+2,seg.y*size+2,size-4,size-4,4);
        ctx.fill();
    });
}

function move(){
    direction=nextDirection;
    const head={...snake[0]};
    if(direction==='right')head.x++;
    if(direction==='left')head.x--;
    if(direction==='up')head.y--;
    if(direction==='down')head.y++;
    // Check food
    if(head.x===food.x&&head.y===food.y){
        score++;
        document.getElementById('score').textContent=score;
        if(score>highScore){highScore=score;localStorage.setItem('snakeHigh',highScore);document.getElementById('highScore').textContent=highScore;}
        snake.unshift(head);
        spawnFood();
        draw();
        return;
    }
    snake.pop();
    snake.unshift(head);
    // Check collision
    if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.slice(1).some(s=>s.x===head.x&&s.y===head.y)){
        endGame();
        return;
    }
    draw();
}

function spawnFood(){
    let pos;
    do{pos={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
    food=pos;
}

function startGame(){
    if(gameActive)return;
    updateGameProgress('snake');
    snake=[{x:10,y:10}];
    direction='right';nextDirection='right';
    score=0;
    document.getElementById('score').textContent=0;
    document.getElementById('highScore').textContent=highScore;
    document.getElementById('message').textContent='⚡ Playing...';
    document.getElementById('startBtn').textContent='⏳ Playing';
    gameActive=true;
    spawnFood();
    draw();
    if(gameInterval)clearInterval(gameInterval);
    gameInterval=setInterval(()=>{if(gameActive)move();},150);
}

function endGame(){
    gameActive=false;
    if(gameInterval)clearInterval(gameInterval);
    document.getElementById('message').textContent='💀 Game Over! Score: '+score;
    document.getElementById('startBtn').textContent='▶ Play Again';
    draw();
}

// Keyboard controls
document.addEventListener('keydown',(e)=>{
    if(!gameActive)return;
    if(e.key==='ArrowUp'&&direction!=='down')nextDirection='up';
    if(e.key==='ArrowDown'&&direction!=='up')nextDirection='down';
    if(e.key==='ArrowLeft'&&direction!=='right')nextDirection='left';
    if(e.key==='ArrowRight'&&direction!=='left')nextDirection='right';
    if(e.key===' '||e.key==='Enter')startGame();
});

// Button controls
document.getElementById('upBtn').addEventListener('click',()=>{if(gameActive&&direction!=='down')nextDirection='up';});
document.getElementById('downBtn').addEventListener('click',()=>{if(gameActive&&direction!=='up')nextDirection='down';});
document.getElementById('leftBtn').addEventListener('click',()=>{if(gameActive&&direction!=='right')nextDirection='left';});
document.getElementById('rightBtn').addEventListener('click',()=>{if(gameActive&&direction!=='left')nextDirection='right';});

document.getElementById('startBtn').addEventListener('click',startGame);

// RoundRect polyfill for canvas
if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){if(r>w/2)r=w/2;if(r>h/2)r=h/2;this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath();return this;};
}

document.getElementById('highScore').textContent=highScore;
draw();
document.getElementById('message').textContent='🎯 Press Start to play!';
</script>
</body>
</html>
