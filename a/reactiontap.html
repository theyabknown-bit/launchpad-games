<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>⚡ Reaction Tap Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.status-bar .stat{color:#8899aa;font-size:.9rem}
.status-bar .stat span{color:#d0e8f0;font-weight:700}
.reaction-area{width:100%;max-width:400px;height:250px;margin:15px auto;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;transition:.1s;border:2px solid rgba(79,195,247,0.05)}
.reaction-area.waiting{background:rgba(255,107,107,0.15);color:#ff6b6b}
.reaction-area.ready{background:rgba(79,195,247,0.15);color:#4fc3f7}
.reaction-area.go{background:rgba(124,245,176,0.15);color:#7cf5b0}
.reaction-area.too-early{background:rgba(255,215,0,0.15);color:#ffd93d}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
.difficulty-selector{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.difficulty-selector button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1);font-size:.8rem;padding:6px 16px}
.difficulty-selector button.active{background:#4fc3f7;color:#0b1a26;border-color:#4fc3f7}
#message{min-height:2rem;font-size:1rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">⚡ Reaction Tap Pro</h1>
<div class="difficulty-selector"><button data-diff="easy">Easy</button><button data-diff="medium" class="active">Medium</button><button data-diff="hard">Hard</button></div>
<div class="status-bar"><div class="stat">🏆 Best: <span id="best">-</span>ms</div><div class="stat">📊 Avg: <span id="avg">-</span>ms</div><div class="stat">🎯 Round: <span id="round">0</span>/5</div></div>
<div class="reaction-area waiting" id="reactionArea">Click to start</div>
<div id="message">⚡ Click when the area turns green!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const area=document.getElementById('reactionArea'),bestEl=document.getElementById('best'),avgEl=document.getElementById('avg'),roundEl=document.getElementById('round'),msgEl=document.getElementById('message');
let times=[],round=0,maxRounds=5,diff='medium',bestTime=null,waiting=!1,ready=!1,canTap=!1,gameActive=!1,paused=!1,timeoutId=null,startTime=0,totalTime=0;
(function load(){try{let s=JSON.parse(localStorage.getItem('reaction_best')||'{}');bestTime=s[diff]||null;bestEl.textContent=bestTime!==null?bestTime:'-';let d=localStorage.getItem('reaction_difficulty')||'medium';diff=d;document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.classList.toggle('active',b.dataset.diff===diff)})}catch(e){}})();
function saveBest(t){if(bestTime===null||t<bestTime){bestTime=t;let s=JSON.parse(localStorage.getItem('reaction_best')||'{}');s[diff]=t;localStorage.setItem('reaction_best',JSON.stringify(s));bestEl.textContent=t}}
function getConfig(){return{easy:{minWait:1500,maxWait:3000},medium:{minWait:1000,maxWait:2500},hard:{minWait:500,maxWait:2000}}[diff]||{minWait:1000,maxWait:2500}}
function startGame(){times=[];round=0;totalTime=0;gameActive=!0;paused=!1;document.getElementById('pauseLabel').textContent='Pause';roundEl.textContent='0/5';avgEl.textContent='-';msgEl.textContent='⚡ Click when green!';nextRound()}
function nextRound(){if(!gameActive||paused)return;if(round>=maxRounds){endGame();return}round++;roundEl.textContent=round+'/'+maxRounds;waiting=!0;ready=!1;canTap=!1;area.className='reaction-area waiting';area.textContent='Waiting...';let config=getConfig();let wait=config.minWait+Math.random()*(config.maxWait-config.minWait);timeoutId=setTimeout(()=>{if(!gameActive||paused){return}waiting=!1;ready=!0;canTap=!1;area.className='reaction-area ready';area.textContent='Get ready...';setTimeout(()=>{if(!gameActive||paused){return}ready=!1;canTap=!0;startTime=performance.now();area.className='reaction-area go';area.textContent='TAP NOW!';playSound('go')},Math.random()*500+200)},wait)}
function handleTap(){if(!gameActive||paused)return;if(!canTap){if(ready){ready=!1;canTap=!1;area.className='reaction-area too-early';area.textContent='Too early!';playSound('early');setTimeout(()=>{if(gameActive&&!paused)nextRound()},500)}return}let reaction=Math.round(performance.now()-startTime);times.push(reaction);totalTime+=reaction;canTap=!1;playSound('tap');msgEl.textContent='⚡ '+reaction+'ms';saveBest(reaction);let avg=Math.round(totalTime/times.length);avgEl.textContent=avg;setTimeout(()=>{if(gameActive&&!paused)nextRound()},300)}
area.addEventListener('click',handleTap);
function endGame(){gameActive=!1;if(times.length===0){area.className='reaction-area waiting';area.textContent='No taps recorded';msgEl.textContent='❌ You didn\'t tap!';return}let best=Math.min(...times);let avg=Math.round(totalTime/times.length);saveBest(best);bestEl.textContent=best;avgEl.textContent=avg;playSound('end');msgEl.textContent='✅ Done! Best: '+best+'ms, Avg: '+avg+'ms';area.className='reaction-area go';area.textContent='🏁 Complete!'}
function togglePause(){if(!gameActive)return;paused=!paused;document.getElementById('pauseLabel').textContent=paused?'Resume':'Pause';msgEl.textContent=paused?'⏸️ Paused':'⚡ Click when green!';if(paused&&timeoutId)clearTimeout(timeoutId)}
function resetGame(){if(timeoutId)clearTimeout(timeoutId);gameActive=!1;paused=!1;times=[];round=0;totalTime=0;area.className='reaction-area waiting';area.textContent='Click Start';roundEl.textContent='0/5';avgEl.textContent='-';msgEl.textContent='⚡ Click Start to begin!';document.getElementById('pauseLabel').textContent='Pause'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='go'){o.frequency.value=600;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=800},80);o.stop(c.currentTime+.15)}else if(type==='tap'){o.frequency.value=900;g.gain.value=.05;o.start();o.stop(c.currentTime+.06)}else if(type==='early'){o.frequency.value=300;g.gain.value=.05;o.start();o.stop(c.currentTime+.15)}else if(type==='end'){o.frequency.value=500;g.gain.value=.08;o.start();setTimeout(()=>{o.frequency.value=700},150);setTimeout(()=>{o.frequency.value=900},300);o.stop(c.currentTime+.5)}}catch(e){}}
document.querySelectorAll('.difficulty-selector button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.difficulty-selector button').forEach(x=>x.classList.remove('active'));this.classList.add('active');diff=this.dataset.diff;localStorage.setItem('reaction_difficulty',diff);let s=JSON.parse(localStorage.getItem('reaction_best')||'{}');bestTime=s[diff]||null;bestEl.textContent=bestTime!==null?bestTime:'-';resetGame()})});
resetGame();console.log('⚡ Reaction Tap Pro loaded');
</script></body></html>
