<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Space Explorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a26;
            color: #d0e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1a3344;
            color: #4fc3f7;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        .back-btn:hover { background: #2a4a5e; transform: translateX(-5px); }
        .container { max-width: 500px; width: 100%; text-align: center; margin-top: 60px; }
        h1 { color: #4fc3f7; font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: #7cf5b0; margin-bottom: 20px; font-size: 1.1rem; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 10px 20px; border-radius: 10px; min-width: 80px; border: 1px solid #2a4a5e; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.2rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.7rem; text-transform: uppercase; }
        .planet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
        .planet-card {
            background: #1a3344;
            border: 2px solid #2a4a5e;
            border-radius: 16px;
            padding: 15px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .planet-card:hover { transform: translateY(-5px); border-color: #4fc3f7; box-shadow: 0 10px 30px rgba(79,195,247,0.1); }
        .planet-card .emoji { font-size: 2.5rem; display: block; margin-bottom: 5px; }
        .planet-card .name { font-size: 0.8rem; font-weight: 700; color: #d0e8f0; }
        .planet-card .status { font-size: 0.6rem; color: #8899aa; margin-top: 4px; }
        .planet-card.explored { border-color: #7cf5b0; background: #1a4a3a; }
        .planet-card.explored .status { color: #7cf5b0; }
        .btn { background: #4fc3f7; color: #0b1a26; border: none; padding: 12px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #7cf5b0; }
        .message { font-size: 1.2rem; min-height: 30px; color: #ffd93d; margin: 10px 0; }
    </style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-globe" style="color:#4fc3f7;"></i> Space Explorer</h1>
    <p class="subtitle">🌌 Explore the cosmos!</p>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Explored</span></div>
        <div class="stat-box"><span id="total">9</span><span class="label">Total</span></div>
    </div>
    <div class="planet-grid" id="planetGrid"></div>
    <div class="message" id="message">🌍 Click a planet to explore!</div>
    <button class="btn" onclick="resetGame()">🔄 New Mission</button>
</div>
<script>
const PLANETS = [
    { name: 'Earth', emoji: '🌍', explored: false },
    { name: 'Mars', emoji: '🔴', explored: false },
    { name: 'Jupiter', emoji: '🟠', explored: false },
    { name: 'Saturn', emoji: '🪐', explored: false },
    { name: 'Uranus', emoji: '🔵', explored: false },
    { name: 'Neptune', emoji: '🔷', explored: false },
    { name: 'Pluto', emoji: '⚪', explored: false },
    { name: 'Moon', emoji: '🌙', explored: false },
    { name: 'Sun', emoji: '☀️', explored: false }
];
let score = 0;

function renderGrid() {
    const grid = document.getElementById('planetGrid');
    grid.innerHTML = '';
    PLANETS.forEach((planet, index) => {
        const card = document.createElement('div');
        card.className = 'planet-card' + (planet.explored ? ' explored' : '');
        card.innerHTML = `
            <span class="emoji">${planet.emoji}</span>
            <div class="name">${planet.name}</div>
            <div class="status">${planet.explored ? '✅ Explored' : '🔍 Unexplored'}</div>
        `;
        card.addEventListener('click', () => explorePlanet(index));
        grid.appendChild(card);
    });
    document.getElementById('score').textContent = PLANETS.filter(p => p.explored).length;
    document.getElementById('total').textContent = PLANETS.length;
}

function explorePlanet(index) {
    const planet = PLANETS[index];
    if (planet.explored) {
        document.getElementById('message').textContent = '🌍 Already explored ' + planet.name + '!';
        return;
    }
    planet.explored = true;
    score++;
    document.getElementById('message').textContent = '🚀 Explored ' + planet.name + '! +10 XP';
    renderGrid();
    if (PLANETS.every(p => p.explored)) {
        document.getElementById('message').textContent = '🎉 MISSION COMPLETE! You explored the entire solar system!';
    }
    // Save progress
    try {
        const save = JSON.parse(localStorage.getItem('launchpad_progress') || '{}');
        if (!save.games) save.games = {};
        if (!save.games['space']) save.games['space'] = { played: false, xp: 0 };
        save.games['space'].played = true;
        save.games['space'].xp = (save.games['space'].xp || 0) + 10;
        save.totalXp = (save.totalXp || 0) + 10;
        localStorage.setItem('launchpad_progress', JSON.stringify(save));
    } catch(e) {}
}

function resetGame() {
    PLANETS.forEach(p => p.explored = false);
    score = 0;
    document.getElementById('message').textContent = '🔄 New mission! Explore the cosmos!';
    renderGrid();
}

renderGrid();
</script>
</body>
</html>
