<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Sim · Luxury Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e121a;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .game-container {
      max-width: 1100px;
      width: 100%;
      background: rgba(18, 28, 40, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 3rem;
      padding: 2rem;
      border: 1px solid rgba(100, 200, 255, 0.12);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      border-bottom: 1px solid rgba(100, 200, 255, 0.08);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      color: white;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 i { color: #f5c87c; }
    .back-btn {
      background: #1a3045;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      text-decoration: none;
      color: #b0d4f0;
      border: 1px solid #2a5a7a;
      font-size: 0.9rem;
    }
    .back-btn:hover { background: #2a4a6a; }

    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 760px) { .main-grid { grid-template-columns: 1fr; } }

    .panel {
      background: rgba(10, 20, 30, 0.6);
      border-radius: 1.5rem;
      padding: 1.2rem;
      border: 1px solid rgba(100, 200, 255, 0.06);
    }
    .panel-title {
      color: #8ab4d8;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 280px;
      overflow-y: auto;
    }
    .guest-list::-webkit-scrollbar { width: 4px; }
    .guest-list::-webkit-scrollbar-thumb { background: #2a5a7a; border-radius: 10px; }

    .guest-card {
      background: rgba(20, 40, 60, 0.4);
      border-radius: 1rem;
      padding: 0.8rem 1rem;
      border-left: 4px solid #f5c87c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .guest-card .info { display: flex; flex-direction: column; }
    .guest-card .name { color: white; font-weight: 600; font-size: 1rem; }
    .guest-card .detail { color: #8ab4d8; font-size: 0.8rem; }
    .guest-card .status { font-size: 0.75rem; padding: 0.15rem 0.8rem; border-radius: 20px; background: #1a3a2a; color: #7cf5b0; }
    .guest-card .status.waiting { background: #1a2a3a; color: #7fc9ff; }
    .guest-card .status.vip { background: #3a2a1a; color: #f5c87c; }
    .guest-card .status.checked { background: #1a3a2a; color: #7cf5b0; }
    .guest-card .status.angry { background: #3a1a1a; color: #ff7a7a; }
    .guest-card .status.red { background: #4a1a1a; color: #ff4444; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .guest-card .action-btn {
      background: #1a4a6a;
      border: none;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.1s;
    }
    .guest-card .action-btn:hover { background: #2a6a8a; }
    .guest-card .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .guest-card .red-btn {
      background: #6a1a1a;
      border: 2px solid #ff4444;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 0.7rem;
      animation: pulse 1s infinite;
    }
    .guest-card .red-btn:hover { background: #8a2a2a; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .stat-box {
      background: rgba(0,0,0,0.3);
      border-radius: 0.8rem;
      padding: 0.6rem 1rem;
      text-align: center;
    }
    .stat-box .val { color: white; font-size: 1.4rem; font-weight: 700; }
    .stat-box .label { color: #7f9fb9; font-size: 0.7rem; text-transform: uppercase; }
    .stat-box .val i { color: #f5c87c; font-size: 1.2rem; margin-right: 4px; }

    .xp-bar {
      background: #0a1a2a;
      border-radius: 1rem;
      height: 18px;
      overflow: hidden;
      border: 1px solid #1a3a5a;
      margin: 0.5rem 0;
    }
    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #f5c87c, #7cf5b0);
      border-radius: 1rem;
      transition: width 0.3s;
      width: 0%;
    }

    .log-area {
      background: rgba(0,0,0,0.3);
      border-radius: 0.8rem;
      padding: 0.6rem;
      max-height: 100px;
      overflow-y: auto;
      font-size: 0.8rem;
      color: #9bbfd9;
      border: 1px solid rgba(100, 200, 255, 0.05);
    }
    .log-area::-webkit-scrollbar { width: 4px; }
    .log-area::-webkit-scrollbar-thumb { background: #2a5a7a; border-radius: 10px; }
    .log-entry { padding: 0.2rem 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .log-entry i { margin-right: 6px; }

    .computer-panel {
      background: rgba(0, 20, 30, 0.5);
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid #1a3a5a;
      margin-top: 0.8rem;
    }
    .computer-panel .screen {
      background: #0a121a;
      border-radius: 0.6rem;
      padding: 0.8rem;
      font-family: 'Courier New', monospace;
      color: #7cf5b0;
      font-size: 0.85rem;
      min-height: 60px;
      border: 1px solid #1a3a5a;
    }
    .computer-panel .screen .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .action-bar {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }
    .action-bar .btn {
      background: #1a3a5a;
      border: 1px solid #2a5a7a;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.1s;
    }
    .action-bar .btn:hover { background: #2a5a7a; }
    .action-bar .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .level-up {
      background: linear-gradient(135deg, #4a3a1a, #6a4a2a);
      border: 2px solid #f5c87c;
      border-radius: 1rem;
      padding: 0.8rem;
      text-align: center;
      color: white;
      margin: 0.5rem 0;
      display: none;
    }
    .level-up.show { display: block; }
    .level-up i { color: #ffd966; font-size: 1.5rem; }

    /* Mini-game overlay */
    .minigame-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .minigame-overlay.show { display: flex; }
    .minigame-box {
      background: #1a2a3a;
      border-radius: 2rem;
      padding: 2rem;
      max-width: 580px;
      width: 100%;
      border: 2px solid #f5c87c;
      box-shadow: 0 0 60px rgba(245,200,124,0.15);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .minigame-box h2 {
      color: white;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .minigame-box h2 i { color: #f5c87c; }
    .minigame-box .close-btn {
      position: sticky;
      top: 0;
      float: right;
      background: none;
      border: none;
      color: #6a8aaa;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
    }
    .minigame-box .close-btn:hover { color: white; }
    .minigame-content { color: #d0e8f0; }
    .minigame-content .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin: 1rem 0;
    }
    .minigame-content .option-btn {
      background: #0a1a2a;
      border: 2px solid #2a4a5a;
      padding: 0.8rem;
      border-radius: 1rem;
      color: white;
      cursor: pointer;
      transition: 0.1s;
      font-size: 1rem;
    }
    .minigame-content .option-btn:hover:not(:disabled) { background: #1a3a5a; border-color: #f5c87c; }
    .minigame-content .option-btn.correct { border-color: #7cf5b0; background: #1a4a3a; }
    .minigame-content .option-btn.wrong { border-color: #ff7a7a; background: #4a1a1a; }
    .minigame-content .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .minigame-content .result-msg {
      padding: 0.8rem;
      border-radius: 0.8rem;
      margin: 0.8rem 0;
      text-align: center;
      font-weight: 600;
    }
    .minigame-content .result-msg.success { background: #1a4a3a; color: #7cf5b0; }
    .minigame-content .result-msg.fail { background: #4a1a1a; color: #ff7a7a; }
    .minigame-content .timer { color: #f5c87c; font-size: 1.2rem; font-weight: 700; }
    .minigame-content .math-display { font-size: 2.5rem; text-align: center; padding: 0.5rem; background: #0a121a; border-radius: 1rem; margin: 0.5rem 0; }

    @media (max-width: 500px) {
      .game-container { padding: 1rem; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .minigame-box { padding: 1.2rem; }
      .minigame-content .options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <h1><i class="fas fa-hotel"></i> Hotel Sim</h1>
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> back</a>
  </div>

  <!-- Level Up Notification -->
  <div class="level-up" id="levelUpBox">
    <i class="fas fa-arrow-up"></i> <span id="levelUpText">LEVEL UP!</span>
  </div>

  <div class="main-grid">
    <!-- Left: Guests & Actions -->
    <div class="panel">
      <div class="panel-title">
        <span><i class="fas fa-users"></i> Guests</span>
        <span style="font-size:0.7rem; color:#4a6a8a;" id="guestCount">0 waiting</span>
      </div>
      <div class="guest-list" id="guestList">
        <div style="color:#4a6a8a; text-align:center; padding:1rem;">No guests yet. Book someone!</div>
      </div>

      <div class="action-bar">
        <button class="btn" id="bookBtn"><i class="fas fa-user-plus"></i> Book Guest</button>
        <button class="btn" id="checkinBtn"><i class="fas fa-key"></i> Check-in</button>
        <button class="btn" id="chatBtn"><i class="fas fa-comment"></i> Chat</button>
        <button class="btn" id="restBtn"><i class="fas fa-coffee"></i> Rest</button>
      </div>
    </div>

    <!-- Right: Stats, XP, Computer -->
    <div class="panel">
      <div class="panel-title">
        <span><i class="fas fa-chart-line"></i> Status</span>
        <span style="font-size:0.7rem; color:#4a6a8a;">Level <span id="levelDisplay">1</span></span>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><div class="val" id="xpDisplay">0</div><div class="label">XP</div></div>
        <div class="stat-box"><div class="val" id="energyDisplay">100</div><div class="label">Energy</div></div>
        <div class="stat-box"><div class="val" id="servedDisplay">0</div><div class="label">Served</div></div>
        <div class="stat-box"><div class="val" id="starsDisplay">⭐ 0</div><div class="label">Rating</div></div>
      </div>

      <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#4a6a8a;">
        <span>XP to next: <span id="xpToNext">20</span></span>
        <span>Efficiency: <span id="efficiencyDisplay">100</span>%</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>

      <!-- Computer / Reception -->
      <div class="computer-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
          <span style="color:#4a6a8a; font-size:0.7rem;"><i class="fas fa-desktop"></i> Hotel OS</span>
          <span style="color:#2a5a7a; font-size:0.6rem;" id="timeDisplay">00:00</span>
        </div>
        <div class="screen" id="computerScreen">
          <span style="color:#4a6a8a;">> reception ready</span><br>
          <span style="color:#f5c87c;">> welcome, manager</span><span class="cursor">▌</span>
        </div>
      </div>

      <!-- Log -->
      <div class="panel-title" style="margin-top:0.8rem;"><span><i class="fas fa-list"></i> Log</span></div>
      <div class="log-area" id="logArea">
        <div class="log-entry"><i class="fas fa-info-circle" style="color:#4a6a8a;"></i> Welcome to Hotel Sim</div>
      </div>
    </div>
  </div>
</div>

<!-- MINI-GAME OVERLAY -->
<div class="minigame-overlay" id="minigameOverlay">
  <div class="minigame-box">
    <button class="close-btn" id="closeMinigame"><i class="fas fa-times"></i></button>
    <h2 id="minigameTitle"><i class="fas fa-gamepad"></i> Mini-Game</h2>
    <div class="minigame-content" id="minigameContent">
      <div id="minigameBody"></div>
    </div>
  </div>
</div>

<script>
  // ===================== GAME STATE =====================
  const state = {
    level: 1,
    xp: 0,
    energy: 100,
    served: 0,
    stars: 0,
    guests: [],
    log: [],
    time: 0,
    tickInterval: null,
    gameRunning: true,
    miniGameActive: false,
    currentGuest: null,
  };

  const XP_PER_LEVEL = 25;
  const MAX_ENERGY = 100;
  const GUEST_NAMES = ['Emma W.', 'Liam K.', 'Sophia R.', 'Noah C.', 'Olivia P.', 'Mason D.', 'Ava S.', 'Ethan J.', 'Mia L.', 'Logan B.'];
  const ROOM_TYPES = ['Standard', 'Deluxe', 'Suite', 'Penthouse'];
  const CHAT_TOPICS = ['Weather', 'Sports', 'News', 'Holiday', 'Movies', 'Music', 'Food', 'Travel', 'Family', 'Work'];

  // DOM refs
  const guestList = document.getElementById('guestList');
  const guestCount = document.getElementById('guestCount');
  const levelDisplay = document.getElementById('levelDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const energyDisplay = document.getElementById('energyDisplay');
  const servedDisplay = document.getElementById('servedDisplay');
  const starsDisplay = document.getElementById('starsDisplay');
  const xpFill = document.getElementById('xpFill');
  const xpToNext = document.getElementById('xpToNext');
  const efficiencyDisplay = document.getElementById('efficiencyDisplay');
  const computerScreen = document.getElementById('computerScreen');
  const logArea = document.getElementById('logArea');
  const levelUpBox = document.getElementById('levelUpBox');
  const levelUpText = document.getElementById('levelUpText');
  const timeDisplay = document.getElementById('timeDisplay');

  // Mini-game refs
  const minigameOverlay = document.getElementById('minigameOverlay');
  const minigameBody = document.getElementById('minigameBody');
  const minigameTitle = document.getElementById('minigameTitle');
  const closeMinigameBtn = document.getElementById('closeMinigame');

  let minigameCallback = null;
  let timerInterval = null;

  // ===================== HELPERS =====================
  function random(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function getEfficiency() {
    let base = 100;
    if (state.energy < 30) base -= 35;
    else if (state.energy < 50) base -= 20;
    base += state.level * 3;
    return Math.min(150, Math.max(40, base));
  }

  function getXpForLevel() { return XP_PER_LEVEL + (state.level - 1) * 7; }

  function addLog(msg, icon = 'fa-info-circle', color = '#4a6a8a') {
    state.log.unshift({ msg, icon, color });
    if (state.log.length > 30) state.log.pop();
    renderLog();
  }

  function renderLog() {
    logArea.innerHTML = state.log.map(e =>
      `<div class="log-entry"><i class="fas ${e.icon}" style="color:${e.color};"></i> ${e.msg}</div>`
    ).join('');
  }

  function updateComputer(text, color = '#f5c87c') {
    const lines = computerScreen.innerHTML.split('<br>');
    if (lines.length > 5) lines.shift();
    const newLine = `<span style="color:${color};">> ${text}</span>`;
    lines.push(newLine);
    computerScreen.innerHTML = lines.join('<br>') + '<span class="cursor">▌</span>';
    computerScreen.scrollTop = computerScreen.scrollHeight;
  }

  function addXP(amount) {
    const eff = getEfficiency() / 100;
    const actual = Math.round(amount * eff);
    state.xp += actual;
    state.served += 1;
    updateUI();
    addLog(`+${actual} XP (${Math.round(eff*100)}% efficiency)`, 'fa-star', '#ffd966');
    updateComputer(`+${actual} XP earned`, '#ffd966');
    checkLevelUp();
  }

  function checkLevelUp() {
    const needed = getXpForLevel();
    while (state.xp >= needed) {
      state.xp -= needed;
      state.level++;
      state.energy = Math.min(MAX_ENERGY, state.energy + 25);
      addLog(`🎉 LEVEL UP! You are now level ${state.level}`, 'fa-trophy', '#ffd966');
      updateComputer(`🎉 LEVEL ${state.level} REACHED!`, '#ffd966');
      levelUpBox.classList.add('show');
      levelUpText.textContent = `LEVEL ${state.level}! +${state.level*3}% efficiency`;
      setTimeout(() => levelUpBox.classList.remove('show'), 3000);
      updateUI();
    }
    updateUI();
  }

  // ===================== GUEST SYSTEM =====================
  function generateGuest(vip = false) {
    const name = random(GUEST_NAMES);
    const roomType = vip ? random(['Suite', 'Penthouse']) : random(ROOM_TYPES);
    const nights = rand(1, 5);
    const isVip = vip || Math.random() < 0.2;
    return {
      id: Date.now() + Math.random(),
      name,
      roomType,
      nights,
      isVip,
      status: 'waiting',
      happiness: 100,
      patience: 100,
      redButton: false,
      needs: 'none', // 'food', 'service', 'info'
    };
  }

  function bookGuest() {
    if (state.energy < 8) {
      addLog('Too tired! Rest first.', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    if (state.guests.length >= 6) {
      addLog('Hotel is full!', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    const isVip = Math.random() < 0.25;
    const guest = generateGuest(isVip);
    state.guests.push(guest);
    state.energy -= 5;
    addLog(`📋 Booked ${guest.name} (${guest.roomType}${guest.isVip ? ' ⭐ VIP' : ''})`, 'fa-user-plus', '#f5c87c');
    updateComputer(`booked ${guest.name}`, '#f5c87c');
    renderGuests();
    updateUI();
  }

  // ===================== CHECK-IN MINI-GAME =====================
  function startCheckinGame(guest) {
    if (state.miniGameActive) return;
    state.miniGameActive = true;
    minigameOverlay.classList.add('show');
    minigameTitle.innerHTML = `<i class="fas fa-key"></i> ${guest.isVip ? 'VIP ' : ''}Check-in`;

    const roomTypes = ['Standard', 'Deluxe', 'Suite', 'Penthouse'];
    const correct = guest.roomType;
    const wrongs = roomTypes.filter(r => r !== correct).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [correct, ...wrongs].sort(() => Math.random() - 0.5);

    const amenities = ['Pool', 'Gym', 'Spa', 'Restaurant', 'Bar', 'Concierge'];
    const amenity = random(amenities);
    let timeLeft = 10;
    let timerRunning = true;

    minigameBody.innerHTML = `
      <p style="margin-bottom:0.5rem;"><strong>Guest:</strong> ${guest.name}${guest.isVip ? ' ⭐ VIP' : ''}</p>
      <p style="margin-bottom:0.5rem;">Nights: ${guest.nights} | Amenity: ${amenity}</p>
      <p style="margin-bottom:0.5rem;">Which room type did they book?</p>
      <div class="timer" id="checkinTimer">⏱️ ${timeLeft}s</div>
      <div class="options">
        ${options.map(opt => `<button class="option-btn" data-answer="${opt}">${opt}</button>`).join('')}
      </div>
      <div id="checkinResult"></div>
    `;

    const btns = minigameBody.querySelectorAll('.option-btn');
    const timerDisplay = document.getElementById('checkinTimer');
    const resultDiv = document.getElementById('checkinResult');

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = `⏱️ ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        btns.forEach(b => b.disabled = true);
        resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-clock"></i> Time\'s up! They booked: ${correct}</div>`;
        guest.patience -= 30;
        setTimeout(() => {
          closeMinigame();
          renderGuests();
          updateUI();
        }, 2000);
      }
    }, 1000);

    btns.forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.disabled || !timerRunning) return;
        clearInterval(timerInterval);
        btns.forEach(b => b.disabled = true);
        const isCorrect = this.dataset.answer === correct;
        if (isCorrect) {
          this.classList.add('correct');
          const bonus = Math.max(3, timeLeft);
          const xpGain = 12 + bonus + (guest.isVip ? 10 : 0);
          addXP(xpGain);
          guest.status = 'checked';
          state.stars += guest.isVip ? 3 : 1;
          addLog(`✅ ${guest.name} checked in! +${xpGain} XP`, 'fa-check-circle', '#7cf5b0');
          updateComputer(`${guest.name} checked in`, '#7cf5b0');
          resultDiv.innerHTML = `<div class="result-msg success"><i class="fas fa-check-circle"></i> Check-in complete! +${xpGain} XP</div>`;
          setTimeout(() => {
            closeMinigame();
            removeGuest(guest.id);
            renderGuests();
            updateUI();
          }, 2000);
        } else {
          this.classList.add('wrong');
          btns.forEach(b => { if (b.dataset.answer === correct) b.classList.add('correct'); });
          resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-times-circle"></i> Wrong. They booked: ${correct}</div>`;
          guest.patience -= 20;
          setTimeout(() => {
            closeMinigame();
            renderGuests();
            updateUI();
          }, 2000);
        }
      });
    });
  }

  // ===================== RED BUTTON MINI-GAME =====================
  function startRedButtonGame(guest) {
    if (state.miniGameActive) return;
    state.miniGameActive = true;
    minigameOverlay.classList.add('show');
    minigameTitle.innerHTML = '<i class="fas fa-bell"></i> 🔴 Emergency Request';

    const needs = ['Food', 'Service', 'Information', 'Maintenance', 'Medical'];
    const correct = random(needs);
    const wrongs = needs.filter(n => n !== correct).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [correct, ...wrongs].sort(() => Math.random() - 0.5);

    let timeLeft = 8;
    let timerRunning = true;

    minigameBody.innerHTML = `
      <p style="margin-bottom:0.5rem; color:#ff4444;"><i class="fas fa-exclamation-triangle"></i> <strong>EMERGENCY!</strong></p>
      <p style="margin-bottom:0.5rem;"><strong>Guest:</strong> ${guest.name} pressed the red button!</p>
      <p style="margin-bottom:0.5rem;">What do they need?</p>
      <div class="timer" id="redTimer" style="color:#ff4444;">⏱️ ${timeLeft}s</div>
      <div class="options">
        ${options.map(opt => `<button class="option-btn" data-answer="${opt}">${opt}</button>`).join('')}
      </div>
      <div id="redResult"></div>
    `;

    const btns = minigameBody.querySelectorAll('.option-btn');
    const timerDisplay = document.getElementById('redTimer');
    const resultDiv = document.getElementById('redResult');

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = `⏱️ ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        btns.forEach(b => b.disabled = true);
        resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-clock"></i> Too slow! They needed: ${correct}</div>`;
        guest.patience -= 40;
        state.stars = Math.max(0, state.stars - 1);
        setTimeout(() => {
          closeMinigame();
          renderGuests();
          updateUI();
        }, 2000);
      }
    }, 1000);

    btns.forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.disabled || !timerRunning) return;
        clearInterval(timerInterval);
        btns.forEach(b => b.disabled = true);
        const isCorrect = this.dataset.answer === correct;
        if (isCorrect) {
          this.classList.add('correct');
          const bonus = Math.max(2, timeLeft);
          const xpGain = 15 + bonus + (guest.isVip ? 10 : 0);
          addXP(xpGain);
          guest.redButton = false;
          guest.status = 'checked';
          state.stars += guest.isVip ? 2 : 1;
          addLog(`✅ Emergency resolved! +${xpGain} XP`, 'fa-check-circle', '#7cf5b0');
          updateComputer(`emergency resolved for ${guest.name}`, '#7cf5b0');
          resultDiv.innerHTML = `<div class="result-msg success"><i class="fas fa-check-circle"></i> Resolved! +${xpGain} XP</div>`;
          setTimeout(() => {
            closeMinigame();
            removeGuest(guest.id);
            renderGuests();
            updateUI();
          }, 2000);
        } else {
          this.classList.add('wrong');
          btns.forEach(b => { if (b.dataset.answer === correct) b.classList.add('correct'); });
          resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-times-circle"></i> Wrong. They needed: ${correct}</div>`;
          guest.patience -= 25;
          setTimeout(() => {
            closeMinigame();
            renderGuests();
            updateUI();
          }, 2000);
        }
      });
    });
  }

  // ===================== CHAT MINI-GAME =====================
  function startChatGame(guest) {
    if (state.miniGameActive) return;
    state.miniGameActive = true;
    minigameOverlay.classList.add('show');
    minigameTitle.innerHTML = '<i class="fas fa-comment"></i> Guest Chat';

    const topics = CHAT_TOPICS;
    const correct = random(topics);
    const wrongs = topics.filter(t => t !== correct).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [correct, ...wrongs].sort(() => Math.random() - 0.5);
    const questions = [
      `What's your favorite thing about ${correct.toLowerCase()}?`,
      `How do you feel about ${correct.toLowerCase()}?`,
      `What do you think about ${correct.toLowerCase()}?`
    ];
    const question = random(questions);

    let timeLeft = 10;
    let timerRunning = true;

    minigameBody.innerHTML = `
      <p style="margin-bottom:0.5rem;"><strong>Guest:</strong> ${guest.name}</p>
      <p style="margin-bottom:0.5rem;">"${question}"</p>
      <p style="margin-bottom:0.5rem;">What topic are they interested in?</p>
      <div class="timer" id="chatTimer">⏱️ ${timeLeft}s</div>
      <div class="options">
        ${options.map(opt => `<button class="option-btn" data-answer="${opt}">${opt}</button>`).join('')}
      </div>
      <div id="chatResult"></div>
    `;

    const btns = minigameBody.querySelectorAll('.option-btn');
    const timerDisplay = document.getElementById('chatTimer');
    const resultDiv = document.getElementById('chatResult');

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = `⏱️ ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        btns.forEach(b => b.disabled = true);
        resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-clock"></i> Time\'s up! They were interested in: ${correct}</div>`;
        guest.happiness -= 20;
        setTimeout(() => {
          closeMinigame();
          renderGuests();
          updateUI();
        }, 2000);
      }
    }, 1000);

    btns.forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.disabled || !timerRunning) return;
        clearInterval(timerInterval);
        btns.forEach(b => b.disabled = true);
        const isCorrect = this.dataset.answer === correct;
        if (isCorrect) {
          this.classList.add('correct');
          const bonus = Math.max(3, timeLeft);
          const xpGain = 10 + bonus;
          addXP(xpGain);
          guest.happiness = Math.min(100, guest.happiness + 25);
          addLog(`💬 Great chat with ${guest.name}! +${xpGain} XP`, 'fa-comment', '#7cf5b0');
          updateComputer(`chat with ${guest.name}`, '#7cf5b0');
          resultDiv.innerHTML = `<div class="result-msg success"><i class="fas fa-check-circle"></i> Great conversation! +${xpGain} XP</div>`;
          setTimeout(() => {
            closeMinigame();
            renderGuests();
            updateUI();
          }, 2000);
        } else {
          this.classList.add('wrong');
          btns.forEach(b => { if (b.dataset.answer === correct) b.classList.add('correct'); });
          resultDiv.innerHTML = `<div class="result-msg fail"><i class="fas fa-times-circle"></i> Wrong. They were interested in: ${correct}</div>`;
          guest.happiness -= 15;
          setTimeout(() => {
            closeMinigame();
            renderGuests();
            updateUI();
          }, 2000);
        }
      });
    });
  }

  // ===================== REMOVE GUEST =====================
  function removeGuest(id) {
    const idx = state.guests.findIndex(g => g.id === id);
    if (idx !== -1) state.guests.splice(idx, 1);
    state.currentGuest = state.guests.length > 0 ? state.guests[0] : null;
    renderGuests();
    updateUI();
  }

  // ===================== REST =====================
  function rest() {
    state.energy = Math.min(MAX_ENERGY, state.energy + 30);
    addLog(`Rested. Energy: ${state.energy}`, 'fa-coffee', '#ffb347');
    updateComputer(`energy restored to ${state.energy}`, '#ffb347');
    updateUI();
  }

  // ===================== RENDER =====================
  function renderGuests() {
    if (state.guests.length === 0) {
      guestList.innerHTML = `<div style="color:#4a6a8a; text-align:center; padding:1rem;">No guests. Book someone!</div>`;
      guestCount.textContent = '0 waiting';
      return;
    }
    guestList.innerHTML = state.guests.map(g => {
      const statusClass = g.redButton ? 'red' : g.status === 'waiting' ? 'waiting' : g.isVip ? 'vip' : g.status === 'checked' ? 'checked' : 'angry';
      const statusLabel = g.redButton ? '🔴 EMERGENCY' : g.status === 'waiting' ? '⏳ Waiting' : g.isVip ? '⭐ VIP' : g.status === 'checked' ? '✅ Checked' : '😡 Angry';
      const happinessBar = '❤️'.repeat(Math.floor(g.happiness / 20)) + '🖤'.repeat(5 - Math.floor(g.happiness / 20));
      const redButtonHtml = g.redButton ? `<button class="red-btn" onclick="window.handleRedButton('${g.id}')"><i class="fas fa-bell"></i> Respond</button>` : '';
      return `
        <div class="guest-card">
          <div class="info">
            <div class="name">${g.name} ${g.isVip ? '⭐' : ''}</div>
            <div class="detail">${g.roomType} · ${g.nights} nights · ${happinessBar}</div>
          </div>
          <div class="status ${statusClass}">${statusLabel}</div>
          ${redButtonHtml}
          <button class="action-btn" onclick="window.removeGuest(${g.id})" ${g.status !== 'checked' && !g.redButton ? 'disabled' : ''}>
            <i class="fas fa-trash"></i>
          </button>
        </div>
      `;
    }).join('');
    guestCount.textContent = `${state.guests.filter(g => g.status === 'waiting').length} waiting`;
  }

  function updateUI() {
    levelDisplay.textContent = state.level;
    xpDisplay.textContent = state.xp;
    energyDisplay.textContent = state.energy;
    servedDisplay.textContent = state.served;
    starsDisplay.textContent = `⭐ ${state.stars}`;
    const needed = getXpForLevel();
    const pct = Math.min(100, (state.xp / needed) * 100);
    xpFill.style.width = pct + '%';
    xpToNext.textContent = needed - state.xp;
    efficiencyDisplay.textContent = Math.round(getEfficiency());
    if (state.energy < 30) energyDisplay.style.color = '#ff7a7a';
    else if (state.energy < 60) energyDisplay.style.color = '#ffb347';
    else energyDisplay.style.color = '#7cf5b0';
  }

  function closeMinigame() {
    if (timerInterval) clearInterval(timerInterval);
    minigameOverlay.classList.remove('show');
    state.miniGameActive = false;
    if (minigameCallback) {
      minigameCallback(false);
      minigameCallback = null;
    }
  }

  // ===================== HANDLE RED BUTTON =====================
  function handleRedButton(id) {
    const guest = state.guests.find(g => g.id === id);
    if (!guest || !guest.redButton) return;
    if (state.energy < 10) {
      addLog('Too tired to respond!', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    state.energy -= 5;
    startRedButtonGame(guest);
  }

  // ===================== CHECK-IN BUTTON =====================
  function checkinGuest() {
    const waiting = state.guests.filter(g => g.status === 'waiting' && !g.redButton);
    if (waiting.length === 0) {
      addLog('No guests waiting to check in.', 'fa-info-circle', '#4a6a8a');
      return;
    }
    if (state.energy < 10) {
      addLog('Too tired! Rest first.', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    const guest = waiting[0];
    startCheckinGame(guest);
  }

  // ===================== CHAT BUTTON =====================
  function chatGuest() {
    const waiting = state.guests.filter(g => g.status === 'waiting' && !g.redButton);
    if (waiting.length === 0) {
      addLog('No guests to chat with.', 'fa-info-circle', '#4a6a8a');
      return;
    }
    if (state.energy < 8) {
      addLog('Too tired to chat!', 'fa-exclamation-triangle', '#ff7a7a');
      return;
    }
    const guest = waiting[0];
    state.energy -= 3;
    startChatGame(guest);
  }

  // ===================== TIME SYSTEM =====================
  function tick() {
    if (!state.gameRunning) return;
    state.time++;
    const mins = Math.floor(state.time / 60);
    const secs = state.time % 60;
    timeDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

    // Energy drain
    if (state.time % 2 === 0 && state.guests.length > 0) {
      state.energy = Math.max(0, state.energy - 1);
    }

    // Random events
    state.guests.forEach(g => {
      if (g.status === 'waiting' && !g.redButton) {
        // Random red button press
        if (Math.random() < 0.02) {
          g.redButton = true;
          addLog(`🔴 ${g.name} pressed the red button!`, 'fa-bell', '#ff4444');
          updateComputer(`EMERGENCY: ${g.name} needs help!`, '#ff4444');
        }
        // Random patience drain
        if (Math.random() < 0.03) {
          g.patience -= 2;
          if (g.patience <= 0) {
            g.status = 'angry';
            addLog(`😡 ${g.name} left angry!`, 'fa-exclamation-triangle', '#ff7a7a');
            setTimeout(() => removeGuest(g.id), 1000);
          }
        }
      }
    });

    // Auto spawn guests
    if (state.time % 6 === 0 && state.guests.length < 5) {
      if (Math.random() < 0.4) bookGuest();
    }

    renderGuests();
    updateUI();
  }

  // ===================== INIT =====================
  function init() {
    document.getElementById('bookBtn').addEventListener('click', bookGuest);
    document.getElementById('checkinBtn').addEventListener('click', checkinGuest);
    document.getElementById('chatBtn').addEventListener('click', chatGuest);
    document.getElementById('restBtn').addEventListener('click', rest);
    closeMinigameBtn.addEventListener('click', closeMinigame);

    // Spawn initial guests
    for (let i = 0; i < 2; i++) {
      setTimeout(() => bookGuest(), i * 1500);
    }

    addLog('🏨 Hotel Sim initialized', 'fa-hotel', '#f5c87c');
    updateComputer('system ready', '#f5c87c');
    updateUI();
    renderGuests();

    state.tickInterval = setInterval(tick, 1500);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'b') bookGuest();
      else if (e.key === 'c') checkinGuest();
      else if (e.key === 't') chatGuest();
      else if (e.key === 'r') rest();
      else if (e.key === 'Escape') closeMinigame();
    });
  }

  window.removeGuest = removeGuest;
  window.handleRedButton = handleRedButton;
  init();
</script>
</body>
</html>
