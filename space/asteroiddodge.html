<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☄️ Asteroid Dodge Pro</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .game-container { text-align: center; }
        canvas {
            display: block;
            margin: 15px auto;
            background: #0a0a1a;
            border-radius: 16px;
            border: 2px solid rgba(79,195,247,0.1);
            max-width: 100%;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .status-bar .stat { color: #8899aa; font-size: 0.9rem; }
        .status-bar .stat span { color: #d0e8f0; font-weight: 700; }
        .stat .score { color: #ffd93d; }
        .stat .high { color: #7cf5b0; }
        .stat .lives { color: #ff6b6b; font-size: 1.2rem; letter-spacing: 2px; }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .controls button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); }
        .difficulty-selector { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
        .difficulty-selector button { background: rgba(255,255,255,0.05); color: #d0e8f0; border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; padding: 6px 16px; }
        .difficulty-selector button.active { background: #4fc3f7; color: #0b1a26; border-color: #4fc3f7; }
        #message { min-height: 2rem; font-size: 1rem; }
        .combo-display { color: #ffd93d; font-weight: 700; font-size: 1.1rem; }
        @media (max-width: 600px) { canvas { width: 100%; height: auto; } }
    </style>
</head>
<body>
<div class="game-container">
    <a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a>
    <h1 class="game-title">☄️ Asteroid Dodge Pro</h1>

    <!-- Difficulty -->
    <div class="difficulty-selector">
        <button data-diff="easy">Easy</button>
        <button data-diff="medium" class="active">Medium</button>
        <button data-diff="hard">Hard</button>
    </div>

    <!-- Status -->
    <div class="status-bar">
        <div class="stat">🏆 Score: <span class="score" id="score">0</span></div>
        <div class="stat">🏅 Best: <span class="high" id="bestScore">-</span></div>
        <div class="stat">❤️ <span class="lives" id="livesDisplay">❤️❤️❤️</span></div>
        <div class="stat combo-display">🔥 Combo: <span id="combo">0</span>x</div>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div id="message">⬆️⬇️⬅️➡️ Move | Dodge the asteroids!</div>

    <div class="controls">
        <button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button>
        <button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button>
    </div>
</div>

<script>
// ============================================================
// ASTEROID DODGE PRO – Multiple sizes, shield, combo, high-score
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('bestScore');
const livesEl = document.getElementById('livesDisplay');
const comboEl = document.getElementById('combo');
const msgEl = document.getElementById('message');

const W = canvas.width;
const H = canvas.height;

let player = { x: 100, y: H/2, w: 30, h: 30, speed: 5 };
let asteroids = [];
let stars = [];
let score = 0;
let lives = 3;
let combo = 0;
let maxCombo = 0;
let gameOver = false;
let paused = false;
let difficulty = 'medium';
let bestScore = 0;
let frame = 0;
let keys = {};
let invincible = 0;
let difficultySettings = {
    easy: { spawnRate: 60, maxAsteroids: 5, speedMin: 1, speedMax: 2, sizeMin: 20, sizeMax: 40 },
    medium: { spawnRate: 35, maxAsteroids: 8, speedMin: 1.5, speedMax: 3, sizeMin: 15, sizeMax: 35 },
    hard: { spawnRate: 20, maxAsteroids: 12, speedMin: 2, speedMax: 4, sizeMin: 10, sizeMax: 30 }
};

// Load best score and difficulty
(function load() {
    try {
        const saved = JSON.parse(localStorage.getItem('asteroid_dodge_best') || '{}');
        bestScore = saved[difficulty] || 0;
        if (bestScore) bestEl.textContent = bestScore;
        else bestEl.textContent = '-';
        const diff = localStorage.getItem('asteroid_dodge_difficulty') || 'medium';
        difficulty = diff;
        document.querySelectorAll('.difficulty-selector button').forEach(b => {
            b.classList.toggle('active', b.dataset.diff === difficulty);
        });
    } catch(e) {}
})();

function saveBest() {
    if (score > bestScore) {
        bestScore = score;
        const saved = JSON.parse(localStorage.getItem('asteroid_dodge_best') || '{}');
        saved[difficulty] = score;
        localStorage.setItem('asteroid_dodge_best', JSON.stringify(saved));
        bestEl.textContent = score;
    }
}

function getSettings() {
    return difficultySettings[difficulty] || difficultySettings.medium;
}

function updateLivesUI() {
    livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
}

// ---- Stars ----
function initStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.5 + 0.2
        });
    }
}

function updateStars() {
    stars.forEach(s => {
        s.x -= s.speed;
        if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    });
}

function drawStars() {
    stars.forEach(s => {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + s.size/6})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ---- Player ----
function drawPlayer() {
    ctx.save();
    if (invincible > 0 && Math.floor(invincible / 10) % 2 === 0) {
        ctx.globalAlpha = 0.5;
    }
    // Ship body
    ctx.shadowColor = '#4fc3f7';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#4fc3f7';
    ctx.beginPath();
    ctx.moveTo(player.x + player.w, player.y + player.h/2);
    ctx.lineTo(player.x, player.y);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // Cockpit
    ctx.fillStyle = '#7cf5b0';
    ctx.beginPath();
    ctx.arc(player.x + player.w*0.3, player.y + player.h/2, 4, 0, Math.PI*2);
    ctx.fill();
    // Engine glow
    if (!paused && !gameOver) {
        ctx.fillStyle = `rgba(255,215,0,${0.2 + 0.3 * Math.sin(frame/10)})`;
        ctx.beginPath();
        ctx.arc(player.x - 5, player.y + player.h/2, 8, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.restore();
}

function movePlayer() {
    if (paused || gameOver) return;
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx = -1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dx = 1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) dy = -1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) dy = 1;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    player.x += dx * player.speed;
    player.y += dy * player.speed;
    player.x = Math.max(0, Math.min(W - player.w, player.x));
    player.y = Math.max(0, Math.min(H - player.h, player.y));
}

// ---- Asteroids ----
function spawnAsteroid() {
    const settings = getSettings();
    const size = settings.sizeMin + Math.random() * (settings.sizeMax - settings.sizeMin);
    const y = Math.random() * (H - size);
    const speed = settings.speedMin + Math.random() * (settings.speedMax - settings.speedMin);
    // Some asteroids are faster but smaller
    const type = Math.random() < 0.2 ? 'fast' : 'normal';
    const finalSpeed = type === 'fast' ? speed * 1.5 : speed;
    asteroids.push({
        x: W + 20,
        y: y,
        size: size,
        speed: finalSpeed,
        type: type,
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.04
    });
}

function updateAsteroids() {
    asteroids.forEach(a => {
        a.x -= a.speed;
        a.rotation += a.rotSpeed;
    });
    asteroids = asteroids.filter(a => a.x > -a.size - 20);
}

function drawAsteroids() {
    asteroids.forEach(a => {
        ctx.save();
        ctx.translate(a.x, a.y + a.size/2);
        ctx.rotate(a.rotation);
        // Asteroid shape
        const sides = 8 + Math.floor(Math.random() * 4);
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
            const angle = (i / sides) * Math.PI * 2;
            const r = a.size * (0.7 + 0.3 * Math.sin(i * 3 + a.rotation));
            const x = r * Math.cos(angle);
            const y = r * Math.sin(angle);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = a.type === 'fast' ? '#ff6b6b' : '#8899aa';
        ctx.shadowColor = a.type === 'fast' ? '#ff6b6b' : '#8899aa';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.shadowBlur = 0;
        // Craters
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.arc(-a.size*0.2, -a.size*0.1, a.size*0.2, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(a.size*0.25, a.size*0.15, a.size*0.15, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    });
}

// ---- Collision ----
function checkCollisions() {
    // Player vs asteroids
    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        // Simple distance check
        const ax = a.x + a.size/2;
        const ay = a.y + a.size/2;
        const px = player.x + player.w/2;
        const py = player.y + player.h/2;
        const dist = Math.sqrt((ax - px) ** 2 + (ay - py) ** 2);
        if (dist < a.size/2 + player.w/2) {
            if (invincible <= 0) {
                lives--;
                updateLivesUI();
                playSound('hit');
                if (lives <= 0) {
                    gameOver = true;
                    msgEl.textContent = '💀 Game Over! Press Restart.';
                    playSound('explode');
                    saveBest();
                    return;
                }
                invincible = 90; // 1.5 seconds invincibility
                // Reset combo
                combo = 0;
                comboEl.textContent = combo;
                // Remove the asteroid
                asteroids.splice(i, 1);
            } else {
                // Invincible – push asteroid away
                asteroids.splice(i, 1);
            }
        }
    }
}

// ---- Score & Combo ----
function updateScoreAndCombo() {
    // Score increases over time and with dodging
    const settings = getSettings();
    const basePoints = 0.5;
    const comboBonus = 1 + combo * 0.2;
    score += basePoints * comboBonus;
    // Increase combo every 50 frames
    if (frame % 50 === 0 && !gameOver && !paused) {
        combo++;
        comboEl.textContent = combo;
        if (combo > maxCombo) maxCombo = combo;
    }
    scoreEl.textContent = Math.floor(score);
    // Save best periodically
    if (score > bestScore) {
        saveBest();
    }
}

// ---- Spawn enemies based on difficulty ----
function shouldSpawnAsteroid() {
    const settings = getSettings();
    const currentCount = asteroids.length;
    if (currentCount >= settings.maxAsteroids + Math.floor(score / 100)) return false;
    const spawnChance = 1 / settings.spawnRate;
    return Math.random() < spawnChance * (1 + score / 500);
}

// ---- Drawing ----
function draw() {
    ctx.clearRect(0, 0, W, H);
    drawStars();
    drawAsteroids();
    drawPlayer();
    // HUD - Combo display on canvas
    if (combo > 1 && !gameOver) {
        ctx.fillStyle = 'rgba(255,215,0,0.1)';
        ctx.fillRect(W - 120, 10, 110, 30);
        ctx.fillStyle = '#ffd93d';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(`🔥 ${combo}x Combo`, W - 15, 25);
    }
}

// ---- Sound ----
function playSound(type) {
    try {
        const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        if (type === 'hit') {
            osc.frequency.value = 300;
            gain.gain.value = 0.06;
            osc.start();
            osc.stop(ctxAudio.currentTime + 0.1);
        } else if (type === 'explode') {
            osc.frequency.value = 200;
            gain.gain.value = 0.08;
            osc.start();
            setTimeout(() => { osc.frequency.value = 100; }, 100);
            osc.stop(ctxAudio.currentTime + 0.3);
        }
    } catch(e) {}
}

// ---- Game Loop ----
function gameLoop() {
    if (!gameOver && !paused) {
        frame++;
        movePlayer();
        updateStars();
        // Spawn asteroids
        if (shouldSpawnAsteroid()) {
            spawnAsteroid();
        }
        updateAsteroids();
        checkCollisions();
        updateScoreAndCombo();
        // Invincibility timer
        if (invincible > 0) invincible--;
        // Update UI
        scoreEl.textContent = Math.floor(score);
    }
    draw();
    requestAnimationFrame(gameLoop);
}

// ---- Controls ----
document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === 'p' || e.key === 'P') togglePause();
    if (e.key === 'r' || e.key === 'R') resetGame();
});
document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

function togglePause() {
    if (gameOver) return;
    paused = !paused;
    document.getElementById('pauseLabel').textContent = paused ? 'Resume' : 'Pause';
    msgEl.textContent = paused ? '⏸️ Paused' : '⬆️⬇️⬅️➡️ Dodge the asteroids!';
}

function resetGame() {
    if (confirm('Reset game?')) {
        player.x = 100; player.y = H/2;
        asteroids = [];
        score = 0;
        lives = 3;
        combo = 0;
        maxCombo = 0;
        gameOver = false;
        paused = false;
        invincible = 0;
        frame = 0;
        scoreEl.textContent = score;
        comboEl.textContent = combo;
        updateLivesUI();
        msgEl.textContent = '⬆️⬇️⬅️➡️ Dodge the asteroids!';
        document.getElementById('pauseLabel').textContent = 'Pause';
        initStars();
        saveBest();
    }
}

// ---- Difficulty ----
document.querySelectorAll('.difficulty-selector button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.difficulty-selector button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        difficulty = this.dataset.diff;
        localStorage.setItem('asteroid_dodge_difficulty', difficulty);
        resetGame();
    });
});

// ---- Init ----
initStars();
updateLivesUI();
resetGame();
gameLoop();
console.log('☄️ Asteroid Dodge Pro loaded with combo, difficulty, lives.');
</script>
</body>
</html>
