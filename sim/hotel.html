<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>🏨 Hotel Sim Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.status-bar .stat{background:rgba(0,0,0,0.3);padding:6px 10px;border-radius:8px;border:1px solid rgba(79,195,247,0.05)}
.status-bar .stat .label{font-size:.7rem;color:#8899aa}
.status-bar .stat .value{font-weight:700;font-size:1.1rem}
.rooms{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.room-card{background:rgba(0,0,0,0.3);padding:10px;border-radius:12px;border:1px solid rgba(79,195,247,0.05);width:120px;text-align:center;font-size:.8rem}
.room-card .number{font-weight:700;color:#d0e8f0}
.room-card .type{color:#4fc3f7;font-size:.7rem}
.room-card .status{color:#ffd93d;font-size:.7rem}
.room-card .status.occupied{color:#ff6b6b}
.room-card .status.available{color:#7cf5b0}
.guests{background:rgba(0,0,0,0.2);border-radius:12px;padding:10px;margin:10px 0;border:1px solid rgba(79,195,247,0.05)}
.guest-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.02);font-size:.8rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.actions button{background:rgba(79,195,247,0.05);border:1px solid rgba(79,195,247,0.1);color:#d0e8f0;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem}
.actions button:hover{background:rgba(79,195,247,0.1)}
.events{background:rgba(255,215,0,0.03);border:1px solid rgba(255,215,0,0.05);border-radius:8px;padding:8px;margin:10px 0;font-size:.85rem;min-height:40px;color:#8899aa}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.controls button{background:rgba(255,255,255,0.05);color:#d0e8f0;border:1px solid rgba(255,255,255,0.1)}
#message{min-height:2rem;font-size:.9rem}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">🏨 Hotel Sim Pro</h1>
<div class="status-bar"><div class="stat"><div class="label">💰 Revenue</div><div class="value" id="revenue">100</div></div><div class="stat"><div class="label">🏆 Score</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">🏅 Best</div><div class="value" id="bestScore">-</div></div><div class="stat"><div class="label">⭐ Rating</div><div class="value" id="rating">3.0</div></div></div>
<div class="rooms" id="roomList"></div>
<div class="guests" id="guestList"><span style="color:#8899aa;font-size:.8rem">No guests currently.</span></div>
<div class="actions"><button onclick="checkIn()">🚪 Check‑In Guest</button><button onclick="checkOut()">🚪 Check‑Out Guest</button><button onclick="upgradeRoom()">⬆️ Upgrade Room ($15)</button><button onclick="addAmenity()">🏊 Add Amenity ($10)</button><button onclick="hireStaff()">👨‍💼 Hire Staff ($12)</button></div>
<div class="events" id="events">🏨 Welcome to the hotel!</div>
<div id="message">💡 Check in guests, upgrade rooms, and earn revenue!</div>
<div class="controls"><button onclick="startGame()"><i class="fas fa-play"></i> Start</button><button onclick="resetGame()"><i class="fas fa-redo"></i> Restart</button><button onclick="togglePause()"><i class="fas fa-pause"></i> <span id="pauseLabel">Pause</span></button></div>
</div>
<script>
const revenueEl=document.getElementById('revenue'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('bestScore'),ratingEl=document.getElementById('rating'),roomList=document.getElementById('roomList'),guestList=document.getElementById('guestList'),eventsEl=document.getElementById('events'),msgEl=document.getElementById('message');
const ROOM_TYPES=['Standard','Deluxe','Suite'];
const AMENITIES=['Pool','Restaurant','Spa','Gym'];
const GUEST_NAMES=['Alice','Bob','Charlie','Diana','Eve','Frank','Grace','Henry','Ivy','Jack','Karen','Leo','Mia','Noah','Olivia','Paul','Quinn','Rose','Sam','Tina'];
let state={revenue:100,score:0,rating:3,rooms:[],guests:[],amenities:[],staff:1,hotelLevel:1,gameActive:!1,paused:!1,timerId:null,eventTimer:null,bestScore:0};
(function load(){try{let s=JSON.parse(localStorage.getItem('hotel_best')||'{}');state.bestScore=s['all']||0;bestEl.textContent=state.bestScore||'-'}catch(e){}})();
function saveBest(){if(state.score>state.bestScore){state.bestScore=state.score;let s=JSON.parse(localStorage.getItem('hotel_best')||'{}');s['all']=state.score;localStorage.setItem('hotel_best',JSON.stringify(s));bestEl.textContent=state.score}}
function saveState(){try{localStorage.setItem('hotel_state',JSON.stringify(state))}catch(e){}}
function initRooms(){if(state.rooms.length===0){for(let i=1;i<=6;i++){state.rooms.push({number:i,type:'Standard',occupied:!1,guest:null,rating:3,upgrade:0})}}}
function renderRooms(){roomList.innerHTML=state.rooms.map(r=>{let statusClass=r.occupied?'occupied':'available';return'<div class="room-card"><div class="number">🚪 Room '+r.number+'</div><div class="type">'+r.type+'</div><div class="status '+statusClass+'">'+(r.occupied?'🟢 Occupied':'⬜ Available')+'</div></div>'}).join('')}
function renderGuests(){if(state.guests.length===0){guestList.innerHTML='<span style="color:#8899aa;font-size:.8rem">No guests currently.</span>';return}guestList.innerHTML=state.guests.map(g=>'<div class="guest-item"><span>👤 '+g.name+' (Room '+g.roomNumber+')</span><span>⭐ '+g.satisfaction+' | Days: '+g.days+'</span></div>').join('')}
function checkIn(){if(!state.gameActive||state.paused)return;let available=state.rooms.filter(r=>!r.occupied);if(available.length===0){msgEl.textContent='❌ No rooms available!';return}let room=available[Math.floor(Math.random()*available.length)];let name=GUEST_NAMES[Math.floor(Math.random()*GUEST_NAMES.length)];let days=2+Math.floor(Math.random()*3)+state.hotelLevel;let satisfaction=3+Math.floor(Math.random()*2)+state.rating/2;let typeIndex=ROOM_TYPES.indexOf(room.type);let rate=10+typeIndex*5+state.amenities.length*0.5+state.hotelLevel*2;let guest={name,roomNumber:room.number,days,satisfaction:Math.min(5,satisfaction),rate};room.occupied=!0;room.guest=guest;state.guests.push(guest);state.revenue+=rate*0.5;state.score+=1;addEvent('🚪 '+name+' checked in to Room '+room.number);playSound('checkin');saveState();renderRooms();renderGuests();updateUI()}
function checkOut(){if(!state.gameActive||state.paused)return;let checking=state.guests.filter(g=>g.days<=0);if(checking.length===0){msgEl.textContent='❌ No guests checking out today!';return}let g=checking[0];let room=state.rooms.find(r=>r.number===g.roomNumber);if(room){room.occupied=!1;room.guest=null}let bonus=Math.round(g.satisfaction*2);state.revenue+=g.rate*bonus/10;state.score+=bonus;state.rating=(state.rating*3+g.satisfaction)/4;state.guests=state.guests.filter(x=>x!==g);addEvent('🚪 '+g.name+' checked out. Satisfaction: '+g.satisfaction+'⭐');playSound('checkout');saveState();renderRooms();renderGuests();updateUI()}
function upgradeRoom(){if(!state.gameActive||state.paused)return;if(state.revenue<15){msgEl.textContent='❌ Need $15!';return}state.revenue-=15;let available=state.rooms.filter(r=>r.type!=='Suite');if(available.length===0){msgEl.textContent='❌ All rooms are already Suites!';return}let room=available[Math.floor(Math.random()*available.length)];let idx=ROOM_TYPES.indexOf(room.type);if(idx<ROOM_TYPES.length-1){room.type=ROOM_TYPES[idx+1];room.upgrade++;state.score+=3;addEvent('⬆️ Room '+room.number+' upgraded to '+room.type);playSound('upgrade')}saveState();renderRooms();updateUI()}
function addAmenity(){if(!state.gameActive||state.paused)return;if(state.revenue<10){msgEl.textContent='❌ Need $10!';return}state.revenue-=10;let avail=AMENITIES.filter(a=>!state.amenities.includes(a));if(avail.length===0){msgEl.textContent='❌ All amenities already added!';return}let amenity=avail[Math.floor(Math.random()*avail.length)];state.amenities.push(amenity);state.score+=2;state.rating=Math.min(5,state.rating+0.3);addEvent('🏊 Added '+amenity+'!');playSound('amenity');saveState();updateUI()}
function hireStaff(){if(!state.gameActive||state.paused)return;if(state.revenue<12){msgEl.textContent='❌ Need $12!';return}state.revenue-=12;state.staff++;state.score+=2;addEvent('👨‍💼 Hired new staff! Total: '+state.staff);playSound('hire');saveState();updateUI()}
function addEvent(msg){eventsEl.textContent='🏨 '+msg}
function updateUI(){revenueEl.textContent=Math.round(state.revenue);scoreEl.textContent=Math.round(state.score);bestEl.textContent=state.bestScore||'-';ratingEl.textContent=state.rating.toFixed(1);renderRooms();renderGuests()}
function processDays(){if(!state.gameActive||state.paused)return;state.guests.forEach(g=>{g.days--});let income=state.guests.length*0.5+state.amenities.length*0.3+state.staff*0.1;state.revenue+=income;if(state.guests.length>0){state.rating=Math.min(5,state.rating+0.01)}else{state.rating=Math.max(1,state.rating-0.02)}saveState();updateUI()}
function randomEvent(){if(!state.gameActive||state.paused)return;let events=[{msg:'🌟 VIP guest arrives! +$10',fn:()=>{state.revenue+=10}},{msg:'⚡ Maintenance issue! -$5',fn:()=>{state.revenue=Math.max(0,state.revenue-5)}},{msg:'🎉 Special event! +5 score',fn:()=>{state.score+=5}},{msg:'⭐ Perfect reviews! Rating +0.2',fn:()=>{state.rating=Math.min(5,state.rating+0.2)}},{msg:'📉 Bad review! Rating -0.1',fn:()=>{state.rating=Math.max(1,state.rating-0.1)}}];let e=events[Math.floor(Math.random()*events.length)];e.fn();addEvent(e.msg);playSound('event');saveState();updateUI()}
function startGame(){state.gameActive=!0;state.paused=!1;state.revenue=100;state.score=0;state.rating=3;state.rooms=[];state.guests=[];state.amenities=[];state.staff=1;state.hotelLevel=1;initRooms();document.getElementById('pauseLabel').textContent='Pause';addEvent('🏨 Hotel opened!');if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);state.timerId=setInterval(()=>{processDays()},3000);state.eventTimer=setInterval(()=>{randomEvent()},8000);saveState();updateUI();msgEl.textContent='💡 Check in guests and grow your hotel!'}
function togglePause(){if(!state.gameActive)return;state.paused=!state.paused;document.getElementById('pauseLabel').textContent=state.paused?'Resume':'Pause';msgEl.textContent=state.paused?'⏸️ Paused':'💡 Keep managing!';if(state.paused){if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer)}else{state.timerId=setInterval(()=>{processDays()},3000);state.eventTimer=setInterval(()=>{randomEvent()},8000)}}
function resetGame(){if(state.timerId)clearInterval(state.timerId);if(state.eventTimer)clearInterval(state.eventTimer);state.gameActive=!1;state.paused=!1;state.revenue=100;state.score=0;state.rating=3;state.rooms=[];state.guests=[];state.amenities=[];state.staff=1;state.hotelLevel=1;initRooms();document.getElementById('pauseLabel').textContent='Pause';addEvent('🔄 Hotel reset.');saveState();updateUI();msgEl.textContent='💡 Click Start to begin!'}
function playSound(type){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='checkin'){o.frequency.value=500;g.gain.value=.04;o.start();setTimeout(()=>{o.frequency.value=700},100);o.stop(c.currentTime+.2)}else if(type==='checkout'){o.frequency.value=400;g.gain.value=.04;o.start();setTimeout(()=>{o.frequency.value=600},100);o.stop(c.currentTime+.2)}else if(type==='upgrade'){o.frequency.value=600;g.gain.value=.06;o.start();setTimeout(()=>{o.frequency.value=800},100);setTimeout(()=>{o.frequency.value=1000},200);o.stop(c.currentTime+.35)}else if(type==='amenity'){o.frequency.value=700;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=900},100);o.stop(c.currentTime+.2)}else if(type==='hire'){o.frequency.value=500;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=700},100);o.stop(c.currentTime+.2)}else if(type==='event'){o.frequency.value=400;g.gain.value=.05;o.start();setTimeout(()=>{o.frequency.value=600},100);o.stop(c.currentTime+.2)}}catch(e){}}
loadState();initRooms();updateUI();console.log('🏨 Hotel Sim Pro loaded');
</script></body></html>
