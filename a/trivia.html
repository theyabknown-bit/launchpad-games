<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Trivia Quiz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.question{font-size:1.2rem;padding:20px;background:#1a3344;border-radius:12px;border:2px solid #2a4a5e;min-height:80px;margin:15px 0;display:flex;align-items:center;justify-content:center;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.option{background:#1a3344;padding:15px;border-radius:10px;border:2px solid #2a4a5e;cursor:pointer;transition:0.2s;touch-action:manipulation;}
.option:hover{background:#2a4a5e;border-color:#4fc3f7;}
.option.correct{background:#1a4a3a;border-color:#7cf5b0;}
.option.wrong{background:#3a1a1a;border-color:#ff6b6b;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-brain" style="color:#4fc3f7;"></i> Trivia Quiz</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="total">0</span><span class="label">Total</span></div>
    </div>
    <div class="question" id="question">Loading...</div>
    <div class="options" id="options"></div>
    <button class="btn" id="nextBtn">Next Question</button>
    <div class="message" id="message">🎯 Test your knowledge!</div>
</div>
<script>
const QUESTIONS=[
    {q:'What is the largest planet in our solar system?',options:['Earth','Jupiter','Saturn','Neptune'],correct:1},
    {q:'What is the chemical symbol for water?',options:['H2O','CO2','NaCl','O2'],correct:0},
    {q:'How many planets are in our solar system?',options:['7','8','9','10'],correct:1},
    {q:'What is the speed of light approx?',options:['300,000 km/s','150,000 km/s','600,000 km/s','100,000 km/s'],correct:0},
    {q:'What is the largest ocean on Earth?',options:['Atlantic','Indian','Pacific','Arctic'],correct:2},
    {q:'What is the smallest country in the world?',options:['Monaco','Vatican City','San Marino','Liechtenstein'],correct:1},
    {q:'What is the tallest mountain in the world?',options:['K2','Everest','Kilimanjaro','Denali'],correct:1},
    {q:'What is the fastest land animal?',options:['Lion','Cheetah','Horse','Gazelle'],correct:1},
    {q:'What year did the Titanic sink?',options:['1910','1911','1912','1913'],correct:2},
    {q:'What is the main ingredient in sushi?',options:['Rice','Seaweed','Fish','Vinegar'],correct:0}
];
let currentIndex=0,score=0,total=0;

const questionEl=document.getElementById('question'),optionsEl=document.getElementById('options');
const scoreEl=document.getElementById('score'),totalEl=document.getElementById('total');
const msg=document.getElementById('message');

function loadQuestion(){
    if(currentIndex>=QUESTIONS.length){
        questionEl.textContent='🎉 Complete! Score: '+score+'/'+total;
        optionsEl.innerHTML='';
        document.getElementById('nextBtn').style.display='none';
        msg.textContent='Great job!';
        return;
    }
    const q=QUESTIONS[currentIndex];
    questionEl.textContent=q.q;
    optionsEl.innerHTML='';
    q.options.forEach((opt,idx)=>{
        const div=document.createElement('div');
        div.className='option';
        div.textContent=opt;
        div.addEventListener('click',()=>selectAnswer(idx));
        optionsEl.appendChild(div);
    });
    document.getElementById('nextBtn').style.display='none';
    msg.textContent='🤔 Choose an answer!';
    total++;
    totalEl.textContent=total;
}

function selectAnswer(idx){
    const q=QUESTIONS[currentIndex];
    const options=optionsEl.querySelectorAll('.option');
    options.forEach((el,i)=>{
        el.style.pointerEvents='none';
        if(i===q.correct)el.classList.add('correct');
        else if(i===idx&&idx!==q.correct)el.classList.add('wrong');
    });
    if(idx===q.correct){score++;scoreEl.textContent=score;msg.textContent='✅ Correct!';}
    else msg.textContent='❌ Wrong! The answer was: '+q.options[q.correct];
    document.getElementById('nextBtn').style.display='inline-block';
}

document.getElementById('nextBtn').addEventListener('click',()=>{
    currentIndex++;
    loadQuestion();
});

loadQuestion();
</script>
</body>
</html>
