<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>👽 Alien Translator Pro</title><link rel="stylesheet" href="../assets/css/game.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
.game-container{text-align:center}
.langs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.lang-btn{padding:6px 14px;border-radius:20px;border:2px solid rgba(79,195,247,0.1);background:rgba(0,0,0,0.3);color:#8899aa;cursor:pointer;font-size:.8rem;transition:.2s}
.lang-btn.active{background:rgba(79,195,247,0.1);border-color:#4fc3f7;color:#4fc3f7}
.lang-btn:hover{border-color:rgba(79,195,247,0.3)}
.input-area{display:flex;gap:10px;margin:10px 0}
.input-area input{flex:1;padding:10px;border-radius:12px;border:2px solid rgba(79,195,247,0.1);background:rgba(0,0,0,0.3);color:#d0e8f0}
.input-area button{padding:10px 20px;border-radius:12px;border:none;background:#4fc3f7;color:#0b1a26;font-weight:700;cursor:pointer}
.output-area{background:rgba(0,0,0,0.3);border-radius:16px;padding:20px;min-height:80px;border:2px solid rgba(79,195,247,0.05);margin:10px 0}
.output-area .alien{font-size:2rem;font-family:'Courier New',monospace;color:#7cf5b0;word-wrap:break-word}
.output-area .human{font-size:.9rem;color:#8899aa;margin-top:8px;border-top:1px solid rgba(255,255,255,0.03);padding-top:8px}
.history{max-height:150px;overflow-y:auto;background:rgba(0,0,0,0.2);border-radius:12px;padding:10px;margin:10px 0;text-align:left}
.history-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.02);font-size:.8rem}
.history-item .h{color:#8899aa}
.history-item .a{color:#7cf5b0}
.stats{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;font-size:.8rem;color:#8899aa}
.stats span{color:#d0e8f0;font-weight:700}
</style></head><body>
<div class="game-container"><a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Hub</a><h1 class="game-title">👽 Alien Translator Pro</h1>
<div class="stats"><div>🌌 Languages: <span id="langCount">8</span></div><div>📜 History: <span id="historyCount">0</span></div><div>📝 Characters: <span id="charCount">0</span></div></div>
<div class="langs" id="langSelector"></div>
<div class="input-area"><input type="text" id="input" placeholder="Type a message..." autofocus><button onclick="translate()"><i class="fas fa-arrow-right"></i> Translate</button></div>
<div class="output-area"><div class="alien" id="alienText">👾 👽 🛸</div><div class="human" id="humanText">Ready for translation</div><button onclick="copyText()" style="position:absolute;right:10px;top:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:#8899aa;padding:2px 10px;border-radius:20px;cursor:pointer;font-size:.7rem">📋 Copy</button></div>
<div class="history"><div class="history-title" style="font-size:.7rem;color:#4a6a8a;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;display:flex;justify-content:space-between"><span>📜 History</span><button onclick="clearHistory()" style="background:rgba(255,107,107,0.1);border:none;color:#ff6b6b;padding:2px 12px;border-radius:20px;cursor:pointer;font-size:.6rem">Clear</button></div><div id="historyList"><span style="color:#4a6a8a;font-size:.8rem">No translations yet</span></div></div>
<div id="funFact" style="margin:10px 0;font-size:.8rem;color:#8899aa;background:rgba(255,215,0,0.03);padding:8px;border-radius:8px">💡 Click Translate to begin!</div>
</div>
<script>
const LANGUAGES={zorgon:{name:'Zorgon',emoji:'🌌',chars:['🛸','👾','👽','🤖','👁️','🌠','⭐','💫','🌀','✨','🔮','🪐','☄️','🌙','☀️'],sounds:[220,260,300,340,380,420,460,500],fact:'Zorgons communicate through telepathic emoji pulses!'},xylar:{name:'Xylar',emoji:'🪐',chars:['◈','◉','◊','○','●','◐','◑','◒','◓','◔','◕','◖','◗','◘','◙'],sounds:[180,220,280,340,400,460,520,580],fact:'Xylarians write in geometric patterns that form constellations!'},nebulon:{name:'Nebulon',emoji:'🌠',chars:['✦','✧','★','☆','✩','✪','✫','✬','✭','✮','✯','✰','✱','✲','✳'],sounds:[300,350,400,450,500,550,600,650],fact:'Nebulon language is based on the light patterns of dying stars!'},vortex:{name:'Vortex',emoji:'☄️',chars:['⌘','⌃','⌥','⌦','⌫','⌧','⌨','⌰','⌱','⌲','⌳','⌴','⌵','⌶','⌷'],sounds:[150,200,270,350,440,540,650,770],fact:'Vortexians use key-like symbols that unlock dimensional portals!'},lumina:{name:'Lumina',emoji:'✨',chars:['◈','◉','◊','○','●','◐','◑','◒','◓','◔','◕','◖','◗','◘','◙'],sounds:[400,450,500,550,600,650,700,750],fact:'Luminari language glows brighter as you speak!'},void:{name:'Void',emoji:'🕳️',chars:['⬡','⬢','⬣','⬤','⬥','⬦','⬧','⬨','⬩','⬪','⬫','⬬','⬭','⬮','⬯'],sounds:[80,120,180,260,360,480,620,780],fact:'Void language is whispered across the fabric of spacetime!'},glorp:{name:'Glorp',emoji:'🌀',chars:['⎔','⎕','⎖','⎗','⎘','⎙','⎚','⎛','⎜','⎝','⎞','⎟','⎠','⎡','⎢'],sounds:[250,310,370,430,490,550,610,670],fact:'Glorpians speak in swirling circular patterns!'},quasar:{name:'Quasar',emoji:'💥',chars:['✶','✷','✸','✹','✺','✻','✼','✽','✾','✿','❀','❁','❂','❃','❄'],sounds:[500,550,600,650,700,750,800,850],fact:'Quasar language pulses with the energy of collapsing stars!'}};
const LANG_KEYS=Object.keys(LANGUAGES);let currentLang='zorgon',history=[],totalChars=0,audioCtx=null;
function initAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)}catch(e){}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function playAlienSound(freq,dur=100){try{let ctx=initAudio();if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=freq;g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur/1000);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime);o.stop(ctx.currentTime+dur/1000)}catch(e){}}
function renderLangs(){let c=document.getElementById('langSelector');c.innerHTML='';LANG_KEYS.forEach(k=>{let l=LANGUAGES[k],b=document.createElement('button');b.className='lang-btn'+(k===currentLang?' active':'');b.innerHTML=l.emoji+' '+l.name;b.dataset.lang=k;b.onclick=()=>setLang(k);c.appendChild(b)})}
function setLang(k){currentLang=k;renderLangs();document.getElementById('funFact').innerHTML='💡 '+LANGUAGES[k].fact;let inp=document.getElementById('input').value.trim();if(inp)translate()}
function translate(){let inp=document.getElementById('input'),txt=inp.value.trim();if(!txt){document.getElementById('alienText').textContent='👾 👽 🛸';document.getElementById('humanText').textContent='Enter some text to translate!';return}let lang=LANGUAGES[currentLang],chars=lang.chars,alien='';for(let c of txt){if(c===' '){alien+='  ';continue}let idx=c.toLowerCase().charCodeAt(0)%chars.length;alien+=chars[idx]+' '}alien=alien.trim()||'👾 👽 🛸';document.getElementById('alienText').textContent=alien;document.getElementById('humanText').textContent='📝 '+txt;let sounds=lang.sounds;for(let i=0;i<3;i++)setTimeout(()=>playAlienSound(sounds[Math.floor(Math.random()*sounds.length)],120),i*120);history.push({human:txt.length>30?txt.slice(0,30)+'...':txt,alien:alien.length>40?alien.slice(0,40)+'...':alien,lang:currentLang});if(history.length>50)history.shift();totalChars+=txt.length;updateStats();renderHistory();try{localStorage.setItem('alienHistory',JSON.stringify(history))}catch(e){}}
function renderHistory(){let c=document.getElementById('historyList');if(!history.length){c.innerHTML='<span style="color:#4a6a8a;font-size:.8rem">No translations yet</span>';return}c.innerHTML=history.slice().reverse().map(h=>{let l=LANGUAGES[h.lang]||{name:'Unknown',emoji:'👽'};return'<div class="history-item"><span class="h">'+h.human+'</span><span class="a">'+h.alien+'</span><span>'+l.emoji+' '+l.name+'</span></div>'}).join('')}
function updateStats(){document.getElementById('langCount').textContent=LANG_KEYS.length;document.getElementById('historyCount').textContent=history.length;document.getElementById('charCount').textContent=totalChars}
function copyText(){let t=document.getElementById('alienText').textContent;if(t&&t!=='👾 👽 🛸'){navigator.clipboard.writeText(t).then(()=>{let b=document.querySelector('.output-area button');b.textContent='✅ Copied!';setTimeout(()=>{b.textContent='📋 Copy'},1500)}).catch(()=>{let inp=document.createElement('input');inp.value=t;document.body.appendChild(inp);inp.select();document.execCommand('copy');document.body.removeChild(inp);let b=document.querySelector('.output-area button');b.textContent='✅ Copied!';setTimeout(()=>{b.textContent='📋 Copy'},1500)})}}
function clearHistory(){history=[];renderHistory();updateStats();localStorage.removeItem('alienHistory')}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')translate()});
(function loadHistory(){try{let saved=localStorage.getItem('alienHistory');if(saved){let parsed=JSON.parse(saved);if(Array.isArray(parsed)&&parsed.length){history=parsed;renderHistory();updateStats()}}}catch(e){}})();
renderLangs();updateStats();document.getElementById('funFact').innerHTML='💡 '+LANGUAGES[currentLang].fact;console.log('👽 Alien Translator Pro loaded');
</script></body></html>
