<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👤 Sims Mini</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1a26; color: #d0e8f0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #4fc3f7; font-size: 2rem; margin-bottom: 10px; }
        .stats { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 8px 15px; border-radius: 10px; border: 1px solid #2a4a5e; min-width: 70px; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.1rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.6rem; text-transform: uppercase; }
        .tab-bar { display: flex; gap: 5px; margin: 10px 0; flex-wrap: wrap; justify-content: center; }
        .tab { background: #1a3344; color: #8899aa; border: 1px solid #2a4a5e; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; border: none; }
        .tab:hover { background: #2a4a5e; color: #d0e8f0; }
        .tab.active { background: #4fc3f7; color: #0b1a26; }
        .panel { display: none; background: #0f1f2e; border-radius: 16px; padding: 15px; border: 1px solid #1a3344; margin: 10px 0; min-height: 200px; }
        .panel.active { display: block; }
        .btn { padding: 10px 20px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin: 5px; }
        .btn-primary { background: #4fc3f7; color: #0b1a26; }
        .btn-success { background: #7cf5b0; color: #0b1a26; }
        .btn-warning { background: #ffd93d; color: #0b1a26; }
        .btn-danger { background: #ff6b6b; color: white; }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .message { font-size: 1rem; min-height: 30px; color: #ffd93d; margin: 8px 0; font-weight: 600; }
        .shop-item { background: #1a3344; border-radius: 12px; padding: 12px; margin: 6px 0; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a4a5e; }
        .shop-item .name { font-weight: 700; color: #f0f8ff; }
        .shop-item .price { color: #ffd93d; font-weight: 700; }
        .job-card { background: #1a3344; border-radius: 12px; padding: 12px; margin: 6px 0; border: 1px solid #2a4a5e; text-align: left; }
        .job-card .name { font-weight: 700; color: #f0f8ff; }
        .location-btn { background: #1a3344; border: 2px solid #2a4a5e; border-radius: 12px; padding: 12px; margin: 4px; display: inline-block; cursor: pointer; min-width: 70px; }
        .location-btn:hover { border-color: #4fc3f7; }
        .location-btn .emoji { font-size: 2rem; display: block; }
        .location-btn .name { font-size: 0.7rem; color: #d0e8f0; }
        .back-link { display: inline-block; margin-top: 15px; color: #4fc3f7; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h1>👤 Sims Mini</h1>
    <div class="stats">
        <div class="stat-box"><span id="money">0</span><span class="label">💰 Money</span></div>
        <div class="stat-box"><span id="health">100</span><span class="label">❤️ Health</span></div>
        <div class="stat-box"><span id="jobDisplay">None</span><span class="label">💼 Job</span></div>
        <div class="stat-box"><span id="locationDisplay">Home</span><span class="label">📍 Location</span></div>
    </div>
    <div class="tab-bar">
        <button class="tab active" onclick="showPanel('home')">🏠 Home</button>
        <button class="tab" onclick="showPanel('shop')">🏪 Shop</button>
        <button class="tab" onclick="showPanel('jobs')">💼 Jobs</button>
        <button class="tab" onclick="showPanel('car')">🚗 Car</button>
        <button class="tab" onclick="showPanel('inventory')">📦 Inventory</button>
    </div>
    <div class="panel active" id="panel-home">
        <div class="message" id="homeMessage">🏠 Welcome home!</div>
        <div>
            <button class="btn btn-primary" onclick="work()">💼 Work</button>
            <button class="btn btn-success" onclick="rest()">😴 Rest</button>
            <button class="btn btn-warning" onclick="goDoctor()">🏥 Doctor</button>
            <button class="btn btn-danger" onclick="resetGame()">🔄 Reset</button>
        </div>
    </div>
    <div class="panel" id="panel-shop">
        <div class="message" id="shopMessage">🏪 Welcome to the shop!</div>
        <div id="shopItems"></div>
    </div>
    <div class="panel" id="panel-jobs">
        <div class="message" id="jobsMessage">💼 Find your dream job!</div>
        <div id="jobsList"></div>
    </div>
    <div class="panel" id="panel-car">
        <div class="message" id="carMessage">🚗 Where to go?</div>
        <div>
            <div class="location-btn" onclick="driveTo('home')"><span class="emoji">🏠</span><span class="name">Home</span></div>
            <div class="location-btn" onclick="driveTo('city')"><span class="emoji">🏙️</span><span class="name">City</span></div>
            <div class="location-btn" onclick="driveTo('beach')"><span class="emoji">🏖️</span><span class="name">Beach</span></div>
            <div class="location-btn" onclick="driveTo('mountain')"><span class="emoji">🏔️</span><span class="name">Mountain</span></div>
            <div class="location-btn" onclick="driveTo('park')"><span class="emoji">🌳</span><span class="name">Park</span></div>
        </div>
    </div>
    <div class="panel" id="panel-inventory">
        <div class="message" id="inventoryMessage">📦 Your items</div>
        <div id="inventoryItems"></div>
        <button class="btn btn-warning" onclick="sellAllItems()" style="margin-top:10px;">💰 Sell All</button>
    </div>
    <div id="saveIndicator" style="font-size:0.7rem;color:#4a6a8a;margin-top:6px;">💾 Auto-saved</div>
    <a href="../base.html" class="back-link">← Back to Hub</a>
</div>
<script>
var money=0,health=100,job=null,currentLocation='Home',hasCar=false,inventory=[],sick=false;
var JOBS=[{id:'cashier',name:'🛒 Cashier',pay:50},{id:'cook',name:'🍳 Cook',pay:75},{id:'driver',name:'🚕 Driver',pay:100},{id:'teacher',name:'📚 Teacher',pay:120},{id:'doctor',name:'🏥 Doctor',pay:180},{id:'engineer',name:'🔧 Engineer',pay:200},{id:'pilot',name:'✈️ Pilot',pay:300},{id:'ceo',name:'💼 CEO',pay:500}];
var SHOP_ITEMS=[{id:'car',name:'🚗 Car',price:500},{id:'house',name:'🏠 House',price:1000},{id:'furniture',name:'🪑 Furniture',price:150},{id:'tv',name:'📺 TV',price:200},{id:'computer',name:'💻 Computer',price:300},{id:'pets',name:'🐕 Pet',price:250}];
var LOCATIONS={home:'Home',city:'City',beach:'Beach',mountain:'Mountain',park:'Park'};
function saveGame(){try{localStorage.setItem('simsMiniSave',JSON.stringify({money,health,job,currentLocation,hasCar,inventory,sick}));document.getElementById('saveIndicator').textContent='💾 Saved!';setTimeout(function(){document.getElementById('saveIndicator').textContent='💾 Auto-saved';},2000);}catch(e){}}
function loadGame(){try{var s=localStorage.getItem('simsMiniSave');if(s){var d=JSON.parse(s);money=d.money||0;health=d.health||100;job=d.job||null;currentLocation=d.currentLocation||'Home';hasCar=d.hasCar||false;inventory=d.inventory||[];sick=d.sick||false;updateUI();return true;}}catch(e){}return false;}
function updateUI(){document.getElementById('money').textContent=money;document.getElementById('health').textContent=Math.floor(health);document.getElementById('jobDisplay').textContent=job?job.name:'None';document.getElementById('locationDisplay').textContent=currentLocation;renderShop();renderJobs();renderInventory();var m=document.getElementById('carMessage');m.textContent=hasCar?'🚗 Where do you want to go?':'🚗 You need a car! Buy one in the shop for ✦500';}
function showPanel(p){document.querySelectorAll('.panel').forEach(function(el){el.classList.remove('active');});var el=document.getElementById('panel-'+p);if(el)el.classList.add('active');document.querySelectorAll('.tab').forEach(function(el){el.classList.remove('active');});document.querySelectorAll('.tab').forEach(function(el){if(el.textContent.includes(p)||(p==='home'&&el.textContent.includes('Home'))||(p==='shop'&&el.textContent.includes('Shop'))||(p==='jobs'&&el.textContent.includes('Jobs'))||(p==='car'&&el.textContent.includes('Car'))||(p==='inventory'&&el.textContent.includes('Inventory'))){el.classList.add('active');}});}
function renderShop(){var c=document.getElementById('shopItems');c.innerHTML='';for(var i=0;i<SHOP_ITEMS.length;i++){var item=SHOP_ITEMS[i];var owned=inventory.indexOf(item.id)!==-1||(item.id==='car'&&hasCar);var d=document.createElement('div');d.className='shop-item';d.innerHTML='<div><span class="name">'+item.name+'</span> <span class="price">✦'+item.price+'</span></div><button class="btn '+(owned?'btn-success':'btn-primary')+'" onclick="buyItem(\''+item.id+'\')" '+(owned?'disabled':'')+'>'+(owned?'✅ Owned':'Buy')+'</button>';c.appendChild(d);}}
function buyItem(id){var item=null;for(var i=0;i<SHOP_ITEMS.length;i++){if(SHOP_ITEMS[i].id===id){item=SHOP_ITEMS[i];break;}}if(!item)return;if(id==='car'&&hasCar){document.getElementById('shopMessage').textContent='🚗 You already have a car!';return;}if(inventory.indexOf(id)!==-1){document.getElementById('shopMessage').textContent='✅ You already own this!';return;}if(money<item.price){document.getElementById('shopMessage').textContent='❌ Not enough money! Need ✦'+item.price;return;}money-=item.price;if(id==='car'){hasCar=true;}else{inventory.push(id);}document.getElementById('shopMessage').textContent='✅ Purchased '+item.name+'!';updateUI();saveGame();}
function renderJobs(){var c=document.getElementById('jobsList');c.innerHTML='';for(var i=0;i<JOBS.length;i++){var j=JOBS[i];var isCurrent=job&&job.id===j.id;var d=document.createElement('div');d.className='job-card';d.innerHTML='<div class="name">'+j.name+'</div><div>💰 Pays ✦'+j.pay+'/day</div><button class="btn '+(isCurrent?'btn-success':'btn-primary')+'" onclick="applyJob(\''+j.id+'\')" '+(isCurrent?'disabled':'')+'>'+(isCurrent?'✅ Current':'Apply')+'</button>';c.appendChild(d);}}
function applyJob(id){if(job&&job.id===id){document.getElementById('jobsMessage').textContent='✅ You already have this job!';return;}var jobData=null;for(var i=0;i<JOBS.length;i++){if(JOBS[i].id===id){jobData=JOBS[i];break;}}if(!jobData)return;var a=prompt('📝 Interview Question:\n\nWhat is 5 + 3?');if(a&&a.trim()==='8'){job=jobData;document.getElementById('jobsMessage').textContent='🎉 You got the job! '+jobData.name+' (✦'+jobData.pay+'/day)';updateUI();saveGame();}else{document.getElementById('jobsMessage').textContent='❌ Interview failed! Try again.';}}
function work(){if(!job){document.getElementById('homeMessage').textContent='❌ You need a job first!';return;}if(sick){document.getElementById('homeMessage').textContent='🤒 You are sick! Go to the doctor.';return;}if(health<20){document.getElementById('homeMessage').textContent='😰 Too tired! Rest first.';return;}health=Math.max(0,health-5);var earned=job.pay+Math.floor(Math.random()*20);money+=earned;document.getElementById('homeMessage').textContent='💼 Worked! Earned ✦'+earned+' (❤️ -5)';if(Math.random()<0.05&&!sick){sick=true;document.getElementById('homeMessage').textContent='🤒 You got sick! Go to the doctor.';}updateUI();saveGame();}
function rest(){health=Math.min(100,health+15);document.getElementById('homeMessage').textContent='😴 Rested! +15 health';updateUI();saveGame();}
function goDoctor(){if(!sick&&health>=80){document.getElementById('homeMessage').textContent='💚 You are healthy!';return;}if(money<50){document.getElementById('homeMessage').textContent='❌ Doctor costs ✦50!';return;}money-=50;sick=false;health=Math.min(100,health+30);document.getElementById('homeMessage').textContent='🏥 Visited doctor! +30 health, -✦50';updateUI();saveGame();}
function driveTo(loc){if(!hasCar){document.getElementById('carMessage').textContent='🚗 You need a car!';return;}var name=LOCATIONS[loc];if(!name)return;currentLocation=name;document.getElementById('carMessage').textContent='🚗 Drove to '+name+'!';updateUI();saveGame();}
function renderInventory(){var c=document.getElementById('inventoryItems');c.innerHTML='';if(inventory.length===0&&!hasCar){c.innerHTML='<div style="color:#666;padding:10px;">📭 No items yet.</div>';return;}if(hasCar){var d=document.createElement('div');d.className='shop-item';d.innerHTML='<div><span class="name">🚗 Car</span></div><button class="btn btn-danger" onclick="sellItem(\'car\')">Sell ✦300</button>';c.appendChild(d);}for(var i=0;i<inventory.length;i++){var id=inventory[i];var item=null;for(var j=0;j<SHOP_ITEMS.length;j++){if(SHOP_ITEMS[j].id===id){item=SHOP_ITEMS[j];break;}}if(!item)continue;var price=Math.floor(item.price*0.6);var d2=document.createElement('div');d2.className='shop-item';d2.innerHTML='<div><span class="name">'+item.name+'</span></div><button class="btn btn-danger" onclick="sellItem(\''+id+'\')">Sell ✦'+price+'</button>';c.appendChild(d2);}}
function sellItem(id){if(id==='car'){if(!hasCar)return;money+=300;hasCar=false;document.getElementById('inventoryMessage').textContent='💰 Sold car for ✦300!';}else{var index=inventory.indexOf(id);if(index===-1)return;var item=null;for(var i=0;i<SHOP_ITEMS.length;i++){if(SHOP_ITEMS[i].id===id){item=SHOP_ITEMS[i];break;}}var price=Math.floor(item.price*0.6);money+=price;inventory.splice(index,1);document.getElementById('inventoryMessage').textContent='💰 Sold '+item.name+' for ✦'+price+'!';}updateUI();saveGame();}
function sellAllItems(){if(inventory.length===0&&!hasCar){document.getElementById('inventoryMessage').textContent='📭 Nothing to sell!';return;}var total=0,count=0;if(hasCar){total+=300;hasCar=false;count++;}for(var i=0;i<inventory.length;i++){var id=inventory[i];var item=null;for(var j=0;j<SHOP_ITEMS.length;j++){if(SHOP_ITEMS[j].id===id){item=SHOP_ITEMS[j];break;}}if(item){total+=Math.floor(item.price*0.6);count++;}}inventory=[];money+=total;document.getElementById('inventoryMessage').textContent='💰 Sold '+count+' items for ✦'+total+'!';updateUI();saveGame();}
function resetGame(){if(!confirm('⚠️ Reset all progress?'))return;money=0;health=100;job=null;currentLocation='Home';hasCar=false;inventory=[];sick=false;updateUI();saveGame();document.getElementById('homeMessage').textContent='🔄 Game reset!';}
setInterval(saveGame,10000);
loadGame();updateUI();document.getElementById('homeMessage').textContent='🏠 Welcome to Sims Mini!';
</script>
</body>
</html>
