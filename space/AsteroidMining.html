<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⛏️ Astrio Miner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a26;
            color: #d0e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1a3344;
            color: #4fc3f7;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            font-size: 14px;
        }
        .back-btn:hover { background: #2a4a5e; transform: translateX(-5px); }
        .container { max-width: 500px; width: 100%; text-align: center; margin-top: 60px; }
        h1 { color: #4fc3f7; font-size: 2.5rem; margin-bottom: 4px; }
        .subtitle { color: #7cf5b0; font-size: 0.9rem; margin-bottom: 15px; }

        .stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat-box { background: #1a3344; padding: 8px 16px; border-radius: 10px; min-width: 70px; border: 1px solid #2a4a5e; }
        .stat-box span { color: #4fc3f7; font-weight: bold; font-size: 1.1rem; display: block; }
        .stat-box .label { color: #8899aa; font-size: 0.6rem; text-transform: uppercase; }

        .mine-area {
            background: #0f1f2e;
            border-radius: 20px;
            padding: 20px;
            border: 2px solid #1a3344;
            margin: 10px 0;
            min-height: 280px;
            position: relative;
            overflow: hidden;
        }

        /* Asteroid emoji animations */
        .asteroid-display {
            font-size: 8rem;
            display: block;
            margin: 10px 0;
            animation: floatAsteroid 3s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .asteroid-display:active { transform: scale(0.85); }

        @keyframes floatAsteroid {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .asteroid-display.diamond {
            animation: diamondShine 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0, 255, 200, 0.3));
        }
        @keyframes diamondShine {
            0%, 100% { transform: translateY(0) rotate(-5deg) scale(1); }
            50% { transform: translateY(-15px) rotate(5deg) scale(1.1); filter: drop-shadow(0 0 60px rgba(0, 255, 200, 0.6)); }
        }

        .asteroid-display.gold {
            animation: goldPulse 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.3));
        }
        @keyframes goldPulse {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.3)); }
            50% { transform: translateY(-10px) scale(1.08); filter: drop-shadow(0 0 60px rgba(255, 215, 0, 0.6)); }
        }

        .asteroid-display.crystal {
            animation: crystalGlow 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(100, 200, 255, 0.3));
        }
        @keyframes crystalGlow {
            0%, 100% { transform: translateY(0) rotate(0deg); filter: drop-shadow(0 0 30px rgba(100, 200, 255, 0.3)); }
            50% { transform: translateY(-12px) rotate(10deg); filter: drop-shadow(0 0 60px rgba(100, 200, 255, 0.6)); }
        }

        .mine-info {
            display: flex;
            justify-content: space-around;
            margin: 10px 0;
            font-size: 0.9rem;
            color: #8899aa;
        }
        .mine-info span { color: #ffd93d; font-weight: 700; }

        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            font-family: 'Segoe UI', sans-serif;
        }
        .btn:active { transform: scale(0.95); }
        .btn-mine {
            background: linear-gradient(135deg, #ffd93d, #f5a623);
            color: #0b1a26;
        }
        .btn-mine:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,217,61,0.25); }
        .btn-reset {
            background: #1a3344;
            color: #d0e8f0;
            border: 2px solid #2a4a5e;
        }
        .btn-reset:hover { background: #2a4a5e; border-color: #4fc3f7; }

        .message { font-size: 1.1rem; min-height: 30px; color: #ffd93d; margin: 10px 0; font-weight: 600; }

        .particle-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 999; overflow: hidden;
        }
        .particle {
            position: absolute; font-size: 28px; font-weight: 700;
            animation: floatUp 1.2s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-180px) scale(1.5) rotate(30deg); }
        }

        .settings-panel {
            background: #1a3344;
            border-radius: 16px;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #2a4a5e;
            display: none;
        }
        .settings-panel.open { display: block; }
        .settings-panel h3 { color: #4fc3f7; margin-bottom: 10px; font-size: 1rem; }
        .settings-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .settings-item:last-child { border-bottom: none; }
        .settings-item .label { font-size: 0.9rem; color: #d0e8f0; }
        .settings-toggle {
            width: 44px; height: 24px; background: #2a4a5e; border-radius: 30px;
            cursor: pointer; position: relative; transition: 0.3s;
        }
        .settings-toggle.active { background: #4fc3f7; }
        .settings-toggle .knob {
            width: 18px; height: 18px; background: white; border-radius: 50%;
            position: absolute; top: 3px; left: 3px; transition: 0.3s;
        }
        .settings-toggle.active .knob { left: 23px; }
        .settings-btn-icon {
            background: none; border: none; color: #8899aa; font-size: 1.2rem;
            cursor: pointer; padding: 4px 8px; transition: 0.2s;
        }
        .settings-btn-icon:hover { color: #4fc3f7; transform: rotate(30deg); }

        @media (max-width: 480px) {
            .container { margin-top: 50px; }
            h1 { font-size: 2rem; }
            .asteroid-display { font-size: 6rem; }
            .btn { padding: 10px 18px; font-size: 0.9rem; }
            .stats { gap: 10px; }
            .stat-box { padding: 6px 12px; min-width: 60px; }
            .back-btn { font-size: 12px; padding: 8px 12px; top: 10px; left: 10px; }
        }
    </style>
</head>
<body>

<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

<div class="container">
    <h1><i class="fas fa-pickaxe" style="color:#ffd93d;"></i> Astrio Miner</h1>
    <p class="subtitle">⛏️ Mine asteroids for resources!</p>

    <div class="stats">
        <div class="stat-box"><span id="resources">0</span><span class="label">💰 Resources</span></div>
        <div class="stat-box"><span id="mines">0</span><span class="label">⛏️ Mines</span></div>
        <div class="stat-box"><span id="combo">0</span><span class="label">🔥 Combo</span></div>
    </div>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 5px;">
        <button class="settings-btn-icon" id="settingsBtn">⚙️</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <h3>⚙️ Settings</h3>
        <div class="settings-item">
            <span class="label">🔊 Sound Effects</span>
            <div class="settings-toggle active" id="soundToggle"><div class="knob"></div></div>
        </div>
        <div class="settings-item">
            <span class="label">✨ Particles</span>
            <div class="settings-toggle active" id="particleToggle"><div class="knob"></div></div>
        </div>
    </div>

    <div class="mine-area">
        <span class="asteroid-display" id="asteroidEmoji">☄️</span>
        <div class="mine-info">
            <span>💎 <span id="mineValue">1-10</span> resources</span>
            <span>⚡ <span id="minePower">1x</span> power</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-mine" id="mineBtn">⛏️ Mine!</button>
        <button class="btn btn-reset" id="resetBtn">🔄 Reset</button>
    </div>

    <div class="message" id="message">☄️ Mine asteroids for resources!</div>
</div>

<div class="particle-container" id="particleContainer"></div>

<script>
// ============================================================
// SOUND SYSTEM
// ============================================================
let soundEnabled = true;
let particleEnabled = true;
let audioCtx = null;
let audioUnlocked = false;

function unlockAudio() {
    if (audioUnlocked) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        audioUnlocked = true;
    } catch(e) {}
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);

function getAudioCtx() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playTone(freq, dur = 150) {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur / 1000);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur / 1000);
    } catch(e) {}
}

function playClick() { playTone(600, 80); }
function playWin() { playTone(523, 150); setTimeout(() => playTone(659, 150), 150); }
function playLevelUp() { playTone(440, 100); setTimeout(() => playTone(523, 100), 100); }

// ============================================================
// PARTICLES
// ============================================================
function spawnParticle(x, y, text, color = '#ffd700') {
    if (!particleEnabled) return;
    const container = document.getElementById('particleContainer');
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    container.appendChild(el);
    setTimeout(() => el.remove(), 1200);
}

function spawnMineParticles(x, y) {
    const emojis = ['💎', '✨', '⭐', '💫', '🔮', '🌟'];
    const colors = ['#ffd700', '#ff6b6b', '#7cf5b0', '#4fc3f7', '#ff9f43', '#a29bfe'];
    for (let i = 0; i < 8; i++) {
        setTimeout(() => {
            spawnParticle(
                x + (Math.random() - 0.5) * 100,
                y + (Math.random() - 0.5) * 100 - 20,
                emojis[Math.floor(Math.random() * emojis.length)],
                colors[Math.floor(Math.random() * colors.length)]
            );
        }, i * 50);
    }
}

// ============================================================
// GAME LOGIC
// ============================================================
let resources = 0;
let mines = 0;
let combo = 0;
let asteroidTypes = [
    { emoji: '☄️', name: 'Asteroid', min: 1, max: 5, color: '#8899aa' },
    { emoji: '🪨', name: 'Rock', min: 3, max: 8, color: '#bbaa88' },
    { emoji: '💎', name: 'Diamond', min: 10, max: 25, color: '#7cf5b0' },
    { emoji: '🌟', name: 'Star Fragment', min: 5, max: 15, color: '#ffd93d' },
    { emoji: '🔮', name: 'Crystal', min: 8, max: 20, color: '#4fc3f7' },
    { emoji: '✨', name: 'Stardust', min: 15, max: 30, color: '#a29bfe' },
    { emoji: '💫', name: 'Cosmic Gem', min: 20, max: 50, color: '#ff9f43' },
    { emoji: '⭐', name: 'Star Core', min: 30, max: 60, color: '#ffd700' }
];

let currentAsteroid = asteroidTypes[0];

function updateUI() {
    document.getElementById('resources').textContent = resources;
    document.getElementById('mines').textContent = mines;
    document.getElementById('combo').textContent = combo;
}

function newAsteroid() {
    // Weighted random - rarer asteroids appear less often
    let weights = [35, 25, 10, 15, 12, 8, 5, 3];
    let totalWeight = weights.reduce((a, b) => a + b, 0);
    let random = Math.random() * totalWeight;
    let idx = 0;
    while (random > weights[idx]) {
        random -= weights[idx];
        idx++;
    }
    currentAsteroid = asteroidTypes[idx];
    
    const emoji = document.getElementById('asteroidEmoji');
    emoji.textContent = currentAsteroid.emoji;
    emoji.className = 'asteroid-display';
    if (currentAsteroid.emoji === '💎') emoji.classList.add('diamond');
    else if (currentAsteroid.emoji === '🌟' || currentAsteroid.emoji === '⭐') emoji.classList.add('gold');
    else if (currentAsteroid.emoji === '🔮' || currentAsteroid.emoji === '💫') emoji.classList.add('crystal');
    
    document.getElementById('mineValue').textContent = currentAsteroid.min + '-' + currentAsteroid.max;
    document.getElementById('minePower').textContent = (1 + Math.floor(combo / 5)) + 'x';
}

function mine() {
    const amount = Math.floor(Math.random() * (currentAsteroid.max - currentAsteroid.min + 1)) + currentAsteroid.min;
    const comboBonus = 1 + Math.floor(combo / 5);
    const totalAmount = amount * comboBonus;
    
    resources += totalAmount;
    mines++;
    combo++;
    
    // Effects
    const btn = document.getElementById('mineBtn');
    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    spawnMineParticles(cx, cy);
    playClick();
    
    document.getElementById('message').textContent = `⛏️ Mined ${totalAmount} ${currentAsteroid.name} resources! (${amount} × ${comboBonus}x combo)`;
    
    if (combo >= 10) document.getElementById('message').textContent = '🔥 COMBO x' + combo + '! Amazing!';
    else if (combo >= 5) document.getElementById('message').textContent = '⚡ Combo x' + combo + '! Keep going!';
    
    updateUI();
    newAsteroid();
}

function resetGame() {
    if (!confirm('Reset all progress?')) return;
    resources = 0;
    mines = 0;
    combo = 0;
    updateUI();
    newAsteroid();
    document.getElementById('message').textContent = '🔄 Reset! Start mining again!';
    playClick();
}

// ============================================================
// SETTINGS
// ============================================================
document.getElementById('settingsBtn').addEventListener('click', function() {
    document.getElementById('settingsPanel').classList.toggle('open');
});

document.querySelectorAll('.settings-toggle').forEach(toggle => {
    toggle.addEventListener('click', function() {
        this.classList.toggle('active');
        const id = this.id;
        if (id === 'soundToggle') soundEnabled = this.classList.contains('active');
        if (id === 'particleToggle') particleEnabled = this.classList.contains('active');
    });
});

// ============================================================
// EVENT LISTENERS
// ============================================================
document.getElementById('mineBtn').addEventListener('click', mine);
document.getElementById('resetBtn').addEventListener('click', resetGame);

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        mine();
    }
    if (e.key === 'r' || e.key === 'R') resetGame();
});

// Click asteroid to mine too
document.getElementById('asteroidEmoji').addEventListener('click', mine);

// ============================================================
// INIT
// ============================================================
newAsteroid();
updateUI();
document.getElementById('message').textContent = '☄️ Click the asteroid or press Space to mine!';
console.log('⛏️ Astrio Miner loaded!');
console.log('⌨️ Space=Mine  R=Reset');
</script>
</body>
</html>
