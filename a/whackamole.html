<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔨 Whack-A-Mole</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;margin:15px auto;}
.hole{aspect-ratio:1;background:#1a3344;border-radius:50%;border:4px solid #2a4a5e;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:3rem;transition:0.15s;touch-action:manipulation;}
.hole.active{background:#2a4a5e;border-color:#4fc3f7;transform:scale(1.05);}
.hole.mole{background:#4a2a1a;border-color:#ff6b6b;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-hammer" style="color:#ff6b6b;"></i> Whack-A-Mole</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="time">30</span><span class="label">Time</span></div>
        <div class="stat-box"><span id="highScore">0</span><span class="label">Best</span></div>
    </div>
    <div class="message" id="message">🎯 Click Start to play!</div>
    <div class="grid" id="grid"></div>
    <button class="btn" id="startBtn">▶ Start Game</button>
</div>
<script>
// Save system
function updateGameProgress(gameId){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.games)s.games={};if(!s.games[gameId])s.games[gameId]={played:false,xp:0};var g=s.games[gameId];if(!g.played){g.played=true;s.gamesPlayed=(s.gamesPlayed||0)+1;}g.xp=(g.xp||0)+1;var t=0,p=0;Object.values(s.games).forEach(function(x){t+=(x.xp||0);if(x.played)p++;});s.totalXp=t;s.gamesPlayed=p;localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

const GAME_ID='whackamole';
let score=0,timeLeft=30,highScore=parseInt(localStorage.getItem('whackHigh'))||0;
let gameActive=false,moleInterval=null,timerInterval=null;
let holes=[];

function initGrid(){
    const grid=document.getElementById('grid');
    grid.innerHTML='';
    holes=[];
    for(let i=0;i<9;i++){
        const div=document.createElement('div');
        div.className='hole';
        div.dataset.index=i;
        div.addEventListener('click',()=>whack(i));
        grid.appendChild(div);
        holes.push(div);
    }
}

function whack(index){
    if(!gameActive)return;
    const hole=holes[index];
    if(hole.classList.contains('mole')){
        score++;
        hole.classList.remove('mole');
        hole.textContent='';
        document.getElementById('score').textContent=score;
        // Particle effect
        const rect=hole.getBoundingClientRect();
        const el=document.createElement('div');
        el.textContent='💥';
        el.style.position='fixed';
        el.style.left=(rect.left+rect.width/2-20)+'px';
        el.style.top=(rect.top-20)+'px';
        el.style.fontSize='40px';
        el.style.pointerEvents='none';
        el.style.zIndex='999';
        el.style.animation='floatUp 0.8s ease-out forwards';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),800);
    }
}

function spawnMole(){
    if(!gameActive)return;
    // Clear all moles
    holes.forEach(h=>{h.classList.remove('mole');h.textContent='';});
    // Spawn random mole
    const idx=Math.floor(Math.random()*9);
    holes[idx].classList.add('mole');
    holes[idx].textContent='🐹';
}

function startGame(){
    if(gameActive)return;
    updateGameProgress(GAME_ID);
    score=0;timeLeft=30;
    document.getElementById('score').textContent=0;
    document.getElementById('time').textContent=30;
    document.getElementById('message').textContent='⚡ GO!';
    document.getElementById('startBtn').textContent='⏳ Playing...';
    gameActive=true;
    // Clear old moles
    holes.forEach(h=>{h.classList.remove('mole');h.textContent='';});
    // Start timer
    timerInterval=setInterval(()=>{
        timeLeft--;
        document.getElementById('time').textContent=timeLeft;
        if(timeLeft<=0){
            endGame();
        }
    },1000);
    // Spawn moles
    spawnMole();
    moleInterval=setInterval(spawnMole,800);
}

function endGame(){
    gameActive=false;
    clearInterval(timerInterval);
    clearInterval(moleInterval);
    holes.forEach(h=>{h.classList.remove('mole');h.textContent='';});
    if(score>highScore){highScore=score;localStorage.setItem('whackHigh',highScore);}
    document.getElementById('highScore').textContent=highScore;
    document.getElementById('message').textContent='🎉 Game Over! Score: '+score;
    document.getElementById('startBtn').textContent='▶ Play Again';
    // Save progress
    saveGameState(GAME_ID,{score:score,highScore:highScore});
}

function saveGameState(gameId,data){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.gameStates)s.gameStates={};s.gameStates[gameId]={data:data};localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

document.getElementById('startBtn').addEventListener('click',startGame);
document.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' ')startGame();});

// Add CSS animation
const style=document.createElement('style');
style.textContent='@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(0.5)}100%{opacity:0;transform:translateY(-100px) scale(1.5)}}';
document.head.appendChild(style);

initGrid();
document.getElementById('highScore').textContent=highScore;
document.getElementById('message').textContent='🎯 Click Start to play!';
</script>
</body>
</html>
