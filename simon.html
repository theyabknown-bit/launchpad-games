<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Simon Says</title>
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#0b1a26;font-family:Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}.game-box{background:rgba(18,28,40,0.95);border-radius:2.5rem;padding:2rem;border:1px solid rgba(100,200,255,0.12);max-width:500px;width:100%;text-align:center;}.back{display:inline-block;margin-bottom:1rem;color:#b6ddf5;text-decoration:none;background:#1c4055;padding:0.3rem 1.2rem;border-radius:40px;border:1px solid #3a6b88;}.back:hover{background:#2a5a78;}h1{color:white;font-size:2rem;margin-bottom:0.5rem;}h1 i{color:#ffd93d;}.simon-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;max-width:300px;margin:1rem auto;}.simon-btn{aspect-ratio:1;border-radius:1.5rem;border:3px solid #2a4a5a;cursor:pointer;transition:0.1s;}.simon-btn:active{transform:scale(0.95);}.simon-btn.green{background:#1a4a3a;}.simon-btn.green.active{background:#7cf5b0;box-shadow:0 0 40px rgba(124,245,176,0.5);}.simon-btn.red{background:#4a1a1a;}.simon-btn.red.active{background:#ff7a7a;box-shadow:0 0 40px rgba(255,122,122,0.5);}.simon-btn.yellow{background:#4a3a1a;}.simon-btn.yellow.active{background:#ffd93d;box-shadow:0 0 40px rgba(255,217,61,0.5);}.simon-btn.blue{background:#1a2a4a;}.simon-btn.blue.active{background:#4a8bc2;box-shadow:0 0 40px rgba(74,139,194,0.5);}.stats{display:flex;justify-content:space-between;color:#9bbfd9;margin-top:0.5rem;flex-wrap:wrap;gap:0.5rem;}.btn{background:#1a3a5a;border:1px solid #2a5a7a;padding:0.5rem 1.5rem;border-radius:40px;color:white;cursor:pointer;transition:0.15s;}.btn:hover{background:#2a5a7a;}.message{margin-top:0.5rem;padding:0.6rem;border-radius:1rem;background:#0f172a;color:#b0d4f0;min-height:40px;border-left:4px solid #7fc9ff;}
</style></head>
<body>
<div class="game-box">
<a href="../base.html" class="back"><i class="fas fa-arrow-left"></i> back</a>
<h1><i class="fas fa-lightbulb"></i> Simon Says</h1>
<div class="simon-grid">
<div class="simon-btn green" id="green"></div>
<div class="simon-btn red" id="red"></div>
<div class="simon-btn yellow" id="yellow"></div>
<div class="simon-btn blue" id="blue"></div>
</div>
<div class="stats"><span>Score: <span id="score">0</span></span><span>Best: <span id="best">0</span></span></div>
<button class="btn" onclick="resetGame()"><i class="fas fa-rotate"></i> restart</button>
<div class="message" id="msg"><i class="fas fa-info-circle"></i> Watch the pattern and repeat it!</div>
</div>
<script>
const COLORS=['green','red','yellow','blue'];let sequence=[],playerSequence=[],score=0,best=0,isPlaying=false,isPlayerTurn=false;const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');const buttons={green:document.getElementById('green'),red:document.getElementById('red'),yellow:document.getElementById('yellow'),blue:document.getElementById('blue')};
function resetGame(){sequence=[];playerSequence=[];score=0;isPlaying=false;isPlayerTurn=false;best=parseInt(localStorage.getItem('simon_best')||'0');bestEl.textContent=best;scoreEl.textContent=0;msg.innerHTML='<i class="fas fa-info-circle"></i> Watch the pattern!';setTimeout(startRound,500);}
function startRound(){isPlaying=true;isPlayerTurn=false;const next=COLORS[Math.floor(Math.random()*4)];sequence.push(next);playSequence();}
function playSequence(){let i=0;const interval=setInterval(()=>{if(i>=sequence.length){clearInterval(interval);isPlayerTurn=true;msg.innerHTML='<i class="fas fa-info-circle"></i> Your turn! Repeat the pattern';return;}lightUp(sequence[i]);i++;},600);}
function lightUp(color){buttons[color].classList.add('active');setTimeout(()=>buttons[color].classList.remove('active'),300);}
function handleClick(color){if(!isPlayerTurn||isPlaying)return;playerSequence.push(color);lightUp(color);if(playerSequence[playerSequence.length-1]!==sequence[playerSequence.length-1]){msg.innerHTML='<i class="fas fa-times-circle" style="color:#ff7a7a;"></i> ❌ Game Over! Score: '+score;isPlaying=false;if(score>best){best=score;localStorage.setItem('simon_best',String(best));bestEl.textContent=best;}return;}if(playerSequence.length===sequence.length){score++;scoreEl.textContent=score;playerSequence=[];msg.innerHTML='<i class="fas fa-check-circle" style="color:#7cf5b0;"></i> ✅ Correct! Score: '+score;setTimeout(startRound,800);}}
Object.keys(buttons).forEach(color=>{buttons[color].addEventListener('click',()=>handleClick(color));});
resetGame();
</script>
</body>
</html>
