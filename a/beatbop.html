<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Beat Bop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1a26;color:#d0e8f0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;flex-direction:column;}
.back-btn{position:fixed;top:20px;left:20px;background:#1a3344;color:#4fc3f7;padding:12px 20px;border-radius:8px;text-decoration:none;}
.back-btn:hover{background:#2a4a5e;transform:translateX(-5px);}
.container{max-width:500px;width:100%;text-align:center;}
h1{color:#4fc3f7;margin-bottom:10px;}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.stat-box{background:#1a3344;padding:10px 20px;border-radius:10px;min-width:80px;}
.stat-box span{color:#4fc3f7;font-weight:bold;font-size:1.2rem;display:block;}
.stat-box .label{color:#8899aa;font-size:0.7rem;text-transform:uppercase;}
.beat-btn{width:100%;padding:30px;border-radius:12px;border:3px solid #2a4a5e;background:#1a3344;font-size:3rem;cursor:pointer;transition:0.15s;touch-action:manipulation;}
.beat-btn:active{transform:scale(0.95);}
.beat-btn.hit{background:#1a4a3a;border-color:#7cf5b0;}
.beat-btn.miss{background:#3a1a1a;border-color:#ff6b6b;}
.beat-display{font-size:2rem;margin:20px 0;min-height:50px;color:#ffd93d;}
.btn{background:#4fc3f7;color:#0b1a26;border:none;padding:12px 25px;border-radius:8px;font-size:1rem;cursor:pointer;}
.btn:hover{background:#7cf5b0;}
.message{font-size:1.2rem;min-height:30px;color:#ffd93d;margin:10px 0;}
</style>
</head>
<body>
<a href="../base.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
<div class="container">
    <h1><i class="fas fa-music" style="color:#ff6b6b;"></i> Beat Bop</h1>
    <div class="stats">
        <div class="stat-box"><span id="score">0</span><span class="label">Score</span></div>
        <div class="stat-box"><span id="combo">0</span><span class="label">Combo</span></div>
    </div>
    <div class="beat-display" id="beatDisplay">🎵 Tap the beat!</div>
    <button class="beat-btn" id="beatBtn">👆</button>
    <div class="message" id="message">🎯 Tap to the rhythm!</div>
</div>
<script>
    // Game-specific save function - override this in your game
    function saveGame() {
        // For games with their own save system, this will be overridden
        // For games without, it does nothing
        console.log('💾 Save called but no game-specific save implemented');
        return true;
    }
    // ============================================================
    // FIXED SOUND SYSTEM - WORKS ON FIRST CLICK
    // ============================================================
    let soundEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;

    function unlockAudio() {
        if (audioUnlocked) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audioUnlocked = true;
            console.log('🔊 Audio unlocked!');
        } catch(e) { console.log('Audio error:', e); }
    }

    // Unlock audio on any click
    document.addEventListener('click', unlockAudio, { once: false });
    document.addEventListener('touchstart', unlockAudio, { once: false });
    document.addEventListener('keydown', unlockAudio, { once: false });

    function getAudioCtx() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playTone(frequency, duration = 150, type = 'sine') {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration / 1000);
        } catch(e) { console.log('Play error:', e); }
    }

    function playClick() { playTone(600, 80); }
    function playWin() { 
        playTone(523, 150); 
        setTimeout(() => playTone(659, 150), 150); 
        setTimeout(() => playTone(784, 200), 300); 
    }
    function playLose() { 
        playTone(300, 200); 
        setTimeout(() => playTone(200, 300), 200); 
    }
    function playCorrect() { playTone(800, 100); }
    function playWrong() { playTone(250, 200); }
    function playLevelUp() { 
        playTone(440, 100); 
        setTimeout(() => playTone(523, 100), 100); 
        setTimeout(() => playTone(659, 150), 200); 
    }
function updateGameProgress(gameId){try{var s=JSON.parse(localStorage.getItem('launchpad_progress')||'{}');if(!s.games)s.games={};if(!s.games[gameId])s.games[gameId]={played:false,xp:0};var g=s.games[gameId];if(!g.played){g.played=true;s.gamesPlayed=(s.gamesPlayed||0)+1;}g.xp=(g.xp||0)+1;var t=0,p=0;Object.values(s.games).forEach(function(x){t+=(x.xp||0);if(x.played)p++;});s.totalXp=t;s.gamesPlayed=p;localStorage.setItem('launchpad_progress',JSON.stringify(s));}catch(e){}}

let score=0,combo=0,beats=0,lastBeat=0;
const beatBtn=document.getElementById('beatBtn');
const scoreDisplay=document.getElementById('score'),comboDisplay=document.getElementById('combo');
const beatDisplay=document.getElementById('beatDisplay'),msg=document.getElementById('message');

function playTone(freq,dur=150){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.value=0.15;gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur/1000);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+dur/1000);}catch(e){}}

function hitBeat(){
    const now=Date.now();
    const diff=now-lastBeat;
    const hit=true;
    if(hit){
        combo++;
        score+=combo*2;
        playTone(440+combo*20);
        beatBtn.classList.add('hit');
        setTimeout(()=>beatBtn.classList.remove('hit'),200);
        beatDisplay.textContent='💥 BOOM!';
        msg.textContent='🔥 Combo x'+combo;
    }
    if(combo>50){
        beatDisplay.textContent='🌈 GODLIKE!';
    }else if(combo>30){
        beatDisplay.textContent='⚡ AMAZING!';
    }else if(combo>15){
        beatDisplay.textContent='🌟 GREAT!';
    }else if(combo>5){
        beatDisplay.textContent='👍 GOOD!';
    }
    scoreDisplay.textContent=score;
    comboDisplay.textContent=combo;
    lastBeat=now;
    updateGameProgress('beatbop');
}

beatBtn.addEventListener('click',hitBeat);
document.addEventListener('keydown',(e)=>{if(e.key===' '||e.key==='Space'){e.preventDefault();hitBeat();}});
msg.textContent='🎯 Tap to the rhythm!';
    // ============================================================
    // ACHIEVEMENT POPUP SYSTEM - WORKS EVERYWHERE
    // ============================================================
    
    // Check achievements and show popup
    function checkAchievements() {
        try {
            const progress = JSON.parse(localStorage.getItem('launchpad_progress') || '{"games":{},"totalXp":0,"gamesPlayed":0}');
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            let newAchievements = [];

            // First game
            if (progress.gamesPlayed >= 1 && !unlocked.includes('first_game')) {
                newAchievements.push('first_game');
                showAchievementPopup('🎮', 'First Game!', 'Played your first game!');
            }

            // Game master (10 games)
            if (progress.gamesPlayed >= 10 && !unlocked.includes('game_master')) {
                newAchievements.push('game_master');
                showAchievementPopup('👑', 'Game Master!', 'Played 10 games!');
            }

            // XP collector
            if (progress.totalXp >= 100 && !unlocked.includes('xp_collector')) {
                newAchievements.push('xp_collector');
                showAchievementPopup('⭐', 'XP Collector!', 'Earned 100 XP!');
            }

            // Level up
            const level = Math.floor((progress.totalXp || 0) / 100) + 1;
            if (level >= 5 && !unlocked.includes('level_up')) {
                newAchievements.push('level_up');
                showAchievementPopup('🏅', 'Level Up!', 'Reached Level 5!');
            }

            // Save new achievements
            if (newAchievements.length > 0) {
                const all = [...unlocked, ...newAchievements];
                localStorage.setItem('launchpad_achievements', JSON.stringify(all));
                updateAchievementCount();
            }

            return newAchievements;
        } catch(e) { return []; }
    }

    // Show achievement popup
    function showAchievementPopup(emoji, title, desc) {
        try { playAchievement(); } catch(e) {}
        // Check if popup already exists
        let popup = document.getElementById('achievementPopupGlobal');
        if (!popup) {
            popup = document.createElement('div');
            popup.id = 'achievementPopupGlobal';
            popup.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(18, 16, 30, 0.96);
                backdrop-filter: blur(20px);
                border: 2px solid #7cf5b0;
                border-radius: 16px;
                padding: 16px 24px;
                max-width: 350px;
                z-index: 99999;
                box-shadow: 0 20px 60px rgba(0,0,0,0.6);
                display: none;
                animation: slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
                color: #d0e8f0;
                font-family: 'Segoe UI', Roboto, sans-serif;
            `;
            document.body.appendChild(popup);
            
            // Add animation styles
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideInRight {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes slideOutRight {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
                @keyframes pulseGold {
                    0%, 100% { box-shadow: 0 0 20px rgba(124, 245, 176, 0.1); }
                    50% { box-shadow: 0 0 40px rgba(124, 245, 176, 0.3); }
                }
            `;
            document.head.appendChild(style);
        }

        // Fill popup content
        popup.innerHTML = `
            <div style="display:flex;align-items:center;gap:14px;">
                <div style="font-size:2.8rem;line-height:1;">${emoji}</div>
                <div>
                    <div style="color:#7cf5b0;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;">🏆 Achievement Unlocked!</div>
                    <div style="color:#f0f8ff;font-weight:700;font-size:1.1rem;">${title}</div>
                    <div style="color:#8899aa;font-size:0.85rem;">${desc}</div>
                </div>
            </div>
            <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end;">
                <button onclick="document.getElementById('achievementPopupGlobal').style.display='none'" style="
                    background:rgba(255,255,255,0.05);
                    border:1px solid rgba(255,255,255,0.1);
                    color:#8899aa;
                    padding:4px 14px;
                    border-radius:20px;
                    cursor:pointer;
                    font-size:0.7rem;
                    font-family:'Segoe UI',sans-serif;
                ">Dismiss</button>
            </div>
        `;

        // Show popup
        popup.style.display = 'block';
        popup.style.animation = 'slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';

        // Auto-hide after 6 seconds
        clearTimeout(popup._timeout);
        popup._timeout = setTimeout(() => {
            popup.style.animation = 'slideOutRight 0.4s ease-in';
            setTimeout(() => {
                popup.style.display = 'none';
                popup.style.animation = '';
            }, 400);
        }, 6000);

        // Play sound
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [523, 659, 784, 1047].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }, i * 120);
            });
        } catch(e) {}
    }

    // Update achievement count in stats
    function updateAchievementCount() {
        try {
            const unlocked = JSON.parse(localStorage.getItem('launchpad_achievements') || '[]');
            const countEl = document.getElementById('achievementCount');
            if (countEl) countEl.textContent = unlocked.length;
        } catch(e) {}
    }

    // Check achievements every 10 seconds
    setInterval(checkAchievements, 10000);

    // Also check on page load
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(checkAchievements, 1000);
    });

    // Check when progress updates
    const origSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        origSetItem.apply(this, arguments);
        if (key === 'launchpad_progress') {
            setTimeout(checkAchievements, 500);
        }
    };
    // ============================================================
    // UNIVERSAL SAVE SYSTEM - Auto & Manual Save
    // ============================================================
    
    // Save system variables
    let saveEnabled = true;
    let saveInterval = null;
    let lastSaveTime = 'Never';
    
    // ============================================================
    // SAVE FUNCTIONS
    // ============================================================
    function saveGameData(gameId, data) {
        try {
            const saves = JSON.parse(localStorage.getItem('gameSaves') || '{}');
            saves[gameId] = {
                data: data,
                timestamp: Date.now()
            };
            localStorage.setItem('gameSaves', JSON.stringify(saves));
            showSaveFeedback('✅ Saved!');
            return true;
        } catch(e) {
            console.log('Save error:', e);
            return false;
        }
    }
    
    function loadGameData(gameId) {
        try {
            const saves = JSON.parse(localStorage.getItem('gameSaves') || '{}');
            if (saves[gameId]) {
                return saves[gameId].data;
            }
        } catch(e) {
            console.log('Load error:', e);
        }
        return null;
    }
    
    function showSaveFeedback(message) {
        let indicator = document.getElementById('saveIndicator');
        if (!indicator) {
            indicator = document.createElement('div');
            indicator.id = 'saveIndicator';
            indicator.style.cssText = `
                text-align: center;
                font-size: 11px;
                color: #666;
                padding: 6px 0;
                margin-top: 8px;
                border-top: 1px solid rgba(255,255,255,0.05);
                transition: color 0.3s;
                font-family: 'Segoe UI', sans-serif;
            `;
            const container = document.querySelector('.container') || document.querySelector('#app') || document.body;
            container.appendChild(indicator);
        }
        
        indicator.textContent = '💾 ' + message;
        indicator.style.color = '#7cf5b0';
        setTimeout(() => {
            indicator.style.color = '#666';
            const now = new Date();
            indicator.textContent = '💾 Auto-saved at ' + now.toLocaleTimeString();
        }, 2000);
    }
    
    function manualSave() {
        if (typeof saveGame === 'function') {
            saveGame();
            showSaveFeedback('✅ Manually saved!');
            return true;
        }
        return false;
    }
    
    // ============================================================
    // AUTO-SAVE
    // ============================================================
    function startAutoSave(interval = 5000) {
        if (saveInterval) clearInterval(saveInterval);
        
        saveInterval = setInterval(() => {
            if (typeof saveGame === 'function') {
                saveGame();
            }
        }, interval);
        
        console.log('💾 Auto-save started (every ' + (interval/1000) + 's)');
    }
    
    // ============================================================
    // KEYBOARD SHORTCUT - Ctrl+S
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            if (typeof manualSave === 'function') {
                manualSave();
            }
        }
    });
    
    // ============================================================
    // SAVE ON PAGE CLOSE
    // ============================================================
    window.addEventListener('beforeunload', function() {
        if (typeof saveGame === 'function') {
            saveGame();
        }
    });
    
    // ============================================================
    // SAVE INDICATOR STYLES
    // ============================================================
    const saveStyles = document.createElement('style');
    saveStyles.textContent = `
        #saveIndicator {
            text-align: center;
            font-size: 11px;
            color: #666;
            padding: 6px 0;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
            transition: color 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }
        #saveIndicator.saving {
            color: #7cf5b0 !important;
        }
        .save-btn {
            background: rgba(79,195,247,0.08);
            border: 1px solid rgba(79,195,247,0.12);
            color: #4fc3f7;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
            margin: 2px;
        }
        .save-btn:hover {
            background: rgba(79,195,247,0.15);
        }
    `;
    document.head.appendChild(saveStyles);
    
    // ============================================================
    // ADD MANUAL SAVE BUTTON
    // ============================================================
    function addSaveButton() {
        const container = document.querySelector('.container') || document.querySelector('#app');
        if (!container) return;
        
        // Check if button already exists
        if (document.getElementById('manualSaveBtn')) return;
        
        const btn = document.createElement('button');
        btn.id = 'manualSaveBtn';
        btn.className = 'save-btn';
        btn.textContent = '💾 Manual Save';
        btn.onclick = function() {
            if (typeof manualSave === 'function') {
                manualSave();
            }
        };
        
        // Find footer or add at bottom
        const footer = container.querySelector('.footer');
        if (footer) {
            const btnContainer = document.createElement('div');
            btnContainer.style.cssText = 'margin-top: 6px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;';
            btnContainer.appendChild(btn);
            footer.appendChild(btnContainer);
        } else {
            container.appendChild(btn);
        }
    }
    
    // ============================================================
    // INIT
    // ============================================================
    console.log('💾 Save system loaded!');
    console.log('⌨️  Press Ctrl+S to save manually');
    console.log('💾 Auto-save every 5 seconds');
    
    // Add save button when page loads
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(addSaveButton, 500);
        if (typeof startAutoSave === 'function') {
            startAutoSave(5000);
        }
    });
    
    // Also run immediately if DOM already loaded
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(addSaveButton, 500);
        if (typeof startAutoSave === 'function') {
            startAutoSave(5000);
        }
    }
</script>
</body>
</html>
